default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'PYTHONPATH=src .venv/bin/python -m pytest tests/ -q --tb=short'
        language: system
        pass_filenames: false
        stages: [pre-commit]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]
  - repo: https://github.com/crate-ci/typos
    rev: v1.19.0
    hooks:
      - id: typos
        stages: [pre-commit]
        # pre-commit passes staged paths explicitly, and typos checks those even
        # when they match an exclude. --force-exclude makes the _typos.toml
        # [files] excludes apply to them too.
        args: [--force-exclude]
      - id: typos
        name: commit-msg-typos
        stages: [commit-msg]