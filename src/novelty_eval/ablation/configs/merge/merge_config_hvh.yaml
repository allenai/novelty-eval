output_dir: output/ablation_sweeps/merge_hvh_all_metrics


tracks:
  - pairwise-hvh
  - pointwise-hvh




# Ablations to exclude from all reports and heatmaps.
# Use the canonical name from ablations.yaml (track prefix is stripped automatically).
#skip_ablations:
#  - c2a
#  - c2b

# Judge models to exclude from all reports, heatmaps, and artifact dirs.
# Use the exact model name as it appears in the artifact directory metadata.
#exclude_models:
#  - gpt-5.2
#  - gpt-5.4
#  - claude-sonnet-4-5

# Metrics to show in tables and heatmaps, per setup.
# If a setup key is absent, all its default metrics are shown.
# pairwise keys : pairwise_accuracy, pairwise_accuracy_strict, pairwise_accuracy_no_ties, n_ties, support, cost_usd
# pointwise keys: accuracy, f1_macro, f1_pos, f1_neg, precision_pos, precision_neg, recall_pos, recall_neg, support, cost_usd
metrics:
  pairwise:
    - pairwise_accuracy
    - pairwise_accuracy_strict
  pointwise:
    - f1_macro
    - f1_pos
    - f1_neg
    - precision_pos
    - precision_neg
    - recall_pos
    - recall_neg

# Ablations to group into one unified side-by-side chart per setup.
# Produces unified_charts/unified_pairwise.png and unified_charts/unified_pointwise.png
# (plus *_filtered variants when a blocklist is active).
# Panels appear in the order listed here; ablations absent from the data are skipped.
#
# Each entry is either:
#   - a plain string  (uses the description from ablations.yaml as the panel title)
#   - a {name, title} dict  (overrides the panel title with the given string)
#
# Example:
#   unified_chart:
#     - vague_criterion                     # title from ablations.yaml
#     - name: retrieval
#       title: "No Retrieval"              # custom panel title
#     - low_judge_reasoning
unified_chart:
  - name: vague_criterion
    title: "P1 · unguarded novelty criteria"
  - name: no_criteria_prompt
    title: "P2 · No novelty criteria"
  - name: ai_researcher_base
    title: "P3 · Minimal"
  - name: ai_researcher_no_review
    title: "P4 · Minimal, no reviewer cue"
  - name: ai_researcher_comparative
    title: 'P5 · Minimal, "more novel" framing'
  - name: retrieval
    title: "Retrieval"
  - name: low_judge_reasoning
    title: "Reasoning Effort = Low"
  - name: mec_k_1
    title: "One sample per direction"
  - name: convert_to_plan_form_pairwise_human
    title: "Idea Format"
  - name: convert_to_plan_form_pointwise_human
    title: "Idea Format"