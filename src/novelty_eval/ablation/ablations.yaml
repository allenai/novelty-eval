      retrieve_related_work: true
      retrieval_cache_file: "output/iclr_test_instances/ablation/combined_retrieval/gpt_5.1_backbone/pointwise/retrieval_cache.json"



  gpt_5.4_backbone_retrieval_pairwise_vanilla:
