    0: '**purpose**: Jointly identify emotion clauses and their corresponding cause clauses as emotion-cause pairs, addressing limitations of existing approaches that either rely on complex discriminative architectures or generic text-to-text frameworks. These existing paradigms overlook rich semantic dependencies such as clause roles, emotion types, and clue words, and struggle in multi-pair scenarios involving nested or overlapping structures.

      **mechanism**: A task-adaptive generative multi-task learning framework that reformulates Emotion Cause Pair Extraction as a structured text-to-text generation task. Semantics-structured output formats explicitly encode clause roles, emotion types, and trigger words as semantic markers, enabling the model to capture inter-label dependencies and co-occurrence patterns during generation. For emotion clause extraction, outputs are formatted as triplets of clause, emotion type, and trigger words. For emotion-cause pair extraction, emotion–cause pairs are directly generated, enabling implicit modeling of emotional reasoning. A shared encoder with task-specific decoders supports both clause-level and pair-level generation within a unified pipeline. A Clause Prediction Alignment strategy grounds generated clauses to input spans, mitigating hallucinations and ensuring faithfulness to the source text.

      '
    1: '**purpose**: Address the underexplored problem of egocentric video generation by introducing the task of joint egocentric video and human motion generation. The core challenges include viewpoint alignment, where the camera trajectory in the generated video must match the head trajectory derived from human motion, and causal interplay, where synthesized human motion must causally correspond to the visual dynamics across adjacent video frames.

      **mechanism**: A joint video-motion generation framework called EgoTwin, built on the diffusion transformer architecture. It introduces a head-centric motion representation that anchors human motion to the head joint, ensuring alignment between camera trajectory and body movement. A cybernetics-inspired interaction mechanism explicitly captures the causal interplay between video and motion within attention operations. For evaluation, a large-scale real-world dataset of synchronized text-video-motion triplets is curated, and novel metrics are designed to assess video-motion consistency.

      '
