      '
    1: '**purpose**: Overcome the limitation of purely autoregressive training in generative recommendation systems, which predicts only the next item while ignoring long-term dependencies in user interaction histories and failing to capture underlying user intent.

      **mechanism**: A training framework called Masked History Learning (MHL) that augments the autoregressive objective with an auxiliary task of reconstructing masked items from a user''s past behavior sequence, shifting the learning goal from next-step prediction to deep comprehension of interaction history. Two key components enhance the framework: an entropy-guided masking policy that selectively targets the most informative historical items for reconstruction, and a curriculum learning scheduler that progressively bridges the gap between bidirectional training and autoregressive inference.

      '
