      **mechanism**: Derive an explicit analytical formula, termed the Residual Expansion Theorem, that formally verifies the ensemble perspective of residual networks by proving that increasing network depth is mathematically equivalent to expanding an implicit ensemble. This expansion reveals a hierarchical ensemble structure in which the combinatorial growth of computation paths causes an explosion in the output signal. The theorem demonstrates that scaling each residual module provides a principled method to tame this combinatorial explosion, and further shows that such scaling implicitly regularizes model complexity by diminishing the influence of higher-order terms in the expansion.

      '
    1: '**purpose**: Understanding the inherent low-dimensional structure of large language models at a model-agnostic level, treating them as sequential probabilistic models, and leveraging this structure for generation and provable learning.

      **mechanism**: Empirically demonstrating that matrices constructed from language model logits across varying prompts and responses exhibit low approximate rank. Exploiting this low-rank structure to generate responses to target prompts using linear combinations of model outputs on unrelated or nonsensical prompts. On the theoretical side, formulating the approximate rank of language models as a simple universal abstraction whose predictions align with experimental observations, then analyzing the representation power of this abstraction and establishing provable learning guarantees.

      '
