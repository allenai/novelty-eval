    0: '**purpose**: Addressing the spectral limitations of standard Graph Neural Networks for graph anomaly detection, specifically the problem of spectral washing, where low-pass filtering in GNNs suppresses the high-frequency spectral patterns (spectral shift) characteristic of anomalous nodes. The goal is to preserve and amplify these high-frequency components to improve anomaly detection in applications such as social networks, cybersecurity, and finance.

