    1: '**purpose**: Addressing the limitation of existing prompting methods for Large Language Models that enforce fixed, linear reasoning paths and lack the adaptive strategy selection characteristic of expert human cognition, with the goal of enabling more robust, interpretable, and adaptive reasoning in AI systems.

      **mechanism**: A two-stage prompting framework called Dynamic Cognitive Orchestrator (DCO) that explicitly separates metacognitive planning from execution. In the Planner stage, the LLM analyzes a problem and generates a bespoke, problem-dependent reasoning strategy by selecting from a toolbox of cognitive modules. In the Executor stage, the model systematically follows its self-generated plan to derive a solution. This framework models the brain''s executive functions, prioritizing cognitive flexibility over rigid procedural adherence. Analysis of generated plans reveals that dynamic sequencing of modules drives effectiveness, particularly the selection of domain-appropriate modules such as FormalDeduction for algebra and HeuristicApproach for geometry, compelling LLMs to first reason about how to reason before solving problems.

