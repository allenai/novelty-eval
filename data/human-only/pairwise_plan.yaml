    0: '**purpose**: Investigate the theoretical behavior of generative models when trained on finite populations, addressing how finite training samples affect generation outcomes and formally characterizing underfitting and overfitting specific to generative models.

      **mechanism**: Within the stochastic interpolation generative framework, closed-form expressions are derived for the optimal velocity field and score function given finite training samples. Analysis shows that, under regularity conditions, deterministic generation exactly recovers training samples while stochastic generation produces training samples with added Gaussian noise. Model estimation errors are then incorporated, with formal definitions of underfitting and overfitting introduced for generative models. Theoretical analysis demonstrates that under estimation errors, the stochastic generation process yields convex combinations of training samples corrupted by a mixture of uniform and Gaussian noise.

      '
    1: '**purpose**: Unify three major approaches to diffusion modeling for discrete sequences—discrete-space diffusion, Gaussian diffusion in Euclidean space, and simplex diffusion—into a single theoretical framework. This addresses the current fragmentation where each method has disparate algorithms, theoretical structures, and tradeoffs, and resolves the numerical instability of simplicial diffusion. The goal is to formally connect likelihoods and hyperparameters across methods and enable practitioners to train one model that can perform diffusion in any of the three domains at test time.

      **mechanism**: A unifying theory based on the Wright-Fisher population genetics model, which shows that discrete diffusion, Gaussian diffusion, and simplex diffusion are different parameterizations of the same underlying stochastic process. Simplicial and Gaussian diffusion are derived as two large-population limits of the Wright-Fisher model. The framework leverages decades of mathematical genetics literature to stabilize simplicial diffusion numerically. A single model is trained that can switch between discrete, Gaussian, and simplex diffusion domains during inference, relieving practitioners of choosing among model tradeoffs.

      '
