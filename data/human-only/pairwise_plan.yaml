    0: '**purpose**: Address the non-local tension problem in neural network activation functions, where state-of-the-art self-gated activations that leverage non-local dependencies fail to enhance Transformer layers because fine-grained context is already inherently modeled within those layers, reducing the effectiveness of non-local cues in the activation process. The goal is to develop a more discriminative and generalizable neural activation methodology that works effectively across both conventional CNN layers and Transformer layers.

