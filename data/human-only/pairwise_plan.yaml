    0: '**purpose**: Simplify diffusion-based generative modeling for tasks with inherent symmetry, such as molecular 3D structure generation under SE(3) symmetry, by eliminating the need to learn components corresponding to group actions. This addresses limitations of conventional group-equivariant diffusion models, which impose unnecessary learning complexity, and heuristic alignment strategies, which lack proper samplers with guarantees of recovering the target distribution.

