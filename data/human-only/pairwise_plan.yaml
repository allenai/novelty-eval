  ideas:
    0: '**purpose**: Address the information void problem in standard discrete diffusion models, where all masked tokens are mapped to an uninformative absorbing state, discarding global semantic information that could be inferred from unmasked tokens and passed between denoising steps.

      **mechanism**: Continuously Augmented Discrete Diffusion (CADD) augments the discrete state space by pairing it with a continuous latent diffusion process. Masked tokens are represented by noisy but informative continuous latent vectors instead of empty absorbing states, producing graded, gradually corrupted representations. During each reverse denoising step, the continuous latent serves as a semantic hint to guide discrete token prediction. The framework is designed to be compatible with existing discrete diffusion training procedures. At sampling time, the strength and choice of estimator for the continuous latent vector provide a controlled trade-off between mode-coverage (diversity-oriented generation) and mode-seeking (context-localization-oriented generation).

      '
    1: '**purpose**: Addressing two critical flaws in adapter-based fine-tuning for Image Compression for Machine and Human Vision (ICMH): the lack of adaptability in existing frequency-domain adapters, which suppress high-frequency details important for machine tasks, and the transform-entropy mismatch that arises when only the transform module is fine-tuned while the entropy model remains frozen, leaving it unable to adapt to the altered latent distribution.

      **mechanism**: A framework called Combine-ICMH that enables synergistic co-optimization of both the transform and entropy models through lightweight adapters. A Spatial-Wavelet Modulation Adapter (SWMA) enhances frequency adaptability within the transform module, preserving high-frequency details crucial for machine vision tasks. A Channel Modulation Adapter (CMA) directly fine-tunes the entropy model, resolving the mismatch between the transformed latent distribution and the frozen entropy model. Together, these adapters allow efficient joint adaptation of both components without full retraining.

      '
  metadata:
    0:
      area: generative models
      contribution: '3.25'
      negative_signals: []
      positive_signals:
      - It bridges a known gap and is conceptually novel. This specific combination of discrete diffusion with continuous latent vectors when the tokens are masked had not been previously explored.
      - I find the idea of augmenting MDMs with continuous latent vectors to provide semantic information is both novel and well-motivated.
      - The idea that combines the discrete diffusion process with the continuous semantic latent to resolve the information void problem is novel and seamlessly integrated into the training and sampling pipeline.
      rating: '6.50'
      similar_papers_mentioned: []
      title: Continuously Augmented Discrete Diffusion model for Categorical Generative Modeling
      type: POSITIVE
    1:
      area: generative models
      contribution: '2.00'
      negative_signals:
      - The contributions appear largely incremental. The proposed Spatial-Wavelet Modulation Adapter (SWMA) is a modest extension of the Spatial-Frequency Modulation Adapter (SFMA) from Adapt-ICMH (Li et al., 2024), differing primarily in the substitution of FFT with DWT in the frequency branch.
      - The paper mainly builds on Adapt-ICMH[1] by replacing the prior SFMA module with the proposed SWMA, which yields performance gains but constitutes an incremental rather than a substantively novel contribution.
      - This work appears to be an incremental improvement over the Adapt-ICMH ramework.
      - The paper's primary limitation is its lack of architectural novelty, with the proposed solutions appearing more as an engineering refinement of a pre-existing method  (i.e., Adapt-ICMH) than the introduction of a new paradigm.
      - The CMA module is  a standard channel attention mechanism, and its application to the entropy model, while effective, is a straightforward engineering choice.
      - Similarly, the SWMA module's replacement of FFT with a wavelet transform leverages a common alternative in signal processing and does not represent a significant conceptual advance in adapter design
      positive_signals: []
      rating: '2.50'
      similar_papers_mentioned: []
      title: 'Combine-ICMH: A Dual-Adapter Co-Tuning Framework in Image Compression for Machine and Human Vision'
      type: NEGATIVE
