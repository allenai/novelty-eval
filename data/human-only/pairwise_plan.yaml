  ideas:
    0: '**purpose**: Provide a formal understanding of why depth is effective in deep residual architectures such as ResNet and the Transformer, explain the historical necessity of normalization layers in training deep models, and offer a first-principles explanation for normalization-free techniques like SkipInit and Fixup that goes beyond heuristic reasoning or optimizer-based analysis.

      **mechanism**: Derive an explicit analytical formula, termed the Residual Expansion Theorem, that formally verifies the ensemble perspective of residual networks by proving that increasing network depth is mathematically equivalent to expanding an implicit ensemble. This expansion reveals a hierarchical ensemble structure in which the combinatorial growth of computation paths causes an explosion in the output signal. The theorem demonstrates that scaling each residual module provides a principled method to tame this combinatorial explosion, and further shows that such scaling implicitly regularizes model complexity by diminishing the influence of higher-order terms in the expansion.

      '
    1: '**purpose**: Understand the geometric structure of function spaces parametrized by neural networks (neuromanifolds), specifically addressing the identifiability problem (how many parameter choices yield the same function), computing the dimension of neuromanifolds, characterizing their singular points, and providing a geometric explanation for the sparsity bias observed in MLPs.

      **mechanism**: Algebraic geometry tools are applied to analyze neuromanifolds of deep MLPs and CNNs with sufficiently generic polynomial activation functions. For identifiability, it is shown that almost all functions in an MLP neuromanifold have only finitely many corresponding parameter choices, while CNN parametrizations are generically one-to-one, enabling dimension computation. Singular points are fully characterized for CNNs and partially for MLPs, revealing that singularities arise from sparse subnetworks in both architectures. For MLPs, these singularities are shown to often correspond to critical points of the mean-squared error loss, a property that does not hold for CNNs, thereby offering a geometric explanation of the sparsity bias exhibited by MLPs.

      '
  metadata:
    0:
      area: learning theory
      contribution: '1.50'
      negative_signals:
      - The residual expansion theorem seems trivial and restricted.
      - The connection between the residual scaling $\lambda$ and network trainability has been discussed extensively in prior work (e.g., [1,2,3,4]), including the difference between $1/\text{depth}$ and $1/\sqrt{\text{depth}}$ scalings. It is also known that without appropriate residual scaling the activation norms diverge as depth increases. Given this context, it is unclear what *new* insights this work contributes to our understanding of trainability.
      - The residual expansion theorem is technically sound, but relies on standard tools (e.g., Taylor expansion in $\lambda$, unrolling the recursion). In its current form, the result is mathematically correct but does not yet deliver strong conceptual intuition beyond existing literature.
      - The hierarchical decomposition of a ResNet into subnetworks defined by which residual blocks are active (e.g., n subnetworks with a single active block, n choose 2 with two active blocks, etc.) is well-known and has been articulated in prior work, most notably by Veit et al. (2016).
      - The observation that such subnetworks contribute terms of order λ, λ², and so on, follows directly from binomial expansion and does not require the technical machinery presented in this paper.
      - While the authors offer a formal statement (the Residual Expansion Theorem), the insights it provides are largely intuitive and do not significantly advance understanding beyond prior conceptual or first-order analyses.
      - The treatment of the scaling factor λ lacks both novelty and rigor.
      - the entire discussion of the paper as well as Theorem 3.1 is basically just an anecdotal explanation of the binomial expansion of $(1+x)^n$ and of the fact that the scaling of $x \propto n^{-1}$ that makes the limit non-trivial.
      - Only the geometric complexity experiments seem to be fully novel but insufficiently discussed.
