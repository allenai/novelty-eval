      '
    1: '**purpose**: Establish theoretical convergence guarantees for regret matching variants beyond two-player zero-sum games, addressing the long-standing open question of whether regret matching converges to Nash equilibria in potential games, and determining whether regret matching plus (RM+) can serve as a sound first-order optimizer for constrained optimization problems.

      **mechanism**: For RM+, a convergence analysis is developed by relating the KKT gap to accumulated regret, showing that RM+ converges to an approximate KKT point at a quantified iteration complexity, which improves when regrets are bounded. The analysis identifies a specific region that RM+ quickly reaches and remains in, within which a one-step improvement property holds despite not holding in general. For standard regret matching (with or without alternation), an exponential lower bound is constructed demonstrating that it can require exponentially many iterations to reach even a crude approximate solution in two-player potential games. This establishes the first worst-case separation between RM and RM+, and shows that convergence to coarse correlated equilibria in potential games is exponentially faster than convergence to Nash equilibria.

