      **mechanism**: A deterministic incremental algorithm that maintains an approximate minimum-cost matching between a growing set of request points and a fixed set of server points in any metric space. As each new point is added, the algorithm updates the matching with a controlled approximation factor and an amortized polylogarithmic-overhead insertion time per point. A key subroutine of the algorithm is amenable to efficient parallelization, and both CPU and GPU implementations are provided to exploit this parallelism.

      '
    1: '**purpose**: Address the slow convergence and underutilized memory advantages of zeroth-order fine-tuning methods for large language models, enabling parameter-efficient fine-tuning of very large models on GPUs with severely limited memory while maintaining convergence speed and performance close to first-order optimization.

      **mechanism**: A low-rank zeroth-order gradient estimation method that employs low-rank fast calculation and a stable sampling strategy to accelerate convergence. The model is divided into hierarchical blocks: shallow blocks are optimized using the low-rank zeroth-order optimizer, while the deepest blocks closest to the output are optimized with first-order methods to further speed convergence. A memory offloading scheduling strategy moves hierarchical blocks that have completed computation to CPU memory, loading only the currently needed blocks into GPU memory, thereby drastically reducing GPU memory requirements during fine-tuning.

