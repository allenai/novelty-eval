    0: '**purpose**: Understanding and deliberately cultivating visual priors—implicit knowledge about the visual world—that emerge within large language models during text-only pre-training. The research aims to characterize how these latent visual capabilities decompose into perception and reasoning components, identify their origins in different categories of pre-training data, reveal their distinct scaling behaviors, and leverage these insights to improve the construction of multimodal large language models.

      **mechanism**: Systematic controlled experiments spanning the full multimodal LLM construction pipeline—from language model pre-training through visual alignment to supervised multimodal fine-tuning—across multiple model scales, diverse data categories and mixtures, and various adaptation setups. The analysis separates visual priors into perception and reasoning components, showing that reasoning priors arise primarily from reasoning-centric data such as code, math, and academic text and scale progressively, while perception priors emerge more diffusely from broad corpora and depend more on the vision encoder and visual instruction tuning data. Text describing the visual world is identified as important but subject to rapid saturation. Based on these findings, a data-centric recipe for pre-training vision-aware language models is proposed. Additionally, a Multi-Level Existence Benchmark is introduced to evaluate and facilitate further research into visual priors in language models.

      '
    1: '**purpose**: Address the challenge of maintaining semantic label consistency across multiple views in 3D semantic object detection, overcoming bias toward non-descriptive viewpoints and the requirement for fixed label lists that limit existing zero-shot approaches combining 2D detections with vision-language features.

      **mechanism**: An open-vocabulary algorithm called LLM-guided Active Detection and Reasoning (LADR) that relabels multi-view detections using large language model reasoning to mitigate errors from poor, ambiguous viewpoints and occlusions. The method actively samples informative views based on feature diversity and uncertainty, generates new label hypotheses through LLM reasoning, and recomputes confidences to construct a spatial-semantic representation of objects. This approach balances detail preservation with reduced ambiguity while maintaining a low sampling rate.

      '
