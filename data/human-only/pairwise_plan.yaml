    0: '**purpose**: Address robust fairness issues in Data-Free Robustness Distillation, where existing methods cause severe disparity of robustness across different categories. Specifically, tackle two problems: student models distilled with equal class proportion data exhibit significantly different robustness across distinct categories, and the robustness of student models is unstable across different attack targets.

      **mechanism**: A Fairness Enhanced data-free Robustness Distillation (FERD) framework that adjusts both the proportion and distribution of adversarial examples. For proportion adjustment, a robustness-guided class reweighting strategy synthesizes more samples for less robust categories to improve their robustness. For distribution adjustment, complementary data samples are generated for advanced robustness distillation. Fairness-Aware Examples (FAEs) are created by enforcing a uniformity constraint on feature-level predictions, suppressing the dominance of class-specific non-robust features to provide balanced representation across all categories. Uniform-Target Adversarial Examples (UTAEs) are then constructed from FAEs by applying a uniform target class constraint that avoids biased attack directions, distributing attack targets across all categories and preventing overfitting to specific vulnerable categories.

      '
    1: '**purpose**: Addressing the stability-plasticity dilemma in Continual Generalized Category Discovery, where a model must incrementally recognize new classes in open environments while resisting catastrophic forgetting of old classes. Existing methods fail to effectively balance this trade-off due to ineffective semantic utilization and knowledge preservation, resulting in poor new-class recognition and forgetting of previously learned classes.

      **mechanism**: A method that leverages textual descriptions and visual features to construct and optimize semantic anchors, serving as stable reference points for category representation. Image and text encoders are frozen to preserve general pre-trained knowledge, preventing degradation of learned representations during incremental learning. This combination of semantic anchor optimization and encoder freezing balances stability and plasticity, enabling improved recognition of new classes while mitigating catastrophic forgetting of old classes.

      '
