    1: '**purpose**: Address the challenges of graph few-shot class-incremental learning, including catastrophic forgetting, insufficient labels, class imbalance, and spatial confusion between new and old classes. Existing meta-learning and metric-learning approaches treat all classes equally and ignore inter-class relationships, which does not reflect real-world scenarios. The goal is to adaptively process each class based on relationships between classes to alleviate spatial confusion and catastrophic forgetting.

      **mechanism**: A class-adaptive prototype learning method consisting of two key modules. First, a class-adaptive spatial reservation module allocates larger feature spaces for anticipated new classes, preventing confusion between new and old class representations. Second, a class-adaptive prototype alignment module performs knowledge distillation by considering the positional relationships between new and old classes in the feature space. This module provides greater flexibility to old classes that are closely related to new classes while preserving classification information of other old classes, enabling the model to adapt to incremental arrival of new classes.

