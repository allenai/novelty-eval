    0: '**purpose**: Address the limitation that current reasoning evaluation methods for Large Language Models are generic and fail to distinguish between different reasoning types required for complex tasks. Specifically, enable fine-grained diagnostic evaluation of LLM reasoning quality for Fact Verification, grounded in Natural Language Inference, to understand how well models perform each type of inference step and how reasoning quality relates to prediction correctness.

      **mechanism**: A novel evaluation framework decomposing NLI reasoning into four prominent inference step types: hypothesis decomposition into individual facts, source attribution for each fact, entailment decision for each fact, and aggregation of fact-level decisions into a final entailment classification. Fine-grained metrics assess both the existence and quality of each inference step type. Meticulous manual evaluation of multiple prominent LLMs is conducted following this framework, then scaled using an LLM-as-a-Judge approach. The framework is also used to guide LLMs toward systematic reasoning traces, examining effects on reasoning quality and final classification accuracy, particularly for non-reasoning models.

      '
    1: '**purpose**: Overcoming limitations of existing diffusion-based GPS trajectory generation methods, which are constrained to small urban spatial scales, lack transportation-mode diversity, and suffer from inefficiency due to numerous sampling steps. The goal is to enable nationwide, multi-scale pseudo-GPS trajectory generation that can support inter-region urban planning, traffic management, and disaster response while addressing privacy concerns, limited data accessibility, and high acquisition costs associated with real mobile phone GPS data.

      **mechanism**: TrajFlow, a flow-matching-based generative model for GPS trajectory generation. It leverages the flow-matching paradigm to improve robustness and efficiency across multiple geospatial scales compared to diffusion-based approaches. It incorporates a trajectory harmonization and reconstruction strategy that jointly addresses scalability across spatial scales, diversity of transportation modes, and computational efficiency. This constitutes the first nationwide, multi-scale GPS trajectory generation model.

      '
