      **mechanism**: For bounded delays, a delay-aware zooming algorithm is introduced that preserves the optimal regret performance of the delay-free setting up to an additional term scaling with the maximum delay. For unbounded delays, a phased learning strategy is proposed that accumulates reliable feedback over carefully scheduled intervals. A regret lower bound is established for the unbounded delay setting, demonstrating that the phased learning method is nearly optimal up to logarithmic factors.

