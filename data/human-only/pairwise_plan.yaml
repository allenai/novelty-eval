    0: '**purpose**: Identify which types of chain-of-thought data most effectively enhance large language model reasoning capabilities, and expand the reasoning potential of foundation models by selecting high-value reasoning data for mid-training. The reasoning potential of a foundation model is defined as the inverse of the number of independent attempts required to correctly answer a question, which correlates strongly with final model performance.

      **mechanism**: Atomic reasoning patterns are abstracted from chain-of-thought sequences, characterized by commonality and inductive capabilities, and used to construct a core reference set enriched with valuable reasoning patterns. A dual-granularity selection algorithm is then applied, operating at the level of chains of reasoning patterns and token entropy, to efficiently select high-value chain-of-thought data from a larger data pool that aligns with the core reference set. Diverse data enriched with high-value reasoning patterns is used to expand the model''s reasoning potential, enabling the model to master reasoning through targeted mid-training on the selected data.

      '
    1: '**purpose**: Isolate and evaluate communication under information asymmetry in multi-turn, multi-agent LLM scenarios, addressing the limitation that most existing setups emphasize open-ended role-play rather than controlled evaluation. The goal is to systematically study how models share information, integrate partner messages, and respond to different feedback signals, probing the limits of multi-turn cooperation and enabling investigation of coordination mechanisms.

      **mechanism**: A minimal but expressive two-agent puzzle environment called AsymPuzl, in which each agent observes complementary but incomplete views of a symbolic puzzle and must exchange messages to solve it cooperatively. The environment supports puzzles of varying sizes, configurable feedback mechanisms, and diverse LLM pairings, providing a controlled testbed for systematic evaluation of cooperative communication behaviors.

      '
