      **mechanism**: A kernel ridgeless regression student model in a Reproducing Kernel Hilbert Space learns from a teacher with systematic bias and output variance. An asymptotic bias-variance decomposition is derived to reveal how teacher errors are processed by the student, mediated by the student''s kernel eigenvalues and its choice of operational modes and their alignment with the teacher''s signal. The analysis identifies that outperformance hinges on strategic mode utilization that effectively manages the bias-variance trade-off, either by selectively ignoring the teacher''s biased modes to achieve a more favorable bias configuration, or by reducing teacher variance through modes with beneficial eigenvalue properties.

