  ideas:
    0: '**purpose**: Address limitations of existing audio-driven portrait animation methods, which suffer from limited controllability, high computational cost, or lack broader expressivity (emotion and head diversity) beyond lip synchronization. Enable fast, controllable generation of lifelike talking faces from a static image and audio input with accurate lip-sync, expressive emotion rendering, and diverse head motion generation.

      **mechanism**: Qualitative and quantitative analysis of parameter representations reveals that facial representation can be decomposed into three interpretable subspaces: lip-phoneme synchronization governed by audio envelope dynamics, emotion modulation conditioned on semantic features and reference labels, and head motion controlled by user-defined curves. Based on this insight, XTalker is proposed as a flow matching-based generation framework employing a unified MM-DiT backbone that jointly encodes portrait and audio signals. Three lightweight heads branch from this backbone: a talking head for audio-envelope-driven lip movement, an emotion head for synthesizing facial expressions from emotion labels, and a pose head for animating diverse head trajectories. The framework is designed for real-time operation while maintaining controllability across lip synchronization, emotion expression, and head motion dimensions.

      '
    1: '**purpose**: Large language models struggle to effectively utilize real-world long-context information despite advances in pretraining with extended context sizes. This limitation stems from insufficient long-context alignment caused by data quality issues, training inefficiencies, and the lack of well-designed optimization objectives. The goal is to improve long-context alignment while substantially improving the efficiency of data construction and training processes.

      **mechanism**: A framework called Short-to-Long Preference Optimization (SoLoPO) decouples long-context preference optimization into two components: short-context preference optimization and short-to-long reward alignment. Short-context preference optimization leverages preference pairs sampled from short contexts to enhance the model''s contextual knowledge utilization ability. Short-to-long reward alignment explicitly encourages reward score consistency for responses when conditioned on both short and long contexts that contain identical task-relevant information, facilitating the transfer of the model''s short-context handling ability into long-context scenarios. This decomposition is supported by both theoretical and empirical evidence, and the framework is compatible with mainstream preference optimization algorithms.

