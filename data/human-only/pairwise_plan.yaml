  ideas:
    0: '**purpose**: Address the fragility of self-correction in Large Reasoning Models, specifically the "Prefix Dominance Trap" phenomenon where a short but poor beginning to the reasoning process prevents the model from recovering. The goal is to move beyond internal self-correction and enable robust error correction that can overcome poor reasoning starts.

      **mechanism**: A method called Learning from Peers (LeaP) that enables multiple reasoning paths to periodically summarize and share intermediate reasoning through a routing mechanism, incorporating peer insights at fixed token intervals. This allows reasoning processes to benefit from external peer feedback rather than relying solely on internal self-correction. For smaller models that may struggle to follow summarization and reflection instructions efficiently, fine-tuned LeaP-T models are introduced. The approach provides timely peer-driven error correction and exhibits strong error tolerance.

      '
    1: '**purpose**: Address the limitation that current large language model reasoning paradigms only begin chain-of-thought reasoning after the entire input is received, which introduces unnecessary latency and weakens attention to earlier information in dynamic scenarios. Enable a streaming thinking capability where reasoning unfolds incrementally as input is read, inspired by the human cognitive process of thinking while reading.

      **mechanism**: A streaming thinking paradigm instantiated through StreamingThinker, a framework integrating three components: streaming chain-of-thought generation using streaming reasoning units with quality control, streaming-constraint training that enforces order-preserving reasoning through streaming attention masks and position encoding, and streaming parallel inference leveraging parallel key-value caches that decouple input encoding from reasoning generation. This design ensures alignment between input reading and reasoning output while enabling true concurrency, allowing the model to progressively reason in the order of input arrival and further adjust reasoning depth once reading is complete.

      '
