    0: '**purpose**: Constructing a predictive, generalizable data-driven model for chaotic dynamical systems, addressing the sensitivity of such systems to small errors and the limitations of prior approaches that either train specialized models on individual time series or use foundation models lacking dynamical structure. The goal is to enable zero-shot forecasting of unseen chaotic systems, preserve both short-term accuracy and long-term distributional properties, and generalize to real-world experimental time series and higher-dimensional systems such as partial differential equations.

      **mechanism**: A transformer-based model called Panda (Patched Attention for Nonlinear Dynamics) is trained on a novel synthetic, extensible dataset of chaotic dynamical systems discovered using an evolutionary algorithm. The model uses a patched attention architecture designed for nonlinear dynamics. Despite training purely on simulated low-dimensional ordinary differential equations, the model is evaluated on zero-shot forecasting of unseen chaotic systems, real-world experimental time series, and partial differential equations. Analysis of the trained model reveals nonlinear resonance patterns in attention heads. A neural scaling law for differential equations is demonstrated, characterizing how model performance improves with scale and highlighting the potential of pretrained models for exploring abstract mathematical domains in nonlinear dynamics.

      '
    1: '**purpose**: Address the limitations of neural operator models for solving partial differential equations that rely on global mixing mechanisms such as spectral convolutions or attention, which tend to oversmooth sharp local dynamics and incur high computational cost. The goal is to enable accurate, scalable, and interpretable neural PDE solvers that enforce strict locality while retaining multiscale representational power.

      **mechanism**: A finite-difference–inspired neural architecture called FINO that replaces fixed finite-difference stencil coefficients with learnable convolutional kernels and evolves states through an explicit, learnable time-stepping scheme. A central Local Operator Block combines a differential stencil layer, a gating mask, and a linear fuse step to construct adaptive derivative-like local features propagated forward in time. This block is embedded within an encoder–decoder with a bottleneck to capture fine-grained local structures. Theoretical contributions include a composition error bound linking one-step approximation error to stable long-horizon rollouts under a Lipschitz condition, and a universal approximation theorem for discrete time-stepped PDE dynamics, showing that strict locality with learnable time-stepping provides a sound foundation for neural PDE solvers.

      '
