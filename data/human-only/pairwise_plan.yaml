      - By introducing the concept of "representational inertia," the authors provide a new theoretical framework for understanding the dynamics of feature representation in MLLMs.
      - This paper is novel in observation. The observation that visual features differ in magnitude with text features directly questions the widely accepted assumption that connecters align visual and text modalities.
      rating: '6.00'
