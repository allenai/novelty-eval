    0: '**purpose**: Constructing an accurate world model capable of fully cloning and overfitting to a deterministic 3D world, addressing the challenge that exteroceptive sensory inputs like images are high-dimensional and encode complex nonlinear mappings from underlying physical processes, making precise latent-state prediction difficult. The goal is to learn a representation space that faithfully captures underlying physical states while minimizing information loss and noise, thereby simplifying dynamics modeling and improving long-horizon prediction reliability.

      **mechanism**: Geometrically-Regularized World Models (GRWM) enforce that consecutive points along a natural sensory trajectory remain close in latent space, producing latent representations that align closely with the true topology of the environment. This geometric regularization is plug-and-play, requiring only minimal architectural modification, and scales naturally with trajectory length. It applies broadly across latent generative backbones, deriving its effectiveness from learning a latent space with superior geometric structure that better supports accurate dynamics prediction.

      '
    1: '**purpose**: Reinterpret the success of score-based methods such as diffusion models and Bayesian inverse problems by arguing that they implicitly learn the data manifold rather than the full data distribution, proposing a paradigm shift from distributional learning to the more attainable task of geometric learning that tolerates substantially larger errors in score approximation.

      **mechanism**: A novel asymptotic analysis of score functions in the small-noise regime reveals a sharp separation of scales: manifold information dominates distributional information by a factor inversely proportional to the square of the noise level. Three consequences illustrate this framework: first, in diffusion models, concentration on the data support is achievable with a much weaker score approximation accuracy than that needed to recover the specific data distribution; second, learning the uniform distribution on the manifold is similarly easier by the same factor; and third, in Bayesian inverse problems, the maximum entropy prior is shown to be more robust to score errors than generic priors by the same scale separation factor.

      '
