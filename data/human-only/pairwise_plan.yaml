    0: '**purpose**: Leverage Large Language Models for long-term time series forecasting directly on raw time series data, without relying on hand-engineered statistical features or dataset-specific prompts. This addresses the gap left by existing methods that deviate from end-to-end learning and risk lookahead bias, where performance gains may arise from information in the model''s pre-training corpus rather than genuine forecasting ability.

      **mechanism**: A framework called NumText that treats raw time series as dual-modality input. Two parallel representations are generated: a direct numerical value embedding and a forecasting-oriented LLM embedding derived from the textual form of the series. These complementary embeddings are combined through a modality-specific Mixture-of-Experts module to produce a unified representation, which is then processed by a downstream attention mechanism for forecasting. A time-series text embedding cache is introduced to reduce computational overhead during inference, enabling efficient use of the LLM-derived textual embeddings.

      '
    1: '**purpose**: Address two limitations of existing time-series forecasting training objectives such as mean squared error: (1) overlooking the label autocorrelation effect among future steps, which leads to a biased training objective, and (2) failing to assign heterogeneous task weights for forecasting tasks corresponding to different future steps, which limits forecasting performance.

      **mechanism**: A quadratic-form weighted training objective is introduced, where a weighting matrix replaces the standard independent, equally weighted loss. The off-diagonal elements of the weighting matrix capture label autocorrelation among future steps, while non-uniform diagonal elements assign heterogeneous weights to forecasting tasks at varying future horizons. A Quadratic Direct Forecast (QDF) learning algorithm trains the forecasting model by adaptively updating this quadratic-form weighting matrix during training, jointly correcting for autocorrelation bias and optimizing per-step task importance.

      '
