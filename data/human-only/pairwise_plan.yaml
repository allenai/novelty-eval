  ideas:
    0: '**purpose**: Overcome the limited 3D spatial reasoning capacity of Large Vision-Language Models, which stems from semantic bias (where object meaning dominates over geometric structure) and the loss of depth cues when 3D environments are projected into 2D images. The goal is to enable LVLMs to generalize to tasks requiring reasoning about inter-object spatial relations in three dimensions, advancing toward embodied AI systems capable of spatial reasoning in real-world environments.

      **mechanism**: DuoLLM, a multi-modal architecture that explicitly decouples semantic and spatial processing through a two-stream design. A dedicated spatial stream is equipped with a 3D perception engine comprising three components: a depth estimation module that introduces 2.5D geometric priors to recover lost geometric information from 2D projections; a relational attention mechanism that captures object-to-object spatial dependencies to overcome semantic bias; and an asymmetric cross-attention module that efficiently fuses semantic and spatial features across the two streams. This design explicitly models geometric priors to extend LVLMs beyond 2D recognition toward 3D spatial reasoning.

      '
    1: '**purpose**: Address the economic unsustainability of scaling multi-agent systems built on Vision-Language Models, where coordinating heterogeneous agents under information asymmetry causes spiraling costs. Existing coordination paradigms such as Mixture-of-Agents and knowledge-based routers rely on heuristic proxies that ignore costs and collapse uncertainty structure, resulting in provably suboptimal coordination. The goal is to enable cost-efficient, principled, and scalable coordination for economically viable multi-agent visual intelligence systems.

      **mechanism**: Agora reframes multi-agent coordination as a decentralized market for uncertainty. Epistemic uncertainty is formalized into structured, tradable asset categories—perceptual, semantic, and inferential—enabling agents to trade uncertainty based on rational economic rules that enforce profitability-driven collaboration. A market-aware broker, extending Thompson Sampling, initiates collaboration among agents and guides the system toward cost-efficient equilibria. This market-based coordination paradigm replaces heuristic proxies with principled economic mechanisms for scalable multi-agent visual reasoning.

      '
