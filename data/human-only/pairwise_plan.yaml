    0: '**purpose**: Selectively modifying specific flawed reasoning patterns in large language models while preserving other reasoning capabilities, addressing the fundamental trade-off between Generality (edits generalizing across tasks sharing the same reasoning pattern) and Locality (preserving unrelated reasoning abilities). Existing approaches treat reasoning improvement as a monolithic skill, applying broad and inefficient training that cannot target specific reasoning errors.

      **mechanism**: A paradigm called Reasoning Editing is introduced alongside the discovery of the Circuit-Interference Law, which establishes that edit interference between reasoning patterns is proportional to the overlap of their neural circuits. Guided by this principle, the REdit framework actively reshapes neural circuits before editing to modulate interference and mitigate the generality-locality trade-off. REdit integrates three components: Contrastive Circuit Reshaping, which disentangles overlapping neural circuits to directly address the generality-locality trade-off; Meta-Contrastive Learning, which extends transferability to novel, unseen reasoning patterns; and Dual-Level Protection, which preserves preexisting model abilities by constraining the directions of reshaping updates and regularizing task-level predictions.

      '
    1: '**purpose**: Addressing the lack of transparency in black-box intrusion detection systems for 5G networks, which hinders trust and effective operational response despite high accuracy. The goal is to build a trustworthy and effective IDS that provides fully transparent reasoning without sacrificing detection performance for marginal gains from opaque models.

