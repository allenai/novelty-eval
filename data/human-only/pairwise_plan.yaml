    0: '**purpose**: Address the computational bottleneck caused by linear growth of the Key-Value (KV) Cache in multi-turn conversational applications of Large Language Models. Existing eviction strategies degrade performance by repeatedly compressing early conversational context, leading to information loss and catastrophic context forgetting. The goal is to enable efficient KV Cache management that preserves important historical context across multiple dialogue turns.

      **mechanism**: FlowKV introduces a multi-turn isolation mechanism for KV Cache management that can be applied to any existing KV Cache compression method without requiring additional training. The core approach preserves the accumulated compressed KV cache from past conversational turns in an isolated manner. Compression is strategically applied only to the newly generated KV pairs from the latest completed turn, rather than recompressing the entire cache history. This isolation prevents repeated compression of older context, effectively mitigating catastrophic forgetting of earlier conversational information.

      '
    1: '**purpose**: Reducing the substantial memory footprint of Mixture-of-Experts architectures caused by redundant expert parameters, addressing the limitation that existing per-expert compression methods neglect structural redundancies shared across experts, which constrains their compression efficiency and effectiveness.

      **mechanism**: A data-aware tensor decomposition method called TD-MoE that jointly factorizes expert weights by capturing global dependencies through three components: (i) cross-expert tensorization that unifies all experts within a layer into a single three-dimensional tensor and applies joint decomposition to capture shared structure beyond individual expert scope; (ii) a multi-linear whitening strategy that decorrelates input and output features to produce a more balanced and data-adaptive decomposition; (iii) a three-dimensional rank allocation mechanism that dynamically assigns decomposition ranks across dimensions to optimally meet a target compression ratio while minimizing reconstruction error.

