    0: '**purpose**: Establish a principled geometric structure on the latent space of diffusion models, addressing fundamental flaws in existing approaches: the deterministic pullback metric forces geodesics to decode as straight lines in data space, ignoring intrinsic data geometry, while using the terminal noise variable as a latent representation collapses the Fisher-Rao metric due to memorylessness. The resulting framework aims to enable meaningful distance computation and geodesic paths for editing and transition path sampling.

      **mechanism**: Introduction of a latent spacetime representation indexing pairs of noisy states and noise scales, which parameterizes the family of denoising distributions across all noise levels. Proof that these denoising distributions form an exponential family, enabling an information-geometric treatment via the Fisher-Rao metric with nontrivial structure. Derivation of simulation-free estimators for curve lengths in this latent spacetime, allowing efficient geodesic computation without costly sampling. The geometric structure induces a Diffusion Edit Distance, where geodesics correspond to minimal sequences of noise-and-denoise editing operations between data points. Applications include transition path sampling in molecular systems, with constrained variants supporting low-variance transitions and region avoidance.

      '
    1: '**purpose**: Address geometric drift between views in diffusion-based world models for multi-camera driving video synthesis, which degrades downstream perception, prediction, and planning. Enable realistic, controllable, and view-consistent generation of all camera streams within a single unified model.

      **mechanism**: OminiDrive jointly compresses, generates, and modulates all camera streams. A multi-view variational compression maps all views into a shared latent manifold. A Diffusion Transformer backbone operates over a single, view-homogeneous token grid within this space. A consistency-aware denoiser injects correlated noise and aligns view-dependent coordinates at every diffusion step to enforce cross-view geometric consistency. Heterogeneous control signals—including vehicle trajectory, ego pose, and scene semantics—are fused through lightweight latent modulation layers that steer generation without additional inference cost. This design preserves both spatial coherence across views and temporal fidelity across frames.

      '
