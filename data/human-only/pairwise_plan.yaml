    1: '**purpose**: Addressing the problem of Dual-level Noisy Correspondence (DNC) in multi-modal entity alignment (MMEA), where misalignments exist in both intra-entity correspondences (between entities and their attributes) and inter-graph correspondences (between entities across knowledge graphs and between their attributes). Existing MMEA methods assume faultless correspondences at both levels, which does not hold in real-world multi-modal knowledge graphs that rely on expert annotations, leading to degraded alignment performance.

      **mechanism**: A robust MMEA framework called RULE that operates in three stages. First, it estimates the reliability of both intra-entity and inter-graph correspondences using a dedicated two-fold principle. Second, leveraging these estimated reliabilities, it mitigates the negative impact of intra-entity noise during attribute fusion across modalities and prevents overfitting to noisy inter-graph correspondences during inter-graph discrepancy elimination. Third, beyond training-time designs, a correspondence reasoning module uncovers underlying attribute-attribute connections across graphs, enabling more accurate equivalent entity identification at inference time.

