      **mechanism**: Low-Rank Sparse Attention (Lorsa), a sparse replacement model for Transformer attention layers that decomposes original Multi Head Self Attention into interpretable components. Lorsa identifies cleaner, finer-grained versions of known attention behaviors such as induction heads, successor heads, and attention sink, as well as arithmetic-specific head families and a novel head type called subtoken induction heads that operate at the character level rather than the token level. The approach includes extensive experiments on architectural design ablation, correlation analysis between Lorsa components and original attention heads, error analysis, and an early attempt to fully sparsify a toy Transformer to expose clean global circuits.

