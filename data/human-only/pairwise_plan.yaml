      '
    1: '**purpose**: Address limitations of current Machine Unlearning methods that require full retraining or extensive fine-tuning, lack formal removal criteria, and support only sample-level forgetting. Enable lightweight unlearning that supports both sample-level and class-level forgetting as well as the removal of learned objectives, while preserving downstream performance and potentially managing agentic learning behaviours.

      **mechanism**: Two lightweight, projection-only techniques operating above frozen feature extractors. Pull-to-Outlier Unlearning (POU) is an unsupervised geometric removal method that displaces embeddings of unwanted samples or entire classes into synthetic outlier regions, preserving downstream performance and distilling knowledge of the remaining data. Contrastive Objective-level Unlearning (COU) removes learned objectives by perturbing projection weights to eliminate a target task''s influence, then realigning the original data manifold to restore coherent representations.

