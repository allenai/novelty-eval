      '
    1: '**purpose**: Improve the contextual faithfulness of Retrieval-Augmented Generation systems by understanding and addressing how Large Language Models internally integrate retrieved evidence with parametric memory, especially under knowledge conflicts. Existing approaches treat the LLM as a black box and rely on external interventions such as prompt engineering, decoding constraints, or reward-based fine-tuning, overlooking the internal mechanisms of knowledge integration that lead to unfaithful responses contradicting retrieved context.

      **mechanism**: A probing-based analysis of hidden-state representations in LLMs reveals three findings: knowledge integration occurs hierarchically, conflicts manifest as latent signals at the sentence level, and irrelevant context is amplified when aligned with parametric knowledge. Building on these insights, CLEAR (Conflict-Localized and Enhanced Attention for RAG) is a framework that decomposes retrieved context into fine-grained sentence-level knowledge units, employs hidden-state probing to localize conflicting knowledge between retrieved evidence and parametric memory, and introduces conflict-aware fine-tuning to guide the model toward accurately integrating retrieved evidence over its own parametric knowledge when conflicts arise.

