    0: '**purpose**: Address the inefficiency of fixed-cost safety monitors for large language model activations, where expensive monitors waste resources on easy inputs and cheap ones miss subtle harmful requests. The goal is to enable flexible safety monitoring whose computational cost scales with input difficulty and available resources, rather than remaining constant for every query.

      **mechanism**: Truncated Polynomial Classifiers (TPCs), an extension of linear probes for dynamic activation monitoring. Polynomials are trained and evaluated progressively, term-by-term, enabling early stopping at test time. TPCs support two modes of operation: a safety dial mode, where evaluating additional polynomial terms provides increasingly stronger guardrails from the same model, and an adaptive cascade mode, where clearly safe or harmful inputs exit early after low-order checks while ambiguous inputs trigger higher-order evaluation, reducing overall monitoring costs.

      '
    1: '**purpose**: Address the privacy and confidentiality risks posed by large language models that memorize sensitive information (such as personal or confidential data) during fine-tuning on specialized data corpora. The goal is to remove this memorization and sanitize the model without requiring costly additional fine-tuning on a secured data corpus, enabling organizations that have already invested significant resources in training to safely share their models.

      **mechanism**: An unlearning approach called SANI that sanitizes language models through two phases: an erasure phase and a repair phase. The erasure phase resets certain neurons in the last layers of the model to disrupt the memorization of fine-grained information. The repair phase then fine-tunes the model while avoiding re-memorization of sensitive information. SANI can be applied to both fine-tuned models specialized with domain-specific data (e.g., medical) to remove direct and indirect identifiers, and to standard pre-trained models to remove specific terms defined as confidential information.

