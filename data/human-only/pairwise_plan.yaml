    0: '**purpose**: Understanding the theoretical motivation behind GRPO''s effectiveness in reasoning model training, explaining its optimization landscape, identifying why its objective function contains undesired global minima yet avoids converging to them, and diagnosing sources of instability in recent simplified variants of GRPO''s objective.

      **mechanism**: Reformulating GRPO''s on-policy optimization as a weighted combination of likelihood maximization for correct rollouts and likelihood minimization for incorrect rollouts. Analyzing the positive and negative components of GRPO''s objective independently, showing that the positive term''s global minimum corresponds to entropy minimization and length collapse while the negative term''s global minimum corresponds to entropy maximization and length explosion. Using this decomposition to reveal training instabilities in recent algorithmic simplifications of GRPO. Identifying specific design choices in GRPO''s advantage computation that guide convergence toward desirable minima despite the presence of bad global minima. Demonstrating that clipping mechanisms stabilize the optimization process, preventing training instabilities even when training solely on minimizing the likelihood of incorrect rollouts.

      '
    1: '**purpose**: Challenge the assumption that reasoning capabilities in small language models require training on extremely large corpora. Investigate whether strong reasoning abilities can emerge in sub-billion-parameter models using significantly less pre-training data than current prevailing practice.

      **mechanism**: Careful curation and resampling of open-source datasets identified as beneficial under specifically designed quality metrics, producing a high-quality subset of data. Pre-training sub-billion-parameter models on data resampled from this curated subset, followed by an established post-training procedure, to develop MobileLLM-R1, a series of sub-billion-parameter reasoning models. The complete training recipe, data sources, data mixing ratios, models, and code are released publicly to support reproducibility and further research.

      '
