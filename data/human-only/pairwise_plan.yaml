  ideas:
    0: '**purpose**: Addressing a critical flaw in Multimodal Large Language Models that use Pre-Norm architecture: a severe norm disparity between high-norm visual tokens and low-norm text tokens. This imbalance induces an asymmetric update dynamic where visual tokens exhibit representational inertia, transforming semantically much slower than textual tokens, which fundamentally impairs effective cross-modal feature fusion.

      **mechanism**: A formal theoretical analysis demonstrating that norm disparity in Pre-Norm architectures causes asymmetric update dynamics between visual and textual tokens, rather than being a static issue. Empirical validation across a range of mainstream Multimodal Large Language Models confirms the persistence of norm disparity and resulting asymmetric update rates as a prevalent phenomenon. The proposed solution involves inserting a single, carefully initialized LayerNorm layer after the visual projector to enforce norm alignment between visual and textual token representations, resolving the architectural imbalance to produce a more holistically capable model.

      '
    1: '**purpose**: Address the scalability limitations of transformer self-attention in long-context scenarios, specifically the quadratic computational complexity and linear KV cache growth. Layer-wise hybrid architectures that alternate full-attention and sliding window attention layers suffer from a weakest-link effect, where global context is inevitably lost in sparse layers, with degradation worsening as the proportion of sparse layers increases. The goal is to preserve global context access at every layer while still reducing computation and KV-cache requirements.

      **mechanism**: Head-wise Sparse Attention (HSA), a hybrid architecture that applies sparsity at the KV-head level rather than the layer level. Within each layer, a subset of KV heads retains full attention to maintain long-range dependency modeling, while the remaining heads are converted to sliding window attention for efficiency. This ensures every layer preserves at least one full-attention KV head for global context. A discrepancy-based post-training selection strategy identifies which heads are essential for capturing global context and should remain full-attention, converting the rest to sparse form. Continued training then adapts the model to the new head-level sparsity pattern.

      '
  metadata:
