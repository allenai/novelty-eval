    - 'Gross Overstatement of Novelty: The paper frames its "Scaling Mechanism" (η) as a key contribution. This is a gross overstatement. Adjusting the clipping range for quantization is a rudimentary form of hyperparameter tuning, not a novel method. Presenting this as a core contribution is misleading and highlights a lack of substance in the work''s actual novelty.'
