  idea: 'The remarkable success of Large Language Models (LLMs) in language tasks inspires us to explore their application in long-term time series forecasting(LTSF). Their ability to capture complex sequence dependencies from massive datasets suggests a strong potential for modeling the intricate patterns inherent in time series data. However, current methods for applying LLMs to LTSF often rely on hand-engineered statistical features and elaborate, dataset-specific prompts. This approach not only deviates from the end-to-end learning paradigm but also introduces a critical risk of lookahead bias, where performance gains may stem from the model accessing information within its pre-training corpus rather than genuine forecasting ability. A clear gap exists for a method that leverages LLMs on raw time series data in a robust, feature-free manner. To address this gap, we propose a novel framework, NumText, that directly operates on raw time series data. Our method treats the series as a dual-modality input, generating two parallel representations: a direct numerical value embedding and a forecasting-oriented LLM embedding derived from the series'' textual form. These distinct embeddings are then combined through a modality-specific Mixture-of-Experts (MoE) to form a rich, unified input for a downstream attention mechanism. Furthermore, we introduce a time-series text embedding cache to reduce computational overhead during inference. The numerical value embeddings and the LLM''s textual embeddings are highly complementary, capturing different yet synergistic signals crucial for forecasting, establishing a more robust approach for applying LLMs in this domain.'
