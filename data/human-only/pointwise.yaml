  idea: 'Large language models (LLMs) have made significant progress in the field of mathematical reasoning, but whether they have true mathematical understanding ability is still controversial. To explore this issue, we propose a new perturbation framework to evaluate LLMs'' reasoning ability in complex environments by injecting additional semantically irrelevant perturbation sentences and gradually increasing the perturbation intensity. At the same time, we use an additional perturbation method: core questioning instruction missing, to further analyze the LLMs'' problem-solving mechanism. Through our analysis, we find that LLMs perform stably when facing perturbation sentences without numbers, but there is also a robustness boundary, with performance exhibiting varying degrees of decline as perturbation intensity increases. When facing perturbation sentences with numbers, the performance decreases more significantly, with further degradation as perturbation intensity is enhanced. By analyzing the reasoning process of LLMs in detail, we find that models are more sensitive to perturbations with numerical information and are more likely to give incorrect answers when disturbed by irrelevant numerical information. The higher the perturbation intensity, the more obvious these defects are. At the same time, in the absence of core questioning instruction, models can still maintain nontrivial accuracy, indicating that LLMs may rely on memory templates or pattern matching to complete the task, rather than logical reasoning. In general, our work reveals the shortcomings and limitations of current LLMs in their reasoning capabilities, which is of great significance for the further development of LLMs.'
