  idea: Predicting severe diabetic complications from longitudinal patient traces can enable proactive care. Where multi-institutional EHR integration is impractical, standardized health-insurance claims offer broad, longitudinal coverage despite clinical sparsity. We study this setting in Brazil's TUSS billing-code ecosystem and present a claims-only framework for forecasting complications (angiopathies, amputations, renal failure) 6–12 months ahead. TUSS codes are represented with skip-gram embeddings, and absolute timing is injected via fixed sinusoidal time embeddings added directly to event vectors; a BiLSTM with self-attention summarizes long, irregular histories. Ablations show that temporal encoding and attention are complementary, with large gains only when combined. We further observe robust transfer to a second operator and concordant blinded field validations that surfaced previously unrecognized high-risk patients. While our contribution is a methodological instantiation rather than an architectural novelty, the work offers a careful case study of claims-only prediction at a national scale, design lessons for modeling sparse transactional health data, and practical evidence for its utility in real-world risk stratification.
