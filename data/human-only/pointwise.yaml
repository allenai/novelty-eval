'118':
  context: datasets and benchmarks
  idea: 'Large language models (LLMs) have demonstrated remarkable performance on single-turn text-to-SQL tasks, but real-world database applications predominantly require multi-turn interactions to handle ambiguous queries, execution errors, and evolving user requirements. Existing multi-turn benchmarks fall short of capturing this complexity, either by treating conversation histories as static context or by limiting evaluation to narrow, read-only (SELECT-ONLY) operations, thereby potentially failing to reflect the challenges encountered in production-grade database assistant. In this work, we introduce BIRD-INTERACT, a benchmark that restores this missing realism through: (1) a **comprehensive interaction environment** that couples each database with a hierarchical knowledge base, metadata files, and a function-driven user simulator, enabling models to solicit clarifications, retrieve knowledge, and recover from execution errors without human supervision; (2) two **evaluation settings** reflecting real-world interaction settings which contain a pre-defined conversational protocol (c-Interact) and a more open-ended agentic setting (a-Interact) in which the model autonomously decides when to query the user simulator or explore the DB environment; (3) a **challenging task suite** that covers the full CRUD spectrum for both business-intelligence and operational use cases, guarded by executable test cases. Each task features ambiguous and follow-up sub-tasks, requiring LLMs to engage in dynamic interaction. The suite is organized into two sets: a full set (BIRD-INTERACT-FULL) of 600 tasks which unfold up to 11,796 dynamic interactions for a comprehensive overview of performance and a lite set (BIRD-INTERACT-LITE) of 300 tasks, with simplified databases for detailed behavioral analysis of interactions, and fast development of methods.'
  label: POSITIVE
  metadata:
    area: datasets and benchmarks
    contribution: '3.25'
    negative_signals: []
    positive_signals:
    - The combination of CRUD support, HKB reasoning, and dynamic interaction is unique.
    - The paper addresses an important gap between single-turn text-to-SQL evaluation and real interactive database usage, providing a benchmark with clear practical relevance.
    - the paper makes text-to-SQL evaluation much more realistic. Instead of simple, one-shot questions, it creates a messy, back-and-forth conversation that forces models to ask clarifying questions and handle ambiguity, which is how people actually interact with databases. This is a huge and necessary step forward for the field.
