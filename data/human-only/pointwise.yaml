  idea: 'Evaluation metrics are the primary guide in modeling. For regression tasks, the R2 score is the gold standard, offering a magnitude-agnostic measure of accuracy that captures variance. However, R2 has three key limitations: it is limited to at most two dimensional inputs, it reduces the score to a single scalar that hides rich patterns of prediction accuracy, and it is sensitive to low-variance noise channels which can yield large, uninterpretable negative values. We introduce the Dimensional R2 score (Dim-R2), a simple extension of R2 that accepts data of arbitrary dimensionality, provides a multidimensional view of accuracy, and reduces sensitivity to noise. Dim-R2 offers an interpretable and flexible metric that illuminates patterns in regression accuracy, guiding regression modeling.'
