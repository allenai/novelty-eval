  idea: Reliable confidence estimation is crucial for safety-critical and human-in-the-loop applications, where users must trust individual AI decisions under uncertainty. Existing methods, ranging from softmax-based probabilities to uncertainty quantification techniques, fall short in providing reliable confidence scores. These scores often suffer from poor calibration, high computational costs, or lack of interpretability, making them less effective at the instance level. To overcome these limitations, we introduce $\textbf{KDE Trust}$, a post-hoc method that models class-conditional distributions of correct and incorrect predictions in the deep neural network's representation space. This yields a direct estimate of the posterior probability of correctness, $P(\text{correct}|\text{predicted}=c)$, without requiring architectural modifications. We also introduce a novel evaluation metric called Polarisation, which quantifies how close confidences scores are to 1 for correct classifications and 0 for incorrect ones, enabling human-centric interpretability.
