  metadata:
    area: applications to computer vision, audio, language, and other modalities
    contribution: '1.50'
    negative_signals:
    - The proposed ASR-guided semantic distillation into RVQ represents an incremental contribution rather than a major innovation.
    - This paper instead employs ASR-derived supervision, which is a different, but not fundamentally new.
    - Furthermore, the idea of using ASR-based supervision to make one stream or token layer more "content-like" is not novel, either.
    - The two-stage decoding approach is also incremental.
    - The major weakness is that the contribution of this paper appears incremental rather than novel.
    - its novelty in architectural design is limited, as the dual-Transformer separation between semantic understanding and acoustic generation has already been explored in prior works.
    - The overall novelty is limited. The main technical contributions—semantic distillation into the first codebook and the separation of semantic and acoustic transformers—are direct extensions of existing frameworks such as Mimi, SpeechTokenizer, and standard two-stage text-to-semantic-to-acoustic TTS pipelines.
