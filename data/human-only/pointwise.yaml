'252':
  context: interpretability and explainable AI
  idea: 'The fidelity with which neural networks can now generate content such as music presents a scientific opportunity: these systems appear to have learned implicit theories of such content''s structure through statistical learning alone. This offers a potentially new lens on theories of human-generated media. When internal representations align with traditional constructs (e.g. chord progressions in music), they show how such categories can emerge from statistical regularities; when they diverge, they expose limits of existing frameworks and patterns we may have overlooked but that nonetheless carry explanatory power. In this paper, focusing on autoregressive music generators, we introduce a method for discovering interpretable concepts using sparse autoencoders (SAEs), extracting interpretable features from the residual stream of a transformer model. We make this approach scalable and evaluable using automated labeling and validation pipelines. Our results reveal both familiar musical concepts and coherent but uncodified patterns lacking clear counterparts in theory or language. As an extension, we show such concepts can be used to steer model generations. Beyond improving model transparency, our work provides an empirical tool for uncovering organizing principles that have eluded traditional methods of analysis and synthesis.'
  label: POSITIVE
  metadata:
    area: interpretability and explainable AI
    contribution: '3.00'
    negative_signals: []
    positive_signals:
    - This is the first paper to perform concept discovery with SAE in pretrained music generators, and the results are much better compared to the previous probing works.
    - To the best of my knowledge, this is the first attempt to apply SAE-based interpretability to audio generation LM; this is a meaningful extension beyond NLP/vision that addresses an underexplored modality.
    - The use of SAEs to analyze music model activations is both original and conceptually clean.
    - It connects recent interpretability work (e.g., Anthropic's neuron-level SAE studies) to a new and highly complex modality.
    - The proposal to "steer" MusicGen by manipulating discovered features introduces an exciting bridge between interpretability and controllability—potentially enabling a new paradigm of interpretable generation.
    - distinguishing itself from traditional probing methods that rely on predefined human labels
    rating: '6.00'
