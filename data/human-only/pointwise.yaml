    positive_signals:
    - Moves from monomial/linear models to generic polynomial activations; formalizes critical exposure; delivers complete CNN singularity characterization.
    - Provides a clean algebraic–geometric framework for identifiability and singularity in deep networks with polynomial activations, extending prior results beyond monomials.
    - 'Finite identifiability for generic polynomials closes a dimension conjecture (dimension = #params) and generalizes known tanh/sigmoid cases to large-degree polynomials (Theorem 4.1).'
    - 'Novel geometric perspective: Connecting sparsity bias to singularities of neuromanifolds is creative and could provide new insights into the lottery ticket hypothesis.'
