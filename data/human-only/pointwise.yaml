'13':
  context: foundation or frontier models, including LLMs
  idea: Multimodal large language models (MLLMs) have shown remarkable potential in various domains, yet their application in the medical field is hindered by several challenges. General-purpose MLLMs often lack the specialized knowledge required for medical tasks, leading to uncertain or hallucinatory responses. Knowledge distillation from advanced models struggles to capture domain-specific expertise in radiology and pharmacology. Additionally, the computational cost of continual pretraining with large-scale medical data poses significant efficiency challenges. To address these issues, we propose InfiMed-Foundation-1.7B and InfiMed-Foundation-4B, two medical-specific MLLMs designed to deliver state-of-the-art performance in medical applications. We combined high-quality general-purpose and medical multimodal data and proposed a novel five-dimensional quality assessment framework to curate high-quality multimodal medical datasets. We employ low-to-high image resolution and multimodal sequence packing to enhance training efficiency, enabling the integration of extensive medical data. Furthermore, a three-stage supervised fine-tuning process ensures effective knowledge extraction for complex medical tasks. By addressing key challenges in data quality, training efficiency, and domain-specific knowledge extraction, our work paves the way for more reliable and effective AI-driven solutions in healthcare.
  label: NEGATIVE
  metadata:
    area: foundation or frontier models, including LLMs
    contribution: '1.50'
    negative_signals:
    - The paper lacks significant innovation; the main contributions are engineering-focused. The data preparation, CPT (Contrastive Pre-training), and SFT (Supervised Fine-Tuning) processes do not present new insights.
    - The proposed multi-stage pretraining and fine-tuning approach (i.e., the training recipe) is not really novel.
    - the sequence packing approach (to avoid wasting compute on padding tokens) and the the reduction in the number of image tokens, but neither approach are technically novel.
    - The proposed five-dimensional quality assessment framework lacks novelty and insight. Multiple prior works have already proposed multi-dimensional frameworks for evaluating data quality (e.g., data-centric AI literature, medical dataset curation papers). The authors fail to clearly articulate what is fundamentally new or superior about their specific five dimensions compared to existing frameworks. This contribution appears incremental rather than innovative.
    - Using adaptive average-pooling to reduce token count is well-established and not novel.
    - The methodological novelty is limited. The proposed pipeline primarily recombines established techniques such as continual pretraining, staged SFT, etc. The overall contribution feels like a well-engineered extension of existing systems (e.g., LLaVA-Med, MedGemma, Lingshu, Open-Qwen2VL) rather than a conceptually new framework.
