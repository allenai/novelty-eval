  idea: Intrusion detection systems (IDS) for 5G networks must deal with complex, high-volume traffic. Although opaque "black-box" models can achieve high accuracy, their lack of transparency hinders trust and effective operational response. We propose \emph{ExAI5G}, a framework that prioritizes interpretability by integrating a Transformer-based deep learning IDS with logic-based explainable AI (XAI) techniques. The framework uses Integrated Gradients to attribute feature importance and extracts a surrogate decision tree to derive logical rules. We introduce a novel evaluation methodology for LLM-generated explanations, using a powerful evaluator LLM to assess \textbf{actionability} and measuring their \textbf{semantic similarity} and \textbf{faithfulness}. By extracting logical rules with high fidelity, the framework makes the model's reasoning fully transparent. The approach demonstrates that it is possible to build a trustworthy and effective IDS without sacrificing performance for the sake of marginal gains from an opaque model.
