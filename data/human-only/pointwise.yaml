    - the method may be better characterized as a careful recombination of existing ideas rather than a fundamentally new contribution.
    - '**Insufficient novelty over RMT**: 2-view baseline is "conceptually related" to RMT yet no direct comparison. The 9.6 percentage point gain from 2-view alone (70% of total) suggests most improvement comes from RMT-like component, not novel contributions.'
