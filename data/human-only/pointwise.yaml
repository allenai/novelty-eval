'25':
  context: foundation or frontier models, including LLMs
  idea: 'Modern large language models (LLMs) driven by scaling laws achieve emergent intelligence in large model sizes. Recently, the increasing concerns about cloud costs, latency and privacy make it an urgent requirement to develop compact edge language models. Distinguished from direct pretraining that bounded by the scaling law, this work proposes the unified pruning-aware pretraining, focusing on retaining performance of much larger optimized models. It features following characteristics: 1) Data-Scalable Pruning: we introduce minimal parameter groups in LLM and continuously optimize structural pruning, extending post-training pruning methods like LLM-Pruner and SparseGPT into the pretraining phase. 2) Auto-Designed Architecture: the LLM architecture is auto-designed using saliency-driven pruning, which is the first time to exceed SoTA human-designed LLMs in modern pretraining. It achieves top-quality edge language models, termed EfficientLLM, by the unification stage of pruning, pretraining, and auto-architecture design. As the first attempt, EfficientLLM bridges the performance gap between post-training LLM compression and direct pretraining methods, and we fully open source EfficientLLM for future advancements.'
