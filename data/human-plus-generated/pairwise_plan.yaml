    0: '**purpose**: Enable advanced long-context reasoning in large language models, addressing the gap that reinforcement learning has enhanced short-context reasoning but the thinking patterns required for long-context reasoning remain unexplored and high-difficulty training data for this setting are scarce.

      **mechanism**: A data-driven reinforcement learning method called LoongRL, built around a synthesis approach named KeyChain. KeyChain transforms short multi-hop question-answering instances into high-difficulty long-context tasks by inserting UUID chains that conceal the true question among large collections of distracting documents. Solving these synthesized tasks requires the model to trace the correct chain step-by-step, identify the true question, retrieve relevant facts, and reason over them to produce a correct answer. Reinforcement learning training on KeyChain data induces an emergent plan–retrieve–reason–recheck reasoning pattern that generalizes well beyond the training context length, allowing models trained at shorter contexts to effectively handle much longer contexts without incurring the prohibitive rollout costs of full-length reinforcement learning.

      '
    1: '**purpose**: Address the intractability of targeted updates, error correction, and knowledge attribution in foundation models, which encode knowledge within monolithic parameter spaces requiring costly retraining. Enable surgical knowledge editing, mitigate catastrophic forgetting and temporal knowledge drift, improve factual accuracy through targeted corrections, and provide new forms of interpretability through knowledge circuit analysis, transforming foundation models into compositional systems where knowledge can be inspected, validated, and modified at granular levels.

      **mechanism**: A pretraining paradigm called Modular Knowledge Subspaces (MKS) that encourages foundation models to self-organize knowledge into disentangled, editable neural circuits. During pretraining, structured sparsity constraints and contrastive knowledge routing objectives guide different parameter subsets to specialize in distinct knowledge domains while preserving cross-domain reasoning capabilities. Each subspace maintains explicit routing metadata enabling precise knowledge attribution and selective modification. Surgical knowledge updates are performed through localized fine-tuning of individual subspaces without affecting others, retaining emergent abilities of large-scale pretraining while enabling continuously updatable models.

      '
