      **mechanism**: Algorithmic Circuit Discovery (ACD) automatically extracts interpretable computational subgraphs from trained neural networks and translates them into human-readable algorithmic descriptions. The framework combines causal intervention techniques to identify functionally meaningful circuit boundaries with sparse dictionary learning to decompose distributed representations into interpretable primitive operations. Program synthesis is then applied over the discovered circuits to generate structured pseudocode that captures the model''s actual reasoning process. The resulting algorithmic descriptions preserve causal relationships between intermediate computations, providing a principled mapping from opaque neural computations to transparent, verifiable algorithms.

      '
    1: '**purpose**: Enable broad understanding of finetuning-induced model weight changes in natural language. Finetuning updates a language model''s parametric knowledge, but the resulting weight modifications are not interpretable, and finetuning datasets are often unavailable or too large to inspect directly. The goal is to allow models to self-describe their own weight changes using concise natural language descriptions.

