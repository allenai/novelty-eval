      '
    1: '**purpose**: Understanding and deliberately cultivating visual priors—implicit knowledge about the visual world—that emerge within large language models during text-only pre-training. The research aims to characterize how these latent visual capabilities decompose into perception and reasoning components, identify their origins in different categories of pre-training data, reveal their distinct scaling behaviors, and leverage these insights to improve the construction of multimodal large language models.

