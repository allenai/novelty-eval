      **mechanism**: TrajFlow, a flow-matching-based generative model for GPS trajectory generation. It leverages the flow-matching paradigm to improve robustness and efficiency across multiple geospatial scales compared to diffusion-based approaches. It incorporates a trajectory harmonization and reconstruction strategy that jointly addresses scalability across spatial scales, diversity of transportation modes, and computational efficiency. This constitutes the first nationwide, multi-scale GPS trajectory generation model.

