    0: '**purpose**: Challenge the assumption that reasoning capabilities in small language models require training on extremely large corpora. Investigate whether strong reasoning abilities can emerge in sub-billion-parameter models using significantly less pre-training data than current prevailing practice.

      **mechanism**: Careful curation and resampling of open-source datasets identified as beneficial under specifically designed quality metrics, producing a high-quality subset of data. Pre-training sub-billion-parameter models on data resampled from this curated subset, followed by an established post-training procedure, to develop MobileLLM-R1, a series of sub-billion-parameter reasoning models. The complete training recipe, data sources, data mixing ratios, models, and code are released publicly to support reproducibility and further research.

      '
    1: '**purpose**: Enable surgical, continuous updates to foundation models without full-scale retraining, while preventing catastrophic forgetting, handling conflicting updates, and supporting interpretable attribution of model outputs to specific knowledge sources. The framework addresses the computational cost of retraining and key challenges in foundation model maintenance and governance.

      **mechanism**: Compositional Model Grafting introduces lightweight graft modules—small neural components encoding specific knowledge updates—organized in a modular library. A compositional router employing a structured attention mechanism over the graft library learns to dynamically invoke and combine grafts based on input context, enabling systematic generalization through explicit composition of atomic knowledge units. Grafts can be independently added, removed, or modified without altering the base model or other modules. Learned routing policies resolve conflicting updates, and the modular architecture enables interpretable attribution of outputs to specific knowledge sources.

      '
