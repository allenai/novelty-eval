  ideas:
    0: '**purpose**: Endow large language models with internalized verification capabilities for multi-step reasoning tasks, eliminating reliance on external verifiers or outcome-based supervision. The framework targets the gap between foundation models'' generative capabilities and the self-corrective reasoning exhibited by human experts, aiming to enable more reliable and interpretable reasoning through sample-efficient learning of metacognitive skills.

      **mechanism**: A dual-stream architecture called Reflexive Reasoning Networks, consisting of a generation stream that produces step-by-step reasoning traces and a verification stream that assesses intermediate steps for logical consistency, factual accuracy, and relevance. The two streams are coupled through a contrastive objective that trains the model to distinguish valid reasoning paths from subtly flawed alternatives, where flawed alternatives are generated through controlled perturbations of the model''s own outputs. Verification signals are derived from the model''s internal representations rather than external labels. The framework operates through iterative refinement loops in which verification assessments guide selective regeneration of problematic reasoning steps, enabling the model to detect and correct errors within its own reasoning process.

      '
    1: '**purpose**: Address the economic unsustainability of scaling multi-agent systems built on Vision-Language Models, where coordinating heterogeneous agents under information asymmetry causes spiraling costs. Existing coordination paradigms such as Mixture-of-Agents and knowledge-based routers rely on heuristic proxies that ignore costs and collapse uncertainty structure, resulting in provably suboptimal coordination. The goal is to enable cost-efficient, principled, and scalable coordination for economically viable multi-agent visual intelligence systems.

      **mechanism**: Agora reframes multi-agent coordination as a decentralized market for uncertainty. Epistemic uncertainty is formalized into structured, tradable asset categories—perceptual, semantic, and inferential—enabling agents to trade uncertainty based on rational economic rules that enforce profitability-driven collaboration. A market-aware broker, extending Thompson Sampling, initiates collaboration among agents and guides the system toward cost-efficient equilibria. This market-based coordination paradigm replaces heuristic proxies with principled economic mechanisms for scalable multi-agent visual reasoning.

      '
