    0: '**purpose**: Existing agent memory paradigms for LLM-powered agents are constrained: parametric memory forcibly adjusts model parameters, and retrieval-based memory externalizes experience into structured databases. Neither captures the fluid interweaving of reasoning and memory that underlies human cognition. The goal is to equip LLM-powered agents with a dynamic, human-like cognitive faculty that tightly integrates memory recall and augmentation throughout the reasoning process.

      **mechanism**: MemGen is a dynamic generative memory framework consisting of two components. A memory trigger monitors the agent''s reasoning state to decide when to explicitly invoke memory. A memory weaver takes the agent''s current state as a stimulus to construct a latent token sequence serving as machine-native memory, which enriches ongoing reasoning. This design enables agents to recall and augment latent memory throughout reasoning, producing a tightly interwoven cycle of memory and cognition. Notably, without explicit supervision, the framework spontaneously evolves distinct human-like memory faculties, including planning memory, procedural memory, and working memory, suggesting emergent trajectories toward more naturalistic forms of machine cognition.

      '
    1: '**purpose**: Enhance foundation language models to overcome limitations in systematic generalization, compositional reasoning, abstraction, logical consistency, and knowledge transfer across diverse reasoning domains. Current large language models rely on pattern matching and surface-level associations but fail at tasks requiring principled abstract reasoning and out-of-distribution generalization.

      **mechanism**: A schema memory module augments transformer-based language models to automatically extract, encode, and retrieve reusable abstract reasoning templates from training data and in-context examples. During inference, the model dynamically conditions generation on retrieved schemas, adapting them to novel problem instances through a lightweight cross-attention mechanism. This modular design explicitly separates learning abstract problem structures from instantiating them with specific content. The schema representations are differentiable and jointly optimized with the language model end-to-end, preserving full trainability while introducing structured inductive biases that bridge neural flexibility with compositional reasoning.

