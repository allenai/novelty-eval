    0: '**purpose**: Unify transfer learning, meta-learning, and lifelong learning into a single framework that overcomes limitations of treating these paradigms separately — namely indiscriminate transfer, adaptation without memory, and knowledge accumulation without selectivity — enabling AI systems to quickly adapt to novel tasks by selectively leveraging relevant past experience while maintaining stable long-term knowledge and preventing catastrophic forgetting.

      **mechanism**: A Selective Meta-Lifelong Learning framework comprising several integrated components: a structured episodic memory storing task representations; meta-level policies that determine which prior experiences to recruit for each new task; a compositional task encoder that discovers latent task structure to identify relevant subspaces of past knowledge while quarantining interference from dissimilar experiences; gated adaptation modules trained via meta-learning that selectively activate and compose relevant prior knowledge for rapid few-shot adaptation; and meta-learned consolidation strategies operating in task-relevant subspaces to support continual expansion of the knowledge base while preventing catastrophic forgetting through dynamic knowledge routing and learned task composition.

      '
    1: '**purpose**: Formalize and explain the gap between deep forgetting (loss of linearly separable feature representations) and shallow forgetting (classifier-level prediction failure) in continual learning with Experience Replay. Address the paradox that neural networks retain useful feature-space structure for past tasks even when output predictions degrade, and explain why minimal replay buffers suffice to preserve feature geometry but not classifier accuracy.

      **mechanism**: Extend the Neural Collapse framework to the sequential continual learning setting. Characterize deep forgetting as geometric drift of representations toward out-of-distribution subspaces and prove that any non-zero replay fraction asymptotically guarantees retention of linear separability. Identify that strong collapse induced by small buffers causes rank-deficient covariances and inflated class means, which blind the classifier to true population decision boundaries—explaining shallow forgetting. Unify continual learning with out-of-distribution detection to reframe the role of replay buffers, suggesting that explicitly correcting these statistical artifacts (rank deficiency and mean inflation) could enable robust continual learning performance with minimal replay.

