    0: '**purpose**: Investigate the inner mechanism of In-context Learning (ICL) in language models, specifically understanding how few-shot demonstrations guide models toward intended tasks, addressing the lack of clarity about why ICL works.

      **mechanism**: Adopt a novel information removal perspective to analyze ICL. First, demonstrate that in zero-shot settings, language models encode queries into non-selective hidden state representations containing information for all possible tasks, producing arbitrary outputs. Show that selectively removing specific information from hidden states via a low-rank filter effectively steers models toward intended tasks. Then, using carefully designed metrics applied to hidden states, observe that few-shot ICL naturally simulates this task-oriented information removal process by selectively stripping redundant information from entangled non-selective representations based on demonstrations. Further identify essential attention heads responsible for inducing this removal operation, termed Denoising Heads. Validate the mechanism through ablation experiments that block the information removal operation during inference, confirming the critical role of both the information removal mechanism and the identified denoising heads in enabling ICL.

      '
    1: '**purpose**: Automatically discover and linguistically ground interpretable features within foundation models, addressing the opacity of learned internal representations and eliminating the need for extensive manual annotation or domain expertise when analyzing what concepts neural networks learn and how they compose them for downstream reasoning.

