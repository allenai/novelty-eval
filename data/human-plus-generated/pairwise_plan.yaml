    0: '**purpose**: Addressing the performance degradation of diffusion models on minority classes when trained on imbalanced datasets, by identifying and tackling the previously underexplored factor of model capacity allocation. Majority classes monopolize a disproportionately large share of model capacity, restricting the ability to represent minority classes effectively.

      **mechanism**: Capacity Manipulation (CM) explicitly reserves model capacity for minority classes through low-rank decomposition of model parameters combined with a capacity manipulation loss. The low-rank decomposition separates the parameter space, and the capacity manipulation loss guides the allocation of appropriate capacity toward capturing minority class knowledge, thereby enhancing minority class representation. CM is designed to be complementary to existing methods for handling data imbalance, enabling further improvements in overall generation performance when combined with them. The approach is supported by both empirical experiments and theoretical analysis demonstrating how capacity allocation affects class-wise performance in diffusion models.

      '
    1: '**purpose**: Enable seamless transition between unsupervised, self-supervised, semi-supervised, and fully supervised representation learning within a single training paradigm, eliminating the need for fixed supervision strategies and manual hyperparameter tuning across different data regimes. The framework addresses scenarios with heterogeneous label availability, such as partially annotated datasets, streaming data with delayed labels, and federated learning with clients possessing varying annotation budgets, by treating supervision as a continuous spectrum rather than discrete categories.

      **mechanism**: Adaptive Supervision Weighting (ASW), a unified framework that dynamically weights multiple learning signals—including contrastive objectives, pseudo-labels, and ground-truth annotations—based on sample-specific confidence estimates and global training dynamics. A meta-learned gating mechanism evaluates the reliability of each supervision source in real-time, automatically discovering optimal supervision strategies. This enables the model to leverage all available learning signals while adapting to the evolving informativeness of each source, producing representations that are both generalizable and task-specific.

      '
