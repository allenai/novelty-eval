      '
    1: '**purpose**: Investigate the nature and function of Massive Activations (MAs) within Diffusion Transformers (DiTs) for visual generation, and leverage the resulting understanding to enhance local detail fidelity in generated images. Prior work has documented MAs in LLMs and ViTs, but their role in DiTs remains unexplored. The research targets the gap between understanding MAs in other Transformer architectures and their specific behavior and utility in diffusion-based image generation.

