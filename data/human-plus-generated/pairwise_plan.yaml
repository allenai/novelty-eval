  ideas:
    0: '**purpose**: Address the challenge of post-treatment selection in interventional causal discovery, where samples are selectively retained after interventions based on criteria such as quality control in biological studies. Post-treatment selection introduces spurious dependencies and distributional changes that mimic causal responses, distorting causal discovery results and undermining existing causal formulations, even beyond the confounding effects of latent variables.

      **mechanism**: A novel causal formulation that explicitly models post-treatment selection, leveraging the differential reactions of selection mechanisms to interventions to distinguish genuine causal relations from selection-induced patterns, enabling identification beyond traditional equivalence classes toward the true causal structure. Markov properties of this formulation are characterized, and a fine-grained interventional equivalence class (FI-Markov equivalence) is defined, represented by a new graphical diagram called F-PAG. A provably sound and complete algorithm, F-FCI, is developed to identify causal relations, latent confounders, and post-treatment selection up to FI-Markov equivalence using both observational and interventional data.

      '
    1: '**purpose**: Improving causal discovery from observational data by addressing fundamental identifiability issues and reducing reliance on strong structural assumptions, particularly in domains where expert knowledge is scarce but linguistic descriptions of causal mechanisms are abundant.

      **mechanism**: A hybrid framework that leverages pretrained large language models as sources of causal priors to guide structure learning algorithms. Qualitative causal knowledge—such as plausible direct causes, effect relationships, and causal orderings—is elicited from LLMs through carefully designed prompting strategies and translated into soft probabilistic constraints within a Bayesian causal discovery framework. A confidence calibration mechanism weights LLM-derived priors based on consistency checks and uncertainty quantification to address LLM unreliability. LLM knowledge is treated as defeasible guidance rather than hard constraints, allowing data-driven learning to override incorrect priors when sufficient evidence exists. This combines the sample efficiency of knowledge-driven methods with the empirical grounding of data-driven techniques.

      '
