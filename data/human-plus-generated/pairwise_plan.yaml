  ideas:
    0: '**purpose**: Address multi-agent visual hallucination snowballing in Multi-Agent Systems powered by Visual Language Models, where hallucinations originate in a single agent and are amplified by subsequent agents due to over-reliance on textual flow for relaying visual information, causing a progressive reduction in visual attention allocation across agent turns.

      **mechanism**: Turn-wise, layer-wise, and token-wise attention analyses reveal that a subset of vision tokens exhibiting a unimodal attention peak in middle layers best preserves visual evidence but gradually diminishes across deeper agent turns, driving hallucination snowballing. A lightweight, model-agnostic mitigation paradigm called ViF relays inter-agent messages through a Visual Flow constructed from selected visual relay tokens and applies attention reallocation to amplify the identified beneficial attention pattern, restoring visual grounding across successive agent interactions.

      '
