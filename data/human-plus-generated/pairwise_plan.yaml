  ideas:
    0: '**purpose**: Address the lack of explicit safety awareness in learning-based trajectory planners for autonomous driving, which rely heavily on expert demonstrations and risk inheriting undesirable behaviors such as speeding from suboptimal human driving data. Additionally, resolve a key limitation of applying Group Relative Policy Optimization (GRPO) to planning, where group-wise normalization erases cross-group scale differences, causing rare high-variance safety-violation groups to receive similar advantages as abundant low-variance safe groups, thereby suppressing optimization for safety-critical objectives.

      **mechanism**: A two-stage trajectory planning framework called Plan-R1 that decouples principle alignment from behavior learning. The first stage pre-trains a general trajectory predictor on expert data to capture diverse human-like driving behaviors. The second stage fine-tunes the model with rule-based rewards using GRPO, explicitly aligning ego planning with principles such as safety, comfort, and traffic rule compliance. To overcome the limitation of standard GRPO in planning, Variance-Decoupled GRPO (VD-GRPO) is introduced, which replaces group-wise normalization with centering and fixed scaling to preserve absolute reward magnitudes, ensuring that safety-critical objectives remain dominant throughout training.

      '
    1: '**purpose**: Address the tension between task completion and world model uncertainty in autonomous systems operating in novel environments. Existing planning approaches either assume known dynamics or treat exploration and exploitation as separate phases, limiting adaptability in unstructured settings. The goal is to enable autonomous systems to intelligently balance information gathering with goal pursuit, facilitating robust deployment in unfamiliar environments without requiring complete prior models or extensive offline training in every new domain.

      **mechanism**: Epistemic Planning Networks unify task-oriented planning with active model refinement through uncertainty-aware action selection. Deep ensemble dynamics models estimate epistemic uncertainty. Planning is formulated as a bilevel optimization problem where actions are selected to simultaneously reduce model uncertainty in task-relevant regions and progress toward goal states. A neural architecture learns to predict the information gain of candidate trajectories, enabling efficient online replanning as the dynamics model is refined through interaction. By explicitly reasoning about what the robot knows and what it needs to learn, the framework balances exploration and exploitation within a single integrated planning process.

      '
