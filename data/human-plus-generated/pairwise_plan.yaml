    0: '**purpose**: Estimating epistemic uncertainty in large language models at inference time without relying on expensive ensembles, multiple sampling passes, or external verifiers, addressing the problem of hallucinations that undermine trust in high-stakes applications such as open-domain question answering, medical diagnosis, and code generation.

      **mechanism**: Layerwise Uncertainty Estimation (LUE), a framework that analyzes geometric properties of hidden state trajectories across transformer layers during the forward pass. Uncertainty signals are constructed by measuring trajectory curvature and cross-layer alignment of representations, capturing how semantic refinement and representational consistency evolve through the model''s hierarchy. Increased curvature and reduced alignment indicate regions where the model extrapolates beyond its training distribution. A lightweight uncertainty predictor is trained on these geometric features via self-supervised pretraining on diverse prompts, producing calibrated confidence scores without modifying the base model or requiring labeled uncertainty data. This enables selective abstention and improved reliability with minimal computational overhead.

