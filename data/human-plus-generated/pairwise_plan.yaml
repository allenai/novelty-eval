  ideas:
    0: '**purpose**: Address the inability of large language models to handle temporal knowledge dynamics, where facts, scientific understanding, and societal contexts continuously evolve. Enable models to reason about knowledge evolution, answer counterfactual historical queries, and maintain multiple valid but temporally-distinct world models simultaneously, while preserving the general capabilities of the base foundation model.

      **mechanism**: Temporal Knowledge Channels (TKC), an architecture extending foundation models with parallel processing pathways that encode knowledge at different temporal states. Each channel maintains a lightweight adapter layer trained on time-stamped corpora. A learned gating mechanism routes queries through temporally-appropriate knowledge channels, embedding temporal awareness directly into the model''s computation graph rather than externalizing it through retrieval-augmented approaches. A temporal reasoning module learns to select and compose information across channels based on explicit or inferred temporal context, enabling structured temporal reasoning about when knowledge became true and how it changes over time.

      '
    1: '**purpose**: Measuring the in-context computational effort of language models, addressing the limitation that next-token loss fails to capture reasoning complexity and that prior methods based on latent state compressibility can be invasive and unstable. Additionally, enabling control over the computational character of generated text during decoding.

      **mechanism**: Multiple Token Divergence (MTD), a measure of computational effort defined as the KL divergence between a model''s full output distribution and that of a shallow, auxiliary prediction head. MTD is computed directly from pre-trained models equipped with multiple prediction heads, requiring no additional training. Building on MTD, Divergence Steering is introduced as a decoding method that controls the computational character of generated text by leveraging the divergence signal to steer generation toward desired levels of computational effort.

      '
