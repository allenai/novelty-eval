  ideas:
    0: '**purpose**: Reducing the prohibitive memory footprint of the Key-Value cache in Large Language Models when processing lengthy inputs. Existing token pruning methods are insufficient: static approaches risk irreversible information loss, and dynamic strategies rely on heuristics that fail to capture the query-dependent nature of token importance. The goal is to enable query-aware token eviction that dynamically and accurately predicts which tokens are salient.

      **mechanism**: A framework called FASA that exploits a novel insight into Rotary Position Embedding (RoPE): the discovery of functional sparsity at the frequency-chunk level. A small, identifiable subset of dominant frequency chunks consistently exhibits high contextual agreement with the full attention head, providing a computationally free proxy for estimating token importance. FASA first identifies a critical set of tokens using these dominant frequency chunks, then performs focused attention computation solely on the resulting pruned subset, achieving efficient and query-aware token eviction without additional computational overhead.

      '
    1: '**purpose**: Enable large language models to dynamically assimilate streaming information after deployment without costly retraining or architectural modifications, while preserving foundational pre-trained capabilities. The targeted limitation is the inability of foundation models to incorporate new knowledge post-deployment, addressing continual learning challenges such as temporal shifts, user-specific contexts, and private data streams without degrading performance on standard benchmarks.

      **mechanism**: Selective Neuroplasticity Networks (SNNs), a framework that learns a meta-policy to identify which model components—specific attention heads, feed-forward layers, or parameter subspaces—should adapt to new knowledge versus remain stable. Knowledge integration is modeled as a routing problem within the transformer architecture, creating dedicated pathways for new information that minimally interfere with existing representations. The meta-policy is trained via bi-level optimization to maximize both knowledge retention and integration across diverse continual learning scenarios. Unlike retrieval-augmented generation, which relies on external memory, this method internalizes new knowledge directly into model weights through selective, localized parameter updates.

      '
