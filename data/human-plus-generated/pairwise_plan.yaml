    0: '**purpose**: Understand how supervised fine-tuning and reinforcement learning shape the exploration strategies of Large Language Models in sequential decision-making tasks such as multi-armed bandits, and assess how well these learned strategies generalize. The research targets the gap in understanding whether improved average regret comes from genuine exploration improvement or from more sophisticated but greedier exploitation, and when each training paradigm is preferable.

      **mechanism**: Train LLMs using supervised fine-tuning on expert trajectories and reinforcement learning with a range of tailored reward signals, including a strategic regret-shaped reward designed to reduce variance and an algorithmic reward enabling oracle imitation of the UCB algorithm. Conduct behavioral analysis of the resulting agents to characterize their exploration-exploitation tradeoffs, measuring susceptibility to early catastrophic failure and premature abandonment of exploration. Evaluate whether agents trained to imitate UCB learn to outperform their teacher by adopting more exploitative variants. Advocate for tailored reward design and evaluation metrics beyond average regret to promote robust exploratory behavior.

      '
    1: '**purpose**: Enable large language models to develop explicit, reusable, and interpretable reasoning components that can be flexibly composed across diverse cognitive tasks, rather than relying on monolithic task-specific behaviors. The framework targets systematic generalization to novel reasoning compositions, provides interpretable intermediate states for analysis and debugging, and allows targeted improvement of specific reasoning capabilities without full model retraining, moving toward foundation models with human-aligned cognitive architectures.

      **mechanism**: A framework called Modular Reasoning Primitives introduces architectural constraints and specialized pre-training objectives that encourage the emergence of atomic reasoning operations—such as deductive inference, analogical mapping, and causal attribution—as discrete, steerable modules within the model''s computation graph. The approach combines three components: contrastive learning over reasoning traces to differentiate reasoning patterns, intervention-based training that isolates individual reasoning steps to ensure modularity, and a dynamic routing mechanism that selects and chains appropriate reasoning primitives for each query. Together, these components structure the model''s internal computation into composable, interpretable modules that can be independently analyzed and improved.

      '
