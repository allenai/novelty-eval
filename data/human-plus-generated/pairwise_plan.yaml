    0: '**purpose**: Address the information void problem in standard discrete diffusion models, where all masked tokens are mapped to an uninformative absorbing state, discarding global semantic information that could be inferred from unmasked tokens and passed between denoising steps.

      **mechanism**: Continuously Augmented Discrete Diffusion (CADD) augments the discrete state space by pairing it with a continuous latent diffusion process. Masked tokens are represented by noisy but informative continuous latent vectors instead of empty absorbing states, producing graded, gradually corrupted representations. During each reverse denoising step, the continuous latent serves as a semantic hint to guide discrete token prediction. The framework is designed to be compatible with existing discrete diffusion training procedures. At sampling time, the strength and choice of estimator for the continuous latent vector provide a controlled trade-off between mode-coverage (diversity-oriented generation) and mode-seeking (context-localization-oriented generation).

      '
    1: '**purpose**: Address the limitation that conventional generative models frequently violate fundamental physical principles such as conservation laws and governing equations, restricting their applicability in scientific domains including fluid dynamics, climate modeling, and materials design. Enable synthesis of physically plausible scientific data without requiring large-scale labeled datasets, supporting inverse problem solving and data augmentation in data-scarce scientific settings.

      **mechanism**: Physics-Informed Latent Diffusion (PILD) embeds differential equation constraints as soft regularizers within the denoising trajectory of a latent diffusion model, steering generation toward physically consistent manifolds. A hybrid architecture combines a learned latent space with differentiable physics operators, allowing the model to respect conservation laws while retaining expressive generative capacity. The framework supports conditional generation guided by partial observations or boundary conditions, unifying data-driven generation with physics-based modeling to produce realistic, physically grounded samples suitable for accelerating scientific discovery and simulation-based inference.

      '
