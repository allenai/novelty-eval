    0: '**purpose**: Address the consensus failure problem in Federated Graph-level Clustering caused by existing methods failing to simultaneously handle knowledge heterogeneity across intra-client and inter-client boundaries, where indiscriminate sharing of as much knowledge as possible leads to degraded server-side aggregation.

      **mechanism**: A Federated Graph-level Clustering Network with Dual Knowledge Separation (FGCN-DKS) that decouples differentiated subgraph patterns and optimizes them separately. On the client side, each graph is separated into personalized subgraphs and cluster-oriented subgraphs. Personalized subgraphs are retained locally to refine the clustering process, while pattern digests extracted from cluster-oriented subgraphs are uploaded to the server. On the server side, inter-cluster pattern relations are computed to adaptively aggregate cluster-oriented prototypes and parameters. The server then generates personalized guidance signals for each cluster of clients, which are sent back to local clients to enhance overall clustering performance.

      '
    1: '**purpose**: Unify self-supervised, semi-supervised, and fully supervised representation learning into a single adaptive framework that avoids conflicts between distinct training objectives, handles varying label budgets, and produces representations that simultaneously preserve unsupervised structure discovery and supervised task performance, enabling seamless transfer across tasks requiring different levels of invariance.

