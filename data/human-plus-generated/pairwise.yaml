    0: Fine-grained recognition tasks often encounter instances where individual modalities provide ambiguous or conflicting evidence. We introduce Adaptive Multimodal Routing (AMR), a framework that learns to dynamically allocate computational resources and fusion weights across vision, audio, and language modalities based on instance-specific uncertainty. Unlike conventional multimodal fusion approaches that apply uniform integration strategies, AMR employs a lightweight meta-network that predicts modality reliability scores by analyzing intermediate representations from each encoder. These scores guide both the depth of processing within each modality-specific branch and the contribution of each modality to the final prediction. The framework incorporates a confidence-aware training objective that encourages the model to recognize when certain modalities are uninformative and to gracefully degrade by relying on available evidence. By learning toRoute computation through the most informative pathways, AMR achieves robust recognition across diverse scenarios including cryptic species identification, multi-speaker speech recognition in noisy environments, and cross-modal retrieval tasks where query and target modalities may differ.
    1: 'Large visual language models (VLMs) have shown strong multi-modal medical reasoning ability, but most operate as end-to-end black boxes, diverging from clinicians'' evidence-based, staged workflows and hindering clinical accountability. Complementarily, expert visual grounding models can accurately localize regions of interest (ROIs), providing explicit, reliable evidence that improves both reasoning accuracy and trust. In this paper, we introduce **CARE**, advancing **C**linical **A**ccountability in multi-modal medical **R**easoning with an **E**vidence-grounded agentic framework. Unlike existing approaches that couple grounding and reasoning within a single generalist model, CARE decomposes the task into coordinated sub-modules to reduce shortcut learning and hallucination: a compact VLM proposes relevant medical entities; an expert entity-referring segmentation model produces pixel-level ROI evidence; and a grounded VLM reasons over the full image augmented by ROI hints. The VLMs are optimized with reinforcement learning with verifiable rewards to align answers with supporting evidence. Furthermore, a VLM coordinator plans tool invocation and reviews evidence-answer consistency, providing agentic control and final verification. Our framework demonstrates that an agentic approach that emulates clinical workflows, incorporating decoupled specialized models and explicit evidence, yields more accurate and accountable medical AI.'
