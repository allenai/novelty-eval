  ideas:
    0: "The Private Aggregation of Teacher Ensembles (PATE) framework enables privacy-preserving machine learning by aggregating responses from disjoint subsets of sensitive data. Adaptations of PATE to tasks with inherent output diversity such as text generation, where the desired output is a sample from a distribution, face a core tension: \nas diversity increases, samples from different teachers are less likely to agree, but lower agreement results in reduced utility for the same privacy requirements. Yet suppressing diversity to artificially increase agreement is undesirable, as it distorts the output of the underlying model, and thus reduces output quality.\n\nWe propose Hot PATE, a variant of PATE designed for diverse generative settings. \nWe formalize the notion of a *diversity-preserving* *ensemble sampler* and introduce an efficient sampler that provably transfers diversity without incurring additional privacy cost.\nHot PATE requires only API access to proprietary models and can be used as a drop-in replacement for existing *Cold* PATE samplers."
    1: Aligning language models with human values through reinforcement learning and preference feedback has become standard practice, yet these methods often encode the preferences of dominant demographic groups while systematically constraining outputs for marginalized populations. We introduce Fairness-Aware Latent Alignment (FALA), a framework that performs real-time distributional auditing of representation space during alignment training. FALA monitors how safety constraints and value alignment differentially affect the geometry of embeddings across demographic contexts, identifying when alignment procedures create asymmetric restrictions that limit beneficial outputs for specific groups. By decomposing the latent space into demographic-conditioned subspaces and tracking their evolution during training, we enable intervention strategies that preserve safety guarantees while ensuring equitable expressiveness. Our approach introduces controllable regularization mechanisms that prevent alignment from disproportionately collapsing the representation capacity for underrepresented perspectives. This work bridges alignment and fairness research, demonstrating that responsible AI systems require monitoring not just final outputs, but the geometric properties of intermediate representations that determine which voices can be authentically expressed.
