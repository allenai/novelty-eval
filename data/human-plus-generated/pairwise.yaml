  ideas:
    0: 'The rapid integration of agentic AI into high-stakes real-world applications requires robust oversight mechanisms. The emerging field of AI Control (AIC) aims to provide such an oversight mechanism, but practical adoption depends heavily on implementation overhead. To study this problem better, we introduce the notion of Control tax---the operational and financial cost of integrating control measures into AI pipelines. Our work makes three key contributions to the field of AIC: (1) we introduce a theoretical framework that quantifies the Control Tax and maps classifier performance to safety assurances; (2) we formalize adversarial settings where attacker models insert subtle backdoors into code while monitoring models attempt to detect these vulnerabilities; and (3) we provide empirical financial cost estimates for control protocols and develop optimized monitoring strategies that balance safety and cost-effectiveness while accounting for practical constraints like auditing budgets. Our framework enables practitioners to make informed decisions by systematically connecting safety guarantees with their costs, advancing AIC through principled economic feasibility assessment across different deployment contexts.'
    1: Responsible AI deployment requires simultaneously satisfying multiple ethical constraints—alignment with human values, demographic fairness, privacy preservation, and safety—yet current approaches treat these as independent objectives, often leading to unforeseen trade-offs and conflicts. We introduce Geometric Ethics Embeddings, a framework that learns representation spaces where multiple ethical constraints are encoded as intrinsic geometric properties rather than post-hoc corrections. Our approach employs a novel multi-manifold learning objective that structures the latent space such that privacy-preserving perturbations align with fairness-invariant directions, while value-aligned features occupy orthogonal subspaces. By formalizing ethical constraints as structural properties of the embedding geometry, we enable models to satisfy multiple desiderata through their learned representations rather than through conflicting optimization pressures. This geometric perspective reveals fundamental compatibilities and tensions between different ethical requirements, providing a principled foundation for analyzing trade-offs. The resulting embeddings serve as drop-in replacements for standard representations in downstream tasks while maintaining provable guarantees across privacy, fairness, and alignment dimensions simultaneously.
