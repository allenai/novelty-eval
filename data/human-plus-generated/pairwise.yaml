    0: Modern machine learning benchmarks primarily assess pattern recognition capabilities but fail to rigorously evaluate compositional generalization—the ability to understand and recombine primitive concepts in novel configurations. We introduce CompoGen, a dynamic benchmark framework that systematically tests whether models truly learn compositional structure or merely memorize training distributions. CompoGen constructs evaluation instances by explicitly separating primitive elements from their compositional rules, then generating test cases that require novel recombinations unseen during training. The framework spans multiple modalities including vision, language, and structured reasoning, with difficulty levels that adapt based on model performance to maintain meaningful signal throughout training. Unlike static benchmarks, CompoGen provides a curriculum of increasingly complex compositional challenges, revealing whether improvements stem from genuine structural understanding or superficial correlation exploitation. By tracking performance across primitive complexity and composition depth independently, CompoGen enables fine-grained diagnosis of model capabilities and failures, offering researchers a principled tool for developing architectures with stronger inductive biases toward systematic generalization.
    1: Online services rely on CAPTCHAs as a first line of defense against automated abuse, yet recent advances in multi-modal large language models (MLLMs) have eroded the effectiveness of conventional designs that focus on text recognition or 2D image understanding. To address this challenge, we present **Spatial CAPTCHA**, a novel human-verification framework that leverages fundamental differences in spatial reasoning between humans and MLLMs. Unlike existing CAPTCHAs that rely on low-level perception tasks vulnerable to modern AI, Spatial CAPTCHA generates dynamic questions requiring geometric reasoning, perspective-taking, occlusion handling, and mental rotation—skills intuitive for humans but difficult for current AI systems. The system employs a procedural generation pipeline with constraint-based difficulty control, automated correctness verification, and human-in-the-loop validation to ensure scalability, robustness, and adaptability. We also introduce a corresponding benchmark, **Spatial-CAPTCHA-Bench**, to support systematic assessment of spatial reasoning capabilities in both humans and AI systems.
