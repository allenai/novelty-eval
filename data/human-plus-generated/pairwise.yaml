    0: Standard discrete diffusion models treat all unobserved states the same way, typically mapping them to an absorbing [MASK] token. This creates an "information void" where global semantic information that may be inferred for the masked tokens from the unmasked tokens is not directly passed from one denoising step to another. We introduce **Continuously Augmented Discrete Diffusion (CADD)**, a framework that augments the discrete state space with a paired diffusion in a continuous latent space. This yields graded, gradually corrupted states in which masked tokens are represented by noisy yet informative latent vectors rather than information voids. At each reverse step, CADD uses the continuous latent as a semantic hint to guide discrete denoising. The design is clean and compatible with existing discrete diffusion training. At sampling time, the strength and estimator of the continuous latent vector enables a controlled trade-off between mode-coverage (diversity-oriented) and mode-seeking (context-localization-oriented).
    1: We introduce Physics-Informed Latent Diffusion (PILD), a generative framework that synthesizes physically plausible scientific data by embedding conservation laws and governing equations directly into the diffusion process. While conventional generative models excel at capturing statistical patterns, they frequently violate fundamental physical principles, limiting their utility in scientific applications such as fluid dynamics, climate modeling, and materials design. PILD incorporates differential equation constraints as soft regularizers within the denoising trajectory, steering the generation process toward physically consistent manifolds without requiring large-scale labeled datasets. We employ a hybrid architecture that combines a learned latent space with differentiable physics operators, enabling the model to respect conservation laws while maintaining expressive generative capacity. The framework supports conditional generation guided by partial observations or boundary conditions, facilitating inverse problem solving and data augmentation in data-scarce scientific domains. By unifying data-driven generation with physics-based modeling, PILD provides a principled approach to synthesizing realistic, physically grounded samples that can accelerate scientific discovery and enhance simulation-based inference workflows.
