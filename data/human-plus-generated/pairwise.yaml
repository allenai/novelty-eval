    0: Existing causal discovery methods are fundamentally limited by the assumption of a static causal graph, a constraint that fails in real-world systems where causal relationships dynamically vary with underlying system parameters. This discrepancy prevents the application of causal discovery in critical domains such as industrial process control, where understanding how causal effects change is essential. We address this gap by proposing a new paradigm that moves beyond static graphs to learn functional causal representations. We introduce a framework that models each causal link not as a static weight but as a function of measurable system parameters. By representing these functions using Polynomial Chaos Expansions (PCE), we develop a tractable method to learn the complete parametric causal structure from observational data. We provide theoretical proofs for the identifiability of these functional models and introduce a novel, provably convergent learning algorithm that provides an interpretable model of how causal mechanisms evolve.
    1: 'Causal reasoning remains challenging for modern AI systems, particularly when interventional data is unavailable and domain knowledge exists primarily in unstructured text. We introduce CausalLM, a framework that extracts and operationalizes causal structure from pretrained language models to guide differentiable causal discovery. Our approach recognizes that language encodes rich causal information through temporal markers, counterfactual constructions, and explanatory discourse patterns that remain underutilized in traditional causal inference pipelines. CausalLM employs a multi-stage architecture: causal relation extractors identify potential cause-effect pairs from text using contextualized attention, a differentiable directed acyclic graph module structures these relations while respecting acyclicity constraints, and a consistency objective aligns linguistic causal cues with learned graph topology. By grounding neural causal discovery in linguistic knowledge, the framework enables causal reasoning in domains where randomized experiments are impractical but extensive textual descriptions exist—from clinical medicine to policy analysis. The resulting causal graphs capture domain-specific mechanisms while maintaining interpretability, bridging the gap between scalable neural learning and rigorous causal inference without requiring explicit interventional data.'
