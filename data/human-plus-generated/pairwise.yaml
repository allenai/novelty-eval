    0: Next token prediction has been the standard training objective used in large language model pretraining. Representations are learned as a result of optimizing for token-level perplexity. We propose Continuous Concept Mixing (CoCoMix), a novel pretraining framework that combines discrete next token prediction with continuous concepts. Specifically, CoCoMix predicts "continuous concepts" learned from a pretrained sparse autoencoder and mixes them into the model's hidden state by interleaving with token hidden representations. We find that combining both concept learning and interleaving in an end-to-end framework is critical to performance gains. Furthermore, CoCoMix enhances interpretability and steerability by allowing direct inspection and modification of the predicted concept, offering a transparent way to guide the model's internal reasoning process.
    1: We introduce Neurosymbolic Scaffolding, a framework that augments foundation models with the ability to dynamically construct and reason over explicit symbolic structures during inference. While large language models excel at pattern recognition and generation, they struggle with tasks requiring verifiable logical reasoning, systematic composition, and adherence to formal constraints. Our approach addresses this by introducing a lightweight learned module that enables models to externalize intermediate reasoning steps into structured symbolic representations—including knowledge graphs, constraint satisfaction problems, and logic programs—while maintaining end-to-end differentiability. The symbolic scaffold operates as a scratchpad where the model can perform explicit operations guided by learned policies, bridging the gap between neural fluency and symbolic rigor. Through parameter-efficient adaptation, we integrate this capability into pre-trained foundation models without full retraining. This neurosymbolic extension enables provable correctness guarantees, interpretable reasoning traces, and natural incorporation of domain expertise through symbolic constraints, while preserving the models' general-purpose capabilities and scaling properties. Our framework opens new possibilities for trustworthy AI systems that combine the flexibility of neural networks with the verifiability of symbolic reasoning.
