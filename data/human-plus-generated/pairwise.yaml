    0: Modern benchmarks suffer from rapid saturation and hidden shortcuts that allow models to achieve high scores without genuine understanding. We introduce Adaptive Adversarial Benchmarks, a framework where evaluation datasets co-evolve with model capabilities through continuous adversarial example discovery. Our approach maintains a dynamic test set that automatically identifies and incorporates challenging instances where state-of-the-art models fail, while retiring examples that become too easy. A difficulty calibration mechanism ensures the benchmark remains neither trivially easy nor impossibly hard, tracking a frontier of model capabilities over time. Unlike static benchmarks that measure absolute performance on fixed data, our framework evaluates robustness to distributional shifts and genuine generalization by explicitly targeting learned shortcuts and spurious correlations. The benchmark maintains versioned snapshots for reproducibility while the live version evolves, providing both historical comparisons and forward-looking challenges. This paradigm shift from static to dynamic evaluation enables more meaningful progress tracking and incentivizes development of robust, generalizable models rather than benchmark-specific optimization.
    1: 'Fingerspelling plays a vital role in sign languages, particularly for conveying names, technical terms, and words not found in the standard lexicon. However, evaluation of two-handed fingerspelling detection and recognition is rarely addressed in existing sign language datasets—particularly for BANZSL (British, Australian, and New Zealand Sign Language), which share a common two-handed manual alphabet. To bridge this gap, we curate a large-scale dataset, dubbed BANZ-FS, focused on BANZSL fingerspelling in both controlled and real-world environments. Our dataset is compiled from three distinct sources: (1) live sign language interpretation in news broadcasts, (2) controlled laboratory recordings, and (3) diary vlogs from online platforms and social media. This composition enables BANZ-FS to capture variations in signing tempos and fluency across diverse signers and contents. Each instance in BANZ-FS is carefully annotated with multi-level alignment: video ↔ subtitles, video ↔ fingerspelled letters, and video ↔ target lexicons. In total, BANZ-FS includes over 35,000 video-aligned fingerspelling instances. Importantly, BANZ-FS highlights the unique linguistic and visual challenges posed by two-handed fingerspelling, including handshape coarticulation, self-occlusion, intra-letter variation, and rapid inter-letter transitions. BANZ-FS supports key tasks including fingerspelling detection, isolated fingerspelling recognition, and fingerspelling recognition in context, presenting substantial challenges while offering rich opportunities for BANZSL understanding and broader sign language technology.'
