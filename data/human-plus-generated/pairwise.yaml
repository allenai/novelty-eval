    0: 'The paradigm shift in large language models (LLMs) from instinctive responses to chain-of-thought (CoT) reasoning has fueled two prevailing assumptions: (1) reasoning capabilities only emerge in sufficiently large models, and (2) such capabilities require training on massive datasets. While the first assumption has already been challenged by recent sub-billion-parameter reasoning models such as Qwen3-0.6B and DeepSeek distilled variants, the second remains largely unquestioned. In this work, we revisit the necessity of scaling to extremely large corpora (>10T tokens) for reasoning emergence. By carefully curating and resampling open-source datasets that we identify as beneficial under our designed metrics, we demonstrate that strong reasoning abilities can emerge with far less data. Specifically, we show that only ~2T tokens of high-quality data are sufficient, and pre-training with 4.2T tokens on the dataset resampled from these ~2T tokens, followed by an established post-training procedure, enables the development of MobileLLM-R1, a series of sub-billion-parameter reasoning models. To facilitate further research in this direction, we have made the models and code publicly available, along with the complete training recipe, data sources, and data mixing ratios.'
    1: Foundation models require frequent updates to incorporate new knowledge, correct errors, and adapt to evolving domains, yet full-scale retraining remains computationally prohibitive. We introduce Compositional Model Grafting, a framework that enables surgical updates to foundation models through dynamically composable knowledge modules. Rather than fine-tuning monolithic parameters, our approach learns lightweight graft modules—small neural components encoding specific knowledge updates—alongside a compositional router that learns to invoke and combine grafts based on input context. The router employs a structured attention mechanism over a library of grafts, enabling systematic generalization through explicit composition of atomic knowledge units. Grafts can be added, removed, or modified independently without affecting the base model or other modules, preventing catastrophic forgetting while supporting continuous knowledge injection. This modular architecture naturally handles conflicting updates through learned routing policies and enables interpretable attribution of model outputs to specific knowledge sources, addressing key challenges in foundation model maintenance and governance.
