    0: 'In this paper, we identify that the key criterion for determining whether a model is truly capable of novel view synthesis (NVS) is transferability: Whether any pose representation extracted from one video sequence can be used to re-render the same camera trajectory in another. We analyze prior work on self-supervised NVS and find that their predicted poses do not transfer: The same set of poses lead to different camera trajectories in different 3D scenes. Here, we present XFactor, the first geometry-free self-supervised model capable of true NVS. XFactor combines pair-wise pose estimation with a simple augmentation scheme of the inputs and outputs that jointly enables disentangling camera pose from scene content and facilitates geometric reasoning. Remarkably, XFactor achieves transferability with unconstrained latent pose variables, without any 3D inductive biases or concepts from multi-view geometry — such as an explicit parameterization of poses as elements of SE(3). We introduce a new metric to quantify transferability.'
    1: We introduce Multimodal Program Synthesis (MPS), a framework that treats structured symbolic representations as a core modality alongside vision, audio, and language. While existing multimodal models align perceptual signals through shared embedding spaces, they struggle with tasks requiring precise compositional reasoning about spatial relations, temporal causality, and counterfactual scenarios. MPS addresses this by learning to translate multimodal inputs into executable procedural programs that explicitly represent scene structure, object interactions, and temporal dynamics. These programs serve as differentiable intermediate representations that facilitate systematic generalization and interpretable reasoning. Our approach employs a neural program synthesizer that jointly attends to visual, acoustic, and linguistic features while generating structured code in a domain-specific language. The resulting programs can be executed, verified, and manipulated to answer complex queries about causal relationships and hypothetical interventions. By treating symbolic reasoning as a learned modality rather than a post-processing step, MPS unifies perception and structured inference within a single end-to-end trainable architecture, opening new possibilities for compositional multimodal understanding.
