    0: We introduce a framework for learning energy correction operators that elevate computationally efficient semi-empirical quantum chemistry methods to near-ab-initio accuracy. Traditional molecular simulations face a critical trade-off between the physical fidelity of expensive density functional theory calculations and the speed of approximate methods. Our approach employs equivariant graph neural networks as delta-learning operators that predict spatially-resolved energy corrections while preserving rotational, translational, and permutational symmetries. By learning only the difference between theory levels rather than the full potential energy surface, the model requires significantly less training data and exhibits improved generalization across diverse molecular systems. We incorporate physical constraints through a novel architecture that ensures energy conservation and smooth force fields suitable for stable molecular dynamics integration. The framework enables researchers to perform long-timescale simulations of complex chemical systems—including protein folding, catalytic reactions, and materials degradation—at a fraction of the computational cost while maintaining quantum mechanical accuracy where it matters most.
    1: 'We introduce Kolmogorov–Arnold Neural Operator (KANO), a dual‑domain neural operator jointly parameterized by both spectral and spatial bases with intrinsic symbolic interpretability. We theoretically demonstrate that KANO overcomes the pure-spectral bottleneck of Fourier Neural Operator (FNO): KANO remains expressive over a generic position-dependent dynamics for any physical input, whereas FNO stays practical only to spectrally sparse operators and strictly imposes fast-decaying input Fourier tail.'
