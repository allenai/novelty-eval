    0: Classical learning theory analyzes generalization through capacity measures like VC dimension or Rademacher complexity, treating the hypothesis class as static. However, in deep learning, the effective hypothesis class dynamically evolves during training as gradient-based optimization interacts with architectural inductive biases. We introduce the concept of *trajectory-conditional function classes*—subsets of functions reachable via gradient descent from random initialization for a given architecture. We develop a theoretical framework characterizing how architectural primitives (self-attention, convolution, skip connections) induce distinct geometric constraints on optimization trajectories in function space, creating implicit restrictions beyond mere parameterization. Our analysis reveals that architectures with different inductive biases can have identical expressivity yet learn fundamentally different solution manifolds under standard training. We prove separation results showing functions efficiently learnable by one architecture require exponentially longer training or different initialization schemes for others, even when both can represent the target function. This perspective unifies observations about implicit regularization, feature learning dynamics, and architectural generalization gaps under a single trajectory-centric lens.
    1: 'Finding the right initialisation for neural networks is crucial to ensure smooth training and good performance. In transformers, the wrong initialisation can lead to one of two failure modes of self-attention layers: rank collapse, where all tokens collapse into similar representations, and entropy collapse, where highly concentrated attention scores lead to training instability. While previous work has studied different scaling regimes for transformers, an asymptotically exact, down-to-the constant prescription for how to initialise transformers has so far been lacking. Here, we provide an analytical theory of signal propagation through deep transformers with self-attention, layer normalisation, skip connections and MLP. Our theory yields a simple algorithm to compute trainability diagrams that identify the correct choice of initialisation hyper-parameters for a given architecture. We overcome the key challenge, an exact treatment of the self-attention layer, by establishing a formal parallel with the Random Energy Model from statistical physics. We also analyse gradients in the backward path and determine the regime where gradients vanish at initialisation. Our theoretical framework gives a unified perspective on the two failure modes of self-attention and gives quantitative predictions on the scale of both weights and residual connections that guarantee smooth training.'
