    0: Modern deep learning systems achieve remarkable performance but remain opaque black boxes, limiting trust and adoption in critical applications. We propose Neural Concept Reasoners, a framework that integrates differentiable language models as explicit reasoning modules within neural architectures. Rather than generating post-hoc explanations, our approach trains vision-language systems to produce natural language rationales as an intermediate computational step toward final predictions. The language model receives perceptual representations and generates structured reasoning traces that are both human-readable and causally necessary for downstream decisions. Through a combination of supervised concept annotations and self-consistency objectives, we ensure that generated explanations are faithful to the model's actual decision process rather than plausible confabulations. The framework supports intervention and counterfactual analysis by allowing users to edit reasoning traces and observe effects on predictions. By treating natural language as a computational medium rather than merely an output modality, Neural Concept Reasoners unify high model capacity with inherent interpretability, enabling transparent reasoning in complex multimodal tasks while maintaining competitive accuracy.
    1: We propose Low-Rank Sparse Attention (Lorsa), a sparse replacement model of Transformer attention layers to disentangle original Multi Head Self Attention (MHSA) into individually comprehensible components. Lorsa is designed to address the challenge of \textit{attention superposition} to understand attention-mediated interaction between features in different token positions. Lorsa helps find cleaner and finer-grained versions of previously discovered MHSA behaviors like induction heads, successor heads, attention sink, and a comprehensive family of arithmetic-specific Lorsa heads. Interestingly, we identify a novel head type called \emph{subtoken induction heads} that function at character level rather than token level. We also conduct extensive experiments on architectural design ablation, correlation to original MHSA heads and error analysis. Our early attempt to fully sparsify a toy Transformer succeeds to reveal clean global circuits. Eventually, we hope Lorsa would help us greatly understand attention computation and enable full sparsification of model computation along with its MLP counterparts.
