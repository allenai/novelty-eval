    0: 'Agent memory shapes how Large Language Model (LLM)-powered agents, akin to the human brain, progressively refine themselves through environment interactions. Existing paradigms remain constrained: parametric memory forcibly adjusts model parameters, and retrieval-based memory externalizes experience into structured databases, yet neither captures the fluid interweaving of reasoning and memory that underlies human cognition. To address this gap, we propose MemGen, a dynamic generative memory framework that equips agents with a human-esque cognitive faculty. It consists of a \textit{memory trigger}, which monitors the agent''s reasoning state to decide explicit memory invocation, and a \textit{memory weaver}, which takes the agent''s current state as stimulus to construct a latent token sequence as machine-native memory to enrich its reasoning. In this way, MemGen enables agents to recall and augment latent memory throughout reasoning, producing a tightly interwoven cycle of memory and cognition. More importantly, we find that without explicit supervision, MemGen spontaneously evolves distinct human-like memory faculties, including planning memory, procedural memory, and working memory, suggesting an emergent trajectory toward more naturalistic forms of machine cognition.'
    1: We introduce Schema-Grounded Language Models, a novel architecture that enhances foundation models with explicit mechanisms for learning and applying abstract reasoning patterns. While contemporary LLMs excel at pattern matching and surface-level associations, they struggle with systematic generalization and compositional reasoning tasks that require principled abstraction. Our approach augments transformer-based models with a schema memory module that automatically extracts, encodes, and retrieves reusable reasoning templates from training data and in-context examples. During inference, the model dynamically conditions its generation on retrieved schemas, adapting them to novel problem instances through a lightweight cross-attention mechanism. This modular design enables explicit separation between learning abstract problem structures and instantiating them with specific content, facilitating better out-of-distribution generalization. The schema representations remain differentiable and are jointly optimized with the language model, preserving end-to-end trainability while introducing structured inductive biases. By bridging neural flexibility with compositional reasoning, our framework addresses fundamental limitations in how foundation models handle abstraction, logical consistency, and knowledge transfer across diverse reasoning domains.
