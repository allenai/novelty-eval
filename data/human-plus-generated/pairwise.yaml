    0: Neural activity patterns vary substantially across individuals, recording modalities, and experimental paradigms, limiting the generalizability of brain decoding models. We introduce NeuralFM, a foundation model approach that learns unified representations from heterogeneous neuroimaging data spanning multiple subjects, tasks, and recording techniques. By leveraging contrastive learning across aligned stimulus presentations and self-supervised objectives on unlabeled neural recordings, NeuralFM discovers modality-invariant neural codes that capture both stimulus-driven and spontaneous brain dynamics. The model employs a novel architecture combining spatiotemporal transformers with cross-modal attention mechanisms to handle the diverse sampling rates, spatial resolutions, and noise characteristics inherent to different neuroimaging modalities. Once pretrained, NeuralFM serves as a versatile encoder for downstream applications including zero-shot neural response prediction to novel stimuli, cross-subject transfer learning for clinical populations with limited data, and interpretable mapping between artificial network representations and biological neural codes. This approach enables systematic investigation of computational principles shared across brains while respecting individual variability, opening new avenues for both basic neuroscience research and clinical neuroimaging applications.
    1: 'Enabling natural communication through brain–computer interfaces (BCIs) remains one of the most profound challenges in neuroscience and neurotechnology. While existing frameworks offer partial solutions, they are constrained by oversimplified semantic representations and a lack of interpretability. To overcome these limitations, we introduce **Semantic Intent Decoding (SID)**, a novel framework that translates neural activity into natural language by modeling meaning as a flexible set of compositional semantic units.

      SID is built on three core principles: semantic compositionality, continuity and expandability of semantic space, and fidelity in reconstruction.

      We present **BrainMosaic**, a deep learning architecture implementing SID. BrainMosaic decodes multiple semantic units from EEG/SEEG signals using set matching and then reconstructs coherent sentences through semantic-guided reconstruction.

      This approach moves beyond traditional pipelines that rely on fixed-class classification or unconstrained generation, enabling a more interpretable and expressive communication paradigm, paving the way for natural and effective BCI-mediated communication.'
