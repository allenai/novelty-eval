    0: Foundation models exhibit impressive capabilities yet lack mechanisms for quantifying uncertainty in their predictions and actively acquiring knowledge to address identified gaps. We introduce Metacognitive Foundation Models, a framework that augments large language models with intrinsic uncertainty awareness and strategic knowledge acquisition capabilities. Our approach embeds lightweight Bayesian modules within the model architecture that estimate epistemic uncertainty across different knowledge domains without requiring full model retraining. When uncertainty exceeds learned thresholds, the model generates targeted clarification questions or retrieval queries to external knowledge sources. A selective update mechanism then integrates new information through parameter-efficient adaptation while preserving existing capabilities. Unlike conventional retrieval-augmented generation, our framework enables models to proactively identify and address knowledge deficiencies through metacognitive self-assessment. This paradigm shift from passive response generation to active knowledge seeking creates foundation models that continuously refine their understanding through deployment, bridging the gap between static pre-training and dynamic real-world requirements while maintaining computational efficiency and avoiding catastrophic forgetting.
    1: "Process Reward Models (PRMs) have recently emerged as a powerful framework for enhancing the reasoning capabilities of large reasoning models (LRMs), particularly in the context of test-time scaling (TTS). However, their potential for supervising LRMs on tabular reasoning domains remains underexplored. \nThrough detailed empirical analyses, we identify that existing PRMs, though widely adopted for supervising text-only reasoning steps, struggle with table-specific operations such as sub-table retrieval and schema interaction, leading to critical performance bottlenecks. To address this limitation, we propose TaTToo, a novel table-grounded PRM framework that (i) reasons explicitly over tabular reasoning steps and (ii) integrates tool-based verification to provide precise reward supervision. Concretely, we first design a scalable data curation pipeline that constructs over 60k high-quality step-level annotations by integrating table verification rationales with tool-based executions. Building on the collected data, we train TaTToo with a dual-stage paradigm: cold-start supervised fine-tuning to capture tool-use reasoning patterns, followed by reinforcement learning with tool-grounded reward shaping to align our model with table-based verification."
