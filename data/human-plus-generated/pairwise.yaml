    0: We introduce the concept of Living Benchmarks, a new paradigm for dataset curation and model evaluation that addresses the temporal rigidity of traditional static benchmarks. Unlike conventional benchmarks that freeze data and tasks at publication time, Living Benchmarks continuously evolve by incorporating fresh data streams, emerging task variations, and naturally occurring distribution shifts. This framework enables longitudinal evaluation of model robustness, measuring not only instantaneous performance but also degradation rates, adaptation efficiency, and continual learning capabilities. Living Benchmarks maintain versioned snapshots for reproducibility while simultaneously growing to reflect real-world dynamics such as concept drift, vocabulary evolution, and shifting user preferences. We propose infrastructure for automated data ingestion, quality control mechanisms that preserve benchmark integrity, and multi-temporal evaluation protocols that assess both backward compatibility and forward adaptability. This paradigm shift transforms benchmarks from static validation tools into dynamic testbeds that better approximate production environments, fostering research on robust, adaptive systems rather than models optimized for frozen distributions.
    1: 'Although Multimodal Large Language Models (MLLMs) have demonstrated proficiency in video captioning, practical applications require captions that follow specific user instructions rather than generating exhaustive, unconstrained descriptions. Current benchmarks, however, primarily assess descriptive comprehensiveness while largely overlook instruction-following capabilities. To address this gap, we introduce IF-VidCap, a new benchmark for evaluating controllable video captioning, which contains 1,400 high-quality samples. Distinct from existing video captioning or general instruction-following benchmarks, IF-VidCap incorporates a systematic framework that assesses captions on two dimensions: format correctness and content correctness.'
