    0: 'We introduce Compositional Expert Routing Networks (CERN), a framework that transforms foundation models into dynamic orchestrators capable of seamlessly integrating specialized expert modules without base model retraining. Rather than encoding all knowledge within monolithic parameters, CERN learns to route queries through a compositional graph of lightweight expert modules, each capturing domain-specific knowledge or specialized reasoning capabilities. The routing mechanism operates through learned attention patterns over module capabilities, conditioned on input semantics and task requirements. Crucially, new experts can be added post-deployment by training only the routing connections, preserving existing model behavior while extending capabilities. This architecture enables foundation models to evolve continuously, supporting rapid domain adaptation, explicit knowledge provenance through routing decisions, and efficient updates by replacing individual modules. CERN addresses fundamental limitations in current foundation model paradigms: the prohibitive cost of retraining, the opacity of monolithic knowledge representation, and the inflexibility of static architectures, paving the way toward more sustainable and adaptable large-scale AI systems.'
    1: Large language models (LLMs) have demonstrated remarkable capabilities in chain of thought (CoT) reasoning. However, the current LLM reasoning paradigm initiates thinking only after the entire input is available, which introduces unnecessary latency and weakens attention to earlier information in dynamic scenarios. Inspired by human cognition of thinking while reading, we first design a **streaming thinking** paradigm for LLMs, where reasoning unfolds in the order of input and further adjusts its depth once reading is complete. We instantiate this paradigm with *StreamingThinker*, a framework that enables LLMs to think while reading through the integration of streaming CoT generation, streaming-constraint training, and streaming parallel inference. Specifically, StreamingThinker employs streaming reasoning units with quality control for CoT generation, enforces order-preserving reasoning through streaming attention masks and position encoding, and leverages parallel KV caches that decouple input encoding from reasoning generation, thereby ensuring alignment and enabling true concurrency.
