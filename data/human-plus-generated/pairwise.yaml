    0: 'Classical learning theory typically analyzes generalization by studying properties of the final learned function or parameter configuration. However, this overlooks the rich information encoded in the optimization trajectory itself. We propose a trajectory-centric framework for understanding generalization that analyzes the path taken through function space during training. Our theory characterizes generalization through two complementary lenses: geometric properties of the trajectory such as path complexity and curvature, and information-theoretic measures capturing how the learner''s hypothesis class is progressively refined. We show that trajectories with lower intrinsic dimensionality and smoother transitions between successive iterates correspond to better generalization, even when endpoint solutions appear similar. This perspective naturally explains several puzzling phenomena in deep learning, including grokking, where delayed generalization emerges from phase transitions in trajectory geometry, and the benefits of curriculum learning and learning rate schedules, which guide optimization along lower-complexity paths. Our framework unifies implicit regularization, algorithmic stability, and compression-based generalization bounds under a single trajectory-based view, offering new theoretical tools for analyzing modern overparameterized learning systems.'
    1: Contrastive learning has emerged as a powerful framework for learning generalizable representations, yet its theoretical understanding remains limited, particularly under imbalanced data distributions that are prevalent in real-world applications. Such an imbalance can degrade representation quality and induce biased model behavior, yet a rigorous characterization of these effects is lacking. In this work, we develop a theoretical framework to analyze the training dynamics of contrastive learning with Transformer-based encoders under imbalanced data. Our results reveal that neuron weights evolve through three distinct stages of training, with different dynamics for majority features, minority features, and noise. We further show that minority features reduce representational capacity, increase the need for more complex architectures, and hinder the separation of ground-truth features from noise. Inspired by these neuron-level behaviors, we show that pruning restores performance degraded by imbalance and enhances feature separation, offering both conceptual insights and practical guidance.
