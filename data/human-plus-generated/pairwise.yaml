  ideas:
    0: Modern AI systems must simultaneously satisfy multiple safety objectives—alignment with human values, fairness across demographics, privacy preservation, and robustness to attacks—yet these requirements often exhibit fundamental tensions during deployment. We introduce Constraint Geometry Monitoring, a framework that detects and characterizes conflicts between safety objectives by analyzing the geometric structure of their constraint surfaces in model activation space. Rather than treating each safety property in isolation, our approach constructs a real-time topological map revealing when satisfying one objective necessarily compromises another, enabling principled trade-off decisions. The framework employs lightweight probes that track constraint violation boundaries without requiring full model retraining, and introduces conflict signatures that distinguish between resolvable tensions and inherent impossibility results. By surfacing these multi-objective conflicts explicitly, we enable developers to make informed decisions about safety trade-offs, prioritize objectives contextually, and identify scenarios where current approaches fundamentally cannot satisfy all requirements simultaneously. This work establishes a foundation for multi-dimensional safety reasoning in deployed AI systems.
    1: 'In AI-assisted decision-making, human decision-makers finalize decisions by taking into account both their human confidence and AI confidence regarding specific outcomes. In practice, they often exhibit heterogeneous cognitive capacities, causing their confidence to deviate, sometimes significantly, from the actual label likelihood. We theoretically demonstrate that existing AI confidence adjustment objectives, such as *calibration* and *human-alignment*, are insufficient to ensure fair utility across groups of decision-makers with varying cognitive capacities. Such unfairness may raise concerns about social welfare and may erode human trust in AI systems.

      To address this issue, we introduce a new concept in AI confidence adjustment: *inter-group-alignment*. By theoretically bounding the utility disparity between human decision-maker groups as a function of *human-alignment* level and *inter-group-alignment* level, we establish an interpretable fairness-aware objective for AI confidence adjustment. Our analysis suggests that achieving utility fairness in AI-assisted decision-making requires both *human-alignment* and *inter-group-alignment*. Building on these objectives, we propose a multicalibration-based AI confidence adjustment approach tailored to scenarios involving human decision-makers with heterogeneous cognitive capacities. We further provide theoretical justification showing that our method constitutes a sufficient condition for achieving both *human-alignment* and *inter-group-alignment*.'
