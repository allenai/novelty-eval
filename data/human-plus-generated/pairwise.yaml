    0: Graph neural networks excel at capturing local neighborhood structure but often fail to encode global topological properties that persist across multiple scales. We introduce TopoGeometric Neural Networks, a framework that jointly learns geometric embeddings and topological representations by integrating persistent homology with Riemannian graph learning. Our approach computes multi-scale topological signatures through filtrations on learned geometric embeddings, creating a differentiable pipeline where gradient information flows between the topological feature extractor and the geometric encoder. By embedding graphs into product spaces of hyperbolic and spherical geometries while simultaneously optimizing persistence diagrams as auxiliary learning signals, we capture both hierarchical structure and cyclic patterns inherent in complex networks. A novel loss function combines geometric distortion, topological stability, and task-specific objectives, enabling the model to discover latent geometric-topological structures. This unified perspective proves particularly valuable for domains where both continuous geometric relationships and discrete topological invariants govern system behavior, including protein interaction networks, transportation systems, and social dynamics where multi-scale organizational principles emerge naturally.
    1: 'Multi-domain graph pre-training integrates knowledge from diverse domains to enhance performance in the target domains, which is crucial for building graph foundation models. Despite initial success, existing solutions often fall short of answering a fundamental question: how is knowledge integrated or transferred across domains? This theoretical limitation motivates us to rethink the consistency and transferability between the pre-trained model and target domains. In this paper, we propose a fresh differential geometry perspective, whose core idea is to merge any graph dataset into a unified, smooth Riemannian manifold, enabling a systematic understanding of knowledge integration and transfer. To achieve this, our key contribution is the theoretical establishment of neural manifold gluing, which first characterizes local geometry using an adaptive orthogonal frame and then "glues" the local pieces together into a coherent whole. Building on this theory, we present the GraphGlue framework, which supports batched pre-training with EMA prototyping and provides a transferability measure based on geometric consistence. Moreover, GraphGlue reveals a geometric scaling law, showing that larger quantities of datasets improve model transferability by producing a smoother manifold.'
