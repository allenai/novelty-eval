    0: The Maximum Common Edge Subgraph (MCES) problem is a crucial challenge with significant implications in domains such as biology and chemistry. Traditional approaches, which include transformations into max-clique and search-based algorithms, suffer from scalability issues when dealing with larger instances. This paper introduces ``Neural Graduated Assignment'' (NGA), a simple, scalable, unsupervised-training-based method that addresses these limitations. Central to NGA is stacking of differentiable assignment optimization with neural components, enabling high-dimensional parameterization of the matching process through a learnable temperature mechanism. We further theoretically analyze the learning dynamics of NGA, showing its design leads to fast convergence, better exploration-exploitation tradeoff, and ability to escape local optima. The introduction of NGA marks a significant advancement in the computation of MCES and offers insights into other assignment problems.
    1: We introduce TopologyNet, a unified geometric learning framework that operates across diverse topological structures—graphs, simplicial complexes, manifolds, and hybrid geometries—without architecture-specific modifications. Current geometric deep learning methods are tailored to particular data structures, limiting their applicability and preventing knowledge transfer across topological domains. Our approach leverages persistent homology to extract multi-scale topological signatures and employs cellular sheaf theory to construct a universal message-passing scheme that respects the underlying geometric structure regardless of its specific form. By parameterizing local geometric operators through learnable sheaf maps, TopologyNet adapts its inductive biases to the intrinsic geometry of the data while maintaining a consistent computational framework. The framework naturally handles heterogeneous topological features within a single dataset and enables cross-topology transfer learning, where geometric knowledge acquired on one structure informs learning on another. This topology-agnostic design opens new possibilities for scientific domains where data naturally lives on multiple interacting geometric structures, such as molecular dynamics, neural connectomics, and multi-physics simulations.
