    0: While diffusion models have achieved remarkable performance in image generation, they often struggle with the imbalanced datasets frequently encountered in real-world applications, resulting in significant performance degradation on minority classes. In this paper, we identify model capacity allocation as a key and previously underexplored factor contributing to this issue, providing a perspective that is orthogonal to existing research. Our empirical experiments and theoretical analysis reveal that majority classes monopolize an unnecessarily large portion of the model's capacity, thereby restricting the representation of minority classes. To address this, we propose Capacity Manipulation (CM), which explicitly reserves model capacity for minority classes. Our approach leverages a low-rank decomposition of model parameters and introduces a capacity manipulation loss to allocate appropriate capacity for capturing minority knowledge, thus enhancing minority class representation. CM can be combined with existing methods to further boost overall performance.
    1: We introduce Adaptive Supervision Weighting (ASW), a unified framework that seamlessly transitions between unsupervised, self-supervised, semi-supervised, and fully supervised representation learning within a single training paradigm. Unlike conventional approaches that employ fixed supervision strategies, ASW learns to dynamically weight multiple learning signals—including contrastive objectives, pseudo-labels, and ground-truth annotations—based on sample-specific confidence estimates and global training dynamics. Our framework introduces a meta-learned gating mechanism that evaluates the reliability of each supervision source in real-time, enabling the model to automatically discover optimal supervision strategies without manual hyperparameter tuning across different data regimes. This approach naturally handles scenarios with heterogeneous label availability, such as datasets with partially annotated samples, streaming data with delayed labels, or federated learning with clients possessing varying annotation budgets. By treating supervision as a continuous spectrum rather than discrete categories, ASW provides a principled way to leverage all available learning signals while adapting to the evolving informativeness of each source, ultimately producing representations that are both generalizable and task-specific.
