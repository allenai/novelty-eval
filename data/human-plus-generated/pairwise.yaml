    0: Multimodal learning has advanced significantly through models that fuse vision, audio, and language, yet most approaches assume temporal synchronization across modalities—a constraint rarely satisfied in real-world scenarios. We introduce Temporal Offset Reasoning Networks (TORN), a framework that explicitly models and leverages asynchronous relationships between modalities. Rather than forcing alignment, TORN learns modality-specific temporal embeddings that capture when information manifests, coupled with a cross-modal temporal attention mechanism that discovers meaningful correspondences across variable time offsets. Our approach employs a novel contrastive learning objective that treats temporal relationships as first-class features, encouraging the model to recognize that semantically related events across modalities may be delayed, anticipatory, or causally linked. TORN operates on arbitrary-length sequences and adapts to both densely synchronized and sparsely aligned multimodal data. This temporal reasoning capability enables improved performance in applications where modalities exhibit natural asynchrony, including audio-visual scene understanding, multimodal dialogue systems, and time-series analysis with heterogeneous sensor data.
    1: "Vision-language models have achieved remarkable success in cross-modal understanding. Yet, these models remain limited to object-level or region-level grounding, lacking the capability for pixel-precise keypoint comprehension through natural language. We introduce a novel framework for pixel level grounding. The framework consists of two complementary components: a Point Descriptor that generates rich, contextual descriptions of individual keypoints, and a Point Localizer that regresses precise pixel coordinates from these descriptions. Unlike prior work that relies on templated prompts or keypoint names, our approach produces free-form, coarse-to-fine descriptions that situate keypoints within their visual context.\nSince there is no available dataset to train such a system, we introduce LlamaPointInPart, a carefully curated dataset of 20K+ image-keypoint-description triplets synthesized from multiple vision-language models, capturing multi-scale information from scene-level context to visual features around the keypoint. \nFor cross-category generalization, we optimize the Point Descriptor on AP-10K via GRPO, using the frozen Point Localizer as a reward model to produce descriptions that maximize localization accuracy.\nWe also establish a new evaluation protocol. Instead of comparing the text description produced by our method to the ground truth, we use the localizer to determine how close is the predicted point generated to the ground truth point.\nThe bidirectional nature of our framework enables applications in both keypoint-guided image understanding and language-guided precise localization."
