    0: Modern deep learning models achieve remarkable performance but remain largely opaque, with explanations often generated post-hoc and potentially unfaithful to actual model computations. We introduce Concept Router Networks, a framework that structurally enforces interpretability by explicitly separating concept discovery from decision-making. Our approach automatically learns a sparse set of semantic concept slots through self-supervised disentanglement objectives, then routes all classification decisions exclusively through these discovered concepts via differentiable attention mechanisms. Unlike concept bottleneck models requiring extensive human annotation, our method discovers task-relevant concepts in an unsupervised manner while maintaining architectural constraints that guarantee decision traceability. The routing mechanism creates an explicit computational graph linking inputs to predictions through interpretable concept activations, enabling users to audit which concepts influence each decision and intervene on concept representations at inference time. By treating interpretability as an architectural prior rather than a post-processing step, Concept Router Networks provide inherent transparency without sacrificing the representational capacity needed for complex tasks, offering a principled path toward trustworthy AI systems in high-stakes domains.
    1: 'The fidelity with which neural networks can now generate content such as music presents a scientific opportunity: these systems appear to have learned implicit theories of such content''s structure through statistical learning alone. This offers a potentially new lens on theories of human-generated media. When internal representations align with traditional constructs (e.g. chord progressions in music), they show how such categories can emerge from statistical regularities; when they diverge, they expose limits of existing frameworks and patterns we may have overlooked but that nonetheless carry explanatory power. In this paper, focusing on autoregressive music generators, we introduce a method for discovering interpretable concepts using sparse autoencoders (SAEs), extracting interpretable features from the residual stream of a transformer model. We make this approach scalable and evaluable using automated labeling and validation pipelines. Our results reveal both familiar musical concepts and coherent but uncodified patterns lacking clear counterparts in theory or language. As an extension, we show such concepts can be used to steer model generations. Beyond improving model transparency, our work provides an empirical tool for uncovering organizing principles that have eluded traditional methods of analysis and synthesis.'
