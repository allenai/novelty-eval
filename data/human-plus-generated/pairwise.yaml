  ideas:
    0: 'Alignment through human feedback has emerged as the dominant paradigm for making language models helpful and harmless, yet preference data inevitably reflects the demographic composition and cultural values of annotators. We introduce Pluralistic Alignment, a framework that disentangles universal safety principles from context-dependent preferences to enable equitable model behavior across diverse user populations. Rather than learning a single reward function from aggregated preferences, our approach identifies a shared constraint manifold representing non-negotiable safety boundaries while modeling a distribution over contextually-appropriate responses. Through a novel decomposition of preference signals, we separate consensus-based norms from culturally-situated values without requiring explicit demographic annotations, preserving annotator privacy. The framework employs a mixture-of-preferences architecture that learns to route between specialized sub-policies conditioned on implicit context, enabling the model to respectfully adapt its communication style and content emphasis while maintaining consistent safety guarantees. This approach addresses a critical gap in responsible AI deployment: ensuring that alignment processes do not inadvertently create models that serve majority populations while marginalizing others.'
    1: Recently, OpenAI (2025) showed that training against a chain of thought (CoT) monitor can cause obfuscated CoTs, which contain bad behavior the monitor cannot detect. They proposed to keep CoTs monitorable by training only against output monitors that do not have access to CoT. We show that such training can still cause obfuscated CoTs via two mechanisms. First, when a model is trained to produce a safe-looking output, that model may generalize to making its CoTs look safe. Second, since later tokens are conditioned on earlier ones, safe‑looking CoTs may increase the likelihood of safe outputs, causing safe-looking CoTs to be reinforced. We introduce two mitigations to address these two issues. To our knowledge, we are the first to identify and mitigate these problems. Our work implies that preserving CoT monitorability is more difficult than previously thought; we suggest practical guidelines for AI developers to maintain monitorable CoTs.
