    0: Deep research has revolutionized data analysis, yet data scientists still devote substantial time to manually crafting visualizations, highlighting the need for robust automation from natural language queries. However, current systems struggle with complex datasets containing multiple files and iterative refinement. Existing approaches, including simple single- or multi-agent systems, often oversimplify the task, focusing on initial query parsing while failing to robustly manage data complexity, code errors, or final visualization quality. In this paper, we reframe this challenge as a collaborative multi-agent problem. We introduce CoDA, a multi-agent system that employs specialized LLM agents for metadata analysis, task planning, code generation, and self-reflection. We formalize this pipeline, demonstrating how metadata-focused analysis bypasses token limits and quality-driven refinement ensures robustness. This work demonstrates that the future of visualization automation lies not in isolated code generation but in integrated, collaborative agentic workflows.
    1: 'Foundation models encode vast knowledge within their parameters, yet they remain fundamentally static artifacts that cannot efficiently adapt to new information, correct outdated facts, or refine erroneous beliefs without costly retraining. We introduce Neural Knowledge Substrates, a framework that reimagines foundation model weights as dynamically editable knowledge repositories with principled update mechanisms. Our approach combines three key components: (1) a causal tracing methodology that identifies minimal parameter subsets responsible for specific factual or reasoning behaviors, (2) a consistency-preserving editing operator that performs targeted weight updates while maintaining logical coherence across related knowledge, and (3) a meta-learning protocol that enables models to learn how to assimilate new information without catastrophic forgetting. Unlike existing model editing techniques that treat updates as isolated interventions, our framework enforces compositional consistency constraints and propagates changes through knowledge dependency graphs. This enables foundation models to evolve continuously, incorporating new discoveries, correcting misinformation, and refining their world models while preserving their general capabilities—transforming them from static artifacts into living knowledge systems.'
