    0: 'Safe and feasible trajectory planning is critical for real-world autonomous driving systems. However, existing learning-based planners rely heavily on expert demonstrations, which not only lack explicit safety awareness but also risk inheriting undesirable behaviors such as speeding from suboptimal human driving data. Inspired by the success of large language models, we propose Plan-R1, a two-stage trajectory planning framework that decouples principle alignment from behavior learning. In the first stage, a general trajectory predictor is pre-trained on expert data to capture diverse, human-like driving behaviors. In the second stage, the model is fine-tuned with rule-based rewards using Group Relative Policy Optimization (GRPO), explicitly aligning ego planning with principles such as safety, comfort, and traffic rule compliance. This two-stage paradigm retains human-like behaviors while enhancing safety awareness and discarding undesirable patterns from demonstrations. Furthermore, we identify a key limitation of directly applying GRPO to planning: group-wise normalization erases cross-group scale differences, causing rare, high-variance safety-violation groups to have similar advantages as abundant low-variance safe groups, thereby suppressing optimization for safety-critical objectives. To address this, we propose Variance-Decoupled GRPO (VD-GRPO), which replaces normalization with centering and fixed scaling to preserve absolute reward magnitudes, ensuring that safety-critical objectives remain dominant throughout training.'
    1: Autonomous systems operating in novel environments face a fundamental tension between task completion and world model uncertainty. Existing planning approaches either assume known dynamics or treat exploration and exploitation as separate phases, limiting adaptability in unstructured settings. We introduce Epistemic Planning Networks, a framework that unifies task-oriented planning with active model refinement through uncertainty-aware action selection. Our approach employs deep ensemble dynamics models to estimate epistemic uncertainty, then formulates planning as a bilevel optimization problem where actions are selected to simultaneously reduce model uncertainty in task-relevant regions and progress toward goal states. A neural architecture learns to predict the information gain of candidate trajectories, enabling efficient online replanning as the model is refined through interaction. By explicitly reasoning about what the robot knows and what it needs to learn, our framework enables autonomous systems to intelligently balance information gathering with goal pursuit, facilitating robust deployment in unfamiliar environments without requiring complete prior models or extensive offline training in every new domain.
