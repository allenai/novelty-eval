    0: We present a novel geometric perspective on the latent space of diffusion models. We first show that the standard pullback approach, utilizing the deterministic probability flow ODE decoder, is fundamentally flawed. It provably forces geodesics to decode as straight segments in data space, effectively ignoring any intrinsic data geometry beyond the ambient Euclidean space. Complementing this view, diffusion also admits a stochastic decoder via the reverse SDE, which enables an information geometric treatment with the Fisher-Rao metric. However, a choice of $\mathbf{x}_T$ as the latent representation collapses this metric due to memorylessness. We address this by introducing a latent spacetime $\mathbf{z}=(\mathbf{x}_t,t)$ that indexes the family of denoising distributions $p(\mathbf{x}_0 | \mathbf{x}_t)$ across all noise scales, yielding a nontrivial geometric structure. We prove these distributions form an exponential family and derive simulation-free estimators for curve lengths, enabling efficient geodesic computation. The resulting structure induces a principled Diffusion Edit Distance, where geodesics trace minimal sequences of noise and denoise edits between data. We also propose applications to transition path sampling in molecular systems, including constrained variants such as low-variance transitions and region avoidance.
    1: Inverse problems in scientific imaging—from medical tomography to computational microscopy—are fundamentally ill-posed, requiring strong priors to resolve ambiguities and suppress noise. Classical regularization methods impose hand-crafted priors that often fail to capture the complexity of natural structures, while purely data-driven approaches ignore valuable domain knowledge encoded in physical measurement models. We introduce Physics-Guided Diffusion Priors, a framework that synergistically combines learned generative priors with explicit physical constraints for solving inverse problems. Our approach trains a diffusion model on domain-specific data to capture rich structural priors, then incorporates forward measurement operators directly into the reverse sampling process through a novel conditioning mechanism. This enables the model to generate solutions that simultaneously respect learned data distributions and satisfy physical measurement equations. By decomposing the sampling trajectory into data-driven denoising steps and physics-based projection steps, we maintain the expressiveness of deep generative models while ensuring physical consistency. The framework is agnostic to the specific inverse problem and measurement physics, providing a general paradigm for scientific image reconstruction tasks where data and physics must jointly inform the solution.
