    0: We introduce Compositional Manifold Diffusion (CMD), a generative framework that learns to decompose the data manifold into semantically disentangled subspaces without explicit supervision. Rather than modeling generation as a single denoising trajectory, CMD performs diffusion over a product space of learned factor manifolds, each capturing independent aspects of variation such as shape, texture, pose, or style. Through a novel geometric regularization that encourages orthogonality between learned subspaces and a compositional conditioning mechanism, our approach enables fine-grained, interpretable control during sampling. Users can independently manipulate discovered factors by navigating their corresponding manifolds, compose attributes from different examples, or perform smooth interpolations along semantically meaningful directions. The manifold decomposition emerges naturally from the data structure through a combination of topological constraints and local linearity assumptions during training. This enables zero-shot compositional generation and precise editing capabilities that generalize beyond the training distribution, offering a path toward more interpretable and controllable synthesis across diverse modalities.
    1: Few-step diffusion or flow-based generative models typically distill a velocity-predicting teacher into a student that predicts a shortcut towards denoised data. This format mismatch has led to complex distillation procedures that often suffer from a quality--diversity trade-off. To address this, we propose policy-based flow models ($\pi$-Flow). $\pi$-Flow modifies the output layer of a student flow model to predict a network-free policy at one timestep. The policy then produces dynamic flow velocities at future substeps with negligible overhead, enabling fast and accurate ODE integration without extra network evaluations. To match the policy's ODE trajectory to the teacher's, we introduce a novel imitation distillation approach, which matches the policy's velocity to the teacher's along the policy's trajectory using a standard $\ell_2$ flow matching loss. By simply mimicking the teacher's behavior, $\pi$-Flow enables stable and scalable training and avoids the quality--diversity trade-off.
