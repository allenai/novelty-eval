  ideas:
    0: Differential privacy and algorithmic fairness are often pursued as independent objectives in machine learning systems, yet their interaction creates fundamental tensions that current approaches fail to address. Standard differential privacy mechanisms apply uniform noise across all data points, which can disproportionately harm model utility for minority groups with less training data, thereby amplifying fairness violations. Conversely, fairness interventions typically require explicit access to sensitive demographic attributes, directly conflicting with privacy desiderata. We introduce Equitable Privacy Calibration, a framework that jointly optimizes privacy and fairness through stratified noise allocation. Our approach adaptively calibrates privacy budget expenditure based on group representation while maintaining rigorous differential privacy guarantees at the dataset level. Crucially, the mechanism operates without requiring access to protected attributes during inference, instead leveraging privately computed aggregate statistics to guide noise injection during training. We develop novel theoretical characterizations of the privacy-fairness Pareto frontier and demonstrate that strategic noise allocation can simultaneously strengthen both privacy protection for individuals and fairness guarantees across demographic groups, challenging the conventional wisdom that these objectives must trade off against each other.
    1: 'Reward models (RMs) play a critical role in aligning AI behaviors with human preferences, yet they face two fundamental challenges: (1) Modality Imbalance, where most RMs are mainly focused on text and image modalities, offering limited support for video, audio, and other modalities; and (2) Preference Rigidity, where training on fixed binary preference pairs fails to capture the complexity and diversity of personalized preferences. To address the above challenges, we propose Omni-Reward, a step toward generalist omni-modal reward modeling with support for free-form preferences, consisting of: (1) Evaluation: We introduce Omni-RewardBench, the first omni-modal RM benchmark with free-form preferences, covering nine tasks across five modalities including text, image, video, audio, and 3D; (2) Data: We construct Omni-RewardData, a multimodal preference dataset comprising 248K general preference pairs and 69K instruction-tuning pairs for training generalist omni-modal RMs; (3) Model: We propose Omni-RewardModel, which includes both discriminative and generative RMs.'
