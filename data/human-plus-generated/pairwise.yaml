    0: Evaluating tabular generators remains a challenging problem, as the unique causal structural prior of heterogeneous tabular data does not lend itself to intuitive human inspection. Recent work has introduced structural fidelity as a tabular-specific evaluation dimension to assess whether synthetic data complies with the causal structures of real data. However, existing benchmarks often neglect the interplay between structural fidelity and conventional evaluation dimensions, thus failing to provide a holistic understanding of model performance. Moreover, they are typically limited to toy datasets, as quantifying existing structural fidelity metrics requires access to ground-truth causal structures, which are rarely available for real-world datasets. In this paper, we propose a novel evaluation framework that jointly considers structural fidelity and conventional evaluation dimensions. We introduce a new evaluation metric, global utility, which enables the assessment of structural fidelity even in the absence of ground-truth causal structures. In addition, we present TabStruct, a comprehensive evaluation benchmark offering large-scale quantitative analysis on 13 tabular generators from nine distinct categories, across 29 datasets.
    1: Existing benchmarks evaluate model performance on static test sets, failing to capture the temporal dynamics and compositional shifts inherent in real-world deployment scenarios. We introduce ChronoShift, a benchmark framework designed to systematically evaluate how models adapt to evolving compositional relationships across multiple modalities over time. Unlike traditional benchmarks that assume fixed data distributions, ChronoShift presents sequences of related tasks where both the underlying data distribution and the compositional structure between modalities undergo controlled, realistic transformations. The framework spans diverse domains including medical imaging with evolving diagnostic protocols, urban scene understanding with changing infrastructure, and scientific literature analysis with shifting terminology. Each domain features carefully designed temporal trajectories that mirror authentic distributional shifts while maintaining compositional dependencies that require models to transfer structured knowledge across time. ChronoShift enables assessment of adaptation strategies, continual learning approaches, and compositional generalization under temporal pressure, providing insights into model robustness that static benchmarks cannot capture and bridging the gap between controlled evaluation and dynamic real-world performance.
