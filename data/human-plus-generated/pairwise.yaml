    0: We develop a linear response framework for interpretability that treats a neural network as a Bayesian statistical mechanical system. A small perturbation of the data distribution, for example shifting the Pile toward GitHub or legal text, induces a first-order change in the posterior expectation of an observable localized on a chosen component of the network. The resulting susceptibility can be estimated efficiently with local SGLD samples and factorizes into signed, per-token contributions that serve as attribution scores. We combine these susceptibilities into a response matrix whose low-rank structure separates functional modules such as multigram and induction heads in a 3M-parameter transformer.
    1: We introduce Manifold-Guided Counterfactual Explanations (MGCE), a framework that discovers interpretable low-dimensional concept manifolds within neural network representation spaces and leverages them for faithful explanation generation. Rather than relying on input-gradient methods or training separate explainer models, MGCE identifies semantically coherent subspaces by analyzing the geometric structure of intermediate representations across related inputs. These discovered manifolds correspond to directions of conceptual variation that the model naturally employs during inference. We generate counterfactual explanations by traversing these manifolds, ensuring modifications remain within the model's learned feature distribution while producing minimal, interpretable changes. The framework operates agnostically across architectures and modalities, requiring only access to intermediate activations. By grounding explanations in the model's intrinsic geometric organization rather than post-hoc approximations, MGCE provides insights into how neural networks structure knowledge internally. This approach bridges representation learning and causal reasoning, offering a principled method for understanding model decisions through the lens of learned conceptual geometry.
