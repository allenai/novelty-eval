    0: Reasoning over long contexts is essential for large language models. While reinforcement learning (RL) enhances short-context reasoning by inducing "Aha" moments in chain-of-thought, the advanced thinking patterns required for long-context reasoning remain largely unexplored, and high-difficulty RL data are scarce. In this paper, we introduce LoongRL, a data-driven RL method for advanced long-context reasoning. Central to LoongRL is KeyChain, a synthesis approach that transforms short multi-hop QA into high-difficulty long-context tasks by inserting UUID chains that hide the true question among large collections of distracting documents. Solving these tasks requires the model to trace the correct chain step-by-step, identify the true question, retrieve relevant facts and reason over them to answer correctly. RL training on KeyChain data induces an emergent plan–retrieve–reason–recheck reasoning pattern that generalizes far beyond training length, enabling models trained at 16K to effectively solve 128K tasks without prohibitive full-length RL rollout costs.
    1: Foundation models encode vast knowledge within monolithic parameter spaces, making targeted updates, error correction, and knowledge attribution fundamentally intractable without costly retraining. We introduce Modular Knowledge Subspaces (MKS), a novel pretraining paradigm that encourages foundation models to self-organize knowledge into disentangled, editable neural circuits. During pretraining, we impose structured sparsity constraints and contrastive knowledge routing objectives that guide different parameter subsets to specialize in distinct knowledge domains while preserving cross-domain reasoning capabilities. Each subspace maintains explicit routing metadata enabling precise knowledge attribution and selective modification. This architecture allows for surgical knowledge updates through localized fine-tuning of individual subspaces without affecting others, addressing catastrophic forgetting and temporal knowledge drift. MKS transforms foundation models from opaque monoliths into compositional systems where knowledge can be inspected, validated, and modified at granular levels while retaining the emergent abilities of large-scale pretraining. This paradigm enables continuously updatable models, improved factual accuracy through targeted corrections, and new forms of interpretability through knowledge circuit analysis.
