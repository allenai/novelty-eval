    0: Open-ended segmentation requires models capable of generating free-form descriptions of previously unseen concepts and regions. Despite advancements in model development, current evaluation protocols for open-ended segmentation tasks fail to capture the true semantic accuracy of the generated descriptions. We empirically demonstrate that embedding‐based similarity score mappings diverge significantly from human judgments. To address this issue, we introduce a novel mapping function that considers multiple lexical relationships between free‐form outputs and test‐vocabulary labels, yielding much closer alignment with human annotations. We integrate this mapping into a robust evaluation framework. Additionally, we present the first Multi-modal Large‐Language Model trained with a contrastive objective to jointly align visual regions and textual descriptions for open‐ended panoptic segmentation.
    1: Machine learning benchmarks traditionally consist of fixed datasets that quickly saturate as models improve, providing diminishing insight into capability gaps and progress. We introduce Procedural Evaluation Graphs (PEGs), a framework for generating infinite families of benchmark tasks with controllable difficulty and structural properties. PEGs define benchmarks as parametric generative processes rather than static datasets, enabling continuous evaluation across complexity gradients while preserving core task semantics. By sampling from these processes with varying difficulty parameters, we can assess model capabilities along interpretable dimensions and identify precise failure boundaries. The framework supports automatic difficulty calibration that adapts to model performance, ensuring benchmarks remain discriminative as capabilities improve. PEGs also provide natural defenses against data contamination, as test instances are generated on-demand rather than pre-specified. We demonstrate how this paradigm applies across domains including visual reasoning, natural language understanding, and mathematical problem-solving, offering a path toward sustainable, informative benchmarks that scale with model capabilities rather than becoming obsolete.
