    0: '``Learnware = Model + Specification''''. A learnware comprises a submitted model paired with a \emph{specification} sketching its capabilities. For a Learnware Dock System (LDS) which accommodates numerous models, these specifications are essential to enabling users to identify helpful models, eliminating the requirement for prohibitively costly per-model evaluations. Recently, \textbf{Pa}rameter \textbf{Ve}ctor (PAVE) specification, which utilizes the changes in pre-trained model parameters to inherently encode the model capability and task requirements, shows promising capabilities in enabling identifying useful learnwares for high-dimensional, unstructured text data.

      In this paper, we present a comprehensive study of PAVE specification for learnware identification. Theoretically, from the neural tangent kernel perspective, we establish a tight connection between PAVE and prior specifications, providing a theoretical explanation for their shared underlying principles. We further approximate PAVE in a low-rank space and analyze the approximation error bound, highly reducing the computational and storage overhead.'
    1: 'We introduce Continuum Learning, a unified framework for representation learning that transcends traditional boundaries between unsupervised, self-supervised, semi-supervised, and supervised paradigms. Rather than treating these as distinct learning regimes, we propose a dynamic architecture that adaptively assigns learning objectives to individual samples based on their supervision characteristics along a continuous spectrum. Our framework employs a multi-headed encoder with attention-based routing that seamlessly integrates contrastive self-supervised losses, pseudo-labeling strategies, and supervised classification objectives within a single coherent representation space. A novel cross-supervision distillation mechanism enables bidirectional knowledge transfer: self-supervised features provide robust initialization for semi-supervised learning, while supervised signals refine the semantic structure of unsupervised representations. Through progressive curriculum scheduling, the model automatically balances exploration of unlabeled data structure with exploitation of labeled information. This unified approach addresses the practical reality that real-world datasets exhibit heterogeneous supervision—from fully labeled instances to completely unlabeled samples—and enables more sample-efficient learning by leveraging all available supervision signals synergistically rather than in isolation.'
