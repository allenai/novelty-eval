    0: Randomized Controlled Trials are one of the pillars of science; nevertheless, they rely on hand-crafted hypotheses and expensive analysis. Such constraints prevent causal effect estimation at scale, potentially anchoring on popular yet incomplete hypotheses. We propose to discover the unknown effects of a treatment directly from data. For this, we turn unstructured data from a trial into meaningful representations via pretrained foundation models and interpret them via a Sparse Auto Encoder. However, discovering significant causal effects at the neural level is not trivial due to multiple-testing issues and effects entanglement. To address these challenges, we introduce _Neural Effect Search_, a novel recursive procedure solving both issues by progressive stratification. We showcase, in the context of experimental ecology, the first successful unsupervised causal effect identification on a real-world scientific trial.
    1: Current explanation methods for deep neural networks primarily offer post-hoc justifications that may not faithfully capture the model's internal reasoning process. We propose Causal Concept Bottleneck Discovery (CCBD), a framework that jointly learns human-interpretable concepts and their causal relationships to predictions in an end-to-end manner. Unlike traditional concept bottleneck models that require pre-defined concept annotations, CCBD automatically discovers a sparse set of interpretable concepts from data through a novel information-theoretic objective that balances concept utility, diversity, and human-alignment. Each concept is grounded through adversarial probing to ensure it captures semantically meaningful features rather than arbitrary directions in representation space. Crucially, we enforce causal sufficiency by training the prediction head exclusively on concept activations, guaranteeing that discovered concepts constitute the complete causal pathway from inputs to outputs. This architecture enables both local explanations through concept attribution and global understanding through learned concept graphs. By bridging automated concept discovery with causal interpretability, CCBD provides a principled approach to building models that are interpretable by design rather than post-hoc explanation.
