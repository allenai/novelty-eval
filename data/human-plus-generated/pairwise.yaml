  ideas:
    0: The probabilistic diffusion model (DM), generating content by inferencing through a recursive chain structure, has emerged as a powerful framework for visual generation. After pre-training on enormous data, the model needs to be properly aligned to meet requirements for downstream applications. How to efficiently align the foundation DM is a crucial task. Contemporary methods are either based on Reinforcement Learning (RL) or truncated Backpropagation (BP). However, RL and truncated BP suffer from low sample efficiency and biased gradient estimation, respectively, resulting in limited improvement or, even worse, complete training failure. To overcome the challenges, we propose the Recursive Likelihood Ratio (RLR) optimizer, a Half-Order (HO) fine-tuning paradigm for DM. The HO gradient estimator enables the computation graph rearrangement within the recursive diffusive chain, making the RLR's gradient estimator **an unbiased one with lower variance** than other methods. We theoretically investigate the bias, variance, and convergence of our method. Furthermore, we propose a novel prompt technique that is natural for the RLR to achieve a synergistic effect.
    1: Contemporary generative models synthesize content through monolithic processes that entangle high-level compositional decisions with low-level rendering details, limiting interpretability and fine-grained control. We introduce Compositional Hierarchical Generation (CHG), a framework that explicitly decouples semantic planning from detailed synthesis through a two-stage architecture. A compositional planner first constructs an abstract structured representation capturing layout, semantic relationships, and narrative coherence using learned discrete compositional codes. This plan then conditions a synthesis network that renders high-fidelity outputs while maintaining consistency with the compositional structure. Critically, we enable iterative refinement through a feedback mechanism that evaluates compositional coherence and guides revisions to both planning and synthesis stages. Our approach learns compositional representations via contrastive objectives that encourage semantic meaningfulness and cross-modal alignment. The hierarchical formulation provides natural intervention points for user control, supports interpretable editing of generated content, and facilitates complex multi-element generation tasks such as illustrated narratives and structured scientific visualizations. By separating what to generate from how to generate it, CHG offers a principled path toward more controllable and compositionally-aware generative modeling.
