    0: 'We present the first comprehensive evaluation of AI agents against human cybersecurity professionals in a live enterprise environment. We evaluate ten cybersecurity professionals alongside six existing AI agents and ARTEMIS, our new agent scaffold, on a large university network consisting of $\sim$8,000 hosts across 12 subnets. ARTEMIS is a multi-agent framework featuring dynamic prompt generation, arbitrary sub-agents, and automatic vulnerability triaging. AI agents offer advantages in systematic enumeration, parallel exploitation, and cost---certain ARTEMIS variants cost $18/hour versus $60/hour for professional penetration testers. We also identify key capability gaps: AI agents exhibit higher false-positive rates and struggle with GUI-based tasks.'
    1: Current alignment techniques assume a unified target for "human values," optimizing language models toward a single reward signal or constitutional principle set. However, this value monism fails to capture legitimate pluralism across cultures, communities, and contexts—potentially encoding dominant group preferences as universal norms. We introduce Pluralistic Alignment via Contextual Value Modeling, a framework that trains models to recognize when queries invoke contested values rather than converging prematurely on a single response. Our approach learns a latent space of value dimensions from diverse human feedback, enabling models to detect normative disagreement and either surface multiple legitimate perspectives or defer to users. By decomposing alignment into value recognition, conflict detection, and perspective synthesis, we move beyond the paradigm of finding "the right answer" toward systems that navigate genuine moral complexity. This framework has implications for fairness by preventing majority-group value dominance, for safety by avoiding cultural value imperialism, and for societal benefit by fostering democratic AI systems that respect rather than erase human diversity.
