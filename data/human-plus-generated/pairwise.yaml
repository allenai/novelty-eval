    0: Neural population activity exhibits complex, high-dimensional dynamics that reflect underlying cognitive computations, yet extracting interpretable structure from such data remains challenging. We introduce Cognitive Dynamical Autoencoders (CogDAE), a framework that learns low-dimensional latent dynamics from neural recordings while enforcing cognitive priors about compositional structure and behavioral alignment. Unlike standard neural dimensionality reduction techniques, CogDAE incorporates architectural inductive biases that encourage the learned dynamics to factorize into reusable computational motifs—discrete latent programs that combine flexibly across tasks and contexts. A cross-modal alignment objective ensures that neural trajectory geometry mirrors behavioral state spaces, enabling direct interpretation of latent dimensions in terms of cognitive variables. The model employs a hierarchical structure where slow timescale variables modulate fast neural dynamics, reflecting the multi-scale nature of cortical processing. By learning structured, behaviorally-grounded representations of neural computation, CogDAE provides a principled approach for hypothesis generation in cognitive neuroscience and offers insights into how biological networks implement flexible, compositional cognition.
    1: Training recurrent neural networks (RNNs) to perform neuroscience-style tasks has become a popular way to generate hypotheses for how neural circuits in the brain might perform computations. Recent work has demonstrated that task-trained RNNs possess a strong simplicity bias. In particular, this inductive bias often causes RNNs trained on the same task to collapse on effectively the same solution, typically comprised of fixed-point attractors or other low-dimensional dynamical motifs. While such solutions are readily interpretable, this collapse proves counterproductive for the sake of generating a set of genuinely unique hypotheses for how neural computations might be performed. Here we propose Iterative Neural Similarity Deflation (INSD), a simple method to break this inductive bias. By penalizing linear predictivity of neural activity produced by standard task-trained RNNs, INSD finds an alternative class of solutions to classic neuroscience-style RNN tasks. Our findings underscore the importance of moving beyond the simplicity bias to uncover richer and more varied models of neural computation.
