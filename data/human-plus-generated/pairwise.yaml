    0: Graph neural networks excel at learning from pairwise relationships, yet many complex systems exhibit multi-scale structures spanning diverse geometric and topological representations—from graphs and hypergraphs to simplicial complexes and Riemannian manifolds. We introduce Multi-Topology Learning Networks (MTLNs), a unified framework that simultaneously learns representations across heterogeneous geometric views of relational data. Rather than committing to a single structural prior, MTLNs maintain parallel encoders for different topological perspectives and employ cross-topology attention mechanisms to dynamically route and integrate information between views. A learnable topology selection module discovers which geometric structure is most informative for different regions of the data and subtasks, enabling adaptive structural reasoning. The framework incorporates geometric consistency regularization to ensure coherent representations across views while preserving topology-specific inductive biases. By treating graphs, hypergraphs, and simplicial structures as complementary rather than competing representations, MTLNs capture both local pairwise interactions and global higher-order dependencies. This approach provides a flexible paradigm for relational learning in domains where the "correct" topology is ambiguous or multi-faceted, from molecular modeling to social network analysis.
    1: 'Equivariant Neural Networks (ENNs) have empowered numerous applications in scientific fields. Despite their remarkable capacity for representing geometric structures, ENNs suffer from degraded expressivity when processing symmetric inputs: the output representations are invariant to transformations that extend beyond the input''s symmetries. The mathematical essence of this phenomenon is that a symmetric input, after being processed by an equivariant map, experiences an increase in symmetry. While prior research has documented symmetry increase in specific cases, a rigorous understanding of its underlying causes and general reduction strategies remains lacking. In this paper, we provide a detailed and in-depth characterization of symmetry increase together with a principled framework for its reduction: (i) For any given feature space and input symmetry group, we prove that the increased symmetry admits an infimum determined by the structure of the feature space; (ii) Building on this foundation, we develop a computable algorithm to derive this infimum, and propose practical guidelines for feature design to prevent harmful symmetry increases. (iii) Under standard regularity assumptions, we demonstrate that for most equivariant maps, our guidelines effectively reduce symmetry increase.'
