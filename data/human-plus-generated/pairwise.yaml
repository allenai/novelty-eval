    0: 'Electrophysiological (ExG) signals offer valuable insights into human physiology, yet building foundation models that generalize across everyday tasks remains challenging due to two key limitations: (i) insufficient data diversity, as most ExG recordings are collected in controlled labs with bulky, expensive devices; and (ii) task-specific model designs that require tailored processing (i.e., targeted frequency filters) and architectures, which limit generalization across tasks. To address these challenges, we introduce an approach for scalable, task-agnostic ExG monitoring in the wild. We collected 50 hours of unobtrusive free-living ExG data with an earphone-based hardware prototype to narrow the data diversity gap. At the core of our approach is Physiology-informed Multi-band Tokenization (PiMT), which decomposes ExG signals into 12 physiology-informed tokens, followed by a reconstruction task to learn robust representations. This enables adaptive feature recognition across the full frequency spectrum while capturing task-relevant information. We also introduce the DailySense dataset—the first to enable ExG-based analysis across five human senses.'
    1: Neural foundation models trained on naturalistic stimuli and behavior could transform our understanding of brain-cognition relationships, yet existing approaches fail to capture the multi-scale temporal dynamics and cross-subject variability inherent to neural data. We introduce NeuroAlign, a hierarchical multimodal contrastive framework that aligns heterogeneous neural recordings with naturalistic sensory streams and behavioral outputs. Our approach employs temporal hierarchy-aware encoders that capture neural dynamics from milliseconds to minutes, while a subject-adaptive alignment module learns to map individual brain geometries into a shared cognitive space. Contrastive objectives enforce correspondence between neural states and external variables—visual scenes, spoken narratives, motor actions—without requiring explicit trial structure or time-locked designs. A novel causal masking strategy during training enables the model to perform zero-shot cognitive state decoding and cross-modal prediction. By learning transferable representations of cognitive processes grounded in ecologically valid contexts, NeuroAlign provides a unified framework for neural data interpretation that bridges recording modalities, experimental paradigms, and individual subjects.
