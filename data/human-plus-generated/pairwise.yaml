    0: 'Adversarial Training (AT) is a known, powerful, well-established technique for improving classifier robustness to input perturbations, yet its applicability beyond discriminative settings remains limited. Motivated by the widespread use of score-based generative models and their need to operate robustly under substantial noisy or corrupted input data, we propose an adaptation of AT for these models.

      We introduce a principled formulation of AT for Diffusion Models (DMs) that replaces the conventional *invariance* objective with an *equivariance* constraint aligned to the denoising dynamics of score matching. Our method integrates seamlessly into diffusion training by adding either random perturbations--similar to randomized smoothing--or adversarial ones--akin to AT.

      Our approach offers several advantages: **(a)** tolerance to heavy noise and corruption, **(b)** reduced memorization, **(c)** robustness to outliers and extreme data variability and **(d)** resilience to iterative adversarial attacks.'
    1: 'Preference-based alignment methods like RLHF optimize language models toward human values by learning from feedback data, yet they systematically underrepresent minority perspectives due to majoritarian aggregation of preferences. We introduce Privacy-Regularized Pluralistic Alignment, a framework that repurposes differential privacy mechanisms to achieve fairer representation of diverse human values during alignment. Rather than treating privacy solely as a data protection tool, we leverage carefully calibrated noise injection to prevent reward models from overfitting to dominant preference clusters, effectively amplifying underrepresented viewpoints. Our approach maintains formal privacy guarantees for individual annotators while encouraging the model to respect preference pluralism across demographic and cultural groups. By connecting the technical apparatus of differential privacy with normative goals of fairness, we demonstrate how privacy-preserving mechanisms can serve dual purposes: protecting sensitive training data while promoting more equitable alignment outcomes that reflect the diversity of human values rather than converging toward majority consensus.'
