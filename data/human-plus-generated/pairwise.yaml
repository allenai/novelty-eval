    0: Multi-Agent System (MAS) powered by Visual Language Models (VLMs) enables challenging tasks but suffers from a novel failure term, multi-agent visual hallucination snowballing, where hallucinations are seeded in a single agent and amplified by following ones due to the over-reliance on textual flow to relay visual information. Through turn-, layer-, and token-wise attention analyses, we provide detailed insights into the essence of hallucination snowballing regarding the reduction of visual attention allocation. It leads us to identify a subset of vision tokens with a unimodal attention peak in middle layers that best preserve visual evidence but gradually diminish in deeper agent turns, resulting in the visual hallucination snowballing in MAS. Thus, we propose ViF, a lightweight, model-agnostic mitigation paradigm that relays inter-agent messages with Visual Flow powered by the selected visual relay tokens and applies attention reallocation to amplify this pattern.
    1: We propose Neural Symbolic Emergence (NSE), a novel architecture that enables large language models to learn compositional symbolic reasoning capabilities through emergent internal representations. Rather than imposing predefined symbolic structures, NSE introduces a differentiable bottleneck layer that encourages the model to self-organize discrete, reusable symbolic primitives during standard pretraining. These learned symbols can be dynamically composed and manipulated through attention-based operations that mirror classical symbolic reasoning while remaining fully integrated within the neural framework. The architecture combines continuous representation learning with discrete bottleneck constraints, allowing symbols to emerge naturally from data patterns rather than human specification. By maintaining end-to-end differentiability, NSE preserves the scalability and flexibility of foundation models while enhancing systematic generalization on tasks requiring multi-hop reasoning, logical consistency, and compositional understanding. This approach bridges neural and symbolic paradigms without requiring explicit symbolic supervision, offering a path toward more robust and interpretable reasoning in future foundation models.
