    0: This paper focuses on Geodesic Principal Component Analysis (GPCA) on a collection of probability distributions using the Otto-Wasserstein geometry. The goal is to identify geodesic curves in the space of probability measures that best capture the modes of variation of the underlying dataset. We first address the case of a collection of Gaussian distributions, and show how to lift the computations in the space of invertible linear maps. For the more general setting of absolutely continuous probability measures, we leverage a novel approach to parameterizing geodesics in Wasserstein space with neural networks.
    1: Modern representation learning methods typically commit to a single supervision paradigm, yet real-world data presents heterogeneous supervision signals with varying reliability and coverage. We introduce Adaptive Multi-Source Representation Learning, a unified framework that dynamically integrates self-supervised, semi-supervised, and supervised objectives based on their local informativeness. Rather than treating different supervision types as competing alternatives, our approach learns sample-specific and dimension-specific gating functions that weight the contribution of each supervision source. The framework employs a meta-objective that evaluates supervision quality through held-out validation performance, enabling automatic discovery of when instance-level contrastive signals outweigh noisy labels, or when pseudo-labels provide better guidance than self-supervision. A key innovation is the disentanglement of representation subspaces, where different dimensions specialize in exploiting different supervision types. This allows the model to simultaneously leverage the semantic structure discovered through self-supervision while incorporating discriminative information from limited labels, and robustly handling label noise through dynamic down-weighting. The resulting representations adapt to the supervision landscape, providing a principled solution for learning under mixed and imperfect supervision.
