    0: We present a geometric learning theory framework that characterizes generalization through the lens of architecture-manifold alignment. Classical learning theory treats data as points in ambient space, ignoring the low-dimensional geometric structure inherent in real-world datasets. We introduce the concept of architectural affinity—a measure quantifying how well a network's inductive bias aligns with the intrinsic geometry of the data manifold, including its dimensionality, curvature, and local smoothness properties. Our framework establishes that sample complexity and generalization error depend critically on this alignment rather than ambient dimensionality alone. We derive novel PAC-style bounds showing that architectures with high affinity to the data geometry achieve exponentially better sample efficiency compared to geometry-agnostic models. This theory provides a unified explanation for empirical phenomena such as the effectiveness of convolutional networks on grid-structured data and attention mechanisms on relational data, while offering principled guidelines for designing architectures tailored to specific data geometries through spectral and differential geometric analysis.
    1: We develop a theory of transfer learning in infinitely wide neural networks under gradient flow that quantifies when pretraining on a source task improves generalization on a target task. We analyze both (i) fine-tuning, when the downstream predictor is trained on top of source-induced features and (ii) a jointly rich setting, where both pretraining and downstream tasks can operate in a feature learning regime, but the downstream model is initialized with the features obtained after pre-training. In this setup, the summary statistics of randomly initialized networks after a rich pre-training are adaptive kernels which depend on both source data and labels. For (i), we analyze the performance of a readout for different pretraining data regimes. For (ii), the summary statistics after learning the target task are still adaptive kernels with features from both source and target tasks. Our theory allows interpretable conclusions on performance, which depend on the amount of data on both tasks, the alignment between tasks, and the feature learning strength.
