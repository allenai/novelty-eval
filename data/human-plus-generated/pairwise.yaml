    0: Physical simulation relies on spatially-varying mechanical properties, typically laboriously hand-crafted. We present the first feed-forward model to predict fine-grained mechanical properties, Young's modulus ($E$), Poisson's ratio ($\nu$), and density ($\rho$), throughout *the volume* of 3D objects. Our model supports any 3D representation that can be rendered and voxelized, including Signed Distance Fields (SDFs), Gaussian Splats and Neural Radiance Fields (NeRFs). To achieve this, we aggregate per-voxel multi-view features for any input, which are passed to our trained Geometry Transformer to predict per-voxel material latent codes. These latents reside on the trained manifold of physically plausible materials, which we train on a real-world dataset, guaranteeing the validity of decoded per-voxel materials. To obtain object-level training data, we propose an annotation pipeline combining knowledge from segmented 3D datasets, material databases, and a vision-language model. VoMP estimates volumetric properties and can convert 3D objects into simulation-ready assets, enabling realistic deformable simulations.
    1: 'Cross-modal understanding typically emphasizes alignment and retrieval, yet many applications require generating detailed content in one modality from another—such as synthesizing realistic audio from silent video or hallucinating plausible visual dynamics from sound alone. We introduce Cross-Modal Causal Synthesis, a framework that learns fine-grained predictive relationships between vision and audio through temporal causal modeling. Unlike conventional alignment approaches, our method explicitly captures how visual events generate acoustic signatures and how audio patterns imply visual motion, enabling high-fidelity cross-modal generation. We employ a temporal transformer architecture with modality-specific encoders and a shared causal attention mechanism that models lead-lag relationships and probabilistic dependencies across time. The framework supports bidirectional generation: predicting detailed audio waveforms from video frames and synthesizing coherent visual sequences from audio spectrograms. Applications span accessibility tools for the hearing and visually impaired, content creation for film and gaming, and scientific analysis of audio-visual phenomena in domains like wildlife monitoring and manufacturing inspection where one modality may be unavailable or degraded.'
