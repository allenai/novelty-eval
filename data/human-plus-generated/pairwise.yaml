    0: Foundation models excel at general-purpose tasks but struggle to adapt their reasoning strategies and behavioral patterns without costly retraining. While retrieval-augmented generation addresses factual knowledge gaps, it cannot inject new cognitive skills or modify inferential processes. We propose Meta-Modular Foundation Models, a framework that treats pre-trained LLMs as computational substrates augmented with dynamically composable skill modules. These lightweight modules—implemented as context-dependent routing mechanisms and specialized adapter networks—enable rapid behavioral adaptation while preserving core capabilities. Our approach introduces a meta-learning protocol that allows models to internalize new reasoning patterns from minimal task demonstrations, selectively activating relevant skill modules during inference. Unlike fine-tuning, which entangles new knowledge with existing parameters, our architecture maintains explicit separation between general-purpose representations and specialized computational pathways. This enables continuous capability expansion, domain-specific customization, and multi-tenant deployments where different users access distinct skill compositions from a shared foundation model. Meta-Modular Foundation Models provide a path toward truly adaptive AI systems that evolve their behavioral repertoire without sacrificing generality or requiring prohibitive computational resources.
    1: Recent progress in large reasoning models for challenging mathematical reasoning has been driven by reinforcement learning (RL). Incorporating long chain-of-thought (CoT) data during mid-training has also been shown to substantially improve reasoning depth. However, current approaches often utilize CoT data indiscriminately, leaving open the critical question of which data types most effectively enhance model reasoning capabilities. In this paper, we define the foundation model's reasoning potential for the first time as the inverse of the number of independent attempts required to correctly answer the question, which is strongly correlated with the final model performance. We then propose utilizing diverse data enriched with high-value reasoning patterns to expand the reasoning potential. Specifically, we abstract atomic reasoning patterns from CoT sequences, characterized by commonality and inductive capabilities, and use them to construct a core reference set enriched with valuable reasoning patterns. Furthermore, we propose a dual-granularity algorithm involving chains of reasoning patterns and token entropy, efficiently selecting high-value CoT data (CoTP) from the data pool that aligns with the core set, thereby training models to master reasoning effectively.
