    0: Generative diffusion models excel at producing high-fidelity samples but struggle with compositional reasoning—generating outputs that simultaneously satisfy multiple interdependent constraints expressed as logical specifications. We introduce Constraint-Guided Diffusion, a framework that incorporates differentiable constraint satisfaction mechanisms directly into the denoising process of latent diffusion models. Our approach represents logical constraints as energy functions over the latent space and guides the reverse diffusion trajectory through gradient-based optimization that balances constraint satisfaction with sample quality. Unlike post-hoc filtering or rejection sampling, constraints are actively enforced throughout generation via a novel scheduling mechanism that adapts constraint strength across diffusion timesteps. We further introduce a compositional operator algebra that allows complex specifications to be constructed from primitive constraints, enabling hierarchical reasoning during generation. The framework supports spatial relationships, attribute binding, counting constraints, and temporal consistency for video generation. By unifying symbolic reasoning with neural generation, our method enables applications requiring both creative synthesis and rigorous constraint adherence, from architectural design to molecular generation with specified properties.
    1: 'Massive Activations (MAs) are a well-documented phenomenon across Transformer architectures, and prior studies in both LLMs and ViTs have shown that they play a substantial role in shaping model behavior. However, the nature and function of MAs within Diffusion Transformers (DiTs) remain largely unexplored. In this work, we systematically investigate these activations to elucidate their role in visual generation. We found that these massive activations occur across all spatial tokens, and their distribution is modulated by the input timestep embeddings. Importantly, our investigations further demonstrate that these massive activations play a key role in local detail synthesis, while having minimal impact on the overall semantic content of output.

      Building on these insights, we propose Detail Guidance (DG), a MAs-driven, training-free self-guidance strategy to explicitly enhance local detail fidelity for DiTs. Specifically, DG constructs a degraded "detail-deficient" model by disrupting MAs and leverages it to guide the original network toward higher-quality detail synthesis. Our DG can seamlessly integrate with Classifier-Free Guidance (CFG), enabling joint enhancement of detail fidelity and prompt alignment.'
