    0: 'The rapid progress of AI and robotics may profoundly transform society, as humans and robots begin to coexist in shared communities, bringing both opportunities and challenges. To explore this future, we present Virtual Community—an open-world platform for humans, robots, and society—built on a universal physics engine and grounded in real-world 3D scenes. With Virtual Community, we aim to enable the study of embodied social intelligence at scale. To support these, Virtual Community features: 1) An open-source multi-agent physics simulator that supports robot, human, and their interactions within a society; 2) A large‑scale, real‑world aligned environment generation pipeline, including vast outdoor space, diverse indoor scenes, and a community of grounded agents with rich characters and appearances. Leveraging Virtual Community, we propose two novel challenges. The Community Planning Challenge evaluates multi‑agent reasoning and planning in open‑world settings, such as cooperating to help agents with daily activities and efficiently connecting other agents. The Community Robot Challenge requires multiple heterogeneous robots to collaborate in solving complex open‑world tasks. We have open-sourced our project and hope that Virtual Community will unlock further study of human-robot coexistence in open worlds.'
    1: Current machine learning benchmarks evaluate tasks in isolation, measuring performance on individual datasets without considering how models handle multiple objectives simultaneously or compose knowledge across domains. We propose Compositional Multi-Task Benchmarks (CMTB), a new evaluation paradigm that explicitly measures cross-task interference, knowledge retention, and compositional generalization. CMTB introduces a suite of interconnected tasks where performance is evaluated not only on individual tasks but also on dynamically generated compositional challenges that require synthesizing knowledge from multiple domains. The benchmark adaptively identifies model weaknesses and generates novel test instances by composing primitive concepts in configurations absent from training data. Unlike traditional benchmarks that allow task-specific fine-tuning, CMTB requires models to maintain performance across all tasks simultaneously while solving compositional challenges, revealing catastrophic forgetting, negative transfer, and failures in systematic generalization. This framework provides a more realistic assessment of model capabilities by capturing the multi-objective, compositional nature of real-world intelligence, offering insights into architectural choices and training strategies that promote robust, generalizable learning.
