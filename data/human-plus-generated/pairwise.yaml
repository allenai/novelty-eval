  ideas:
    0: Recent work shows Tree-Sliced Optimal Transport to be an efficient and more expressive alternative to Sliced Wasserstein (SW), improving downstream performance. Tree-sliced metrics compare probability distributions by projecting measures onto tree metric spaces; a central example is the Tree-Sliced Wasserstein (TSW) distance, which applies the $1$-Wasserstein metric after projection. However, computing tree-based $p$-Wasserstein for general $p$ is costly, largely confining practical use to $p=1$. This restriction is a significant bottleneck, as higher-order metrics ($p > 1$) are preferred in gradient-based learning for their more favorable optimization landscapes. In this work, we revisit Sobolev integral probability metrics (IPM) on trees to obtain a practical generalization of TSW. Building on the insight that a suitably regularized Sobolev IPM admits a closed-form expression, we introduce TS-Sobolev, a tree-sliced metric that aggregates regularized Sobolev IPMs over random tree systems and remains tractable for all $p \ge 1$; for $p>1$, TS-Sobolev has the same computational complexity as TSW at $p=1$. Notably, at $p=1$ it recovers TSW exactly. Consequently, TS-Sobolev serves as a drop-in replacement for TSW in practical applications, with an additional flexibility in changing $p$. Furthermore, we extend this framework to define a corresponding metric for probability measures on hyperspheres.
    1: Higher-order interactions in complex systems—from protein complexes to social networks—exhibit geometric structure beyond pairwise graphs, yet current neural architectures struggle to capture localized feature variations and multi-scale consistency constraints. We introduce Neural Sheaf Diffusion, a framework that unifies simplicial complex learning with cellular sheaf theory to enable adaptive geometric representations. Rather than fixing uniform feature spaces across a topology, we parameterize sheaves that assign learnable vector spaces to each simplex and equivariant linear maps to face relations, encoding domain-specific geometric constraints. A sheaf Laplacian diffusion process then propagates and harmonizes signals while respecting these local geometric structures, naturally handling heterogeneous data dimensions and enforcing consistency across scales. The framework jointly learns both the underlying topological structure and the sheaf geometry from data through end-to-end training. This approach provides a principled inductive bias for modeling systems where local coordinate systems vary—such as molecular conformations, directional flows in networks, or frame-dependent physical quantities—advancing geometric deep learning beyond the restrictive assumption of global feature space homogeneity.
