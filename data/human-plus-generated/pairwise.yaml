    0: 'Medical question answering (QA) benchmarks often focus on multiple-choice or fact-based tasks, leaving open-ended answers to real patient questions underexplored. This gap is particularly critical in mental health, where patient questions often mix symptoms, treatment concerns, and emotional needs, requiring answers that balance clinical caution with contextual sensitivity.

      We present CounselBench, a large-scale benchmark developed with 100 mental health professionals to evaluate and stress-test large language models (LLMs) in realistic help-seeking scenarios. The first component, CounselBench-EVAL, contains 2,000 expert evaluations of answers from GPT-4, LLaMA 3, Gemini, and online human therapists on patient questions from the public forum CounselChat. Each answer is rated across six clinically grounded dimensions, with span-level annotations and written rationales. To probe failure modes more directly, we construct CounselBench-Adv, an adversarial dataset of 120 expert-authored mental health questions designed to trigger specific model issues. Together, CounselBench establishes a clinically grounded framework for benchmarking LLMs in mental health QA.'
    1: Machine learning benchmarks traditionally consist of static datasets that quickly become saturated as models improve, limiting their utility for distinguishing state-of-the-art systems and identifying fundamental capability gaps. We propose Adaptive Adversarial Benchmarks (AAB), a framework that dynamically generates evaluation instances by analyzing systematic failure patterns across submitted models. AAB employs a meta-learning approach to identify underexplored regions of the task space where current models struggle, then synthesizes new test cases that probe these weaknesses while maintaining validity and alignment with the benchmark's objectives. The framework incorporates a difficulty calibration mechanism that ensures generated instances remain challenging yet solvable, preventing trivial or ill-posed problems. Rather than simply ranking models, AAB maintains a multidimensional capability profile for each system, tracking performance across evolving challenge types and difficulty levels. This approach transforms benchmarks from static snapshots into living diagnostic tools that co-evolve with model capabilities, providing sustained value for the research community while revealing persistent limitations that warrant focused investigation.
