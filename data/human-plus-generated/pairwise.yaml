    0: Graph neural networks excel at learning from relational data but struggle to capture the interplay between local geometric structure and global topological properties that characterize complex systems. We introduce Geometric-Topological Neural Networks (GTNNs), a framework that jointly learns geometric embeddings and topological signatures through a coupled optimization process. Our approach constructs a learnable product manifold that adapts its local curvature based on persistent homology features extracted from the input graph at multiple scales. A novel cross-modal attention mechanism allows geometric message passing to be modulated by topological persistence diagrams, while reciprocally using learned geometric distances to refine topological filtrations. This bidirectional coupling enables the model to discover when local geometry (e.g., hyperbolic structure in hierarchical regions) should be informed by global topology (e.g., cycle structures), and vice versa. The framework naturally handles multi-scale phenomena through a hierarchical coarsening scheme that preserves both geometric and topological properties across resolutions. GTNNs provide a unified lens for reasoning about complex relational data where geometry and topology are fundamentally intertwined, from molecular structures to social networks.
    1: 'Watermarking provides an effective means for data governance. However, conventional post-editing graph watermarking approaches degrade the graph quality and involve NP-hard subroutines. Alternatively, recent approaches advocate for embedding watermarking patterns in the noisy latent during data generation from diffusion models, but remain uncharted for graph models due to the hardness of inverting the graph diffusion process. In this work, we propose CheckWate: the first watermarking framework for graph diffusion models embedding checkerboard watermark and providing polynomial time verification. To address NP-completeness due to graph isomorphism, CheckWate embeds the watermark into the latent eigenvalues, which are isomorphism-invariant. To detect the watermark through reversing the graph diffusion process, CheckWate leverages the graph eigenvectors to approximately dequantize the discrete graph back to the continuous latent, with theoretical guarantees on the detectability and dequantization error. We further introduce a latent sparsification mechanism to enhance the robustness of CheckWate against graph modifications.'
