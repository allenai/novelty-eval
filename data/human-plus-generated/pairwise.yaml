    0: Current explainability methods for neural networks predominantly provide post-hoc rationalizations that may not faithfully represent internal decision-making processes. We introduce Algorithmic Circuit Discovery (ACD), a framework that automatically extracts interpretable computational subgraphs from trained neural networks and translates them into human-readable algorithmic descriptions. ACD combines causal intervention techniques to identify functionally meaningful circuit boundaries with sparse dictionary learning to decompose distributed representations into interpretable primitive operations. By applying program synthesis over the discovered circuits, we generate structured pseudocode that captures the model's actual reasoning process rather than approximating it. Our approach addresses the faithfulness gap in explainable AI by grounding explanations directly in the model's computational mechanism. The resulting algorithmic descriptions preserve causal relationships between intermediate computations, enabling domain experts to audit specific reasoning pathways, diagnose failure modes, and verify alignment with domain knowledge. ACD provides a principled pathway from opaque neural computations to transparent, verifiable algorithms, advancing both the science of interpretability and the practical deployment of trustworthy AI systems in high-stakes domains.
    1: Finetuning (pretrained) language models is a standard approach for updating their internal parametric knowledge and specializing them to new tasks and domains. However, the corresponding model weight changes ("weight diffs") are not generally interpretable. While inspecting the finetuning dataset can give a sense of how the model might have changed, these datasets are often not publicly available or are too large to work with directly. Towards the goal of broadly understanding model weight changes in natural language, we introduce Diff Interpretation Tuning (DIT), a method that trains models to describe their own finetuning-induced modifications. Our approach uses synthetic, labeled weight diffs to train an introspection adapter, which can be applied to a compatible finetuned model to make it self-describe the weight changes. We consider two proof-of-concept settings—reporting hidden behaviors and summarizing finetuned knowledge—in which models describe their finetuning-induced modifications using concise natural language descriptions.
