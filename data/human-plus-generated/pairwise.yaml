    0: 'Multimodal learning typically relies on correlation-based fusion strategies that combine information from vision, audio, and language without explicitly modeling their causal interdependencies. We introduce Causal Multimodal Representations (CMR), a framework that learns directional influence relationships between modalities rather than treating them as independent information streams. By formulating multimodal understanding as a structural causal model, CMR discovers how information flows between modalities—for instance, how linguistic intent shapes gestural expression, or how visual context modulates acoustic prosody. Our approach employs contrastive causal estimation to disentangle spurious correlations from genuine cross-modal influences, enabling the model to construct intervention-aware representations. These causally-grounded embeddings provide several advantages: improved robustness to missing or corrupted modalities through causal reasoning, enhanced zero-shot transfer by capturing invariant causal mechanisms, and interpretable cross-modal predictions that expose the generative dependencies underlying multimodal phenomena. CMR offers a principled alternative to standard fusion architectures, shifting multimodal learning from pattern matching toward understanding the causal fabric that binds different perceptual channels in natural communication and interaction.'
    1: Video diffusion models (DMs) have enabled high-quality video synthesis. Yet, their substantial computational and memory demands pose serious challenges to real-world deployment, even on high-end GPUs. As a commonly adopted solution, quantization has proven notable success in reducing cost for image DMs, while its direct application to video DMs remains ineffective. In this paper, we present *QVGen*, a novel quantization-aware training (QAT) framework tailored for high-performance and inference-efficient video DMs under extremely low-bit quantization (*e.g.*, $4$-bit or below). We begin with a theoretical analysis demonstrating that reducing the gradient norm is essential to facilitate convergence for QAT. To this end, we introduce auxiliary modules ($\Phi$) to mitigate large quantization errors, leading to significantly enhanced convergence. To eliminate the inference overhead of $\Phi$, we propose a *rank-decay* strategy that progressively eliminates $\Phi$. Specifically, we repeatedly employ singular value decomposition (SVD) and a proposed rank-based regularization $\mathbf{\gamma}$ to identify and decay low-contributing components. This strategy retains performance while zeroing out additional inference overhead.
