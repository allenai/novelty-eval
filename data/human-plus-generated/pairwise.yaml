    0: We study function spaces parametrized by neural networks, referred to as neuromanifolds. Specifically, we focus on deep Multi-Layer Perceptrons (MLPs) and Convolutional Neural Networks (CNNs) with an activation function that is a sufficiently generic polynomial. First, we address the identifiability problem, showing that, for almost all functions in the neuromanifold of an MLP, there exist only finitely many parameter choices yielding that function. For CNNs, the parametrization is generically one-to-one. As a consequence, we compute the dimension of the neuromanifold. Second, we describe singular points of neuromanifolds. We characterize singularities completely for CNNs, and partially for MLPs. In both cases, they arise from sparse subnetworks. For MLPs, we prove that these singularities often correspond to critical points of the mean-squared error loss, which does not hold for CNNs. This provides a geometric explanation of the sparsity bias of MLPs. All of our results leverage tools from algebraic geometry.
    1: We introduce a theoretical framework for analyzing compositional generalization in neural networks trained via gradient descent. While classical learning theory bounds generalization error in terms of model complexity and sample size, these bounds fail to explain why deep networks generalize to novel compositions of learned primitives—a capability essential for systematic reasoning and transfer learning. We formalize compositional structure through a hierarchical decomposition of target functions and prove that gradient-based learning exhibits an implicit bias toward discovering modular representations that respect this structure. Our analysis reveals that when the data generating process admits compositional factorization, networks learn intermediate features corresponding to reusable primitives, and the sample complexity scales with the compositional depth and diversity of primitives rather than exponentially with input dimension. We further establish generalization guarantees for out-of-distribution settings where test inputs contain novel combinations of training primitives. This framework provides theoretical justification for emergent phenomena in deep learning including systematic generalization, rapid adaptation, and transfer across related tasks, while suggesting architectural and algorithmic principles that provably enhance compositional learning.
