  ideas:
    0: 'LLMs hallucinate, yet some confabulations can have social affordances if carefully bounded. We propose critical confabulation (inspired by critical fabulation from literary and social theory), the use of LLM hallucinations to "fill-in-the-gap'''' for omissions in archives due to social and political inequality, and reconstruct divergent yet evidence-bound narratives for history''s ``hidden figures''''. We simulate these gaps with an open-ended narrative cloze task: asking LLMs to generate a masked event in a character-centric timeline sourced from a novel corpus of unpublished texts. We investigate fully-open models and open-weight and proprietary models under a range of prompts designed to elicit controlled and useful hallucinations. Our findings validate LLMs'' foundational narrative understanding capabilities to perform critical confabulation, and show how controlled and well-specified hallucinations can support LLM applications for knowledge production without collapsing speculation into a lack of historical accuracy and fidelity.'
    1: Current alignment techniques for large language models optimize toward implicit, monolithic value systems that often reflect dominant cultural norms, creating systematic disadvantages for communities with different legitimate values and preferences. We introduce Pluralistic Alignment through Normative Probes (PANP), a framework that makes the normative commitments of aligned models explicit, controllable, and auditable. Rather than pursuing a single "aligned" model, PANP learns a decomposed representation of diverse value systems through contrastive learning on culturally-situated human feedback, identifying where communities agree and where they diverge on context-dependent norms. A lightweight steering mechanism allows runtime interpolation between value profiles, while a novel auditing protocol surfaces potential conflicts and enables stakeholder negotiation before deployment. By decoupling technical alignment from normative consensus, PANP transforms alignment from an optimization problem into a governance problem, enabling communities to inspect, contest, and configure AI behavior according to their situated needs while maintaining safety constraints. This approach addresses fundamental tensions between universalist and relativist approaches to AI ethics.
