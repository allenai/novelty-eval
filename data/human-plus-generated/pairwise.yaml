    0: Sparse autoencoders (SAEs) have recently emerged as a powerful tool for interpreting the features learned by large language models (LLMs). By reconstructing features with sparsely activated networks, SAEs aim to recover complex superposed polysemantic features into interpretable monosemantic ones. Despite their wide applications, it remains unclear under what conditions SAEs can fully recover the ground truth monosemantic features from the superposed polysemantic ones. In this paper, we provide the first theoretical analysis with a closed-form solution for SAEs, revealing that they generally fail to fully recover the ground truth monosemantic features unless the ground truth features are extremely sparse. To improve the feature recovery of SAEs in general cases, we propose a reweighting strategy targeting at enhancing the reconstruction of the ground truth monosemantic features instead of the observed polysemantic ones. We further establish a theoretical weight selection principle for our proposed weighted SAE (WSAE).
    1: Despite growing interest in explainable AI, current interpretability methods for multimodal models primarily offer correlational insights through attention visualization or input attribution, failing to reveal the causal mechanisms underlying cross-modal reasoning. We introduce Circuit-Level Multimodal Interpretability (CLMI), a framework that discovers and causally validates the computational pathways responsible for integrating information across vision and language modalities. CLMI combines sparse dictionary learning to identify interpretable features within each modality with targeted ablation and activation patching to trace how these features compose into circuits that perform specific reasoning operations. By mapping the causal graph of cross-modal information flow, our approach enables precise localization of where and how models fail, facilitating targeted interventions without full retraining. Unlike post-hoc explanation methods, CLMI provides mechanistic understanding by identifying minimal sufficient circuits for tasks such as visual grounding, attribute binding, and relational reasoning. This work bridges mechanistic interpretability and multimodal learning, offering practitioners actionable insights for debugging, improving model robustness, and ensuring alignment between model computations and human-interpretable reasoning processes.
