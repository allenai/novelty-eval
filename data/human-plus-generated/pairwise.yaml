  ideas:
    0: 'Multimodal Large Language Models (MLLMs), which couple pre-trained vision encoders and language models, have shown remarkable capabilities. However, their reliance on the ubiquitous Pre-Norm architecture introduces a subtle yet critical flaw: a severe norm disparity between the high-norm visual tokens and the low-norm text tokens. In this work, we present a formal theoretical analysis demonstrating that this imbalance is not a static issue. Instead, it induces an "asymmetric update dynamic", where high-norm visual tokens exhibit a ''''representational inertia,'''' causing them to transform semantically much slower than their textual counterparts. This fundamentally impairs effective cross-modal feature fusion. Our empirical validation across a range of mainstream MLLMs confirms that this theoretical dynamic---the persistence of norm disparity and the resulting asymmetric update rates---is a prevalent phenomenon. Based on this insight, we propose a remarkably simple yet effective solution: inserting a single, carefully initialized LayerNorm layer after the visual projector to enforce norm alignment, suggesting that resolving the architectural imbalance leads to a more holistically capable model.'
    1: 'Foundation models demonstrate impressive capabilities but lack principled mechanisms for uncertainty quantification, leading to overconfident predictions and hallucinations on out-of-distribution inputs. We introduce Epistemic Adapters, a parameter-efficient framework that retrofits pretrained large language models with explicit uncertainty awareness. Our approach learns lightweight adapter modules that map internal activations to calibrated epistemic uncertainty estimates without modifying the base model weights. During inference, these uncertainty representations enable the model to distinguish between confident knowledge recall, uncertain reasoning, and complete ignorance. The framework supports three key capabilities: selective abstention on high-uncertainty queries, uncertainty-guided beam search that favors lower-entropy generation paths, and active learning mechanisms that identify informative examples for human feedback. By decoupling uncertainty estimation from the primary forward pass, Epistemic Adapters maintain generation quality while providing interpretable confidence scores. This work establishes a foundation for more reliable and transparent deployment of frontier models in high-stakes applications where knowing what the model doesn''t know is as critical as what it does.'
