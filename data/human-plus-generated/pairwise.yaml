  ideas:
    0: 'As a topological invariant for discrete structures, discrete curvature has been widely adopted in the study of complex networks and graph neural networks. A prevailing viewpoint posits that edges with highly negative curvature will induce graph bottlenecks and the over-squashing phenomenon. In this paper, we critically re-examine this view and put forward our central claim: **high negative curvature is a sufficient but not a necessary condition for over-squashing**. We first construct a family of counterexamples demonstrating the failure of discrete curvature, where some edges are severely squashed, but the curvature still appears positive. Furthermore, extensive experiments demonstrate that the most commonly used discrete curvature measure --- Ollivier–Ricci curvature --- fails to detect a substantial portion of over-squashed edges. To alleviate this limitation, we propose Weighted Augmented Forman-3 Curvature ($\mathsf{WAF3}$), which significantly improves the detection of over-squashed edges. Additionally, we develop a highly efficient approximation algorithm for $\mathsf{WAF3}$, enabling scalable curvature computation on large graphs.'
    1: Graph neural networks excel at learning from structured data but assume deterministic, known graph topologies. However, many real-world systems exhibit topological uncertainty—molecular resonance structures, probabilistic protein interactions, noisy social networks, and brain connectivity maps all involve edges whose existence or strength is ambiguous. We introduce Variational Graph Topology Learning (VGTL), a framework that jointly learns neural representations and infers task-relevant graph structure from distributions over possible topologies. Rather than operating on a single fixed graph, VGTL maintains a latent distribution over edge configurations and performs message passing through expectation over this distribution. A variational inference objective balances topology reconstruction with downstream task performance, allowing the model to discover which structural patterns matter for prediction while marginalizing over irrelevant topological noise. The framework naturally handles multi-relational uncertainty, temporal edge dynamics, and confidence-weighted connectivity. By treating topology as a latent variable rather than a fixed input, VGTL bridges discrete graph learning with continuous geometric reasoning, enabling robust predictions when graph structure is incomplete, noisy, or inherently stochastic.
