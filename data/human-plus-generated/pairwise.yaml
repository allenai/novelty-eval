    0: We introduce Adaptive Supervision Orchestration (ASO), a unified framework for representation learning that dynamically navigates the full spectrum from unsupervised to supervised learning. Unlike existing methods that operate within fixed supervision regimes, ASO continuously adapts its learning strategy as label availability evolves over time. The framework employs a meta-objective that learns to optimally combine self-supervised contrastive losses, consistency regularization, and supervised classification objectives based on the current labeling budget and data characteristics. Through a progressive knowledge distillation mechanism, representations learned under sparser supervision are refined and preserved as new labels arrive, preventing catastrophic forgetting while incorporating task-specific semantics. ASO treats the supervision spectrum as a continuum rather than discrete paradigms, enabling smooth transitions that leverage complementary information from each regime. The resulting representations exhibit superior transfer learning capabilities and sample efficiency across diverse label availability scenarios, from zero-shot to few-shot to fully supervised settings, without requiring separate models or retraining from scratch.
    1: 'Large Language Model (LLM) pretraining, finetuning, and evaluation rely on input-space reconstruction and generative capabilities. Yet, it has been observed in vision that embedding-space training objectives, e.g., with Joint Embedding Predictive Architectures (JEPAs), are far superior to their input-space counterpart. That mismatch in how training is achieved between language and vision opens up a natural question: {\em can language training methods learn a few tricks from the vision ones?} The lack of JEPA-style LLM is a testimony of the challenge in designing such objectives for language. In this work, we propose a first step in that direction where we develop LLM-JEPA, a JEPA based solution for LLMs applicable both to finetuning and pretraining.'
