    0: 'We introduce Selective Meta-Lifelong Learning, a unified framework that bridges transfer learning, meta learning, and lifelong learning through learned task composition and dynamic knowledge routing. Traditional approaches treat these paradigms separately, leading to systems that either transfer indiscriminately, adapt without memory, or accumulate knowledge without selectivity. Our framework maintains a structured episodic memory of task representations and learns meta-level policies that determine which prior experiences to leverage for each new task. A compositional task encoder discovers latent task structure, enabling the system to identify relevant subspaces of past knowledge while quarantining interference from dissimilar experiences. Gated adaptation modules, trained via meta-learning, selectively activate and compose relevant prior knowledge for rapid few-shot adaptation. The architecture supports continual expansion of its knowledge base while preventing catastrophic forgetting through meta-learned consolidation strategies that operate in task-relevant subspaces. This approach enables AI systems to exhibit human-like learning flexibility: quickly adapting to novel situations by selectively recruiting relevant past experience while maintaining stable long-term knowledge.'
    1: 'A persistent paradox in continual learning (CL) is that neural networks often retain linearly separable representations of past tasks even when their output predictions fail. We formalize this distinction as the gap between *deep* (feature-space) and *shallow* (classifier-level) forgetting. We reveal a critical asymmetry in Experience Replay: while minimal buffers successfully anchor feature geometry and prevent deep forgetting, mitigating shallow forgetting typically requires substantially larger buffer capacities.

      To explain this, we extend the Neural Collapse framework to the sequential setting. We characterize deep forgetting as a geometric drift toward out-of-distribution subspaces and prove that any non-zero replay fraction asymptotically guarantees the retention of linear separability. Conversely, we identify that the ``strong collapse'''' induced by small buffers leads to rank-deficient covariances and inflated class means, effectively blinding the classifier to true population boundaries. By unifying CL with out-of-distribution detection, our work challenges the prevailing reliance on large buffers, suggesting that explicitly correcting these statistical artifacts could unlock robust performance with minimal replay.'
