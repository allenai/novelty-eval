  ideas:
    0: 'While Large Language Models (LLMs) hold promise to become autonomous agents, they often explore suboptimally in sequential decision-making. Recent work has sought to enhance this capability via supervised fine-tuning (SFT) or reinforcement learning (RL), improving regret on the classic multi-armed bandit task. However, it remains unclear how these learning methods shape exploration strategies and how well they generalize. We investigate both paradigms by training LLMs with SFT on expert trajectories and RL with a range of tailored reward signals including a strategic, regret-shaped reward to reduce variance, and an algorithmic reward that enables oracle imitation. Behavioral analysis reveals that gains often stem from more sophisticated but greedier exploitation: RL/SFT agents are more prone to early catastrophic failure than pre-trained models, prematurely abandoning exploration. Furthermore, agents trained to imitate UCB learn to outperform their teacher by adopting more exploitative variants. Our findings clarify when each training paradigm is preferable and advocate tailored reward design and evaluation beyond average regret to promote robust exploratory behavior.'
    1: Foundation models demonstrate impressive capabilities yet lack interpretable, compositional reasoning structures. We propose Modular Reasoning Primitives (MRP), a framework for training large language models to develop explicit, reusable reasoning components that can be flexibly composed across diverse cognitive tasks. Rather than learning monolithic task-specific behaviors, MRP introduces architectural constraints and specialized pre-training objectives that encourage the emergence of atomic reasoning operations—such as deductive inference, analogical mapping, and causal attribution—as discrete, steerable modules within the model's computation graph. Our approach combines contrastive learning over reasoning traces, intervention-based training that isolates individual reasoning steps, and a routing mechanism that dynamically selects and chains appropriate primitives for each query. This modular structure enables systematic generalization to novel reasoning compositions, provides interpretable intermediate states for analysis and debugging, and allows targeted improvement of specific reasoning capabilities without full model retraining. MRP represents a step toward foundation models with human-aligned cognitive architectures.
