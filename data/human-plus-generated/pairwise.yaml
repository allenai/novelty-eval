    0: Graph neural networks operate primarily on discrete topological structures, while geometric deep learning on manifolds handles continuous spaces, yet many complex systems inherently exhibit both discrete relational patterns and continuous geometric properties. We introduce GeomBridge, a unified neural architecture that jointly learns from data residing on hybrid geometric-topological spaces. Our framework employs a novel cross-geometric attention mechanism that dynamically fuses representations from discrete graph convolutions and continuous manifold operators, enabling information flow between topological and geometric views of the same data. By treating different geometric structures as complementary modalities, GeomBridge learns to extract discrete connectivity patterns while simultaneously capturing smooth geometric variations in ambient space. A geometry-aware contrastive objective encourages consistency across views while preserving structure-specific inductive biases. This approach naturally handles molecules with both bond graphs and 3D conformations, social networks with geographic embeddings, and spatiotemporal systems where topology evolves over continuous manifolds. GeomBridge provides a principled path toward representation learning on heterogeneous geometric structures, bridging the gap between discrete and continuous geometric deep learning paradigms.
    1: Large Language Models (LLMs) often generate incorrect or unsupported content, known as hallucinations. Existing detection methods rely on heuristics or simple models over isolated computational traces such as activations, or attention maps. We unify these signals by representing them as attributed graphs, where tokens are nodes, edges follow attentional flows, and both carry features from attention scores and activations. Our approach, CHARM, casts hallucination detection as a graph learning task and tackles it by applying GNNs over the above attributed graphs. We show that CHARM provably subsumes prior attention-based heuristics. Our results shed light on the relevant role played by the graph structure and on the benefits of combining computational traces.
