    0: Representation learning paradigms—unsupervised, self-supervised, semi-supervised, and supervised—are typically treated as distinct methodologies requiring separate architectural designs and training protocols. We introduce Spectrum Learning, a unified framework that views supervision as a continuous spectrum rather than discrete categories. Our approach employs a meta-learned weighting mechanism that dynamically modulates the contribution of multiple learning objectives based on local supervision density in the feature space. By treating each data point as existing along a supervision gradient, the framework adaptively combines contrastive self-supervised losses, consistency regularization, pseudo-labeling, and supervised classification within a single coherent optimization. A novel supervision-aware attention module enables the model to identify which learning paradigm is most informative for different regions of the data manifold. This fluid integration allows seamless transitions as supervision availability changes, from fully unsupervised to fully supervised settings, without architectural modification. Spectrum Learning naturally handles mixed supervision scenarios common in practice, where different samples have varying levels of annotation quality and granularity, providing a principled approach to leveraging all available learning signals simultaneously.
    1: 'Multi-view clustering integrates the consistency and complementarity of different views to achieve unsupervised data grouping. Existing multi-view clustering methods primarily confront two challenges: i) they generally perform feature extraction in the feature domain, which is sensitive to noise and may neglect cluster-specific information that is indistinguishable in the original space; ii) current dynamic fusion methods adopt static strategies to learn weights, lacking capability to adjust strategies adaptively under complex scenarios according to variations in data distribution and view quality. To address these issues, we propose a large language model assisted dynamic agent for multi-view clustering (LLM-DAMVC), a novel framework that recasts multi-view clustering as a dynamic decision-making problem orchestrated by a large language model. Specifically, each view is equipped with complementary agents dedicated to feature extraction. A dual-domain contrastive module is introduced to optimize feature consistency and enhance cluster separability in both the feature domain and frequency domain. Additionally, an LLM-assisted view fusion mechanism provides a flexible fusion weight learning strategy that can be adaptively applied to complex scenarios and significantly different views.'
