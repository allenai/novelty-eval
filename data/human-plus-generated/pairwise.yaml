    0: We introduce Reflexive Reasoning Networks, a framework that endows large language models with internalized verification capabilities for multi-step reasoning tasks. Rather than relying on external verifiers or outcome-based supervision, our approach trains models to simultaneously generate reasoning traces and evaluate their logical coherence through a dual-stream architecture. A generation stream produces step-by-step solutions while a verification stream assesses intermediate steps for logical consistency, factual accuracy, and relevance. These streams are coupled through a contrastive objective that encourages the model to distinguish valid reasoning paths from subtly flawed alternatives generated through controlled perturbations of its own outputs. Crucially, verification signals emerge from the model's internal representations rather than external labels, enabling sample-efficient learning of metacognitive skills. The framework operates through iterative refinement loops where verification assessments guide selective regeneration of problematic reasoning steps. This approach bridges the gap between current foundation models' generative capabilities and the self-corrective reasoning exhibited by human experts, opening pathways toward more reliable and interpretable AI systems.
    1: 'Vision-Language Models (VLMs) enable powerful multi-agent systems, but scaling them is economically unsustainable: coordinating heterogeneous agents under information asymmetry often spirals costs. Existing paradigms, such as Mixture-of-Agents and knowledge-based routers, rely on heuristic proxies that ignore costs and collapse uncertainty structure, leading to provably suboptimal coordination.

      We introduce Agora, a framework that reframes coordination as a decentralized market for uncertainty. Agora formalizes epistemic uncertainty into a structured, tradable asset (perceptual, semantic, inferential), and enforces profitability-driven trading among agents based on rational economic rules. A market-aware broker, extending Thompson Sampling, initiates collaboration and guides the system toward cost-efficient equilibria. Agora establishes market-based coordination as a principled and scalable paradigm for building economically viable multi-agent visual intelligence systems.'
