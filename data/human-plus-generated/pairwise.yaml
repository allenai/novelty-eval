    0: Current alignment techniques for large language models optimize toward aggregated human preferences, risking the marginalization of minority perspectives and cultural values. We introduce Pluralistic Alignment Networks (PAN), a framework that learns decomposed preference representations corresponding to diverse demographic and ideological subgroups while maintaining coherent safety boundaries. Rather than collapsing multi-dimensional human values into a single reward signal, PAN employs a mixture-of-experts architecture where specialized alignment heads capture distinct normative frameworks, dynamically activated based on contextual and user-specified value indicators. A meta-learning objective ensures no single group's preferences dominate during training, while a shared safety module enforces universal constraints against harmful outputs. The framework enables explicit measurement of alignment fairness through value coverage metrics and representational parity analysis. By reframing alignment as inherently pluralistic rather than monolithic, PAN addresses the tension between building helpful assistants and respecting moral diversity, offering a path toward AI systems that serve heterogeneous populations without imposing homogenized values.
    1: Machine unlearning seeks to efficiently remove the influence of selected data while preserving generalization. Significant progress has been made in low dimensions, where the dimension of the parameter $p$ is much smaller than the sample size $n$, but high dimensions, including proportional regimes $p \sim n$, pose serious theoretical challenges as standard optimization assumptions of $\Omega(1)$ strong convexity and $O(1)$ smoothness of the per-example loss $f$ rarely hold simultaneously in proportional regimes $p\sim n$. In this work, we introduce $\varepsilon$-Gaussian certifiability, a canonical and robust notion well-suited to high-dimensional regimes, that optimally captures a broad class of noise adding mechanisms. Then we theoretically analyze the performance of a widely used unlearning algorithm based on one step of the Newton method in the high-dimensional setting described above. Our analysis shows that a single Newton step, followed by a well-calibrated Gaussian noise, is sufficient to achieve both privacy and accuracy in this setting.
