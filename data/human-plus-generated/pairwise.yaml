    0: Existing generative models struggle to satisfy multiple compositional constraints simultaneously, often producing outputs that inadequately balance competing objectives or fail to respect fine-grained user specifications. We introduce Compositional Constraint Diffusion (CCD), a framework that decomposes the generation process into a structured latent space where orthogonal subspaces encode disentangled generative factors. Rather than conditioning on concatenated embeddings or classifier guidance, CCD formulates multi-constraint generation as a dynamic optimization problem in this structured latent space, where each constraint defines a soft potential function. During the reverse diffusion process, latent codes are iteratively refined through gradient-based updates that minimize constraint violations while maintaining sample quality through learned manifold projections. A meta-learning procedure discovers the optimal factorization of the latent space by training on diverse constraint combinations, enabling zero-shot generalization to novel constraint compositions. This approach naturally handles constraint conflicts through Pareto optimization and provides interpretable control over the trade-offs between competing objectives, offering a principled framework for controllable generation in complex, multi-modal scenarios.
    1: The importance of mobile phone GPS trajectory data is widely recognized across many fields, yet the use of real data is often hindered by privacy concerns, limited accessibility, and high acquisition costs. As a result, generating pseudo–GPS trajectory data has become an active area of research. Recent diffusion-based approaches have achieved strong fidelity but remain limited in spatial scale (small urban areas), transportation-mode diversity, and efficiency (requiring numerous sampling steps). To address these challenges, we introduce TrajFlow, which to the best of our knowledge is the first flow-matching-based generative model for GPS trajectory generation. TrajFlow leverages the flow-matching paradigm to improve robustness and efficiency across multiple geospatial scales, and incorporates a trajectory harmonization & reconstruction strategy to jointly address scalability, diversity, and efficiency. As the first nationwide, multi-scale GPS trajectory generation model, TrajFlow demonstrates strong potential to support inter-region urban planning, traffic management, and disaster response, thereby advancing the resilience and intelligence of future mobility systems.
