    0: '*Automated circuit discovery* is a central tool in mechanistic interpretability for identifying the internal components of neural networks responsible for specific behaviors. While prior methods have made significant progress, they typically depend on heuristics or approximations and do not offer provable guarantees over continuous input domains for the resulting circuits. In this work, we leverage recent advances in neural network verification to propose a suite of automated algorithms that yield circuits with *provable guarantees*. We focus on three types of guarantees: (1) *input domain robustness*, ensuring the circuit agrees with the model across a continuous input region; (2) *robust patching*, certifying circuit alignment under continuous patching perturbations; and (3) *minimality*, formalizing and capturing a wide array of various notions of succinctness. Interestingly, we uncover a diverse set of novel theoretical connections among these three families of guarantees, with critical implications for the convergence of our algorithms, establishing a principled foundation for provable circuit discovery.'
    1: Current interpretability methods primarily identify correlations between model components and behaviors, but rarely establish which internal mechanisms causally produce specific predictions. We introduce Causal Circuit Analysis, a framework that combines mechanistic interpretability with structural causal modeling to identify and verify causal computational pathways in neural networks. Our approach treats activations, attention heads, and neural circuits as variables in a structural causal model, enabling principled causal interventions beyond simple ablations. By applying do-calculus to internal representations, we can distinguish genuinely causal mechanisms from spurious correlations, trace information flow through causal mediators, and generate counterfactual explanations grounded in the model's computational graph. The framework provides formal guarantees about explanation faithfulness through causal identification conditions and enables automated discovery of minimal causal circuits sufficient for specific behaviors. This causal perspective bridges the gap between mechanistic interpretability and formal explainability, offering researchers and practitioners a principled methodology to understand not merely what features influence model decisions, but how and why specific computational pathways causally mediate predictions in complex neural architectures.
