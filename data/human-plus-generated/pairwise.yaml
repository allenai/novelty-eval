    0: 'Mixture-of-Experts (MoE) architectures have demonstrated remarkable capabilities and scalability for large language models, but incur a substantial memory footprint due to redundant expert parameters. Existing compression approaches, particularly those based on low-rank decomposition, typically operate at the granularity of individual experts. However, such per-expert methods neglect structural redundancies shared across experts, limiting their compression efficiency and effectiveness. In this work, we introduce TD-MoE (Tensor Decomposition for MoE Compression), a data-aware method that jointly factorizes expert weights by capturing global dependencies. Our contributions are threefold: (i) Cross-expert tensorization with joint three-dimensional decomposition, which unifies all experts within a layer into a single tensor and captures shared structure beyond per-expert scope; (ii) A multi-linear whitening strategy, which decorrelates input and output features, yielding a more balanced and data-adaptive decomposition; (iii) A three-dimensional rank allocation mechanism, which dynamically assigns 3D decomposition ranks across dimensions to best meet a target compression ratio while minimizing the reconstruction error.'
    1: 'We introduce ChemoSense, a multimodal framework that learns computational representations of taste and smell—modalities traditionally considered undigitizable—by leveraging their correlations with vision, language, audio, and molecular structure. Unlike conventional sensory modalities that can be directly captured through sensors, taste and smell exist as subjective chemical experiences describable only through proxy signals: ingredient combinations in recipes, aromatic descriptions in text, visual appearance of prepared dishes, and the molecular composition of flavor compounds. ChemoSense employs a contrastive learning architecture that aligns cooking videos, recipe instructions, audio of food preparation, textual flavor profiles, and chemical compound databases into a unified embedding space. We incorporate scientific knowledge about molecular structures and their perceptual qualities through a chemistry-aware encoder, enabling the model to reason about sensory experiences from compositional principles. The learned representations enable novel applications including cross-modal retrieval between chemical compounds and culinary descriptions, flavor-aware recipe generation, and assistive technologies for individuals with olfactory or gustatory impairments, demonstrating that computational modeling of chemical senses is achievable through thoughtful multimodal integration.'
