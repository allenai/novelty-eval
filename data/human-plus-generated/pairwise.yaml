    0: 'We propose a method for inferring an egocentric dense depth map from an RGB image and a sparse point cloud. The crux of our method lies in modeling the 3D scene implicitly within the latent space and learning an inductive bias in an unsupervised manner through principles of Structure-from-Motion. To force the learning of this inductive bias, we propose to optimize for an ill-posed objective during training: predicting latent features that are not observed in the input view, but exist in the 3D scene. This is facilitated by means of rigid warping of latent features from the input view to a nearby or adjacent (co-visible) view of the same 3D scene. "Empty" regions in the latent space that correspond to regions occluded from the input view are completed by a Contextual eXtrapolation (ConteXt) mechanism based on features visible in input view. The learned inductive bias of ConteXt can be transferred to modulate the features of the input view to improve fidelity. We term our method "Occluded Region Completion as Supervision" or ORCaS.'
    1: 'Multimodal learning typically assumes temporally aligned and complete observations across modalities, yet real-world scenarios often present asynchronous streams, variable sampling rates, and missing data. We introduce Temporal Neural Processes for Multimodal Learning (TNP-MM), a framework that models each modality as a continuous temporal function rather than discrete synchronized features. By leveraging conditional neural processes, our approach learns to encode observed multimodal contexts and decode representations or generate content at arbitrary query timestamps, naturally handling temporal misalignment and partial observations. A cross-modal temporal attention mechanism enables the model to discover and exploit temporal dependencies across modalities despite asynchrony, while uncertainty quantification provides confidence estimates for predictions in data-sparse regions. This formulation unifies multiple challenging scenarios: generating missing audio when only video is available at specific moments, aligning delayed sensor readings with visual observations, and performing multimodal inference from irregularly sampled inputs. TNP-MM offers a principled solution for robust multimodal understanding in autonomous systems, multimedia analysis, and human-computer interaction where perfect synchronization remains impractical.'
