    0: Discovering interpretable governing equations from experimental data remains a central challenge in the physical sciences, particularly when measurements are noisy, sparse, or high-dimensional. We introduce a neural-symbolic framework that combines the representational power of neural operators with the symbolic reasoning capabilities of large language models for automated equation discovery. Our approach employs a neural network to learn compact latent representations of physical dynamics from observational data, then prompts a large language model to generate candidate symbolic equations consistent with these learned behaviors. A key innovation is an iterative refinement loop that incorporates physical constraints—including dimensional consistency, known symmetries, and conservation laws—as structured prompts, guiding the language model toward physically plausible symbolic forms. The framework seamlessly integrates data-driven learning with domain knowledge, enabling discovery of parsimonious equations that generalize beyond training conditions. By treating equation discovery as a prompted reasoning task rather than pure optimization, our method produces human-interpretable mathematical expressions that capture underlying physical principles, offering a new paradigm for scientific discovery in computational physics, chemistry, and materials science.
    1: 'Recently, many generative models for de novo protein structure design have emerged. Yet, only few tackle the difficult task of directly generating fully atomistic structures jointly with the underlying amino acid sequence. This is challenging, for instance, because the model must reason over side chains that change in length during generation. We introduce La-Proteina for atomistic protein design based on a novel partially latent protein representation: coarse backbone structure is modeled explicitly, while sequence and atomistic details are captured via per-residue latent variables of fixed dimensionality, thereby effectively side-stepping challenges of explicit side-chain representations. Flow matching in this partially latent space then models the joint distribution over sequences and full-atom structures. La-Proteina supports a range of generation tasks, including all-atom co-design and atomistic motif scaffolding, unlocking critical atomistic structure-conditioned protein design tasks. Moreover, La-Proteina is able to generate proteins of up to 800 residues, demonstrating its scalability and robustness.'
