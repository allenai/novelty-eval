    0: 'Embodied AI has developed rapidly in recent years, but it is still mainly deployed in laboratories, with various distortions in the Real-world limiting its application. Traditionally, Image Quality Assessment (IQA) methods are applied to predict human preferences for distorted images; however, there is no IQA method to assess the usability of an image in embodied tasks, namely, the perceptual quality for robots. To provide accurate and reliable quality indicators for future embodied scenarios, we first propose the topic: IQA for Embodied AI. Specifically, we (1) based on the Mertonian system and meta-cognitive theory, constructed a perception-cognition-decision-execution pipeline and defined a comprehensive subjective score collection process; (2) established the Embodied-IQA database, containing over 30k reference/distorted image pairs, with more than 5m fine-grained annotations provided by Vision Language Models/Vision Language Action-models/Real-world robots. We sincerely hope that through this work, we can promote the application of Embodied AI under complex distortions in the Real-world.'
    1: Machine learning progress is largely tracked through static datasets and benchmarks that rapidly saturate, invite overfitting to fixed test sets, and provide limited visibility into which capabilities are genuinely improving. This work introduces a meta-benchmarking framework that treats benchmark construction as a sequential decision problem over a learned task manifold. We embed candidate test instances—sourced from human annotations, web corpora, or generative models—into a latent “benchmark space” encoding required skills, domain, spurious cues, and stylistic attributes. A policy, trained on historical model performance and error patterns, selects and adaptively refines instances to maximize long-term discriminative power, coverage of under-tested capabilities, and robustness to data contamination constraints. The resulting living benchmark evolves in tandem with a population of evaluated models, while remaining minimal in size and interpretable through automatically generated Benchmark Cards that summarize which regions of the capability space are probed. By decoupling benchmark design from any single dataset and making adaptation an explicit, learning-driven process, this framework aims to transform benchmarks from static scoreboards into continuously informative scientific instruments.
