    0: 'Large Language Models (LLMs) are conversational interfaces. As such, LLMs have the potential to assist their users not only when they can fully specify the task at hand, but also to help them define, explore, and refine what they need through multi-turn conversational exchange. Although analysis of LLM conversation logs has confirmed that underspecification occurs frequently in user instructions, LLM evaluation has predominantly focused on the single-turn, fully-specified instruction setting. In this work, we perform large-scale simulation experiments to compare LLM performance in single- and multi-turn settings. Our experiments confirm that all the top open- and closed-weight LLMs we test exhibit significantly lower performance in multi-turn conversations than single-turn. Analysis of 200,000+ simulated conversations decomposes the performance degradation into two components: a minor loss in aptitude and a significant increase in unreliability. We find that LLMs often make assumptions in early turns and prematurely attempt to generate final solutions, on which they overly rely. In simpler terms, we discover that when LLMs take a wrong turn in a conversation, they get lost and do not recover.'
    1: 'Static datasets and benchmarks for machine learning rapidly lose discriminative power as models improve and as training pipelines implicitly absorb their test data, obscuring genuine progress. We propose BenchGenesis, a framework for dynamically generating, versioning, and sharing benchmarks that remain challenging and contamination-resilient over time. BenchGenesis represents a benchmark not as a fixed test set, but as a generative policy over task schemas, data sources, and scoring rules. Given a frozen snapshot of this policy and a random seed, independent evaluators can instantiate the same benchmark instance, while the policy itself is periodically updated using newly available, time-stamped data and model-agnostic difficulty estimators. An adversarial curation loop selects examples that are simultaneously diverse, distributionally realistic, and unlikely to appear in existing training corpora, using provenance-aware retrieval and approximate deduplication against public pretraining sets. The resulting artifact is a first-class dataset object: a compact, inspectable description of how to generate tests, rather than the tests themselves. BenchGenesis aims to make benchmark evolution explicit, auditable, and reproducible, enabling long-horizon measurement of generalization for rapidly moving foundation models.'
