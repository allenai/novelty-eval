  ideas:
    0: 'Modern geometric deep learning offers powerful architectures for graphs, meshes, and manifolds, yet most methods assume a single, fixed discretization of the underlying space. Many scientific and relational domains instead exhibit hybrid geometries: road networks embedded in continuous maps, molecular graphs with 3D conformations, or sensor graphs scattered on curved surfaces. We introduce TopoAtlas, a neural framework that learns over general topological spaces by decomposing them into overlapping local charts, each equipped with its own geometry-specific operator. TopoAtlas jointly learns an open cover of the domain, selects chart-wise operators such as GNNs, convolutions, or point-cloud networks, and builds a trainable nerve complex that mediates message passing across chart overlaps. A sheaf-inspired consistency mechanism enforces agreement of predictions on intersections, turning topological compatibility into a learnable inductive bias. This construction subsumes classical graph and manifold networks as special cases, while enabling models to operate coherently across mixed discretizations and resolutions. TopoAtlas opens a path toward domain-agnostic geometric learners that reason over the topology of how heterogeneous local geometries are glued together, rather than committing to a single a priori representation.'
    1: 'Equivariant Neural Networks (ENNs) have empowered numerous applications in scientific fields. Despite their remarkable capacity for representing geometric structures, ENNs suffer from degraded expressivity when processing symmetric inputs: the output representations are invariant to transformations that extend beyond the input''s symmetries. The mathematical essence of this phenomenon is that a symmetric input, after being processed by an equivariant map, experiences an increase in symmetry. While prior research has documented symmetry increase in specific cases, a rigorous understanding of its underlying causes and general reduction strategies remains lacking. In this paper, we provide a detailed and in-depth characterization of symmetry increase together with a principled framework for its reduction: (i) For any given feature space and input symmetry group, we prove that the increased symmetry admits an infimum determined by the structure of the feature space; (ii) Building on this foundation, we develop a computable algorithm to derive this infimum, and propose practical guidelines for feature design to prevent harmful symmetry increases. (iii) Under standard regularity assumptions, we demonstrate that for most equivariant maps, our guidelines effectively reduce symmetry increase.'
