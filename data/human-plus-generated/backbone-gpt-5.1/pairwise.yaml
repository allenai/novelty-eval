    0: '``Learnware = Model + Specification''''. A learnware comprises a submitted model paired with a \emph{specification} sketching its capabilities. For a Learnware Dock System (LDS) which accommodates numerous models, these specifications are essential to enabling users to identify helpful models, eliminating the requirement for prohibitively costly per-model evaluations. Recently, \textbf{Pa}rameter \textbf{Ve}ctor (PAVE) specification, which utilizes the changes in pre-trained model parameters to inherently encode the model capability and task requirements, shows promising capabilities in enabling identifying useful learnwares for high-dimensional, unstructured text data.

      In this paper, we present a comprehensive study of PAVE specification for learnware identification. Theoretically, from the neural tangent kernel perspective, we establish a tight connection between PAVE and prior specifications, providing a theoretical explanation for their shared underlying principles. We further approximate PAVE in a low-rank space and analyze the approximation error bound, highly reducing the computational and storage overhead.'
    1: Representation learning methods are almost always optimized for a single, fixed supervision regime, yet practical pipelines traverse a dynamic continuum from purely unsupervised pre-training to heavily supervised fine-tuning. This rigidity forces ad hoc stage-wise training and often leads to catastrophic overwriting of useful unsupervised structure when labels become available. We introduce Supervision-Path Representation Learning (SuPReL), a framework that learns an explicit continuum of encoders indexed by a scalar supervision level α∈[0,1]. A shared backbone is modulated by a lightweight hypernetwork that maps α to adapter parameters and loss weightings, smoothly interpolating between unsupervised, self-supervised, semi-supervised, and supervised objectives. During training, we sample α values and jointly optimize contrastive, generative, and label-based losses, while enforcing path-consistency regularizers that align representations across neighboring α and preserve class geometry as supervision increases. SuPReL produces a family of supervision-controllable representations that can be instantly reconfigured to new label budgets or supervision mixes without retraining the backbone. This enables continuous adaptation as more labels, weak annotations, or new tasks arrive, and offers a principled alternative to discrete pre-train/fine-tune pipelines for unsupervised, self-supervised, semi-supervised, and supervised representation learning.
