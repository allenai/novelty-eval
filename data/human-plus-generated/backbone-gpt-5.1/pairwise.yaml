    0: Learning over graphs and geometric domains is typically formulated on a fixed discretization, whereas the underlying topology and discrete differential operators are rarely subject to learning. This paper introduces Neural Chain Complexes (NCCs), a framework that treats the combinatorial topology of the domain as a latent, trainable object. NCCs parameterize the boundary operators of a cell complex via a differentiable construction that guarantees the algebraic chain-complex conditions, including ∂²=0, throughout optimization. These operators induce a family of learnable yet topologically consistent discrete exterior calculus primitives—gradient, curl, divergence, and Hodge Laplacians—on which we build message-passing layers and neural operators. By jointly learning signals and operators from supervision on downstream tasks, NCCs can infer higher-order relations and cavities that are not present in the input graph, while remaining invariant to discretization refinements of the same underlying space. The resulting models provide a unified, topology-aware approach to learning on graphs, meshes, point clouds, and general cell complexes.
    1: 'Watermarking provides an effective means for data governance. However, conventional post-editing graph watermarking approaches degrade the graph quality and involve NP-hard subroutines. Alternatively, recent approaches advocate for embedding watermarking patterns in the noisy latent during data generation from diffusion models, but remain uncharted for graph models due to the hardness of inverting the graph diffusion process. In this work, we propose CheckWate: the first watermarking framework for graph diffusion models embedding checkerboard watermark and providing polynomial time verification. To address NP-completeness due to graph isomorphism, CheckWate embeds the watermark into the latent eigenvalues, which are isomorphism-invariant. To detect the watermark through reversing the graph diffusion process, CheckWate leverages the graph eigenvectors to approximately dequantize the discrete graph back to the continuous latent, with theoretical guarantees on the detectability and dequantization error. We further introduce a latent sparsification mechanism to enhance the robustness of CheckWate against graph modifications.'
