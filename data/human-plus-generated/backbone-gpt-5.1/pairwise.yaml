  ideas:
    0: 'The deployment of Large Language Models (LLMs) faces a critical bottleneck when handling lengthy inputs: the prohibitive memory footprint of the Key Value (KV) cache. To address this bottleneck, the token pruning paradigm leverages attention sparsity to selectively retain a small, critical subset of tokens. However, existing approaches fall short, with static methods risking irreversible information loss and dynamic strategies employing heuristics that insufficiently capture the query-dependent nature of token importance. We propose FASA, a novel framework that achieves query-aware token eviction by dynamically predicting token importance. FASA stems from a novel insight into RoPE: the discovery of functional sparsity at the frequency-chunk (FC) level. Our key finding is that a small, identifiable subset of "dominant" FCs consistently exhibits high contextual agreement with the full attention head. This provides a robust and computationally free proxy for identifying salient tokens. Building on this insight, FASA first identifies a critical set of tokens using dominant FCs, and then performs focused attention computation solely on this pruned subset.'
    1: Frontier language models are increasingly deployed under heterogeneous governance requirements, yet current control mechanisms rely on brittle post-hoc filters or coarse instruction tuning that entangles capabilities and policies. We introduce Typed Foundation Models, an architectural framework that couples sequence modeling with a differentiable type system for fine-grained governance. Alongside each token and intermediate activation, a lightweight type network predicts latent governance types encoding semantic attributes such as safety category, data sensitivity, domain, and capability level. These types are propagated through the computation via learned type-transfer operators and feed back into the main model through gated attention and routing, enabling the model to respect declarative constraints over types rather than surface strings. Training jointly optimizes next-token prediction, type inference, and type-consistency regularization using weak supervision from heuristic classifiers and synthetic policy-labeled corpora. At inference time, external policies are implemented as modular constraints over allowable type transitions, yielding auditable, composable control that does not require modifying base weights. This paradigm connects ideas from programming-language type systems and abstract interpretation with frontier model design, aiming to make powerful sequence models more governable, inspectable, and adaptable across diverse deployment regimes.
