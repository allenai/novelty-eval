    0: Physical systems across physics, chemistry and biology are governed by partial differential equations that share deep structural regularities, yet current machine learning surrogates are trained task-by-task and ignore cross-domain inductive biases such as dimensional analysis and conservation laws. We introduce LawFM, a unit-aware, symmetry-equivariant neural operator pre-trained on a large corpus of synthetic PDE solutions spanning fluid mechanics, electromagnetism, quantum dynamics, and reaction–diffusion systems. LawFM represents fields as tensors annotated with learnable embeddings of their physical dimensions, and constrains network operations to be dimensionally consistent by construction. A library of equivariant kernels encodes translational, rotational and gauge symmetries, while auxiliary self-supervised objectives enforce approximate conservation of energy, mass, and charge during time evolution. Pre-training on heterogeneous simulated tasks yields a universal operator prior that can be rapidly adapted to new, data-scarce scientific problems, such as plasma edge turbulence or morphogen gradients in developmental biology, using only a handful of trajectories and known boundary conditions. Moreover, the unit-aware representation enables automatic discovery of candidate non-dimensional groups and scaling laws by probing the latent space. LawFM aims to serve as a foundation model for physical fields, transferring knowledge across disciplines while remaining faithful to core physical principles.
    1: 'We introduce Kolmogorov–Arnold Neural Operator (KANO), a dual‑domain neural operator jointly parameterized by both spectral and spatial bases with intrinsic symbolic interpretability. We theoretically demonstrate that KANO overcomes the pure-spectral bottleneck of Fourier Neural Operator (FNO): KANO remains expressive over a generic position-dependent dynamics for any physical input, whereas FNO stays practical only to spectrally sparse operators and strictly imposes fast-decaying input Fourier tail.'
