    0: 'Live Photo captures both a high-quality key photo and a short video clip to preserve the precious dynamics around the captured moment. While users may choose alternative frames as the key photo to capture better expressions or timing, these frames often exhibit noticeable quality degradation, as the photo capture ISP pipeline delivers significantly higher image quality than the video pipeline. This quality gap highlights the need for dedicated restoration techniques to enhance the reselected key photo. To this end, we propose LiveMoments, a reference-guided image restoration framework tailored for the reselected key photo in Live Photos. Our method employs a two-branch neural network: a reference branch that extracts structural and textural information from the original high-quality key photo, and a main branch that restores the reselected frame using the guidance provided by the reference branch. Furthermore, we introduce a unified Motion Alignment module that incorporates motion guidance for spatial alignment at both the latent and image levels.'
    1: We propose AnchorHub, a modality-agnostic semantic hub that turns existing unimodal foundation models into a composable multi-modal system spanning vision, audio, language, and emerging sensor modalities. Instead of training a single monolithic model, AnchorHub learns a compact set of shared “anchor” tokens that serve as an interlingua across modalities. For each modality, lightweight encoder and decoder adapters map between raw inputs and anchor-token sequences while preserving the capabilities of the underlying foundation model. The hub is trained only from heterogeneous pairwise co-occurrence data—such as image–text, video–audio, or audio–caption pairs—through contrastive and generative objectives that align anchors without requiring fully aligned multi-way datasets. Once established, the anchor space supports zero-shot composition of new cross-modal tasks as routing problems, enabling, for example, text-conditioned video and sound generation, audio-based image retrieval, cross-modal question answering, and fusion of novel sensors with language. AnchorHub offers a scalable and extensible blueprint for turning isolated unimodal models into a unified, general-purpose multi-modal intelligence layer.
