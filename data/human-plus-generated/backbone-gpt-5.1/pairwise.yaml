    0: Foundation models are increasingly deployed in settings where safety, fairness, privacy, and broader societal values are simultaneously at stake, yet existing alignment methods typically optimize for a single, fixed normative target. We introduce a framework for pluralistic normative alignment that learns and operationalizes a lattice of societal norms derived from heterogeneous stakeholders. Each stakeholder provides judgments over model behaviors together with the norms they invoke (e.g., harm avoidance, group fairness, data minimization), from which we infer a structured, partially ordered space of normative constraints capturing when one requirement is strictly stronger than another. A differentially private aggregation mechanism then fuses stakeholder-specific lattices into a global but contestable normative space, while preserving the confidentiality of individual judgments. At training time, we jointly learn a norm-aware policy that maps contexts to regions of this lattice and a decoding mechanism that enforces hard safety and privacy constraints while softly optimizing along stakeholder-weighted fronts of fairness and utility. The resulting models expose explicit, auditable trade-offs between competing norms and support reconfigurable alignment as societal expectations evolve.
