    0: Evaluating tabular generators remains a challenging problem, as the unique causal structural prior of heterogeneous tabular data does not lend itself to intuitive human inspection. Recent work has introduced structural fidelity as a tabular-specific evaluation dimension to assess whether synthetic data complies with the causal structures of real data. However, existing benchmarks often neglect the interplay between structural fidelity and conventional evaluation dimensions, thus failing to provide a holistic understanding of model performance. Moreover, they are typically limited to toy datasets, as quantifying existing structural fidelity metrics requires access to ground-truth causal structures, which are rarely available for real-world datasets. In this paper, we propose a novel evaluation framework that jointly considers structural fidelity and conventional evaluation dimensions. We introduce a new evaluation metric, global utility, which enables the assessment of structural fidelity even in the absence of ground-truth causal structures. In addition, we present TabStruct, a comprehensive evaluation benchmark offering large-scale quantitative analysis on 13 tabular generators from nine distinct categories, across 29 datasets.
    1: Benchmark saturation, test-set leakage, and narrow artifact exploitation increasingly undermine the reliability of dataset-based evaluation. Existing datasets are typically static tables of instances, making them difficult to refresh, extend, or audit as models and pretraining corpora evolve. We propose SpecForge, a specification-driven framework that treats benchmarks as executable generative processes rather than fixed collections. SpecForge introduces a declarative language for expressing task intent, data distributions, constraints, and nuisance factors, together with a modular runtime that couples multiple data generators with semantic and statistical verifiers. Benchmarks become distributions defined by specifications and checked sampling pipelines, enabling ephemeral, on-demand test sets that remain hidden until evaluation time. We release a corpus of cross-domain specifications covering reasoning, robustness, safety, and multimodal understanding, and define complementary notions of specification coverage and invariance under spec-preserving transformations. By decoupling benchmark *definitions* from concrete item realizations, SpecForge provides a principled path toward long-lived, contamination-resistant, and auditable evaluation in rapidly moving machine learning ecosystems.
