    0: Proof autoformalization, the task of translating natural language theorems and proofs into machine-verifiable code, is a critical step for integrating large language models into rigorous mathematical workflows. Current approaches focus on producing executable code, but they frequently fail to preserve the semantic meaning and logical structure of the original human-written argument. To address this, we introduce ProofFlow, a novel pipeline that treats structural fidelity as a primary objective. ProofFlow first constructs a directed acyclic graph (DAG) to map the logical dependencies between proof steps. Then, it employs a novel lemma-based approach to systematically formalize each step as an intermediate lemma, preserving the logical structure of the original argument. To facilitate evaluation, we present a new benchmark of 184 undergraduate-level problems, manually annotated with step-by-step solutions and logical dependency graphs, and introduce ProofScore, a new composite metric to evaluate syntactic correctness, semantic faithfulness, and structural fidelity.
    1: We propose a neuro-symbolic framework that couples physics-informed neural networks with formal reasoning via a counterexample-guided learning loop. Physical laws, safety constraints, and high-level domain rules are encoded in a unified logical language combining differential equations and first-order predicates. A neural field or operator network approximates the system’s dynamics, while a verification engine, based on δ-decision procedures and SMT solving, attempts to prove that the learned model satisfies the symbolic specification over a continuous state space. When proofs fail, the solver returns concrete counterexample trajectories that violate the encoded laws; these are transformed into targeted supervision and constraint-focused losses that refine the neural model. The verifier, in turn, prioritizes its search using uncertainty and saliency signals from the network, creating a closed-loop “logic-as-adversary” training process. This architecture aims to produce models that interpolate observational data, respect formal physical and logical invariants, and support high-level queries about safety and counterfactual behavior, while progressively accumulating machine-checkable certificates of partial correctness.
