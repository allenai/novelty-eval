    0: Approximately 445.2 million individuals worldwide are living with traumatic amputations, and an estimated 31.64 million children aged 0–14 have congenital limb differences, yet they remain largely underrepresented in human pose estimation (HPE) research. Accurate HPE could significantly benefit this population in applications, such as rehabilitation monitoring and health assessment. However, the existing HPE datasets and methods assume that humans possess a full complement of upper and lower extremities and fail to model missing or altered limbs. As a result, people with limb deficiencies remain largely underrepresented, and current models cannot generalize to their unique anatomies or predict absent joints. To bridge this gap, we introduce InclusiveVidPose Dataset, the first video-based large-scale HPE dataset specific for individuals with limb deficiencies. We collect 313 videos, totaling 327k frames, and covering nearly 400 individuals with amputations, congenital limb differences, and prosthetic limbs. We adopt 8 extra keypoints at each residual limb end to capture individual anatomical variations. Under the guidance of an internationally accredited para-athletics classifier, we annotate each frame with pose keypoints, segmentation masks, bounding boxes, tracking IDs, and per-limb prosthesis status. We introduce a new evaluation metric, Limb-specific Confidence Consistency (LiCC), which assesses the consistency of pose estimations between residual and intact limb keypoints. We also provide a rigorous benchmark for evaluating inclusive and robust pose estimation algorithms. We hope InclusiveVidPose spur research toward methods that fairly and accurately serve all body types.
    1: 'Foundation models are increasingly evaluated on benchmarks that they have partially seen during pre-training, inflating reported performance and obscuring true scientific progress. Existing attempts to detect such contamination rely on manual curation or ad hoc overlap checks, and do not scale to heterogeneous proprietary training corpora. We propose TraceBench, a provenance-aware benchmark generation framework that constructs test suites with explicit, machine-verifiable non-overlap guarantees against participating models'' training data. TraceBench combines privacy-preserving set membership protocols over hashed text and representation-space fingerprints to identify and discard contaminated candidates without exposing raw pre-training data. A generative rewriting module then synthesizes semantically controlled variants that preserve task intent while remaining provably outside each model''s training distribution. The framework supports continual updates: new models can register their training fingerprints, triggering automatic regeneration and reweighting of test slices to maintain non-overlap and difficulty. By turning benchmark construction into a contamination-aware, multi-party protocol, TraceBench enables more trustworthy leaderboards, facilitates ablations on memorization versus generalization, and offers a reusable blueprint for building future datasets in an era of opaque large-scale pre-training.'
