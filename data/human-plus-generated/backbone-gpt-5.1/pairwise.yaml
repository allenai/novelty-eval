  ideas:
    0: We propose NeuroProgrammer, a framework for discovering brain-aligned algorithmic models of cognition by combining differentiable program synthesis, multimodal neural data, and language-model priors. NeuroProgrammer represents candidate cognitive processes as modular neural programs composed of parameterized operations (e.g., encoding, relational comparison, memory lookup, rule application) executed by a differentiable interpreter. Given behavioral responses and time-resolved neural recordings during complex tasks, the system jointly infers program structure and parameters while enforcing representational alignment between intermediate program states and spatiotemporal activity patterns across brain regions. A large language model trained on cognitive science and neuroscience text defines a prior over plausible algorithmic decompositions and operation sequences, biasing search toward theories consistent with existing domain knowledge yet allowing data-driven revision. This yields executable cognitive programs that not only predict behavior but also provide fine-grained mappings from individual computational steps to neural substrates and temporal dynamics. NeuroProgrammer offers a general approach for reverse-engineering human problem solving, working memory, and reasoning, and for transforming informal verbal theories into quantitatively specified, neurally grounded algorithms.
    1: Training recurrent neural networks (RNNs) to perform neuroscience-style tasks has become a popular way to generate hypotheses for how neural circuits in the brain might perform computations. Recent work has demonstrated that task-trained RNNs possess a strong simplicity bias. In particular, this inductive bias often causes RNNs trained on the same task to collapse on effectively the same solution, typically comprised of fixed-point attractors or other low-dimensional dynamical motifs. While such solutions are readily interpretable, this collapse proves counterproductive for the sake of generating a set of genuinely unique hypotheses for how neural computations might be performed. Here we propose Iterative Neural Similarity Deflation (INSD), a simple method to break this inductive bias. By penalizing linear predictivity of neural activity produced by standard task-trained RNNs, INSD finds an alternative class of solutions to classic neuroscience-style RNN tasks. Our findings underscore the importance of moving beyond the simplicity bias to uncover richer and more varied models of neural computation.
