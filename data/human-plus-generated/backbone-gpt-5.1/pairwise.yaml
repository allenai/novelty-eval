    0: Generative models have achieved remarkable fidelity across modalities, yet they remain brittle when tasked with producing samples that obey complex, compositional constraints expressed in natural language, schemas, or logical rules. We argue that this limitation stems from monolithic latent spaces that entangle semantics and rendering, leaving no explicit locus for symbolic reasoning. We introduce a two-level generative framework, ConGraph, that factors generation into a constrained concept graph planner and a continuous renderer. ConGraph first samples a discrete graph whose nodes represent entities and attributes and whose edges encode relations and logical dependencies. A differentiable constraint module, implemented as a neural energy over graphs, steers this sampling process so that the resulting concept graphs satisfy user-specified constraints given as text, formulas, or structured prompts. A modality-specific generator then conditions on the sampled graph to render high-dimensional outputs such as images, text, or programs. The overall system is trained end-to-end with weak supervision, combining pseudo-graph distillation from foundation models and contrastive objectives that align graphs with rendered outputs. This architecture turns symbolic structure into a first-class generative object, enabling controllable, compositional generation and post hoc constraint editing without retraining the underlying renderer.
    1: 'To model discrete sequences such as DNA, proteins, and language using diffusion, practitioners must choose between three major methods: diffusion in discrete space, Gaussian diffusion in Euclidean space, or diffusion on the simplex. Despite their shared goal, these models have disparate algorithms, theoretical structures, and tradeoffs: discrete diffusion has the most natural domain, Gaussian diffusion has more mature algorithms, and diffusion on the simplex in principle combines the strengths of the other two but in practice suffers from a numerically unstable stochastic processes. Ideally we could see each of these models as instances of the same underlying framework, and enable practitioners to switch between models for downstream applications. However previous theories have only considered connections in special cases. Here we build a theory unifying all three methods of discrete diffusion as different parameterizations of the same underlying process: the Wright-Fisher population genetics model. In particular, we find simplicial and Gaussian diffusion as two large-population limits. Our theory formally connects the likelihoods and hyperparameters of these models and leverages decades of mathematical genetics literature to unlock stable simplicial diffusion. Finally, we relieve the practitioner of balancing model trade-offs by demonstrating it is possible to train a single model that can perform diffusion in any of these three domains at test time.'
