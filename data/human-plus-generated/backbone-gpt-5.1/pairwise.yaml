  ideas:
    0: Current practice in representation learning treats unsupervised, self-supervised, semi-supervised, and supervised regimes as distinct algorithmic families, glued together via manually designed pretraining–finetuning pipelines and fixed training schedules. We propose Supervision Mixture Networks, a unified framework that learns *how* each example should be supervised rather than fixing its regime a priori. A shared encoder is trained with a composite loss spanning unsupervised, self-supervised, consistency-based semi-supervised, and supervised components. For every input, a lightweight supervision router produces a simplex of mixture weights over these objectives, conditioned on the current representation, label availability, and training context. The router is meta-optimized to maximize a downstream proxy—such as held-out labeled performance or self-consistency under perturbations—subject to regularization that encourages smooth curricula from label-free to label-intensive supervision. Unlabeled points are initially governed by self-supervision and gradually acquire pseudo-label supervision as confidence grows, while labeled points can downweight noisy labels early in training to prioritize robust invariances. We show conceptually how common pipelines emerge as special cases of static routers, and outline how this adaptive mixture view enables a single, continuously trained encoder to exploit heterogeneous and evolving supervision at scale.
    1: 'Large Language Model (LLM) pretraining, finetuning, and evaluation rely on input-space reconstruction and generative capabilities. Yet, it has been observed in vision that embedding-space training objectives, e.g., with Joint Embedding Predictive Architectures (JEPAs), are far superior to their input-space counterpart. That mismatch in how training is achieved between language and vision opens up a natural question: {\em can language training methods learn a few tricks from the vision ones?} The lack of JEPA-style LLM is a testimony of the challenge in designing such objectives for language. In this work, we propose a first step in that direction where we develop LLM-JEPA, a JEPA based solution for LLMs applicable both to finetuning and pretraining.'
