    0: 'Pretraining a large model and reusing its representation across tasks is now the dominant learning paradigm, yet our theoretical understanding of when such representations help or harm downstream learning remains fragmentary. We propose a directional theory of transfer based on a new complexity measure, the Transfer Alignment Coefficient (TAC), which quantifies how a representation learned on a source environment aligns with the latent sufficient statistics of a target environment. Working in a general stochastic task environment model, we show that TAC decomposes transfer into two distinct effects: compressive sharing of task-invariant structure and amplification of task-specific confounders. We derive excess-risk and sample-complexity bounds for frozen-representation learners that depend only on the target’s intrinsic complexity and TAC, and we complement them with matching lower bounds that identify regimes of inevitable negative transfer, where every source-optimal representation provably degrades target learnability. The framework further yields structural conditions under which multi-source pretraining or curriculum design can strictly improve TAC, providing principled guidance for constructing pretraining corpora and objectives that are provably safe for broad downstream reuse.'
    1: We prove the first guarantees of sparse recovery for ReLU neural networks, where the sparse network weights constitute the signal to be recovered. Specifically, we study structural properties of the sparse network weights for two-layer, scalar-output networks under which a simple iterative hard thresholding algorithm recovers these weights exactly, using memory that grows linearly in the number of nonzero weights.
