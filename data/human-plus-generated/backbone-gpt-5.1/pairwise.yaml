  ideas:
    0: 'Despite advances in pretraining with extended context sizes, large language models (LLMs) still face challenges in effectively utilizing real-world long-context information, primarily due to insufficient long-context alignment caused by data quality issues, training inefficiencies, and the lack of well-designed optimization objectives. To address these limitations, we propose a framework named **S**h**o**rt-to-**Lo**ng **P**reference **O**ptimization (**SoLoPO**), decoupling long-context preference optimization (PO) into two components: short-context PO and short-to-long reward alignment (SoLo-RA), supported by both theoretical and empirical evidence. Specifically, short-context PO leverages preference pairs sampled from short contexts to enhance the model''s contextual knowledge utilization ability. Meanwhile, SoLo-RA explicitly encourages reward score consistency for the responses when conditioned on both short and long contexts that contain identical task-relevant information. This facilitates transferring the model''s ability to handle short contexts into long-context scenarios. SoLoPO is compatible with mainstream preference optimization algorithms, while substantially improving the efficiency of data construction and training processes.'
    1: Multimodal foundation models usually target fixed modality pairs such as vision–language or audio–language under synchronous assumptions, which limits general event understanding and flexible cross-modal generation. This work introduces EventBridge, an event-centric, modality-agnostic architecture that encodes heterogeneous perceptual streams—video, audio, language, motion, and physiological signals—as temporally indexed discrete events in a shared token space. Modality-specific neural tokenizers map raw inputs into structured event codes, and a single transformer operates over the resulting asynchronous sequence. Training jointly optimizes masked event modeling, cross-modal completion, and temporal counterfactual prediction, encouraging the model to infer latent causes and compositional structure across modalities. EventBridge can ingest any subset of available streams and conditionally infer or generate missing ones, supporting scenarios such as synthesizing soundtracks from video and text, narrating egocentric video from audio alone, or forecasting tactile feedback from planned visual actions. By treating perception as unified event modeling rather than modality-specific fusion, the framework aims to provide a general foundation for computer vision, audio, language, and other sensor modalities in multi-sensory assistants, creative tools, and embodied agents.
