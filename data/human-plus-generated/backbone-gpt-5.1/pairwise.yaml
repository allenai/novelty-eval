  ideas:
    0: Frontier language models rely on hand-crafted inference recipes—fixed temperatures, chain-of-thought prompting, self-consistency, and ad hoc tool calls—that are brittle across tasks and decoupled from training. This paper proposes Inference Policy Networks (IPNs), a framework that treats decoding as a sequential decision process learned on top of a frozen or slowly updated foundation model. An IPN observes the problem context and the model’s partial trajectories, then emits discrete control actions that program the underlying model’s inference behavior, including sampling parameters, scratchpad structure, verification loops, tool invocations, and early stopping. Control actions are realized as privileged tokens and API calls that the base model is trained to interpret, while the IPN is optimized with offline reinforcement learning and preference-based feedback to trade off task success, safety constraints, and computational cost. By factoring “what to think” (the foundation model) from “how to think” (the inference policy), the approach enables instance-adaptive reasoning strategies that dynamically allocate compute, choose between direct answers and multi-step deliberation, and standardize tool orchestration. The IPN abstraction creates a new axis for scaling frontier systems—policy capacity and training data—while remaining compatible with existing models and offering a principled substrate for interpretability and safety analysis of inference-time behavior.
    1: Large language models (LLMs) have demonstrated remarkable capabilities in chain of thought (CoT) reasoning. However, the current LLM reasoning paradigm initiates thinking only after the entire input is available, which introduces unnecessary latency and weakens attention to earlier information in dynamic scenarios. Inspired by human cognition of thinking while reading, we first design a **streaming thinking** paradigm for LLMs, where reasoning unfolds in the order of input and further adjusts its depth once reading is complete. We instantiate this paradigm with *StreamingThinker*, a framework that enables LLMs to think while reading through the integration of streaming CoT generation, streaming-constraint training, and streaming parallel inference. Specifically, StreamingThinker employs streaming reasoning units with quality control for CoT generation, enforces order-preserving reasoning through streaming attention masks and position encoding, and leverages parallel KV caches that decouple input encoding from reasoning generation, thereby ensuring alignment and enabling true concurrency.
