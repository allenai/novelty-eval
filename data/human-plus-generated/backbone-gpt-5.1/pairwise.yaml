  ideas:
    0: 'A fundamental challenge in offline reinforcement learning is distributional shift. Scarce data or datasets dominated by out-of-distribution (OOD) areas exacerbate this issue. Our theoretical analysis and experiments show that the standard squared error objective induces a harmful TD cross covariance. This effect amplifies in OOD areas, biasing optimization and degrading policy learning. To counteract this mechanism, we develop two complementary strategies: partitioned buffer sampling that restricts updates to localized replay partitions, attenuates irregular covariance effects, and aligns update directions, yielding a scheme that is easy to integrate with existing implementations, namely Clustered Cross-Covariance Control for TD ($C^4$). We also introduce an explicit gradient-based corrective penalty that cancels the covariance induced bias within each update. We prove that buffer partitioning preserves the lower bound property of the maximization objective, and that these constraints mitigate excessive conservatism in extreme OOD areas without altering the core behavior of policy constrained offline reinforcement learning.'
    1: 'We propose Teacher-as-Environment-Editor (TEE), a reinforcement learning framework in which a learned curriculum emerges from explicit edits to the environment rather than from hand-designed task distributions. TEE assumes a programmatic or latent representation of environments and introduces a teacher policy that transforms this representation by inserting, removing, or reconfiguring objects, dynamics, and reward components. The student policy trains within these edited environments but is always evaluated on a fixed target task family. The teacher’s objective is meta-level: maximize the student’s eventual target-task return after a limited number of training updates, thereby optimizing for learning progress rather than instantaneous difficulty or adversarial failure. We formulate this interaction as a bilevel RL problem and approximate teacher gradients either by differentiating through the student’s update dynamics or via policy-gradient credit assignment over editor–student trajectories. Regularization and feasibility critics constrain edits to remain realistic and solvable, preventing degenerate curricula. TEE aims to autonomously discover structured progressions of environments—starting from simplified variants of the target and gradually introducing obstacles, distractions, and partial reward shaping—that accelerate exploration, improve long-horizon credit assignment, and yield policies that transfer robustly back to the unedited target tasks.'
