  ideas:
    0: Generative models excel at fitting high-dimensional data distributions, yet they typically entangle many semantic and algorithmic factors into a single monolithic network, limiting systematic generalization and fine-grained control. We propose Mechanism-Conditioned Generative Modeling (MCM), a framework that restructures the generator as a controller over a learned library of reusable neural mechanisms. In MCM, the latent code is factorized into discrete variables that select and order mechanism modules and continuous variables that parameterize each chosen mechanism. A sparse routing policy composes a small subset of shared mechanisms per sample, while cross-sample regularizers encourage mechanisms to be reused across diverse contexts rather than overfitted to individual examples. This induces an implicit “program-like” representation of generation as a sequence of mechanism invocations that can be inspected, edited, or recombined at inference time. MCM applies generically on top of autoregressive or diffusion backbones and across modalities, enabling users to specify interventions at the mechanism level (e.g., insert, swap, or remove mechanisms) instead of directly manipulating low-level tokens or pixels. The resulting architecture aims to close the gap between black-box generative modeling and modular, compositional structure reminiscent of human conceptual and algorithmic reasoning.
    1: 'Massive Activations (MAs) are a well-documented phenomenon across Transformer architectures, and prior studies in both LLMs and ViTs have shown that they play a substantial role in shaping model behavior. However, the nature and function of MAs within Diffusion Transformers (DiTs) remain largely unexplored. In this work, we systematically investigate these activations to elucidate their role in visual generation. We found that these massive activations occur across all spatial tokens, and their distribution is modulated by the input timestep embeddings. Importantly, our investigations further demonstrate that these massive activations play a key role in local detail synthesis, while having minimal impact on the overall semantic content of output.

      Building on these insights, we propose Detail Guidance (DG), a MAs-driven, training-free self-guidance strategy to explicitly enhance local detail fidelity for DiTs. Specifically, DG constructs a degraded "detail-deficient" model by disrupting MAs and leverages it to guide the original network toward higher-quality detail synthesis. Our DG can seamlessly integrate with Classifier-Free Guidance (CFG), enabling joint enhancement of detail fidelity and prompt alignment.'
