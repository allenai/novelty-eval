    0: 'Nonconvex optimization in high dimensions often relies on purely local gradient information, leading to slow exploration of multi-modal landscapes and brittle dependence on initialization. This paper introduces DiffOpt, a diffusion-guided optimization framework that amortizes global search across a distribution of related problems. Offline, DiffOpt observes trajectories from strong but expensive global solvers and learns a conditional diffusion model over near-optimal solutions, conditioned on lightweight descriptors of each objective such as random probe evaluations and structural metadata. At test time, a new objective is first embedded into this conditioning space, and optimization proceeds via a coupled dynamical system: gradient-based updates are interleaved with score-based diffusion steps that inject structured, problem-specific noise informed by the learned distribution of good solutions. We show that, under mild approximation assumptions on the score network, DiffOpt preserves first-order convergence guarantees while accelerating basin exploration through a principled control of exploration–exploitation trade-offs. This view unifies learned optimizers, diffusion sampling, and stochastic search, suggesting a new class of pretrainable, task-aware optimization algorithms.'
    1: 'The minimum-cost bipartite matching between two sets of points $R$ and $S$ in a metric space has a wide range of applications in machine learning, computer vision, and logistics. For instance, it can be used to estimate the $1$-Wasserstein distance between continuous probability distributions and for efficiently matching requests to servers while minimizing cost. However, the computational cost of determining the minimum-cost matching for general metrics spaces, poses a significant challenge, particularly in dynamic settings where points arrive over time and each update requires re-executing the algorithm. In this paper, given a fixed set $S$, we describe a deterministic algorithm that maintains, after $i$ additions to $R$, an $O(1/\delta^{0.631})$-approximate minimum-cost matching of cardinality $i$ between sets $R$ and $S$ in any metric space, with an amortized insertion time of $\widetilde{O}(n^{1+\delta})$ for adding points in $R$. To the best of our knowledge, this is the first algorithm for incremental minimum-cost matching that applies to arbitrary metric spaces.


      Interestingly, an important subroutine of our algorithm lends itself to efficient parallelization. We provide both a CPU implementation and a GPU implementation that leverages parallelism.'
