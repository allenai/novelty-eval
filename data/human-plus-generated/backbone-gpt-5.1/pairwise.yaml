    0: Physical sciences rely on a small set of dimensionless invariants (e.g., Reynolds, Damköhler, Péclet numbers) that collapse diverse systems onto universal scaling laws. Current scientific machine learning models largely ignore units and dimensional structure, limiting their ability to generalize across regimes and experimental setups. This work proposes UniPi, a self-supervised framework that learns reusable dimensionless representations directly from heterogeneous experimental data annotated only with physical units. UniPi embeds each variable in a vector space of base dimensions and optimizes linear combinations in log-space that are constrained to be dimensionless while maximally predictive of observed responses. A contrastive objective aligns experiments that differ only by unit-consistent rescalings or known symmetries, encouraging the model to discover similarity variables that collapse their behavior, while a sparsity prior yields compact, interpretable invariants. The learned “Pi-coordinates” serve as inputs to downstream neural surrogates and as shared latent factors across physics, chemistry, and biology tasks, enabling cross-domain transfer, principled extrapolation to new scales, and data-driven discovery of previously unknown scaling laws.
    1: 'Recently, many generative models for de novo protein structure design have emerged. Yet, only few tackle the difficult task of directly generating fully atomistic structures jointly with the underlying amino acid sequence. This is challenging, for instance, because the model must reason over side chains that change in length during generation. We introduce La-Proteina for atomistic protein design based on a novel partially latent protein representation: coarse backbone structure is modeled explicitly, while sequence and atomistic details are captured via per-residue latent variables of fixed dimensionality, thereby effectively side-stepping challenges of explicit side-chain representations. Flow matching in this partially latent space then models the joint distribution over sequences and full-atom structures. La-Proteina supports a range of generation tasks, including all-atom co-design and atomistic motif scaffolding, unlocking critical atomistic structure-conditioned protein design tasks. Moreover, La-Proteina is able to generate proteins of up to 800 residues, demonstrating its scalability and robustness.'
