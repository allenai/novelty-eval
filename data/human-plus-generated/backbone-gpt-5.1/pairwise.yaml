  ideas:
    0: Current representation learning pipelines treat unsupervised, self-supervised, semi-supervised, and supervised objectives as heuristically weighted losses, leading to brittle training dynamics and conflicting gradient signals. We propose Supervision Field Learning (SFL), a unified framework that interprets every supervision source as a sample from an underlying conservative vector field over model parameters. Instead of directly updating parameters with a linear combination of task gradients, SFL trains an auxiliary potential network whose gradient approximates, in expectation, the ensemble of unsupervised invariance losses, self-supervised pretext tasks, semi-supervised consistency and pseudo-label terms, and supervised label likelihoods. A projection objective in the Hilbert space of vector fields learns this potential by minimizing the discrepancy between its gradient and per-regime gradients, automatically down-weighting inconsistent or noisy supervision, especially from unlabeled and weakly labeled data. The representation encoder is then updated only through the learned potential, yielding path-independent optimization trajectories that smoothly adapt as label density and supervision types evolve. SFL turns the supervision spectrum into a learnable geometric object, enabling a single model to exploit heterogeneous supervision without manual loss balancing or rigid training schedules.
    1: Neural networks necessitate nonlinearities to achieve universal approximability. Traditional activation functions introduce nonlinearities through rigid feature rectifications. Recent self-gated variants improve traditional methods in fitting flexibility by incorporating learnable content-aware factors and non-local dependencies, enabling dynamic adjustments to activation curves via adaptive translation and scaling. While SOTA approaches achieve notable gains in conventional CNN layers, they struggle to enhance Transformer layers, where fine-grained context is inherently modeled, severely reducing the effectiveness of non-local dependencies leveraged in activation processes. We refer to this critical yet unexplored challenge as the **non-local tension** of activation. Drawing on a decision-making perspective, we systematically analyze the origins of the non-local tension problem and explore the initial solution to foster a more discriminative and generalizable neural activation methodology. This is achieved by rethinking how non-local cues are encoded and transformed into adaptive scaling coefficients, which in turn recalibrate the contributions of features to filter updates through neural activation. Grounded in these insights, we present **FleS**, a novel self-gated activation model for discriminative pattern recognition.
