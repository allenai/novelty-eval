    1: Probabilistic models are typically queried through expectations or probabilities of events under a posterior distribution, yet most approximate inference methods are trained to recover the full posterior irrespective of the downstream query. This mismatch wastes computation and can concentrate approximation error on exactly the functionals that matter in practice. We introduce Query-Conditioned Variational Inference (QCVI), a meta-inference framework that amortizes not just over datasets but also over a rich space of posterior queries. QCVI learns an inference operator that maps a model, observed data, and a differentiable representation of a query—such as a prediction, counterfactual, or marginal event—directly to a query-specific approximate posterior or to a distribution over the query value itself. The operator is trained offline on synthetically generated (data, query) pairs using unbiased or high-fidelity posterior samples as supervision, and refined adversarially on worst-case queries. By focusing representational capacity and optimization effort on query-relevant directions in latent space, QCVI decouples the cost of accurate uncertainty from the complexity of the underlying model. This enables fast, targeted uncertainty quantification for families of downstream tasks, while retaining the flexibility of general-purpose Bayesian modeling.
