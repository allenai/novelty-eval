  ideas:
    0: 'Frontier language models expose only a coarse control interface through prompts and fine-tuning, leaving their internal computation opaque and difficult to steer. We propose Self-Reflective Tokenization, a training paradigm in which a foundation model learns an explicit, low-bandwidth introspection channel alongside its standard output stream. Concretely, we augment a transformer with an introspector head that, at selected layers and timesteps, emits discrete reflection tokens summarizing the model’s latent state and anticipated computational trajectory. These tokens are fed back into the model as additional inputs, and are optimized to be simultaneously predictive of future activations, constrained by an information bottleneck, and partially aligned with natural language descriptors. The resulting introspective token stream functions as a compact internal API: external controllers can read, log, or edit reflection tokens to implement safety policies, planning scaffolds, or capability gating without modifying the underlying network parameters. This design reframes foundation models as systems with an explicit, trainable self-model, opening a path toward scalable mechanistic interfaces that support control, auditing, and systematic generalization across tasks and deployment contexts.'
    1: Recent progress in large reasoning models for challenging mathematical reasoning has been driven by reinforcement learning (RL). Incorporating long chain-of-thought (CoT) data during mid-training has also been shown to substantially improve reasoning depth. However, current approaches often utilize CoT data indiscriminately, leaving open the critical question of which data types most effectively enhance model reasoning capabilities. In this paper, we define the foundation model's reasoning potential for the first time as the inverse of the number of independent attempts required to correctly answer the question, which is strongly correlated with the final model performance. We then propose utilizing diverse data enriched with high-value reasoning patterns to expand the reasoning potential. Specifically, we abstract atomic reasoning patterns from CoT sequences, characterized by commonality and inductive capabilities, and use them to construct a core reference set enriched with valuable reasoning patterns. Furthermore, we propose a dual-granularity algorithm involving chains of reasoning patterns and token entropy, efficiently selecting high-value CoT data (CoTP) from the data pool that aligns with the core set, thereby training models to master reasoning effectively.
