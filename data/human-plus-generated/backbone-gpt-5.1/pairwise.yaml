  ideas:
    0: 'Multimodal Large Language Models (MLLMs), which couple pre-trained vision encoders and language models, have shown remarkable capabilities. However, their reliance on the ubiquitous Pre-Norm architecture introduces a subtle yet critical flaw: a severe norm disparity between the high-norm visual tokens and the low-norm text tokens. In this work, we present a formal theoretical analysis demonstrating that this imbalance is not a static issue. Instead, it induces an "asymmetric update dynamic", where high-norm visual tokens exhibit a ''''representational inertia,'''' causing them to transform semantically much slower than their textual counterparts. This fundamentally impairs effective cross-modal feature fusion. Our empirical validation across a range of mainstream MLLMs confirms that this theoretical dynamic---the persistence of norm disparity and the resulting asymmetric update rates---is a prevalent phenomenon. Based on this insight, we propose a remarkably simple yet effective solution: inserting a single, carefully initialized LayerNorm layer after the visual projector to enforce norm alignment, suggesting that resolving the architectural imbalance leads to a more holistically capable model.'
    1: Frontier language models today are optimized for static performance, yet real deployments demand systems that can be rapidly and safely edited as facts change, norms evolve, and users request fine-grained personalization. Existing adaptation methods, such as full or parameter-efficient finetuning, treat editability as a downstream afterthought, leading to brittle local patches or costly retraining. We propose EditLM, a pretraining paradigm that makes low-rank weight updates a first-class inductive bias. Alongside standard next-token prediction, a lightweight hypernetwork is trained to map natural-language edit descriptors—such as new factual statements, safety constraints, or stylistic preferences—into structured low-rank perturbations applied across transformer layers. Synthetic editing tasks during pretraining encourage disentangled edit directions, minimal interference with unrelated behaviors, and the compositionality of multiple edits. At deployment, new knowledge or policies are incorporated by optimizing only the hypernetwork or its latent edit codes, leaving base weights frozen. This design yields foundation models whose capabilities, values, and styles can be continuously rewritten at trivial marginal cost while preserving a stable, auditable core.
