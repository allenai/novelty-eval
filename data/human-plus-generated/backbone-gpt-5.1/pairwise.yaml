    0: Multimodal foundation models typically align short snippets of vision, audio, and language, yet they lack an explicit, modality-agnostic representation of events unfolding in time. This limitation hampers applications that require reasoning and control across heterogeneous sensors, such as robotics, assistive interfaces, and cross-modal content creation. We introduce an event-centric multimodal framework that treats all observable streams as noisy measurements of an underlying sequence of discrete latent events. Modality-specific encoders segment raw video, audio, text, and other signals into proto-events, which are clustered and fused into a shared event space using cross-modal mutual information and temporal consistency objectives. Separate decoders for each modality reconstruct signals from these event sequences, turning the latent space into a generative, compositional interface. By operating on events rather than frames or tokens, the model provides a unified substrate for tasks such as temporal question answering, cross-modal retrieval, audio-visual scene editing, and sensor-to-language grounding, while enabling new modalities to be attached via lightweight encoders and decoders without retraining the core event space.
    1: Large vision–language models (VLMs) deliver state-of-the-art results on a wide range of multimodal tasks, yet they remain prone to visual hallucinations, producing content that is not grounded in the input image. Despite progress with visual supervision, reinforcement learning, and post-hoc attention reshaping, the representational origins of hallucinations remain unclear. Our study reveals that successful grounding emerges when adjacent visual tokens exhibit coherent alignment, while hallucinations arise when key vectors scatter isotropically, weakening cross-modal attention and blurring object boundaries. Building on this insight, we propose Depth and Spatial aware Cache Refinement (DSCR), a lightweight and training-free method that augments the Transformer's key-value (KV) cache with depth cues and 2D spatial proximity. DSCR clusters vectors within objects and separates those across surfaces, guiding attention toward relevant regions without any fine-tuning. Our findings highlight KV-coherence as a core factor behind hallucinations and demonstrate a practical, model-agnostic solution for enhancing VLM reliability.
