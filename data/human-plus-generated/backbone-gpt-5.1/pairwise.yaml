  ideas:
    0: While diffusion models have achieved remarkable performance in image generation, they often struggle with the imbalanced datasets frequently encountered in real-world applications, resulting in significant performance degradation on minority classes. In this paper, we identify model capacity allocation as a key and previously underexplored factor contributing to this issue, providing a perspective that is orthogonal to existing research. Our empirical experiments and theoretical analysis reveal that majority classes monopolize an unnecessarily large portion of the model's capacity, thereby restricting the representation of minority classes. To address this, we propose Capacity Manipulation (CM), which explicitly reserves model capacity for minority classes. Our approach leverages a low-rank decomposition of model parameters and introduces a capacity manipulation loss to allocate appropriate capacity for capturing minority knowledge, thus enhancing minority class representation. CM can be combined with existing methods to further boost overall performance.
    1: 'Representation learning methods are typically specialized to a single supervision regime: self-supervised objectives exploit invariances between augmented views, semi-supervised methods mix contrastive and label losses, and supervised training optimizes discriminative criteria. This fragmentation makes it difficult to reuse architectures across regimes, combine heterogeneous weak signals, or continuously refine representations as richer supervision becomes available. We propose Evidence Graph Representation Learning (EGRL), a unified framework that treats every form of supervision as typed, confidence-weighted evidence on a latent similarity graph over instances. Nodes correspond to examples and auxiliary anchors; edges encode constraints such as augmentations, class labels, pairwise must-link / cannot-link relations, metadata co-occurrence, or temporal proximity. A single energy-based contrastive objective encourages embeddings that jointly satisfy all evidence while a meta-learner adjusts edge-type weights to resolve gradient conflicts between supervision sources. EGRL reduces to standard self-supervised, semi-supervised, or supervised objectives as special cases, yet flexibly accommodates new supervision types without redesigning the loss, enabling continual, supervision-agnostic representation learning.'
