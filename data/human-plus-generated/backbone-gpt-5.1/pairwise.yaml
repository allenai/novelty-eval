  ideas:
    0: 'We propose Epistemic State Language Models (ESLMs), a class of frontier-scale foundation models that maintain and manipulate an explicit latent representation of their own beliefs. Instead of mapping prompts directly to continuations, an ESLM conditions generation on a structured belief graph: a set of atomic propositions annotated with uncertainty and provenance pointers to underlying evidence. The model jointly learns to (i) induce this epistemic state from raw text and retrieved documents, (ii) update it across multi-turn, multi-session interactions, and (iii) decode responses as constrained consequences of the current belief graph. Training interleaves standard next-token prediction with auxiliary epistemic objectives that enforce cross-prompt consistency, explicit uncertainty expression, and alignment between claims and cited evidence. Synthetic epistemic traces, constructed by automatically extracting candidate propositions and entailment relations from large corpora and tool-augmented dialogues, provide scalable supervision for belief induction and update dynamics. ESLMs aim to transform foundation models from opaque sequence predictors into agents with explicit, auditable epistemic state, enabling more reliable long-horizon reasoning, safer deployment under distribution shift, and principled interfaces for oversight and correction.'
    1: Measuring the in-context computational effort of language models is a key challenge, as metrics like next-token loss fail to capture reasoning complexity. Prior methods based on latent state compressibility can be invasive and unstable. We propose Multiple Token Divergence (MTD), a simple measure of computational effort defined as the KL divergence between a model's full output distribution and that of a shallow, auxiliary prediction head. MTD can be computed directly from pre-trained models with multiple prediction heads, requiring no additional training. Building on this, we introduce Divergence Steering, a novel decoding method to control the computational character of generated text. MTD provides a practical, lightweight tool for analyzing and steering the computational dynamics of language models.
