    0: 'We introduce Sheaf Neural Operators (SNOs), a functorial framework for learning on graphs and other geometric or topological structures that vary in resolution and representation. SNOs model signals as sections of cellular sheaves over general cell complexes, encompassing graphs, hypergraphs, and meshes within a single algebraic-topological formalism. Each layer is parameterized as a local sheaf morphism whose global action defines an operator between spaces of sections, constrained to commute with refinement, restriction, and inclusion maps of complexes. This functoriality enforces resolution-consistent predictions: training on one discretization induces operators that transfer coherently to finer or coarser meshes, subgraphs, or alternative cell decompositions of the same underlying space. We construct attention-style and convolutional SNO layers from incidence-based kernels and describe topologically principled pooling and coarsening via derived pushforward of sheaves. The resulting architecture unifies message passing on heterogeneous relational graphs, surrogate modeling of PDEs on unstructured meshes, and learning on time-varying topologies as instances of a single operator-learning paradigm on cell complexes, explicitly encoding and preserving topological structure across discretizations.'
    1: Large Language Models (LLMs) often generate incorrect or unsupported content, known as hallucinations. Existing detection methods rely on heuristics or simple models over isolated computational traces such as activations, or attention maps. We unify these signals by representing them as attributed graphs, where tokens are nodes, edges follow attentional flows, and both carry features from attention scores and activations. Our approach, CHARM, casts hallucination detection as a graph learning task and tackles it by applying GNNs over the above attributed graphs. We show that CHARM provably subsumes prior attention-based heuristics. Our results shed light on the relevant role played by the graph structure and on the benefits of combining computational traces.
