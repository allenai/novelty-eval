  ideas:
    0: 'The rapid integration of agentic AI into high-stakes real-world applications requires robust oversight mechanisms. The emerging field of AI Control (AIC) aims to provide such an oversight mechanism, but practical adoption depends heavily on implementation overhead. To study this problem better, we introduce the notion of Control tax---the operational and financial cost of integrating control measures into AI pipelines. Our work makes three key contributions to the field of AIC: (1) we introduce a theoretical framework that quantifies the Control Tax and maps classifier performance to safety assurances; (2) we formalize adversarial settings where attacker models insert subtle backdoors into code while monitoring models attempt to detect these vulnerabilities; and (3) we provide empirical financial cost estimates for control protocols and develop optimized monitoring strategies that balance safety and cost-effectiveness while accounting for practical constraints like auditing budgets. Our framework enables practitioners to make informed decisions by systematically connecting safety guarantees with their costs, advancing AIC through principled economic feasibility assessment across different deployment contexts.'
    1: Current alignment methods for large models treat human feedback as a single homogeneous signal, obscuring whose values are encoded and how they trade off safety, fairness, privacy, and expressive diversity. We introduce Plurality-Aware Differentially Private Alignment, a framework that formalizes alignment as a social choice problem over heterogeneous normative preferences. The approach elicits structured feedback from multiple stakeholder groups and embeds it in a shared latent norm space, then applies differentially private probabilistic social choice mechanisms to aggregate these preferences into a distribution over admissible behavioral constitutions rather than a single fixed rule set. This distribution defines a population-level value prior that conditions a constrained policy-optimization objective, in which group-level fairness, individual privacy, and hard safety constraints are enforced via risk-sensitive Lagrangian penalties and infeasibility filters. The framework yields provable guarantees on individual contribution privacy, formalizes representation and participation fairness of stakeholder groups, and exposes tunable levers for negotiating trade-offs among safety, privacy, and pluralistic expression. We further outline how the resulting constitutions can be updated over time through continuous, privacy-preserving feedback, enabling foundation models whose alignment remains transparent, auditable, and adaptively grounded in evolving societal norms.
