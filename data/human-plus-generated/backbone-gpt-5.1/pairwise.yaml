  ideas:
    0: In-context Learning (ICL) is an emerging few-shot learning paradigm based on modern Language Models (LMs), yet its inner mechanism remains unclear. In this paper, we investigate the mechanism through a novel perspective of information removal. Specifically, we demonstrate that in the zero-shot scenario, LMs encode queries into non-selective representations in hidden states containing information for all possible tasks, leading to arbitrary outputs without focusing on the intended task. Meanwhile, we find that selectively removing specific information from hidden states by a low-rank filter effectively steers LMs toward the intended task. Building on these findings, by measuring the hidden states on carefully designed metrics, we observe that few-shot ICL effectively simulates such task-oriented information removal processes, selectively removing the redundant information from entangled non-selective representations, and improving the output based on the demonstrations, which constitutes a key mechanism underlying ICL. Moreover, we identify essential attention heads inducing the removal operation, termed Denoising Heads, which enables ablation experiments blocking the information removal operation from the inference, confirming both the critical role of the information removal mechanism and denoising heads.
    1: 'Existing explanation methods typically characterize why a model produced a particular prediction in terms of salient features or surrogate models in input space, but they do not identify which internal computations are minimally responsible for that decision. We propose Explanations as Minimal Editing Programs (MEPs), a framework that defines an explanation as the smallest targeted modification to a model’s parameters that would change a given prediction while leaving its behavior on a reference distribution unchanged. MEPs cast explanation as a constrained optimization problem over the space of local model edits, equipped with a task-dependent notion of edit distance and behavioral invariance. The resulting edit induces a sparse “patch” to the computation graph that is mapped to human-interpretable concepts using a learned dictionary over neurons, attention heads, or intermediate features. This yields counterfactual, mechanistically grounded explanations of the form: “if this small set of internal rules were different in this way, the model’s decision would flip.” We describe instantiations of MEPs for deep classifiers and large language models, and discuss how the same machinery supports interactive “what-if” analysis, safety audits, and debugging by allowing users to inspect, simulate, and optionally apply the proposed edits as executable interventions on the model.'
