  ideas:
    0: We propose Compositional Lifelong Meta-Adapters (CLiMA), a framework that unifies transfer learning, meta learning, and lifelong learning through a shared notion of reusable skills. CLiMA maintains a library of small neural adapters that implement primitive transformations on a frozen backbone, and a meta-learned hyper-composer that assembles these primitives into task-specific adaptation policies. Given a new task, a task encoder maps a small support set to a task embedding, which the hyper-composer uses to select and combine a sparse subset of adapters into a lightweight parameterization. Bilevel online optimization updates both the adapter library and the composer as tasks stream in, with consolidation constraints that preserve previously instantiated compositions while encouraging maximal reuse of existing skills. This yields a continuously evolving but structurally regularized space of task solutions, enabling targeted transfer across non-stationary task sequences, fast adaptation from limited data, and controlled expansion of the skill library. CLiMA reframes lifelong learning as lifelong meta-composition of skills rather than monolithic parameter refinement.
    1: 'A persistent paradox in continual learning (CL) is that neural networks often retain linearly separable representations of past tasks even when their output predictions fail. We formalize this distinction as the gap between *deep* (feature-space) and *shallow* (classifier-level) forgetting. We reveal a critical asymmetry in Experience Replay: while minimal buffers successfully anchor feature geometry and prevent deep forgetting, mitigating shallow forgetting typically requires substantially larger buffer capacities.

      To explain this, we extend the Neural Collapse framework to the sequential setting. We characterize deep forgetting as a geometric drift toward out-of-distribution subspaces and prove that any non-zero replay fraction asymptotically guarantees the retention of linear separability. Conversely, we identify that the ``strong collapse'''' induced by small buffers leads to rank-deficient covariances and inflated class means, effectively blinding the classifier to true population boundaries. By unifying CL with out-of-distribution detection, our work challenges the prevailing reliance on large buffers, suggesting that explicitly correcting these statistical artifacts could unlock robust performance with minimal replay.'
