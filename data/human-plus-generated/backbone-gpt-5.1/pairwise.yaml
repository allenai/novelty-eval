    0: Existing causal discovery methods are fundamentally limited by the assumption of a static causal graph, a constraint that fails in real-world systems where causal relationships dynamically vary with underlying system parameters. This discrepancy prevents the application of causal discovery in critical domains such as industrial process control, where understanding how causal effects change is essential. We address this gap by proposing a new paradigm that moves beyond static graphs to learn functional causal representations. We introduce a framework that models each causal link not as a static weight but as a function of measurable system parameters. By representing these functions using Polynomial Chaos Expansions (PCE), we develop a tractable method to learn the complete parametric causal structure from observational data. We provide theoretical proofs for the identifiability of these functional models and introduce a novel, provably convergent learning algorithm that provides an interpretable model of how causal mechanisms evolve.
    1: Causal models are typically learned at a single, fixed level of detail, even though the granularity at which variables should be represented depends strongly on the causal query of interest. We propose Query-Conditional Causal Abstraction Learning (Q-CAL), a framework in which an agent learns a family of macro-level causal models, each specialized to a particular class of interventional or counterfactual queries. Q-CAL takes as input high-dimensional observations and a textual or symbolic description of a causal query, and outputs a compact set of abstract variables together with a structural causal model over them. Training jointly optimizes query-answering accuracy, an information-bottleneck objective that enforces minimality of the abstraction, and cross-query consistency constraints that encourage abstractions to align when their scopes overlap, forming a partial order from fine- to coarse-grained models. This query-conditional view of causal representation enables flexible, task-adaptive reasoning, supports transfer to new queries via meta-learning over abstraction space, and offers interpretable macro-variables tailored to specific scientific or decision-making goals.
