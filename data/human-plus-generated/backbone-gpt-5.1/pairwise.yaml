    0: 'Foundation models are increasingly adapted to downstream tasks without modifying their parameters, by optimizing only textual prompts or other input instructions. This practice raises a basic learning-theoretic question: what is the statistical capacity of a fixed pretrained model when the learner may only choose its prompts? We formalize prompt-restricted learning by viewing each prompt as selecting a hypothesis from the function class implemented by a frozen model, and we introduce a new complexity measure, the prompt dimension, that captures how richly prompts can reconfigure its behavior. Using tools from VC theory and Rademacher complexity, we derive distribution-independent sample-complexity bounds for empirical risk minimization over prompts, showing that generalization depends on the rank of an input–prompt interaction Jacobian rather than on the full parameter count of the model. For a stylized Transformer, we compute the prompt dimension in terms of width, depth, and prompt length, obtaining architectures where prompting is provably far less expressive than full fine-tuning, as well as regimes where a single frozen model is universally prompt-learnable for a rich concept class. Our results provide the first general framework for reasoning about which tasks are learnable by prompting and how promptability scales with model design.'
    1: 'A major problem in the study of large language models is to understand their inherent low-dimensional structure. We introduce an approach to study the low-dimensional structure of language models at a model-agnostic level: as sequential probabilistic models. We first empirically demonstrate that a wide range of modern language models exhibit low-rank structure: in particular, matrices built from the model''s logits for varying sets of prompts and responses have low approximate rank. We then show that this low-rank structure can be leveraged for generation --- in particular, we can generate a response to a target prompt using a linear combination of the model''s outputs on unrelated, or even nonsensical prompts.


      On the theoretical front, we observe that studying the approximate rank of language models in the sense discussed above yields a simple universal abstraction whose theoretical predictions parallel our experiments. We then analyze the representation power of the abstraction and give provable learning guarantees.'
