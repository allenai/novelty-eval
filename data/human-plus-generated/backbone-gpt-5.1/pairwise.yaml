    0: 'Omni-modal reasoning is essential for intelligent systems to understand and draw inferences from diverse data sources. While existing omni-modal large language models (OLLM) excel at perceiving diverse modalities, they lack the complex reasoning abilities of recent large reasoning models (LRM). However, enhancing the reasoning ability of OLLMs through additional training presents significant challenges, including the need for high-quality data, task-specific adaptation, and substantial computational costs. To address these limitations, we propose ThinkOmni, a training-free and data-free framework that lifts textual reasoning to omni-modal scenarios. ThinkOmni introduces two key components: 1) LRM-as-a-Guide, which leverages off-the-shelf LRMs to guide the OLLM decoding process; 2) Stepwise Contrastive Scaling, which adaptively balances perception and reasoning signals without manual hyperparameter tuning. Overall, ThinkOmni offers a flexible and generalizable solution for omni-modal reasoning and provides new insights into the generalization and application of reasoning capabilities.'
    1: Multimodal learning systems increasingly integrate vision, audio, language, and other sensory streams, yet most architectures either entangle all modalities within a monolithic transformer or rely on ad hoc pipelines that do not generalize to new tasks and modalities. We propose Modality Programs, a framework that casts multimodal understanding and generation as latent program induction over a library of neural tools. A central program generator, parameterized as a sequence model in a discrete “instruction language,” takes coarse embeddings from modality-specific encoders and a task description, and outputs a program sketch that composes differentiable operators such as DETECT_OBJECTS, TRACK_ENTITIES, ESTIMATE_PROSODY, or PARSE_TEXT. These operators are implemented by frozen or lightly adapted unimodal experts, and programs are executed to produce task outputs in any target modality. The entire system is trained end-to-end with only task-level supervision, using structural priors that encourage sparse, reusable, and interpretable programs. This design decouples high-level reasoning from low-level perception, enables rapid extension to new sensors by adding tools rather than retraining the core, and supports systematic generalization by recombining existing multimodal skills into novel programs.
