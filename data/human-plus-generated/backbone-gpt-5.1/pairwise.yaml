    0: The semantic similarity between sample expressions measures the distance between their latent `meaning'. These meanings are themselves typically represented by textual expressions. We propose a novel approach whereby the semantic similarity among textual expressions is based not on other expressions they can be rephrased as, but rather based on the imagery they evoke. While this is not possible with humans, generative models allow us to easily visualize and compare generated images, or their distribution, evoked by a textual prompt. Therefore, we characterize the semantic similarity between two textual expressions simply as the distance between image distributions they induce, or 'conjure.' We show that by choosing the Jeffreys divergence between the reverse-time diffusion stochastic differential equations (SDEs) induced by each textual expression, this can be directly computed via Monte-Carlo sampling. Our method contributes a novel perspective on semantic similarity that opens up new avenues for the evaluation of text-conditioned generative models while offering better interpretability of their learnt representations.
    1: Current alignment methods for large models aggregate heterogeneous human feedback into a single scalar reward, implicitly privileging dominant norms and relegating fairness, safety, and privacy to loosely coupled filters. This monolithic view obscures whose values are being implemented, makes normative trade-offs opaque, and provides no principled interface for plural, contested societal preferences. We propose PluRAL, a pluralistic, risk-aware alignment framework that models and optimizes over an explicit distribution of normative perspectives. PluRAL factorizes human feedback into a set of stakeholder-specific reward components and a shared library of safety, fairness, and privacy constraints expressed as differentiable risk measures over model behaviors. A constrained preference-optimization objective then learns policies that (i) follow a user-selected or institutionally mandated normative profile, while (ii) satisfying global constraints on harms, group-level disparities, and training-data leakage. An adversarial “norm stress-testing” loop continually searches for prompts that expose cross-stakeholder violations, feeding them back into the constraint set. This formulation turns alignment into an explicit, optimizable contract between plural values and formal protections, rather than an opaque scalar reward.
