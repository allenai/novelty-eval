    0: Large language models (LLMs) exhibit strong generative capabilities but remain vulnerable to confabulations, fluent yet unreliable outputs that vary arbitrarily even under identical prompts. Leveraging a quantum tensor network–based pipeline, we propose a quantum physics-inspired uncertainty quantification framework that accounts for the aleatoric uncertainty in token sequence probability for semantic equivalence-based clustering of LLM generations. In turn, this offers a principled and interpretable scheme for hallucination detection. We further introduce an entropy-maximization strategy that prioritizes high-certainty, semantically coherent outputs and highlights entropy regions where LLM decisions are likely to be unreliable, offering practical guidelines for when human oversight is warranted.
    1: Approximate Bayesian inference methods such as variational inference, Laplace approximations, and stochastic-gradient MCMC produce scalable posteriors but offer no finite-sample guarantees on the coverage of their credible sets. This lack of calibration is problematic in deployment, where users often interpret Bayesian intervals as if they were frequentist-valid. We propose conformal posterior calibration, a generic, post-hoc procedure that transforms any sampling-based posterior approximation into a reweighted posterior whose predictive credible sets enjoy finite-sample marginal coverage guarantees. The method treats samples from an arbitrary base posterior as support points of a discrete distribution and learns new weights by solving a maximum-entropy optimization problem subject to conformal-style coverage constraints on a held-out calibration set. The resulting warped posterior remains close to the original in Kullback–Leibler or Wasserstein distance, yet its induced predictive regions satisfy user-specified coverage levels under minimal exchangeability assumptions. The framework accommodates black-box likelihoods, hierarchical models, and amortized variational families, and can selectively calibrate functionals of interest, such as task losses or safety constraints, rather than the full data space. Conformal posterior calibration thereby bridges Bayesian and distribution-free uncertainty quantification, providing a principled way to endow approximate inference with operational reliability guarantees.
