    0: 'Mixture-of-Experts (MoE) architectures have demonstrated remarkable capabilities and scalability for large language models, but incur a substantial memory footprint due to redundant expert parameters. Existing compression approaches, particularly those based on low-rank decomposition, typically operate at the granularity of individual experts. However, such per-expert methods neglect structural redundancies shared across experts, limiting their compression efficiency and effectiveness. In this work, we introduce TD-MoE (Tensor Decomposition for MoE Compression), a data-aware method that jointly factorizes expert weights by capturing global dependencies. Our contributions are threefold: (i) Cross-expert tensorization with joint three-dimensional decomposition, which unifies all experts within a layer into a single tensor and captures shared structure beyond per-expert scope; (ii) A multi-linear whitening strategy, which decorrelates input and output features, yielding a more balanced and data-adaptive decomposition; (iii) A three-dimensional rank allocation mechanism, which dynamically assigns 3D decomposition ranks across dimensions to best meet a target compression ratio while minimizing the reconstruction error.'
    1: General-purpose models for vision, audio, language, and other modalities remain predominantly monolithic, entangling modality-specific feature extraction with generic computations such as detection, segmentation, tracking, and summarization. This tight coupling obscures which parts of a network implement modality-agnostic “perceptual skills” and forces each skill to be relearned independently per modality. We introduce a framework that explicitly decomposes multimodal systems into modality encoders and a small library of reusable neural perceptual operators. Encoders map heterogeneous inputs—images, spectrograms, token sequences, point clouds—into a shared token space, while operators are parameterized modules that implement abstract computations (e.g., Group, Segment, Track, Align, Summarize) on tokens irrespective of their origin. A cross-modal meta-learning objective exposes each operator to aligned tasks across modalities, enforcing functional invariance while allowing encoders to specialize. New modalities are integrated by learning only an encoder into the token space, immediately inheriting the operator library; new tasks are specified as compositions of existing operators. This factorization aims to turn multimodal foundation models into modular toolkits of transferable perceptual skills, enabling systematic reuse, clearer interpretability of internal computations, and rapid adaptation of capabilities across emerging sensing modalities.
