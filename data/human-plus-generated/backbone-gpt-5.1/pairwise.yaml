    0: 'Score-based methods, such as diffusion models and Bayesian inverse problems, are often interpreted as learning the data distribution in the low-noise limit ($\sigma \to 0$). In this work, we propose an alternative perspective: their success arises from implicitly learning the data manifold rather than the full distribution. Our claim is based on a novel analysis of scores in the small-$\sigma$ regime that reveals a sharp separation of scales: information about the data manifold is $\Theta(\sigma^{-2})$ stronger than information about the distribution. We argue that this insight suggests a paradigm shift from the less practical goal of distributional learning to the more attainable task of geometric learning, which provably tolerates $O(\sigma^{-2})$ larger errors in score approximation. We illustrate this perspective through three consequences: i) in diffusion models, concentration on data support can be achieved with a score error of $o(\sigma^{-2})$, whereas recovering the specific data distribution requires a much stricter $o(1)$ error; ii) more surprisingly, learning the uniform distribution on the manifold—an especially structured and useful object—is also $O(\sigma^{-2})$ easier; and iii) in Bayesian inverse problems, the maximum entropy prior is $O(\sigma^{-2})$ more robust to score errors than generic priors.'
    1: Controllable generative models are typically trained as monolithic systems that entangle diverse requirements—realism, semantic alignment, safety, and personalization—inside a single parameterization, making them hard to update, audit, or reconfigure. We propose Composable Diffusion Experts (CoDE), a modular framework that treats the target distribution as a product of simpler, factor-specific generative components. Each factor, such as base realism, text alignment, domain style, or safety policy, is implemented by its own diffusion expert trained on a shared forward SDE to approximate the factor score ∇ₓ log pₖ(x_t | cₖ, t). At sampling time, CoDE aggregates any subset of expert scores to define a composite reverse-time dynamics that approximates sampling from the product-of-experts distribution, enabling zero-shot composition of new constraint sets without retraining existing experts. A decomposition objective with information-theoretic and orthogonality regularizers encourages approximate factorization of the data distribution, while a distributed consensus sampler allows experts to contribute scores through lightweight communication. This design turns generative models into configurable assemblies of constraint-specific experts, supporting flexible control, policy updates, and principled multi-constraint generation.
