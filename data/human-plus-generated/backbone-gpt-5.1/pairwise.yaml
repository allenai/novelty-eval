    0: 'Machine learning benchmarks are predominantly static artifacts, fostering rapid saturation and brittle progress that overfits to fixed test sets. We propose EvoBench, a principled framework for constructing *evolving* benchmarks whose data distribution adapts adversarially to the current frontier of models. EvoBench decomposes a benchmark into three components: a generative test-time data policy conditioned on model behaviors, a protocol for selecting a reference model pool that defines the current frontier, and a temporal logging scheme that records all generated instances, their provenance, and model responses. The generative policy synthesizes new test cases that maximally separate models in the frontier subject to semantic and plausibility constraints, transforming evaluation into a repeated game between data generator and models. EvoBench yields benchmarks that grow over time, capturing emergent failure modes while preserving reproducibility via immutable snapshots and standardized replay scripts. We illustrate how EvoBench can instantiate evolving datasets for vision, language, and multimodal reasoning tasks, enabling the community to measure robustness and innovation against an ever-challenging, transparently documented test stream rather than a single, exhaustible dataset.'
    1: We introduce **Gaia2**, a benchmark for evaluating large language model agents in realistic, asynchronous environments. Unlike prior static or synchronous evaluations, Gaia2 introduces scenarios where environments evolve independently of agent actions, requiring agents to operate under temporal constraints, adapt to noisy and dynamic events, resolve ambiguity, and collaborate with other agents. Each scenario is paired with a write-action verifier, enabling fine-grained, action-level evaluation and making Gaia2 directly usable for reinforcement learning from verifiable rewards. Gaia2 is built on a consumer environment with the open-source **Agents Research Environments** platform and designed to be easy to extend. By releasing Gaia2 alongside the foundational ARE framework, we aim to provide the community with a flexible infrastructure for developing, benchmarking, and training the next generation of practical agent systems.
