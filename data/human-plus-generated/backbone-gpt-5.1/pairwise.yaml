    0: We study function spaces parametrized by neural networks, referred to as neuromanifolds. Specifically, we focus on deep Multi-Layer Perceptrons (MLPs) and Convolutional Neural Networks (CNNs) with an activation function that is a sufficiently generic polynomial. First, we address the identifiability problem, showing that, for almost all functions in the neuromanifold of an MLP, there exist only finitely many parameter choices yielding that function. For CNNs, the parametrization is generically one-to-one. As a consequence, we compute the dimension of the neuromanifold. Second, we describe singular points of neuromanifolds. We characterize singularities completely for CNNs, and partially for MLPs. In both cases, they arise from sparse subnetworks. For MLPs, we prove that these singularities often correspond to critical points of the mean-squared error loss, which does not hold for CNNs. This provides a geometric explanation of the sparsity bias of MLPs. All of our results leverage tools from algebraic geometry.
    1: Classical measures of statistical complexity such as VC dimension and Rademacher complexity are inherently worst-case over a hypothesis class and disregard the dynamics of the learning algorithm. This mismatch is especially stark for overparameterized models, where the class is extremely rich yet training procedures like stochastic gradient descent converge to highly structured predictors. We introduce trajectory-local complexity, an algorithm-dependent refinement of Rademacher complexity that is restricted to the random path of hypotheses explored during training. Our framework upper-bounds the generalization gap of the final iterate in terms of a data-dependent complexity of the entire optimization trajectory, thereby unifying ideas from uniform convergence and algorithmic stability. For broad families of gradient-based algorithms, trajectory-local complexity can be controlled by geometric properties of the loss landscape and implicit regularization, yielding non-vacuous bounds even when global capacity is infinite. The theory suggests new algorithm design principles that explicitly constrain optimization paths to low-complexity regions, providing a quantitative lens on benign overfitting and double descent phenomena.
