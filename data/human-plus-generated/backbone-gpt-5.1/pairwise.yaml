    0: 'We propose a method for inferring an egocentric dense depth map from an RGB image and a sparse point cloud. The crux of our method lies in modeling the 3D scene implicitly within the latent space and learning an inductive bias in an unsupervised manner through principles of Structure-from-Motion. To force the learning of this inductive bias, we propose to optimize for an ill-posed objective during training: predicting latent features that are not observed in the input view, but exist in the 3D scene. This is facilitated by means of rigid warping of latent features from the input view to a nearby or adjacent (co-visible) view of the same 3D scene. "Empty" regions in the latent space that correspond to regions occluded from the input view are completed by a Contextual eXtrapolation (ConteXt) mechanism based on features visible in input view. The learned inductive bias of ConteXt can be transferred to modulate the features of the input view to improve fidelity. We term our method "Occluded Region Completion as Supervision" or ORCaS.'
    1: Multimodal foundation models typically specialize in a few well-paired modalities, such as image–text or audio–text, limiting transfer to novel modality combinations. We propose Modality Algebra Networks, a framework that treats each modality as a learned latent space and cross-modal translation as compositions of a small set of neural operators. Each modality is equipped with an autoencoder that produces a structured latent representation, while a library of cross-modal operators is meta-learned to act on these latents. Operators are trained under algebraic constraints—cycle-consistency, semantic preservation via weak textual supervision, and sparsity of compositions—so that complex translations (e.g., audio→tactile, image→control trajectories) can be synthesized as paths in an operator graph, even when no direct paired data exist for the target pair. This decoupling of modality-specific encoding from cross-modal composition turns multimodal learning into learning a shared operator calculus, enabling zero-pair transfer, systematic recombination of modalities, and rapid instantiation of new applications across vision, audio, language, haptics, and control without retraining full-stack models.
