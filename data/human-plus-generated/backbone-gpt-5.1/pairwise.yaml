    0: 'As a topological invariant for discrete structures, discrete curvature has been widely adopted in the study of complex networks and graph neural networks. A prevailing viewpoint posits that edges with highly negative curvature will induce graph bottlenecks and the over-squashing phenomenon. In this paper, we critically re-examine this view and put forward our central claim: **high negative curvature is a sufficient but not a necessary condition for over-squashing**. We first construct a family of counterexamples demonstrating the failure of discrete curvature, where some edges are severely squashed, but the curvature still appears positive. Furthermore, extensive experiments demonstrate that the most commonly used discrete curvature measure --- Ollivier–Ricci curvature --- fails to detect a substantial portion of over-squashed edges. To alleviate this limitation, we propose Weighted Augmented Forman-3 Curvature ($\mathsf{WAF3}$), which significantly improves the detection of over-squashed edges. Additionally, we develop a highly efficient approximation algorithm for $\mathsf{WAF3}$, enabling scalable curvature computation on large graphs.'
    1: Geometric deep learning on simplicial and cellular complexes has enabled models that respect higher-order interactions and discrete differential structure, yet these methods almost universally assume that the underlying topology is fixed and known. Many scientific and relational domains instead provide only raw signals or noisy pairwise affinities, from which both the geometry and higher-order topology must be inferred. We introduce a framework for differentiable topology discovery that learns a finite cell complex jointly with the task-specific predictor. Our approach parameterizes incidence matrices across dimensions and relaxes them into continuous variables, while penalizing violations of fundamental algebraic-topological identities such as boundary-of-boundary zero and incidence integrality. The learned complex induces boundary, coboundary, and Hodge Laplacian operators on which a generic cell-complex neural network is defined, enabling message passing and spectral propagation over a data-adapted topology. This end-to-end formulation turns the choice of graph or complex from a hand-crafted prior into a learnable object, opening new avenues for topology-aware representation learning in domains with latent or evolving structure.
