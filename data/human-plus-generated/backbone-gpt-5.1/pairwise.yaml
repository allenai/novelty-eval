  ideas:
    0: We propose a unified framework for aligning foundation models with diverse societal values under simultaneous safety, fairness, and privacy constraints. Rather than optimizing toward a single, opaque reward, we model alignment as a multi-stakeholder social choice problem over behavior-level preferences. Individuals and communities provide pairwise comparisons or natural-language critiques of model outputs through locally differentially private interfaces, and a federated inference layer learns group-specific latent “value bundles” without centralizing raw feedback. These value bundles define stakeholder-specific reward models that are aggregated via a fairness-aware social choice mechanism, which explicitly bounds representational disparities across groups and supports egalitarian or max–min weighting schemes. A constitutional layer imposes hard safety and rights constraints, restricting the feasible set of aligned policies before optimization. We then perform constrained policy optimization to align the model to the aggregated reward while provably respecting constitutional and fairness constraints. This framework aims to make alignment simultaneously safer, more legitimate, and privacy-preserving in pluralistic societies.
    1: 'Monitoring large language models'' (LLMs) activations is an effective way to detect harmful requests before they lead to unsafe outputs. However, traditional safety monitors often require the same amount of compute for every query. This creates a trade-off: expensive monitors waste resources on easy inputs, while cheap ones risk missing subtle cases. We argue that safety monitors should be flexible--costs should rise only when inputs are difficult to assess, or when more compute is available. To achieve this, we introduce Truncated Polynomial Classifiers (TPCs), a natural extension of linear probes for dynamic activation monitoring. Our key insight is that polynomials can be trained and evaluated progressively, term-by-term. At test-time, one can early-stop for lightweight monitoring, or use more terms for stronger guardrails when needed. TPCs provide two modes of use. First, as a safety dial: by evaluating more terms, developers and regulators can "buy" stronger guardrails from the same model. Second, as an adaptive cascade: clear cases exit early after low-order checks, and higher-order guardrails are evaluated only for ambiguous inputs, reducing overall monitoring costs.'
