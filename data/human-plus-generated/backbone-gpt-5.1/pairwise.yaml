    0: Physical simulation relies on spatially-varying mechanical properties, typically laboriously hand-crafted. We present the first feed-forward model to predict fine-grained mechanical properties, Young's modulus ($E$), Poisson's ratio ($\nu$), and density ($\rho$), throughout *the volume* of 3D objects. Our model supports any 3D representation that can be rendered and voxelized, including Signed Distance Fields (SDFs), Gaussian Splats and Neural Radiance Fields (NeRFs). To achieve this, we aggregate per-voxel multi-view features for any input, which are passed to our trained Geometry Transformer to predict per-voxel material latent codes. These latents reside on the trained manifold of physically plausible materials, which we train on a real-world dataset, guaranteeing the validity of decoded per-voxel materials. To obtain object-level training data, we propose an annotation pipeline combining knowledge from segmented 3D datasets, material databases, and a vision-language model. VoMP estimates volumetric properties and can convert 3D objects into simulation-ready assets, enabling realistic deformable simulations.
    1: Multimodal foundation models for vision, audio, language, and beyond typically align raw signals in a shared feature space, yet they conflate the structure of the world with the idiosyncrasies of each sensor. This entanglement hinders systematic generalization to new modalities and limits cross-modal editing to shallow feature manipulations. We introduce Latent Event Ports (LEP), a causal world-modeling framework that factors perception into modality-agnostic latent events and modality-specific differentiable renderers. LEP represents an episode as a sparse sequence of discrete events with continuous attributes, and learns paired encoder–renderer ports that transform between each raw modality (images, waveforms, text, and structured signals) and this shared event space. A variational objective couples ports across time and modalities, enforcing that a single latent event sequence must jointly explain what is seen, heard, and described without requiring aligned annotations. Once trained, LEP permits plug-and-play integration of novel modalities by learning only a new port while keeping the world model fixed, and supports applications such as cross-modal prediction, counterfactual editing across modalities, and unified retrieval over heterogeneous sensory logs.
