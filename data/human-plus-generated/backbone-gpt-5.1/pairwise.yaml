  ideas:
    0: 'We propose Compositional Supervision Graphs, a unified framework that treats unsupervised, self-supervised, semi-supervised, and supervised objectives as typed factors over a shared representation space. Each example, its augmented views, and its (possibly missing) labels are nodes in a graph, while edges encode supervision constraints: invariances between augmentations, temporal or neighborhood smoothness, compatibility with symbolic labels, and relations induced by pseudo-labels or teacher models. A single encoder maps all node types into a latent space, and each edge type is equipped with a learnable potential that scores how well connected embeddings satisfy the corresponding constraint. Representation learning becomes energy minimization over this factor graph, with classic contrastive, reconstruction, consistency, and cross-entropy losses emerging as special cases of particular edge families. To move beyond fixed linear loss combinations, we introduce a supervision scheduler that adaptively selects edge types and instances to activate, guided by their estimated marginal utility for representation quality under a small held-out or purely self-supervised proxy. This perspective turns representation learning into the problem of composing and allocating heterogeneous supervision signals, enabling programmable supervision curricula that smoothly interpolate between unsupervised pretraining and fully supervised finetuning.'
    1: 'Multi-view clustering integrates the consistency and complementarity of different views to achieve unsupervised data grouping. Existing multi-view clustering methods primarily confront two challenges: i) they generally perform feature extraction in the feature domain, which is sensitive to noise and may neglect cluster-specific information that is indistinguishable in the original space; ii) current dynamic fusion methods adopt static strategies to learn weights, lacking capability to adjust strategies adaptively under complex scenarios according to variations in data distribution and view quality. To address these issues, we propose a large language model assisted dynamic agent for multi-view clustering (LLM-DAMVC), a novel framework that recasts multi-view clustering as a dynamic decision-making problem orchestrated by a large language model. Specifically, each view is equipped with complementary agents dedicated to feature extraction. A dual-domain contrastive module is introduced to optimize feature consistency and enhance cluster separability in both the feature domain and frequency domain. Additionally, an LLM-assisted view fusion mechanism provides a flexible fusion weight learning strategy that can be adaptively applied to complex scenarios and significantly different views.'
