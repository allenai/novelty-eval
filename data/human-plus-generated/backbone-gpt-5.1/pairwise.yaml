    0: We develop a linear response framework for interpretability that treats a neural network as a Bayesian statistical mechanical system. A small perturbation of the data distribution, for example shifting the Pile toward GitHub or legal text, induces a first-order change in the posterior expectation of an observable localized on a chosen component of the network. The resulting susceptibility can be estimated efficiently with local SGLD samples and factorizes into signed, per-token contributions that serve as attribution scores. We combine these susceptibilities into a response matrix whose low-rank structure separates functional modules such as multigram and induction heads in a 3M-parameter transformer.
    1: 'Deep models routinely produce decisions that humans cannot understand or reliably modify. Existing explanation methods typically yield static attributions that are difficult to verify and offer no principled way to turn an explanation into a controlled change of model behavior. We introduce Executable Concept Interfaces, a learning framework that couples an interpretable causal graph over human-level concepts with a differentiable edit operator on the underlying black-box model. For each input region, the method induces a compact concept graph whose nodes are grounded in internal activations and whose edges specify predicted causal effects of local interventions. A bi-directional interface then enforces consistency between this graph and the base model: observational predictions must match, and simulated interventions on concept nodes are compiled into low-rank parameter or activation edits that realize the same behavioral changes in the original model. By optimizing explanations under these executable consistency constraints, the framework yields explanations that are not only locally faithful and human-readable, but also actionable, supporting counterfactual querying, safety auditing, and user-driven steering of model behavior without full retraining.'
