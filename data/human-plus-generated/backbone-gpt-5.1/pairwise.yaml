    0: Frontier language models are increasingly deployed as immutable black-box services, limiting the applicability of standard alignment and customization techniques that assume gradient or weight access. We propose Behavioral World Models (BWMs), compact neural surrogates trained to approximate a frontier model’s conditional behavior under both natural-language prompts and explicit control signals. A BWM ingests an input prompt and a differentiable control vector and learns to predict the target model’s next-token distribution and auxiliary behavioral summaries, effectively serving as a control-oriented emulator of the underlying system. Once learned from offline interaction logs, the BWM becomes a differentiable environment in which control vectors can be optimized with arbitrary objectives encoding safety constraints, stylistic targets, or user preferences. These optimized controls are then applied directly to the original frontier model via steering mechanisms such as soft prompts, routing tokens, or decoding policies, without modifying its parameters. This framework decouples expensive frontier model training from flexible downstream alignment, enabling gradient-based policy search, safety shaping, and user-specific personalization entirely in the surrogate space. Behavioral World Models thus offer a principled path toward post-hoc, model-agnostic governance and control of frontier-scale foundation models.
    1: "Process Reward Models (PRMs) have recently emerged as a powerful framework for enhancing the reasoning capabilities of large reasoning models (LRMs), particularly in the context of test-time scaling (TTS). However, their potential for supervising LRMs on tabular reasoning domains remains underexplored. \nThrough detailed empirical analyses, we identify that existing PRMs, though widely adopted for supervising text-only reasoning steps, struggle with table-specific operations such as sub-table retrieval and schema interaction, leading to critical performance bottlenecks. To address this limitation, we propose TaTToo, a novel table-grounded PRM framework that (i) reasons explicitly over tabular reasoning steps and (ii) integrates tool-based verification to provide precise reward supervision. Concretely, we first design a scalable data curation pipeline that constructs over 60k high-quality step-level annotations by integrating table verification rationales with tool-based executions. Building on the collected data, we train TaTToo with a dual-stage paradigm: cold-start supervised fine-tuning to capture tool-use reasoning patterns, followed by reinforcement learning with tool-grounded reward shaping to align our model with table-based verification."
