  ideas:
    0: 'Learning systems increasingly produce and consume intermediate “rationales”—natural language explanations or multi-step derivations—yet the impact of such structure on generalization remains poorly understood. This paper develops a learning-theoretic framework for rationale-augmented prediction, where a hypothesis maps inputs to a sequence of latent or observed intermediate states before emitting a final output. We introduce factored complexity measures that separately quantify the capacity of each intermediate module and the coupling between modules, and we prove generalization bounds in terms of these quantities rather than the capacity of the end-to-end composition. The framework reveals conditions under which supervising rationales provably reduces sample complexity: when intermediate states are minimal sufficient statistics that block shortcut paths from inputs to labels. Conversely, we characterize regimes where arbitrary or redundant rationales inflate effective complexity and degrade guarantees. The theory extends to partially annotated rationales and stochastic reasoning procedures with learned stopping rules. Overall, our results suggest design principles for architectures, annotation schemes, and training objectives that make multi-step reasoning not only more interpretable, but also fundamentally easier to learn.'
    1: Contrastive learning has emerged as a powerful framework for learning generalizable representations, yet its theoretical understanding remains limited, particularly under imbalanced data distributions that are prevalent in real-world applications. Such an imbalance can degrade representation quality and induce biased model behavior, yet a rigorous characterization of these effects is lacking. In this work, we develop a theoretical framework to analyze the training dynamics of contrastive learning with Transformer-based encoders under imbalanced data. Our results reveal that neuron weights evolve through three distinct stages of training, with different dynamics for majority features, minority features, and noise. We further show that minority features reduce representational capacity, increase the need for more complex architectures, and hinder the separation of ground-truth features from noise. Inspired by these neuron-level behaviors, we show that pruning restores performance degraded by imbalance and enhances feature separation, offering both conceptual insights and practical guidance.
