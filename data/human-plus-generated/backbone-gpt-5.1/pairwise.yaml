    0: Modeling wind-driven object dynamics from video observations is highly challenging due to the invisibility and spatio–temporal variability of wind, as well as the complex deformations of objects. We present DiffWind, a physics-informed differentiable framework that unifies wind–object interaction modeling, video-based reconstruction, and forward simulation. Specifically, we represent wind as a grid-based physical field and objects as particle systems derived from 3D Gaussian Splatting, with their interaction modeled by the Material Point Method (MPM). To recover wind-driven object dynamics, we introduce a reconstruction framework that jointly optimizes the spatio–temporal wind force field and object motion through differentiable rendering and simulation. To ensure physical validity, we incorporate the Lattice Boltzmann Method (LBM) as a physics-informed constraint, enforcing compliance with fluid dynamics laws. Beyond reconstruction, our method naturally supports forward simulation under novel wind conditions and enables new applications such as wind retargeting. We further introduce WD-Objects, a dataset of synthetic and real-world wind-driven scenes, opening a new avenue for video-based wind–object interaction modeling.
    1: 'We introduce PolyScene, an event-centric multimodal foundation model that treats perception, language, and other sensory streams as complementary observations of a shared underlying world. Instead of fusing raw visual, audio, and textual tokens directly, PolyScene learns a discrete, structured event graph as an intermediate representation: latent event slots capture agents, actions, objects, attributes, and temporal extents, while typed edges encode temporal, causal, and coreferential relations. Modality-specific encoders transform image sequences, audio waveforms, text, and additional sensors into provisional event hypotheses, which are merged by a graph transformer into a coherent scene-level event graph. Symmetric decoders then reconstruct each modality from this graph, enabling any-to-any cross-modal prediction, completion, and generation. Training is driven by self-supervised cross-modal reconstruction, cycle-consistent prediction under missing or corrupted modalities, and structural regularization that encourages temporally sparse, causally stable event graphs. Once trained, PolyScene acts as a general-purpose “world interface” for applications spanning video–audio–text question answering, cross-modal retrieval and captioning, multi-sensor robotics perception, and consistent multimodal editing, while new modalities can be incorporated through lightweight adapters that align to the shared event graph space.'
