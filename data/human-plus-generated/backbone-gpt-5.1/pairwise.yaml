  ideas:
    0: '*Automated circuit discovery* is a central tool in mechanistic interpretability for identifying the internal components of neural networks responsible for specific behaviors. While prior methods have made significant progress, they typically depend on heuristics or approximations and do not offer provable guarantees over continuous input domains for the resulting circuits. In this work, we leverage recent advances in neural network verification to propose a suite of automated algorithms that yield circuits with *provable guarantees*. We focus on three types of guarantees: (1) *input domain robustness*, ensuring the circuit agrees with the model across a continuous input region; (2) *robust patching*, certifying circuit alignment under continuous patching perturbations; and (3) *minimality*, formalizing and capturing a wide array of various notions of succinctness. Interestingly, we uncover a diverse set of novel theoretical connections among these three families of guarantees, with critical implications for the convergence of our algorithms, establishing a principled foundation for provable circuit discovery.'
    1: Deep models are typically explained either by post-hoc local attributions or by globally constrained interpretable architectures, leaving a gap between faithful but fragmented insights and coarse, oversimplified summaries. We propose Mechanism Dictionaries, a neural–symbolic framework that represents a black-box model as a reusable library of executable mechanisms. A mechanism is a small, human-readable program or constrained neural module—such as a sparse rule set, low-degree polynomial, or monotone subnetwork—whose parameters are instantiated for each input by a gating network. During training, the predictor is regularized to route inputs through a small subset of shared mechanisms, encouraging the same modules to be reused across distant regions of the input space. This yields explanations in the form of concrete programs that locally approximate the model while composing into a global catalogue of behavior. The dictionary supports counterfactual reasoning by editing or swapping mechanisms, and it admits falsifiable explanations because each mechanism makes explicit, testable assumptions about feature interactions. We outline optimization strategies and identifiability conditions under which Mechanism Dictionaries recover sparse, domain-aligned building blocks of complex predictive models.
