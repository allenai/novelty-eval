    0: Advances in model architectures increasingly outpace our understanding of how to construct the training data that makes them succeed. Existing benchmarks primarily measure model performance given a fixed curated dataset, offering little insight into the quality of the data curation process itself. We propose CurateBench, a benchmark suite that shifts the object of study from models to data selection algorithms operating over large noisy data lakes. CurateBench exposes heterogeneous, partially labeled pools spanning multiple modalities and domains, deliberately infused with realistic artifacts such as systematic label bias, near-duplicates, distributional shortcuts, demographic skews, policy-violating samples, and domain-specific rare events. Participants submit curation policies that, under explicit budget and governance constraints, select or weight examples to train a standardized reference model. The benchmark infrastructure then trains this model and reports downstream task performance, robustness under controlled distribution shifts, and compliance-oriented metrics derived from hidden ground-truth annotations. By decoupling data curation from model design, CurateBench enables rigorous, comparable progress on algorithms for dataset pruning, filtering, reweighting, and governance-aware construction at the scale demanded by modern foundation models.
    1: Online services rely on CAPTCHAs as a first line of defense against automated abuse, yet recent advances in multi-modal large language models (MLLMs) have eroded the effectiveness of conventional designs that focus on text recognition or 2D image understanding. To address this challenge, we present **Spatial CAPTCHA**, a novel human-verification framework that leverages fundamental differences in spatial reasoning between humans and MLLMs. Unlike existing CAPTCHAs that rely on low-level perception tasks vulnerable to modern AI, Spatial CAPTCHA generates dynamic questions requiring geometric reasoning, perspective-taking, occlusion handling, and mental rotation—skills intuitive for humans but difficult for current AI systems. The system employs a procedural generation pipeline with constraint-based difficulty control, automated correctness verification, and human-in-the-loop validation to ensure scalability, robustness, and adaptability. We also introduce a corresponding benchmark, **Spatial-CAPTCHA-Bench**, to support systematic assessment of spatial reasoning capabilities in both humans and AI systems.
