  ideas:
    0: 'LLMs hallucinate, yet some confabulations can have social affordances if carefully bounded. We propose critical confabulation (inspired by critical fabulation from literary and social theory), the use of LLM hallucinations to "fill-in-the-gap'''' for omissions in archives due to social and political inequality, and reconstruct divergent yet evidence-bound narratives for history''s ``hidden figures''''. We simulate these gaps with an open-ended narrative cloze task: asking LLMs to generate a masked event in a character-centric timeline sourced from a novel corpus of unpublished texts. We investigate fully-open models and open-weight and proprietary models under a range of prompts designed to elicit controlled and useful hallucinations. Our findings validate LLMs'' foundational narrative understanding capabilities to perform critical confabulation, and show how controlled and well-specified hallucinations can support LLM applications for knowledge production without collapsing speculation into a lack of historical accuracy and fidelity.'
    1: Prevailing alignment techniques rely on a single scalar reward to encode human preferences, implicitly collapsing heterogeneous and contested societal values into one dimension. This obscures trade-offs between safety, fairness, privacy, autonomy, and utility, entangles technical choices with political ones, and makes adaptation to diverse regulatory and cultural contexts ad hoc. We introduce PluriReward, a pluralistic alignment framework that models values as structured, multi-dimensional and context-dependent rather than as a fixed scalar. PluriReward learns a vector-valued reward model over safety, group fairness, privacy preservation, and task utility from preference signals provided by demographically and institutionally diverse annotators, while enforcing differential privacy to protect both individuals and sensitive group attributes. A meta-aggregator conditions on deployment context—such as jurisdictional rules or community norms—to produce a normative trade-off profile that steers generation, and a deliberation-inspired head surfaces an interpretable “value sheet” explaining which dimensions and constraints governed the chosen output. This formulation turns alignment into an explicit, configurable social choice problem, enabling technical systems that remain safe and privacy-preserving while making their fairness and societal value commitments inspectable and reconfigurable by affected stakeholders and regulators.
