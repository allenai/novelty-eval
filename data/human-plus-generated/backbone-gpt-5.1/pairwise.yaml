    0: Recent work shows Tree-Sliced Optimal Transport to be an efficient and more expressive alternative to Sliced Wasserstein (SW), improving downstream performance. Tree-sliced metrics compare probability distributions by projecting measures onto tree metric spaces; a central example is the Tree-Sliced Wasserstein (TSW) distance, which applies the $1$-Wasserstein metric after projection. However, computing tree-based $p$-Wasserstein for general $p$ is costly, largely confining practical use to $p=1$. This restriction is a significant bottleneck, as higher-order metrics ($p > 1$) are preferred in gradient-based learning for their more favorable optimization landscapes. In this work, we revisit Sobolev integral probability metrics (IPM) on trees to obtain a practical generalization of TSW. Building on the insight that a suitably regularized Sobolev IPM admits a closed-form expression, we introduce TS-Sobolev, a tree-sliced metric that aggregates regularized Sobolev IPMs over random tree systems and remains tractable for all $p \ge 1$; for $p>1$, TS-Sobolev has the same computational complexity as TSW at $p=1$. Notably, at $p=1$ it recovers TSW exactly. Consequently, TS-Sobolev serves as a drop-in replacement for TSW in practical applications, with an additional flexibility in changing $p$. Furthermore, we extend this framework to define a corresponding metric for probability measures on hyperspheres.
    1: 'Learning on graphs, meshes, and manifolds typically assumes a fixed discretization of the underlying domain, which entangles the learned model with incidental representation choices and hampers transfer across resolutions, topologies, or sensing geometries. We introduce Functorial Neural Operators (FNOps), a general framework for learning over geometric and topological spaces that enforces categorical consistency between different discretizations. We model each discrete geometry (graph, simplicial or cell complex, point cloud with neighborhood system) as an object in a combinatorial category, with structure-preserving maps (graph homomorphisms, simplicial maps, refinements) as morphisms, and represent signals as cochains. An FNOp is a family of neural networks, one per object, that forms a natural transformation: for every morphism, pushing features through the morphism before or after applying the network yields the same result. We realize this constraint via a library of local, incidence-aware kernels and attention mechanisms that are parameterized only by combinatorial invariants and lifted functorially to any compatible discretization. This design yields architectures that are intrinsically equivariant to refinement, pooling, and domain morphisms, unify message passing on graphs with neural operators on manifolds, and enable principled cross-geometry transfer, multi-resolution learning, and topology-aware out-of-distribution generalization.'
