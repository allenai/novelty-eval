  ideas:
    0: Reasoning over long contexts is essential for large language models. While reinforcement learning (RL) enhances short-context reasoning by inducing "Aha" moments in chain-of-thought, the advanced thinking patterns required for long-context reasoning remain largely unexplored, and high-difficulty RL data are scarce. In this paper, we introduce LoongRL, a data-driven RL method for advanced long-context reasoning. Central to LoongRL is KeyChain, a synthesis approach that transforms short multi-hop QA into high-difficulty long-context tasks by inserting UUID chains that hide the true question among large collections of distracting documents. Solving these tasks requires the model to trace the correct chain step-by-step, identify the true question, retrieve relevant facts and reason over them to answer correctly. RL training on KeyChain data induces an emergent plan–retrieve–reason–recheck reasoning pattern that generalizes far beyond training length, enabling models trained at 16K to effectively solve 128K tasks without prohibitive full-length RL rollout costs.
    1: Frontier language models are currently aligned via monolithic post-training pipelines, which entangle epistemic knowledge with normative behavior and make it difficult to support heterogeneous policies across jurisdictions and applications. We propose Contract-First Generation (CFG), a framework that decomposes aligned language modeling into an explicit governance stage and a constrained realization stage on top of a shared frontier backbone. Given a user query and a machine-readable governance specification, a lightweight “contract model” first predicts a structured contract encoding safety constraints, admissible tools, disclosure requirements, and style preferences. A contract-conditioned decoder then generates the final response from the frozen backbone while enforcing the contract through differentiable constraint projections and low-variance rejection mechanisms. During training, synthetic counterfactual contracts and adversarial prompts are used to jointly shape both the contract space and the realizability of contracts by the backbone, yielding a library of reusable governance profiles that can be composed at inference time. This modularization enables auditable, rapidly updatable, and jurisdiction-specific alignment of frontier models without repeated full-stack post-training or task-specific fine-tuning.
