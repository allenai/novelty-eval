  ideas:
    0: 'Behavior Foundation Models (BFMs) are capable of retrieving high-performing policy for any reward function specified directly at test-time, commonly referred to as zero-shot reinforcement learning (RL). While this is a very efficient process in terms of compute, it can be less so in terms of data: as a standard assumption, BFMs require computing rewards over a non-negligible inference dataset, assuming either access to a functional form of rewards, or significant labeling efforts. To alleviate these limitations, we tackle the problem of task inference purely through interaction with the environment at test-time. We propose OpTI-BFM, an optimistic decision criterion that directly models uncertainty over reward functions and guides BFMs in data collection for task inference. Formally, we provide a regret bound for well-trained BFMs through a direct connection to upper-confidence algorithms for linear bandits.'
    1: 'High-dimensional reinforcement learning problems often exhibit latent structure: subsets of state variables and actions interact tightly with each other but only weakly with the rest of the system. Exploiting such factorization could yield dramatic gains in sample efficiency and transfer, yet most deep RL algorithms treat the policy as a monolithic black box. We introduce Structural Policy Factorization (SPF), a framework that allows an agent to autonomously discover and exploit latent modularity in continuous-control Markov decision processes. SPF alternates between policy optimization and structure learning: from batches of trajectories, it estimates a directed dependency graph between state and action components by analyzing gradients of the value function and conditional mutual information. This graph induces a decomposition of the global policy into a set of low-dimensional sub-policies, each acting on a subset of actuators and local observations, coupled through a learned coordination channel. Sub-policies are trained with local advantage estimators while the coordination channel is trained to predict and reconcile cross-module influences. By iteratively refining both the factorization and the policies, SPF seeks to uncover reusable control primitives and improve scalability, zero-shot recombination, and robustness to changes in system morphology.'
