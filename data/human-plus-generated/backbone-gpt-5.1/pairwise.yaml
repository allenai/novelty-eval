    0: 'In this paper, we identify that the key criterion for determining whether a model is truly capable of novel view synthesis (NVS) is transferability: Whether any pose representation extracted from one video sequence can be used to re-render the same camera trajectory in another. We analyze prior work on self-supervised NVS and find that their predicted poses do not transfer: The same set of poses lead to different camera trajectories in different 3D scenes. Here, we present XFactor, the first geometry-free self-supervised model capable of true NVS. XFactor combines pair-wise pose estimation with a simple augmentation scheme of the inputs and outputs that jointly enables disentangling camera pose from scene content and facilitates geometric reasoning. Remarkably, XFactor achieves transferability with unconstrained latent pose variables, without any 3D inductive biases or concepts from multi-view geometry — such as an explicit parameterization of poses as elements of SE(3). We introduce a new metric to quantify transferability.'
    1: 'Many seemingly unrelated problems in vision, audio, language, and other modalities share a common structure: they can be solved by composing a small set of primitive operations such as grouping, filtering, counting, and describing. We propose UniOps, a modality-neutral operator library for cross-modal task composition. UniOps first maps raw inputs from arbitrary encoders (e.g., image, waveform, text, or sensor streams) into a shared object-centric token space using contrastive, cross-modal reconstruction, and temporal consistency objectives. On top of this space, we learn a compact set of parameterized operators that are trained jointly across modalities to implement abstract behaviors like partitioning, attention-based selection, set aggregation, and structured description. A lightweight controller, conditioned on natural-language task specifications or exemplars, composes these operators into differentiable programs that can act within or across modalities. This design enables a single model to instantiate tasks such as image segmentation, audio source separation, and text summarization using the same underlying computational primitives, facilitating transfer to new tasks and modalities with minimal additional supervision.'
