    0: The Maximum Common Edge Subgraph (MCES) problem is a crucial challenge with significant implications in domains such as biology and chemistry. Traditional approaches, which include transformations into max-clique and search-based algorithms, suffer from scalability issues when dealing with larger instances. This paper introduces ``Neural Graduated Assignment'' (NGA), a simple, scalable, unsupervised-training-based method that addresses these limitations. Central to NGA is stacking of differentiable assignment optimization with neural components, enabling high-dimensional parameterization of the matching process through a learnable temperature mechanism. We further theoretically analyze the learning dynamics of NGA, showing its design leads to fast convergence, better exploration-exploitation tradeoff, and ability to escape local optima. The introduction of NGA marks a significant advancement in the computation of MCES and offers insights into other assignment problems.
    1: Learning on graphs, manifolds, and cell complexes is typically tied to a particular discretization, hindering transfer across resolutions, remeshings, or topology-preserving rewiring. We propose Functorial Geometric Networks (FGNs), a framework that treats geometric learning as a functor from finite cell complexes to representation spaces, and constrains neural layers to be natural transformations that commute with cellular maps. Concretely, we represent signals as cochains over a graded cell complex and parameterize message passing in terms of boundary and coboundary operators, while enforcing consistency under elementary refinements and collapses sampled during training. This functoriality induces invariance to homotopy-preserving changes of the underlying graph or mesh, and enables a single model to consume heterogeneous discretizations of the same domain, from point-cloud-derived graphs to high-order finite-element meshes. FGNs unify and generalize graph neural networks, simplicial and cellular networks within a topology-aware operator learning perspective, and open a path towards discretization-robust models for physical simulation, scientific computing, and relational reasoning.
