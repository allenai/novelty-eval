    0: Robust 3D hand reconstruction is challenging in egocentric vision due to depth ambiguity, self-occlusion, and complex hand-object interactions. Prior works attempt to mitigate the challenges by scaling up training data or incorporating auxiliary cues, often falling short of effectively handling unseen contexts. In this paper, we introduce EgoHandICL, the first in-context learning (ICL) framework for 3D hand reconstruction that achieves strong semantic alignment, visual consistency, and robustness under challenging egocentric conditions. Specifically, we develop (i) complementary exemplar retrieval strategies guided by vision–language models (VLMs), (ii) an ICL-tailored tokenizer that integrates multimodal context, and (iii) a Masked Autoencoders (MAE)-based architecture trained with 3D hand–guided geometric and perceptual objectives. We further show EgoHandICL's applicability by testing it on real-world egocentric cases and integrating it with EgoVLMs to enhance their hand–object interaction reasoning.
    1: We propose an event-centric foundation model that unifies vision, audio, language, and additional sensor modalities through a shared sequence of discrete latent events. Rather than directly aligning raw modality streams, our framework represents complex scenes as temporally ordered “event tokens” that are modality-agnostic and compositional, while modality-specific encoders and decoders map between events and images, waveforms, text, or other signals. The model is trained with self-supervised objectives that require any subset of modalities to infer the underlying event sequence and reconstruct the remaining modalities, enforcing cross-modal consistency, temporal coherence, and robustness to asynchrony and missing data. This event abstraction supports flexible multimodal applications, including cross-modal generation (e.g., sounding an image or visualizing audio), joint editing of video, soundtrack, and narration from high-level language instructions, and integration of new modalities via lightweight adapters into the shared event space. By decoupling world dynamics from modality realization, the approach aims to provide a scalable substrate for general-purpose multimodal perception and controllable generation across vision, audio, language, and beyond.
