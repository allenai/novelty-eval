    0: 'We present the first comprehensive evaluation of AI agents against human cybersecurity professionals in a live enterprise environment. We evaluate ten cybersecurity professionals alongside six existing AI agents and ARTEMIS, our new agent scaffold, on a large university network consisting of $\sim$8,000 hosts across 12 subnets. ARTEMIS is a multi-agent framework featuring dynamic prompt generation, arbitrary sub-agents, and automatic vulnerability triaging. AI agents offer advantages in systematic enumeration, parallel exploitation, and cost---certain ARTEMIS variants cost $18/hour versus $60/hour for professional penetration testers. We also identify key capability gaps: AI agents exhibit higher false-positive rates and struggle with GUI-based tasks.'
    1: Modern foundation models are deployed into environments where alignment, fairness, safety, privacy, and broader societal norms must be satisfied simultaneously, yet these desiderata are typically encoded as loosely specified, siloed objectives. We propose Normative Program Lattices (NPL), a framework that turns heterogeneous normative inputs—legal and policy texts, organizational guidelines, and stakeholder feedback—into machine-interpretable constraints that directly shape model behavior. NPL introduces a normative constraint language for specifying conditions on model inputs, outputs, and latent attributes, encompassing fairness (e.g., non-discrimination across groups), safety (e.g., bounded harmful content risk), and privacy (e.g., limits on individual leakage) within a single formalism. These specifications are compiled into differentiable violation functions and integrated into learning and inference through constrained optimization, enabling explicit control over trade-offs between utility and societal constraints. The lattice structure orders constraint sets by strictness, supporting robust optimization under normative uncertainty, context-dependent policy switching, and transparent exploration of “normative frontiers.” NPL thereby offers a unified, auditable substrate for building AI systems whose behavior is governed by an explicit, evolving societal contract.
