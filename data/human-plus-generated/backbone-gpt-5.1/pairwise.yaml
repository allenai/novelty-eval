    0: Deep research has revolutionized data analysis, yet data scientists still devote substantial time to manually crafting visualizations, highlighting the need for robust automation from natural language queries. However, current systems struggle with complex datasets containing multiple files and iterative refinement. Existing approaches, including simple single- or multi-agent systems, often oversimplify the task, focusing on initial query parsing while failing to robustly manage data complexity, code errors, or final visualization quality. In this paper, we reframe this challenge as a collaborative multi-agent problem. We introduce CoDA, a multi-agent system that employs specialized LLM agents for metadata analysis, task planning, code generation, and self-reflection. We formalize this pipeline, demonstrating how metadata-focused analysis bypasses token limits and quality-driven refinement ensures robustness. This work demonstrates that the future of visualization automation lies not in isolated code generation but in integrated, collaborative agentic workflows.
    1: Frontier foundation models centralize both competence and control in a single, opaque parameterization, making it difficult to adapt behavior to heterogeneous norms, policies, and user preferences without costly retraining. We propose Governance Programs for Frontier Models (GovFMs), a modular control layer that decouples governance from generation. GovFMs treat the base model as a frozen semantic engine and learn small neural controllers that read intermediate activations and metadata to decide, at each decoding step, whether to continue, revise, veto, branch, invoke tools, or query external memory. Each controller is specified in a constrained policy language that compiles to a differentiable module, enabling both gradient-based training on logged human feedback and symbolic inspection of high-level rules. Multiple governance programs can be composed at inference time to encode jurisdictional regulations, organizational policies, or user-level constraints while sharing a single frontier backbone. This architecture reframes alignment as programmable control over a powerful but neutral generator, enabling auditable, rapidly updatable behavior without modifying frontier-scale weights.
