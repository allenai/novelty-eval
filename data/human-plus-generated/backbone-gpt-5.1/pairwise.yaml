    0: 'One central challenge in Neural Combinatorial Optimization (NCO) is handling hard constraints efficiently. Beyond the two classic paradigms, i.e., Local Construction (LC), which sequentially builds feasible solutions but scales poorly, and Global Prediction (GP), which produces one-shot heatmaps yet struggles with constraint conflicts, the recently proposed Adaptive Expansion (AE) shares the advantages of both by progressively growing partial solutions with instance-wise global awareness. However, existing realizations bolt AE onto external GP predictors, so their solution quality is bounded by the backbone and their inference cost scales with repeated global calls. In this paper, we fundamentally rethink adaptive expansion and make it native to a generative model, acting as its intrinsic decoding principle rather than an external wrapper. We propose NEXCO, a CO-specific masked diffusion framework that turns adaptive expansion into the model''s own iterative unmasking process. Specifically, it involves a solution-expansion training procedure with a time-agnostic GNN denoiser, which learns diffusion trajectories between fully masked solutions and ground-truth solutions. With the trained time-agnostic denoiser, we introduce a novel solution expansion scheme at the solving stage, enabling adaptive control over the intermediate solution states. It is achieved by constructing candidate sets according to confidence scores and applying feasibility projection to expand the solution while respecting constraints. In this way, "adaptive" is not an afterthought but the decoding itself: intermediate diffusion states are meaningful partial solutions and progress is instance-adaptive rather than schedule-bound.'
    1: Geometric deep learning has produced powerful yet siloed architectures for graphs, manifolds, and higher-order complexes, limiting compositionality across heterogeneous topological domains. We introduce Neural Diagram Functors, a categorical framework that treats the domain geometry itself as an input to the model. A dataset is specified by a small incidence category whose objects represent cells or charts and whose morphisms encode adjacency, incidence, or restriction relations; features form a functor from this category to a representation space. Neural Diagram Functors are parameterized endofunctors on this functor category, constructed from a finite set of local neural modules composed via categorical limits and colimits. This yields layers that are intrinsically invariant or equivariant to automorphisms of the underlying topology, while remaining agnostic to whether the domain is a graph, simplicial or cellular complex, or manifold atlas. Classical message passing GNNs, simplicial and cellular networks, and atlas-based geometric CNNs all arise as special cases of our formulation. Moreover, functoriality provides a principled way to transport representations across topology changes such as refinement, coarsening, or gluing of components, enabling a single model to operate coherently on families of related geometries.
