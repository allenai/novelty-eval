    0: Open-ended segmentation requires models capable of generating free-form descriptions of previously unseen concepts and regions. Despite advancements in model development, current evaluation protocols for open-ended segmentation tasks fail to capture the true semantic accuracy of the generated descriptions. We empirically demonstrate that embedding‐based similarity score mappings diverge significantly from human judgments. To address this issue, we introduce a novel mapping function that considers multiple lexical relationships between free‐form outputs and test‐vocabulary labels, yielding much closer alignment with human annotations. We integrate this mapping into a robust evaluation framework. Additionally, we present the first Multi-modal Large‐Language Model trained with a contrastive objective to jointly align visual regions and textual descriptions for open‐ended panoptic segmentation.
    1: Benchmarks in machine learning are predominantly static, leading to rapid saturation, overfitting to idiosyncratic test sets, and weak predictive power for deployment-time behavior. This work introduces EvoBench, a framework that recasts benchmark construction as a constrained game between data generators and a pool of target models. Starting from a seed corpus and a user-specified capability schema, EvoBench trains a generative curator to propose candidate test instances that jointly maximize model disagreement, estimated error, and coverage over capability dimensions, while satisfying safety and fairness constraints enforced by automated filters and lightweight human review. Accepted instances are versioned into benchmark “waves” annotated with difficulty estimates, capability tags, and model response distributions, enabling longitudinal analysis of progress and failure modes. EvoBench provides a declarative specification language to instantiate domain-specific benchmarks (e.g., for language, vision, or multimodal tasks) from the same core machinery, as well as reporting protocols that reconcile evolving test sets with the need for stable, comparable scores. This transforms benchmarks from fixed datasets into reproducible, open-ended evaluation processes.
