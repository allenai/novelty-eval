    0: Benchmark datasets underpin empirical progress in machine learning, yet their design remains largely manual, static, and decoupled from the evolving population of models they are used to assess. As a result, widely adopted test sets rapidly saturate, fail to distinguish among strong systems, and incentivize narrow overfitting. We propose EvoBench, a framework that treats benchmark construction as a model-aware, multi-objective optimization problem over a generative space of candidate evaluation items. EvoBench interacts with a population of target models and a domain-specific generator to iteratively synthesize and select items that maximize ranking discriminativeness, coverage of diverse capabilities, and longitudinal stability, while enforcing constraints on safety, content balance, and annotation cost. The framework formalizes notions such as benchmark hardness, redundancy, and leakage risk as explicit objectives, enabling automatic curation of compact yet informative test suites. By continuously updating the item set in response to new models, EvoBench yields dynamic benchmarks that co-evolve with the state of the art rather than ossifying it. We describe instantiations for text and vision tasks and discuss how EvoBench can serve as a general substrate for responsible, adaptive evaluation in rapidly advancing model ecosystems.
    1: Morphological traits are physical characteristics of biological organisms that provide vital clues on how organisms interact with their environment. Yet extracting these traits remains a slow, expert-driven process, limiting their use in large-scale ecological studies. A major bottleneck is the absence of high-quality datasets linking biological images to trait-level annotations. In this work, we demonstrate that sparse autoencoders trained on foundation-model features yield monosemantic, spatially grounded neurons that consistently activate on meaningful morphological parts. Leveraging this property, we introduce a trait annotation pipeline that localizes salient regions and uses vision-language prompting to generate interpretable trait descriptions. Using this approach, we construct Bioscan-Traits, a dataset of 80K trait annotations spanning 19K insect images from BIOSCAN-5M. By annotating traits with a modular pipeline rather than prohibitively expensive manual efforts, we offer a scalable way to inject biologically meaningful supervision into foundation models, enable large-scale morphological analyses, and bridge the gap between ecological relevance and machine-learning practicality.
