    0: Randomized Controlled Trials are one of the pillars of science; nevertheless, they rely on hand-crafted hypotheses and expensive analysis. Such constraints prevent causal effect estimation at scale, potentially anchoring on popular yet incomplete hypotheses. We propose to discover the unknown effects of a treatment directly from data. For this, we turn unstructured data from a trial into meaningful representations via pretrained foundation models and interpret them via a Sparse Auto Encoder. However, discovering significant causal effects at the neural level is not trivial due to multiple-testing issues and effects entanglement. To address these challenges, we introduce _Neural Effect Search_, a novel recursive procedure solving both issues by progressive stratification. We showcase, in the context of experimental ecology, the first successful unsupervised causal effect identification on a real-world scientific trial.
    1: 'Explanations of machine learning models must be simultaneously faithful to internal mechanisms and understandable to diverse stakeholders, yet most interpretability methods fix the space of explanations a priori and ignore user-specific abstractions. We propose a framework that treats explanation as a communication problem between a model and a human, formalizing it as a constrained information bottleneck from internal representations to user concepts. The method first learns a bank of sparse, intervention-ready latent concepts aligned with model activations. It then infers a probabilistic user model that captures which concepts, relations, and levels of abstraction are familiar and cognitively inexpensive for a given stakeholder, using lightweight interactive probes such as concept similarity judgements and preference over example explanations. Explanations are synthesized by solving a constrained optimization problem: select a minimal set of concept-level interventions that approximate the model’s prediction behavior while maximizing mutual information with the inferred user model under a communication budget. This yields adaptive, role-specific explanations that are explicitly grounded in causal influence within the network yet expressed at user-appropriate abstraction layers, enabling personalized auditing, debugging, and decision support in high-stakes domains.'
