    0: 'Adversarial Training (AT) is a known, powerful, well-established technique for improving classifier robustness to input perturbations, yet its applicability beyond discriminative settings remains limited. Motivated by the widespread use of score-based generative models and their need to operate robustly under substantial noisy or corrupted input data, we propose an adaptation of AT for these models.

      We introduce a principled formulation of AT for Diffusion Models (DMs) that replaces the conventional *invariance* objective with an *equivariance* constraint aligned to the denoising dynamics of score matching. Our method integrates seamlessly into diffusion training by adding either random perturbations--similar to randomized smoothing--or adversarial ones--akin to AT.

      Our approach offers several advantages: **(a)** tolerance to heavy noise and corruption, **(b)** reduced memorization, **(c)** robustness to outliers and extreme data variability and **(d)** resilience to iterative adversarial attacks.'
    1: CivicAlign is a framework for aligning foundation models to pluralistic societal preferences under explicit fairness, safety, and privacy guarantees. Instead of optimizing a single opaque reward derived from homogeneous annotators, CivicAlign models alignment as a multi-objective social choice problem over groups with distinct normative profiles. Group-conditioned preference models are learned under differential privacy, protecting individuals’ sensitive judgments while enabling robust estimation of group-level utilities. A constrained policy optimization procedure then searches for model behaviors that approximate a chosen social welfare functional, subject to formal safety constraints (e.g., harm thresholds) and group fairness requirements on satisfaction and influence. CivicAlign exposes these trade-offs as transparent “societal dials” that regulators, communities, and developers can inspect and adjust, making explicit how changes affect different groups and safety margins. The framework supports continual re-alignment as societal norms evolve, while preserving privacy and previously agreed safeguards, and offers a principled bridge between technical alignment, algorithmic fairness, privacy protection, and democratic governance of large models.
