  ideas:
    0: "The Private Aggregation of Teacher Ensembles (PATE) framework enables privacy-preserving machine learning by aggregating responses from disjoint subsets of sensitive data. Adaptations of PATE to tasks with inherent output diversity such as text generation, where the desired output is a sample from a distribution, face a core tension: \nas diversity increases, samples from different teachers are less likely to agree, but lower agreement results in reduced utility for the same privacy requirements. Yet suppressing diversity to artificially increase agreement is undesirable, as it distorts the output of the underlying model, and thus reduces output quality.\n\nWe propose Hot PATE, a variant of PATE designed for diverse generative settings. \nWe formalize the notion of a *diversity-preserving* *ensemble sampler* and introduce an efficient sampler that provably transfers diversity without incurring additional privacy cost.\nHot PATE requires only API access to proprietary models and can be used as a drop-in replacement for existing *Cold* PATE samplers."
    1: Current alignment approaches for large models collapse heterogeneous societal desiderata—safety, fairness, privacy, and broader normative constraints—into a single scalar reward, obscuring trade-offs and limiting transparency, controllability, and auditability. We propose Normative Value Vectors, a framework that makes societal objectives first-class citizens in both modeling and optimization. Instead of a monolithic reward, we learn a vector-valued normative model in which each component corresponds to a distinct dimension such as harm avoidance, epistemic reliability, group fairness, privacy risk, and deference to user agency. This model is trained from heterogeneous supervision that combines human feedback, derived labels from formal criteria, and weak signals mined from policy documents and incident reports. We then formulate alignment as constrained multi-objective reinforcement learning, treating some dimensions as hard constraints (e.g., safety, privacy) and others as soft objectives whose trade-offs define a Pareto frontier of behaviors. An inference-time governance layer selects operating points on this frontier based on context, stakeholder profiles, or jurisdictional requirements, enabling explicit, configurable societal alignment. The framework unifies alignment, fairness, safety, and privacy into a single optimization and control pipeline, and supports principled auditing by exposing, rather than hiding, the structure of normative trade-offs.
