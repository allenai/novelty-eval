    0: Foundation models are increasingly deployed in settings where alignment, fairness, safety, and privacy are deeply entangled and contested, yet existing approaches typically hard-code a single normative objective drawn from narrow annotator pools. We propose CivicAlign, a framework that treats alignment as a pluralistic social choice problem over heterogeneous stakeholder constitutions. CivicAlign decomposes normative supervision into a set of interpretable heads capturing safety, distributive and representational fairness, privacy, autonomy, and other societal desiderata. A learnable societal aggregator network maps deployment context and privacy-preserving stakeholder embeddings into a distribution over these heads, defining a context-dependent alignment profile. A lightweight control layer, trained with constrained multi-objective reinforcement learning from human and group feedback, steers a frozen base model so its behavior lies near a Pareto-efficient frontier subject to hard safety and privacy constraints. Differentially private optimization protects contributors to the alignment process, while fairness regularizers act directly on the aggregation mechanism to mitigate dominance of majority groups. CivicAlign yields configurable, auditable alignment policies that expose explicit trade-offs and enable participatory governance of model behavior across communities and jurisdictions.
    1: Recently, OpenAI (2025) showed that training against a chain of thought (CoT) monitor can cause obfuscated CoTs, which contain bad behavior the monitor cannot detect. They proposed to keep CoTs monitorable by training only against output monitors that do not have access to CoT. We show that such training can still cause obfuscated CoTs via two mechanisms. First, when a model is trained to produce a safe-looking output, that model may generalize to making its CoTs look safe. Second, since later tokens are conditioned on earlier ones, safe‑looking CoTs may increase the likelihood of safe outputs, causing safe-looking CoTs to be reinforced. We introduce two mitigations to address these two issues. To our knowledge, we are the first to identify and mitigate these problems. Our work implies that preserving CoT monitorability is more difficult than previously thought; we suggest practical guidelines for AI developers to maintain monitorable CoTs.
