  ideas:
    0: Contemporary explainability methods either attribute predictions to input features, probe loosely aligned internal concepts, or intervene on hidden activations, but they rarely connect these strands into faithful, user-level causal stories. We propose Causal Concept Editing, a framework that defines explanations as minimal sets of semantically grounded internal concepts whose targeted modification would change a model’s prediction. Our approach first constructs a library of human-interpretable concepts as directions or subcircuits in intermediate representations, leveraging weak supervision and multimodal alignment. We then learn a sparse structural model that approximates how these concepts jointly influence downstream logits via interventional probes on hidden states. Given an input and a desired counterfactual outcome, explanations are computed by solving a constrained optimization problem over this causal concept graph to identify the smallest intervention set that flips the prediction while keeping unrelated mechanisms fixed. This yields executable, counterfactual explanations such as “if the ‘threatening posture’ and ‘low lighting’ concepts were suppressed, the model would label this scene as safe,” tightly coupling natural language rationales to verifiable internal edits across vision and language models.
    1: Finetuning (pretrained) language models is a standard approach for updating their internal parametric knowledge and specializing them to new tasks and domains. However, the corresponding model weight changes ("weight diffs") are not generally interpretable. While inspecting the finetuning dataset can give a sense of how the model might have changed, these datasets are often not publicly available or are too large to work with directly. Towards the goal of broadly understanding model weight changes in natural language, we introduce Diff Interpretation Tuning (DIT), a method that trains models to describe their own finetuning-induced modifications. Our approach uses synthetic, labeled weight diffs to train an introspection adapter, which can be applied to a compatible finetuned model to make it self-describe the weight changes. We consider two proof-of-concept settings—reporting hidden behaviors and summarizing finetuned knowledge—in which models describe their finetuning-induced modifications using concise natural language descriptions.
