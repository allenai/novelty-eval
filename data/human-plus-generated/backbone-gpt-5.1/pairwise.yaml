    0: Camera-centric understanding and generation are two cornerstones of spatial intelligence, yet they are typically studied in isolation. We present Puffin, a unified camera-centric multimodal model that extends spatial awareness along the camera dimension. Puffin integrates language regression and diffusion-based generation to interpret and create scenes from arbitrary viewpoints. To bridge the modality gap between cameras and vision-language, we introduce a novel paradigm that treats camera as language, enabling thinking with camera. This guides the model to align spatially grounded visual cues with photographic terminology while reasoning across geometric context. Puffin is trained on Puffin-4M, a large-scale dataset of 4 million vision-language-camera triplets. We incorporate both global camera parameters and pixel-wise camera maps, yielding flexible and reliable spatial generation. With instruction tuning, Puffin generalizes to diverse cross-view tasks such as spatial imagination, world exploration, and photography guidance. We will release the code, models, dataset pipeline, and benchmark to advance multimodal spatial intelligence research.
    1: Multimodal foundation models have achieved strong performance on pairwise alignments such as image–text and audio–text, yet they largely treat each modality as an independent token stream and do not explicitly represent higher-level events that span space, time, and sensory channels. We introduce EventWeave, a unified event-centric architecture that learns discrete, persistent event slots and their relational structure from raw, weakly synchronized streams of vision, audio, language, and additional modalities. Modality-specific encoders project inputs into a shared latent space, where a differentiable slot-attention mechanism induces event tokens that aggregate evidence across time and modalities. A graph neural layer then connects these tokens into an evolving event graph, with edges modeling temporal, causal, and coreferential relations. Decoders for each modality reconstruct observations from this graph and enable conditional generation given arbitrary subsets of modalities. Self-supervised objectives over reconstruction, cross-modal prediction, and future event forecasting train the system without manual labels. The resulting event graphs serve as a modality-agnostic substrate for tasks spanning cross-modal retrieval, long-horizon question answering, narrative generation, and planning from heterogeneous sensor streams.
