    0: Foundation models are increasingly deployed across cultures, institutions, and regulatory regimes, yet dominant alignment practice collapses heterogeneous human values into a single global reward, entangling alignment with unfair norm imposition, privacy risks in feedback collection, and opaque societal trade-offs. We propose plurality-aware alignment via latent norm bundles, a framework that represents normative variation as a structured distribution over reward functions rather than a single scalar objective. Our method jointly learns (i) a shared “rights and safety” backbone specifying globally non-negotiable constraints, and (ii) a set of latent norm bundles that capture community-specific preferences inferred from differentially private human feedback, behavioral logs, and policy texts. A multi-objective optimization procedure enforces coverage and calibration fairness across demographic groups while preventing any bundle from violating the backbone constraints. At inference time, models condition on an explicit normative context, navigate the Pareto surface of feasible behaviors, and surface interpretable trade-off explanations to users and regulators. This formulation opens a path toward alignment schemes that are simultaneously safety-preserving, privacy-respecting, and normatively pluralistic, and that make the societal structure of model behavior explicit rather than implicitly baked into a single, uninspectable reward.
    1: 'Reward models (RMs) play a critical role in aligning AI behaviors with human preferences, yet they face two fundamental challenges: (1) Modality Imbalance, where most RMs are mainly focused on text and image modalities, offering limited support for video, audio, and other modalities; and (2) Preference Rigidity, where training on fixed binary preference pairs fails to capture the complexity and diversity of personalized preferences. To address the above challenges, we propose Omni-Reward, a step toward generalist omni-modal reward modeling with support for free-form preferences, consisting of: (1) Evaluation: We introduce Omni-RewardBench, the first omni-modal RM benchmark with free-form preferences, covering nine tasks across five modalities including text, image, video, audio, and 3D; (2) Data: We construct Omni-RewardData, a multimodal preference dataset comprising 248K general preference pairs and 69K instruction-tuning pairs for training generalist omni-modal RMs; (3) Model: We propose Omni-RewardModel, which includes both discriminative and generative RMs.'
