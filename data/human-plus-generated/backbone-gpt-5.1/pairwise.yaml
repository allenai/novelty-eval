  ideas:
    0: This paper focuses on Geodesic Principal Component Analysis (GPCA) on a collection of probability distributions using the Otto-Wasserstein geometry. The goal is to identify geodesic curves in the space of probability measures that best capture the modes of variation of the underlying dataset. We first address the case of a collection of Gaussian distributions, and show how to lift the computations in the space of invertible linear maps. For the more general setting of absolutely continuous probability measures, we leverage a novel approach to parameterizing geodesics in Wasserstein space with neural networks.
    1: 'Representation learning methods are usually designed separately for unsupervised, self-supervised, semi-supervised, and fully supervised settings, leading to disjoint objectives and brittle heuristics when the label budget or task changes. We propose Homotopy Supervision, a framework that treats supervision strength as a continuous control variable and learns representations by following a learned path of objectives from purely self-supervised to fully supervised training. Concretely, we define a small basis of self-supervised and supervised losses and parameterize a homotopy L(t) that mixes them as a function of a scalar \(t \in [0,1]\). During training, both the encoder and the homotopy are optimized: the encoder is updated on losses sampled at different t, while an outer loop adapts the homotopy so that intermediate representations support simple predictors on a held-out labeled subset. This bi-level scheme explicitly optimizes for robustness across label regimes, enabling a single model to serve unsupervised, semi-supervised, and supervised usage without separate pretraining and fine-tuning pipelines, and yielding a principled curriculum over supervision signals. At inference time, the homotopy index acts as a knob that trades off invariance and discriminativeness, allowing task-adaptive representations.'
