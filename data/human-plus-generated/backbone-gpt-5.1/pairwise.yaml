    0: "Score matching has become a central training objective in modern generative modeling, particularly in diffusion models, where it is used to learn high-dimensional data distributions through the estimation of score functions. Despite its empirical success, the theoretical understanding of the optimization behavior of score matching, particularly in over-parameterized regimes, remains limited.\n  In this work, we study gradient descent for training over-parameterized models to learn a single Gaussian distribution. Specifically, we use a student model with $n$ learnable parameters, motivated by the structure of a Gaussian mixture model, and train it on data generated from a single ground-truth Gaussian using the population score matching objective.\n  We analyze the optimization dynamics under multiple regimes. When the noise scale is sufficiently large, we prove a global convergence result for gradient descent, which resembles the known behavior of gradient EM in over-parameterized settings.\n  In the low-noise regime, we identify the existence of a stationary point, highlighting the difficulty of proving global convergence in this case. \n  Nevertheless, we show convergence under certain initialization conditions: when the parameters are initialized to be exponentially small, gradient descent ensures convergence of all parameters to the ground truth. \n  We further give an example where, without the exponentially small initialization, the parameters may not converge to the ground truth.\n  Finally, we consider the case of random initialization, where parameters are sampled from a Gaussian distribution far from the ground truth. We prove that, with high probability, only one parameter converges while the others diverge to infinity, yet the loss still converges to zero with a $1/\\tau$ rate, where $\\tau$ is the number of iterations. We also establish a nearly matching lower bound on the convergence rate in this regime.\n  This is the first work to establish global convergence guarantees for Gaussian mixtures with at least three components under the score matching framework."
    1: Bilevel optimization underpins hyperparameter tuning, meta-learning, and data reweighting, yet remains constrained by the need to repeatedly solve and differentiate through expensive inner optimization problems. We propose a generative perspective on bilevel optimization that replaces explicit inner-loop training with an amortized, differentiable surrogate of optimization trajectories. Our approach learns a conditional diffusion model that maps problem descriptors and hyperparameters to full parameter trajectories, with its terminal state approximating an inner-level optimum. The diffusion process serves as a flexible parameterization of optimization dynamics, enabling the model to represent multi-stage behaviors such as rapid descent, curvature adaptation, and late-stage stabilization. By matching generated trajectories to real optimization paths and regularizing terminal states toward first-order stationarity, the surrogate becomes a drop-in replacement for the inner solver. Outer-level objectives and hypergradients are then computed by a single forward–backward pass through the generative model, eliminating unrolled optimization and large linear solves. This framework opens a path toward scalable bilevel optimization with long horizons, complex architectures, and rich structural priors on optimization dynamics.
