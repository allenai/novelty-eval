  ideas:
    0: Neuroscience and cognitive science increasingly rely on deep models to decode stimuli and tasks from brain activity, yet existing approaches hard-code feature spaces tied to specific paradigms and lack a shared, interpretable representation of cognition. We introduce language-anchored neural process maps, a framework that aligns whole-brain activity with natural language descriptions of tasks, stimuli, and internal cognitive states. Our method learns a bidirectional interface between a large language model’s embedding space and distributed neural patterns recorded during diverse, naturalistic experiments, treating textual prompts as hypotheses about latent mental processes. This alignment enables zero-shot prediction of brain activity for novel task instructions, generative “neural rendering” of hypothesized cognitive states specified in language, and neurally grounded paraphrases that translate observed brain activity into structured verbal reports. By casting cognitive constructs as points and trajectories in a shared neural–linguistic manifold, the framework offers a new experimental tool for formalizing theories of attention, memory, and control, and for designing language-guided perturbation studies that target specific cognitive operations.
    1: 'Enabling natural communication through brain–computer interfaces (BCIs) remains one of the most profound challenges in neuroscience and neurotechnology. While existing frameworks offer partial solutions, they are constrained by oversimplified semantic representations and a lack of interpretability. To overcome these limitations, we introduce **Semantic Intent Decoding (SID)**, a novel framework that translates neural activity into natural language by modeling meaning as a flexible set of compositional semantic units.

      SID is built on three core principles: semantic compositionality, continuity and expandability of semantic space, and fidelity in reconstruction.

      We present **BrainMosaic**, a deep learning architecture implementing SID. BrainMosaic decodes multiple semantic units from EEG/SEEG signals using set matching and then reconstructs coherent sentences through semantic-guided reconstruction.

      This approach moves beyond traditional pipelines that rely on fixed-class classification or unconstrained generation, enabling a more interpretable and expressive communication paradigm, paving the way for natural and effective BCI-mediated communication.'
