    0: Foundation models are now evaluated predominantly on static benchmarks whose examples and distributions are frozen at release time, despite rapid evolution of both model training data and the real world. This mismatch leads to benchmark overfitting, unclear training–test separation, and difficulty comparing model generations. We introduce EverBench, a living benchmark and data-collection protocol for temporally grounded, contamination-aware evaluation of large models. EverBench organizes tasks into time-stamped “slices” acquired strictly after a declared training cutoff, spanning text understanding, code generation, multimodal reasoning, and real-world knowledge update scenarios. Each example carries a machine-readable provenance record and is passed through a transparent deduplication and overlap-analysis pipeline against public corpora, enabling explicit audits of potential contamination. Versioned releases of new slices support longitudinal evaluation across model vintages, allowing researchers to study temporal generalization, benchmark aging, and robustness to real-world distribution shift. By shifting focus from static datasets to an explicit, repeatable evaluation protocol, EverBench aims to make progress claims about foundation models more reliable, comparable, and temporally well-specified.
    1: Recent advancements in multimodal slow-thinking systems have demonstrated remarkable performance across various visual reasoning tasks. However, their capabilities in text-rich image reasoning tasks remain understudied due to the absence of a dedicated and systematic benchmark. To address this gap, we propose OCR-Reasoning, a novel benchmark designed to systematically assess Multimodal Large Language Models on text-rich image reasoning tasks. Specifically, OCR-Reasoning comprises 1,069 human-annotated examples spanning 6 core reasoning abilities and 18 practical reasoning tasks in text-rich visual scenarios. Unlike existing text-rich image understanding benchmarks that only provide a final answer, this benchmark additionally provides a detailed step-by-step reasoning process. This dual annotation enables the evaluation of both the models' final answers and their reasoning processes, thereby offering a holistic assessment of text-rich reasoning capabilities.
