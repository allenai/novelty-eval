    1: 'Modern generative models excel at imitating a fixed training distribution, yet real applications demand fast adaptation to evolving, structured constraints: safety rules, domain laws, user preferences, and task specifications. Current solutions—prompt engineering, rejection sampling, external classifiers, or fine-tuning—offer limited compositionality and require architecture-specific design. We propose Constraint-Compiled Generative Modeling (CCGM), a unified framework that transforms high-level constraints into lightweight guidance modules for frozen generators. Constraints are expressed in a mixed symbolic–differentiable language encompassing logical predicates, simulators, and soft semantic scores. A meta-learning “compiler” observes unconstrained samples, evaluates constraint satisfaction, and learns to produce guidance fields that perturb latent variables or score estimates so as to maximize constraint satisfaction while minimally deviating from the base distribution. The compiler is architecture-agnostic, wrapping diffusion, autoregressive, or energy-based generators via a common interface. We formulate CCGM as a constrained minimum-divergence problem and derive training objectives that approximate its solution while enabling constraint composition and incremental updates. CCGM aims to turn generic pretrained generators into reusable priors that can be rapidly specialized to new structured distributions without retraining the underlying model.'
