    0: 'Medical question answering (QA) benchmarks often focus on multiple-choice or fact-based tasks, leaving open-ended answers to real patient questions underexplored. This gap is particularly critical in mental health, where patient questions often mix symptoms, treatment concerns, and emotional needs, requiring answers that balance clinical caution with contextual sensitivity.

      We present CounselBench, a large-scale benchmark developed with 100 mental health professionals to evaluate and stress-test large language models (LLMs) in realistic help-seeking scenarios. The first component, CounselBench-EVAL, contains 2,000 expert evaluations of answers from GPT-4, LLaMA 3, Gemini, and online human therapists on patient questions from the public forum CounselChat. Each answer is rated across six clinically grounded dimensions, with span-level annotations and written rationales. To probe failure modes more directly, we construct CounselBench-Adv, an adversarial dataset of 120 expert-authored mental health questions designed to trigger specific model issues. Together, CounselBench establishes a clinically grounded framework for benchmarking LLMs in mental health QA.'
    1: Static machine learning benchmarks rapidly saturate and encourage overfitting to idiosyncratic test sets, obscuring true generalization progress. This paper proposes EvoBench, a model-in-the-loop framework that treats benchmarks as evolving processes rather than fixed datasets. EvoBench maintains a seed test set and a large reservoir of unlabeled or synthetically generated candidates. For every new model submission, an adversarial curator searches this reservoir for inputs that maximally disagree with a committee of historical models under distributional and safety constraints. Curated items are labeled, appended to the test set, and versioned, so the benchmark continually tracks the frontier of failure modes while remaining reproducible. We formalize conditions under which EvoBench yields stable model rankings despite a growing test distribution, and introduce mechanisms for balancing hardness with coverage and for detecting data contamination via retrospective influence analysis. Instantiations for natural language and vision tasks illustrate how community submissions, generative models, and automated heuristics can collaborate in the benchmark evolution loop. EvoBench reframes dataset and benchmark design as a continual, adversarially guided process, aiming to slow benchmark saturation and produce more reliable signals of real-world robustness.
