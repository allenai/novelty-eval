    0: Foundation-model alignment is typically framed as optimizing a single reward over centrally collected human feedback, obscuring whose values are encoded, how trade-offs are made, and how sensitive preference data are handled. We propose Federated Pluralistic Alignment (FPA), a multi-objective framework that decomposes alignment into modular, stakeholder-specific “norm bundles” trained under privacy-preserving federated learning. Each bundle combines a lightweight preference model with explicit, machine-checkable constraints for safety, fairness, and privacy drawn from community norms, legal requirements, and expert guidance. A routing policy conditions on deployment context and stakeholder identity to select or blend norm bundles, while a constraint layer enforces cross-cutting guarantees such as non-discrimination and data-minimization. Differential privacy and secure aggregation ensure that local value learning does not expose individual preferences. FPA yields an interpretable, negotiable structure over the model’s normative behavior, enabling regulators, communities, and developers to audit which norms apply where, surface conflicts between groups, and iteratively revise the alignment configuration without retraining the base model.
    1: 'Protecting the copyright of user-generated AI images is an emerging challenge as AIGC becomes pervasive in creative workflows. Existing watermarking methods (1) remain vulnerable to real-world adversarial threats, often forced to trade off between defenses against spoofing and removal attacks; and (2) cannot support semantic-level tamper localization. We introduce PAI, a training-free inherent watermarking framework for AIGC copyright protection, plug-and-play with diffusion-based AIGC services. PAI simultaneously provides three key functionalities: robust ownership verification, attack detection, and semantic-level tampering localization. Unlike existing inherent watermark methods that only embed watermarks at noise initialization of diffusion models, we design a novel key-conditioned deflection mechanism that subtly steers the denoising trajectory according to the user key. Such trajectory-level coupling further strengthens the semantic entanglement of identity and content, thereby further enhancing robustness against real-world threats. Moreover, we also provide a theoretical analysis proving that only the valid key can pass verification.'
