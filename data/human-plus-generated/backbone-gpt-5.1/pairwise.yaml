    0: Classical operator-splitting methods such as ADMM, Douglas–Rachford, and primal–dual hybrids underlie much of large-scale convex and nonconvex optimization, yet their concrete instantiations are still manually engineered. In particular, the choice of variable and constraint partitioning, dualization pattern, and penalty and step-size schedules crucially determines convergence, but is rarely optimized systematically. We propose Meta-Splitting, a framework that treats the design of operator-splitting schemes as a meta-optimization problem over an explicit space of algorithmic decompositions. Given an optimization problem represented as a factor graph of smooth, nonsmooth, and linear components, Meta-Splitting parametrizes possible splittings and update rules, relaxes discrete structural choices to a differentiable search space, and uses bilevel optimization guided by analytic convergence surrogates to synthesize problem-adapted algorithms. The inner level executes a candidate iterative scheme, while the outer level optimizes its structural and numerical parameters under constraints that enforce monotone Lyapunov decrease and guarantee convergence for entire problem classes. This yields an “optimizer compiler” capable of automatically recovering classical algorithms as special cases and generating novel, structure-exploiting splitting methods tailored to new applications.
    1: 'Regret matching (RM)---and its modern variants---is a foundational online algorithm that has been at the heart of many AI breakthrough results in solving benchmark zero-sum games, such as poker. Yet, surprisingly little is known so far in theory about its convergence beyond two-player zero-sum games. For example, whether regret matching converges to Nash equilibria in potential games has been an open problem for two decades. Even beyond games, one could try to use RM variants for general constrained optimization problems.


      We show that RM$^+$ converges to an $\epsilon$-KKT point after $O_\epsilon(1/\epsilon^4)$ iterations, establishing for the first time that it is a sound and fast first-order optimizer. Our argument relates the KKT gap to the accumulated \emph{regret}, two quantities that are entirely disparate in general but interact in an intriguing way in our setting, so much so that when regrets are bounded, our complexity bound improves all the way to $O_\epsilon(1/\epsilon^2)$. From a technical standpoint, while RM$^+$ does not have the usual one-step improvement property in general, we show that it does in a certain region that the algorithm will quickly reach and remain in thereafter. In contrast, our second main result establishes that RM, with or without alternation, can take an exponential number of iterations to reach a crude approximate solution even in two-player potential games. This represents the first worst-case separation between RM and RM$^+$. Our lower bound shows that convergence to coarse correlated equilibria in potential games is exponentially faster than convergence to Nash equilibria.'
