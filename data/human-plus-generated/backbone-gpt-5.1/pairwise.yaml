    0: Multi-Agent System (MAS) powered by Visual Language Models (VLMs) enables challenging tasks but suffers from a novel failure term, multi-agent visual hallucination snowballing, where hallucinations are seeded in a single agent and amplified by following ones due to the over-reliance on textual flow to relay visual information. Through turn-, layer-, and token-wise attention analyses, we provide detailed insights into the essence of hallucination snowballing regarding the reduction of visual attention allocation. It leads us to identify a subset of vision tokens with a unimodal attention peak in middle layers that best preserve visual evidence but gradually diminish in deeper agent turns, resulting in the visual hallucination snowballing in MAS. Thus, we propose ViF, a lightweight, model-agnostic mitigation paradigm that relays inter-agent messages with Visual Flow powered by the selected visual relay tokens and applies attention reallocation to amplify this pattern.
    1: 'We propose Deliberation-Conditioned Pretraining (DCP), a new paradigm for frontier language models that treats multi-step reasoning and external memory manipulation as core pretraining behaviors rather than emergent side effects of scale. Instead of training models solely as stateless next-token predictors over linear text, DCP couples a frontier-scale language backbone with a persistent deliberative workspace: a structured external memory that can be written, edited, and referenced through learned actions. During pretraining, raw text, code, and tool-use traces are transformed into trajectories that interleave natural language tokens with workspace operations, encouraging the model to decompose tasks, maintain intermediate hypotheses, and iteratively refine plans over long horizons. The same mechanism supports explicit scratchpads, tool orchestration, and long-term context management within a unified architecture, while exposing interpretable deliberation traces. DCP aims to yield foundation models whose default behavior is to think with and through an evolving workspace, providing a scalable path toward more reliable reasoning, modular knowledge editing, and controllable high-stakes deployment of frontier systems.'
