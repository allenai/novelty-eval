    0: 'Computing the polar decomposition and the related matrix sign function has been a well-studied problem in numerical analysis for decades. Recently, it has emerged as an important subroutine within the Muon algorithm for training deep neural networks. However, the requirements of this application differ sharply from classical settings: deep learning demands GPU-friendly algorithms that prioritize high throughput over high precision. We introduce *Polar Express*, a new method for computing the polar decomposition. Like Newton–Schulz and other classical polynomial methods, our approach uses only matrix-matrix multiplications, making it very efficient on GPUs. Inspired by earlier work of Chen & Chow and Nakatsukasa & Freund, *Polar Express* adapts the update rule at each iteration by solving a minimax optimization problem. We prove that this strategy minimizes error in a worst-case sense, allowing *Polar Express* to converge as rapidly as possible both in the early iterations and asymptotically. We also address finite-precision issues, making it practical to use in `bfloat16`.'
    1: Nonconvex objectives in modern machine learning often admit natural families of easier surrogates—via smoothing, regularization, or data subsampling—yet existing homotopy and curriculum-based optimization methods fix these surrogate schedules a priori. This work introduces Alignment-Guided Homotopy Optimization, a general framework that adaptively sculpts a path of surrogate objectives using local gradient alignment with the true objective as the central control signal. We parameterize a continuum of objectives F_λ, interpolating between a tractable surrogate and the target loss, and jointly update both parameters and the homotopy parameter λ. At each iteration, Alignment-Guided Homotopy measures the cosine similarity between ∇F_λ and ∇F and automatically adjusts λ to maintain a prescribed alignment band, ensuring that surrogate gradients remain informative while gradually exposing the full nonconvex landscape. We analyze conditions under which alignment-controlled schedules yield descent guarantees and characterize trade-offs between smoothness, curvature, and optimization speed. The framework unifies smoothed, regularized, and curriculum-based training schemes and suggests new algorithmic designs for large-scale, ill-conditioned problems.
