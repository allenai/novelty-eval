  ideas:
    0: 'Foundation-model alignment is increasingly expected to satisfy heterogeneous societal requirements spanning fairness, safety, privacy, and culturally contingent norms, yet current pipelines bolt these objectives together through fragile post hoc filters and opaque reward models. We propose Privileged Social Choice Alignment (PriSCA), a framework that treats human feedback aggregation as a differentially private social choice problem rather than a scalar reward learning task. PriSCA learns a structured “normative control plane”: a parameterized family of objectives derived from group-tagged preference data via a privacy-preserving, constraint-aware aggregation operator. This operator encodes hard safety constraints, group fairness criteria, and jurisdictional or community-specific value weights, yielding a controllable manifold of aligned behaviors instead of a single global norm. The base model is fine-tuned to implement this manifold, enabling downstream governance actors to select operating points, audit trade-offs, and update normative parameters without retraining from scratch. PriSCA conceptually unifies alignment, fairness, safety, privacy, and societal pluralism, and offers a technically grounded path toward governable, value-flexible foundation models.'
    1: Machine unlearning seeks to efficiently remove the influence of selected data while preserving generalization. Significant progress has been made in low dimensions, where the dimension of the parameter $p$ is much smaller than the sample size $n$, but high dimensions, including proportional regimes $p \sim n$, pose serious theoretical challenges as standard optimization assumptions of $\Omega(1)$ strong convexity and $O(1)$ smoothness of the per-example loss $f$ rarely hold simultaneously in proportional regimes $p\sim n$. In this work, we introduce $\varepsilon$-Gaussian certifiability, a canonical and robust notion well-suited to high-dimensional regimes, that optimally captures a broad class of noise adding mechanisms. Then we theoretically analyze the performance of a widely used unlearning algorithm based on one step of the Newton method in the high-dimensional setting described above. Our analysis shows that a single Newton step, followed by a well-calibrated Gaussian noise, is sufficient to achieve both privacy and accuracy in this setting.
