  ideas:
    0: 'Electrophysiological (ExG) signals offer valuable insights into human physiology, yet building foundation models that generalize across everyday tasks remains challenging due to two key limitations: (i) insufficient data diversity, as most ExG recordings are collected in controlled labs with bulky, expensive devices; and (ii) task-specific model designs that require tailored processing (i.e., targeted frequency filters) and architectures, which limit generalization across tasks. To address these challenges, we introduce an approach for scalable, task-agnostic ExG monitoring in the wild. We collected 50 hours of unobtrusive free-living ExG data with an earphone-based hardware prototype to narrow the data diversity gap. At the core of our approach is Physiology-informed Multi-band Tokenization (PiMT), which decomposes ExG signals into 12 physiology-informed tokens, followed by a reconstruction task to learn robust representations. This enables adaptive feature recognition across the full frequency spectrum while capturing task-relevant information. We also introduce the DailySense dataset—the first to enable ExG-based analysis across five human senses.'
    1: Cognitive and systems neuroscience increasingly rely on computational theories, yet experimental practice still explores only a narrow, manually curated space of tasks and stimuli. We propose NeuroDesign, a framework for closed-loop, theory-driven experiment generation powered by deep generative models and Bayesian optimal design. NeuroDesign represents candidate theories as executable cognitive–neural process models and tasks as programs in a compositional language describing stimuli, timing, contingencies, and instructions. A neural surrogate is trained to approximate, for each theory–task pair, the joint distribution over behavioral and neural responses, enabling fast estimation of how strongly a candidate task is expected to discriminate among theories. An acquisition module then searches the task space for designs that maximize expected information gain subject to constraints on duration, difficulty, and safety. A generative language and stimulus engine converts selected task programs into human-ready instructions and trial materials for behavioral or neuroimaging studies. NeuroDesign aims to turn experiment design itself into a learnable, data-efficient process, accelerating the empirical refinement of cognitive and neural theories.
