    0: Modern machine learning increasingly relies on gigantic frozen models adapted to new tasks through tiny trainable interfaces, such as soft prompts, low-rank adapters, or linear heads. Classical generalization theory, which measures capacity at the level of the full hypothesis class, provides vacuous guarantees in this regime. We introduce a learning-theoretic framework for interface-based adaptation that isolates the contribution of the small trainable component from the large frozen backbone. Our key notion is interface complexity, a task-dependent capacity measure that treats the backbone as an arbitrary but fixed representation and only counts the degrees of freedom exposed by the interface. We show that many practical adaptation mechanisms, including linear probing, prompt tuning, and residual adapters, realize interface classes whose Rademacher complexity scales with the interface dimension rather than the backbone size. Under weak geometric conditions on the frozen representation, these bounds imply nontrivial sample complexity even when the backbone is infinitely large. We further analyze gradient-based adaptation algorithms and prove stability and margin-based guarantees that depend solely on interface complexity. The framework suggests principled design rules for adaptation schemes that are simultaneously expressive and statistically efficient, and it clarifies when reusing ever-larger foundation models can remain learnable from modest downstream data.
    1: Neural scaling laws underlie many of the recent advances in deep learning, yet their theoretical understanding remains largely confined to linear models. In this work, we present a systematic analysis of scaling laws for quadratic and diagonal neural networks in the feature learning regime. Leveraging connections with matrix compressed sensing and LASSO, we derive a detailed phase diagram for the scaling exponents of the excess risk as a function of sample complexity and weight decay. This analysis uncovers crossovers between distinct scaling regimes and plateau behaviors, mirroring phenomena widely reported in the empirical neural scaling literature. Furthermore, we establish a precise link between these regimes and the spectral properties of the trained network weights, which we characterize in detail. As a consequence, we provide a theoretical interpretation from first principles of recent empirical observations connecting the emergence of power-law tails in the weight spectrum with network generalization performance.
