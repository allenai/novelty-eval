    0: Cognitive and systems neuroscience still relies largely on hand-designed tasks whose structure is only weakly optimized to distinguish competing theories of brain and behavior. We propose a closed-loop framework that treats task design itself as a learnable object, using deep generative models and differentiable cognitive agents to automatically synthesize experiments that maximally discriminate among hypotheses. A neural task generator parameterizes families of sequential decision, perception, and memory paradigms, while a library of cognitive models maps each candidate task to predicted behavior and neural dynamics. Given online behavioral and neural measurements from human or animal participants, an acquisition function selects new tasks that maximize expected information gain over the theory space, subject to constraints on difficulty, duration, and ecological validity. This approach transforms experiment design into an active learning problem, enabling the automated discovery of minimal tasks that isolate specific computations, reveal when multiple strategies coexist, and map these strategies onto distributed neural representations.
    1: 'Normative and task-driven theories offer powerful top-down explanations for biological systems, yet the goals of quantitatively arbitrating between competing theories, and utilizing them as inductive biases to improve data-driven fits of real biological datasets are prohibitively laborious, and often impossible. To this end, we introduce a Bayesian meta-learning framework designed to automatically convert raw functional predictions from normative theories into tractable probabilistic models.

      We employ adaptive deep kernel Gaussian processes, meta-learning a kernel on synthetic data generated from a normative theory. This Theory-Informed Kernel specifies a probabilistic model representing the predictions of a given theoretical model: usable for both fitting data and rigorously validating the theory. As a demonstration, we apply our framework to the early visual system, using efficient coding as our normative theory.

      Using exact Bayesian model selection, the informed kernel can infer the degree of theory-match from data, enabling faithful encapsulation of theory structure. This work provides a more general, scalable, and automated approach for integrating theoretical knowledge into data-driven scientific inquiry in neuroscience and beyond.'
