  ideas:
    0: Representation learning methods across the supervision spectrum—unsupervised, self-supervised, semi-supervised, and supervised—are typically combined through ad-hoc loss weighting and stage-wise training, which makes it difficult to reason about what geometric properties the resulting embeddings actually satisfy. We propose CoReL, a unified constraint-based framework that treats every learning signal as a soft relational constraint on the latent space and compiles these heterogeneous constraints into a single differentiable energy function. Data points are nodes in a latent graph, while factors encode invariances from augmentations, equivalence and separation from labels, consistency from pseudo-labels, and smoothness from temporal or structural cues. CoReL jointly learns embeddings and constraint reliabilities, allowing it to down-weight conflicting signals and amplify informative ones via meta-learned trust scores. This declarative interface lets practitioners specify supervision at a high level, while an automatic constraint compiler generates the corresponding training objectives. The resulting representations are shaped by an explicitly programmable set of geometric desiderata rather than a fixed collection of task-specific losses, enabling systematic mixing of supervision regimes, principled incorporation of new forms of weak supervision, and improved transfer across tasks, modalities, and supervision budgets.
    1: Multi-view data usually suffer from partially missing views in open scenarios, which inevitably degrades clustering performance. The incomplete multi-view clustering (IMVC) has attracted increasing attention and achieved significant success. Although existing imputation-based IMVC methods perform well, they still face one crucial limitation, i.e., view recovery and subspace representation lack explicit alignment and collaborative interaction in exploring complementarity and consistency across multiple views. To this end, this study proposes a novel IMVC method to Align collaborative view Recovery and tensorial Subspace Learning via latent representation (ARSL-IMVC). Specifically, the ARSL-IMVC infers the complete view from view-shared latent representation and view-specific estimator with Hilbert-Schmidt Independence Criterion regularizer, reshaping the consistent and diverse information intrinsically embedded in original multi-view data. Then, the ARSL-IMVC learns the view-shared and view-specific subspace representations from latent feature and recovered views, and models high-order correlations at the global and local levels in the unified low-rank tensor space. Thus, leveraging the latent representation as a bridge in a unified framework, the ARSL-IMVC seamlessly aligns the complementarity and consistency exploration across view recovery and subspace representation learning, negotiating with each other to promote clustering.
