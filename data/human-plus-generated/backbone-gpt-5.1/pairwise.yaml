    0: Federated Learning (FL) enables clients to collaboratively train a global model without sharing their private data. However, the presence of malicious (Byzantine) clients poses significant challenges to the robustness of FL, particularly when data distributions across clients are heterogeneous. In this paper, we propose a novel Byzantine-robust FL optimization problem that incorporates adaptive weighting into the aggregation process. Unlike conventional approaches, our formulation treats aggregation weights as learnable parameters, jointly optimizing them alongside the global model parameters. To solve this optimization problem, we develop an alternating minimization algorithm with strong convergence guarantees under adversarial attack. We analyze the Byzantine resilience of the proposed objective.
    1: Stochastic gradient methods remain the workhorse of large-scale optimization, yet their performance is fundamentally limited by gradient noise, especially under non-stationary data and complex, input-dependent corruption. We propose a general framework for learning control variates for stochastic optimization that directly targets gradient variance while rigorously preserving unbiasedness. Our approach augments a base optimizer with an auxiliary control-variate network that predicts a surrogate for the gradient noise given the current iterate, minibatch inputs, and local gradient statistics. To avoid bias, we derive analytic corrections that add back the exact expectation of the learned control variate under the current data distribution, yielding a provably unbiased, variance-reduced gradient estimator. The control-variate network itself is trained online via a meta-objective that minimizes empirical gradient variance subject to stability regularizers, and its architecture is designed to be dimension-agnostic and shareable across parameters. We show that, in appropriate linear-function-space limits, the framework recovers classical variance-reduced methods as special cases, while allowing significantly richer, data-dependent control variates. This perspective opens a new route to adaptive, distribution-aware variance reduction for optimization in streaming and continually shifting environments.
