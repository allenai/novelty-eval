    0: 'Sequential Bayesian inference underpins online learning, time series modeling, and decision making, yet standard variational and MCMC methods recompute or re-equilibrate a global approximation whenever new data arrive. This leads to inference costs that grow superlinearly with dataset size and hinders interactive uncertainty quantification. We propose to learn a Bayes editor: a parametric Markov operator on particles that approximates the exact Bayesian update for an entire family of models and observation processes. Given a set of samples from the current posterior and a new observation, a permutation-equivariant transport network outputs updated particles that approximate the posterior after incorporating the new data. The editor is trained offline across synthetic inference tasks to minimize a variational objective that couples an amortized evidence lower bound with distributional matching to gold-standard posteriors. We analyze the Bayes editor as a perturbed Bayesian operator and derive conditions under which approximation error does not accumulate catastrophically under repeated updates. The resulting framework turns sequential Bayesian inference into repeated application of a learned local transport map, enabling fast, particle-based, and multimodal posterior updates in streaming and meta-learning regimes.'
    1: Tokenization---the process of decomposing a given text into a sequence of subwords called *tokens*---is one of the key components in the development of language models. Particularly, auto-regressive language models generate texts token by token, i.e., by predicting the next-token distribution given the previous ones, and thus tokenization directly affects their efficiency in text generation. Since each language model has their own vocabulary as a set of possible tokens, they struggle to cooperate with each other at the level of next-token distributions such as model ensemble. In this paper, we establish a theoretical framework of lossless vocabulary reduction, which efficiently converts a given auto-regressive language model into the one with an arbitrarily small vocabulary without any loss in accuracy. This framework allows language models with different tokenization to cooperate with each other efficiently by reduction to their maximal common vocabulary, enabling applications such as model ensemble with different tokenization.
