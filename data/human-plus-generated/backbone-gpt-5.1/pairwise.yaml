    0: Sparse autoencoders (SAEs) have recently emerged as a powerful tool for interpreting the features learned by large language models (LLMs). By reconstructing features with sparsely activated networks, SAEs aim to recover complex superposed polysemantic features into interpretable monosemantic ones. Despite their wide applications, it remains unclear under what conditions SAEs can fully recover the ground truth monosemantic features from the superposed polysemantic ones. In this paper, we provide the first theoretical analysis with a closed-form solution for SAEs, revealing that they generally fail to fully recover the ground truth monosemantic features unless the ground truth features are extremely sparse. To improve the feature recovery of SAEs in general cases, we propose a reweighting strategy targeting at enhancing the reconstruction of the ground truth monosemantic features instead of the observed polysemantic ones. We further establish a theoretical weight selection principle for our proposed weighted SAE (WSAE).
    1: 'We introduce rationale-circuit alignment, a framework for generating natural-language explanations that are explicitly grounded in a model’s internal computation. Instead of treating explanations as post-hoc justifications, we require that each step in a textual rationale correspond to a sparse, causally-validated circuit within the network. Our method jointly learns (i) a library of rationale circuits—small sets of neurons, attention heads, or channels whose activations mediate distinct functional roles—and (ii) an explanation generator that produces tokens aligned to these circuits. Alignment is enforced by interventional consistency: syntactic edits to a rationale (such as removing or negating a step) must have matched effects when implemented as targeted interventions on the associated circuit, and conversely, structural perturbations of a circuit must be predictable from counterfactual edits of the rationale. This bidirectional constraint couples mechanistic and linguistic views of reasoning, yielding explanations that support causal queries, circuit-level debugging, and automatic detection of unfaithful rationales when no internal computation matches a claimed reasoning step.'
