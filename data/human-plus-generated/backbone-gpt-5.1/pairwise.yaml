    0: 'Modern machine learning has transformed simulation and data analysis in the physical sciences, yet assistance for designing and executing experiments remains rudimentary. Translating qualitative scientific goals into precise, instrument-level control sequences is difficult, domain-specific, and largely manual. We introduce LabFoundry, a multimodal generative world model for experiments that learns to map natural language hypotheses and high-level task descriptions to executable experimental programs and predicted measurement trajectories across physics, chemistry, and biology. LabFoundry ingests heterogeneous logs comprising free-text lab notes, structured protocols, time-stamped hardware commands, and multichannel sensor streams, which are serialized into a unified “experiment token” language covering both discrete actions and continuous control waveforms. A hierarchical transformer conditions action generation on an explicit latent experiment graph capturing materials, devices, and causal dependencies between steps. Differentiable physics simulators and symbolic constraint checkers are coupled in the training objective to enforce basic conservation laws, unit consistency, and safety limits during generation. The resulting model functions as a controllable experiment copilot: it proposes candidate procedures, completes partially specified protocols, and forecasts likely outcomes under alternative designs, thereby closing the loop between scientific reasoning and laboratory actuation.'
    1: 'Chaotic systems are intrinsically sensitive to small errors, challenging efforts to construct predictive data-driven models of real-world dynamical systems such as fluid flows or neuronal activity. Prior efforts comprise either specialized models trained on individual time series, or foundation models trained on vast time series databases with little underlying dynamical structure. Motivated by dynamical systems theory, we present Panda, Patched Attention for Nonlinear Dynamics. We train Panda on a novel synthetic, extensible dataset of 20,000 chaotic dynamical systems that we discover using an evolutionary algorithm. Trained purely on simulated data, Panda exhibits emergent properties: zero-shot forecasting of unseen chaotic systems preserving both short-term accuracy and distributional measures, nonlinear resonance patterns in attention heads, and effective prediction of real-world experimental time series. Despite having been trained only on low-dimensional ordinary differential equations, Panda spontaneously develops the ability to predict partial differential equations without retraining. We also demonstrate a neural scaling law for differential equations, underscoring the potential of pretrained models for probing abstract mathematical domains like nonlinear dynamics.'
