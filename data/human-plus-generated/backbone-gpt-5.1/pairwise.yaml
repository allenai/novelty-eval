    0: In this work, we propose FFDP, a set of IO-aware non-GEMM fused kernels supplemented with a distributed framework for image registration at unprecedented scales. Image registration is an inverse problem fundamental to biomedical and life sciences, but algorithms have not scaled in tandem with image acquisition capabilities. Our framework complements existing model parallelism techniques proposed for large-scale transformer training by optimizing non-GEMM bottlenecks and enabling convolution-aware tensor sharding. FFDP enables unprecedented capabilities such as performing multimodal registration of a 100μm ex-vivo human brain MRI volume at native resolution – an inverse problem more than 570× larger than a standard clinical datum – using only 8 A6000 GPUs. FFDP accelerates existing optimization and deep learning registration pipelines while reducing peak memory consumption, and enables fitting substantially larger problems on a single GPU than previously possible.
    1: Modern computing stacks comprise deeply layered infrastructures, from hardware power states through operating system schedulers to high-level software libraries, yet each layer is tuned in isolation via brittle, hand-crafted heuristics. We propose a differentiable systems stack that treats these cross-layer configuration choices as parameters in a single optimization problem and exposes an approximately differentiable mapping from knobs to end-to-end objectives such as latency, cost, and energy. Our approach introduces a meta-runtime that factors policies for scheduling, caching, memory management, algorithm selection, and hardware DVFS into parametric modules, replaces non-differentiable components with learned surrogate models, and composes them into a unified computational graph. Gradient-based methods, combined with constraint handling and safety envelopes, continuously adapt parameters to concrete workloads while respecting SLOs and hardware limits. This framework aims to transform infrastructure, library, and hardware tuning from ad hoc per-component engineering into a principled, cross-layer optimization process that can generalize across workloads and platforms.
