    0: Static benchmarks increasingly fail to reliably measure progress in AI systems due to rapid saturation, data contamination, and inability to diagnose fine-grained reasoning capabilities. We introduce ComposeEval, a procedural meta-benchmark framework that generates evaluation instances on-the-fly by compositionally combining atomic reasoning primitives spanning spatial, temporal, causal, numerical, and logical dimensions. Rather than providing a fixed dataset, ComposeEval defines a generative grammar over problem structures, enabling the creation of unlimited novel instances with precisely controlled complexity and reasoning requirements. Each generated problem comes with a compositional dependency graph that traces which primitive skills are required, enabling systematic diagnosis of model capabilities and failure modes. The framework supports configurable difficulty progression through primitive composition depth and distractor complexity. By generating fresh instances at evaluation time, ComposeEval provides inherent resistance to contamination while enabling researchers to stress-test specific capability intersections that static benchmarks cannot isolate. We release the generation framework alongside human validation protocols and baseline primitive decomposition analyses to support rigorous, reproducible evaluation of compositional reasoning in foundation models.
    1: Online services rely on CAPTCHAs as a first line of defense against automated abuse, yet recent advances in multi-modal large language models (MLLMs) have eroded the effectiveness of conventional designs that focus on text recognition or 2D image understanding. To address this challenge, we present **Spatial CAPTCHA**, a novel human-verification framework that leverages fundamental differences in spatial reasoning between humans and MLLMs. Unlike existing CAPTCHAs that rely on low-level perception tasks vulnerable to modern AI, Spatial CAPTCHA generates dynamic questions requiring geometric reasoning, perspective-taking, occlusion handling, and mental rotation—skills intuitive for humans but difficult for current AI systems. The system employs a procedural generation pipeline with constraint-based difficulty control, automated correctness verification, and human-in-the-loop validation to ensure scalability, robustness, and adaptability. We also introduce a corresponding benchmark, **Spatial-CAPTCHA-Bench**, to support systematic assessment of spatial reasoning capabilities in both humans and AI systems.
