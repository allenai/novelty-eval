    1: Representation learning methods typically operate under fixed paradigms—supervised, self-supervised, or semi-supervised—treating the learning objective as static across the data manifold. We propose Adaptive Supervision Geometry (ASG), a unified framework that learns representations through a spatially-varying objective that continuously interpolates between supervised and self-supervised learning based on local label topology. ASG introduces a differentiable supervision density estimator that characterizes the local availability of labels in representation space, coupled with a geometric loss modulator that smoothly transitions between contrastive self-supervision in label-sparse regions and discriminative supervision in label-dense regions. This creates a representation space where task-relevant structure emerges near labeled examples while preserving rich general-purpose features elsewhere. A key insight is modeling supervision itself as a learnable field over the manifold rather than a discrete property of individual samples. ASG naturally handles arbitrary label configurations—from fully supervised to completely unlabeled—within a single coherent framework, eliminating the need for separate pre-training and fine-tuning stages while preventing the representation collapse that often occurs when naively combining heterogeneous objectives.
