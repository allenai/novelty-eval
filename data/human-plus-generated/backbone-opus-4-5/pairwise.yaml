    0: 'Classical generalization theory derives bounds from static complexity measures of hypothesis classes, yet fails to explain why gradient-based optimization in overparameterized models finds solutions that generalize well. We propose trajectory-aware generalization theory, a framework that derives generalization bounds by analyzing the geometric structure of loss landscapes encountered along the optimization path rather than worst-case hypothesis class properties. Our key insight is that the cumulative curvature experienced during training—characterized by the evolving Hessian spectrum—implicitly constrains the effective complexity of learned functions. We introduce the notion of a curvature certificate: a trajectory-dependent quantity that tracks transitions between sharp and flat regions during optimization. This certificate yields algorithm-dependent generalization bounds that tighten as optimization spends more iterations in flat, low-rank Hessian regions. Our theoretical framework provides a unified explanation for several empirical phenomena: the generalization benefits of large learning rates, warmup schedules, and batch size effects. The analysis reveals that successful training implicitly performs a form of spectral regularization, progressively aligning learned representations with low-curvature subspaces of the loss landscape.'
    1: Contrastive learning has emerged as a powerful framework for learning generalizable representations, yet its theoretical understanding remains limited, particularly under imbalanced data distributions that are prevalent in real-world applications. Such an imbalance can degrade representation quality and induce biased model behavior, yet a rigorous characterization of these effects is lacking. In this work, we develop a theoretical framework to analyze the training dynamics of contrastive learning with Transformer-based encoders under imbalanced data. Our results reveal that neuron weights evolve through three distinct stages of training, with different dynamics for majority features, minority features, and noise. We further show that minority features reduce representational capacity, increase the need for more complex architectures, and hinder the separation of ground-truth features from noise. Inspired by these neuron-level behaviors, we show that pruning restores performance degraded by imbalance and enhances feature separation, offering both conceptual insights and practical guidance.
