    0: Deep neural networks excel at learning compositional functions—those expressible as hierarchies of simpler operations—yet existing learning theory provides limited insight into when depth provably reduces sample complexity for such targets. We introduce a compositional learning framework that formally connects the algebraic structure of target functions to the statistical complexity of learning them with gradient-trained deep networks. Our approach decomposes the function class into compositional strata characterized by their depth of nesting, and establishes tight sample complexity bounds that scale with compositional depth rather than ambient dimensionality. Central to our analysis is a notion of compositional Rademacher complexity that captures how hierarchical representations progressively simplify the learning problem across layers. We prove that gradient descent on appropriately structured networks implicitly performs hierarchical feature learning, successively recovering compositional components in a manner that matches our statistical lower bounds. This yields the first separation results showing exponential sample complexity gaps between shallow and deep learners for natural compositional function classes. Our framework unifies disparate observations about depth efficiency and provides a principled foundation for understanding when architectural depth translates to statistical advantage.
