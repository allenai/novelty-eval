    0: Open-ended segmentation requires models capable of generating free-form descriptions of previously unseen concepts and regions. Despite advancements in model development, current evaluation protocols for open-ended segmentation tasks fail to capture the true semantic accuracy of the generated descriptions. We empirically demonstrate that embedding‐based similarity score mappings diverge significantly from human judgments. To address this issue, we introduce a novel mapping function that considers multiple lexical relationships between free‐form outputs and test‐vocabulary labels, yielding much closer alignment with human annotations. We integrate this mapping into a robust evaluation framework. Additionally, we present the first Multi-modal Large‐Language Model trained with a contrastive objective to jointly align visual regions and textual descriptions for open‐ended panoptic segmentation.
    1: Current AI benchmarks predominantly evaluate capabilities in isolation, creating a misleading picture of model competence that fails to predict real-world performance. We introduce CompositionalProbe, a procedural benchmark generation framework designed to assess genuine compositional generalization by requiring models to combine familiar skills in systematically novel configurations. Our framework defines a formal grammar over cognitive primitives—spanning reasoning types, modality transformations, and domain knowledge—and generates evaluation instances by sampling unseen compositions from this space. Each generated task requires chaining multiple capabilities that models have encountered separately but never in combination, directly testing whether learned skills transfer compositionally or remain brittle pattern-matching artifacts. The procedural generation mechanism ensures unlimited fresh evaluation instances, fundamentally addressing benchmark contamination concerns while enabling precise diagnosis of compositional failure modes. We further introduce composition graphs that visualize which capability combinations models master versus where compositional gaps emerge, providing actionable insights for targeted model improvement. CompositionalProbe establishes a new paradigm for evaluation that prioritizes generalization authenticity over saturated metrics, offering the research community a rigorous tool for distinguishing genuine understanding from superficial benchmark fitting.
