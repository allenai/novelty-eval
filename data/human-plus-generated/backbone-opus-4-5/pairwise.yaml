  ideas:
    0: 'Medical question answering (QA) benchmarks often focus on multiple-choice or fact-based tasks, leaving open-ended answers to real patient questions underexplored. This gap is particularly critical in mental health, where patient questions often mix symptoms, treatment concerns, and emotional needs, requiring answers that balance clinical caution with contextual sensitivity.

      We present CounselBench, a large-scale benchmark developed with 100 mental health professionals to evaluate and stress-test large language models (LLMs) in realistic help-seeking scenarios. The first component, CounselBench-EVAL, contains 2,000 expert evaluations of answers from GPT-4, LLaMA 3, Gemini, and online human therapists on patient questions from the public forum CounselChat. Each answer is rated across six clinically grounded dimensions, with span-level annotations and written rationales. To probe failure modes more directly, we construct CounselBench-Adv, an adversarial dataset of 120 expert-authored mental health questions designed to trigger specific model issues. Together, CounselBench establishes a clinically grounded framework for benchmarking LLMs in mental health QA.'
    1: 'Static benchmarks have driven machine learning progress but suffer from critical limitations: data contamination in large-scale models, overfitting to fixed test distributions, and inability to diagnose systematic generalization failures. We introduce ProceduralEval, a framework for generating infinite streams of novel evaluation instances through compositional task grammars. Our approach defines atomic reasoning primitives and composition rules that procedurally synthesize evaluation tasks with controllable complexity and guaranteed novelty. Each generated instance comes with a formal difficulty certificate based on the derivation depth and primitive combinations required for solution. The framework supports multiple cognitive dimensions—logical reasoning, spatial understanding, temporal inference, and numerical computation—unified under a single grammatical formalism. Crucially, ProceduralEval enables fine-grained generalization diagnostics by systematically varying which primitive combinations appear during evaluation versus any potential training exposure. We provide an extensible toolkit for researchers to define domain-specific grammars while inheriting the core generation and difficulty-calibration machinery. ProceduralEval shifts evaluation from static snapshots to dynamic probing, offering a contamination-resistant and diagnostically rich paradigm for understanding model capabilities.'
