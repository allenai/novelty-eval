    0: 'Reinforcement learning (RL) algorithms have been used recently to align diffusion models with downstream objectives such as aesthetic quality and text-image consistency by fine-tuning them to maximize a single reward function under a fixed KL regularization. However, this approach is inherently restrictive in practice, where alignment must balance multiple, often conflicting objectives. Moreover, user preferences vary across prompts, individuals, and deployment contexts, with varying tolerances for deviation from a pre-trained base model. We address the problem of inference-time multi-preference alignment: given a set of basis reward functions and a reference KL regularization strength, can we design a fine-tuning procedure so that, at inference time, it can generate images aligned with any user-specified linear combination of rewards and regularization, without requiring additional fine-tuning? We propose Diffusion Blend, a novel approach to solve inference-time multi-preference alignment by blending backward diffusion processes associated with fine-tuned models, and we instantiate this approach with three algorithms: DB-MPA for multi-reward alignment, DB-KLA for KL regularization control, and DB-MPA-LS for approximating DB-MPA without additional inference cost.'
    1: Current generative models produce outputs through fixed forward passes, lacking the iterative self-critique that characterizes human creative processes. We introduce Generative Self-Dialogue, a framework that internalizes revision dynamics within a single generative model. Our approach augments standard generative architectures with a learned critic pathway that operates in latent space, identifying deficiencies in intermediate representations and proposing targeted corrections before final decoding. Unlike external feedback mechanisms, the critic is co-trained with the generator through a novel adversarial-cooperative objective that encourages the proposal pathway to produce revisable drafts while training the critic to suggest improvements that maximize output quality. A gating mechanism learns to dynamically balance initial proposals with refinements, allowing the model to adapt its revision depth based on generation difficulty. The framework introduces recurrent refinement steps that share parameters, enabling iterative improvement without proportional parameter growth. Generative Self-Dialogue provides a unified approach to building generative models that reason about and improve their own outputs, bridging the gap between feed-forward generation and deliberative creative processes across modalities including text, images, and structured data.
