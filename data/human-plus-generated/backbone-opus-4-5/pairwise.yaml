    0: Deep research has revolutionized data analysis, yet data scientists still devote substantial time to manually crafting visualizations, highlighting the need for robust automation from natural language queries. However, current systems struggle with complex datasets containing multiple files and iterative refinement. Existing approaches, including simple single- or multi-agent systems, often oversimplify the task, focusing on initial query parsing while failing to robustly manage data complexity, code errors, or final visualization quality. In this paper, we reframe this challenge as a collaborative multi-agent problem. We introduce CoDA, a multi-agent system that employs specialized LLM agents for metadata analysis, task planning, code generation, and self-reflection. We formalize this pipeline, demonstrating how metadata-focused analysis bypasses token limits and quality-driven refinement ensures robustness. This work demonstrates that the future of visualization automation lies not in isolated code generation but in integrated, collaborative agentic workflows.
    1: Large language models exhibit impressive linguistic capabilities yet remain unreliable for tasks demanding rigorous logical reasoning, particularly those involving multi-step deductions or subtle contradictions. We introduce LogiCoproc, a lightweight neural module that serves as an external reasoning co-processor for frozen foundation models. LogiCoproc learns to identify reasoning-critical segments in natural language, translate them into executable formal representations, perform symbolic inference through a differentiable logic engine, and seamlessly integrate conclusions back into the language model's generation process. The module is trained end-to-end using a novel curriculum that progressively increases logical complexity while maintaining tight coupling with the host model's representations. A learned gating mechanism allows the foundation model to dynamically invoke symbolic reasoning only when beneficial, preserving fluent generation for non-logical content. Crucially, LogiCoproc operates on frozen model representations, requiring no modification to base model weights and adding fewer than 3% additional parameters. The framework produces fully interpretable reasoning traces in formal notation alongside natural language outputs, enabling verification and debugging of the reasoning process.
