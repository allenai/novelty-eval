    0: 'In this paper, we identify that the key criterion for determining whether a model is truly capable of novel view synthesis (NVS) is transferability: Whether any pose representation extracted from one video sequence can be used to re-render the same camera trajectory in another. We analyze prior work on self-supervised NVS and find that their predicted poses do not transfer: The same set of poses lead to different camera trajectories in different 3D scenes. Here, we present XFactor, the first geometry-free self-supervised model capable of true NVS. XFactor combines pair-wise pose estimation with a simple augmentation scheme of the inputs and outputs that jointly enables disentangling camera pose from scene content and facilitates geometric reasoning. Remarkably, XFactor achieves transferability with unconstrained latent pose variables, without any 3D inductive biases or concepts from multi-view geometry — such as an explicit parameterization of poses as elements of SE(3). We introduce a new metric to quantify transferability.'
    1: Multimodal learning typically assumes that different modalities can be aligned through spatial or semantic correspondence, yet it overlooks the fundamental differences in how information temporally unfolds across vision, audio, and language. Visual scenes evolve continuously, audio events occur at varying granularities from instantaneous sounds to sustained tones, and language unfolds through discrete sequential tokens. We introduce Temporal Rhythm Networks, a framework that learns modality-specific temporal signatures to guide cross-modal fusion. Our approach first extracts learnable temporal basis functions for each modality, capturing their characteristic rhythms of information flow. These temporal signatures then modulate cross-modal attention, allowing the model to automatically discover meaningful correspondences across different temporal scales. A rhythm consistency objective encourages the network to identify stable cross-modal temporal patterns while remaining flexible to natural variations. This design enables more principled multimodal integration for tasks where temporal dynamics are critical, including video understanding, audio-visual synchronization, and temporally-grounded generation. Temporal Rhythm Networks provide a unified mechanism for handling the inherent temporal heterogeneity of real-world multimodal signals.
