  ideas:
    0: 'Multimodal Large Language Models (MLLMs), which couple pre-trained vision encoders and language models, have shown remarkable capabilities. However, their reliance on the ubiquitous Pre-Norm architecture introduces a subtle yet critical flaw: a severe norm disparity between the high-norm visual tokens and the low-norm text tokens. In this work, we present a formal theoretical analysis demonstrating that this imbalance is not a static issue. Instead, it induces an "asymmetric update dynamic", where high-norm visual tokens exhibit a ''''representational inertia,'''' causing them to transform semantically much slower than their textual counterparts. This fundamentally impairs effective cross-modal feature fusion. Our empirical validation across a range of mainstream MLLMs confirms that this theoretical dynamic---the persistence of norm disparity and the resulting asymmetric update rates---is a prevalent phenomenon. Based on this insight, we propose a remarkably simple yet effective solution: inserting a single, carefully initialized LayerNorm layer after the visual projector to enforce norm alignment, suggesting that resolving the architectural imbalance leads to a more holistically capable model.'
    1: Large language models exhibit impressive fluency but frequently fail on tasks requiring strict logical consistency and constraint satisfaction. Existing remedies either rely on costly fine-tuning or delegate reasoning to external symbolic solvers, sacrificing the flexibility of natural language understanding. We introduce ConstraintFlow, a lightweight architectural extension that enables foundation models to perform implicit constraint propagation within their forward pass. Our key insight is that constraint satisfaction can be reformulated as iterative message passing over variable-constraint graphs, a computation naturally expressible through modified attention mechanisms. ConstraintFlow augments transformer blocks with constraint-aware attention heads that learn to identify logical dependencies in context and propagate satisfiability signals through hidden representations. A learned gating mechanism allows the model to dynamically engage structured reasoning only when beneficial, preserving standard generation capabilities. The framework requires no external solvers, maintains full differentiability for end-to-end training, and introduces minimal parameter overhead. ConstraintFlow represents a step toward foundation models that seamlessly blend neural pattern recognition with principled logical reasoning, enabling more reliable performance on planning, scheduling, and compositional reasoning tasks expressed in natural language.
