    0: Static benchmarks have driven remarkable progress in AI, yet they suffer from data contamination, overfitting to specific test distributions, and failure to measure compositional generalization—the ability to combine learned skills in novel configurations. We introduce CompGen-Infinity, a procedural benchmark generation framework that produces unlimited, never-before-seen evaluation instances requiring compositional reasoning across multiple cognitive primitives. Our framework defines a formal grammar over atomic skill modules—including arithmetic reasoning, linguistic manipulation, spatial understanding, and logical inference—along with composition operators that combine these modules into arbitrarily complex nested structures. At evaluation time, instances are generated on-demand with controllable difficulty through composition depth and primitive diversity parameters. Crucially, each generated instance is accompanied by a verifiable solution trace, enabling automatic correctness checking without human annotation. The procedural nature guarantees zero train-test overlap while the compositional structure reveals systematic generalization failures invisible to conventional benchmarks. We release an open generator with extensible primitive libraries, enabling the research community to continuously expand the space of testable compositions and adapt the framework to emerging capability domains.
    1: Morphological traits are physical characteristics of biological organisms that provide vital clues on how organisms interact with their environment. Yet extracting these traits remains a slow, expert-driven process, limiting their use in large-scale ecological studies. A major bottleneck is the absence of high-quality datasets linking biological images to trait-level annotations. In this work, we demonstrate that sparse autoencoders trained on foundation-model features yield monosemantic, spatially grounded neurons that consistently activate on meaningful morphological parts. Leveraging this property, we introduce a trait annotation pipeline that localizes salient regions and uses vision-language prompting to generate interpretable trait descriptions. Using this approach, we construct Bioscan-Traits, a dataset of 80K trait annotations spanning 19K insect images from BIOSCAN-5M. By annotating traits with a modular pipeline rather than prohibitively expensive manual efforts, we offer a scalable way to inject biologically meaningful supervision into foundation models, enable large-scale morphological analyses, and bridge the gap between ecological relevance and machine-learning practicality.
