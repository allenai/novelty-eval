    0: Randomized Controlled Trials are one of the pillars of science; nevertheless, they rely on hand-crafted hypotheses and expensive analysis. Such constraints prevent causal effect estimation at scale, potentially anchoring on popular yet incomplete hypotheses. We propose to discover the unknown effects of a treatment directly from data. For this, we turn unstructured data from a trial into meaningful representations via pretrained foundation models and interpret them via a Sparse Auto Encoder. However, discovering significant causal effects at the neural level is not trivial due to multiple-testing issues and effects entanglement. To address these challenges, we introduce _Neural Effect Search_, a novel recursive procedure solving both issues by progressive stratification. We showcase, in the context of experimental ecology, the first successful unsupervised causal effect identification on a real-world scientific trial.
    1: Mechanistic interpretability methods have revealed the function of individual components in large language models, yet understanding how these components coordinate during multi-step reasoning remains elusive. We introduce Reasoning Attractors, a framework that reconceptualizes inference-time computation as a dynamical system evolving through representation space. Our approach identifies stable computational trajectories—attractor pathways—that emerge when models engage in coherent reasoning, distinguishing them from the transient dynamics of uncertain or inconsistent processing. We develop a method to extract these attractors by analyzing the geometry of hidden state evolution across layers and tokens, revealing low-dimensional manifolds corresponding to distinct reasoning strategies. Crucially, perturbations to attractor pathways produce interpretable behavioral changes, enabling causal verification of discovered reasoning structures. The framework unifies component-level mechanistic findings with global behavioral patterns, showing how distributed circuits collectively implement stable cognitive procedures. Reasoning Attractors provides a new vocabulary for explanation—one grounded in the dynamics of computation rather than static component attribution—offering practitioners actionable insights into when and how models reason reliably versus when they may fail unpredictably.
