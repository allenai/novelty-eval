    0: Large language models encode world knowledge as static representations, unable to accommodate the conceptual evolution inherent in human knowledge systems. While retrieval augmentation addresses factual updates, it fails to capture deeper paradigm shifts where relationships between concepts fundamentally reorganize. We introduce Conceptual Accommodation Networks, a framework enabling foundation models to dynamically restructure their internal knowledge representations in response to paradigm-shifting information. Our approach identifies conceptual dependencies through activation pathway analysis, detecting when new information creates coherence conflicts with existing knowledge structures. A meta-learned accommodation module then selectively rewrites relevant reasoning pathways while preserving orthogonal knowledge through gradient-based isolation. Unlike continual learning methods that merely accumulate information, our framework models knowledge evolution as structural transformation, mirroring cognitive theories of schema accommodation. The architecture operates through lightweight adapter mechanisms that learn to predict which representation subspaces require reorganization, enabling efficient updates without full model retraining. This work establishes a foundation for language models that reason coherently within evolving knowledge paradigms rather than treating new information as disconnected additions to a fixed conceptual inventory.
    1: "Process Reward Models (PRMs) have recently emerged as a powerful framework for enhancing the reasoning capabilities of large reasoning models (LRMs), particularly in the context of test-time scaling (TTS). However, their potential for supervising LRMs on tabular reasoning domains remains underexplored. \nThrough detailed empirical analyses, we identify that existing PRMs, though widely adopted for supervising text-only reasoning steps, struggle with table-specific operations such as sub-table retrieval and schema interaction, leading to critical performance bottlenecks. To address this limitation, we propose TaTToo, a novel table-grounded PRM framework that (i) reasons explicitly over tabular reasoning steps and (ii) integrates tool-based verification to provide precise reward supervision. Concretely, we first design a scalable data curation pipeline that constructs over 60k high-quality step-level annotations by integrating table verification rationales with tool-based executions. Building on the collected data, we train TaTToo with a dual-stage paradigm: cold-start supervised fine-tuning to capture tool-use reasoning patterns, followed by reinforcement learning with tool-grounded reward shaping to align our model with table-based verification."
