  ideas:
    0: The brain is hypothesized to operate as a hierarchical prediction machine, yet computational models that capture this principle while respecting biological constraints remain limited. We introduce Predictive Spiking Cortex (PSC), a framework that implements hierarchical predictive coding within spiking neural networks using exclusively local, spike-timing-dependent learning rules. PSC consists of stacked cortical modules where each layer generates temporal predictions about incoming spike patterns from lower levels, with prediction errors propagated through dedicated error-coding neurons. Learning emerges from local voltage-dependent plasticity that approximates gradient-based error minimization without requiring backpropagation or global error signals. The architecture naturally accounts for key neurophysiological observations including distinct error and prediction neuron populations, gamma-band feedforward and beta-band feedback oscillations, and attention-like precision weighting. PSC provides a unified computational substrate that bridges normative theories of brain function with biologically realistic neural dynamics, offering both a framework for interpreting neural recordings and a foundation for energy-efficient neuromorphic systems that learn through prediction.
    1: 'Enabling natural communication through brain–computer interfaces (BCIs) remains one of the most profound challenges in neuroscience and neurotechnology. While existing frameworks offer partial solutions, they are constrained by oversimplified semantic representations and a lack of interpretability. To overcome these limitations, we introduce **Semantic Intent Decoding (SID)**, a novel framework that translates neural activity into natural language by modeling meaning as a flexible set of compositional semantic units.

      SID is built on three core principles: semantic compositionality, continuity and expandability of semantic space, and fidelity in reconstruction.

      We present **BrainMosaic**, a deep learning architecture implementing SID. BrainMosaic decodes multiple semantic units from EEG/SEEG signals using set matching and then reconstructs coherent sentences through semantic-guided reconstruction.

      This approach moves beyond traditional pipelines that rely on fixed-class classification or unconstrained generation, enabling a more interpretable and expressive communication paradigm, paving the way for natural and effective BCI-mediated communication.'
