  ideas:
    0: 'Graph neural networks operate on fixed topologies, yet real-world systems exhibit rich multi-scale structure where relevant geometric relationships change across levels of granularity. We introduce Scale-Equivariant Graph Networks (SEGNs), a framework that learns representations equivariant to hierarchical coarse-grainings of graph topology. Our key insight is that meaningful graph representations should exhibit consistency across scales: fine-grained features must aggregate coherently into coarser descriptions, analogous to renormalization group flows in physics. SEGNs achieve this through learnable pooling operators that respect topological persistence—identifying structural motifs that remain salient across multiple resolutions. We formalize scale equivariance as an inductive bias, requiring that learned representations commute with coarse-graining operations up to learned transformations. This is implemented via a bidirectional architecture where information flows both up and down the scale hierarchy, with cross-scale attention mechanisms that selectively propagate persistent topological features. The framework naturally handles graphs, simplicial complexes, and cell complexes within a unified formalism. SEGNs provide a principled approach to multi-scale reasoning on geometric data, offering new capabilities for domains characterized by hierarchical organization, from molecular systems to social networks.'
    1: Large Language Models (LLMs) often generate incorrect or unsupported content, known as hallucinations. Existing detection methods rely on heuristics or simple models over isolated computational traces such as activations, or attention maps. We unify these signals by representing them as attributed graphs, where tokens are nodes, edges follow attentional flows, and both carry features from attention scores and activations. Our approach, CHARM, casts hallucination detection as a graph learning task and tackles it by applying GNNs over the above attributed graphs. We show that CHARM provably subsumes prior attention-based heuristics. Our results shed light on the relevant role played by the graph structure and on the benefits of combining computational traces.
