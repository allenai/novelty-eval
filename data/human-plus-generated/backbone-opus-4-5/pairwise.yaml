  ideas:
    0: Lifelong learning systems must continuously acquire new skills while preserving existing knowledge, yet current approaches rely on fixed consolidation strategies that cannot adapt to the evolving structure of the task stream. We introduce Meta-Consolidation Networks, a hierarchical framework that learns to learn how to transfer and retain knowledge across a lifetime of tasks. Our approach maintains a meta-learner that generates task-specific consolidation policies, determining which parameters to protect, how to modulate gradient flow, and when to trigger memory replay. Crucially, this meta-learner itself undergoes continual refinement, updating its consolidation strategies based on observed forgetting patterns and transfer success across the system's history. We formulate this as a bi-level optimization problem where the inner loop adapts to new tasks using generated policies, while the outer loop updates the policy generator based on long-term retention and forward transfer signals. A compact episodic memory stores task signatures and consolidation outcomes, enabling the meta-learner to recognize task similarities and retrieve effective strategies. This self-improving architecture bridges meta-learning and lifelong learning, producing systems whose ability to learn without forgetting strengthens with experience.
    1: 'A persistent paradox in continual learning (CL) is that neural networks often retain linearly separable representations of past tasks even when their output predictions fail. We formalize this distinction as the gap between *deep* (feature-space) and *shallow* (classifier-level) forgetting. We reveal a critical asymmetry in Experience Replay: while minimal buffers successfully anchor feature geometry and prevent deep forgetting, mitigating shallow forgetting typically requires substantially larger buffer capacities.

      To explain this, we extend the Neural Collapse framework to the sequential setting. We characterize deep forgetting as a geometric drift toward out-of-distribution subspaces and prove that any non-zero replay fraction asymptotically guarantees the retention of linear separability. Conversely, we identify that the ``strong collapse'''' induced by small buffers leads to rank-deficient covariances and inflated class means, effectively blinding the classifier to true population boundaries. By unifying CL with out-of-distribution detection, our work challenges the prevailing reliance on large buffers, suggesting that explicitly correcting these statistical artifacts could unlock robust performance with minimal replay.'
