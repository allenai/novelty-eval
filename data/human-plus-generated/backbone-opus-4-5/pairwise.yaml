    0: 'LLMs hallucinate, yet some confabulations can have social affordances if carefully bounded. We propose critical confabulation (inspired by critical fabulation from literary and social theory), the use of LLM hallucinations to "fill-in-the-gap'''' for omissions in archives due to social and political inequality, and reconstruct divergent yet evidence-bound narratives for history''s ``hidden figures''''. We simulate these gaps with an open-ended narrative cloze task: asking LLMs to generate a masked event in a character-centric timeline sourced from a novel corpus of unpublished texts. We investigate fully-open models and open-weight and proprietary models under a range of prompts designed to elicit controlled and useful hallucinations. Our findings validate LLMs'' foundational narrative understanding capabilities to perform critical confabulation, and show how controlled and well-specified hallucinations can support LLM applications for knowledge production without collapsing speculation into a lack of historical accuracy and fidelity.'
    1: Current alignment approaches encode safety constraints that implicitly reflect the values of dominant cultures in training data, raising concerns about value pluralism and cultural hegemony in AI systems. We introduce Pluralistic Alignment Networks (PAN), a framework that disentangles universal safety principles from culturally-contingent norms through a hierarchical value representation. PAN learns a shared foundation of cross-cultural harm avoidance while maintaining separate, composable value modules that capture legitimate cultural variation in preferences and social norms. Our approach employs contrastive learning on multilingual, multicultural human feedback to identify which safety considerations generalize across communities and which reflect localized values. A meta-learning objective enables rapid adaptation to new cultural contexts without compromising core safety guarantees. We introduce a formal distinction between non-negotiable safety boundaries and contextually-appropriate behavior, allowing the model to respect cultural diversity while preventing genuine harms. PAN provides a principled approach to building AI systems that are simultaneously safe and culturally respectful, moving beyond one-size-fits-all alignment toward genuinely pluralistic value learning.
