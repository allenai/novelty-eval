    0: Large language models encode vast knowledge within their parameters, yet this knowledge remains static post-training, requiring costly interventions for updates. We introduce Neural Knowledge Homeostasis, a self-supervised framework enabling foundation models to autonomously maintain and reorganize their internal knowledge representations. Inspired by memory consolidation in biological systems, our approach introduces periodic maintenance phases where models identify and resolve knowledge inconsistencies through gradient-free attractor dynamics in representation space. We formalize knowledge as dynamic attractor states rather than fixed parameter configurations, allowing beliefs to be strengthened through consistent activation patterns or gracefully deprecated when contradicted by emerging context. A homeostatic objective balances knowledge preservation against plasticity, while a sparse gating mechanism isolates maintenance operations to prevent interference with core capabilities. The framework requires no external supervision or ground-truth labels, instead leveraging internal consistency signals derived from the model's own predictions across paraphrased queries. Neural Knowledge Homeostasis provides a principled path toward foundation models capable of perpetual self-improvement while maintaining coherent, non-contradictory world models.
    1: Large language models (LLMs) have demonstrated remarkable capabilities in chain of thought (CoT) reasoning. However, the current LLM reasoning paradigm initiates thinking only after the entire input is available, which introduces unnecessary latency and weakens attention to earlier information in dynamic scenarios. Inspired by human cognition of thinking while reading, we first design a **streaming thinking** paradigm for LLMs, where reasoning unfolds in the order of input and further adjusts its depth once reading is complete. We instantiate this paradigm with *StreamingThinker*, a framework that enables LLMs to think while reading through the integration of streaming CoT generation, streaming-constraint training, and streaming parallel inference. Specifically, StreamingThinker employs streaming reasoning units with quality control for CoT generation, enforces order-preserving reasoning through streaming attention masks and position encoding, and leverages parallel KV caches that decouple input encoding from reasoning generation, thereby ensuring alignment and enabling true concurrency.
