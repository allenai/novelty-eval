    0: Graph representation learning methods typically commit to a single geometric assumption—Euclidean, hyperbolic, or spherical—yet real-world relational data often exhibit heterogeneous structural properties across different regions. We introduce Locally Adaptive Geometry Networks (LAGNet), a framework that learns position-dependent curvature fields over graphs, enabling each node's representation to reside in a locally optimal geometric space. LAGNet parameterizes a continuous curvature function using message-passing layers, which dynamically interpolates between hyperbolic, Euclidean, and spherical geometries based on local topological features. This curvature field is jointly learned with node representations through a geometric consistency objective that encourages neighboring nodes to maintain coherent parallel transport across varying curvatures. Our formulation generalizes existing constant-curvature approaches while introducing minimal computational overhead through efficient tangent space approximations. The framework naturally handles graphs with mixed hierarchical and cyclical structures, learns interpretable geometric signatures that reveal topological organization, and provides a unified architecture for graphs, point clouds, and simplicial complexes by treating geometry as a learnable, spatially-varying property rather than a fixed prior assumption.
    1: 'Watermarking provides an effective means for data governance. However, conventional post-editing graph watermarking approaches degrade the graph quality and involve NP-hard subroutines. Alternatively, recent approaches advocate for embedding watermarking patterns in the noisy latent during data generation from diffusion models, but remain uncharted for graph models due to the hardness of inverting the graph diffusion process. In this work, we propose CheckWate: the first watermarking framework for graph diffusion models embedding checkerboard watermark and providing polynomial time verification. To address NP-completeness due to graph isomorphism, CheckWate embeds the watermark into the latent eigenvalues, which are isomorphism-invariant. To detect the watermark through reversing the graph diffusion process, CheckWate leverages the graph eigenvectors to approximately dequantize the discrete graph back to the continuous latent, with theoretical guarantees on the detectability and dequantization error. We further introduce a latent sparsification mechanism to enhance the robustness of CheckWate against graph modifications.'
