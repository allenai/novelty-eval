    0: Standard discrete diffusion models treat all unobserved states the same way, typically mapping them to an absorbing [MASK] token. This creates an "information void" where global semantic information that may be inferred for the masked tokens from the unmasked tokens is not directly passed from one denoising step to another. We introduce **Continuously Augmented Discrete Diffusion (CADD)**, a framework that augments the discrete state space with a paired diffusion in a continuous latent space. This yields graded, gradually corrupted states in which masked tokens are represented by noisy yet informative latent vectors rather than information voids. At each reverse step, CADD uses the continuous latent as a semantic hint to guide discrete denoising. The design is clean and compatible with existing discrete diffusion training. At sampling time, the strength and estimator of the continuous latent vector enables a controlled trade-off between mode-coverage (diversity-oriented) and mode-seeking (context-localization-oriented).
    1: We introduce Introspective Generative Models (IGMs), a framework enabling generative models to critique and refine their own outputs through learned self-dialogue. Unlike conventional approaches that treat generation as a single forward pass, IGMs decompose synthesis into iterative cycles of generation, self-evaluation, and gradient-guided refinement. Our architecture jointly learns a generator and an intrinsic critic within a shared latent space, where the critic's gradients with respect to generated samples define natural refinement trajectories. A novel consistency objective ensures that refined samples remain on the data manifold while the critic provides meaningful improvement signals throughout the refinement process. Crucially, this self-improvement mechanism operates without external discriminators or reward models at inference time, as the critique capability is internalized during training. We further introduce stochastic refinement depth, allowing the model to adaptively allocate computation based on sample difficulty. IGMs establish a new paradigm for generative modeling where quality emerges from learned introspection rather than architectural scaling alone, bridging connections between generative modeling, self-play, and meta-learning.
