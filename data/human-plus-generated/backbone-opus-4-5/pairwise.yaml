  ideas:
    0: 'The deployment of Large Language Models (LLMs) faces a critical bottleneck when handling lengthy inputs: the prohibitive memory footprint of the Key Value (KV) cache. To address this bottleneck, the token pruning paradigm leverages attention sparsity to selectively retain a small, critical subset of tokens. However, existing approaches fall short, with static methods risking irreversible information loss and dynamic strategies employing heuristics that insufficiently capture the query-dependent nature of token importance. We propose FASA, a novel framework that achieves query-aware token eviction by dynamically predicting token importance. FASA stems from a novel insight into RoPE: the discovery of functional sparsity at the frequency-chunk (FC) level. Our key finding is that a small, identifiable subset of "dominant" FCs consistently exhibits high contextual agreement with the full attention head. This provides a robust and computationally free proxy for identifying salient tokens. Building on this insight, FASA first identifies a critical set of tokens using dominant FCs, and then performs focused attention computation solely on this pruned subset.'
    1: Large language models exhibit striking capabilities yet consistently fail at compositional generalization, struggling to systematically combine familiar concepts in novel configurations. We introduce Compositional Attention Scaffolding (CAS), a parameter-efficient inference-time intervention that enhances compositional reasoning without fine-tuning or explicit chain-of-thought generation. CAS operates through a lightweight routing module that detects compositional structure in queries and dynamically injects learned attention biases that prevent representational collapse of constituent components. Unlike prompting strategies that externalize reasoning, CAS operates directly on intermediate representations, maintaining computational efficiency while preserving the model's general capabilities. The core mechanism learns a small bank of compositional operators—corresponding to common combination patterns like attribute binding, relational composition, and recursive nesting—which modulate attention flow to maintain separation between elements requiring independent processing before integration. CAS can be trained on synthetic compositional data and transfers zero-shot to diverse natural language compositional challenges. Our framework provides both a practical enhancement for deployed models and theoretical insights into the representational bottlenecks underlying compositional failures in transformer architectures.
