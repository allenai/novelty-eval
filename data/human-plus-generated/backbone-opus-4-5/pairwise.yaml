    0: Next token prediction has been the standard training objective used in large language model pretraining. Representations are learned as a result of optimizing for token-level perplexity. We propose Continuous Concept Mixing (CoCoMix), a novel pretraining framework that combines discrete next token prediction with continuous concepts. Specifically, CoCoMix predicts "continuous concepts" learned from a pretrained sparse autoencoder and mixes them into the model's hidden state by interleaving with token hidden representations. We find that combining both concept learning and interleaving in an end-to-end framework is critical to performance gains. Furthermore, CoCoMix enhances interpretability and steerability by allowing direct inspection and modification of the predicted concept, offering a transparent way to guide the model's internal reasoning process.
    1: Large language models encode vast knowledge in their parameters, yet this knowledge remains implicitly distributed across high-dimensional representations, limiting systematic reasoning and compositional generalization. We introduce Knowledge Atlases, a framework for discovering and leveraging the latent geometric organization of concepts within foundation models. Our approach extracts hierarchical and relational structures from model activations by identifying low-dimensional manifolds that capture taxonomic, mereological, and causal relationships between concepts. These structures are consolidated into a navigable atlas that makes implicit conceptual organization explicit. During inference, we propose atlas-guided reasoning, where multi-step reasoning tasks are decomposed into traversals across the discovered concept geometry, with each reasoning step grounded in the learned relational structure. This provides an inductive bias toward compositionally valid inference paths while maintaining the model's learned representations. Knowledge Atlases bridge neural and symbolic approaches by extracting discrete relational structure from continuous representations without requiring external knowledge bases, offering a new paradigm for interpretable and systematic reasoning in foundation models.
