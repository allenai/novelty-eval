    0: Classical learning theory provides generalization guarantees under the assumption that training and test data arise from identical distributions, yet real-world learning systems increasingly operate in non-stationary environments where this assumption fails. We introduce drift complexity, a novel measure that captures the intrinsic difficulty of learning under continuous distribution shift by quantifying the geometric and statistical structure of evolving data distributions. Building on this foundation, we develop a theoretical framework that unifies algorithmic stability, online learning regret bounds, and optimal transport theory to derive distribution-shift-aware generalization guarantees. Our analysis reveals that generalization under drift depends critically on the interaction between the learner's adaptivity and the smoothness of distribution trajectories, leading to a fundamental adaptivity-stability tradeoff not present in stationary settings. We characterize the minimax optimal rates for learning under drift and propose a meta-algorithm that achieves these rates by dynamically balancing memory retention with responsiveness to change. Our framework recovers classical PAC bounds as a special case when drift vanishes, while providing substantially tighter guarantees when distributions evolve slowly, bridging the gap between worst-case theoretical pessimism and observed empirical robustness in continual learning systems.
    1: Neural scaling laws underlie many of the recent advances in deep learning, yet their theoretical understanding remains largely confined to linear models. In this work, we present a systematic analysis of scaling laws for quadratic and diagonal neural networks in the feature learning regime. Leveraging connections with matrix compressed sensing and LASSO, we derive a detailed phase diagram for the scaling exponents of the excess risk as a function of sample complexity and weight decay. This analysis uncovers crossovers between distinct scaling regimes and plateau behaviors, mirroring phenomena widely reported in the empirical neural scaling literature. Furthermore, we establish a precise link between these regimes and the spectral properties of the trained network weights, which we characterize in detail. As a consequence, we provide a theoretical interpretation from first principles of recent empirical observations connecting the emergence of power-law tails in the weight spectrum with network generalization performance.
