    0: Physical simulation relies on spatially-varying mechanical properties, typically laboriously hand-crafted. We present the first feed-forward model to predict fine-grained mechanical properties, Young's modulus ($E$), Poisson's ratio ($\nu$), and density ($\rho$), throughout *the volume* of 3D objects. Our model supports any 3D representation that can be rendered and voxelized, including Signed Distance Fields (SDFs), Gaussian Splats and Neural Radiance Fields (NeRFs). To achieve this, we aggregate per-voxel multi-view features for any input, which are passed to our trained Geometry Transformer to predict per-voxel material latent codes. These latents reside on the trained manifold of physically plausible materials, which we train on a real-world dataset, guaranteeing the validity of decoded per-voxel materials. To obtain object-level training data, we propose an annotation pipeline combining knowledge from segmented 3D datasets, material databases, and a vision-language model. VoMP estimates volumetric properties and can convert 3D objects into simulation-ready assets, enabling realistic deformable simulations.
    1: Multimodal learning systems often assume uniform reliability across input modalities, yet real-world deployments face dynamic conditions where individual modalities may be degraded, noisy, or entirely absent. We introduce Evidential Cross-Modal Calibration (ECMC), a framework that enables adaptive multimodal fusion by learning to estimate per-modality reliability at inference time. ECMC places evidential priors over modality-specific encoders, producing calibrated uncertainty estimates that reflect input quality without requiring explicit degradation labels during training. A cross-modal attention mechanism then dynamically reweights modality contributions based on these uncertainty signals, allowing the model to gracefully shift reliance toward more trustworthy inputs. To encourage robust representations even under modality failure, we introduce stochastic modality dropout with uncertainty-guided consistency regularization, ensuring the model learns complementary rather than redundant cross-modal features. ECMC operates as a modular layer compatible with existing multimodal architectures across vision, audio, and language domains. Our framework addresses a critical gap in deploying multimodal systems under real-world variability, enabling principled uncertainty-aware fusion that maintains performance when individual modalities become unreliable.
