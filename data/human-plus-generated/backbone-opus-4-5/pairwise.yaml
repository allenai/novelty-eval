    0: 'Classical learning theory characterizes generalization through properties of hypothesis classes or final learned predictors, yet mounting empirical evidence suggests that the optimization trajectory itself carries crucial information about generalization behavior. We introduce trajectory-dependent generalization theory, a framework that derives generalization bounds by analyzing the cumulative stability of iterative learning algorithms across their entire optimization path rather than solely at convergence. Our approach tracks how infinitesimal perturbations to training data propagate through sequential parameter updates, yielding a trajectory stability coefficient that captures the algorithm''s sensitivity dynamics over time. This perspective naturally explains several empirical phenomena that elude classical analysis: why early stopping regularizes, how learning rate schedules affect generalization, and when curriculum strategies provide benefits. We establish connections between trajectory stability and information-theoretic quantities, showing that the mutual information between intermediate iterates and training data provides a tighter characterization than endpoint-only analysis. Our framework unifies insights from optimization dynamics, algorithmic stability, and PAC-Bayes theory, offering a principled lens for understanding how procedural choices during training translate into statistical guarantees for learned predictors.'
    1: 'Finding the right initialisation for neural networks is crucial to ensure smooth training and good performance. In transformers, the wrong initialisation can lead to one of two failure modes of self-attention layers: rank collapse, where all tokens collapse into similar representations, and entropy collapse, where highly concentrated attention scores lead to training instability. While previous work has studied different scaling regimes for transformers, an asymptotically exact, down-to-the constant prescription for how to initialise transformers has so far been lacking. Here, we provide an analytical theory of signal propagation through deep transformers with self-attention, layer normalisation, skip connections and MLP. Our theory yields a simple algorithm to compute trainability diagrams that identify the correct choice of initialisation hyper-parameters for a given architecture. We overcome the key challenge, an exact treatment of the self-attention layer, by establishing a formal parallel with the Random Energy Model from statistical physics. We also analyse gradients in the backward path and determine the regime where gradients vanish at initialisation. Our theoretical framework gives a unified perspective on the two failure modes of self-attention and gives quantitative predictions on the scale of both weights and residual connections that guarantee smooth training.'
