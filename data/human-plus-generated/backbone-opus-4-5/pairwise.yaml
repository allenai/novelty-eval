    0: Multimodal learning typically projects diverse modalities into a shared embedding space, sacrificing the unique structural properties that make each modality expressive. We propose Structural Grammar Networks (SGN), a framework that learns modality-specific compositional grammars capturing the generative rules underlying images, audio, and text. Rather than collapsing modalities into a common representation, SGN maintains distinct grammar spaces connected through learned structural correspondences. Each modality encoder extracts a hierarchical parse representing compositional structure—spatial arrangements for vision, temporal progressions for audio, and syntactic trees for language. Cross-modal translation occurs through grammar-to-grammar mappings that preserve structural relationships while respecting modality-specific constraints. A novel grammar induction module discovers latent production rules from unannotated data, enabling the system to capture domain-specific compositional patterns without manual annotation. The framework supports bidirectional translation between any modality pair through composition of pairwise grammar correspondences. SGN enables structure-preserving cross-modal generation, compositional reasoning about multimodal scenes, and few-shot adaptation to new domains by transferring grammatical knowledge across modalities.
    1: Large vision–language models (VLMs) deliver state-of-the-art results on a wide range of multimodal tasks, yet they remain prone to visual hallucinations, producing content that is not grounded in the input image. Despite progress with visual supervision, reinforcement learning, and post-hoc attention reshaping, the representational origins of hallucinations remain unclear. Our study reveals that successful grounding emerges when adjacent visual tokens exhibit coherent alignment, while hallucinations arise when key vectors scatter isotropically, weakening cross-modal attention and blurring object boundaries. Building on this insight, we propose Depth and Spatial aware Cache Refinement (DSCR), a lightweight and training-free method that augments the Transformer's key-value (KV) cache with depth cues and 2D spatial proximity. DSCR clusters vectors within objects and separates those across surfaces, guiding attention toward relevant regions without any fine-tuning. Our findings highlight KV-coherence as a core factor behind hallucinations and demonstrate a practical, model-agnostic solution for enhancing VLM reliability.
