    0: 'We present the first comprehensive evaluation of AI agents against human cybersecurity professionals in a live enterprise environment. We evaluate ten cybersecurity professionals alongside six existing AI agents and ARTEMIS, our new agent scaffold, on a large university network consisting of $\sim$8,000 hosts across 12 subnets. ARTEMIS is a multi-agent framework featuring dynamic prompt generation, arbitrary sub-agents, and automatic vulnerability triaging. AI agents offer advantages in systematic enumeration, parallel exploitation, and cost---certain ARTEMIS variants cost $18/hour versus $60/hour for professional penetration testers. We also identify key capability gaps: AI agents exhibit higher false-positive rates and struggle with GUI-based tasks.'
    1: 'Responsible AI development requires simultaneously addressing alignment, fairness, safety, and privacy—objectives that are deeply interconnected yet typically optimized in isolation. This fragmented approach leads to unforeseen conflicts: safety interventions may encode cultural biases, privacy mechanisms can obstruct fairness audits, and alignment techniques might amplify majority preferences at the expense of marginalized groups. We introduce Pluralistic Value Optimization (PVO), a unified framework that explicitly models the interdependencies among responsible AI objectives as a constrained multi-objective optimization problem. PVO constructs a value dependency graph capturing how interventions targeting one objective influence others, enabling principled navigation of trade-off surfaces rather than ad-hoc resolution of conflicts. Our framework incorporates stakeholder-weighted Pareto optimization, allowing diverse communities to express preferences over trade-offs while maintaining transparency about inevitable compromises. We further propose differentiable proxies for traditionally discrete fairness and privacy constraints, enabling end-to-end optimization during model training. PVO provides practitioners with interpretable trade-off manifolds and recommends Pareto-optimal configurations aligned with specified value priorities, moving beyond single-objective thinking toward holistic responsible AI development.'
