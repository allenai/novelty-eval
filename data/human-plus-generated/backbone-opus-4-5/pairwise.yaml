  ideas:
    0: 'The human brain exhibits remarkable efficiency in processing sequential information, a capability deeply rooted in the temporal selectivity and stochastic competition of neuronal activation. Current continual learning in spiking neural networks (SNNs) faces a critical challenge: balancing task-specific selectivity with adaptive resource allocation and enhancing the robustness with perturbations to mitigate catastrophic forgetting. Considering the intrinsic temporal dynamics of spiking neurons instead of traditional K-winner-take-all (K-WTA) based on firing rate, we explore how to leave networks robust to temporal perturbations in SNNs on lifelong learning tasks.

      In this paper, we propose Randomized Temporal K-winner-take-all (RTK-WTA) SNNs for lifelong learning, a biologically grounded approach that integrates trace-dependent neuronal activation with probabilistic top-k selection. By dynamically prioritizing neurons based on their spatiotemporal relevance, RTK-WTA SNNs emulate the brain''s ability to modulate neural resources in spatial and temporal dimensions while introducing controlled randomness to prevent overlapping task representations. The proposed RTK-WTA SNNs enhance inter-class margins and robustness through expanded feature space utilization theoretically. Controlled stochasticity balances temporal coherence and adaptability, offering a scalable framework for lifelong learning in neuromorphic systems.'
    1: Understanding the computational principles underlying neural circuits requires models that capture both behavioral function and biological dynamics. Current approaches either optimize artificial networks purely for task performance, sacrificing neural realism, or fit neural data directly, obscuring computational interpretability. We introduce NeuroSync, a dual-objective learning framework that simultaneously aligns artificial network dynamics with multi-region neural population recordings while maintaining task competence. NeuroSync employs a temporal contrastive objective that matches the geometry of representational trajectories between artificial and biological networks across multiple timescales, from millisecond spike patterns to slower cognitive state transitions. A key innovation is our cross-region consistency loss, which encourages artificial subnetworks to develop communication patterns mirroring empirical inter-area connectivity. To preserve interpretability, we introduce sparsity constraints that yield modular architectures amenable to mechanistic analysis. The framework operates on top of standard recurrent architectures, requiring only neural recordings and behavioral labels during training. NeuroSync provides a principled approach for discovering shared computational motifs between artificial and biological intelligence, offering both improved neural predictivity and mechanistically interpretable models of cognitive function.
