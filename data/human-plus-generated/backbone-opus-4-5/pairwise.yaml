    0: 'Embodied AI has developed rapidly in recent years, but it is still mainly deployed in laboratories, with various distortions in the Real-world limiting its application. Traditionally, Image Quality Assessment (IQA) methods are applied to predict human preferences for distorted images; however, there is no IQA method to assess the usability of an image in embodied tasks, namely, the perceptual quality for robots. To provide accurate and reliable quality indicators for future embodied scenarios, we first propose the topic: IQA for Embodied AI. Specifically, we (1) based on the Mertonian system and meta-cognitive theory, constructed a perception-cognition-decision-execution pipeline and defined a comprehensive subjective score collection process; (2) established the Embodied-IQA database, containing over 30k reference/distorted image pairs, with more than 5m fine-grained annotations provided by Vision Language Models/Vision Language Action-models/Real-world robots. We sincerely hope that through this work, we can promote the application of Embodied AI under complex distortions in the Real-world.'
    1: 'Static benchmarks have driven remarkable progress in machine learning, yet they suffer from saturation, data contamination, and overfitting to fixed evaluation distributions. We introduce EvoEval, a framework for creating living benchmarks that continuously evolve to maintain discriminative power and resist memorization-based shortcuts. EvoEval combines three complementary mechanisms: procedural instance generation that creates novel test cases from compositional primitives, an adversarial curriculum that identifies and amplifies capability gaps exposed by current models, and temporal stratification that ensures evaluation instances remain unseen during training cutoffs. The framework maintains benchmark validity through invariant preservation, ensuring generated instances satisfy task-specific constraints while varying surface-level features. Rather than measuring performance on static snapshots, EvoEval quantifies a model''s adaptability frontier—its ability to generalize across controlled distribution shifts of increasing difficulty. We provide a meta-benchmark specification language enabling researchers to define evolution rules for diverse task families spanning reasoning, language understanding, and multimodal comprehension. EvoEval offers a paradigm shift from asking ''how well does a model perform?'' to ''how robustly does performance transfer across the space of valid task variations?'''
