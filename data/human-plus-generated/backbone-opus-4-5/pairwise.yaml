  ideas:
    0: Large language models operate with fixed computational budgets regardless of input complexity, wastefully applying full capacity to trivial queries while potentially underserving difficult ones. We introduce Metacognitive Sparsity, a framework that endows foundation models with awareness of their own computational requirements. Our approach trains a lightweight introspection module that predicts, for each input token sequence, a continuous difficulty score mapped to a sparse activation mask over the model's parameters. Unlike mixture-of-experts architectures that route between discrete expert modules, or early-exit methods limited to depth truncation, Metacognitive Sparsity enables fine-grained, input-conditional parameter activation across both width and depth dimensions. The introspection module is trained through a novel self-supervised objective that correlates activation patterns with prediction uncertainty and loss gradients, requiring no human annotations of task difficulty. A consistency regularizer ensures that the sparse subnetworks maintain behavioral alignment with the full model on capability-critical inputs. This framework transforms static foundation models into adaptive computational systems that allocate capacity proportionally to input demands, bridging the gap between scaling laws and deployment efficiency.
    1: Measuring the in-context computational effort of language models is a key challenge, as metrics like next-token loss fail to capture reasoning complexity. Prior methods based on latent state compressibility can be invasive and unstable. We propose Multiple Token Divergence (MTD), a simple measure of computational effort defined as the KL divergence between a model's full output distribution and that of a shallow, auxiliary prediction head. MTD can be computed directly from pre-trained models with multiple prediction heads, requiring no additional training. Building on this, we introduce Divergence Steering, a novel decoding method to control the computational character of generated text. MTD provides a practical, lightweight tool for analyzing and steering the computational dynamics of language models.
