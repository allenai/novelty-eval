  ideas:
    0: 'Representation learning methods typically operate within rigid paradigms—supervised, self-supervised, semi-supervised, or unsupervised—each imposing fixed assumptions about label availability and reliability. Real-world data, however, arrives with heterogeneous supervision: some samples carry clean labels, others have noisy annotations, and many remain unlabeled entirely. We introduce Adaptive Supervision Interpolation (ASI), a unified representation learning framework that dynamically modulates between self-supervised and supervised objectives on a per-sample basis. ASI learns a continuous supervision temperature for each training instance, automatically downweighting label-dependent losses when annotations are unreliable or absent while amplifying self-supervised structural learning. A meta-learned reliability estimator assesses label trustworthiness without requiring explicit noise annotations, enabling seamless transitions across the supervision spectrum within a single training run. This formulation subsumes existing paradigms as special cases: pure self-supervision emerges when all temperatures approach zero, while full supervision corresponds to maximum temperature throughout. ASI naturally handles mixed-supervision scenarios including partial labeling, label noise, and pseudo-label bootstrapping through a principled probabilistic interpolation mechanism. The framework provides a foundation for learning robust representations from realistic, imperfectly-annotated data without paradigm-specific architectural modifications.'
    1: Neural networks necessitate nonlinearities to achieve universal approximability. Traditional activation functions introduce nonlinearities through rigid feature rectifications. Recent self-gated variants improve traditional methods in fitting flexibility by incorporating learnable content-aware factors and non-local dependencies, enabling dynamic adjustments to activation curves via adaptive translation and scaling. While SOTA approaches achieve notable gains in conventional CNN layers, they struggle to enhance Transformer layers, where fine-grained context is inherently modeled, severely reducing the effectiveness of non-local dependencies leveraged in activation processes. We refer to this critical yet unexplored challenge as the **non-local tension** of activation. Drawing on a decision-making perspective, we systematically analyze the origins of the non-local tension problem and explore the initial solution to foster a more discriminative and generalizable neural activation methodology. This is achieved by rethinking how non-local cues are encoded and transformed into adaptive scaling coefficients, which in turn recalibrate the contributions of features to filter updates through neural activation. Grounded in these insights, we present **FleS**, a novel self-gated activation model for discriminative pattern recognition.
