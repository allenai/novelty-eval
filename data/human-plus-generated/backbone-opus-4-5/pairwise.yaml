    0: '``Learnware = Model + Specification''''. A learnware comprises a submitted model paired with a \emph{specification} sketching its capabilities. For a Learnware Dock System (LDS) which accommodates numerous models, these specifications are essential to enabling users to identify helpful models, eliminating the requirement for prohibitively costly per-model evaluations. Recently, \textbf{Pa}rameter \textbf{Ve}ctor (PAVE) specification, which utilizes the changes in pre-trained model parameters to inherently encode the model capability and task requirements, shows promising capabilities in enabling identifying useful learnwares for high-dimensional, unstructured text data.

      In this paper, we present a comprehensive study of PAVE specification for learnware identification. Theoretically, from the neural tangent kernel perspective, we establish a tight connection between PAVE and prior specifications, providing a theoretical explanation for their shared underlying principles. We further approximate PAVE in a low-rank space and analyze the approximation error bound, highly reducing the computational and storage overhead.'
    1: Representation learning methods typically operate within distinct paradigms—supervised, self-supervised, semi-supervised, or unsupervised—each imposing different structural constraints on the learned embedding space. We propose Geometric Supervision Unification (GSU), a framework that learns representations by simultaneously satisfying objectives from all supervision regimes within a single, coherent training process. GSU introduces a geometry-aware meta-objective that dynamically balances contrastive self-supervised losses, consistency-based semi-supervised regularization, and supervised classification signals based on the local density and structure of the representation manifold. In regions where labeled samples are dense, the framework emphasizes discriminative supervised gradients; in sparsely labeled regions, it relies on self-supervised invariances and unlabeled consistency. This is achieved through learnable, position-dependent weighting functions that adapt supervision strength across the embedding space. Unlike sequential pretrain-then-finetune pipelines or fixed-weight multi-task objectives, GSU continuously negotiates between supervision sources, enabling smooth interpolation across the supervision spectrum. The resulting representations exhibit robust transfer properties regardless of downstream label availability, unifying previously fragmented paradigms into a principled geometric framework.
