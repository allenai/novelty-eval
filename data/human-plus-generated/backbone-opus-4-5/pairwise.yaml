  ideas:
    0: Neural surrogate models for physical simulations offer dramatic speedups over traditional numerical solvers, yet they typically require retraining for each new physical system or parameter regime. We introduce ConserveNet, a neural operator architecture that achieves cross-domain generalization by structurally encoding conservation laws as transferable inductive biases. Rather than treating conservation as soft regularization, ConserveNet embeds these principles directly into network architecture through divergence-preserving layers for mass and charge conservation, antisymmetric modules for momentum balance, and symplectic integration blocks for energy-conserving dynamics. A hierarchical conservation encoder learns to recognize which conservation structures govern an input system, automatically activating appropriate architectural pathways. This design creates a shared representational space where physically distinct systems—from incompressible fluids to electromagnetic fields to Hamiltonian mechanics—are unified through their common conservation grammar. ConserveNet enables few-shot adaptation to novel PDEs by transferring learned conservation structures while requiring only minimal fine-tuning for system-specific constitutive relations. Our framework bridges the gap between black-box neural surrogates and physics-informed approaches, providing both computational efficiency and principled generalization grounded in fundamental physical laws.
    1: 'Recently, many generative models for de novo protein structure design have emerged. Yet, only few tackle the difficult task of directly generating fully atomistic structures jointly with the underlying amino acid sequence. This is challenging, for instance, because the model must reason over side chains that change in length during generation. We introduce La-Proteina for atomistic protein design based on a novel partially latent protein representation: coarse backbone structure is modeled explicitly, while sequence and atomistic details are captured via per-residue latent variables of fixed dimensionality, thereby effectively side-stepping challenges of explicit side-chain representations. Flow matching in this partially latent space then models the joint distribution over sequences and full-atom structures. La-Proteina supports a range of generation tasks, including all-atom co-design and atomistic motif scaffolding, unlocking critical atomistic structure-conditioned protein design tasks. Moreover, La-Proteina is able to generate proteins of up to 800 residues, demonstrating its scalability and robustness.'
