  ideas:
    0: 'Dense retrievers play a vital role in accessing external and specialized knowledge to augment language models (LMs). Training dense retrievers typically requires annotated query-document pairs, which are costly to create and scarce in specialized domains (e.g., code) or in complex settings (e.g., requiring reasoning). These practical challenges have sparked growing interest in self-supervised retriever learning.

      Since LMs are trained to capture token-level dependencies through a self-supervised learning objective (i.e., next token prediction), we can analogously cast retrieval as learning dependencies among chunks of tokens. This analogy naturally leads to the question: How can we adapt self‑supervised learning objectives in the spirit of language modeling to train retrievers?


      To answer this question, we introduce Revela, a unified and scalable training framework for self-supervised retriever learning via language modeling. Revela models semantic dependencies among documents by conditioning next token prediction on local and cross-document context through an in-batch attention mechanism. This attention is weighted by retriever-computed similarity scores, enabling the retriever to be optimized as part of language modeling. Without requiring annotated or synthetic query-document pairs, Revela offers a scalable approach to self-supervised retriever learning, with performance that increases with batch size and model size.'
    1: Representation learning methods are typically designed for a specific supervision paradigm, leading to representations that transfer poorly when the available supervision changes between training and deployment. We introduce Supervision-Agnostic Representation Learning (SARL), a unified framework that produces embeddings robust to shifts in supervision regimes. SARL jointly optimizes a shared encoder through a novel multi-regime objective that simultaneously enforces instance discrimination, cluster coherence, and class separability. A key component is our adaptive projection mechanism, which learns regime-specific projections while constraining the base representation to preserve information valuable across all supervision conditions. We further introduce supervision dropout during training, randomly masking label availability to prevent the encoder from over-specializing to any single paradigm. The resulting representations exhibit consistent downstream utility whether fine-tuned with abundant labels, few labels, or no labels at all. SARL addresses the practical reality that supervision availability is often uncertain or variable across deployment contexts, enabling practitioners to train once and deploy flexibly without representation degradation.
