  ideas:
    0: 'Meta-learning methods acquire inductive biases that enable rapid adaptation to new tasks, yet these biases remain static after meta-training, limiting generalization when task distributions shift over a system''s lifetime. We introduce Continual Meta-Adaptation (CMA), a framework that unifies meta-learning and lifelong learning by treating the adaptation mechanism itself as a continually evolving component. CMA maintains a structured memory of encountered task manifolds and employs a hierarchical update scheme: an inner loop adapts to individual tasks while an outer loop progressively refines the meta-parameters based on detected distributional drift. To prevent catastrophic forgetting of previously useful adaptation strategies, we propose meta-elastic weight consolidation, which identifies and protects parameters critical to past meta-knowledge. Additionally, a task-relatedness module dynamically routes incoming tasks to appropriate adaptation pathways, enabling selective knowledge transfer. CMA enables agents to not only learn new tasks efficiently but to fundamentally improve their learning algorithms over time, approaching the open-ended adaptability observed in biological intelligence. Our framework provides a principled foundation for systems that must operate autonomously across evolving environments without repeated human intervention.'
    1: 'Data-Free Robustness Distillation (DFRD) aims to transfer the robustness from the teacher to the student without accessing the training data. While existing methods focus on overall robustness, they overlook the robust fairness issues, leading to severe disparity of robustness across different categories. In this paper, we find two key problems: (1) student model distilled with equal class proportion data behaves significantly different across distinct categories; and (2) the robustness of student model is not stable across different attacks target. To bridge these gaps, we present the first Fairness Enhanced data-free Robustness Distillation (FERD) framework to adjust the proportion and distribution of adversarial examples. For the proportion, FERD adopts a robustness guided class reweighting strategy to synthesize more samples for the less robust categories, thereby improving robustness of them. For the distribution, FERD generates complementary data samples for advanced robustness distillation. It generates Fairness-Aware Examples (FAEs) by enforcing a uniformity constraint on feature-level predictions, which suppress the dominance of class-specific non-robust features, providing a more balanced representation across all categories. Then, FERD constructs Uniform-Target Adversarial Examples (UTAEs) from FAEs by applying a uniform target class constraint to avoid biased attack directions, which distribute the attack targets across all categories and prevents overfitting to specific vulnerable categories.'
