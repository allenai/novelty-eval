    0: Proof autoformalization, the task of translating natural language theorems and proofs into machine-verifiable code, is a critical step for integrating large language models into rigorous mathematical workflows. Current approaches focus on producing executable code, but they frequently fail to preserve the semantic meaning and logical structure of the original human-written argument. To address this, we introduce ProofFlow, a novel pipeline that treats structural fidelity as a primary objective. ProofFlow first constructs a directed acyclic graph (DAG) to map the logical dependencies between proof steps. Then, it employs a novel lemma-based approach to systematically formalize each step as an intermediate lemma, preserving the logical structure of the original argument. To facilitate evaluation, we present a new benchmark of 184 undergraduate-level problems, manually annotated with step-by-step solutions and logical dependency graphs, and introduce ProofScore, a new composite metric to evaluate syntactic correctness, semantic faithfulness, and structural fidelity.
    1: Integrating formal logical reasoning into neural networks remains challenging due to the fundamental tension between discrete symbolic operations and continuous gradient-based optimization. We introduce Neural Theorem Streams, a framework that embeds first-order logic inference as differentiable computation graphs within deep learning architectures. Our approach represents logical formulas as continuous vector fields over a learned manifold, where satisfiability corresponds to convergence toward fixed-point attractors. A novel relaxation of unification enables gradient flow through variable binding and substitution operations while preserving logical soundness guarantees. The framework supports both forward chaining for deductive reasoning and backward chaining for goal-directed inference, implemented as recurrent message-passing dynamics. Crucially, the learned representations maintain semantic compositionality—complex formula embeddings derive systematically from constituent parts—enabling generalization to unseen logical structures. Neural Theorem Streams can be inserted as reasoning modules within larger neural architectures, allowing end-to-end training where upstream perception and downstream decision-making co-adapt with the logical inference process. This unified treatment bridges the gap between neural pattern recognition and formal symbolic reasoning without requiring explicit discretization or reinforcement learning.
