    0: Mechanistic interpretability has advanced our understanding of individual neural network components, yet explaining how these components orchestrate during inference remains elusive. We introduce Information Flow Dynamics (IFD), a framework that models neural network inference as a continuous dynamical system where information propagates, transforms, and potentially degrades across computational stages. IFD employs differentiable information-theoretic probes inserted between layers to track how task-relevant signals evolve throughout forward passes. By computing real-time mutual information estimates between intermediate representations and target variables, our method constructs dynamic information trajectories that reveal computational bottlenecks, redundant pathways, and critical transformation points. We further introduce flow perturbation analysis, which applies minimal interventions to intermediate states and measures downstream information consequences, enabling causal identification of essential versus dispensable computational routes. IFD provides a unified lens connecting static component-level interpretability with holistic model behavior, offering practitioners diagnostic tools to understand not merely which features matter, but precisely where and how models succeed or fail in their reasoning process. The framework generalizes across architectures and naturally extends to comparing information dynamics between models exhibiting different capabilities or failure modes.
    1: Finetuning (pretrained) language models is a standard approach for updating their internal parametric knowledge and specializing them to new tasks and domains. However, the corresponding model weight changes ("weight diffs") are not generally interpretable. While inspecting the finetuning dataset can give a sense of how the model might have changed, these datasets are often not publicly available or are too large to work with directly. Towards the goal of broadly understanding model weight changes in natural language, we introduce Diff Interpretation Tuning (DIT), a method that trains models to describe their own finetuning-induced modifications. Our approach uses synthetic, labeled weight diffs to train an introspection adapter, which can be applied to a compatible finetuned model to make it self-describe the weight changes. We consider two proof-of-concept settings—reporting hidden behaviors and summarizing finetuned knowledge—in which models describe their finetuning-induced modifications using concise natural language descriptions.
