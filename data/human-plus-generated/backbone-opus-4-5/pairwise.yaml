    0: 'The rapid integration of agentic AI into high-stakes real-world applications requires robust oversight mechanisms. The emerging field of AI Control (AIC) aims to provide such an oversight mechanism, but practical adoption depends heavily on implementation overhead. To study this problem better, we introduce the notion of Control tax---the operational and financial cost of integrating control measures into AI pipelines. Our work makes three key contributions to the field of AIC: (1) we introduce a theoretical framework that quantifies the Control Tax and maps classifier performance to safety assurances; (2) we formalize adversarial settings where attacker models insert subtle backdoors into code while monitoring models attempt to detect these vulnerabilities; and (3) we provide empirical financial cost estimates for control protocols and develop optimized monitoring strategies that balance safety and cost-effectiveness while accounting for practical constraints like auditing budgets. Our framework enables practitioners to make informed decisions by systematically connecting safety guarantees with their costs, advancing AIC through principled economic feasibility assessment across different deployment contexts.'
    1: Aligning large language models with human values through preference learning requires aggregating feedback from diverse annotators, yet this process risks both privacy violations through preference data centralization and fairness harms when annotator pools lack demographic diversity. We introduce Federated Pluralistic Alignment, a framework that learns from distributed human preferences without exposing individual feedback to central servers while ensuring the aligned model reflects a balanced plurality of human values. Our approach combines secure aggregation of preference gradients with a novel fairness-aware reweighting mechanism that detects and corrects for demographic imbalances in the federated annotator population. A key technical contribution is our differentially private preference aggregation protocol, which provides formal guarantees against reconstructing individual annotators' value profiles from model updates. To address the challenge that demographic attributes themselves are sensitive, we introduce a method for implicit fairness correction that operates on preference patterns rather than explicit group labels. Federated Pluralistic Alignment enables scalable alignment from globally distributed human feedback while jointly satisfying privacy preservation, demographic fairness, and value pluralism—three properties essential for deploying aligned AI systems in diverse societies.
