    0: We present a novel geometric perspective on the latent space of diffusion models. We first show that the standard pullback approach, utilizing the deterministic probability flow ODE decoder, is fundamentally flawed. It provably forces geodesics to decode as straight segments in data space, effectively ignoring any intrinsic data geometry beyond the ambient Euclidean space. Complementing this view, diffusion also admits a stochastic decoder via the reverse SDE, which enables an information geometric treatment with the Fisher-Rao metric. However, a choice of $\mathbf{x}_T$ as the latent representation collapses this metric due to memorylessness. We address this by introducing a latent spacetime $\mathbf{z}=(\mathbf{x}_t,t)$ that indexes the family of denoising distributions $p(\mathbf{x}_0 | \mathbf{x}_t)$ across all noise scales, yielding a nontrivial geometric structure. We prove these distributions form an exponential family and derive simulation-free estimators for curve lengths, enabling efficient geodesic computation. The resulting structure induces a principled Diffusion Edit Distance, where geodesics trace minimal sequences of noise and denoise edits between data. We also propose applications to transition path sampling in molecular systems, including constrained variants such as low-variance transitions and region avoidance.
    1: Diffusion models have emerged as powerful generative frameworks, yet they apply uniform computational effort across all regions of the data manifold, ignoring the varying complexity of different samples and their substructures. We introduce Curvature-Aware Diffusion, a generative framework that learns to estimate local manifold geometry and dynamically adapts the denoising process accordingly. Our approach augments standard diffusion models with a lightweight curvature estimation network that predicts the local complexity of the generation trajectory at each step. High-curvature regions, corresponding to intricate details or rare patterns, receive additional refinement through adaptive step sizing and increased model capacity, while low-curvature regions are efficiently traversed with larger steps. We derive a theoretical connection between manifold curvature and optimal denoising schedules, showing that geometry-aware generation provably reduces approximation error in regions of high data complexity. The framework naturally enables spatially-varying computation within individual samples, allocating resources to challenging substructures while maintaining efficiency elsewhere. Curvature-Aware Diffusion provides a principled approach to adaptive generation that respects the intrinsic geometry of complex data distributions.
