    0: Graph neural networks assume access to a reliable graph structure, yet real-world relational data often exhibit topological uncertainty arising from noisy observations, missing edges, or inherent ambiguity in defining connectivity. We introduce Topological Belief Propagation Networks, a framework that learns representations robust to structural uncertainty by reasoning over a posterior distribution of plausible topologies rather than a single fixed graph. Our approach parameterizes a variational distribution over graph structures conditioned on node features and any observed edges, then performs message passing that marginalizes over this structural belief. To make inference tractable, we derive a low-rank factorization of the topology distribution and develop a reparameterizable sampling scheme compatible with end-to-end gradient-based learning. The framework naturally incorporates prior knowledge about expected structural properties through topological regularizers inspired by persistent homology, encouraging learned distributions to concentrate on graphs with desired multi-scale connectivity patterns. This unified treatment of representation learning and structure inference enables principled handling of incomplete graphs, graceful degradation under edge noise, and transfer across domains where topological assumptions differ.
    1: 'Multi-domain graph pre-training integrates knowledge from diverse domains to enhance performance in the target domains, which is crucial for building graph foundation models. Despite initial success, existing solutions often fall short of answering a fundamental question: how is knowledge integrated or transferred across domains? This theoretical limitation motivates us to rethink the consistency and transferability between the pre-trained model and target domains. In this paper, we propose a fresh differential geometry perspective, whose core idea is to merge any graph dataset into a unified, smooth Riemannian manifold, enabling a systematic understanding of knowledge integration and transfer. To achieve this, our key contribution is the theoretical establishment of neural manifold gluing, which first characterizes local geometry using an adaptive orthogonal frame and then "glues" the local pieces together into a coherent whole. Building on this theory, we present the GraphGlue framework, which supports batched pre-training with EMA prototyping and provides a transferability measure based on geometric consistence. Moreover, GraphGlue reveals a geometric scaling law, showing that larger quantities of datasets improve model transferability by producing a smoother manifold.'
