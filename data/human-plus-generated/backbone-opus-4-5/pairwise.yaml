    0: Modeling wind-driven object dynamics from video observations is highly challenging due to the invisibility and spatio–temporal variability of wind, as well as the complex deformations of objects. We present DiffWind, a physics-informed differentiable framework that unifies wind–object interaction modeling, video-based reconstruction, and forward simulation. Specifically, we represent wind as a grid-based physical field and objects as particle systems derived from 3D Gaussian Splatting, with their interaction modeled by the Material Point Method (MPM). To recover wind-driven object dynamics, we introduce a reconstruction framework that jointly optimizes the spatio–temporal wind force field and object motion through differentiable rendering and simulation. To ensure physical validity, we incorporate the Lattice Boltzmann Method (LBM) as a physics-informed constraint, enforcing compliance with fluid dynamics laws. Beyond reconstruction, our method naturally supports forward simulation under novel wind conditions and enables new applications such as wind retargeting. We further introduce WD-Objects, a dataset of synthetic and real-world wind-driven scenes, opening a new avenue for video-based wind–object interaction modeling.
    1: Multimodal learning systems typically assume all modalities are available during inference, yet real-world deployment frequently encounters missing, corrupted, or asynchronous inputs across vision, audio, and language streams. We introduce Geometric Anchor Networks (GANets), a framework that enables robust multimodal reasoning under arbitrary modality absence without requiring modality-specific retraining or explicit imputation. GANets learn a set of modality-agnostic anchor points in a shared representation space that capture cross-modal semantic correspondences. When modalities are missing, these anchors serve as geometric bridges, enabling the model to traverse the latent manifold and recover task-relevant information through learned cross-modal transformations. A dynamic routing mechanism attends to available modalities while leveraging anchor-mediated paths to compensate for absent ones. The framework is trained with a novel dropout curriculum that systematically varies modality availability, encouraging the emergence of robust geometric structure. GANets provide a unified architecture for vision-language, audio-visual, and trimodal tasks that maintains consistent performance regardless of which input streams are present at inference time, addressing a critical gap between laboratory multimodal models and practical deployment requirements.
