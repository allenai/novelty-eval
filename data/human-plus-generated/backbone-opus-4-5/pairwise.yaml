  ideas:
    0: 'Large Language Models (LLMs) are conversational interfaces. As such, LLMs have the potential to assist their users not only when they can fully specify the task at hand, but also to help them define, explore, and refine what they need through multi-turn conversational exchange. Although analysis of LLM conversation logs has confirmed that underspecification occurs frequently in user instructions, LLM evaluation has predominantly focused on the single-turn, fully-specified instruction setting. In this work, we perform large-scale simulation experiments to compare LLM performance in single- and multi-turn settings. Our experiments confirm that all the top open- and closed-weight LLMs we test exhibit significantly lower performance in multi-turn conversations than single-turn. Analysis of 200,000+ simulated conversations decomposes the performance degradation into two components: a minor loss in aptitude and a significant increase in unreliability. We find that LLMs often make assumptions in early turns and prematurely attempt to generate final solutions, on which they overly rely. In simpler terms, we discover that when LLMs take a wrong turn in a conversation, they get lost and do not recover.'
    1: 'Static benchmarks face fundamental limitations: they saturate as models improve, risk contamination through training data overlap, and provide coarse-grained signals that obscure specific capability gaps. We introduce ComposeEval, a procedural benchmark generation framework that dynamically synthesizes evaluation instances by composing atomic reasoning primitives through formal grammars. Rather than curating fixed test sets, ComposeEval defines a space of possible problems parameterized by primitive skills (arithmetic, logical inference, entity tracking, temporal reasoning, etc.), composition operators (sequencing, nesting, conditioning), and difficulty scaling functions. Each evaluation instance is generated on-the-fly with full provenance, enabling contamination-free assessment, systematic complexity control, and fine-grained skill attribution. The framework supports automatic diagnosis of model weaknesses by decomposing performance across the compositional structure, revealing which primitive skills and composition patterns cause failures. ComposeEval bridges the gap between controlled synthetic evaluation and naturalistic complexity, providing researchers with an inexhaustible, interpretable, and manipulation-resistant evaluation methodology. We release the generation engine, a library of extensible reasoning primitives, and protocols for community-driven primitive development.'
