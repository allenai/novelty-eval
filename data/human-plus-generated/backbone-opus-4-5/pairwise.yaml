    0: 'Score-based methods, such as diffusion models and Bayesian inverse problems, are often interpreted as learning the data distribution in the low-noise limit ($\sigma \to 0$). In this work, we propose an alternative perspective: their success arises from implicitly learning the data manifold rather than the full distribution. Our claim is based on a novel analysis of scores in the small-$\sigma$ regime that reveals a sharp separation of scales: information about the data manifold is $\Theta(\sigma^{-2})$ stronger than information about the distribution. We argue that this insight suggests a paradigm shift from the less practical goal of distributional learning to the more attainable task of geometric learning, which provably tolerates $O(\sigma^{-2})$ larger errors in score approximation. We illustrate this perspective through three consequences: i) in diffusion models, concentration on data support can be achieved with a score error of $o(\sigma^{-2})$, whereas recovering the specific data distribution requires a much stricter $o(1)$ error; ii) more surprisingly, learning the uniform distribution on the manifold—an especially structured and useful object—is also $O(\sigma^{-2})$ easier; and iii) in Bayesian inverse problems, the maximum entropy prior is $O(\sigma^{-2})$ more robust to score errors than generic priors.'
    1: Generative models typically learn monolithic mappings from noise to data, entangling diverse factors of variation into opaque representations. We introduce Compositional Diffusion Primitives, a framework that decomposes the generative process into a library of modular, reusable generation modules that can be dynamically composed during sampling. Each primitive specializes in generating particular aspects of the data—such as structure, texture, or semantic attributes—while a lightweight routing mechanism learns to orchestrate their contributions across diffusion timesteps. Primitives are discovered through a novel objective that encourages both specialization and composability, enabling zero-shot generalization to novel factor combinations unseen during training. A key insight is that different primitives naturally activate at different noise levels, mirroring the coarse-to-fine hierarchy inherent in diffusion processes. Our framework supports primitive arithmetic, where adding or removing primitives systematically modifies generated outputs, and enables efficient domain adaptation by learning only new primitives while freezing existing ones. Compositional Diffusion Primitives bridge generative modeling with compositional representation learning, offering a path toward more interpretable, controllable, and systematically generalizable generation.
