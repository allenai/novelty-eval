  ideas:
    0: 'Mechanistic interpretability methods typically produce static, post-hoc explanations of neural network behavior, analyzing circuits and features after computation has occurred. This reactive paradigm limits our ability to anticipate model behavior in novel situations or detect potentially problematic computations before they manifest. We introduce Predictive Circuit Analysis, a framework that learns to forecast which computational circuits will activate and how features will compose based on input characteristics alone. Our approach trains a lightweight meta-interpreter network that takes input embeddings and predicts the activation patterns of previously identified circuits, feature superposition configurations, and attention head compositions. By learning the mapping from input space to mechanistic behavior, the meta-interpreter captures context-dependent dynamics that static analysis methods miss. This enables anticipatory interpretability: predicting mechanistic behavior on unseen inputs, identifying input regions likely to trigger specific circuits, and flagging potential misalignment before forward passes complete. The framework naturally extends to detecting distribution shifts through prediction uncertainty and discovering new circuits by identifying systematic prediction failures. Predictive Circuit Analysis transforms interpretability from retrospective explanation to prospective understanding of neural network computation.'
    1: We propose Low-Rank Sparse Attention (Lorsa), a sparse replacement model of Transformer attention layers to disentangle original Multi Head Self Attention (MHSA) into individually comprehensible components. Lorsa is designed to address the challenge of \textit{attention superposition} to understand attention-mediated interaction between features in different token positions. Lorsa helps find cleaner and finer-grained versions of previously discovered MHSA behaviors like induction heads, successor heads, attention sink, and a comprehensive family of arithmetic-specific Lorsa heads. Interestingly, we identify a novel head type called \emph{subtoken induction heads} that function at character level rather than token level. We also conduct extensive experiments on architectural design ablation, correlation to original MHSA heads and error analysis. Our early attempt to fully sparsify a toy Transformer succeeds to reveal clean global circuits. Eventually, we hope Lorsa would help us greatly understand attention computation and enable full sparsification of model computation along with its MLP counterparts.
