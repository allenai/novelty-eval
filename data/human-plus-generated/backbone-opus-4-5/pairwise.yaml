    0: The Maximum Common Edge Subgraph (MCES) problem is a crucial challenge with significant implications in domains such as biology and chemistry. Traditional approaches, which include transformations into max-clique and search-based algorithms, suffer from scalability issues when dealing with larger instances. This paper introduces ``Neural Graduated Assignment'' (NGA), a simple, scalable, unsupervised-training-based method that addresses these limitations. Central to NGA is stacking of differentiable assignment optimization with neural components, enabling high-dimensional parameterization of the matching process through a learnable temperature mechanism. We further theoretically analyze the learning dynamics of NGA, showing its design leads to fast convergence, better exploration-exploitation tradeoff, and ability to escape local optima. The introduction of NGA marks a significant advancement in the computation of MCES and offers insights into other assignment problems.
    1: 'Graph neural networks assume a fixed input topology, yet real-world relational data often admits multiple plausible geometric interpretations or contains structural uncertainty. We introduce Topologically Persistent Representations (TPR), a framework for learning embeddings that remain stable across a distribution of candidate topologies rather than committing to a single graph structure. TPR maintains a filtration over possible edge configurations, parameterized by confidence thresholds on edge existence, and enforces representation consistency across this filtration through a novel persistence-inspired regularization objective. Features that remain invariant under topological perturbations are amplified, while topology-sensitive components are explicitly disentangled and flagged as structurally uncertain. Our framework extends naturally to heterogeneous geometries, enabling unified learning across graphs, simplicial complexes, and cell complexes by treating them as points along a topological filtration. TPR provides built-in uncertainty quantification: predictions are accompanied by topological confidence intervals indicating sensitivity to structural assumptions. The approach offers a principled connection between persistent homology and geometric deep learning, ensuring that learned representations reflect genuine relational patterns rather than artifacts of potentially misspecified topology.'
