    0: 'Static benchmarks have driven remarkable progress in natural language processing, yet they suffer from rapid saturation, annotation artifacts, and misalignment with real-world capabilities. We introduce EvolBench, a dynamic benchmarking framework where evaluation sets co-evolve with model capabilities through human-AI collaboration. EvolBench operates through an adversarial generation loop: current frontier models propose challenging instances targeting specific reasoning capabilities, while a separate verification pipeline—combining model-based filtering with expert human curation—ensures quality and removes spurious examples. The framework maintains difficulty calibration through adaptive sampling, automatically retiring solved instances while introducing novel challenges that probe emerging capability boundaries. Unlike static datasets, EvolBench provides version-controlled evaluation snapshots enabling fair temporal comparisons while continuously refreshing its core to resist overfitting and shortcut learning. We formalize desiderata for living benchmarks, including discriminative stability, construct validity preservation, and contamination resistance. EvolBench supports modular capability taxonomies allowing researchers to diagnose specific reasoning failures rather than aggregate performance. Our framework establishes infrastructure for sustainable evaluation that scales alongside model development, shifting the paradigm from benchmark-as-artifact to benchmark-as-process.'
    1: Precise, object-aware control over visual content is essential for advanced image editing and compositional generation. Yet, most existing approaches operate on entire images holistically, limiting the ability to isolate and manipulate individual scene elements. In contrast, layered representations, where scenes are explicitly separated into objects, environmental context, and visual effects, provide a more intuitive and structured framework for interpreting and editing visual content. To bridge this gap and enable both compositional understanding and controllable editing, we introduce the Referring Layer Decomposition (RLD) task, which predicts complete RGBA layers from a single RGB image, conditioned on flexible user prompts, such as spatial inputs (e.g., points, boxes, masks), natural language descriptions, or combinations thereof. At the core is the RefLade, a large-scale dataset comprising 1.11M image–layer–prompt triplets produced by our scalable data engine, along with 100K manually curated, high-fidelity layers. Coupled with a perceptually grounded, human-preference-aligned automatic evaluation protocol, RefLade establishes RLD as a well-defined and benchmarkable research task. Building on this foundation, we present RefLayer, a simple baseline designed for prompt-conditioned layer decomposition, achieving high visual fidelity and semantic alignment.
