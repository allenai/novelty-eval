    0: Multi-modal entity alignment (MMEA) aims to identify equivalent entities across heterogeneous multi-modal knowledge graphs (MMKGs), where each entity is described by attributes from various modalities. Existing methods typically assume that both intra-entity and inter-graph correspondences are faultless, which is often violated in real-world MMKGs due to the reliance on expert annotations. In this paper, we reveal and study a highly practical yet under-explored problem in MMEA, termed Dual-level Noisy Correspondence (DNC). DNC refers to misalignments in both intra-entity (entity-attribute) and inter-graph (entity-entity and attribute-attribute) correspondences. To address the DNC problem, we propose a robust MMEA framework termed RULE. RULE first estimates the reliability of both intra-entity and inter-graph correspondences via a dedicated two-fold principle. Leveraging the estimated reliabilities, RULE mitigates the negative impact of intra-entity noise during attribute fusion and prevents overfitting to noisy inter-graph correspondences during inter-graph discrepancy elimination. Beyond the training-time designs, RULE further incorporates a correspondence reasoning module that uncovers the underlying attribute-attribute connection across graphs, guaranteeing more accurate equivalent entity identification.
    1: 'Current representation learning methods operate within distinct paradigms—supervised, self-supervised, semi-supervised, and unsupervised—each imposing different inductive biases that can conflict when combined naively. We propose Geometric Consensus Learning (GCL), a unified framework that harmonizes these paradigms through explicit alignment of local neighborhood structures across supervision regimes. GCL introduces a consensus objective that encourages representations to preserve geometric relationships consistently, whether discovered through contrastive self-supervision, cluster structure, or label-induced similarities. Rather than treating supervision signals hierarchically, GCL allows each paradigm to mutually regularize the others: self-supervised neighborhoods prevent supervised collapse to discriminative-only features, while sparse labels guide self-supervised learning toward semantically coherent manifolds. The framework introduces learnable consensus weights that dynamically balance contributions based on local geometric agreement, enabling graceful interpolation across the supervision spectrum. GCL provides a principled approach to leverage heterogeneous supervision signals within a single geometric objective, offering a foundation for representation learning that adapts fluidly to varying annotation availability without architectural changes or multi-stage training.'
