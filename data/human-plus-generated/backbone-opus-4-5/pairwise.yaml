    0: 'Classical learning theory treats hypothesis classes as unstructured sets, providing generalization bounds that fail to capture the sample efficiency gains possible when target functions exhibit compositional structure. We introduce a compositional learning framework that explicitly models hypotheses as compositions of primitive functions drawn from base classes. Our framework defines new complexity measures—compositional depth, primitive diversity, and reuse degree—that characterize how functions are built from simpler components. We derive generalization bounds that scale with these compositional complexity measures rather than the complexity of the full hypothesis class, revealing when compositional structure provably reduces sample requirements. Central to our analysis is the concept of compositional stability: the property that learning primitives in isolation transfers to learning their compositions. We establish necessary and sufficient conditions for compositional stability and show that standard empirical risk minimization fails to exploit compositional structure, motivating a modular learning algorithm with provable compositional generalization guarantees. Our framework provides theoretical grounding for curriculum learning strategies and explains the empirical observation that models benefit from learning simpler subtasks before complex compositions. This work establishes foundations for a compositionality-aware learning theory aligned with structured reasoning in modern AI systems.'
    1: We develop a theory of transfer learning in infinitely wide neural networks under gradient flow that quantifies when pretraining on a source task improves generalization on a target task. We analyze both (i) fine-tuning, when the downstream predictor is trained on top of source-induced features and (ii) a jointly rich setting, where both pretraining and downstream tasks can operate in a feature learning regime, but the downstream model is initialized with the features obtained after pre-training. In this setup, the summary statistics of randomly initialized networks after a rich pre-training are adaptive kernels which depend on both source data and labels. For (i), we analyze the performance of a readout for different pretraining data regimes. For (ii), the summary statistics after learning the target task are still adaptive kernels with features from both source and target tasks. Our theory allows interpretable conclusions on performance, which depend on the amount of data on both tasks, the alignment between tasks, and the feature learning strength.
