  ideas:
    0: 'Understanding how distributed neural populations implement cognitive computations remains a fundamental challenge in neuroscience. We introduce NeuroCognitive Transformers (NCT), a framework that learns a unified embedding space bridging neural population dynamics and cognitive computational primitives. NCT is pre-trained on large-scale multi-region neural recordings using a masked dynamics objective that captures spatiotemporal structure across diverse behaviors and brain areas. Crucially, we introduce a cognitive grounding mechanism that aligns learned neural representations with structured descriptions of computational operations—including attention, working memory maintenance, evidence accumulation, and prediction error signaling. This alignment is achieved through contrastive learning between neural trajectory segments and compositional cognitive program embeddings. The resulting model enables bidirectional translation: inferring active cognitive operations from neural recordings, and predicting population dynamics given cognitive task descriptions. NCT supports zero-shot generalization to novel cognitive paradigms by compositionally combining learned primitive operations. Our framework provides a computational tool for generating testable hypotheses about neural implementations of cognition and offers a foundation for interpretable neural population analysis grounded in cognitive theory.'
    1: 'Normative and task-driven theories offer powerful top-down explanations for biological systems, yet the goals of quantitatively arbitrating between competing theories, and utilizing them as inductive biases to improve data-driven fits of real biological datasets are prohibitively laborious, and often impossible. To this end, we introduce a Bayesian meta-learning framework designed to automatically convert raw functional predictions from normative theories into tractable probabilistic models.

      We employ adaptive deep kernel Gaussian processes, meta-learning a kernel on synthetic data generated from a normative theory. This Theory-Informed Kernel specifies a probabilistic model representing the predictions of a given theoretical model: usable for both fitting data and rigorously validating the theory. As a demonstration, we apply our framework to the early visual system, using efficient coding as our normative theory.

      Using exact Bayesian model selection, the informed kernel can infer the degree of theory-match from data, enabling faithful encapsulation of theory structure. This work provides a more general, scalable, and automated approach for integrating theoretical knowledge into data-driven scientific inquiry in neuroscience and beyond.'
