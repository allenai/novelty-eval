    0: 'As machine learning benchmarks proliferate, the community lacks principled methods to assess the quality and continued utility of evaluation resources themselves. Benchmarks may suffer from saturation, contamination, poor difficulty calibration, or narrow skill coverage—issues that undermine their validity as progress indicators. We introduce MetaBench, a framework for systematically evaluating datasets and benchmarks along multiple axes of quality. MetaBench characterizes benchmarks through complementary lenses: discriminative power (ability to distinguish model capabilities), contamination susceptibility (robustness to training data overlap), difficulty dynamics (calibration across the performance spectrum), and construct validity (alignment between measured and intended skills). The framework employs a suite of probe models and statistical tests to generate interpretable diagnostic profiles for any benchmark. We further propose a temporal tracking protocol that monitors benchmark health over time, detecting saturation points and identifying when new evaluation resources are needed. MetaBench provides a foundation for evidence-based benchmark selection, retirement decisions, and the principled design of future evaluation suites, shifting community discourse from ad-hoc benchmark proliferation toward systematic quality assurance of our measurement instruments.'
    1: 'Although Multimodal Large Language Models (MLLMs) have demonstrated proficiency in video captioning, practical applications require captions that follow specific user instructions rather than generating exhaustive, unconstrained descriptions. Current benchmarks, however, primarily assess descriptive comprehensiveness while largely overlook instruction-following capabilities. To address this gap, we introduce IF-VidCap, a new benchmark for evaluating controllable video captioning, which contains 1,400 high-quality samples. Distinct from existing video captioning or general instruction-following benchmarks, IF-VidCap incorporates a systematic framework that assesses captions on two dimensions: format correctness and content correctness.'
