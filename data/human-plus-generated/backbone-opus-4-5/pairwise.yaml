  ideas:
    0: We study the problem of fixed budget pure exploration in reinforcement learning. The goal is to identify a near-optimal policy, given a fixed budget on the number of interactions with the environment. Unlike the standard PAC setting, we do not require the target error level $\epsilon$ and failure rate $\delta$ as input. We propose novel algorithms and provide, to the best of our knowledge, the first instance-dependent $\epsilon$-uniform guarantee, meaning that the probability that $\epsilon$-correctness is ensured can be obtained simultaneously for all $\epsilon$ above a budget-dependent threshold. It characterizes the budget requirements in terms of the problem-specific hardness of exploration. As a core component of our analysis, we derive a $\epsilon$-uniform guarantee for the multiple bandit problem—solving multiple multi-armed bandit instances simultaneously—which may be of independent interest. To enable our analysis, we also develop tools for reward-free exploration under the fixed-budget setting, which we believe will be useful for future work.
    1: 'Classical learning theory analyzes generalization for isolated learners operating on fixed data distributions, yet modern machine learning increasingly involves populations of agents that learn simultaneously and influence one another''s effective learning dynamics. We introduce Population PAC Learning, a theoretical framework that extends probably approximately correct learning to multi-agent settings where learners interact through shared environments, competing objectives, or information exchange. Our framework defines a new notion of collective generalization that captures how inter-agent dependencies propagate estimation errors across the population. We derive interaction-aware complexity measures that generalize Rademacher complexity by incorporating terms reflecting the coupling strength between learners'' hypothesis spaces. Central to our analysis is the stability-interaction tradeoff: tighter coupling can either regularize individual learners through implicit averaging effects or amplify overfitting through correlated errors, depending on the interaction topology. We establish sufficient conditions under which populations of bounded-capacity learners achieve better per-agent generalization than isolated learning, formalizing when collaboration provably helps. Our framework provides theoretical foundations for analyzing generalization in federated learning, multi-agent reinforcement learning, and strategic classification settings where the traditional i.i.d. assumption fundamentally breaks down.'
