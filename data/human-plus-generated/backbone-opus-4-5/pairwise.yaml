  ideas:
    0: 'Post-hoc explanation methods provide static snapshots of model reasoning, yet deployed models continuously evolve through updates, fine-tuning, and distribution shifts. Understanding how and why explanations change over time remains largely unexplored, limiting our ability to maintain trust in adaptive systems. We introduce Explanation Drift Tracking, a framework for monitoring the temporal dynamics of model interpretations across learning episodes. Our approach defines explanation trajectories in a unified attribution space and employs optimal transport to quantify semantic distances between explanation distributions at different temporal checkpoints. We propose a decomposition that disentangles explanation changes into three components: knowledge acquisition (new valid reasoning patterns), knowledge refinement (improved feature weighting), and reasoning corruption (adoption of spurious correlations). A lightweight detector identifies critical drift events that warrant human review without requiring access to ground-truth rationales. The framework operates model-agnostically over any gradient-based attribution method and introduces temporal coherence regularization that encourages stable explanations during training when underlying concepts remain constant. Explanation Drift Tracking enables practitioners to audit not just what a model currently believes, but how its reasoning has evolved.'
    1: 'Large language models (LLMs) often exhibit flawed reasoning ability that undermines reliability. Existing approaches to improving reasoning typically treat it as a general and monolithic skill, applying broad training that is inefficient and unable to target specific reasoning errors. We introduce Reasoning Editing, a paradigm for selectively modifying specific reasoning patterns in LLMs while preserving other reasoning pathways. This task presents a fundamental trade-off between Generality, the ability of an edit to generalize across different tasks sharing the same reasoning pattern, and Locality, the ability to preserve other reasoning capabilities. Through systematic investigation, we uncover the Circuit-Interference Law: edit interference between reasoning patterns is proportional to the overlap of their neural circuits. Guided by this principle, we propose REdit, the first framework to actively reshape neural circuits before editing, thereby modulating interference between reasoning patterns and mitigating the trade-off. REdit integrates three components: (i) Contrastive Circuit Reshaping, which directly addresses the generality-locality trade-off by disentangling overlapping circuits; (ii) Meta-Contrastive Learning, which extends transferability to novel reasoning patterns; and (iii) Dual-Level Protection, which preserves preexisting abilities by constraining reshaping update directions and regularizing task-level predictions.'
