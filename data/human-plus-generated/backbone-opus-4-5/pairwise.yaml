    0: Evaluating tabular generators remains a challenging problem, as the unique causal structural prior of heterogeneous tabular data does not lend itself to intuitive human inspection. Recent work has introduced structural fidelity as a tabular-specific evaluation dimension to assess whether synthetic data complies with the causal structures of real data. However, existing benchmarks often neglect the interplay between structural fidelity and conventional evaluation dimensions, thus failing to provide a holistic understanding of model performance. Moreover, they are typically limited to toy datasets, as quantifying existing structural fidelity metrics requires access to ground-truth causal structures, which are rarely available for real-world datasets. In this paper, we propose a novel evaluation framework that jointly considers structural fidelity and conventional evaluation dimensions. We introduce a new evaluation metric, global utility, which enables the assessment of structural fidelity even in the absence of ground-truth causal structures. In addition, we present TabStruct, a comprehensive evaluation benchmark offering large-scale quantitative analysis on 13 tabular generators from nine distinct categories, across 29 datasets.
    1: Current language model benchmarks predominantly evaluate tasks in isolation, failing to capture the cognitive demands of realistic deployment where users rapidly alternate between heterogeneous objectives within a single session. We introduce INTERLEAVE, a benchmark designed to measure task-switching robustness and cross-task interference in large language models. INTERLEAVE constructs controlled evaluation sequences that interleave diverse task types—mathematical reasoning, code generation, creative writing, factual recall, and instruction following—with systematic variation in switching patterns, context lengths, and task similarities. Beyond per-task accuracy, INTERLEAVE introduces novel metrics quantifying forward interference (how preceding tasks degrade subsequent performance), backward interference (retroactive context corruption), recovery trajectories (steps needed to regain baseline performance after switches), and coherence maintenance (consistency of persona, style, and constraints across interruptions). The benchmark includes both naturalistic conversation flows derived from real usage patterns and adversarial sequences designed to maximize interference. INTERLEAVE enables researchers to diagnose failure modes invisible to standard evaluation, guiding the development of models that maintain robust, consistent capabilities under the dynamic cognitive loads characteristic of practical deployment.
