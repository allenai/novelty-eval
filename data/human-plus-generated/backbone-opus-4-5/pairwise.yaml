  ideas:
    0: 'The paradigm shift in large language models (LLMs) from instinctive responses to chain-of-thought (CoT) reasoning has fueled two prevailing assumptions: (1) reasoning capabilities only emerge in sufficiently large models, and (2) such capabilities require training on massive datasets. While the first assumption has already been challenged by recent sub-billion-parameter reasoning models such as Qwen3-0.6B and DeepSeek distilled variants, the second remains largely unquestioned. In this work, we revisit the necessity of scaling to extremely large corpora (>10T tokens) for reasoning emergence. By carefully curating and resampling open-source datasets that we identify as beneficial under our designed metrics, we demonstrate that strong reasoning abilities can emerge with far less data. Specifically, we show that only ~2T tokens of high-quality data are sufficient, and pre-training with 4.2T tokens on the dataset resampled from these ~2T tokens, followed by an established post-training procedure, enables the development of MobileLLM-R1, a series of sub-billion-parameter reasoning models. To facilitate further research in this direction, we have made the models and code publicly available, along with the complete training recipe, data sources, and data mixing ratios.'
    1: Large language models exhibit degraded coherence and reasoning fidelity as inference chains extend beyond typical context lengths, limiting their effectiveness for complex multi-step tasks. We introduce Recursive Reasoning Anchors (RRA), a self-supervised framework that enables LLMs to dynamically compress, consolidate, and restructure intermediate reasoning states during extended generation. RRA augments transformer architectures with a lightweight anchor module that learns to identify salient reasoning milestones, compress them into compact latent representations, and inject these anchors back into the model's hidden states as persistent reasoning scaffolds. Unlike external memory systems, anchors remain internal to the forward pass, preserving end-to-end differentiability while circumventing quadratic attention costs over full reasoning traces. A curriculum-based training procedure teaches the model to progressively extend reasoning horizons by bootstrapping from shorter successful chains. The anchor compression objective encourages information-theoretic efficiency, retaining only reasoning-critical content. RRA provides a principled mechanism for maintaining coherent goal-directed reasoning across hundreds of inference steps, opening new possibilities for autonomous problem-solving, long-horizon planning, and extended analytical tasks.
