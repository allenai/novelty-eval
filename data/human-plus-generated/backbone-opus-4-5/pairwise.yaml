    0: Multi-physics simulations coupling distinct physical phenomena—such as fluid-structure interactions, thermo-mechanical systems, and electrochemical processes—are fundamental to engineering and scientific discovery, yet remain computationally prohibitive. Existing neural surrogate approaches typically target isolated physics domains, failing to capture the complex bidirectional dependencies at domain interfaces. We introduce Compositional Physics Operators (CPO), a modular neural framework for learning coupled multi-physics systems. CPO represents each physical domain through specialized neural operators while learning universal coupling modules that transfer information across domain boundaries. These coupling modules are constrained to preserve fundamental conservation laws, ensuring physical consistency without explicit supervision. A key insight is decomposing the coupling into geometry-aware interface detection and physics-agnostic flux matching, enabling zero-shot composition of independently trained single-physics modules into novel multi-physics configurations. The framework supports heterogeneous discretizations across domains and naturally handles evolving interfaces. CPO enables rapid virtual prototyping of complex physical systems by treating physics modules as composable building blocks, opening pathways toward foundation models for scientific simulation.
    1: 'We introduce Kolmogorov–Arnold Neural Operator (KANO), a dual‑domain neural operator jointly parameterized by both spectral and spatial bases with intrinsic symbolic interpretability. We theoretically demonstrate that KANO overcomes the pure-spectral bottleneck of Fourier Neural Operator (FNO): KANO remains expressive over a generic position-dependent dynamics for any physical input, whereas FNO stays practical only to spectrally sparse operators and strictly imposes fast-decaying input Fourier tail.'
