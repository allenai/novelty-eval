    0: Large language models exhibit degraded coherence and reasoning fidelity as task complexity increases, often losing track of intermediate conclusions across extended generation. We introduce Reflexive Memory Routing, a method that repurposes attention heads within transformer layers as explicit memory controllers, enabling models to read from, write to, and iteratively refine their own hidden representations during inference. Rather than appending external memory modules, our approach learns routing functions that identify which hidden states encode reusable reasoning artifacts and which attention heads should propagate these states forward through subsequent layers. A lightweight fine-tuning procedure teaches the model to recognize when stored intermediate results should override fresh computation, creating self-referential loops within the existing architecture. This enables recursive refinement of reasoning traces in a single forward pass, maintaining coherence without autoregressive drift. Reflexive Memory Routing requires no architectural modifications and adds negligible computational overhead, as it leverages dormant capacity in pretrained attention patterns. The framework provides a foundation for building models that reason more reliably over complex, multi-step problems while preserving the simplicity and efficiency of standard transformer inference.
    1: 'Vision-Language Models (VLMs) enable powerful multi-agent systems, but scaling them is economically unsustainable: coordinating heterogeneous agents under information asymmetry often spirals costs. Existing paradigms, such as Mixture-of-Agents and knowledge-based routers, rely on heuristic proxies that ignore costs and collapse uncertainty structure, leading to provably suboptimal coordination.

      We introduce Agora, a framework that reframes coordination as a decentralized market for uncertainty. Agora formalizes epistemic uncertainty into a structured, tradable asset (perceptual, semantic, inferential), and enforces profitability-driven trading among agents based on rational economic rules. A market-aware broker, extending Thompson Sampling, initiates collaboration and guides the system toward cost-efficient equilibria. Agora establishes market-based coordination as a principled and scalable paradigm for building economically viable multi-agent visual intelligence systems.'
