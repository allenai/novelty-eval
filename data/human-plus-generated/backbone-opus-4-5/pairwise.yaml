    0: Large language models generate text autoregressively without explicit mechanisms for hierarchical planning, limiting their effectiveness on tasks requiring sustained coherent reasoning over long horizons. We introduce Cognitive Workspace Transformers, a framework that augments autoregressive generation with a learnable, multi-scale latent memory that the model dynamically reads from and writes to during inference. The workspace consists of hierarchically organized latent slots operating at different temporal granularities—from immediate context to abstract goals—enabling the model to maintain evolving plans while generating tokens. A gating mechanism allows the model to decide when to consult or update different workspace levels, supporting flexible allocation of computational effort. The workspace is trained end-to-end alongside language modeling through a combination of reconstruction objectives and consistency losses that encourage coherent hierarchical structure. Unlike external scaffolding approaches, our method internalizes planning capabilities within the model's forward pass, requiring no additional inference-time tools or multi-agent coordination. Cognitive Workspace Transformers provide a principled architecture for integrating ideas from cognitive science about working memory and hierarchical cognition into the foundation model paradigm.
    1: 'Recurrent neural networks (RNNs) with deep test-time memorization modules, such as Titans and TTT, represent a promising, linearly-scaling paradigm distinct from Transformers. While these expressive models do not yet match the peak performance of state-of-the-art Transformers, their potential has been largely untapped due to prohibitively slow training and low hardware utilization.

      Existing parallelization methods force a fundamental conflict governed by the chunksize hyperparameter: large chunks boost speed but degrade performance, necessitating a fixed, suboptimal compromise. To solve this challenge, we introduce TNT, a novel training paradigm that decouples training efficiency from inference performance through a two-stage process. Stage one is an efficiency-focused pre-training phase utilizing a hierarchical memory. A global module processes large, hardware-friendly chunks for long-range context, while multiple parallel local modules handle fine-grained details. Crucially, by periodically resetting local memory states, we break sequential dependencies to enable massive context parallelization. Stage two is a brief fine-tuning phase where only the local memory modules are adapted to a smaller, high-resolution chunksize, maximizing accuracy with minimal overhead. This approach removes a critical scalability barrier, establishing a practical foundation for developing expressive RNNs and facilitating future work to close the performance gap with Transformers.'
