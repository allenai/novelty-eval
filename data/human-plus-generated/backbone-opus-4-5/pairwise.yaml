  ideas:
    0: 'Fairness constraints in machine learning are typically fixed during training, forcing practitioners to commit to a single fairness definition despite deployment contexts that vary across jurisdictions, stakeholder preferences, and evolving societal norms. We introduce Fairness Steering Networks, a framework that enables continuous, inference-time control over fairness-accuracy tradeoffs without retraining. Our approach learns a fairness-parameterized representation space where a lightweight steering module interpolates between different fairness objectives—such as demographic parity, equalized odds, and individual fairness—conditioned on user-specified parameters. Crucially, we integrate conformal prediction to provide distribution-free coverage guarantees on fairness constraint satisfaction, with calibrated uncertainty estimates that flag when deployment distributions deviate sufficiently from training conditions that fairness guarantees may no longer hold. This uncertainty awareness addresses a critical safety gap: models that appear fair on held-out data but silently violate fairness under distribution shift. Our framework reconceptualizes fairness as a steerable, uncertainty-quantified property rather than a rigid training-time constraint, enabling context-appropriate deployment while maintaining transparency about the limits of fairness guarantees.'
    1: 'Monitoring large language models'' (LLMs) activations is an effective way to detect harmful requests before they lead to unsafe outputs. However, traditional safety monitors often require the same amount of compute for every query. This creates a trade-off: expensive monitors waste resources on easy inputs, while cheap ones risk missing subtle cases. We argue that safety monitors should be flexible--costs should rise only when inputs are difficult to assess, or when more compute is available. To achieve this, we introduce Truncated Polynomial Classifiers (TPCs), a natural extension of linear probes for dynamic activation monitoring. Our key insight is that polynomials can be trained and evaluated progressively, term-by-term. At test-time, one can early-stop for lightweight monitoring, or use more terms for stronger guardrails when needed. TPCs provide two modes of use. First, as a safety dial: by evaluating more terms, developers and regulators can "buy" stronger guardrails from the same model. Second, as an adaptive cascade: clear cases exit early after low-order checks, and higher-order guardrails are evaluated only for ambiguous inputs, reducing overall monitoring costs.'
