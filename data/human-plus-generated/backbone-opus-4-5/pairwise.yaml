    0: Adaptive optimizers estimate curvature information indirectly through gradient statistics, often resulting in delayed or noisy adaptation to complex loss landscape geometry. We introduce Geometric Landscape Probing (GLP), an optimization framework that explicitly characterizes local loss surface structure to guide parameter updates. GLP maintains a lightweight geometric sketch that captures directional curvature, local convexity, and valley orientation through efficient finite-difference probes computed along random subspaces. This geometric signature is compressed into a low-dimensional descriptor that modulates both the direction and magnitude of gradient steps without computing or storing full Hessian matrices. A key component is a learned projection network that identifies the most informative probing directions based on recent optimization history, focusing computational budget on geometrically relevant subspaces. The framework naturally interpolates between steepest descent in ill-conditioned regions and Newton-like steps near well-behaved minima. GLP's geometric descriptors exhibit transferability across training phases, suggesting that local landscape structure follows learnable patterns. Our approach bridges the gap between computationally prohibitive second-order methods and heuristic adaptive gradient techniques, offering principled curvature-aware optimization with minimal overhead.
    1: 'The minimum-cost bipartite matching between two sets of points $R$ and $S$ in a metric space has a wide range of applications in machine learning, computer vision, and logistics. For instance, it can be used to estimate the $1$-Wasserstein distance between continuous probability distributions and for efficiently matching requests to servers while minimizing cost. However, the computational cost of determining the minimum-cost matching for general metrics spaces, poses a significant challenge, particularly in dynamic settings where points arrive over time and each update requires re-executing the algorithm. In this paper, given a fixed set $S$, we describe a deterministic algorithm that maintains, after $i$ additions to $R$, an $O(1/\delta^{0.631})$-approximate minimum-cost matching of cardinality $i$ between sets $R$ and $S$ in any metric space, with an amortized insertion time of $\widetilde{O}(n^{1+\delta})$ for adding points in $R$. To the best of our knowledge, this is the first algorithm for incremental minimum-cost matching that applies to arbitrary metric spaces.


