    0: '*Automated circuit discovery* is a central tool in mechanistic interpretability for identifying the internal components of neural networks responsible for specific behaviors. While prior methods have made significant progress, they typically depend on heuristics or approximations and do not offer provable guarantees over continuous input domains for the resulting circuits. In this work, we leverage recent advances in neural network verification to propose a suite of automated algorithms that yield circuits with *provable guarantees*. We focus on three types of guarantees: (1) *input domain robustness*, ensuring the circuit agrees with the model across a continuous input region; (2) *robust patching*, certifying circuit alignment under continuous patching perturbations; and (3) *minimality*, formalizing and capturing a wide array of various notions of succinctness. Interestingly, we uncover a diverse set of novel theoretical connections among these three families of guarantees, with critical implications for the convergence of our algorithms, establishing a principled foundation for provable circuit discovery.'
    1: 'Understanding how information propagates through neural networks remains a fundamental challenge in interpretability research. While existing methods analyze individual components such as attention heads or neurons in isolation, they fail to capture the dynamic, context-dependent interactions that shape model outputs during inference. We introduce Neural Provenance Tracking, a framework that maintains a differentiable influence graph for each token representation as it traverses transformer layers. Our approach decomposes each hidden state into contributions from upstream components, propagating causal attribution through attention and feedforward operations while preserving compositional structure. To achieve computational tractability, we develop sparse influence approximations that retain only the most significant causal pathways, along with learned compression modules that summarize complex interaction patterns. This provenance-aware representation enables novel capabilities: tracing factual claims to their source tokens, identifying when predictions arise from spurious feature correlations, and detecting the computational origins of hallucinated content. Neural Provenance Tracking provides practitioners with fine-grained, mechanistically grounded explanations that reveal not just what a model attends to, but how attended information transforms and combines to produce final outputs.'
