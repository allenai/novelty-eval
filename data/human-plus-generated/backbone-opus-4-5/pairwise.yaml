    0: Real-world relational data often exhibits heterogeneous geometric structure—locally flat communities embedded within globally hierarchical organizations—yet existing graph learning methods assume a single, fixed geometry. We introduce Geometry-Adaptive Structure Learning (GASL), a framework that jointly infers latent graph topology and discovers the appropriate geometric space for different regions of the learned structure. GASL embeds nodes into a product manifold comprising Euclidean, hyperbolic, and spherical components, and learns a differentiable geometry selection mechanism that softly allocates node pairs to curvature spaces based on their relational characteristics. Edge existence probabilities are computed through geometry-specific decoders, enabling the model to capture flat clustering, hierarchical branching, and cyclical patterns within a unified framework. A curvature-aware sparsity prior encourages parsimonious geometry usage, preventing unnecessary complexity. The framework is end-to-end differentiable, requiring only node features as input while outputting both the inferred multi-geometric graph structure and expressive node representations. GASL provides a principled approach for learning on data where neither the topology nor its underlying geometry is known a priori.
    1: 'Equivariant Neural Networks (ENNs) have empowered numerous applications in scientific fields. Despite their remarkable capacity for representing geometric structures, ENNs suffer from degraded expressivity when processing symmetric inputs: the output representations are invariant to transformations that extend beyond the input''s symmetries. The mathematical essence of this phenomenon is that a symmetric input, after being processed by an equivariant map, experiences an increase in symmetry. While prior research has documented symmetry increase in specific cases, a rigorous understanding of its underlying causes and general reduction strategies remains lacking. In this paper, we provide a detailed and in-depth characterization of symmetry increase together with a principled framework for its reduction: (i) For any given feature space and input symmetry group, we prove that the increased symmetry admits an infimum determined by the structure of the feature space; (ii) Building on this foundation, we develop a computable algorithm to derive this infimum, and propose practical guidelines for feature design to prevent harmful symmetry increases. (iii) Under standard regularity assumptions, we demonstrate that for most equivariant maps, our guidelines effectively reduce symmetry increase.'
