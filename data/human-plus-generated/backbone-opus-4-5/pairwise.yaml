  ideas:
    0: Controllable generation in diffusion models typically operates through monolithic guidance signals that conflate control across semantic scales, limiting users' ability to independently specify high-level composition, mid-level structure, and fine-grained details. We introduce Hierarchical Disentangled Guidance (HDG), a training-free framework that decomposes user intent into scale-specific control signals aligned with the natural coarse-to-fine trajectory of diffusion sampling. HDG learns a lightweight projection network that maps arbitrary conditioning inputs—text, sketches, or reference images—into a hierarchy of guidance vectors, each targeting a specific range of diffusion timesteps corresponding to distinct levels of semantic abstraction. Through an orthogonality constraint, these guidance vectors remain disentangled, enabling independent manipulation of global layout, object arrangement, and texture details within a single generation. The framework operates as a plug-in module compatible with pretrained diffusion models, requiring no modification to the base architecture. HDG opens new possibilities for creative workflows where users can iterate on different abstraction levels independently, mixing high-level structure from one source with fine details from another.
    1: Few-step diffusion or flow-based generative models typically distill a velocity-predicting teacher into a student that predicts a shortcut towards denoised data. This format mismatch has led to complex distillation procedures that often suffer from a quality--diversity trade-off. To address this, we propose policy-based flow models ($\pi$-Flow). $\pi$-Flow modifies the output layer of a student flow model to predict a network-free policy at one timestep. The policy then produces dynamic flow velocities at future substeps with negligible overhead, enabling fast and accurate ODE integration without extra network evaluations. To match the policy's ODE trajectory to the teacher's, we introduce a novel imitation distillation approach, which matches the policy's velocity to the teacher's along the policy's trajectory using a standard $\ell_2$ flow matching loss. By simply mimicking the teacher's behavior, $\pi$-Flow enables stable and scalable training and avoids the quality--diversity trade-off.
