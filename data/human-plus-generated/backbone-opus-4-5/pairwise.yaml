    0: Multi-Agent System (MAS) powered by Visual Language Models (VLMs) enables challenging tasks but suffers from a novel failure term, multi-agent visual hallucination snowballing, where hallucinations are seeded in a single agent and amplified by following ones due to the over-reliance on textual flow to relay visual information. Through turn-, layer-, and token-wise attention analyses, we provide detailed insights into the essence of hallucination snowballing regarding the reduction of visual attention allocation. It leads us to identify a subset of vision tokens with a unimodal attention peak in middle layers that best preserve visual evidence but gradually diminish in deeper agent turns, resulting in the visual hallucination snowballing in MAS. Thus, we propose ViF, a lightweight, model-agnostic mitigation paradigm that relays inter-agent messages with Visual Flow powered by the selected visual relay tokens and applies attention reallocation to amplify this pattern.
    1: Foundation models excel at general-purpose reasoning but face inherent tension between broad capabilities and task-specific performance. Existing adaptation methods either require costly fine-tuning with catastrophic forgetting risks or rely on static prompting with limited expressivity. We introduce Neural Gating Networks, a framework that treats frozen foundation models as reconfigurable computational substrates controlled by lightweight meta-circuits. Rather than modifying model weights or prepending task descriptions, our approach learns dynamic gating functions that selectively amplify or suppress activation pathways based on inferred task requirements. The gating network observes input characteristics and intermediate representations to produce real-time modulation signals across attention heads and feed-forward channels, effectively routing computation through task-appropriate subnetworks within the frozen model. This enables a single foundation model to exhibit specialized behaviors without parameter updates or explicit task specifications. Our framework introduces minimal overhead while providing continuous, input-dependent adaptation that generalizes across task boundaries. Neural Gating Networks offer a new paradigm for foundation model deployment where adaptation emerges from learned computational routing rather than weight modification or prompt engineering.
