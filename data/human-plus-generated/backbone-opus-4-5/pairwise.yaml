  ideas:
    0: 'We propose a method for inferring an egocentric dense depth map from an RGB image and a sparse point cloud. The crux of our method lies in modeling the 3D scene implicitly within the latent space and learning an inductive bias in an unsupervised manner through principles of Structure-from-Motion. To force the learning of this inductive bias, we propose to optimize for an ill-posed objective during training: predicting latent features that are not observed in the input view, but exist in the 3D scene. This is facilitated by means of rigid warping of latent features from the input view to a nearby or adjacent (co-visible) view of the same 3D scene. "Empty" regions in the latent space that correspond to regions occluded from the input view are completed by a Contextual eXtrapolation (ConteXt) mechanism based on features visible in input view. The learned inductive bias of ConteXt can be transferred to modulate the features of the input view to improve fidelity. We term our method "Occluded Region Completion as Supervision" or ORCaS.'
    1: Multimodal foundation models typically align representations at a global level, mapping entire images, audio clips, and sentences to a shared embedding space. However, this coarse alignment fails to capture the rich fine-grained correspondences that naturally exist across modalities—such as phonemes synchronized with lip movements, or spoken words grounded in visual regions. We introduce Anchor-Aligned Multimodal Transformers, a framework that learns dense token-level alignment across vision, audio, and language through dynamically discovered anchor tokens. Rather than exhaustive cross-modal attention, our approach identifies sparse synchronization points that serve as shared reference frames, enabling efficient fine-grained alignment with sub-quadratic complexity. A contrastive objective encourages anchor tokens to capture modality-invariant semantics while preserving modality-specific details in surrounding representations. The framework operates as a lightweight adapter on frozen unimodal encoders, injecting cross-modal structure without catastrophic forgetting of pretrained knowledge. Anchor-Aligned representations enable precise temporal grounding, fine-grained retrieval, and improved generation quality for tasks requiring tight cross-modal synchronization, offering a new paradigm for multimodal understanding beyond global alignment.
