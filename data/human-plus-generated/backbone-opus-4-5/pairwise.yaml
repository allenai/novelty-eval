    0: Real-world dynamical systems frequently exhibit multiple behavioral regimes with distinct governing dynamics, yet existing neural approaches typically assume a single global model or require explicit regime annotations. We introduce Neural Switching Dynamics, a framework that jointly learns continuous within-regime dynamics and discrete regime transitions from raw time series observations. Our approach couples a library of neural ordinary differential equations—each capturing a distinct dynamical mode—with a learned transition policy that governs regime switching based on the current system state and its trajectory history. A variational inference procedure enables end-to-end training without regime supervision, using a recurrent encoder to infer latent regime sequences while regularizing for temporal coherence. The transition policy operates on a learned phase space representation, allowing it to anticipate regime changes before they manifest in observed variables. By explicitly modeling the compositional structure of complex dynamics, Neural Switching Dynamics enables systematic generalization to novel initial conditions, improved long-horizon forecasting through regime-aware rollouts, and interpretable decomposition of system behavior into discrete modes with continuous evolution laws.
    1: 'The design of training objective is central to training time-series forecasting models. Existing training objectives such as mean squared error mostly treat each future step as an independent, equally weighted task, which we found leading to the following two issues: (1) overlook the *label autocorrelation effect* among future steps, leading to biased training objective; (2) fail to set *heterogeneous task weights* for different forecasting tasks corresponding to varying future steps, limiting the forecasting performance. To fill this gap, we propose a novel quadratic-form weighted training objective, addressing both of the issues simultaneously. Specifically, the off-diagonal elements of the weighting matrix account for the label autocorrelation effect, whereas the non-uniform diagonals are expected to match the most preferable weights of the forecasting tasks with varying future steps. To achieve this, we propose a Quadratic Direct Forecast (QDF) learning algorithm, which trains the forecast model using the adaptively updated quadratic-form weighting matrix.'
