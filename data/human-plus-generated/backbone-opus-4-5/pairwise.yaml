    0: 'Behavior Foundation Models (BFMs) are capable of retrieving high-performing policy for any reward function specified directly at test-time, commonly referred to as zero-shot reinforcement learning (RL). While this is a very efficient process in terms of compute, it can be less so in terms of data: as a standard assumption, BFMs require computing rewards over a non-negligible inference dataset, assuming either access to a functional form of rewards, or significant labeling efforts. To alleviate these limitations, we tackle the problem of task inference purely through interaction with the environment at test-time. We propose OpTI-BFM, an optimistic decision criterion that directly models uncertainty over reward functions and guides BFMs in data collection for task inference. Formally, we provide a regret bound for well-trained BFMs through a direct connection to upper-confidence algorithms for linear bandits.'
    1: 'Sample efficiency in reinforcement learning remains fundamentally limited by the inability of agents to recognize and exploit structural regularities in environment dynamics. We introduce Symmetry Discovery Networks (SDN), a framework that jointly learns environment dynamics and discovers latent symmetry groups governing state-action transitions. Rather than assuming known symmetries a priori, SDN employs a learnable group representation module that identifies approximate equivariances in the transition function through a novel consistency objective. Discovered symmetries are leveraged in three ways: generating synthetic transitions via learned group actions, constraining the policy to respect identified invariances, and enabling efficient planning through symmetry-reduced search spaces. The framework maintains a hierarchy of discovered symmetry subgroups with associated confidence scores, allowing graceful handling of approximate and partial symmetries common in realistic domains. SDN integrates naturally with model-based reinforcement learning, where the symmetry-aware world model provides both improved prediction accuracy and principled data augmentation. Our approach offers a path toward agents that autonomously identify exploitable structure in their environments, addressing a fundamental bottleneck in learning efficiency for complex sequential decision-making problems.'
