    0: 'Mixture-of-Experts (MoE) architectures have demonstrated remarkable capabilities and scalability for large language models, but incur a substantial memory footprint due to redundant expert parameters. Existing compression approaches, particularly those based on low-rank decomposition, typically operate at the granularity of individual experts. However, such per-expert methods neglect structural redundancies shared across experts, limiting their compression efficiency and effectiveness. In this work, we introduce TD-MoE (Tensor Decomposition for MoE Compression), a data-aware method that jointly factorizes expert weights by capturing global dependencies. Our contributions are threefold: (i) Cross-expert tensorization with joint three-dimensional decomposition, which unifies all experts within a layer into a single tensor and captures shared structure beyond per-expert scope; (ii) A multi-linear whitening strategy, which decorrelates input and output features, yielding a more balanced and data-adaptive decomposition; (iii) A three-dimensional rank allocation mechanism, which dynamically assigns 3D decomposition ranks across dimensions to best meet a target compression ratio while minimizing the reconstruction error.'
    1: Multimodal learning typically employs uniform architectures across modalities or relies on separate encoders with late fusion, failing to exploit the distinct geometric structures inherent to each modality. We introduce Geometric Flow Networks (GFN), a framework that learns modality-specific information flow graphs capturing the intrinsic connectivity patterns of different data types—temporal causality in audio, spatial coherence in images, and hierarchical composition in language. These learned graphs dynamically modulate attention mechanisms, enabling a single transformer backbone to adapt its information routing based on input modality. GFN discovers that audio benefits from predominantly causal flow patterns, images from localized bidirectional flows, and text from tree-structured hierarchical flows, all emerging from a unified learning objective. Crucially, during cross-modal reasoning, GFN constructs hybrid flow graphs that respect the geometric constraints of each participating modality while enabling structured information exchange at semantically aligned nodes. This approach provides a principled bridge between modality-specific inductive biases and the flexibility of general-purpose architectures, offering new perspectives on how unified models can honor the intrinsic structure of diverse data types.
