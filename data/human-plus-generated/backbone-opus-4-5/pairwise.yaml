    0: 'Omni-modal reasoning is essential for intelligent systems to understand and draw inferences from diverse data sources. While existing omni-modal large language models (OLLM) excel at perceiving diverse modalities, they lack the complex reasoning abilities of recent large reasoning models (LRM). However, enhancing the reasoning ability of OLLMs through additional training presents significant challenges, including the need for high-quality data, task-specific adaptation, and substantial computational costs. To address these limitations, we propose ThinkOmni, a training-free and data-free framework that lifts textual reasoning to omni-modal scenarios. ThinkOmni introduces two key components: 1) LRM-as-a-Guide, which leverages off-the-shelf LRMs to guide the OLLM decoding process; 2) Stepwise Contrastive Scaling, which adaptively balances perception and reasoning signals without manual hyperparameter tuning. Overall, ThinkOmni offers a flexible and generalizable solution for omni-modal reasoning and provides new insights into the generalization and application of reasoning capabilities.'
    1: 'Multimodal learning typically relies on explicit fusion mechanisms that combine modality-specific representations at predetermined architectural points. However, this approach overlooks the continuous temporal dynamics that naturally synchronize across sensory channels in real-world signals. We introduce Temporal Signature Networks, a framework that learns modality-agnostic representations of temporal dynamics—capturing rhythm, pacing, and flow patterns that transcend individual modalities. Our approach extracts hierarchical temporal signatures from any input stream through a novel path signature-inspired encoding, projecting diverse signals onto a shared dynamical manifold. This unified temporal space enables cross-modal transfer of dynamics: the prosodic contour of speech can guide video editing, musical tempo can synchronize with visual motion, and text can inherit the pacing of audio narration. The framework supports bidirectional temporal reasoning, allowing both analysis of cross-modal synchronization and generation conditioned on temporal signatures from arbitrary source modalities. By decoupling temporal structure from modality-specific content, Temporal Signature Networks provide a flexible foundation for applications requiring fine-grained audiovisual alignment, expressive cross-modal generation, and robust detection of synthetic media through temporal inconsistency analysis.'
