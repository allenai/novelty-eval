  ideas:
    0: 'Large language models are increasingly optimized along multiple normative dimensions—alignment with human preferences, demographic fairness, safety from harmful outputs, and privacy preservation—yet these objectives are typically pursued in isolation. This siloed approach obscures critical tensions: alignment with majority preferences may encode discriminatory biases, safety filters may disproportionately restrict content relevant to marginalized communities, and differential privacy mechanisms may amplify fairness disparities. We introduce Pluralistic Alignment Networks (PAN), a framework that explicitly models the interdependencies among normative objectives through multi-objective optimization over a learned constraint manifold. PAN employs a conflict detection module that identifies when optimizing one dimension degrades another, coupled with a Pareto-guided reconciliation mechanism that surfaces unavoidable trade-offs rather than implicitly resolving them. A key innovation is the stakeholder-conditional trade-off interface, which generates interpretable visualizations of the normative frontier, enabling transparent deliberation about value prioritization. By treating normative pluralism as a first-class design consideration rather than an afterthought, PAN provides a principled foundation for developing AI systems that navigate competing societal values with explicit, auditable reasoning.'
    1: 'Protecting the copyright of user-generated AI images is an emerging challenge as AIGC becomes pervasive in creative workflows. Existing watermarking methods (1) remain vulnerable to real-world adversarial threats, often forced to trade off between defenses against spoofing and removal attacks; and (2) cannot support semantic-level tamper localization. We introduce PAI, a training-free inherent watermarking framework for AIGC copyright protection, plug-and-play with diffusion-based AIGC services. PAI simultaneously provides three key functionalities: robust ownership verification, attack detection, and semantic-level tampering localization. Unlike existing inherent watermark methods that only embed watermarks at noise initialization of diffusion models, we design a novel key-conditioned deflection mechanism that subtly steers the denoising trajectory according to the user key. Such trajectory-level coupling further strengthens the semantic entanglement of identity and content, thereby further enhancing robustness against real-world threats. Moreover, we also provide a theoretical analysis proving that only the valid key can pass verification.'
