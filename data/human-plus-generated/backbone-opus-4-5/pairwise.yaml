    0: Aligning Large Language Models (LLMs) with human preferences is crucial for safe and effective AI interactions. While popular methods like Direct Preference Optimization (DPO) have simplified alignment, they remain sensitive to data noise and overlook the differential importance of individual tokens. Existing token-level approaches often rely on probability prediction or simplistic weighting schemes to obtain token importance, which still cannot fully address these issues. To solve this problem, we propose the Token-Importance Guided Direct Preference Optimization (TI-DPO), a framework that achieves fine-grained semantic control through two synergistic innovations. First, we propose a novel hybrid weighting mechanism that combines gradient attribution with a Gaussian prior, ensuring both the accuracy and robustness of token importance scores. Second, we employ a triplet loss to provide structured guidance for the optimization, explicitly guiding model outputs to approach preferred responses and diverge from non-preferred ones.
    1: 'Large language models exhibit impressive natural language understanding but remain unreliable on tasks demanding rigorous logical reasoning and hard constraint satisfaction. We introduce Neural Solver Grounding, a framework that enables foundation models to generate structured intermediate representations natively compatible with symbolic reasoning engines. Unlike prior neuro-symbolic approaches that treat solvers as external black-box tools, our method trains models to emit solver-compatible thought traces—hybrid representations that are simultaneously differentiable for end-to-end learning and directly parseable by constraint solvers, SAT solvers, and theorem provers. During inference, these traces establish a bidirectional channel: the language model handles problem formulation and natural language grounding while symbolic engines perform guaranteed-correct reasoning steps, with solver outputs dynamically conditioning subsequent generation. A key technical contribution is a relaxation scheme that maintains gradient flow through discrete solver interfaces during training. Neural Solver Grounding combines the flexibility and world knowledge of foundation models with the precision and verifiability of formal methods, offering a principled path toward language models capable of trustworthy reasoning in high-stakes domains requiring logical guarantees.'
