    0: The Mixture-of-Experts (MoE) architecture has become a predominant paradigm for scaling large language models (LLMs). Despite offering strong performance and computational efficiency, large MoE-based LLMs like DeepSeek-V3-0324 and Kimi-K2-Instruct present serious challenges due to substantial memory requirements in deployment. While recent works have explored MoE compression to address this issue, existing methods often suffer from considerable accuracy drops even at modest compression rates. This paper introduces a novel Mixture-of-Basis-Experts (MoBE) method that achieves model compression while incurring minimal accuracy drops. Specifically, each up/gate matrix in an expert is decomposed via a rank decomposition as W = AB, where matrix A is unique to each expert. The relatively larger matrix B is further reparameterized as a linear combination of basis matrices {Bi} shared across all experts within a given MoE layer. The factorization is learned by minimizing the reconstruction error relative to the original weight matrices.
    1: Large language models encode vast knowledge but struggle with systematic compositional generalization—the ability to recombine known concepts in novel configurations. We introduce the Neural Compositional Workspace, a lightweight architectural module that augments frozen foundation models with dynamic concept binding capabilities inspired by cognitive theories of consciousness and working memory. Rather than relying on implicit composition through feedforward computation, our approach explicitly maintains a structured workspace where concept representations can be dynamically bound, transformed, and unbound through learned attention-based operations. The workspace operates as a differentiable scratchpad that orchestrates information flow between the foundation model's frozen representations, enabling systematic recombination without modifying pretrained weights. Training requires only modest compositional reasoning examples while preserving the base model's general capabilities. Our framework bridges cognitive science principles with modern deep learning, offering a parameter-efficient path toward more systematic reasoning in foundation models. The modular design allows the workspace to transfer across different backbone architectures, suggesting a general mechanism for enhancing compositional capabilities in pretrained models.
