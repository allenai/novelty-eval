  ideas:
    0: Diffusion-based image generation models excel at producing high-quality synthetic content, but suffer from slow and computationally expensive inference. Prior work has attempted to mitigate this by caching and reusing features within diffusion transformers across inference steps. These methods, however, often rely on rigid heuristics that result in limited acceleration or poor generalization across architectures. We propose **E**volutionary **C**aching to **A**ccelerate **D**iffusion models (ECAD), a genetic algorithm that learns efficient, per-model, caching schedules forming a Pareto frontier, using only a small set of calibration prompts. ECAD requires no modifications to network parameters or reference images. It offers significant inference speedups, enables fine-grained control over the quality-latency trade-off, and adapts seamlessly to different diffusion models. Notably, ECAD's learned schedules can generalize effectively to resolutions and model variants not seen during calibration. ECAD establishes a scalable and generalizable approach for accelerating diffusion inference.
    1: 'Generative models excel at capturing common patterns but systematically underrepresent rare phenomena, limiting their utility in domains where tail events carry outsized importance. We introduce Spectral Decomposition Generative Models (SDGM), a framework that factorizes the generative process into frequency-specialized components operating across different regimes of the data distribution. SDGM learns a hierarchy of expert generators: bulk experts that efficiently model high-density regions and tail experts that focus computational capacity on rare but semantically significant modes. A learned density-aware router dynamically assigns samples to appropriate experts during training, while an inverse routing mechanism enables controlled generation along the common-to-rare spectrum at inference time. The framework introduces a frequency-balanced objective that prevents tail collapse without requiring explicit importance weights or oversampling. SDGM naturally supports rare-event amplification, allowing practitioners to intentionally oversample underrepresented phenomena for data augmentation or scenario planning. Our approach is architecture-agnostic and can be integrated with diffusion models, normalizing flows, or autoregressive generators, providing a principled mechanism for distribution-aware generation.'
