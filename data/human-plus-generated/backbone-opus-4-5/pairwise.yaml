    0: Sparse autoencoders (SAEs) have recently emerged as a powerful tool for interpreting the features learned by large language models (LLMs). By reconstructing features with sparsely activated networks, SAEs aim to recover complex superposed polysemantic features into interpretable monosemantic ones. Despite their wide applications, it remains unclear under what conditions SAEs can fully recover the ground truth monosemantic features from the superposed polysemantic ones. In this paper, we provide the first theoretical analysis with a closed-form solution for SAEs, revealing that they generally fail to fully recover the ground truth monosemantic features unless the ground truth features are extremely sparse. To improve the feature recovery of SAEs in general cases, we propose a reweighting strategy targeting at enhancing the reconstruction of the ground truth monosemantic features instead of the observed polysemantic ones. We further establish a theoretical weight selection principle for our proposed weighted SAE (WSAE).
    1: Current interpretability methods predominantly produce static explanations—saliency maps, attention weights, or concept attributions—that fail to capture the dynamic, causal nature of neural computation. These approaches reveal correlations between inputs and outputs but obscure the mechanistic processes by which representations transform and interact during inference. We introduce Causal Explanation Flows, a framework that models interpretability as tracing dynamic causal trajectories through neural networks. Our approach combines targeted causal interventions on intermediate representations with information-theoretic tracking to construct explanation graphs that reveal how specific computational pathways causally determine model outputs. Unlike post-hoc attribution methods, Causal Explanation Flows performs real-time analysis during forward passes, identifying critical decision points where alternative reasoning branches diverge. The framework supports counterfactual queries by simulating intervention effects along discovered causal pathways, enabling users to understand not just what influenced a prediction but how different computational routes would have altered it. We provide theoretical grounding connecting our flow-based explanations to structural causal models and demonstrate that the framework scales to modern transformer architectures through efficient intervention sampling strategies.
