    0: 'Generative models excel at producing high-fidelity samples but struggle to satisfy complex compositional constraints at inference time without retraining or brittle guidance mechanisms. We introduce Constraint-Programmable Generation, a framework that treats symbolic constraints as first-class objects that algebraically modulate the generative process. Our approach learns a constraint compiler that translates high-level specifications—expressed in a simple constraint language supporting composition, negation, and quantification—into smooth modifications of the underlying score function or velocity field. Unlike classifier guidance, which requires differentiable constraint evaluators, our compiler learns to approximate constraint satisfaction through a meta-learning objective over diverse constraint families. The framework enables previously intractable generation tasks: producing images satisfying Boolean combinations of spatial relationships, generating molecules meeting multiple property bounds simultaneously, or synthesizing text adhering to structural templates. Crucially, constraints can be specified, combined, and modified at inference time without model updates, enabling interactive and iterative creative workflows. Constraint-Programmable Generation bridges the gap between neural generative modeling and symbolic reasoning, offering a path toward generative systems that are not merely powerful samplers but programmable creative tools.'
    1: The importance of mobile phone GPS trajectory data is widely recognized across many fields, yet the use of real data is often hindered by privacy concerns, limited accessibility, and high acquisition costs. As a result, generating pseudo–GPS trajectory data has become an active area of research. Recent diffusion-based approaches have achieved strong fidelity but remain limited in spatial scale (small urban areas), transportation-mode diversity, and efficiency (requiring numerous sampling steps). To address these challenges, we introduce TrajFlow, which to the best of our knowledge is the first flow-matching-based generative model for GPS trajectory generation. TrajFlow leverages the flow-matching paradigm to improve robustness and efficiency across multiple geospatial scales, and incorporates a trajectory harmonization & reconstruction strategy to jointly address scalability, diversity, and efficiency. As the first nationwide, multi-scale GPS trajectory generation model, TrajFlow demonstrates strong potential to support inter-region urban planning, traffic management, and disaster response, thereby advancing the resilience and intelligence of future mobility systems.
