    0: Multimodal learning typically processes each modality through dedicated encoders before fusion, implicitly assuming that architectural inductive biases should be determined by input type rather than underlying computational structure. We challenge this assumption by introducing Modal Primitives, a framework that decomposes perception into fundamental computational motifs—temporal continuity, spatial locality, and symbolic compositionality—that manifest across modalities in varying proportions. Our architecture employs a mixture-of-primitives layer where lightweight expert modules each specialize in one computational motif, with learned routing mechanisms that dynamically compose primitives based on local input characteristics rather than global modality labels. This enables audio signals to leverage spatial experts for spectral patterns, images to engage temporal experts for motion-like textures, and text to utilize continuous experts for phonetic representations. A primitive consistency loss encourages the model to discover shared computational structure across modalities while a diversity objective prevents collapse to modality-specific routing. Modal Primitives provides a unified yet flexible framework for multimodal learning that respects the intrinsic computational demands of diverse inputs without imposing rigid modality boundaries.
    1: Video diffusion models (DMs) have enabled high-quality video synthesis. Yet, their substantial computational and memory demands pose serious challenges to real-world deployment, even on high-end GPUs. As a commonly adopted solution, quantization has proven notable success in reducing cost for image DMs, while its direct application to video DMs remains ineffective. In this paper, we present *QVGen*, a novel quantization-aware training (QAT) framework tailored for high-performance and inference-efficient video DMs under extremely low-bit quantization (*e.g.*, $4$-bit or below). We begin with a theoretical analysis demonstrating that reducing the gradient norm is essential to facilitate convergence for QAT. To this end, we introduce auxiliary modules ($\Phi$) to mitigate large quantization errors, leading to significantly enhanced convergence. To eliminate the inference overhead of $\Phi$, we propose a *rank-decay* strategy that progressively eliminates $\Phi$. Specifically, we repeatedly employ singular value decomposition (SVD) and a proposed rank-based regularization $\mathbf{\gamma}$ to identify and decay low-contributing components. This strategy retains performance while zeroing out additional inference overhead.
