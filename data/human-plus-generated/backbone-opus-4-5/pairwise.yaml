  ideas:
    0: Reasoning over long contexts is essential for large language models. While reinforcement learning (RL) enhances short-context reasoning by inducing "Aha" moments in chain-of-thought, the advanced thinking patterns required for long-context reasoning remain largely unexplored, and high-difficulty RL data are scarce. In this paper, we introduce LoongRL, a data-driven RL method for advanced long-context reasoning. Central to LoongRL is KeyChain, a synthesis approach that transforms short multi-hop QA into high-difficulty long-context tasks by inserting UUID chains that hide the true question among large collections of distracting documents. Solving these tasks requires the model to trace the correct chain step-by-step, identify the true question, retrieve relevant facts and reason over them to answer correctly. RL training on KeyChain data induces an emergent plan–retrieve–reason–recheck reasoning pattern that generalizes far beyond training length, enabling models trained at 16K to effectively solve 128K tasks without prohibitive full-length RL rollout costs.
    1: Large language models generate responses through uniform autoregressive decoding, allocating equivalent computation to trivial and complex problems alike. This computational homogeneity limits their effectiveness on tasks requiring variable-depth reasoning. We introduce Adaptive Deliberation Networks, a framework that enables foundation models to dynamically modulate their reasoning depth based on problem complexity. Our approach augments pretrained LLMs with a learned deliberation controller that predicts uncertainty at intermediate reasoning steps and triggers recursive refinement cycles when needed. The controller operates in a latent deliberation space where the model can explore alternative reasoning paths, backtrack from unproductive directions, and consolidate insights before committing to output tokens. A key innovation is our complexity-aware training objective that teaches the model to recognize when additional deliberation yields diminishing returns, preventing both premature responses and excessive rumination. The framework requires no architectural modifications to the base model, instead operating through learned steering vectors that activate deliberative modes. Adaptive Deliberation Networks bridge reactive language generation and genuine cognitive deliberation, offering a path toward models that think proportionally to the demands of each problem.
