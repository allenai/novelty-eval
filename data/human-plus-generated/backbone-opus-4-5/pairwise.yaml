  ideas:
    0: 'Representation learning methods typically commit to a fixed supervision paradigm—supervised, self-supervised, or semi-supervised—treating the choice as a discrete design decision rather than a learnable component. We argue this rigidity is suboptimal: different samples benefit from different learning signals at different training stages. We introduce Adaptive Learning Signal Routing (ALSR), a unified framework that dynamically allocates samples to heterogeneous learning pathways based on their instantaneous learning potential. ALSR maintains parallel representation heads corresponding to supervised, contrastive, and reconstructive objectives, while a lightweight routing network learns to compose sample-specific loss weightings through meta-gradient optimization. The router is trained to maximize downstream representation quality by treating supervision intensity as a continuous, learnable variable conditioned on sample features and training dynamics. This formulation subsumes existing paradigms as special cases while enabling smooth interpolation and automatic curriculum discovery. ALSR naturally handles partial labeling scenarios, automatically leveraging labels when beneficial while extracting complementary structure from unlabeled regions of the data manifold. Our framework provides a principled approach to unifying the representation learning spectrum under a single adaptive objective.'
    1: 'Multi-view clustering integrates the consistency and complementarity of different views to achieve unsupervised data grouping. Existing multi-view clustering methods primarily confront two challenges: i) they generally perform feature extraction in the feature domain, which is sensitive to noise and may neglect cluster-specific information that is indistinguishable in the original space; ii) current dynamic fusion methods adopt static strategies to learn weights, lacking capability to adjust strategies adaptively under complex scenarios according to variations in data distribution and view quality. To address these issues, we propose a large language model assisted dynamic agent for multi-view clustering (LLM-DAMVC), a novel framework that recasts multi-view clustering as a dynamic decision-making problem orchestrated by a large language model. Specifically, each view is equipped with complementary agents dedicated to feature extraction. A dual-domain contrastive module is introduced to optimize feature consistency and enhance cluster separability in both the feature domain and frequency domain. Additionally, an LLM-assisted view fusion mechanism provides a flexible fusion weight learning strategy that can be adaptively applied to complex scenarios and significantly different views.'
