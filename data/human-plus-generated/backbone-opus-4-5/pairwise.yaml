    0: Alignment, fairness, safety, and privacy are often treated as independent objectives in responsible AI development, yet interventions targeting one dimension frequently create unintended consequences in others. Safety filters may disproportionately restrict outputs for minority dialects, fairness audits may require privacy-violating data collection, and alignment procedures may encode majority preferences at the expense of marginalized groups. We introduce Value Interference Graphs (VIGs), a causal framework for modeling the complex interdependencies between responsible AI objectives. VIGs represent each value dimension as a node with directed edges capturing how interventions propagate across objectives, enabling practitioners to anticipate conflicts before deployment. Building on this representation, we propose Pareto Value Navigation, an interactive multi-objective optimization procedure that surfaces trade-off frontiers to stakeholders rather than embedding implicit value judgments in engineering decisions. Our framework incorporates democratic preference aggregation mechanisms to ensure that value prioritization reflects diverse community input rather than developer assumptions. This unified approach transforms responsible AI from a checklist of independent constraints into a coherent methodology for navigating the inherent tensions in building beneficial AI systems.
    1: 'This work tackles a critical challenge in AI safety research under limited compute: given a fixed computation budget, how can one maximize the strength of iterative adversarial attacks? Coarsely reducing the number of attack iterations lowers cost but substantially weakens effectiveness. To fulfill the attainable attack efficacy within a constrained budget, we propose a fine-grained control mechanism that selectively recomputes layer activations across both iteration-wise and layer-wise levels.'
