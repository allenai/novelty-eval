    0: 'Agent memory shapes how Large Language Model (LLM)-powered agents, akin to the human brain, progressively refine themselves through environment interactions. Existing paradigms remain constrained: parametric memory forcibly adjusts model parameters, and retrieval-based memory externalizes experience into structured databases, yet neither captures the fluid interweaving of reasoning and memory that underlies human cognition. To address this gap, we propose MemGen, a dynamic generative memory framework that equips agents with a human-esque cognitive faculty. It consists of a \textit{memory trigger}, which monitors the agent''s reasoning state to decide explicit memory invocation, and a \textit{memory weaver}, which takes the agent''s current state as stimulus to construct a latent token sequence as machine-native memory to enrich its reasoning. In this way, MemGen enables agents to recall and augment latent memory throughout reasoning, producing a tightly interwoven cycle of memory and cognition. More importantly, we find that without explicit supervision, MemGen spontaneously evolves distinct human-like memory faculties, including planning memory, procedural memory, and working memory, suggesting an emergent trajectory toward more naturalistic forms of machine cognition.'
    1: Large language models encode vast world knowledge within their parameters, yet this knowledge remains static after training, leading to outdated or incorrect responses as information evolves. We introduce Self-Editing Transformers, a framework that enables foundation models to autonomously identify and surgically revise their own parametric knowledge without full retraining. Our approach augments pretrained models with a lightweight meta-editor module that learns to detect knowledge conflicts during inference, localize the responsible parameters through gradient-based attribution, and apply targeted low-rank updates to specific attention and feed-forward components. The model maintains an internal epistemic state that tracks confidence and temporal validity of its knowledge, triggering self-revision when contradictions arise from contextual evidence. A consistency preservation objective ensures that edits remain localized, preventing unintended interference with related knowledge. Unlike retrieval-augmented approaches, Self-Editing Transformers permanently integrate corrections into the model's parameters, enabling seamless use of updated knowledge in complex multi-step reasoning. Our framework establishes a new paradigm for maintaining foundation models as living knowledge systems capable of graceful, continuous evolution.
