    0: 'Computing the polar decomposition and the related matrix sign function has been a well-studied problem in numerical analysis for decades. Recently, it has emerged as an important subroutine within the Muon algorithm for training deep neural networks. However, the requirements of this application differ sharply from classical settings: deep learning demands GPU-friendly algorithms that prioritize high throughput over high precision. We introduce *Polar Express*, a new method for computing the polar decomposition. Like Newton–Schulz and other classical polynomial methods, our approach uses only matrix-matrix multiplications, making it very efficient on GPUs. Inspired by earlier work of Chen & Chow and Nakatsukasa & Freund, *Polar Express* adapts the update rule at each iteration by solving a minimax optimization problem. We prove that this strategy minimizes error in a worst-case sense, allowing *Polar Express* to converge as rapidly as possible both in the early iterations and asymptotically. We also address finite-precision issues, making it practical to use in `bfloat16`.'
    1: Second-order optimization methods offer superior convergence properties but remain impractical for large-scale deep learning due to prohibitive computational costs. We introduce Trajectory Curvature Descent, a novel optimization framework that extracts implicit curvature information from the geometric structure of gradient trajectories without explicit Hessian computation. Our key insight is that the sequence of gradients encountered during optimization defines a curve on a Riemannian manifold whose local curvature directly reflects the loss landscape geometry. By maintaining a compact representation of recent gradient directions and analyzing their angular relationships, we derive a lightweight curvature tensor that preconditions parameter updates. This enables adaptive step sizes along different eigendirections of the loss surface using only gradient oracle access. We further introduce a parallel transport mechanism that ensures consistent curvature estimates across optimization steps, preventing the oscillatory behavior common in momentum-based methods. The resulting algorithm interpolates smoothly between steepest descent in flat regions and Newton-like updates near high-curvature areas, achieving quasi-second-order convergence rates while preserving the memory efficiency of first-order methods.
