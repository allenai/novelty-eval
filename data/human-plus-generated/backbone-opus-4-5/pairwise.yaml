  ideas:
    0: 'Electrophysiological (ExG) signals offer valuable insights into human physiology, yet building foundation models that generalize across everyday tasks remains challenging due to two key limitations: (i) insufficient data diversity, as most ExG recordings are collected in controlled labs with bulky, expensive devices; and (ii) task-specific model designs that require tailored processing (i.e., targeted frequency filters) and architectures, which limit generalization across tasks. To address these challenges, we introduce an approach for scalable, task-agnostic ExG monitoring in the wild. We collected 50 hours of unobtrusive free-living ExG data with an earphone-based hardware prototype to narrow the data diversity gap. At the core of our approach is Physiology-informed Multi-band Tokenization (PiMT), which decomposes ExG signals into 12 physiology-informed tokens, followed by a reconstruction task to learn robust representations. This enables adaptive feature recognition across the full frequency spectrum while capturing task-relevant information. We also introduce the DailySense dataset—the first to enable ExG-based analysis across five human senses.'
    1: Foundation models trained on naturalistic data may converge on computational strategies that parallel those evolved in biological neural systems, yet methods to systematically test this hypothesis remain limited. We introduce NeuroAlign, a framework for real-time alignment between streaming neural recordings and foundation model representations during naturalistic stimulus processing. NeuroAlign employs a bidirectional adapter architecture that learns correspondences between artificial network layers and neural population dynamics across brain regions, while respecting the temporal structure of biological computation. A contrastive objective encourages representational alignment at multiple timescales, from rapid sensory encoding to slower semantic integration, enabling identification of shared computational motifs between silicon and biological substrates. The framework supports both encoding models that predict neural responses from foundation model activations and decoding models that reconstruct model representations from neural data. Beyond improving neural decoding performance, NeuroAlign provides interpretable mappings that reveal which computational strategies are shared versus divergent between artificial and biological intelligence, offering a new lens for understanding the computational principles underlying cognition.
