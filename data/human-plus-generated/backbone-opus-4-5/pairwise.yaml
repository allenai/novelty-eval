    0: Multimodal learning has achieved remarkable success by jointly processing vision, audio, and language inputs, yet deployed systems frequently encounter scenarios where one or more modalities are unavailable due to sensor failures, privacy constraints, or bandwidth limitations. Current approaches either train combinatorially many subset-specific models or suffer significant degradation when inputs are incomplete. We introduce AnyModal, a unified framework that maintains robust performance under arbitrary modality availability without architectural changes or retraining. Our approach centers on modality-agnostic tokens that learn to aggregate information from whatever inputs are present through a novel cross-modal attention mechanism with learnable availability embeddings. During training, we employ stochastic modality dropout with curriculum scheduling, forcing the model to develop redundant cross-modal representations. A key innovation is our residual modality reconstruction objective, which encourages each modality's encoder to capture information predictive of absent modalities, enabling graceful degradation rather than catastrophic failure. AnyModal provides a practical solution for deploying multimodal systems in unpredictable real-world environments where complete observations cannot be guaranteed.
