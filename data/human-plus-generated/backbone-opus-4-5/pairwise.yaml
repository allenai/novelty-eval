    0: In this work, we propose FFDP, a set of IO-aware non-GEMM fused kernels supplemented with a distributed framework for image registration at unprecedented scales. Image registration is an inverse problem fundamental to biomedical and life sciences, but algorithms have not scaled in tandem with image acquisition capabilities. Our framework complements existing model parallelism techniques proposed for large-scale transformer training by optimizing non-GEMM bottlenecks and enabling convolution-aware tensor sharding. FFDP enables unprecedented capabilities such as performing multimodal registration of a 100μm ex-vivo human brain MRI volume at native resolution – an inverse problem more than 570× larger than a standard clinical datum – using only 8 A6000 GPUs. FFDP accelerates existing optimization and deep learning registration pipelines while reducing peak memory consumption, and enables fitting substantially larger problems on a single GPU than previously possible.
    1: Modern machine learning workloads execute across increasingly heterogeneous hardware landscapes comprising CPUs, GPUs, TPUs, and emerging accelerators, yet programmers must still manually orchestrate memory allocation, data placement, and cross-device transfers. This explicit management introduces complexity, limits portability, and often yields suboptimal performance. We introduce HeteroHeap, a unified managed memory abstraction that virtualizes the entire heterogeneous memory hierarchy as a single coherent address space. HeteroHeap combines static dataflow analysis with lightweight runtime profiling to automatically determine optimal data placement and migration strategies across devices. A key innovation is our learned placement policy that captures workload-specific access patterns during an initial profiling phase and continuously adapts to dynamic execution characteristics. The system interposes transparently beneath existing ML frameworks, requiring no modification to user code while providing automatic memory coherence guarantees. HeteroHeap employs speculative prefetching guided by operator dependency graphs and lazy synchronization to overlap computation with data movement. Our design preserves the programming simplicity of single-device development while unlocking the performance potential of heterogeneous systems, offering a practical path toward hardware-agnostic machine learning infrastructure.
