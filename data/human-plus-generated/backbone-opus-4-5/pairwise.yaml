    0: We develop a linear response framework for interpretability that treats a neural network as a Bayesian statistical mechanical system. A small perturbation of the data distribution, for example shifting the Pile toward GitHub or legal text, induces a first-order change in the posterior expectation of an observable localized on a chosen component of the network. The resulting susceptibility can be estimated efficiently with local SGLD samples and factorizes into signed, per-token contributions that serve as attribution scores. We combine these susceptibilities into a response matrix whose low-rank structure separates functional modules such as multigram and induction heads in a 3M-parameter transformer.
    1: Understanding the internal mechanisms of deep neural networks remains challenging, as existing interpretability methods typically provide static explanations at fixed levels of abstraction. We introduce Dialogic Interpretability, a framework that enables interactive, multi-turn exploration of model internals through natural language conversation. Our approach constructs a hierarchical representation of neural network computations that spans multiple abstraction levels—from individual neuron activations to emergent computational circuits to high-level behavioral patterns. A dialogue agent navigates this hierarchy in response to user queries, dynamically selecting and composing explanations appropriate to the user's expertise and informational needs. The framework supports zoom operations that allow users to request finer-grained mechanistic details or coarser conceptual summaries, cross-referencing that links related computational patterns across layers, and counterfactual probing that explains how internal representations would change under hypothetical inputs. By treating interpretability as an interactive process rather than a static artifact, Dialogic Interpretability accommodates diverse stakeholders—from ML researchers seeking circuit-level understanding to domain experts requiring behavioral intuitions—within a unified interface.
