    0: Robust 3D hand reconstruction is challenging in egocentric vision due to depth ambiguity, self-occlusion, and complex hand-object interactions. Prior works attempt to mitigate the challenges by scaling up training data or incorporating auxiliary cues, often falling short of effectively handling unseen contexts. In this paper, we introduce EgoHandICL, the first in-context learning (ICL) framework for 3D hand reconstruction that achieves strong semantic alignment, visual consistency, and robustness under challenging egocentric conditions. Specifically, we develop (i) complementary exemplar retrieval strategies guided by vision–language models (VLMs), (ii) an ICL-tailored tokenizer that integrates multimodal context, and (iii) a Masked Autoencoders (MAE)-based architecture trained with 3D hand–guided geometric and perceptual objectives. We further show EgoHandICL's applicability by testing it on real-world egocentric cases and integrating it with EgoVLMs to enhance their hand–object interaction reasoning.
    1: Multimodal learning in video requires understanding correspondences between audio and visual streams across multiple temporal scales, from millisecond-level lip-phoneme synchronization to second-level scene-soundtrack alignment. Existing approaches either learn coarse global representations or require dense manual annotations for fine-grained alignment. We introduce Hierarchical Audio-Visual Synchrony Learning (HAVSL), a self-supervised framework that discovers natural cross-modal correspondences at multiple temporal resolutions without explicit supervision. HAVSL employs a pyramid of contrastive objectives operating at different temporal granularities, where each level captures synchrony patterns appropriate to its timescale. A cross-scale consistency mechanism ensures coherent representations by enforcing that fine-grained alignments compose into coarser correspondences. To prevent shortcut learning, we introduce temporal shuffling augmentations that force the model to rely on genuine audio-visual relationships rather than spurious correlations. The learned hierarchical representations provide rich cross-modal grounding that transfers to diverse downstream tasks including audio-visual source localization, speech-driven animation, and video captioning. HAVSL offers a principled approach to exploiting the natural temporal structure of audiovisual data as free supervision for learning semantically meaningful multimodal representations.
