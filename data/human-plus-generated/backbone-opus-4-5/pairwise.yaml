    0: 'The rapid progress of AI and robotics may profoundly transform society, as humans and robots begin to coexist in shared communities, bringing both opportunities and challenges. To explore this future, we present Virtual Community—an open-world platform for humans, robots, and society—built on a universal physics engine and grounded in real-world 3D scenes. With Virtual Community, we aim to enable the study of embodied social intelligence at scale. To support these, Virtual Community features: 1) An open-source multi-agent physics simulator that supports robot, human, and their interactions within a society; 2) A large‑scale, real‑world aligned environment generation pipeline, including vast outdoor space, diverse indoor scenes, and a community of grounded agents with rich characters and appearances. Leveraging Virtual Community, we propose two novel challenges. The Community Planning Challenge evaluates multi‑agent reasoning and planning in open‑world settings, such as cooperating to help agents with daily activities and efficiently connecting other agents. The Community Robot Challenge requires multiple heterogeneous robots to collaborate in solving complex open‑world tasks. We have open-sourced our project and hope that Virtual Community will unlock further study of human-robot coexistence in open worlds.'
    1: Machine learning benchmarks have driven remarkable progress, yet they predominantly evaluate models under static conditions that poorly reflect real-world deployment where data distributions evolve continuously. We introduce ChronoBench, a temporal evaluation framework that transforms how we assess model robustness by explicitly incorporating time as a first-class dimension. ChronoBench provides a principled methodology for constructing temporally-aware benchmarks across modalities, including standardized protocols for partitioning data along temporal axes, measuring performance degradation curves, and quantifying adaptation speed to distribution shifts. We contribute a taxonomy of temporal shift types—gradual drift, sudden shifts, cyclical patterns, and emergent categories—along with corresponding metrics that capture distinct aspects of temporal robustness. The framework includes tools for retrofitting existing benchmarks with temporal structure and guidelines for collecting new temporally-grounded datasets. ChronoBench reveals that conventional benchmark rankings can invert dramatically when temporal factors are considered, suggesting that deployment-ready model selection requires fundamentally different evaluation paradigms than currently practiced. Our framework enables systematic study of the gap between static benchmark performance and real-world temporal robustness.
