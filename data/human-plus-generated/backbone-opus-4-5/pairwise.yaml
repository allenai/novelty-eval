  ideas:
    0: 'As a topological invariant for discrete structures, discrete curvature has been widely adopted in the study of complex networks and graph neural networks. A prevailing viewpoint posits that edges with highly negative curvature will induce graph bottlenecks and the over-squashing phenomenon. In this paper, we critically re-examine this view and put forward our central claim: **high negative curvature is a sufficient but not a necessary condition for over-squashing**. We first construct a family of counterexamples demonstrating the failure of discrete curvature, where some edges are severely squashed, but the curvature still appears positive. Furthermore, extensive experiments demonstrate that the most commonly used discrete curvature measure --- Ollivier–Ricci curvature --- fails to detect a substantial portion of over-squashed edges. To alleviate this limitation, we propose Weighted Augmented Forman-3 Curvature ($\mathsf{WAF3}$), which significantly improves the detection of over-squashed edges. Additionally, we develop a highly efficient approximation algorithm for $\mathsf{WAF3}$, enabling scalable curvature computation on large graphs.'
    1: Message passing neural networks struggle with over-smoothing, over-squashing, and capturing long-range dependencies, stemming from their local aggregation paradigm that ignores the geometry of feature spaces. We introduce Bundle Neural Networks, a framework that models graph-structured data as sections of fiber bundles, where each node carries a fiber—a geometric feature space equipped with a connection specifying how features transform along edges. Our architecture performs message passing through parallel transport operators that move features between fibers in a geometry-preserving manner, enabling principled aggregation along paths rather than just immediate neighborhoods. The bundle structure naturally accommodates heterogeneous node and edge types through varying fiber geometries, while learnable connections adapt to capture task-relevant geometric relationships. We derive equivariant layers that respect both graph automorphisms and fiber symmetries, providing strong inductive biases for structured prediction. Path-based aggregation with curvature-aware attention mechanisms allows information to flow across distant nodes without the distortion typical of deep message passing. Bundle Neural Networks provide a unifying geometric perspective that subsumes spectral methods, sheaf neural networks, and gauge-equivariant approaches as special cases, while enabling new architectural designs grounded in differential geometry.
