    0: "Denoising diffusions sample from a probability distribution $\\mu$ in $\\mathbb{R}^d$ by constructing a stochastic process $(\\hat{\\mathbf{x}}_t:t\\ge 0)$ in $\\mathbb{R}^d$ such that  $\\hat{\\mathbf{x}}_0$ is easy to sample, but the distribution of $\\hat{\\mathbf{x}}_T$ at large $T$ approximates $\\mu$. The drift $\\mathbf{m}:\\mathbb{R}^{d}\\times\\mathbb{R}\\to\\mathbb{R}^d$ of this diffusion process is learned by minimizing a score-matching objective. \n\nIs every probability distribution $\\mu$, for which sampling is tractable, also amenable to sampling via diffusions? We address this question by studying its relation to information-computation gaps in statistical estimation. Earlier work in this area constructs broad families of distributions $\\mu$ for which sampling is easy, but approximating the drift $\\mathbf{m}(\\mathbf{y},t)$ is conjectured to be intractable, and provides rigorous evidence for intractability.\n\nWe prove that this implies a failure of sampling via diffusions. First, there exist drifts whose score matching objective is superpolynomially close to the optimum value (among polynomial time drifts) and yet yield samples with distribution that is very far from the target one. Second, any polynomial-time drift that is also Lipschitz continuous results in equally incorrect sampling.\n\nWe instantiate our results on the problem of sampling a sparse low-rank matrix. Our work implies that caution should be used in adopting diffusion sampling when other approaches are available."
    1: 'Classical generalization theory characterizes model complexity through static measures that fail to explain the benign overfitting observed in overparameterized deep learning. We introduce trajectory-dependent generalization bounds that incorporate the geometric structure of optimization paths rather than solely analyzing properties of final solutions. Our framework defines a notion of accumulated curvature along gradient descent trajectories, capturing how the optimizer navigates regions of varying loss landscape geometry. We prove that solutions reached through low-curvature trajectories satisfy tighter generalization bounds than those reached through high-curvature paths, even when endpoint flatness measures are identical. This trajectory-aware perspective reveals that gradient descent implicitly selects not just flat minima, but minima reached via geometrically favorable routes. We establish connections between trajectory curvature and the effective dimensionality of learned representations, showing that smooth optimization paths correspond to progressive feature compression. Our analysis provides a unified explanation for why learning rate schedules, batch size, and initialization schemes affect generalization: they modulate the geometric properties of optimization trajectories. The framework yields practical insights for designing optimization procedures that explicitly encourage low-curvature paths toward well-generalizing solutions.'
