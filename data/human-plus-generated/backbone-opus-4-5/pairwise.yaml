    0: 'Diffusion models learn rich semantic representations during the denoising process, yet leveraging this structure for controllable generation typically requires additional training, architectural modifications, or external guidance networks. We introduce Semantic Steering Vectors, a training-free framework for fine-grained control of diffusion model outputs through targeted interventions on intermediate activations. Our approach discovers interpretable semantic directions in the latent space of pre-trained diffusion models using minimal supervision—as few as ten contrastive image pairs per attribute. During inference, we modulate the denoising trajectory by adding scaled steering vectors to intermediate layer activations, enabling precise control over attributes such as lighting, style, pose, and object properties. Crucially, steering vectors are composable: multiple directions can be combined with independent scaling factors to achieve conjunctive control without interference. We further introduce orthogonal projection to minimize entanglement between semantically related attributes. Our analysis reveals that different layers encode attributes at varying levels of abstraction, with early layers governing global structure and later layers controlling fine details. Semantic Steering Vectors provide a unified, efficient mechanism for interpretable control while offering insights into the internal organization of visual knowledge in generative models.'
    1: 'Massive Activations (MAs) are a well-documented phenomenon across Transformer architectures, and prior studies in both LLMs and ViTs have shown that they play a substantial role in shaping model behavior. However, the nature and function of MAs within Diffusion Transformers (DiTs) remain largely unexplored. In this work, we systematically investigate these activations to elucidate their role in visual generation. We found that these massive activations occur across all spatial tokens, and their distribution is modulated by the input timestep embeddings. Importantly, our investigations further demonstrate that these massive activations play a key role in local detail synthesis, while having minimal impact on the overall semantic content of output.

      Building on these insights, we propose Detail Guidance (DG), a MAs-driven, training-free self-guidance strategy to explicitly enhance local detail fidelity for DiTs. Specifically, DG constructs a degraded "detail-deficient" model by disrupting MAs and leverages it to guide the original network toward higher-quality detail synthesis. Our DG can seamlessly integrate with Classifier-Free Guidance (CFG), enabling joint enhancement of detail fidelity and prompt alignment.'
