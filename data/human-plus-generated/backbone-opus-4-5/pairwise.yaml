  ideas:
    0: Large language model alignment typically optimizes for aggregated human preferences, inadvertently encoding dominant cultural perspectives while marginalizing minority viewpoints. We introduce Pluralistic Alignment, a framework that reconceptualizes alignment as value-aware deliberation rather than preference aggregation. Our approach learns a structured latent space of value orientations from diverse annotator subpopulations, enabling models to recognize the value-laden nature of queries and generate responses that appropriately engage with moral pluralism. Central to our framework is a hierarchical constraint architecture that distinguishes between universal safety boundaries—which remain inviolable across contexts—and culturally-situated preferences where plurality should be respected. We propose a training objective that encourages epistemic humility on contested normative questions while maintaining decisive refusal of universally harmful requests. The framework incorporates a transparency mechanism that surfaces when responses involve value-laden trade-offs, empowering users to understand the ethical dimensions of model outputs. Pluralistic Alignment offers a path toward AI systems that honor human diversity without relativizing fundamental safety constraints, addressing a critical gap between current alignment practices and the genuine heterogeneity of human values.
    1: 'Reward models (RMs) play a critical role in aligning AI behaviors with human preferences, yet they face two fundamental challenges: (1) Modality Imbalance, where most RMs are mainly focused on text and image modalities, offering limited support for video, audio, and other modalities; and (2) Preference Rigidity, where training on fixed binary preference pairs fails to capture the complexity and diversity of personalized preferences. To address the above challenges, we propose Omni-Reward, a step toward generalist omni-modal reward modeling with support for free-form preferences, consisting of: (1) Evaluation: We introduce Omni-RewardBench, the first omni-modal RM benchmark with free-form preferences, covering nine tasks across five modalities including text, image, video, audio, and 3D; (2) Data: We construct Omni-RewardData, a multimodal preference dataset comprising 248K general preference pairs and 69K instruction-tuning pairs for training generalist omni-modal RMs; (3) Model: We propose Omni-RewardModel, which includes both discriminative and generative RMs.'
