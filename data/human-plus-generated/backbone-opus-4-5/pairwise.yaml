    0: Credit assignment over long horizons remains a fundamental challenge in reinforcement learning, as agents must connect distant actions to eventual outcomes through complex causal chains. We introduce Linguistic Thought Simulation (LTS), a framework that augments model-based reinforcement learning with abstract causal reasoning expressed in natural language. LTS employs a language model to generate counterfactual reasoning traces that hypothesize causal relationships between actions, intermediate states, and rewards at a semantic level of abstraction. These linguistic simulations capture relational structure that complements the pixel-level predictions of traditional world models. A dual-consistency objective trains the policy to align with both grounded trajectory data and the abstract causal attributions from linguistic reasoning, enabling credit to propagate through semantically meaningful pathways rather than purely temporal ones. To ground abstract reasoning in embodied experience, we introduce a bidirectional translation mechanism that maps between state observations and language descriptions. LTS provides a principled approach to injecting structured inductive biases about causality and goal decomposition into reinforcement learning, addressing the abstraction gap between human-like reasoning and low-level policy optimization.
    1: Safe exploration is a key requirement for reinforcement learning agents to learn and adapt online, beyond controlled (e.g. simulated) environments. In this work, we tackle this challenge by utilizing suboptimal yet conservative policies (e.g., obtained from offline data or simulators) as priors. Our approach, SOOPER, uses probabilistic dynamics models to optimistically explore, yet pessimistically fall back to the conservative policy prior if needed. We prove that SOOPER guarantees safety throughout learning, and establish convergence to an optimal policy by bounding its cumulative regret.
