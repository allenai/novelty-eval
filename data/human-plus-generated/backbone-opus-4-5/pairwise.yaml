  ideas:
    0: 'While Large Language Models (LLMs) hold promise to become autonomous agents, they often explore suboptimally in sequential decision-making. Recent work has sought to enhance this capability via supervised fine-tuning (SFT) or reinforcement learning (RL), improving regret on the classic multi-armed bandit task. However, it remains unclear how these learning methods shape exploration strategies and how well they generalize. We investigate both paradigms by training LLMs with SFT on expert trajectories and RL with a range of tailored reward signals including a strategic, regret-shaped reward to reduce variance, and an algorithmic reward that enables oracle imitation. Behavioral analysis reveals that gains often stem from more sophisticated but greedier exploitation: RL/SFT agents are more prone to early catastrophic failure than pre-trained models, prematurely abandoning exploration. Furthermore, agents trained to imitate UCB learn to outperform their teacher by adopting more exploitative variants. Our findings clarify when each training paradigm is preferable and advocate tailored reward design and evaluation beyond average regret to promote robust exploratory behavior.'
    1: Large language models generate reasoning traces autoregressively, committing to each step before considering its downstream implications. This forward-only generation leads to error accumulation, logical inconsistencies, and brittle reasoning chains. We introduce Reasoning Diffusion, a framework that recasts multi-step reasoning as an iterative refinement process over structured thought representations. Rather than producing reasoning in a single left-to-right pass, our approach initializes a coarse reasoning skeleton and progressively refines it through bidirectional dependency-aware updates. A learned critic module identifies logical tensions and incomplete justifications within the current reasoning state, while a refinement module propagates corrections both forward and backward along the reasoning chain. This enables the model to revise earlier steps in light of later conclusions, achieving global coherence that autoregressive generation cannot guarantee. We introduce a self-consistency training objective that teaches models to detect and repair reasoning flaws using synthetically corrupted traces. The framework operates as a post-hoc wrapper around frozen language models, requiring no modification to base model weights. Reasoning Diffusion provides a new paradigm for eliciting reliable, self-consistent reasoning from foundation models.
