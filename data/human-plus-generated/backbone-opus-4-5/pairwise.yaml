  ideas:
    0: 'Machine learning benchmarks predominantly evaluate models on temporally static data, overlooking the fundamental challenge that real-world knowledge continuously evolves through scientific discoveries, social changes, and factual corrections. We introduce ChronoEval, a living benchmark framework designed to assess temporal robustness in language and multimodal models. ChronoEval comprises versioned knowledge snapshots across diverse domains—science, geopolitics, medicine, and technology—spanning two decades, with explicit annotations distinguishing knowledge updates, factual corrections, deprecated concepts, and emerging terminology. The framework defines three complementary evaluation protocols: temporal consistency (maintaining accuracy on stable facts), adaptive updating (incorporating new valid knowledge), and graceful deprecation (appropriately handling outdated information without catastrophic forgetting). Unlike static benchmarks that become stale, ChronoEval includes a systematic update protocol with quarterly revisions and provenance tracking, enabling longitudinal studies of model temporal decay. We provide temporal stratification tools that diagnose when models'' knowledge becomes unreliable, supporting deployment decisions in time-sensitive applications. ChronoEval establishes a foundation for developing temporally-aware systems capable of lifelong learning in dynamic information environments.'
    1: 'The rapid development and widespread adoption of Audio Large Language Models (ALLMs) require a rigorous assessment of their trustworthiness. However, existing evaluation frameworks, primarily designed for text, are not equipped to handle the unique vulnerabilities introduced by audio''s acoustic properties. We find that significant trustworthiness risks in ALLMs arise from non-semantic acoustic cues, such as timbre, accent, and background noise, which can be used to manipulate model behavior. To address this gap, we propose AudioTrust, the first framework for large-scale and systematic evaluation of ALLM trustworthiness concerning these audio-specific risks. AudioTrust spans six key dimensions: fairness, hallucination, safety, privacy, robustness, and authentication. It is implemented through 26 distinct sub-tasks and a curated dataset of over 4,420 audio samples collected from real-world scenarios (e.g., daily conversations, emergency calls, and voice assistant interactions), purposefully constructed to probe the trustworthiness of ALLMs across multiple dimensions. AudioTrust employs human-validated automated pipelines to objectively and scalably quantify model outputs, offering critical insights into the secure and trustworthy deployment of future audio models.'
