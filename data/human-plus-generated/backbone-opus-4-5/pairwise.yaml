  ideas:
    0: 'Understanding the computational principles shared between biological and artificial neural networks remains a central challenge in both neuroscience and machine learning. We introduce Neural Geometry Alignment (NGA), a training framework that bidirectionally couples artificial network representations with biological neural recordings during learning. Rather than treating neural data as prediction targets, NGA employs a soft geometric constraint that encourages artificial hidden representations to preserve the relational structure observed in population-level neural activity while maintaining task performance. The framework uses optimal transport to align representational similarity matrices across biological and artificial systems, allowing flexible correspondence discovery without requiring neuron-to-unit mappings. NGA enables two complementary research modes: forward mode identifies which architectural and learning choices produce representations most aligned with biological circuits, while inverse mode reveals which task-relevant features biological systems emphasize by analyzing where alignment naturally emerges or breaks down. We provide theoretical analysis showing that geometric alignment constraints preserve task-relevant gradients while shaping representation topology. NGA offers a unified framework for testing computational hypotheses about biological neural coding while simultaneously improving interpretability of artificial systems through grounding in biological computation.'
    1: Training recurrent neural networks (RNNs) to perform neuroscience-style tasks has become a popular way to generate hypotheses for how neural circuits in the brain might perform computations. Recent work has demonstrated that task-trained RNNs possess a strong simplicity bias. In particular, this inductive bias often causes RNNs trained on the same task to collapse on effectively the same solution, typically comprised of fixed-point attractors or other low-dimensional dynamical motifs. While such solutions are readily interpretable, this collapse proves counterproductive for the sake of generating a set of genuinely unique hypotheses for how neural computations might be performed. Here we propose Iterative Neural Similarity Deflation (INSD), a simple method to break this inductive bias. By penalizing linear predictivity of neural activity produced by standard task-trained RNNs, INSD finds an alternative class of solutions to classic neuroscience-style RNN tasks. Our findings underscore the importance of moving beyond the simplicity bias to uncover richer and more varied models of neural computation.
