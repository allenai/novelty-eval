  ideas:
    0: "The Private Aggregation of Teacher Ensembles (PATE) framework enables privacy-preserving machine learning by aggregating responses from disjoint subsets of sensitive data. Adaptations of PATE to tasks with inherent output diversity such as text generation, where the desired output is a sample from a distribution, face a core tension: \nas diversity increases, samples from different teachers are less likely to agree, but lower agreement results in reduced utility for the same privacy requirements. Yet suppressing diversity to artificially increase agreement is undesirable, as it distorts the output of the underlying model, and thus reduces output quality.\n\nWe propose Hot PATE, a variant of PATE designed for diverse generative settings. \nWe formalize the notion of a *diversity-preserving* *ensemble sampler* and introduce an efficient sampler that provably transfers diversity without incurring additional privacy cost.\nHot PATE requires only API access to proprietary models and can be used as a drop-in replacement for existing *Cold* PATE samplers."
    1: Reinforcement Learning from Human Feedback has become the dominant paradigm for aligning language models with human values, yet the preference data underlying these methods often reflects demographic imbalances that lead to uneven alignment quality across population groups. We introduce Equitable Alignment, a framework that reconceptualizes fairness not as a post-hoc constraint but as a fundamental property of the alignment process itself. Our approach explicitly models preference heterogeneity across demographic groups and optimizes for balanced alignment quality rather than aggregate preference satisfaction. We formalize alignment disparity as a measurable phenomenon where models exhibit systematically higher value misalignment for underrepresented communities whose preferences diverge from majority populations. To address this, we propose a multi-objective optimization procedure that maintains group-wise alignment guarantees while preserving overall model capabilities. The framework incorporates uncertainty-aware preference modeling to appropriately weight feedback from groups with limited representation, preventing their preferences from being dominated by majority signal. Equitable Alignment provides theoretical foundations connecting distributive justice principles to alignment objectives, offering a path toward AI systems that serve diverse populations with comparable fidelity to their values and needs.
