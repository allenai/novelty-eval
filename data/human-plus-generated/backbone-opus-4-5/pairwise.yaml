  ideas:
    0: Responsible AI development requires simultaneously optimizing for alignment, fairness, safety, and privacy—objectives that frequently conflict in practice. Existing approaches address these values independently, creating systems that satisfy individual criteria while failing under their intersection. We introduce Pluralistic Value Reasoning (PVR), a framework that explicitly models interdependencies among competing normative objectives in large language models. PVR represents values as a dynamic constraint graph where edges encode contextual compatibility and tension relationships learned from diverse stakeholder preferences. During inference, a lightweight arbitration module identifies active value conflicts and applies learned resolution strategies that reflect contextual priorities rather than fixed hierarchies. The framework surfaces irreducible trade-offs to users through structured explanations, enabling transparent and contestable AI decision-making. A constitutional backbone ensures baseline guarantees while the arbitration layer handles nuanced conflicts that rigid rules cannot anticipate. PVR supports iterative preference elicitation, allowing the system to refine its understanding of stakeholder values over deployment. This work provides theoretical grounding and practical mechanisms for building AI systems that navigate value pluralism with transparency, moving beyond single-objective optimization toward genuinely multi-stakeholder alignment.
    1: Recently, OpenAI (2025) showed that training against a chain of thought (CoT) monitor can cause obfuscated CoTs, which contain bad behavior the monitor cannot detect. They proposed to keep CoTs monitorable by training only against output monitors that do not have access to CoT. We show that such training can still cause obfuscated CoTs via two mechanisms. First, when a model is trained to produce a safe-looking output, that model may generalize to making its CoTs look safe. Second, since later tokens are conditioned on earlier ones, safe‑looking CoTs may increase the likelihood of safe outputs, causing safe-looking CoTs to be reinforced. We introduce two mitigations to address these two issues. To our knowledge, we are the first to identify and mitigate these problems. Our work implies that preserving CoT monitorability is more difficult than previously thought; we suggest practical guidelines for AI developers to maintain monitorable CoTs.
