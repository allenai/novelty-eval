    0: Large language models process information through deterministic forward passes that commit to single latent representations at each layer, discarding alternative interpretations that may prove valuable for downstream reasoning. We introduce Superposition Transformers, an architecture that natively maintains and propagates multiple hypothesis states through network layers within a single forward pass. Our approach represents hidden states as structured mixtures over alternative interpretations, implemented through a novel superposition embedding space where distinct semantic hypotheses coexist without interference. We design modified attention and feedforward mechanisms that operate directly on superposed representations, enabling parallel exploration of reasoning paths with shared computation. A learned collapse mechanism selectively resolves superpositions when task demands require commitment, while preserving uncertainty where beneficial. This framework provides intrinsic calibration by grounding output distributions in genuinely maintained alternatives rather than post-hoc sampling. Superposition Transformers offer a computationally efficient approach to representing model uncertainty and exploring multi-modal solution spaces, with implications for reasoning tasks requiring consideration of multiple valid interpretations, ambiguous inputs, and problems where premature commitment to single hypotheses limits solution quality.
    1: Recent progress in large reasoning models for challenging mathematical reasoning has been driven by reinforcement learning (RL). Incorporating long chain-of-thought (CoT) data during mid-training has also been shown to substantially improve reasoning depth. However, current approaches often utilize CoT data indiscriminately, leaving open the critical question of which data types most effectively enhance model reasoning capabilities. In this paper, we define the foundation model's reasoning potential for the first time as the inverse of the number of independent attempts required to correctly answer the question, which is strongly correlated with the final model performance. We then propose utilizing diverse data enriched with high-value reasoning patterns to expand the reasoning potential. Specifically, we abstract atomic reasoning patterns from CoT sequences, characterized by commonality and inductive capabilities, and use them to construct a core reference set enriched with valuable reasoning patterns. Furthermore, we propose a dual-granularity algorithm involving chains of reasoning patterns and token entropy, efficiently selecting high-value CoT data (CoTP) from the data pool that aligns with the core set, thereby training models to master reasoning effectively.
