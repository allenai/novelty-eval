    0: Existing interpretability methods predominantly offer static explanations of neural network behavior, analyzing individual components or producing fixed attribution maps that fail to capture how information transforms during inference. We introduce Concept Flow Tracing, a dynamic interpretability framework that tracks the emergence, transformation, and interaction of semantic concepts as they propagate through network layers. Our approach employs lightweight concept probes anchored to a shared semantic space, enabling continuous monitoring of how abstract representations crystallize from distributed encodings into decision-relevant features. Unlike circuit-based analyses that require extensive manual investigation, Concept Flow Tracing automatically identifies critical computational phases where concept representations undergo significant transformation—moments we term 'semantic phase transitions.' The framework reveals that models often maintain competing conceptual hypotheses through intermediate layers before converging, providing new insights into neural reasoning processes. We further introduce flow perturbation analysis, which intervenes on concept trajectories mid-computation to assess causal relationships between intermediate representations and outputs. Concept Flow Tracing offers a temporal lens on model computation, complementing existing structural interpretability approaches with a process-oriented perspective on how neural networks arrive at their conclusions.
    1: 'The fidelity with which neural networks can now generate content such as music presents a scientific opportunity: these systems appear to have learned implicit theories of such content''s structure through statistical learning alone. This offers a potentially new lens on theories of human-generated media. When internal representations align with traditional constructs (e.g. chord progressions in music), they show how such categories can emerge from statistical regularities; when they diverge, they expose limits of existing frameworks and patterns we may have overlooked but that nonetheless carry explanatory power. In this paper, focusing on autoregressive music generators, we introduce a method for discovering interpretable concepts using sparse autoencoders (SAEs), extracting interpretable features from the residual stream of a transformer model. We make this approach scalable and evaluable using automated labeling and validation pipelines. Our results reveal both familiar musical concepts and coherent but uncodified patterns lacking clear counterparts in theory or language. As an extension, we show such concepts can be used to steer model generations. Beyond improving model transparency, our work provides an empirical tool for uncovering organizing principles that have eluded traditional methods of analysis and synthesis.'
