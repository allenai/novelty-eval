    0: Classical generalization theory relies on capacity measures that characterize hypothesis classes independent of the learning algorithm, yet these measures fail to explain the remarkable generalization of overparameterized neural networks. We introduce trajectory-dependent generalization bounds that explicitly incorporate the optimization path taken during training. Our framework defines a novel complexity measure, the information-geometric path integral, which quantifies the cumulative curvature of the loss landscape traversed by gradient descent. Unlike static capacity measures, this path-dependent complexity naturally decreases when optimization follows low-curvature trajectories toward flat minima, providing a principled connection between optimization geometry and generalization. We establish PAC-Bayes-style bounds where the prior distribution is informed by the early training dynamics, allowing the bound to adapt to the specific problem instance. Our theoretical analysis reveals that implicit regularization emerges from the interaction between gradient noise and loss landscape geometry along the optimization trajectory. This framework unifies disparate observations about learning rate effects, batch size influence, and early stopping into a coherent theoretical picture, offering new insights into algorithm-dependent generalization in deep learning.
    1: 'A major problem in the study of large language models is to understand their inherent low-dimensional structure. We introduce an approach to study the low-dimensional structure of language models at a model-agnostic level: as sequential probabilistic models. We first empirically demonstrate that a wide range of modern language models exhibit low-rank structure: in particular, matrices built from the model''s logits for varying sets of prompts and responses have low approximate rank. We then show that this low-rank structure can be leveraged for generation --- in particular, we can generate a response to a target prompt using a linear combination of the model''s outputs on unrelated, or even nonsensical prompts.


      On the theoretical front, we observe that studying the approximate rank of language models in the sense discussed above yields a simple universal abstraction whose theoretical predictions parallel our experiments. We then analyze the representation power of the abstraction and give provable learning guarantees.'
