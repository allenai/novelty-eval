    0: We study function spaces parametrized by neural networks, referred to as neuromanifolds. Specifically, we focus on deep Multi-Layer Perceptrons (MLPs) and Convolutional Neural Networks (CNNs) with an activation function that is a sufficiently generic polynomial. First, we address the identifiability problem, showing that, for almost all functions in the neuromanifold of an MLP, there exist only finitely many parameter choices yielding that function. For CNNs, the parametrization is generically one-to-one. As a consequence, we compute the dimension of the neuromanifold. Second, we describe singular points of neuromanifolds. We characterize singularities completely for CNNs, and partially for MLPs. In both cases, they arise from sparse subnetworks. For MLPs, we prove that these singularities often correspond to critical points of the mean-squared error loss, which does not hold for CNNs. This provides a geometric explanation of the sparsity bias of MLPs. All of our results leverage tools from algebraic geometry.
    1: Understanding why overparameterized models generalize remains a central challenge in learning theory. We propose a unified theoretical framework connecting the local geometry of loss landscape minima to the information-theoretic structure of learned representations. Our key contribution is establishing formal relationships between the Hessian spectrum at convergence and the mutual information between intermediate representations and input data. We derive novel generalization bounds that depend on a geometric-information complexity measure, capturing how the curvature of the loss surface constrains the effective information capacity of the learned function class. This framework reveals that flat minima correspond to representations achieving implicit information bottlenecks, where task-irrelevant information is compressed while task-relevant structure is preserved. We further show how gradient-based optimization dynamics naturally bias learning toward solutions satisfying specific geometric-information trade-offs, providing theoretical grounding for empirical observations about flatness and generalization. Our analysis yields tighter bounds than classical complexity measures for interpolating models and offers new insights into the role of depth, width, and architectural choices in controlling the geometry-information relationship during learning.
