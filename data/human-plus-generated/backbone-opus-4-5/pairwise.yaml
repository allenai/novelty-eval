    0: "Federated Graph-level Clustering (FGC) offers a promising framework for analyzing distributed graph data while ensuring privacy protection.\nHowever, existing methods fail to simultaneously consider knowledge heterogeneity across intra- and inter-client, and still attempt to share as much knowledge as possible, resulting in consensus failure in the server.\nTo solve these issues, we propose a novel **F**ederated **G**raph-level **C**lustering **N**etwork with **D**ual **K**nowledge **S**eparation (FGCN-DKS). \nThe core idea is to decouple differentiated subgraph patterns and optimize them separately on the client, and then leverage cluster-oriented patterns to guide personalized knowledge aggregation on the server.\nSpecifically, on the client, we separate personalized subgraphs and cluster-oriented subgraphs for each graph. Then the former are retained locally for further refinement of the clustering process, while pattern digests are extracted from the latter for uploading to the server.\nOn the server, we calculate the relation of inter-cluster patterns to adaptively aggregate cluster-oriented prototypes and parameters. Finally, the server generates personalized guidance signals for each cluster of clients, which are then fed back to local clients to enhance overall clustering performance."
    1: Representation learning methods—supervised, self-supervised, semi-supervised, and unsupervised—are typically developed and applied independently, missing opportunities for synergistic learning dynamics. We introduce Supervision Spectrum Learning (SSL²), a unified framework that dynamically orchestrates multiple supervision signals throughout the representation learning process. SSL² employs a meta-controller that continuously assesses representation quality through intrinsic metrics and adaptively reweights contributions from contrastive objectives, reconstruction losses, clustering constraints, and available labels. Rather than treating supervision paradigms as discrete choices, our framework models them as a continuous spectrum, enabling smooth transitions as representations mature. The meta-controller learns a curriculum over supervision types, initially emphasizing structure discovery through unsupervised objectives, progressively incorporating invariance-building self-supervised signals, and strategically integrating label information to refine decision boundaries. A key innovation is our representation maturity estimator, which tracks feature stability, cluster separability, and gradient alignment to inform supervision scheduling without requiring held-out validation data. SSL² produces representations that inherit the generalization benefits of self-supervised learning while achieving the discriminative power of supervised approaches, offering a principled path toward supervision-agnostic representation learning.
