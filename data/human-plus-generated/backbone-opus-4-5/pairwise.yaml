    0: Existing causal discovery methods are fundamentally limited by the assumption of a static causal graph, a constraint that fails in real-world systems where causal relationships dynamically vary with underlying system parameters. This discrepancy prevents the application of causal discovery in critical domains such as industrial process control, where understanding how causal effects change is essential. We address this gap by proposing a new paradigm that moves beyond static graphs to learn functional causal representations. We introduce a framework that models each causal link not as a static weight but as a function of measurable system parameters. By representing these functions using Polynomial Chaos Expansions (PCE), we develop a tractable method to learn the complete parametric causal structure from observational data. We provide theoretical proofs for the identifiability of these functional models and introduce a novel, provably convergent learning algorithm that provides an interpretable model of how causal mechanisms evolve.
    1: 'Causal discovery methods typically assume that the underlying causal structure remains fixed, yet real-world systems exhibit evolving causal relationships as contexts shift, interventions accumulate, and environments change. We introduce Causal Dynamics Models, a framework that treats causal graphs as time-varying objects and learns their continuous evolution through a latent dynamical system. Our approach parameterizes trajectories through a learned causal graph manifold, where each point represents a valid causal structure and motion captures systematic changes in causal mechanisms over time. A neural process architecture conditions on observed data across multiple time windows to infer the current position and velocity in this causal space, enabling both interpolation of unobserved historical structures and extrapolation to future causal regimes. This formulation introduces a novel capability: predicting how causal relationships themselves will transform, allowing anticipatory reasoning about intervention effects under forthcoming—not just current—causal mechanisms. The framework unifies causal discovery, temporal modeling, and causal forecasting into a single principled approach for reasoning about non-stationary causal systems.'
