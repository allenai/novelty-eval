  ideas:
    0: 'Adversarial Training (AT) is a known, powerful, well-established technique for improving classifier robustness to input perturbations, yet its applicability beyond discriminative settings remains limited. Motivated by the widespread use of score-based generative models and their need to operate robustly under substantial noisy or corrupted input data, we propose an adaptation of AT for these models.

      We introduce a principled formulation of AT for Diffusion Models (DMs) that replaces the conventional *invariance* objective with an *equivariance* constraint aligned to the denoising dynamics of score matching. Our method integrates seamlessly into diffusion training by adding either random perturbations--similar to randomized smoothing--or adversarial ones--akin to AT.

      Our approach offers several advantages: **(a)** tolerance to heavy noise and corruption, **(b)** reduced memorization, **(c)** robustness to outliers and extreme data variability and **(d)** resilience to iterative adversarial attacks.'
    1: Alignment, fairness, safety, and privacy are often treated as independent objectives in responsible AI development, yet they exhibit complex interdependencies—improving one dimension can inadvertently degrade another. We introduce Societal Objective Graphs (SOGs), a framework that explicitly models the causal and correlational relationships between multiple societal objectives during model development. SOGs learn a unified representation space where trade-offs between objectives manifest as geometric structures, enabling practitioners to identify Pareto frontiers, detect hidden conflicts, and discover synergistic interventions. Our framework introduces objective entanglement scores that quantify how modifications targeting one societal goal propagate to others, alongside a conflict-aware optimization procedure that navigates the multi-objective landscape while respecting user-specified priority orderings. SOGs operate as a meta-layer compatible with existing fairness constraints, safety filters, and privacy mechanisms, providing a principled approach to holistic responsible AI development. By surfacing tensions between societal objectives before deployment, this framework shifts the paradigm from post-hoc auditing toward proactive, integrated governance of AI systems.
