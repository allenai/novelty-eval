    0: Static benchmarks face critical limitations including data contamination, rapid saturation, and inability to measure compositional reasoning in evolving AI systems. We introduce procedural evaluation synthesis, a framework for generating infinite streams of fresh, calibrated evaluation instances through controlled compositional processes. Our approach defines atomic reasoning primitives—such as arithmetic operations, logical inference steps, and entity tracking—along with composition grammars that combine these primitives into complex evaluation instances. A difficulty calibration mechanism ensures consistent challenge levels across generated instances by modeling the interaction effects between composed primitives. The framework produces evaluation instances with known ground-truth solutions and explicit dependency graphs, enabling fine-grained diagnosis of which capability combinations models succeed or fail at. Each evaluation session draws from a freshly generated instance set, fundamentally eliminating memorization-based shortcuts and contamination concerns. The compositional structure reveals not just whether models succeed, but precisely which reasoning chains break down under composition. This paradigm shift from static test sets to generative evaluation processes offers a sustainable path toward measuring genuine reasoning capabilities as models continue to scale.
    1: We introduce **Gaia2**, a benchmark for evaluating large language model agents in realistic, asynchronous environments. Unlike prior static or synchronous evaluations, Gaia2 introduces scenarios where environments evolve independently of agent actions, requiring agents to operate under temporal constraints, adapt to noisy and dynamic events, resolve ambiguity, and collaborate with other agents. Each scenario is paired with a write-action verifier, enabling fine-grained, action-level evaluation and making Gaia2 directly usable for reinforcement learning from verifiable rewards. Gaia2 is built on a consumer environment with the open-source **Agents Research Environments** platform and designed to be easy to extend. By releasing Gaia2 alongside the foundational ARE framework, we aim to provide the community with a flexible infrastructure for developing, benchmarking, and training the next generation of practical agent systems.
