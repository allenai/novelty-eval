    0: 'Live Photo captures both a high-quality key photo and a short video clip to preserve the precious dynamics around the captured moment. While users may choose alternative frames as the key photo to capture better expressions or timing, these frames often exhibit noticeable quality degradation, as the photo capture ISP pipeline delivers significantly higher image quality than the video pipeline. This quality gap highlights the need for dedicated restoration techniques to enhance the reselected key photo. To this end, we propose LiveMoments, a reference-guided image restoration framework tailored for the reselected key photo in Live Photos. Our method employs a two-branch neural network: a reference branch that extracts structural and textural information from the original high-quality key photo, and a main branch that restores the reselected frame using the guidance provided by the reference branch. Furthermore, we introduce a unified Motion Alignment module that incorporates motion guidance for spatial alignment at both the latent and image levels.'
    1: Real-world multimodal systems must operate robustly when input modalities are partially unavailable due to sensor failures, privacy constraints, or deployment limitations. Current approaches either require training separate models for each modality subset or rely on imputation strategies that introduce systematic biases. We propose Modality-Agnostic Fusion Transformers (MAFT), a unified architecture that processes arbitrary subsets of modalities through a single model without retraining or imputation. MAFT introduces modality dropout during training combined with a permutation-invariant cross-modal attention mechanism that learns to extract complementary information from whatever modalities are present. A key component is our proposed Availability-Aware Positional Encoding, which explicitly conditions the fusion process on which modalities are observed, enabling the model to adjust its integration strategy dynamically. The architecture employs a shared latent bottleneck that enforces modality-agnostic representations while preserving modality-specific details through residual pathways. MAFT naturally handles vision, audio, and language inputs within the same framework, gracefully degrading rather than failing when modalities are absent. Our approach provides a practical foundation for deploying multimodal systems in unpredictable real-world conditions where complete observations cannot be guaranteed.
