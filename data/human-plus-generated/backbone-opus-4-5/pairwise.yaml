  ideas:
    0: Alignment methods based on human feedback typically aggregate preferences into a single reward model, inadvertently privileging majority viewpoints while marginalizing minority perspectives. This tension between alignment efficiency and representational fairness is exacerbated when privacy constraints prevent demographic stratification of feedback data. We introduce Pluralistic Private Alignment (PPA), a framework that reconceptualizes preference heterogeneity as a resource rather than noise. PPA learns a mixture of preference distributions through a federated architecture where local preference models remain on-device, communicating only privatized gradient updates to a central coordinator. Rather than collapsing to consensus, the framework maintains a structured representation of preference disagreement, enabling downstream generation strategies that can navigate between viewpoints or explicitly surface value tensions. A key technical contribution is a differentially private mechanism for estimating inter-group preference divergence without accessing protected attributes directly. PPA enables language models to acknowledge genuine pluralism in human values while providing formal privacy guarantees, offering a path toward AI systems that are simultaneously aligned, fair, and privacy-preserving by design rather than through post-hoc constraint satisfaction.
    1: Machine unlearning seeks to efficiently remove the influence of selected data while preserving generalization. Significant progress has been made in low dimensions, where the dimension of the parameter $p$ is much smaller than the sample size $n$, but high dimensions, including proportional regimes $p \sim n$, pose serious theoretical challenges as standard optimization assumptions of $\Omega(1)$ strong convexity and $O(1)$ smoothness of the per-example loss $f$ rarely hold simultaneously in proportional regimes $p\sim n$. In this work, we introduce $\varepsilon$-Gaussian certifiability, a canonical and robust notion well-suited to high-dimensional regimes, that optimally captures a broad class of noise adding mechanisms. Then we theoretically analyze the performance of a widely used unlearning algorithm based on one step of the Newton method in the high-dimensional setting described above. Our analysis shows that a single Newton step, followed by a well-calibrated Gaussian noise, is sufficient to achieve both privacy and accuracy in this setting.
