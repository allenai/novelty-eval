  ideas:
    0: 'Deploying AI systems in high-stakes domains requires simultaneously satisfying multiple societal objectives including alignment, fairness, safety, and privacy. However, these objectives frequently conflict: enforcing safety constraints may disproportionately burden certain demographic groups, while achieving fairness often necessitates access to sensitive attributes that compromise privacy. Existing approaches address these concerns in isolation or through naive multi-objective optimization, failing to capture their complex interdependencies. We introduce Value Tension Networks, a framework that explicitly models the constraint graph among societal objectives and learns to navigate trade-offs through stakeholder-informed preference aggregation. Our approach combines differentiable constraint relaxation with a deliberation mechanism inspired by social choice theory, enabling systems to identify Pareto-optimal configurations across the value space while maintaining transparency about unavoidable compromises. A key innovation is the tension audit module, which provides interpretable explanations of which values are in conflict for any given decision and why specific trade-offs were made. Value Tension Networks offer a principled foundation for building AI systems that respect the plurality of human values while acknowledging that perfect alignment across all societal objectives is often impossible.'
    1: How can large language models (LLMs) serve users with varying preferences that may conflict across cultural, political, or other dimensions? To advance this challenge, this paper establishes four key results. First, we demonstrate, through a large-scale multilingual human study with representative samples from five countries (N=15,000), that humans exhibit substantially more variation in preferences than the responses of state-of-the-art LLMs. Second, we show that existing methods for preference dataset collection are insufficient for learning the diversity of human preferences even along two of the most salient dimensions of variability in global values, due to the underlying homogeneity of candidate responses. Third, we argue that this motivates the need for _negatively-correlated sampling_ when generating candidate sets, and we show that simple prompt-based techniques for doing so greatly enhance the ability of alignment methods to learn heterogeneous preferences. Fourth, based on this novel candidate sampling approach, we collect and open-source _Community Alignment_, the largest and most representative multilingual and multi-turn preference dataset to date, featuring 233,319 comparisons from annotators spanning five countries. Overall, we hope that the Community Alignment dataset will be a valuable resource for improving the effectiveness of LLMs for a diverse global population.
