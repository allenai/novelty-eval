    0: While diffusion models have achieved remarkable performance in image generation, they often struggle with the imbalanced datasets frequently encountered in real-world applications, resulting in significant performance degradation on minority classes. In this paper, we identify model capacity allocation as a key and previously underexplored factor contributing to this issue, providing a perspective that is orthogonal to existing research. Our empirical experiments and theoretical analysis reveal that majority classes monopolize an unnecessarily large portion of the model's capacity, thereby restricting the representation of minority classes. To address this, we propose Capacity Manipulation (CM), which explicitly reserves model capacity for minority classes. Our approach leverages a low-rank decomposition of model parameters and introduces a capacity manipulation loss to allocate appropriate capacity for capturing minority knowledge, thus enhancing minority class representation. CM can be combined with existing methods to further boost overall performance.
    1: Representation learning methods typically operate within rigid paradigms—supervised, self-supervised, semi-supervised, or unsupervised—each imposing fixed assumptions about available supervision. We propose Spectral Supervision, a unified framework that treats these paradigms as points along a continuous supervision spectrum rather than discrete categories. Our key insight is that optimal learning signals should adapt based on the evolving geometry of the representation space. We introduce a supervision-agnostic objective that dynamically interpolates between contrastive self-supervision and label-guided learning through a learned modulation function. This function monitors local manifold structure and predictive uncertainty to determine where dense self-supervised signals should dominate versus where sparse supervised signals provide more value. The framework naturally handles arbitrary mixtures of labeled, unlabeled, and partially-labeled data without architectural changes or manual loss weighting. A geometric regularizer ensures smooth transitions across the supervision spectrum, preventing representation collapse when supervision is scarce while avoiding overfitting when labels are abundant. Spectral Supervision provides a principled foundation for learning representations that gracefully adapt to heterogeneous supervision conditions encountered in real-world applications.
