  ideas:
    0: The semantic similarity between sample expressions measures the distance between their latent `meaning'. These meanings are themselves typically represented by textual expressions. We propose a novel approach whereby the semantic similarity among textual expressions is based not on other expressions they can be rephrased as, but rather based on the imagery they evoke. While this is not possible with humans, generative models allow us to easily visualize and compare generated images, or their distribution, evoked by a textual prompt. Therefore, we characterize the semantic similarity between two textual expressions simply as the distance between image distributions they induce, or 'conjure.' We show that by choosing the Jeffreys divergence between the reverse-time diffusion stochastic differential equations (SDEs) induced by each textual expression, this can be directly computed via Monte-Carlo sampling. Our method contributes a novel perspective on semantic similarity that opens up new avenues for the evaluation of text-conditioned generative models while offering better interpretability of their learnt representations.
    1: Reinforcement Learning from Human Feedback has become the dominant paradigm for aligning language models with human values, yet it implicitly assumes a monolithic notion of human preferences. In practice, feedback data reflects the values of annotator populations that are neither representative nor homogeneous, causing aligned models to encode majority-group preferences while marginalizing minority perspectives. We introduce Pluralistic Alignment, a framework that explicitly models preference heterogeneity across demographic groups during the alignment process. Our approach learns group-conditioned reward models that capture distinct value systems, then optimizes for a Pareto-fair policy that prevents disproportionate sacrifice of any group's preferences. A constrained optimization objective balances preference satisfaction across groups while maintaining safety guardrails as inviolable constraints rather than tradeable objectives. To address privacy concerns inherent in demographic-aware learning, we incorporate differential privacy guarantees into the reward modeling phase, preventing membership inference while preserving group-level preference signals. Pluralistic Alignment provides a principled foundation for building AI systems that respect value pluralism, offering a path toward models that are simultaneously aligned, fair, and privacy-preserving.
