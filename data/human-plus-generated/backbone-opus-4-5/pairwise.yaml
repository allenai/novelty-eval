    0: The probabilistic diffusion model (DM), generating content by inferencing through a recursive chain structure, has emerged as a powerful framework for visual generation. After pre-training on enormous data, the model needs to be properly aligned to meet requirements for downstream applications. How to efficiently align the foundation DM is a crucial task. Contemporary methods are either based on Reinforcement Learning (RL) or truncated Backpropagation (BP). However, RL and truncated BP suffer from low sample efficiency and biased gradient estimation, respectively, resulting in limited improvement or, even worse, complete training failure. To overcome the challenges, we propose the Recursive Likelihood Ratio (RLR) optimizer, a Half-Order (HO) fine-tuning paradigm for DM. The HO gradient estimator enables the computation graph rearrangement within the recursive diffusive chain, making the RLR's gradient estimator **an unbiased one with lower variance** than other methods. We theoretically investigate the bias, variance, and convergence of our method. Furthermore, we propose a novel prompt technique that is natural for the RLR to achieve a synergistic effect.
    1: Diffusion and flow-based generative models learn a single deterministic or stochastic trajectory connecting noise to data, limiting their adaptability to varying computational budgets and generation requirements. We introduce Trajectory Manifold Generative Models, a framework that learns a continuous family of generation paths parameterized by a low-dimensional trajectory code. Rather than committing to one transport plan, our approach meta-learns a hypernetwork that outputs conditional vector fields indexed by trajectory parameters, enabling smooth interpolation between generation dynamics at inference time. The trajectory code can encode properties such as path curvature, step efficiency, or semantic guidance strength, allowing users to navigate trade-offs between sample quality, diversity, and computational cost without retraining. We derive a joint training objective that encourages coverage of the trajectory manifold while ensuring all paths terminate at the data distribution. Our formulation reveals connections between trajectory selection and optimal transport, suggesting that learned paths can discover more efficient routes than hand-designed schedules. This unified perspective opens new directions for adaptive generation, path-based controllability, and understanding the geometry of generative processes.
