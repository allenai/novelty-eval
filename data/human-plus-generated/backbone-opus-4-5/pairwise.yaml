  ideas:
    0: 'A fundamental challenge in offline reinforcement learning is distributional shift. Scarce data or datasets dominated by out-of-distribution (OOD) areas exacerbate this issue. Our theoretical analysis and experiments show that the standard squared error objective induces a harmful TD cross covariance. This effect amplifies in OOD areas, biasing optimization and degrading policy learning. To counteract this mechanism, we develop two complementary strategies: partitioned buffer sampling that restricts updates to localized replay partitions, attenuates irregular covariance effects, and aligns update directions, yielding a scheme that is easy to integrate with existing implementations, namely Clustered Cross-Covariance Control for TD ($C^4$). We also introduce an explicit gradient-based corrective penalty that cancels the covariance induced bias within each update. We prove that buffer partitioning preserves the lower bound property of the maximization objective, and that these constraints mitigate excessive conservatism in extreme OOD areas without altering the core behavior of policy constrained offline reinforcement learning.'
    1: Efficient exploration in reinforcement learning remains challenging, particularly in environments with sparse rewards and large state spaces. We introduce Semantic Exploration Diffusion (SED), a framework that harnesses the world knowledge embedded in large language models to guide exploration through diffusion-based policy learning. SED operates by querying a frozen language model to generate natural language descriptions of potentially informative states given the current exploration history, then conditions a diffusion policy on these semantic exploration hints to produce diverse, goal-directed behaviors. Unlike intrinsic motivation methods that rely on hand-crafted novelty bonuses, SED derives exploration signals from the rich semantic priors captured during language model pretraining, enabling transfer of common-sense reasoning about environment dynamics and useful subgoals. The diffusion policy formulation naturally captures multimodal action distributions, allowing the agent to maintain diverse exploration strategies when multiple promising directions exist. A key technical contribution is our cross-modal attention mechanism that grounds abstract language guidance into the continuous action space while preserving the generative flexibility of diffusion models. SED provides a principled approach to injecting structured prior knowledge into reinforcement learning without constraining the policy's ability to discover novel solutions.
