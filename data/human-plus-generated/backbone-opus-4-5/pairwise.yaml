    0: 'Understanding why overparameterized models trained with gradient descent generalize remains a central challenge in learning theory. We introduce trajectory curvature complexity, a novel complexity measure that captures the cumulative geometric information encountered along the optimization path through the loss landscape. Unlike static measures that characterize only the endpoint of training, our framework tracks how gradient descent navigates regions of varying Hessian curvature and relates this geometric history to generalization. We derive PAC-Bayes bounds that incorporate trajectory curvature, revealing that paths through flatter regions accumulate less complexity and yield tighter generalization guarantees. Our analysis unifies several implicit regularization phenomena under a single geometric principle: gradient descent preferentially traverses low-curvature manifolds, effectively constraining the hypothesis class in a data-dependent manner. We establish connections between trajectory curvature complexity and information-theoretic quantities, showing that the mutual information between training data and learned parameters can be bounded by integrated curvature along the optimization trajectory. This framework provides new theoretical tools for analyzing adaptive learning rates, momentum, and other optimization modifications through their effects on the curvature profile of training trajectories.'
    1: Dense associative memory, a fundamental instance of modern Hopfield networks, can store a large number of memory patterns as equilibrium states of recurrent networks. While the stationary-state storage capacity has been investigated, its dynamical properties have not yet been discussed. In this paper, we analyze the dynamics using an exact approach based on generating functional analysis. We show results on convergence properties of memory retrieval, such as the convergence time and the size of the attraction basins. Our analysis enables a quantitative evaluation of the convergence time and the storage capacity of dense associative memory, which is useful for model design. Unlike the traditional Hopfield model, the retrieval of a pattern does not act as additional noise to itself, suggesting that the structure of modern networks makes recall more robust. Furthermore, the methodology addressed here can be applied to other energy-based models, and thus has the potential to contribute to the design of future architectures.
