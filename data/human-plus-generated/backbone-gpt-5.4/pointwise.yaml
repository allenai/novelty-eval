  idea: Neural encoding and decoding models increasingly capture rich structure in brain and behavioral data, yet their latent spaces rarely correspond to portable cognitive variables that can be compared across tasks, subjects, and laboratories. We introduce a theory-regularized multimodal state-space framework that jointly models neural activity, behavior, eye movements, and natural-language task descriptions while grounding its latent dynamics in a compositional library of differentiable cognitive primitives, including evidence accumulation, working-memory gating, reinforcement learning, and hierarchical planning. A routing mechanism infers which primitives are active at each moment and how they combine, producing trajectories that are simultaneously predictive of observed signals and interpretable as cognitive operations. The model supports counterfactual intervention on latent primitives, enabling in silico manipulations that test whether specific neural populations encode beliefs, policies, or memory states rather than superficial task features. By aligning heterogeneous experiments through shared cognitive coordinates, this approach reframes representation learning as a mechanism for cumulative theory building, offering a scalable bridge between modern machine learning and mechanistic accounts of cognition.
