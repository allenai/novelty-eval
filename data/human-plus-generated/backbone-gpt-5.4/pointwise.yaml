  idea: Large language models produce fluent answers but represent support, provenance, and intermediate validity only implicitly, making grounded generation and calibrated refusal difficult. We propose Proof-Carrying Language Models (PCLM), a training and inference framework in which every generated span must be backed by a compact machine-checkable certificate. A certificate is not a free-form rationale; it is a discrete support graph over retrieved passages, symbolic constraints, tool executions, and local entailment links that can be validated by an external verifier. We learn this interface with a certificate bottleneck that encourages minimal justifications, a verifier-conditioned likelihood that rewards generations admitting valid certificates, and a repair objective that teaches the model to revise unsupported tokens before finalizing an answer. At inference, the model jointly searches over text and certificate states and abstains when no consistent certificate can be constructed. By making verification a generative prior rather than a post-hoc filter, PCLM provides a unified foundation-model architecture for grounded reasoning, provenance-aware generation, and selective uncertainty across retrieval, coding, and scientific question answering settings.
