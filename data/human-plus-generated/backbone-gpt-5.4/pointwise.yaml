  idea: 'Modern learning systems rarely train on a fixed i.i.d. sample: examples are filtered, reweighted, augmented, or pseudo-labeled by earlier model snapshots, creating a feedback loop between the learner and its data. We introduce recursive pipeline stability, a learning-theoretic framework for such adaptive training procedures. The key idea is to model data curation as a sequence of stochastic operators acting on the empirical distribution, and to measure how a single example’s influence propagates through these operators and the downstream learner. This yields generalization and excess-risk bounds that decompose into two terms: base learner sensitivity and curation amplification. Our analysis recovers classical uniform stability for one-shot empirical risk minimization, while extending to iterative self-training, curriculum learning, rejection-based filtering, and hard-example mining. We further derive a curation-aware regularization principle that explicitly controls influence accumulation across rounds, leading to algorithms that remain statistically stable under adaptive data reuse. The framework provides a unified vocabulary for when model-dependent data selection helps learning and when it fundamentally destabilizes generalization.'
