  idea: Modern overparameterized models are trained in parameter spaces riddled with reparameterization symmetries, where large apparent gradients can correspond to negligible change in the represented function. This mismatch creates ill-conditioning, brittle hyperparameter sensitivity, and optimizer dynamics that depend on arbitrary parameterization choices. We introduce QuotientFlow, a symmetry-aware first-order optimization framework that updates models in the quotient geometry induced by function-preserving transformations. QuotientFlow uses stochastic Jacobian probes to estimate the local tangent space of gauge directions, constructs a low-rank projector that removes these directions from gradients and momentum, and couples the resulting update with a scale-free trust ratio derived from lightweight function-space curvature sketches. To handle the fact that the symmetry subspace evolves during training, we derive a transport rule that consistently maps optimizer state across changing local quotient charts. The method is architecture-agnostic and can wrap existing SGD- or Adam-like optimizers. By aligning optimization with equivalence classes of parameters rather than raw coordinates, QuotientFlow reframes deep learning optimization as movement in the space of identifiable functions.
