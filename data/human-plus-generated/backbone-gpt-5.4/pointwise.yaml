  idea: Variational inference typically returns a single tractable posterior surrogate, leaving Bayesian predictions blind to approximation error induced by the variational family and therefore prone to overconfident decisions. We propose Envelope Variational Inference, a framework that performs posterior approximation by learning a tractable ambiguity set rather than a point estimate. The method begins with a base variational posterior and augments it with learned upper and lower energy corrections whose slack is calibrated by Stein residuals on adaptive test functions. These corrections define a family of distributions consistent with local score information, converting variational misspecification into an explicit source of uncertainty instead of absorbing it into a single surrogate. Predictions are obtained by integrating or optimizing over this envelope, yielding interval-valued expectations and a decomposition of uncertainty into data, parameter, and inference components. A transport-based parameterization keeps the envelope differentiable and amortizable, while a dual objective retains the computational profile of standard VI. The resulting perspective reframes approximate Bayesian inference as robust posterior reasoning, particularly for multimodal, heavy-tailed, and distribution-shifted regimes where single-family approximations are brittle.
