  idea: Bayesian posteriors are often multimodal not because the data support distinct explanations, but because the model admits symmetries such as permutation, sign, or gauge transformations. Existing variational methods tend to average across these modes, while sampling methods may spend most of their computation traversing equivalent states, yielding distorted uncertainty estimates and poor mixing. We introduce Orbit Inference, a symmetry-aware probabilistic framework that decomposes a posterior into uncertainty over equivalence classes and a conditional distribution over symmetry orbits. The method performs variational inference in the quotient space using a learned transport map, then lifts the solution back to the original parameter space through an orbit decoder defined by the model’s symmetry group. A group-averaged evidence bound and orbit-consistent regularization preserve posterior mass across equivalent modes without requiring explicit mode enumeration. Orbit Inference can also be coupled with orbit-jump MCMC kernels, providing a hybrid variational-sampling procedure that separates global uncertainty from redundant symmetries. This perspective turns symmetry from a pathology of Bayesian inference into an explicit modeling primitive for scalable uncertainty quantification.
