'289':
  context: learning theory
  idea: 'Modern learning systems are rarely trained on fixed i.i.d. samples: examples are filtered, reweighted, synthesized, or revisited according to the model’s evolving state. Classical generalization theory therefore gives limited guidance on when adaptive training improves learning and when it amplifies overfitting through closed-loop feedback. We introduce Path-Stable Learning, a learning-theoretic framework for model-dependent data selection. Its central object, path stability, is a trajectory-level sensitivity measure that tracks how perturbing one sample propagates through both parameter updates and future sampling decisions. This notion yields unified generalization and excess-risk bounds for curriculum learning, hard-example mining, self-training, and active relabeling via a common adaptivity coefficient that quantifies the predictability of the sampling policy. The analysis exposes an explicit adaptivity tax, separating optimization gains from feedback-induced variance, and motivates entropy-regularized samplers that minimize this tax while preserving informativeness. By shifting the focus from hypothesis complexity to training-path complexity, the framework offers a principled theory of closed-loop data pipelines and identifies when adaptive sampling should help, hurt, or remain neutral for generalization.'
