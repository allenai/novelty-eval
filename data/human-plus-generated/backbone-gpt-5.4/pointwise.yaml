'297':
  context: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  idea: Self-supervised representation learning typically encodes invariances through hand-designed augmentations, but it does not learn which factors should remain stable, which should vary, or how these choices should change when labels are available. We propose Counterfactual Subspace Matching, a unified framework that treats augmentations and labels as soft interventions on latent factors. The model learns a factorized embedding with a content subspace that remains stable across interventions and a mechanism subspace that is explicitly allowed to change. A routing network assigns each intervention to latent coordinates, while a compositional cycle objective enforces consistency under ordered augmentation sequences, enabling the representation to capture transformation structure rather than only pairwise similarity. Unlabeled data provide intervention-induced invariance, sparse labels align class-relevant content without collapsing within-class variation, and full supervision emerges as a limiting case of the same geometry. By learning both invariant and intervention-responsive factors, the framework unifies unsupervised, self-supervised, semi-supervised, and supervised representation learning and yields embeddings designed for transfer, controllable equivariance, and reduced reliance on augmentation heuristics.
