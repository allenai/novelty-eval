'65':
  context: probabilistic methods (Bayesian methods, variational inference, sampling, UQ, etc.)
  idea: 'Bayesian inference at scale faces a persistent gap: variational approximations are efficient but often mode-seeking and overconfident, while sampling methods are asymptotically faithful but costly to run for every new model or dataset. We propose Posterior Repair Diffusion, a two-stage framework that treats a variational posterior as a coarse scaffold and learns a lightweight diffusion-based stochastic transport that repairs its geometry. Instead of fitting the posterior density directly, the repair process is trained from Stein score residuals computed from the model joint, enabling correction without normalized targets. The transport is conditioned on local curvature and tempered energy gaps, allowing it to split merged modes, thicken underestimated tails, and leave already accurate regions unchanged. To preserve the efficiency of variational inference, we couple repaired samples with the base approximation through a control-variate estimator for downstream expectations. The cumulative transport cost further yields an intrinsic diagnostic of approximation-induced uncertainty, exposing when uncertainty errors arise from the inferential method rather than the model. The resulting view turns posterior inference into a reusable compiler that unifies variational optimization, score-based transport, and sampling-style calibration.'
