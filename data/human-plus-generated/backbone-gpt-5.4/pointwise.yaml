  idea: 'Modern generative models excel at local realism but often fail to maintain global structure, because high-dimensional synthesis is learned as direct token- or noise-level prediction without an explicit notion of what must remain invariant across the whole sample. We propose Latent Contracts, a training framework that augments a generator with a compact, unsupervised contract variable encoding sample-level commitments such as object counts, discourse entities, symmetries, or causal relations. Generation is decomposed into contract prediction and contract realization: a planner proposes a contract, the base generator synthesizes a sample conditioned on it, and an amortized verifier reinfers the contract from full or partial observations. Cycle-consistency between planned and recovered contracts forces early commitment to global decisions, while verifier-guided denoising discourages locally plausible but contract-violating continuations. Because contracts live in a compositional latent space rather than human-specified labels, they can be edited, recombined, or partially clamped at inference to steer generation without task-specific retraining. The framework is architecture-agnostic and can be instantiated on diffusion or autoregressive models, offering a route toward generative systems that produce samples together with an internal certificate of global coherence.'
