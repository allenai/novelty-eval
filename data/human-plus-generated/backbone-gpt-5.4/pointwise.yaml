  idea: Frontier language models are trained to emit a single next-token trajectory, forcing early commitment when user intent, latent world state, or retrieved evidence is ambiguous. We propose PolyState, a foundation-model architecture that decouples generation from belief maintenance by equipping a frozen LLM with a persistent bank of latent hypothesis states. Each state encodes a distinct interpretation of context or plan; a lightweight Bayesian router updates their weights as new text or tool observations arrive; and decoding conditions jointly on consensus features and structured disagreement signals. PolyState is trained with a branch-and-reconcile objective over interaction traces that rewards preserving mutually incompatible hypotheses until discriminative evidence appears, then collapsing beliefs in a calibrated manner. Because the hypothesis bank is external, editable, and model-agnostic, the framework supports introspectable uncertainty, targeted memory repair, and low-cost adaptation without full retraining. We argue that persistent multi-hypothesis inference provides a missing substrate for agentic LLMs, enabling clarification-seeking dialogue, safer tool use, and more reliable long-horizon reasoning under ambiguity.
