'306':
  context: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  idea: Representation learning methods across unsupervised, self-supervised, semi-supervised, and supervised settings mostly differ in how they specify which input variations should be discarded and which should remain predictive, yet current objectives hard-code these choices through fixed augmentations or static label losses. We introduce Constraint Field Learning, a unified framework that learns the invariance structure of the representation itself. Given multiple views, unlabeled examples, and optional labels, a routing module assigns each transformation and local neighbor relation a soft role—be invariant, be equivariant, or remain discriminative—thereby inducing a learnable field of constraints over latent space. The encoder is trained jointly to satisfy this field using alignment across views, topology-aware consistency over example graphs, and prototype-based separation where labels are available. Sparse labels serve as boundary conditions that prevent semantically harmful collapse, while unlabeled data propagates these constraints without committing to brittle pseudo-labels. This turns supervision levels into a continuum rather than separate training regimes and reframes representation learning as discovering data-dependent symmetries instead of selecting a loss for a supervision category.
