  context: applications to computer vision, audio, language, and other modalities
  idea: 'Multimodal foundation models typically align video frames and audio or text tokens through local similarity, capturing co-occurrence but not the latent events that generate signals across modalities. We propose EventGraph, a multimodal architecture that represents an input stream as a sparse graph of temporally anchored event slots with learned causal dependencies. Video, audio, language, and other sensors are treated as partial observations of this shared event graph through modality-specific parsers and renderers. Training combines cross-modal masked reconstruction with counterfactual consistency: the model intervenes on individual event nodes and must regenerate all modalities in a mutually compatible way, encouraging representations to encode what happened, when, and why rather than superficial correlations. A script prior over event transitions supports long-horizon reasoning and enables zero-shot insertion, deletion, and reordering of events for controllable generation and editing. Because inference operates over events instead of dense tokens, the framework naturally handles asynchronous signals, missing modalities, and variable-rate streams. Event-centric multimodal modeling offers a unified route to robust audiovisual understanding, grounded captioning, temporal retrieval, and agent perception in open-world environments.'
