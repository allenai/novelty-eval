  idea: 'Static benchmarks are increasingly saturated, contaminated by pretraining corpora, and optimized through benchmark-specific heuristics, making headline scores difficult to interpret as evidence of generalization. We introduce SpecBench, a specification-driven benchmarking framework that releases tasks as executable generators rather than fixed test sets. Each instance is sampled from a structured task program with attached provenance records, temporal metadata, and a transformation grammar that produces hidden families of semantically equivalent and counterfactual variants. This design enables continual test refresh while preserving comparability across benchmark versions. SpecBench disentangles failure modes that conventional datasets conflate: memorization is probed through provenance overlap and time-based holdouts, shortcut reliance through consistency across equivalent variants, and brittle generalization through controlled shifts along annotated factors. We further define family-level scoring that rewards invariant behavior over isolated item accuracy and an audit protocol that attributes performance to contamination-sensitive subsets. By turning datasets into renewable, inspectable generators, SpecBench recasts benchmarking as a reproducible process rather than a static artifact, offering a longer-lived and harder-to-game foundation for evaluating modern foundation models.'
