  idea: Classical generalization bounds measure hypothesis complexity in ambient function space, counting many predictors separately even when they differ only along transformations that preserve the data distribution. This mismatch is acute in overparameterized learning, where augmentation, weight sharing, and self-supervision explicitly exploit invariances that standard theory ignores. We introduce Quotient Learning Theory, a framework that factors a hypothesis class by approximate symmetry actions inferred from unlabeled data and studies learning on the resulting quotient space. Its central quantity, orbit complexity, measures the number of distinguishable predictors modulo learned symmetries and decomposes into task asymmetry and symmetry-estimation error. We derive PAC-Bayesian and localized covering bounds in terms of orbit complexity, yielding sample-complexity guarantees that depend on intrinsic asymmetry rather than parameter count. We also obtain a practical regularizer that penalizes tangent variance along inferred symmetry directions, enabling theory-guided invariance discovery without hand-designed augmentations. The framework unifies data augmentation, invariant risk minimization, and parameter sharing, and offers a path toward non-vacuous guarantees for modern deep models.
