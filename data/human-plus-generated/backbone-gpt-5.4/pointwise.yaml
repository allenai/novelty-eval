  idea: 'Large language models absorb facts into distributed parameters, which yields fluent generation but brittle knowledge maintenance: updates are costly, contradictions persist across turns, and retrieved evidence is only weakly integrated into answers. We propose Epistemic State Models, a foundation-model architecture that decouples linguistic competence from revisable belief maintenance. An LLM is paired with a small latent belief graph whose nodes encode propositions, confidence, provenance, and temporal scope. Incoming text induces graph updates through a differentiable revision operator trained on natural text streams and counterfactual perturbations that force the model to retract, merge, or prioritize conflicting evidence. Generation is conditioned on the current graph, while consistency objectives require answers, rationales, and tool-use decisions to remain invariant to irrelevant edits and to change predictably when specific beliefs are revised. Because the belief graph is sparse and externalizable, it can be directly inspected, edited, or synchronized across agents without retraining the base model. This framework turns static parametric knowledge into an explicit trainable epistemic state, enabling more updateable, auditable, and long-horizon language agents.'
