'1':
  context: foundation or frontier models, including LLMs
  idea: Frontier models increasingly act through search, code, and APIs, yet their training remains dominated by next-token prediction and expensive real-world interaction. We introduce a model-based framework for agentic foundation models that learns to internally simulate tool use before executing it. Our method trains a language-conditioned latent world model over interaction traces, compressing external observations, tool outputs, and evolving workspace state into a structured belief state that predicts counterfactual transitions under candidate actions. A policy model then plans in imagination by rolling out latent trajectories, selecting action sequences that satisfy goal-consistency and verifier-based constraints, while an uncertainty-aware grounding loop executes only informative or high-risk steps to refresh the simulator and prevent drift. This converts tool use from reactive imitation into deliberative prediction, enabling long-horizon reasoning with sparse external feedback. By unifying language modeling, world modeling, and uncertainty-gated execution, the framework offers a path toward more sample-efficient, safer, and strategically capable foundation-model agents in open-ended environments.
