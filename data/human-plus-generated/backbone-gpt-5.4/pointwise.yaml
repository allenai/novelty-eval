  idea: 'Causal reasoning in high-dimensional domains remains bottlenecked by a mismatch between structure learning, which favors symbolic variables, and counterfactual prediction, which relies on expressive but opaque function approximators. We introduce Mechanism Slot Networks, a causal representation framework that treats each latent slot as a reusable structural mechanism paired with sample-specific exogenous noise. The model is trained on observational and multi-environment data using intervention-equivariant recombination: latent mechanisms are swapped across examples to synthesize soft interventions, while a descendant-consistency objective enforces that only downstream slots change and unaffected factors remain stable. A differentiable acyclicity prior over slot dependencies induces a sparse causal graph, and an amortized abduction-action-prediction module performs interventional and counterfactual inference by editing latent mechanisms in a single forward pass. Unlike pipeline approaches that discover structure first and reason later, the proposed formulation jointly learns modular causal abstractions and uses them as the substrate for reasoning, offering a scalable path toward causal reasoning over images, text, and sequential decision-making data.'
