  idea: 'Static benchmarks increasingly fail to distinguish genuine generalization from memorization, shortcut exploitation, and benchmark-specific tuning. We introduce a new benchmark paradigm, InterventionBench, that represents each test item not as a standalone example but as part of a provenance graph linking sources, rewrites, counterfactual edits, and annotation rationales. Each graph encodes controlled semantic interventions, enabling evaluation of three properties that conventional datasets conflate: invariance to meaning-preserving transformations, sensitivity to meaning-changing perturbations, and calibrated uncertainty under irreducible label ambiguity. To support contamination-resistant measurement, train/dev/test partitions are defined over graph structure and provenance distance rather than random instance splits, preventing near-duplicate leakage across splits. Benchmark creation combines human curation with model-assisted proposal generation, while verification enforces edit faithfulness and tracks annotator disagreement instead of collapsing it into a single gold label. This formulation turns benchmarking from static scorekeeping into structured measurement of capability, robustness, and uncertainty, and provides a reusable recipe for building longer-lasting benchmarks across language, vision, and multimodal tasks.'
