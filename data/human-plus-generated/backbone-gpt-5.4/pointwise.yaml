  context: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  idea: Representation learning methods typically rely on manually designed augmentations or explicit labels to define which variations should be ignored, limiting transfer when task-relevant invariances are unknown or only partially observed. We propose Symmetry-Bootstrapped Representation Learning, a unified framework that discovers approximate data symmetries directly from raw samples and uses them to structure the embedding space. A transport module predicts minimal latent operators that map nearby instances to one another, while cycle consistency, locality, and sparsity constraints turn these operators into a reusable set of symmetry generators. The encoder is trained to decompose each representation into an invariant subspace that remains stable under the discovered generators and an equivariant subspace whose coordinates transform linearly with them, separating semantic content from nuisance variation. When labels are available, they act as soft constraints on which symmetries should be collapsed and which should remain discriminative, allowing the same objective to interpolate smoothly between unsupervised, self-supervised, semi-supervised, and supervised regimes. By replacing hand-crafted augmentations with learned symmetries, the framework offers a route to domain-adaptive representations in settings where invariances are latent, multimodal, or misaligned with annotation granularity.
