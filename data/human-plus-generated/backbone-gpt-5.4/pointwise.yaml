  idea: Static benchmarks increasingly measure familiarity with a fixed test set rather than the underlying capability, making leaderboards brittle to contamination, annotation artifacts, and saturation. We introduce Counterfactual Benchmark Graphs, a dataset construction and evaluation paradigm in which each test item is a small graph of semantically linked examples generated from a latent task schema and verified by annotators. Nodes instantiate anchors, invariance-preserving rewrites, minimally sufficient causal interventions, and ambiguity-revealing variants; edges encode expected equivalence, monotonicity, or answer-change relations. Models are scored not only on endpoint accuracy but on graph-consistency, intervention sensitivity, and uncertainty calibration, yielding capability profiles instead of a single aggregate number. The framework supports text, vision, and multimodal tasks, enables continual refresh through schema-level generation rather than manual recollection, and reduces benchmark contamination by evaluating generalization across unseen graph expansions. We further describe a release protocol that separates public schemas from private instantiations, allowing reproducible benchmarking while preserving test freshness. This benchmark-as-structure perspective turns datasets from static example collections into executable specifications of the behaviors we want models to exhibit.
