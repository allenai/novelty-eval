  idea: 'Static benchmarks are increasingly poor scientific instruments: they saturate, leak into training corpora, and reward models that exploit superficial correlations rather than stable abstractions. We introduce InterventionBench, a living benchmark framework in which each test example is embedded in an intervention graph of minimally modified counterparts that isolate changes in syntax, semantics, world knowledge, temporal context, or modality-specific nuisance factors. Instead of treating examples as independent points, the benchmark evaluates whether model predictions remain invariant when they should, change when they must, and express calibrated uncertainty when interventions create ambiguity. To mitigate contamination and benchmark gaming, instances are produced from hidden generation programs and released through time-locked slices, with provenance metadata and transformation certificates that document the latent factors manipulated in each family. InterventionBench reframes benchmarking from leaderboard maximization to behavioral measurement, enabling fine-grained diagnosis of shortcut reliance, temporal brittleness, and transfer under controlled distribution shift across language, vision, and multimodal tasks.'
