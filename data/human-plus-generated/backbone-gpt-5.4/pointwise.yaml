  context: applications to computer vision, audio, language, and other modalities
  idea: 'Multimodal foundation models typically learn by directly fusing vision, audio, and language tokens, which entangles shared semantics with modality-specific noise and makes reasoning brittle under missing or novel sensors. We propose EventBottleneck, a modality-agnostic framework that represents multimodal inputs as sparse latent event graphs evolving over time. Each modality is treated as a partial observation of the same underlying events: lightweight encoders map modality streams into event slots, while modality-specific decoders reconstruct observations or semantics from the inferred graph. Training combines cross-modal denoising, temporal cycle consistency, and intervention-style modality masking, requiring the model to recover masked observations from latent events inferred through other modalities. This bottleneck turns multimodal learning from token fusion into structured world-state inference, yielding a reusable interface for retrieval, generation, and reasoning from any subset of modalities. Because new sensors only require learning projections into and out of the event graph, the approach offers a scalable path toward unified models spanning computer vision, audio, language, and specialized scientific or embodied data streams.'
