'303':
  context: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  idea: Representation learning methods typically hard-code invariances through augmentations, reconstruction targets, or labels, causing semantic information to be discarded when the assumed notion of equivalence is wrong. We propose a unified framework for unsupervised, self-supervised, semi-supervised, and supervised learning that discovers invariances from data rather than prescribing them. The key idea is to treat every observed relation—two augmentations of an instance, temporal adjacency, nearest-neighbor consistency, or shared class label—as a noisy constraint on latent factors. Our model learns a factorized embedding with an invariant subspace for semantic content and an equivariant subspace for structured variation. A relation encoder predicts sample-pair transformation operators that act only on the equivariant coordinates, while cycle consistency, sparsity, and information allocation losses prevent collapse and discourage semantics from leaking into nuisance dimensions. When labels are available, supervision is applied only to the invariant subspace, allowing labeled and unlabeled data to optimize the same objective. The resulting approach turns representation learning into latent symmetry discovery, yielding features whose invariances are adapted to the data geometry and supervision regime rather than fixed in advance.
