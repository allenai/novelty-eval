'269':
  context: interpretability and explainable AI
  idea: 'Interpretability methods often trade human readability for faithfulness: saliency maps and textual rationales are easy to consume but only loosely tied to the computation that produced a prediction, whereas mechanistic circuit analyses expose internal structure yet remain difficult to scale and communicate. We introduce Executable Concept Circuits, a framework for converting a model’s hidden computation into a sparse, human-auditable causal graph over learned concepts and internal modules. Given a pretrained network, the method projects intermediate activations into a reusable concept dictionary and infers a prediction-specific directed subgraph whose nodes and edges represent the minimal causal pathway to the output. Crucially, the explanation is executable rather than descriptive: interventional consistency objectives require the circuit to predict the model’s response to concept edits, feature deletions, and module ablations. Additional sparsity and stability constraints yield compact explanations that remain coherent across nearby inputs, enabling local circuits to be merged into global behavior maps. By turning explanations into simulatable causal objects, the framework supports why, why-not, and what-if queries while narrowing the gap between post-hoc explainability and mechanistic interpretability.'
