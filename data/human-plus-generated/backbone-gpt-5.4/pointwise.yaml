  idea: Modern stochastic optimizers compress training history into a few moments, implicitly assuming that one update rule should govern every phase of optimization. Yet nonconvex objectives are traversed through distinct geometric regimes—flat plateaus, stiff valleys, saddle neighborhoods, and noise-dominated regions—that call for qualitatively different behaviors. We propose GeoSwitch, a switching-state optimization framework that models gradient observations as emissions from a latent dynamical system over local geometry classes. An online filter infers the current regime from short-horizon gradient agreement, curvature sketches, and loss-change consistency, and a regime-conditioned controller selects among complementary update operators for acceleration, damping, exploration, or constraint-preserving refinement. Transition penalties and entropy regularization enforce temporal coherence and prevent unstable optimizer chattering. The framework recovers momentum, adaptive preconditioning, and trust-region updates as special cases of regime-conditioned control, while yielding a clean analysis of convergence under bounded state-estimation error. This recasts optimizer design from crafting a single universal rule to specifying a small library of geometry-aware behaviors coupled by principled state inference.
