  idea: Multimodal foundation models are typically trained on paired examples and therefore absorb shallow co-occurrence statistics, making them brittle to temporal misalignment, modality corruption, and spurious correlations. We propose CauseMap, an event-centric pretraining framework that learns a sparse latent graph of underlying events shared across vision, audio, language, and auxiliary sensors. Instead of enforcing direct feature alignment, CauseMap infers event nodes from partially observed streams and supervises them through counterfactual interventions that mute, reorder, or rewrite individual modalities while preserving latent causes. A cross-modal structural consistency objective aligns observations with different lags and granularities, and a generative decoding objective reconstructs each modality from the inferred event graph. This yields representations organized around causal explanations rather than raw synchrony, enabling a single model to support retrieval, grounding, captioning, temporal localization, and reasoning under missing modalities. By exposing explicit event-to-observation links, the framework also offers interpretable traces of why a sound, frame sequence, or utterance was predicted from multimodal context.
