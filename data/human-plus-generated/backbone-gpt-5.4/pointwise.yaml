  idea: Bayesian models quantify epistemic uncertainty under a posterior, but modern inference pipelines rarely quantify uncertainty induced by the inference algorithm itself. Variational families, amortized encoders, and learned samplers can be sharply wrong while still returning overconfident posterior summaries. We propose Residual Bayesian Inference, a meta-posterior construction that wraps any approximate posterior \(q\) with a stochastic correction over the unknown log-density ratio \(\log p(z \mid x) - \log q(z)\). The residual is modeled by a sparse Gaussian process and trained only through unnormalized posterior evaluations and Stein identities, avoiding access to the true normalizer while enforcing global consistency. Sampling and integration are performed by coupling \(q\) with the learned residual through a transport-corrected importance mechanism, yielding posterior summaries with an explicit decomposition into model uncertainty and inference uncertainty. A topology-aware kernel on \(q\)-induced particles lets the correction allocate mass to missed modes and symmetry-related basins rather than merely rescaling local variance. The framework turns posterior approximation error from an unobserved nuisance into a first-class random object, enabling downstream decisions to account for uncertainty about the posterior itself.
