  context: neurosymbolic & hybrid AI systems (physics-informed, logic & formal reasoning, etc.)
  idea: Neurosymbolic models often impose logic or physics as fixed differentiable penalties, but static regularization neither reveals which abstraction is incorrect nor supports exact correction at inference time. We introduce Proof-Carrying Latent Dynamics, a hybrid architecture that learns a continuous world model together with a symbolic interface over its latent state. Raw observations are encoded into latent variables, a neural transition model predicts dynamics, and a learned predicate extractor maps latents into first-order and temporal atoms representing objects, relations, and invariants. Domain knowledge—spanning conservation laws, causal preconditions, and temporal safety constraints—is compiled into an SMT-checkable specification over these atoms. During training, verifier-generated counterexamples trigger abstraction refinement and localized updates to the transition model, turning formal reasoning into a targeted supervision signal rather than a passive penalty. At inference, a constrained repair layer projects violating rollouts to the nearest satisfiable latent trajectory and returns a proof trace certifying compliance. The framework unifies perception, continuous prediction, and exact symbolic reasoning, yielding world models that are predictive, self-diagnosing, and specification-aware.
