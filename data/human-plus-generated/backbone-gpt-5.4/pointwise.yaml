  idea: 'Bayesian models quantify uncertainty in latent variables, but practical inference pipelines rarely quantify uncertainty in the posterior approximation itself: a variational family or amortized encoder collapses the unknown approximation gap to zero, yielding overconfident downstream decisions. We propose Residual Posterior Processes, a meta-inference framework that places a stochastic process prior on the log-density ratio between an arbitrary approximate posterior and the exact target. The posterior surrogate provides cheap samples, while sparse evaluations of the joint density and local score identify where the surrogate fails. A variational objective jointly fits the residual ratio and propagates its uncertainty into expectations, predictive distributions, and coverage estimates, producing uncertainty over uncertainty that contracts as refinement proceeds. An acquisition policy selects additional target evaluations at locations with highest influence on downstream functionals, making the correction layer anytime and compute-aware. The framework is model-agnostic, composes with variational inference or short-run MCMC, and turns approximate Bayesian inference from a point estimate of a posterior into a posterior over posterior error.'
