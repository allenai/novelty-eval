'305':
  context: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  idea: 'Representation learning methods typically hard-code invariances through augmentations or infer them indirectly from labels, creating a mismatch when the semantic symmetry structure of the data is unknown, partial, or task-dependent. We introduce Quotient Representation Learning, a unified framework that learns representations by first discovering latent transformation orbits from unlabeled data and then using supervised or semi-supervised signals to decide which transformations should be quotiented out. The model decomposes each example into content variables and orbit coordinates, where self-supervised cycle, commutation, and view-consistency objectives recover locally consistent symmetries, while label constraints act as selectors over the learned transformation factors. This turns invariance from a fixed design choice into a learnable, task-adaptive object: the same backbone can produce invariant, equivariant, or partially invariant embeddings without changing architecture or augmentation policy. Our perspective connects contrastive learning, group-equivariant modeling, and label-efficient representation learning under a common objective of learning the right quotient space, offering a route toward representations that adapt their semantics as supervision becomes available.'
