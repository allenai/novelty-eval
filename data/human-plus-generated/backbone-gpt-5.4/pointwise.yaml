'270':
  context: interpretability and explainable AI
  idea: 'Post-hoc explanations for deep models are often descriptive but not executable: they highlight features without predicting how a decision would change under plausible interventions. We introduce ConceptGraph Distillation, a framework that converts a trained model into a sparse causal graph over automatically discovered concepts. Candidate concepts are induced from latent directions that remain stable across input augmentations and produce consistent output changes under learned latent interventions. A structural explainer is then distilled to model the original network’s behavior under these interventions, yielding a prediction-specific subgraph whose nodes are semantically grounded by retrieved prototypes or language labels. Because explanations are represented as structural equations rather than saliency scores, they support counterfactual queries, expose interactions among concepts, and separate spurious correlates from decision-critical mechanisms. A complexity regularizer selects the coarsest graph that preserves local intervention behavior, allowing explanations to adapt their granularity to user needs without concept supervision. The result is an interpretable interface to black-box models that unifies feature attribution, concept discovery, and causal counterfactual explanation in a single executable representation.'
