'108':
  context: optimization
  idea: 'Modern optimizers spend most of their budget estimating gradients, yet they discard a rich source of information: trial updates that are clipped, rolled back, or rejected by line-search or trust-region logic. We introduce Counterfactual Step Recycling, a first-order optimization framework that treats every attempted update as supervision about local descent geometry. Each accepted or rejected perturbation induces an inequality on objective improvement; accumulating these inequalities in the low-dimensional span of recent gradients yields an online polyhedral model of directions and step lengths that are likely to decrease the objective. The optimizer then performs mirror descent inside this learned safe region, while a lightweight forgetting mechanism tracks nonstationarity and stochastic noise. The approach extracts curvature and directional asymmetry without second derivatives, and unlike standard adaptive methods, it learns from negative feedback rather than only successful gradients. Counterfactual Step Recycling is optimizer-agnostic, naturally compatible with stochastic, constrained, and bilevel settings, and suggests a broader view of optimization in which failed updates are not wasted computation but valuable evidence for shaping future search.'
