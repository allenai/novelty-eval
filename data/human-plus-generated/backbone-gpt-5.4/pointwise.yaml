  idea: 'Foundation language models can retrieve documents and call tools, yet they still collapse observation, inference, and speculation into a single next-token stream. We propose Belief-State Foundation Models, an architecture that factorizes generation into a persistent latent belief graph and a surface realizer. The belief module stores typed propositions with confidence, provenance, and temporal scope; the realizer conditions on this state to answer, abstain, or actively seek evidence. Training combines standard pretraining with three self-supervised objectives: proposition induction from raw text, contradiction-aware belief revision over sequential evidence, and counterfactual rollouts that enforce consistency under hypothetical updates. Because knowledge is represented as editable state rather than fully absorbed into weights, the model can incorporate new facts, localize uncertainty, and expose machine-readable support without chain-of-thought supervision. The framework unifies retrieval, memory, and model editing as state updates, enabling continual knowledge refresh, personalized adaptation, and transparent uncertainty handling within a single foundation model. More broadly, it reframes frontier models from static token predictors into adaptive epistemic systems that maintain and revise beliefs over time.'
