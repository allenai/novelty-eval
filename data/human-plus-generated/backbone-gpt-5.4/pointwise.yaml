'117':
  context: optimization
  idea: 'Modern stochastic optimizers treat each minibatch gradient as a faithful local descent direction, although the gradients encountered along training trajectories often form a nonconservative vector field induced by sampling noise, reparameterization, and optimizer state. We propose HodgeDescent, an optimization framework that explicitly decomposes the local stochastic gradient field into conservative and rotational components using a short window of iterates and inexpensive directional probes. The optimizer reconstructs a potential-consistent update by projecting gradients onto an approximately integrable subspace, suppresses the residual curl through an antisymmetric correction, and adapts its trust region according to decomposition uncertainty. This perspective recasts momentum, extragradient steps, and sharpness-aware smoothing as operations on different components of the same local field, yielding a unified geometric view of first-order optimization. We further show that, for smooth objectives with bounded decomposition error, controlling rotational energy improves stability near saddles and narrow valleys without discarding useful curvature information. Our work suggests a new design principle for optimization: descend on the latent scalar potential hidden inside stochastic gradients, rather than on the raw gradients themselves.'
