  idea: Representation learning methods typically enforce agreement between entire embeddings across views or labels, which entangles semantic factors with nuisance variability and makes the same backbone behave differently across unsupervised, self-supervised, semi-supervised, and supervised settings. We propose Stability-Gated Representation Learning, a unified framework that learns which latent dimensions should be invariant, equivariant, or unconstrained for each relation between examples. Given two observations linked by an augmentation, temporal adjacency, pseudo-pair, or class label, a relation encoder predicts a soft stability mask over the latent space. Contrastive or predictive losses are applied only to masked stable coordinates, while complementary coordinates are trained to reconstruct view-specific residuals, preventing the collapse of informative nuisance factors. Sparse labels enter as strong relational constraints that require class information to reside in the stable subspace and be unpredictable from the residual subspace, allowing supervision to refine rather than replace the self-supervised structure. The resulting objective turns supervision into a continuum of relational evidence, yielding representations whose invariances are discovered rather than prescribed and whose decomposition remains transferable across tasks and supervision regimes.
