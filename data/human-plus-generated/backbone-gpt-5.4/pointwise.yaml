  idea: 'Modern learning systems are trained not on raw i.i.d. samples, but on sample-dependent neighborhoods produced by augmenters, generators, and retrieval-based editors. Classical generalization theory does not capture this regime: it either assumes fixed data distributions or treats transformations as perfectly label-preserving. We introduce a learning-theoretic framework for adaptive example expansion in which each training point induces a stochastic transformation orbit, potentially with controlled semantic drift. Our central object is the orbit complexity of a hypothesis class, a data-dependent measure of how much predictions can vary along augmentation trajectories. We prove excess-risk bounds that decompose into empirical orbit smoothness, orbit complexity, and a label-drift term quantifying deviation from exact invariance. This yields a principled criterion for when augmentation reduces effective sample complexity and when it amplifies overfitting by enlarging the reachable orbit geometry. The framework also motivates a new regularization strategy that penalizes unstable directions while permitting informative, non-invariant transformations. Beyond standard augmentation, our theory applies to synthetic data generation and test-time adaptation, providing a unified account of learning from transformed neighborhoods rather than isolated examples.'
