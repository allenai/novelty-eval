  idea: 'Bayesian posteriors in modern models are often dominated by symmetry-induced multimodality: permutations in mixture models and hidden units, sign flips, and rescalings create many disconnected parameter settings that represent the same function. Conventional variational inference underestimates uncertainty by collapsing onto arbitrary representatives, while MCMC wastes computation revisiting prediction-equivalent modes. We introduce Quotient Posterior Inference, a symmetry-aware Bayesian framework that performs inference directly over equivalence classes induced by known group actions. The method learns a canonical coordinate system and a transport variational family on the quotient space, then lifts quotient samples back to parameter space through group averaging for predictive integration. To retain exactness when desired, we pair this parameterization with an orbit-mixing sampler that alternates local updates in canonical coordinates with inexpensive group moves, eliminating label-switching pathologies without imposing ad hoc identifiability constraints. By separating epistemic uncertainty over functions from redundant uncertainty over parameter symmetries, the framework offers a more faithful posterior geometry for Bayesian neural networks, mixture models, and latent-variable models with exchangeable components.'
