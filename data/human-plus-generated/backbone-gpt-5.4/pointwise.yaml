  idea: We introduce Residual Stein Transport, a Bayesian inference framework that couples amortized variational inference with certified local correction. The method first learns a coarse global posterior approximation using a lightweight variational family, then parameterizes a residual transport field that moves its samples toward the true posterior by minimizing a pathwise Stein objective rather than matching the posterior in one step. Crucially, a companion calibration process estimates a sample-wise uncertainty-over-inference signal from the accumulated Stein residual along each transport trajectory, providing a differentiable certificate of where the approximation remains unreliable. These certificates trigger short, targeted Langevin refinement only in high-error regions, yielding an adaptive hybrid algorithm that retains the speed of variational proposals while recovering asymptotic correctness through sparse local sampling. The framework also induces bias-corrected estimators for posterior expectations by reweighting transported samples with their residual certificates. By turning posterior approximation error into an explicit random object, Residual Stein Transport reframes variational bias as something that can be modeled, localized, and corrected, opening a path toward scalable uncertainty quantification with built-in self-diagnosis.
