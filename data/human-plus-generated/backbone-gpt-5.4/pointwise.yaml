  idea: 'Static benchmarks have become brittle instruments for measuring progress: once released, they are rapidly saturated, vulnerable to training-data contamination, and often unclear about which capabilities they actually measure. We introduce BenchForge, a benchmark paradigm in which a dataset is specified by a publicly documented generation graph rather than a fixed test set. Starting from human-authored seed instances, BenchForge records structured provenance, annotates latent semantic factors, and compiles them into transformation programs that generate controlled paraphrases, counterfactuals, and distribution shifts under a hidden sampler. Each benchmark item is thus evaluated as part of a related example family, enabling measurement not only of task performance but also of invariance, consistency, and sensitivity to known factors. To reconcile transparency with test security, BenchForge uses cryptographic commitments to freeze generator definitions while keeping sampled evaluation instances ephemeral. The framework also supports continuous benchmark refresh through anchor distributions that preserve longitudinal comparability across versions. BenchForge reframes datasets and benchmarks as auditable, evolving evaluation processes rather than static artifacts, offering a practical path toward contamination-resistant and diagnosis-rich measurement for rapidly advancing models.'
