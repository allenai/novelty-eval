  idea: Nonconvex optimization is often bottlenecked not by the absence of descent directions, but by the inability to decide when the objective should be smoothed, regularized, or solved at full fidelity. Existing continuation methods rely on hand-designed schedules that are disconnected from local geometry. We propose Self-Homotopy Descent, an optimization framework that treats the smoothing level of the objective as a learnable state variable coupled to iterate dynamics. At each step, the method estimates landscape ruggedness from perturbation-consistent gradients and a low-rank Hessian sketch, then updates both parameters and smoothing scale through a bilevel rule that increases smoothing near fragmented basins and decreases it when stable progress is predicted. The resulting optimizer interpolates between robust coarse-scale search and precise fine-scale convergence without external schedules. We further derive a quotient view showing that adaptive smoothing suppresses high-frequency curvature while preserving descent on persistent minima, yielding a principled mechanism for saddle escape and basin selection. The framework is compatible with stochastic, constrained, and distributed settings, suggesting geometry-aware continuation as a first-class primitive in modern optimization.
