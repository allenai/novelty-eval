'212':
  context: alignment, fairness, safety, privacy, and societal considerations
  idea: 'Current alignment pipelines compress diverse social values into a single reward model trained from centrally collected preferences, creating three coupled failures: they erase minority norms, expose sensitive annotator attributes, and force models to answer when stakeholder values are irreconcilably uncertain. We propose Deliberative Private Constitutions, a framework for pluralistic alignment that learns a latent space of normative principles from privacy-preserving stakeholder feedback and public institutional texts. Rather than optimizing one global preference model, the method trains a mixture of constitutional experts whose aggregation is conditioned on the predicted set of affected communities and decision context. A fairness-constrained social choice layer selects responses that minimize worst-group normative regret, while an uncertainty estimator detects high-conflict regions of the value space and triggers abstention, clarification, or human escalation. Differentially private preference aggregation and secure representation learning prevent extraction of individual participants’ values without discarding population-level structure. By coupling privacy, fairness, and safety inside a single alignment objective, the framework recasts alignment as deliberative governance over model behavior rather than static imitation of a homogeneous annotator pool.'
