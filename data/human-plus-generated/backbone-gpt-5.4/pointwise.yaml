  idea: Multimodal foundation models typically align whole-example embeddings or tokenize each stream independently, leaving them brittle to asynchrony, missing sensors, and modality-specific shortcuts. We introduce EventField, a modality-agnostic architecture that treats vision, audio, language, and other signals as partial observations of a shared continuous-time latent event field. Modality encoders write probabilistic object- and event-centric updates into the field at their native resolutions, while lightweight decoders query the same field to reconstruct tokens, localize evidence, summarize temporal structure, or synthesize absent modalities. Training combines cross-modal denoising with intervention losses that randomly suppress, delay, or contradict one modality, forcing the latent field to preserve underlying semantic and causal content rather than superficial co-occurrence. A sparse slot-based parameterization makes the representation compositional and supports variable numbers of entities and long temporal contexts without committing to a fixed token grid. By unifying heterogeneous streams through an event-centric latent space, EventField suggests a general recipe for multimodal systems that reason over shared world dynamics instead of merely correlating modalities.
