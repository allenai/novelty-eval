  idea: Benchmark progress is increasingly decoupled from real capability because static public test sets invite contamination, adaptive overfitting, and shortcut exploitation. We propose CounterBench, a dataset-and-benchmark framework that represents each evaluation problem as an intervention family rather than a single example. Starting from seed instances, CounterBench constructs semantically equivalent paraphrases, nuisance-controlled edits, compositional recombinations, and provenance- or time-shifted variants, each linked by a skill graph specifying which latent competencies should remain invariant and which are intentionally stressed. This structure enables benchmarks to report capability profiles over invariance, abstraction, and transfer, instead of a single aggregate score that obscures failure modes. The framework combines programmatic generation, expert auditing, and release-on-demand hidden shards with provenance fingerprints to reduce contamination while preserving reproducibility. Because the same intervention formalism can instantiate language, vision, and multimodal tasks, CounterBench offers a unified substrate for building living benchmarks that evolve with models. We argue that evaluating performance across controlled intervention families is a more faithful measure of generalization than scoring on static test sets alone.
