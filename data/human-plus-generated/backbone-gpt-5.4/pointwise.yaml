  idea: Large language models currently adapt through either persistent weight updates or ever-growing context windows, creating a trade-off between stability, cost, and personalization. We introduce Transient Weight Memory, a foundation-model architecture that converts contextual information into reversible parameter updates at inference time. A lightweight compiler network reads retrieved documents, tool outputs, or dialogue history and writes sparse low-rank deltas into a provenance-indexed cache attached to selected transformer blocks. Generation then proceeds with the frozen base model plus the active cache, yielding a temporary task-specialized model without gradient-based fine-tuning. We train the compiler and backbone jointly with next-token prediction, delta sparsity, interference penalties, and consistency objectives that enforce invariance to context reordering and robustness to partial memory removal. The resulting system reframes in-context learning as learned test-time model editing, enabling compression of long contexts into reusable parameter memories, non-destructive user-specific adaptation, and explicit addition, subtraction, or composition of ephemeral knowledge. This offers a new path toward frontier models that separate stable world knowledge from session-scoped beliefs and skills.
