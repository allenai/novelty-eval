'119':
  context: optimization
  idea: Modern learning objectives are often optimized in parameter spaces with large symmetry orbits, where many updates change the coordinates of a model without meaningfully changing its function. We introduce Quotient Descent, a general optimization framework that treats training as descent on the parameter manifold modulo local reparameterization symmetries. The method estimates an online basis for symmetry directions from Jacobian null structure and architecture-induced invariances, constructs a quotient metric on the identifiable subspace, and projects gradients, momentum, and preconditioners onto this space before taking an update. A complementary fiber-control term limits optimizer drift along symmetry directions, yielding a canonicalized state that is less sensitive to redundant coordinates. Unlike standard adaptive methods, Quotient Descent is invariant to common rescalings and normalization symmetries, and it can be layered on top of first-order or second-order optimizers without changing the objective. This quotient-space view reframes flatness and redundancy as exploitable geometric structure, suggesting a new family of symmetry-aware optimizers for overparameterized models, constrained problems, and distributed training.
