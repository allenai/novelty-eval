  context: foundation or frontier models, including LLMs
  idea: Frontier language models are typically optimized on realized trajectories, leaving them poorly calibrated on the near-miss internal states that precede hallucination, policy violation, and brittle tool use. We propose Counterfactual Shadowing, a self-auditing framework that augments a foundation model with a lightweight shadow network trained on counterfactual perturbations of its own hidden states, reasoning traces, and action sequences. The shadow network learns to predict whether a continuation remains faithful under instruction, retrieval, and tool interventions, producing a state-conditional risk estimate before unsafe or unreliable text is emitted. During inference, the base model decodes normally in low-risk regimes, while high-risk states trigger targeted recovery operations such as latent rollback, retrieval refresh, or constrained deliberation. Unlike post-hoc guardrails, our approach operates on internal representations rather than completed outputs, enabling earlier intervention and tighter coupling between capability and oversight. Because counterfactual training data are synthesized from the model itself, Counterfactual Shadowing scales naturally with frontier-model training pipelines and extends to multimodal and tool-augmented systems.
