'311':
  context: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  idea: Representation learning is typically partitioned into unsupervised, self-supervised, semi-supervised, and supervised regimes, each with distinct objectives that induce incompatible biases and often require redesign as annotation budgets change. We propose Annotation-as-View Learning, a unified framework that treats augmentations, pseudo-labels, and human labels as stochastic, partial observations of an underlying semantic state. An encoder maps each input into a factorized latent space comprising a semantic component that must remain consistent across views and a residual component that captures view-specific nuisance variation. Training uses supervision dropout, which randomly removes labels and auxiliary views during optimization, forcing the model to reconstruct missing supervision from the shared semantic code while preserving self-predictive structure on unlabeled data. This yields a single objective that smoothly interpolates between unsupervised, self-supervised, semi-supervised, and fully supervised learning without changing the architecture or loss family. By modeling labels as privileged views rather than fixed endpoints, the method encourages representations that remain transferable under new tasks, altered label spaces, and heterogeneous supervision sources.
