  context: applications to computer vision, audio, language, and other modalities
  idea: Multimodal foundation models typically align co-occurring tokens across image, audio, and text streams, but this paradigm conflates shared semantics with modality-specific timing, style, and noise. We introduce EventBottleneck, a modality-agnostic architecture that represents an observation as a sparse sequence of latent event tokens inferred from any subset of modalities and decoded back into each modality through uncertainty-aware generators. Rather than enforcing token-level synchrony, EventBottleneck learns which signals arise from the same underlying event and models modality-specific delays, omissions, and granularity. Training combines masked cross-modal reconstruction with counterfactual intervention objectives, requiring the model to predict how audio, video, language, or other sensor streams would change if a latent event were added, removed, or temporally shifted. This event-centric bottleneck separates shared dynamics from modality-specific surface form, enabling compositional grounding, robust missing-modality inference, and a unified interface for multimodal understanding and generation. The framework naturally extends to video-language learning, embodied agents, meeting understanding, and scientific multimodal observations as asynchronous views of a shared evolving process.
