'22':
  context: foundation or frontier models, including LLMs
  idea: Current frontier models excel at imitation but acquire world knowledge mainly through observational next-token prediction, leaving counterfactual and interventional reasoning brittle. We propose Intervention-Augmented Pretraining, a self-supervised framework that converts ordinary corpora into paired observational-interventional training signals. A learned editor or lightweight simulator applies minimal, semantically typed interventions to a premise—altering quantities, agents, temporal order, code statements, or environmental constraints—while the model predicts downstream text, tool traces, or program behavior under the modified premise. Training combines a consistency objective that preserves unaffected consequences, an attribution objective that localizes which latent states should update after an intervention, and uncertainty tags for edits whose effects are underdetermined. This encourages the model to represent invariant mechanisms separately from mutable facts, rather than memorizing surface correlations. The framework is modality-agnostic and can be layered onto language, code, or multimodal pretraining. By learning not only what usually follows, but what would change, what should remain fixed, and when evidence is insufficient, foundation models can acquire more causal, controllable, and data-efficient internal world models.
