  idea: 'Static weights and textual context are the two dominant mechanisms for controlling foundation models, but both are poorly matched to transient expertise: the former is persistent and expensive to update, while the latter is weak and token-inefficient. We introduce Prompt-Compiled Adapters, a framework in which a frozen LLM synthesizes ephemeral low-rank parameter deltas from the current prompt, retrieved documents, and interaction history. A lightweight compiler predicts which layers to modify and emits short-lived adapters that exist only for a single episode. Training combines meta-learning across task families with paraphrase invariance and a deletion-consistency objective that requires model behavior to revert when the supporting evidence is removed. To prevent uncontrolled entanglement, we add an activation-space checksum that constrains compiled experts to a small causal footprint, making adaptation reversible and inspectable. Prompt-Compiled Adapters turn a generalist model into a per-instance specialist without persistent fine-tuning, suggesting a new control primitive for safe personalization, rapid adaptation in non-stationary domains, and memory systems that modify behavior without permanently editing the base model.'
