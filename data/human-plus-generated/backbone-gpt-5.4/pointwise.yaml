  idea: 'Modern learning algorithms often interpolate the training set yet generalize across transformations and domains, exposing a mismatch between classical capacity measures and invariance-driven practice. We introduce orbit compression theory, a learning-theoretic framework in which examples are not atomic points but transformation or intervention orbits induced by latent symmetries. Its central quantity, the orbit compression dimension, is the smallest number of orbit representatives and equivariant reconstruction rules needed to recover a predictor on the training support. We derive generalization bounds that scale with orbit complexity and orbit curvature rather than ambient dimension, showing how data augmentation, contrastive objectives, weight sharing, and margin maximization implicitly reduce effective complexity. We further propose a learning principle that jointly fits a predictor and a sparse orbit basis, yielding invariance-aware certificates and a criterion for benign overfitting: interpolation remains harmless when memorization is confined to low-curvature orbits. The framework unifies sample compression, PAC-Bayes analysis, and group-invariant learning, and suggests a route toward non-vacuous theory for heavily overparameterized models trained on structured data.'
