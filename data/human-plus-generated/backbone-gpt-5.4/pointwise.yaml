  idea: 'Current multimodal foundation models typically rely on dense token fusion and tightly synchronized training pairs, which limits transfer to real-world settings where vision, audio, language, and other sensors arrive asynchronously, incompletely, and at different granularities. We introduce EventWeaver, a modality-agnostic latent bottleneck that represents an experience as a sparse graph of event slots shared across modalities. Each encoder writes variable-rate tokens into the graph through cross-modal optimal transport, avoiding fragile frame-level alignment, while each decoder reads from the same graph to support recognition, retrieval, forecasting, and explanation. To make the slots capture causal structure rather than surface correlation, EventWeaver is trained with intervention-based masking: one modality is edited, delayed, or removed, and the model must infer the invariant event graph and the modality-specific consequences. New modalities can be attached through lightweight adapters that learn only how to write to and read from the event graph. The framework reframes multimodal learning from pairwise alignment to event abstraction, enabling more robust and extensible multimodal applications.'
