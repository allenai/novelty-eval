  idea: Representation learning objectives typically hard-code invariance to augmentations, yet the same transformation can suppress nuisance variation in one context and destroy semantics in another. We introduce Contextual Invariance Decomposition, a general framework that learns when representations should be invariant and when they should remain equivariant. For each pair of views, an encoder factorizes the input into a semantic subspace and a variation subspace, while a routing module predicts which latent dimensions should agree across views and which should explain their differences. Self-supervised training aligns routed semantic dimensions and models transformation trajectories in the variation subspace, preventing useful variation from being collapsed. When labels are available, they regularize only the semantic subspace, treating supervision as a local identifiability constraint rather than the sole learning signal. By varying the strength of this semantic anchoring, the same objective naturally spans unsupervised, self-supervised, semi-supervised, and supervised regimes. The resulting representations are designed to preserve multiple factors of variation while exposing task-relevant structure at the granularity required by downstream tasks.
