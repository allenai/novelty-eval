  idea: Foundation-model systems increasingly rely on multiple specialized agents, yet they coordinate almost exclusively through natural language, a channel optimized for humans rather than machines. Language-based coordination is verbose, lossy, and poorly suited for transmitting uncertainty, partial plans, or intermediate representations across heterogeneous models. We introduce Protocol Latents, a framework for learned inter-model communication in which each frozen foundation model is equipped with lightweight translators that map internal states to and from a shared latent protocol space. The protocol is trained with cycle-consistency across models, an information bottleneck that encourages compact messages, and task-grounded sufficiency objectives that preserve only decision-relevant content. A dual-channel decoder renders latent messages back into natural language when human auditability is required, while a learned router chooses when communication should remain latent or textual. Protocol Latents turns communication itself into a trainable abstraction layer, enabling specialist models to collaborate without exposing model-specific hidden states or retraining the underlying backbones. More broadly, the approach suggests a path toward multi-model frontier systems whose interfaces are adaptive, efficient, and compositional rather than purely linguistic.
