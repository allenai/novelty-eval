'287':
  context: learning theory
  idea: Classical learning theory treats the training sample as an unordered multiset, leaving it unable to explain why easy-to-hard curricula, staged pretraining, and data scheduling can alter sample efficiency. We introduce a sequential theory of generalization in which example order induces a filtration over version spaces, and learning complexity is governed by how quickly this filtration contracts. Our central object, curriculum complexity, measures the cumulative local disagreement growth encountered along a training trajectory rather than the global capacity of the full hypothesis class. This yields order-sensitive generalization bounds for empirical risk minimization, online-to-batch conversion, and posterior-based learners, and identifies a structural condition under which a curriculum provably reduces effective learnability complexity relative to any permutation-invariant analysis. We further formulate curriculum design as minimizing future disagreement inflation, leading to a principled easy-to-hard strategy expressible through margins or surrogate losses. The framework connects curriculum learning with active learning and sample compression, suggesting that statistical efficiency depends not only on which examples are observed, but on when the learner is forced to resolve each ambiguity.
