  context: applications to computer vision, audio, language, and other modalities
  idea: Multimodal foundation models typically align whole samples or fuse dense token streams, implicitly treating vision, audio, language, and other modalities as synchronized views of the same content. This assumption breaks in realistic settings, where modalities observe different fragments of an underlying process with variable delay, granularity, and reliability. We introduce an event-centric multimodal framework that represents a scene as a latent graph of discrete events rather than a flat joint embedding. Modality-specific encoders propose sparse event tokens, and a cross-modal inference module assembles them into shared event nodes linked by temporal and semantic relations. The model is trained with cross-modal event denoising, masked graph completion, and counterfactual modality substitution, encouraging it to separate invariant events from modality-specific artifacts and to reason under absence or conflict. Because supervision is imposed at the level of latent events, the learned representation supports asynchronous fusion, missing-modality robustness, and compositional transfer across heterogeneous data sources. This formulation offers a general recipe for multimodal systems that must understand not just co-occurring signals, but the underlying events that generate them.
