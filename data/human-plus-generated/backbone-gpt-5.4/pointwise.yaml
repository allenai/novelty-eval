'313':
  context: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  idea: 'Modern representation learning methods differ mainly in how they define agreement between examples: augmentations in self-supervision, sparse annotations in semi-supervision, and class labels in supervised learning. Existing objectives typically enforce this agreement in a single embedding space, implicitly assuming that all signals preserve the same factors of variation. We introduce Partial Equivalence Factorization, a unified framework that models representations as a collection of orthogonal subspaces and treats each training signal as a learned mask over the subspaces it should constrain. Positive pairs are aligned only within the relevant subspaces, while unconstrained dimensions are preserved through conditional redundancy reduction and cross-subspace decorrelation. In this view, labels become high-confidence equivalence masks, augmentations induce invariance over content subspaces, and pseudo-labels act as uncertainty-weighted soft masks, allowing one objective to span unsupervised, self-supervised, semi-supervised, and supervised regimes. By replacing global similarity with structured partial agreement, the framework aims to prevent representational over-collapse, preserve transferable nuisance information, and support a more compositional notion of invariance across heterogeneous supervision sources.'
