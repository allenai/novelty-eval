  idea: 'Current multimodal foundation models largely rely on pairwise alignment between co-occurring signals, which captures correlation but not the latent events that jointly generate vision, audio, language, and other sensor streams. We introduce EventWeaver, an event-centric pretraining framework that decomposes synchronized or weakly synchronized multimodal sequences into sparse latent slots representing underlying causes such as actions, objects, and acoustic incidents. Each slot is shared across modalities through a common state, while lightweight modality-specific decoders reconstruct the corresponding visual, auditory, and textual evidence. To prevent shortcut learning, EventWeaver trains with counterfactual masking: the model perturbs or removes a single event in one modality and predicts the induced changes in the others, encouraging invariance to nuisance factors such as viewpoint, speaker identity, and background noise. A temporal memory links recurring slots across time, enabling compositional binding of words, sounds, and appearances even under partial observations. The resulting representation supports recognition, grounding, retrieval, and controllable generation from arbitrary modality subsets, suggesting a route toward more robust and interpretable multimodal systems.'
