  idea: Neuroscience increasingly seeks models that transfer across experiments, subjects, and recording modalities, yet most analyses remain task-specific and confound stimulus content with the cognitive operations used to process it. We introduce NeuroCompositional Operators, a framework that learns reusable cognitive primitives by jointly modeling neural activity, behavior, and natural-language task instructions. The key idea is to treat each task as a composition of latent operators—such as maintenance, accumulation, switching, and suppression—that act on shared sensory representations. A language-conditioned hypernetwork proposes operator compositions from task instructions, while a neural state-space model refines them using time-resolved brain signals and behavioral trajectories. Cross-subject and cross-modality alignment anchors the latent operators to common dynamics, and an intervention-consistency objective encourages operators to correspond to causal manipulations rather than superficial task labels. The resulting model provides a unified representation in which new tasks can be interpreted, simulated, and linked to prior paradigms by recombining previously discovered operators. This approach offers a path toward an experiment-agnostic atlas of cognitive computations, enabling transfer across datasets and generating mechanistic hypotheses about how distributed neural circuits implement abstract mental operations.
