  context: applications to computer vision, audio, language, and other modalities
  idea: Multimodal foundation models typically align vision, audio, language, and other modalities at the level of co-occurring tokens, which entangles shared causes with modality-specific artifacts and limits transfer under missing or delayed observations. We propose CauseFormer, a modality-agnostic framework that learns latent causal event graphs from heterogeneous streams. Each modality encoder maps raw inputs into event slots with onset, duration, and uncertainty, and a shared graph transformer infers dependencies among latent events while preserving modality-specific structure. Training combines masked event prediction with intervention-inspired perturbations that drop, delay, or swap modality segments, encouraging the model to retain cross-modal causes that remain invariant and isolate private effects that do not. A lightweight language grounding module attaches concise textual descriptors to graph nodes, producing interpretable and editable event representations. Because generation and reasoning operate over latent event graphs rather than raw tokens, the model naturally supports asynchronous fusion, missing-modality inference, and counterfactual simulation across video, audio, text, and sensor data. This formulation reframes multimodal learning as causal event induction, offering a unified substrate for robust perception and controllable generation.
