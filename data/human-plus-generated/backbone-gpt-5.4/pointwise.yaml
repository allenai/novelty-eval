  idea: Modern foundation models often acquire new tasks from context alone, yet classical learning theory largely analyzes either parameter-updated learners or fixed hypothesis classes, leaving in-context learning without a sharp sample-complexity account. We introduce contextual hypothesis complexity, a sequence-dependent measure of how a prompt contracts the set of functions a pretrained model can realize on future inputs. This perspective treats a transformer as an implicit meta-learner that maps contexts to task-local predictors, and yields generalization bounds whose dominant term depends on prompt-induced contraction rather than parameter count. We derive PAC-Bayesian and online-to-batch variants of these bounds, identify a stability threshold beyond which additional demonstrations induce prompt overfitting, and characterize when latent task structure makes longer contexts provably beneficial. Building on the theory, we propose a pretraining regularizer that minimizes worst-case contextual complexity across task families, encouraging representations that are easier to adapt in context. The framework unifies few-shot prediction, retrieval-augmented prompting, and prefix tuning under a common learnability notion, offering a foundation for a theory of adaptation in large models.
