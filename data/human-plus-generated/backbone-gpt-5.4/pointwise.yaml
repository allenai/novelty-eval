  idea: 'Modern learning systems are increasingly trained on data they partly generate themselves through self-training, synthetic augmentation, and distillation, yet classical learning theory assumes that the sample distribution is fixed and independent of the learner. We introduce a framework for feedback learnability, in which each hypothesis induces a data-generation kernel that shapes the distribution seen by future updates. Our analysis centers on two quantities: a feedback dimension that measures the effective capacity of a hypothesis class after composition with the generation mechanism, and a counterfactual stability coefficient that captures how strongly one update can perturb future samples. Using this decomposition, we derive generalization and excess-risk bounds for recursive training procedures, establish fixed-point consistency conditions for self-training, and identify a phase transition separating error-correcting from error-amplifying synthetic-data regimes. The framework recovers standard i.i.d. learning as a zero-feedback special case and provides formal conditions under which model-generated data can reduce, rather than merely redistribute, statistical complexity. This yields a learning-theoretic foundation for self-improving training pipelines.'
