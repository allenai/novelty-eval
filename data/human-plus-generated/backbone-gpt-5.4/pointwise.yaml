  idea: Classical learning theory explains generalization through hypothesis complexity or leave-one-out stability, but these views do not capture the structured distribution shifts induced by data augmentation, manifold drift, or deployment-time covariate change. We introduce transport stability, a notion of algorithmic stability defined over optimal-transport perturbations of the empirical distribution rather than replacement of single examples. Transport stability measures how predictors vary under geometry-preserving movements of mass, yielding a unified framework that recovers uniform stability, robustness to invariant transformations, and certain domain adaptation guarantees as special cases. We develop a coupling analysis of optimization trajectories showing that gradient-based learners can remain stable in the interpolating regime when loss variation is controlled along the data manifold, even if ambient-space sensitivity is large. This perspective leads to a geometry-aware regularization principle that penalizes predictor change only along admissible transport directions, aligning robustness with learnability instead of worst-case perturbation. The framework offers a theoretical explanation for why heavily overparameterized models can generalize under structured shift and suggests a new foundation for studying augmentation, benign overfitting, and out-of-distribution robustness within a single learning-theoretic lens.
