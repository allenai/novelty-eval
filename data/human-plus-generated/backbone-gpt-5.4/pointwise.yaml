  context: alignment, fairness, safety, privacy, and societal considerations
  idea: 'Large language models are typically aligned to a single global policy, which can encode majority norms, personalize unsafely by inferring protected traits, and obscure disagreement on socially contested requests. We propose Consent-Calibrated Constitutional Alignment, a framework that learns pluralistic safety behavior from federated and differentially private preference feedback while forbidding demographic inference as a control signal. The method decomposes alignment into three coupled components: a latent constitution model capturing diverse normative perspectives, an information-bottleneck policy that conditions only on explicitly provided user values and task context, and a disagreement-aware decision layer that abstains or asks clarifying questions when constitutions conflict or uncertainty is high. Training combines secure aggregation of community preferences, adversarial removal of sensitive-attribute signals from hidden states, and constrained preference optimization against hard safety rules. This yields models that can adapt to legitimate value pluralism without treating inferred identity as preference, reducing both representational harm and privacy leakage. Beyond chat assistants, the framework offers a general recipe for deploying interactive AI in education, health, and public-service settings where fairness, safety, and democratic legitimacy must be balanced rather than collapsed into a single reward.'
