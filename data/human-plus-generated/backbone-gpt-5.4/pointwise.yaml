  context: foundation or frontier models, including LLMs
  idea: 'Frontier language models store facts, reasoning heuristics, and uncertainty in a single parameter space, making them difficult to update, calibrate, and ground. We propose Epistemic State Models, a foundation-model architecture that augments a frozen LLM with a persistent latent belief graph whose nodes represent claims, supporting evidence, provenance, and confidence, and whose dynamics are learned jointly with generation. At each interaction, the model first infers edits to the belief graph from context and retrieved documents, then conditions decoding on a structured readout over graph neighborhoods rather than raw context alone. Training combines three self-supervised objectives: evidence-to-claim abstraction, contradiction-triggered belief revision, and counterfactual consistency, which teaches the model to maintain separate hypothetical worlds instead of collapsing them in token space. This separation turns parametric knowledge into a prior and instance-level knowledge into an editable state, enabling targeted updates, explicit uncertainty, and transparent long-horizon reasoning. The framework suggests a path toward foundation models that behave less like static text imitators and more like agents with revisable, provenance-aware beliefs.'
