  idea: Large language models often produce confident answers from a single latent world state, making them brittle when prompts hide assumptions, include spurious cues, or admit multiple valid interpretations. We introduce AssumptionGraph, a framework that elevates assumptions to explicit latent variables for both training and inference. Given an input, the model first infers a compact graph of assumptions supporting candidate answers, then generates structured counterfactual edits that preserve task intent while varying irrelevant or uncertain premises. Reasoning is performed jointly across these worlds with an invariance objective that enforces agreement when conclusions should remain stable and preserves divergence when assumptions genuinely change the answer. Counterfactual disagreement is converted into calibrated abstention or targeted clarification questions, rather than forced completion. The assumption graph also provides a lightweight interface for tool use and oversight, allowing external modules to inspect, edit, or verify the premises behind a claim without exposing full chain-of-thought. By supervising models on assumption discovery and counterfactual stability, AssumptionGraph offers a path toward more robust, faithful, and controllable frontier models.
