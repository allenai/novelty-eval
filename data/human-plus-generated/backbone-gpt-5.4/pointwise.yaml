  idea: 'Post-hoc explanations are often judged by visual plausibility or local fidelity, yet they rarely state what would falsify them. We introduce Falsifiable Explanation Graphs, a framework that interprets a model decision as a sparse graph of latent concepts linked by directed influence edges. The core idea is a self-falsification loop: from an input, the explainer proposes a concept graph and a set of invariance claims about which input regions, tokens, or latent factors are irrelevant. An intervention module then adversarially perturbs only the claimed-irrelevant factors and edits the claimed-relevant concepts to synthesize counterfactuals. The explainer is optimized so that the graph is sufficient to predict the model’s response under these interventions, while any unexplained feature that still changes the prediction is converted into a penalty and new concept candidate. This turns explanation into a testable object rather than a descriptive artifact, encouraging sparsity, stability across semantically equivalent inputs, and causal sufficiency under distribution shift. Because the method operates on internal activations or black-box queries, it unifies saliency, concept attribution, and counterfactual explanation within a single framework and yields explanations that can be audited, edited, and used to repair model behavior.'
