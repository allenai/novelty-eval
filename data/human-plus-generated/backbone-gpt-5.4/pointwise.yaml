  context: foundation or frontier models, including LLMs
  idea: Frontier language models often produce fluent answers without representing which parts of the prompt, retrieved evidence, or tool outputs actually support those answers. This entangles reasoning with spurious context and limits faithfulness, controllability, and safe tool use. We introduce Context Contracts, a training framework that augments a frozen or trainable foundation model with a latent dependency layer that commits each response to a minimal support set and a set of invariance constraints. During training, the model observes counterfactual perturbations of prompts, retrieval snippets, and intermediate tool results; a contract loss enforces that generations remain stable under irrelevant edits and update predictably when contract-critical evidence changes. The dependency layer is learned without human rationales by optimizing for counterfactual sufficiency, necessity, and compactness, and can be queried to expose provenance or drive selective abstention. Because contracts are latent and low-dimensional, the approach preserves generation efficiency and can be attached to existing frontier models through lightweight adapters. We argue that dependency-aware generation offers a unified route toward more faithful retrieval-augmented generation, more reliable agentic pipelines, and finer-grained model editing.
