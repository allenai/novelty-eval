  idea: Robotic foundation models can generate semantically plausible task plans, but they remain difficult to execute reliably in partially observed, dynamically changing environments because action feasibility is rarely represented explicitly. We propose Contractive Affordance Programs, a planning framework that compiles language-conditioned manipulation and navigation tasks into object-centric programs whose operators carry learned preconditions, effects, and safety contracts. Instead of predicting only future observations, a multimodal world model estimates a differentiable affordance field for each skill over geometry, semantics, and epistemic uncertainty, defining where and when that skill is valid. Planning alternates between discrete search over skill compositions and continuous optimization within these validity regions, yielding executable plans that remain interpretable at the symbolic level while staying grounded in sensor data. When execution violates a contract, an online repair module synthesizes local subgoals and updates the active program without replanning from scratch. The resulting formulation unifies symbolic task planning, learned world models, and uncertainty-aware control, offering a path toward more compositional, failure-aware autonomy in long-horizon embodied tasks.
