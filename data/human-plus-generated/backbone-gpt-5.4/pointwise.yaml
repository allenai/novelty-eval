  idea: Representation learning methods are typically optimized for the supervision available during training, even though their practical value depends on how easily they can absorb new labels later. We introduce Prospective Representation Learning, a framework that trains encoders for compatibility with future supervision. The core idea is to sample a diverse family of pseudo-tasks from unlabeled structure—clusterings, neighborhood orderings, cross-view correspondences, and temporal or augmentation-induced partitions—and optimize the encoder so that parameter updates induced by small supervision sets for these tasks are mutually aligned. This gradient-consensus objective encourages features whose semantics can be refined by new labels rather than overwritten, reducing the gap between self-supervised pretraining and downstream adaptation. Available human labels enter the same pseudo-task family as high-confidence constraints, yielding a single formulation that spans unsupervised, self-supervised, semi-supervised, and supervised regimes without changing the learning principle. A bi-level objective couples invariance learning with update alignment, producing representations that preserve instance discrimination while organizing the latent space along directions that remain easy to supervise. The framework shifts the goal from solving current surrogate tasks to learning features that are inherently label-efficient and ready for supervision that arrives after deployment.
