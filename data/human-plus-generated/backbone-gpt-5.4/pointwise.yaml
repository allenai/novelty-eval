  idea: 'Modern multimodal models largely equate co-occurrence with semantics, yet real-world visual, acoustic, linguistic, and sensor streams are often asynchronous, incomplete, and contaminated by modality-specific shortcuts. We introduce ECHO, an event-centric omnimodal pretraining framework that learns latent causes shared across heterogeneous modalities. ECHO first converts each modality into timestamped proposals and then infers a sparse sequence of latent event tokens through a cross-modal state-space model. Each token must jointly explain all available observations while remaining invariant under two interventions: temporal warping, which disrupts superficial synchrony, and modality swapping, which replaces one channel with a semantically related but distinct observation. These interventions encourage event tokens to encode modality-agnostic event structure, while modality-specific decoders preserve channel-dependent detail for reconstruction and generation. A lightweight query interface retrieves event tokens for downstream reasoning, missing-modality completion, and controllable cross-modal generation. By separating shared event structure from modality-specific rendering, ECHO offers a unified recipe for robust representation learning across vision, audio, language, and other modalities.'
