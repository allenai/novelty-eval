  idea: Modern optimization methods for large-scale nonconvex learning operate in extremely high-dimensional spaces, yet empirical trajectories often concentrate near a slowly evolving low-dimensional active manifold. We introduce Tangent-Probe Optimization, a stochastic framework that explicitly models and exploits this geometry during training. The method maintains an online estimate of the local active subspace from recent gradients and parameter displacements, performs curvature-aware trust-region updates inside the inferred tangent space, and allocates a small exploration budget to orthogonal probe directions when anisotropy or negative-curvature cues suggest entrapment near saddles or sharp valleys. This yields an optimizer that adapts its effective dimensionality over time, interpolating between manifold-constrained descent and controlled ambient-space exploration. We further derive a mirror-map interpretation showing that the learned subspace induces an implicit, data-dependent preconditioner, linking active-subspace discovery to adaptive optimization. By treating dimension reduction as a first-class optimization primitive rather than a post hoc analysis tool, the proposed framework opens a new route toward scalable algorithms that are simultaneously curvature-aware, noise-robust, and escape-capable in high-dimensional nonconvex landscapes.
