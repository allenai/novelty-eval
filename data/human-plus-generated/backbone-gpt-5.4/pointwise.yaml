  context: transfer learning, meta learning, and lifelong learning
  idea: Transfer learning reuses representations, meta-learning amortizes rapid adaptation, and lifelong learning seeks to preserve past competence, yet current methods typically store task-specific parameters or example memories that obscure the underlying mechanisms of transfer. We introduce Lifelong Meta-Transport, a framework that models adaptation itself as a sparse composition of reusable parameter-space transport operators. A hypernetwork infers, from a few examples of a new task, which operators to activate and how to compose them, producing fast task-specific updates without full fine-tuning. As tasks arrive sequentially, the operator library expands only when existing operators cannot explain the observed adaptation, yielding nonparametric growth with minimal redundancy. To mitigate forgetting, operators are regularized to inhabit disentangled curvature-aware subspaces, while replay is performed over compact operator codes rather than raw data. This reframes continual learning as maintaining a structured vocabulary of transferable update primitives rather than accumulating isolated task memories. By treating tasks as trajectories generated by compositional adaptation operators, the framework unifies transfer, meta, and lifelong learning under a common representation of how models change across experiences.
