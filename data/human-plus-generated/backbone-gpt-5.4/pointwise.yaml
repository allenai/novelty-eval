  idea: Current alignment pipelines encode one-size-fits-all safety rules and rely on surface-level privacy filters, which fail when disclosure permissibility depends on conversational context, negotiated consent, and community-specific norms. This especially harms fairness, since dialect and identity cues are often misread as risk signals, causing asymmetric refusals. We introduce ConSent, a training framework for language models that treats privacy and safety as contextual integrity rather than static prohibition. ConSent learns a latent consent state from dialogue history and conditions generation on a structured action policy that can answer, redact, clarify, or abstain. The framework combines locally private collection of user redlines and preference annotations, constitutional supervision that encodes socially grounded disclosure norms, and counterfactual fairness regularization over identity-preserving prompt perturbations to equalize helpfulness and refusal behavior across groups. When the model detects normative ambiguity or low confidence in consent, it defers by requesting clarification instead of making irreversible disclosure decisions. By jointly modeling alignment, privacy, and fairness at the level of conversational intent, the approach reframes safe assistance as consent-aware interaction that preserves utility without centralizing sensitive preference data.
