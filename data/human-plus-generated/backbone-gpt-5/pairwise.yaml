    0: We present a novel geometric perspective on the latent space of diffusion models. We first show that the standard pullback approach, utilizing the deterministic probability flow ODE decoder, is fundamentally flawed. It provably forces geodesics to decode as straight segments in data space, effectively ignoring any intrinsic data geometry beyond the ambient Euclidean space. Complementing this view, diffusion also admits a stochastic decoder via the reverse SDE, which enables an information geometric treatment with the Fisher-Rao metric. However, a choice of $\mathbf{x}_T$ as the latent representation collapses this metric due to memorylessness. We address this by introducing a latent spacetime $\mathbf{z}=(\mathbf{x}_t,t)$ that indexes the family of denoising distributions $p(\mathbf{x}_0 | \mathbf{x}_t)$ across all noise scales, yielding a nontrivial geometric structure. We prove these distributions form an exponential family and derive simulation-free estimators for curve lengths, enabling efficient geodesic computation. The resulting structure induces a principled Diffusion Edit Distance, where geodesics trace minimal sequences of noise and denoise edits between data. We also propose applications to transition path sampling in molecular systems, including constrained variants such as low-variance transitions and region avoidance.
    1: Generative models excel at reproducing observed data but struggle to generalize under interventions or composition because causal mechanisms are entangled. We introduce Composable Do-Flows, a modular generative architecture that factors the data distribution into mechanism-specific flow modules aligned with a learned or provided causal graph. Training uses interventional flow matching, which matches rectified vector fields under environment-specific boundary conditions while regularizing invariance of untouched mechanisms across environments. Structure is induced by a sparse gating process that discovers mechanism boundaries from weak environment tags or self-supervision through independence constraints. At inference, interventions are realized by clamping or replacing modules and sampling the remaining coupled SDE/ODE; counterfactuals arise via an amortized abduction step that inverts the learned flows to infer latent noise for given evidence. A light-weight mechanism-token interface permits text- or program-conditioned interventions and enables zero-shot composition across unseen do-operations. By bridging causal semantics with modern flow/diffusion training, Composable Do-Flows aims to deliver generative models that are robust, controllable, and extrapolative beyond the observational regime.
