    0: Generative models excel at producing high-fidelity samples, yet they routinely violate domain constraints that are symbolic, combinatorial, or physics-based. Retraining with specialized objectives or relying on prompt tricks is brittle and expensive. We introduce Validator-Guided Projection Flows (VAPOR), a post-training framework that wraps any base generator—diffusion, autoregressive, or flow—with learnable constraint fields derived from black-box validators. Using convex duality, we cast constrained generation as finding the information projection of the base distribution onto a constraint set, yielding an additive energy of the form Σ_i ψ_i(x, c) that minimally perturbs the model while enforcing expectations and safety rules. We amortize ψ_i with small neural potentials conditioned on context and sampling time, and inject their gradients into the sampler (as score shaping for diffusion or logit tilting for autoregressive decoding), enabling differentiable, composable enforcement without access to training data. VAPOR supports hard/soft and per-instance budgets, composes heterogeneous validators, and permits calibrated trade-offs between fidelity and satisfaction. The framework unifies rejection-free constraint satisfaction, post-hoc editing, and targeted data synthesis under a single principle, delivering controllable, audit-ready generative models.
    1: The importance of mobile phone GPS trajectory data is widely recognized across many fields, yet the use of real data is often hindered by privacy concerns, limited accessibility, and high acquisition costs. As a result, generating pseudo–GPS trajectory data has become an active area of research. Recent diffusion-based approaches have achieved strong fidelity but remain limited in spatial scale (small urban areas), transportation-mode diversity, and efficiency (requiring numerous sampling steps). To address these challenges, we introduce TrajFlow, which to the best of our knowledge is the first flow-matching-based generative model for GPS trajectory generation. TrajFlow leverages the flow-matching paradigm to improve robustness and efficiency across multiple geospatial scales, and incorporates a trajectory harmonization & reconstruction strategy to jointly address scalability, diversity, and efficiency. As the first nationwide, multi-scale GPS trajectory generation model, TrajFlow demonstrates strong potential to support inter-region urban planning, traffic management, and disaster response, thereby advancing the resilience and intelligence of future mobility systems.
