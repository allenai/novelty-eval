  ideas:
    0: 'Adversarial Training (AT) is a known, powerful, well-established technique for improving classifier robustness to input perturbations, yet its applicability beyond discriminative settings remains limited. Motivated by the widespread use of score-based generative models and their need to operate robustly under substantial noisy or corrupted input data, we propose an adaptation of AT for these models.

      We introduce a principled formulation of AT for Diffusion Models (DMs) that replaces the conventional *invariance* objective with an *equivariance* constraint aligned to the denoising dynamics of score matching. Our method integrates seamlessly into diffusion training by adding either random perturbations--similar to randomized smoothing--or adversarial ones--akin to AT.

      Our approach offers several advantages: **(a)** tolerance to heavy noise and corruption, **(b)** reduced memorization, **(c)** robustness to outliers and extreme data variability and **(d)** resilience to iterative adversarial attacks.'
    1: 'Aligning large models with societal expectations requires reconciling plural, contested norms while protecting the privacy of those who supply feedback and preserving safety and fairness under shifting regulations. We introduce CivicAlign, a participatory alignment framework that turns stakeholder preferences into enforceable constraints and verifiable outputs. A compact normative DSL encodes safety, fairness, and privacy invariants as a jurisdiction-aware policy lattice. Preferences over these invariants are collected through privacy-preserving mechanisms and combined by a differentiable social-choice layer that yields context-conditioned mixtures of constraints without revealing individual votes. During training, the social-choice signal shapes objectives via constrained optimization; at inference, a proof-carrying decoding procedure jointly generates a response and a machine-checkable compliance witness that certifies which constraints were consulted and satisfied. Distributionally robust calibration ensures group-level fairness guarantees despite uncertainty in demographic inference, while a budgeted accountant tracks privacy loss for both data subjects and preference contributors. CivicAlign thereby provides reconfigurable, auditable alignment: models can switch policies across communities and jurisdictions, expose per-output certificates for downstream auditors, and learn from private, heterogeneous feedback without centralizing raw data.'
