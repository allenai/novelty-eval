  ideas:
    0: 'Despite advances in pretraining with extended context sizes, large language models (LLMs) still face challenges in effectively utilizing real-world long-context information, primarily due to insufficient long-context alignment caused by data quality issues, training inefficiencies, and the lack of well-designed optimization objectives. To address these limitations, we propose a framework named **S**h**o**rt-to-**Lo**ng **P**reference **O**ptimization (**SoLoPO**), decoupling long-context preference optimization (PO) into two components: short-context PO and short-to-long reward alignment (SoLo-RA), supported by both theoretical and empirical evidence. Specifically, short-context PO leverages preference pairs sampled from short contexts to enhance the model''s contextual knowledge utilization ability. Meanwhile, SoLo-RA explicitly encourages reward score consistency for the responses when conditioned on both short and long contexts that contain identical task-relevant information. This facilitates transferring the model''s ability to handle short contexts into long-context scenarios. SoLoPO is compatible with mainstream preference optimization algorithms, while substantially improving the efficiency of data construction and training processes.'
    1: 'We introduce Operator-Aligned Multimodal Editing (OAME), a framework that learns modality-agnostic operators as algebraic actions in latent space to unify control over computer vision, audio, language, and additional modalities. OAME factorizes each modality into a content code and a carrier geometry, and attaches a shared operator head that acts via a learned Lie-algebraic transformation, enforcing identity, inverse, and composition constraints across domains. Self-supervised augmentations instantiate operator supervision (e.g., spatial shifts, color/loudness scaling, time-stretching, pitch transposition, paraphrase lengthening), while cross-modal regularizers align operators with analogous semantics. A lightweight instruction-to-operator compiler maps free-form language to operator programs that compose and calibrate strength continuously. This design yields a single interface for edits that is interpretable, invertible, and compositional: rotate then brighten an image, transpose then accelerate audio, or shorten then formalize text—all via the same operator tokens. OAME transforms multimodal models from passive recognizers into controllable editors, enabling zero-shot cross-modal transfer, precise edit chaining, and program-like manipulation spanning vision, audio, language, and other sensors.'
