    0: While diffusion models have achieved remarkable performance in image generation, they often struggle with the imbalanced datasets frequently encountered in real-world applications, resulting in significant performance degradation on minority classes. In this paper, we identify model capacity allocation as a key and previously underexplored factor contributing to this issue, providing a perspective that is orthogonal to existing research. Our empirical experiments and theoretical analysis reveal that majority classes monopolize an unnecessarily large portion of the model's capacity, thereby restricting the representation of minority classes. To address this, we propose Capacity Manipulation (CM), which explicitly reserves model capacity for minority classes. Our approach leverages a low-rank decomposition of model parameters and introduces a capacity manipulation loss to allocate appropriate capacity for capturing minority knowledge, thus enhancing minority class representation. CM can be combined with existing methods to further boost overall performance.
    1: 'Representation learning across heterogeneous supervision regimes remains fragmented, with objectives that interfere and degrade under shifting label availability. We introduce Supervision Programming (SupProg), a declarative-to-differentiable framework that unifies unsupervised, self-supervised, semi-supervised, and supervised learning as constraint satisfaction in representation space. Practitioners specify supervision primitives—view invariance, equivariance, similarity, class membership, ranking, temporal prediction—which a compiler transforms into a common energy with slack variables. A meta-learned primal–dual optimizer adaptively tunes Lagrange multipliers and routes, per example, a budgeted subset of constraints, using influence-aware gradient alignment to prevent interference and catastrophic forgetting. SupProg recovers popular objectives (InfoNCE, BYOL, cross-entropy, consistency regularization) as special cases and enables novel compositions, such as mixing group-equivariant self-supervision with sparse labels or rule-based weak supervision. The result is regime fluidity: as label density, noise, or domain shift change, the compiler reweights constraints to preserve geometric structure while injecting task signal. We formalize a supervision polytope that characterizes feasibility and provide conditions under which SupProg converges to representations complete for the specified constraints, offering a principled, scalable, and controllable path to unified representation learning.'
