  ideas:
    0: 'We present the first comprehensive evaluation of AI agents against human cybersecurity professionals in a live enterprise environment. We evaluate ten cybersecurity professionals alongside six existing AI agents and ARTEMIS, our new agent scaffold, on a large university network consisting of $\sim$8,000 hosts across 12 subnets. ARTEMIS is a multi-agent framework featuring dynamic prompt generation, arbitrary sub-agents, and automatic vulnerability triaging. AI agents offer advantages in systematic enumeration, parallel exploitation, and cost---certain ARTEMIS variants cost $18/hour versus $60/hour for professional penetration testers. We also identify key capability gaps: AI agents exhibit higher false-positive rates and struggle with GUI-based tasks.'
    1: 'We introduce CivicProof, a proof-carrying alignment framework that unifies safety, fairness, privacy, and societal governance for foundation models. Instead of treating guardrails as opaque heuristics, CivicProof compiles a rights-based normative contract into two artifacts: a training-time Lagrangian that shapes representations and a certified inference-time shield that enforces constraints and tracks budgets. The contract expresses verifiable obligations over behaviors, such as refusal conditions, bounded demographic disparities under uncertainty, and user- and training-level privacy budgets. Each model interaction yields a succinct compliance receipt—a zero-knowledge proof attesting that the shield was applied and that current budgets and invariants were satisfied—without revealing sensitive data or full policy contents. CivicProof further embeds pluralistic governance: stakeholder preferences are collected under differential privacy and aggregated via strategyproof social choice to propose contract updates; update proofs certify backward compatibility or explicitly document trade-offs. The resulting system enables auditable, portable guardrails that are enforceable across deployments, composable across jurisdictions, and amenable to third-party verification without privileged data access. By making alignment obligations executable and provable, CivicProof reframes safety, fairness, and privacy not as competing add-ons but as jointly certified guarantees attached to every model output.'
