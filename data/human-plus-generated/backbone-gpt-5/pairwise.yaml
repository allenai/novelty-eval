    0: We present LongLive, a frame-level autoregressive (AR) framework for real-time and interactive long video generation. Long video generation presents challenges in both efficiency and quality. Diffusion and Diffusion-Forcing models can produce high-quality videos but suffer from low efficiency due to bidirectional attention. Causal attention AR models support KV caching for faster inference but often degrade in quality on long videos due to memory challenges during long-video training. In addition, beyond static prompt-based generation, interactive capabilities, such as streaming prompt inputs, are critical for dynamic content creation, enabling users to guide narratives in real time. This interactive requirement significantly increases the complexity, especially in ensuring visual consistency and semantic coherence during prompt transitions. To address these challenges, LongLive adopts a causal, frame-level AR design that integrates a KV-recache mechanism that refreshes cached states with the new prompt for smooth, adherent switches; streaming long tuning to enable long video training and to align training and inference (train-long–test-long); and short window attention paired with a frame-level attention sink, preserving long-range consistency while enabling faster generation. With these key designs, LongLive fine-tunes a 1.3B-parameter short-clip model to minute-long generation in just 32 GPU-days. LongLive supports up to 240-second videos on a single H100 GPU.
    1: 'We introduce Counterexample-Guided Energy Shaping (CAGE), a test-time control layer that transforms off-the-shelf generative models into verifiable, constraint-aware samplers without retraining. Given an arbitrary black-box verifier—ranging from parsers and logical checkers to physics simulators—CAGE learns a lightweight surrogate that approximates a smoothed signed distance to the feasible set via counterexample-guided active querying of the verifier. This surrogate becomes an energy term that smoothly guides generation: for diffusion models, we augment the score with the surrogate’s gradient; for autoregressive models, we reweight logits using an influence function that propagates surrogate gradients through partial rollouts. A trust-region controller, expressed as a path-wise KL or noise-schedule gate, bounds distributional drift to preserve the base model’s fidelity. Multiple constraints compose additively with adaptive Lagrange multipliers, enabling trade-offs among semantics, safety, and structure. CAGE yields sample-level certificates upon verifier acceptance and admits monotonic improvement guarantees in satisfaction probability when the surrogate uniformly approximates the constraint boundary. The result is a plug-in, modality-agnostic mechanism for controllable, verifiable generation across text, code, images, and trajectories.'
