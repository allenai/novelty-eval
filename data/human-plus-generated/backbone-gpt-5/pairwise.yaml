    0: 'Live Photo captures both a high-quality key photo and a short video clip to preserve the precious dynamics around the captured moment. While users may choose alternative frames as the key photo to capture better expressions or timing, these frames often exhibit noticeable quality degradation, as the photo capture ISP pipeline delivers significantly higher image quality than the video pipeline. This quality gap highlights the need for dedicated restoration techniques to enhance the reselected key photo. To this end, we propose LiveMoments, a reference-guided image restoration framework tailored for the reselected key photo in Live Photos. Our method employs a two-branch neural network: a reference branch that extracts structural and textural information from the original high-quality key photo, and a main branch that restores the reselected frame using the guidance provided by the reference branch. Furthermore, we introduce a unified Motion Alignment module that incorporates motion guidance for spatial alignment at both the latent and image levels.'
    1: 'Foundation models excel when every signal is present, but real deployments face missing, costly, or privacy-sensitive inputs that arrive asynchronously. We introduce MOSAIC, an active multimodal architecture that learns what to sense, when to sense it, and when to stop. MOSAIC frames perception and reasoning as a sequential decision process over a shared token space built on frozen unimodal encoders connected by lightweight adapters. A modality acquisition policy estimates the marginal utility of candidate observations via counterfactual masking and distillation, selecting the next query under compute, latency, and privacy budgets. A stop controller halts acquisition based on epistemic uncertainty proxies, yielding task-adaptive, budget-aware inference. The same interface composes sensing with generation: the system may request a short audio snippet to localize a sound source before answering a visual question, or solicit a text summary to guide video retrieval, while differentiable surrogates propagate learning signals through black-box tools. MOSAIC turns multimodal systems from passive aggregators into goal-directed askers, enabling principled, efficient, and privacy-conscious applications across vision, audio, language, wearable, and robotic sensors.'
