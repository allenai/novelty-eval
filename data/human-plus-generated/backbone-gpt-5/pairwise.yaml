    0: Federated Learning (FL) enables clients to collaboratively train a global model without sharing their private data. However, the presence of malicious (Byzantine) clients poses significant challenges to the robustness of FL, particularly when data distributions across clients are heterogeneous. In this paper, we propose a novel Byzantine-robust FL optimization problem that incorporates adaptive weighting into the aggregation process. Unlike conventional approaches, our formulation treats aggregation weights as learnable parameters, jointly optimizing them alongside the global model parameters. To solve this optimization problem, we develop an alternating minimization algorithm with strong convergence guarantees under adversarial attack. We analyze the Byzantine resilience of the proposed objective.
    1: Stochastic optimization frequently operates under heteroscedastic, heavy-tailed, and drifting noise, where fixed schedules and smoothness-based line searches become brittle. We introduce Conformal Line-Search (CLS), a plug-in mechanism that wraps any descent direction with a distribution-free calibration of its magnitude to achieve chance-constrained descent. CLS treats the unknown true decrease along a candidate step as a latent quantity and constructs exchangeable scores from past noisy function values or directional derivatives; split-conformal quantiles then yield a shrinkage factor ensuring a nonnegative lower confidence bound on the decrease at user-specified level 1−α. The method assumes only exchangeability, adds at most one extra mini-batch or function query per iteration, and integrates seamlessly with momentum, adaptive preconditioning, and composite objectives via conformalized merit functions and proximal steps. We establish finite-sample per-iterate descent coverage, descent-in-expectation, and global convergence under convexity and Polyak–Łojasiewicz conditions, and we expose equivalences and limits connecting CLS to Armijo backtracking, trust regions, and Polyak step rules. By decoupling safety from smoothness and noise models, CLS provides an uncertainty-aware alternative to hand-tuned learning rates for training under heavy tails, label noise, and dataset shift.
