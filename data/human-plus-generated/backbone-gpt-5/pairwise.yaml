    0: 'Bayesian posteriors provide coherent uncertainty, yet under misspecification they are often miscalibrated, while conformal methods ensure coverage but forfeit posterior structure. We introduce Coverage-Constrained Posterior Projection (CCPP), a general framework that minimally perturbs a baseline posterior to satisfy predictive coverage constraints measured on a calibration set. CCPP solves an information projection: among all distributions Q over parameters, find the closest to the baseline posterior P in an f-divergence subject to linear constraints on expected randomized quantile and interval miscoverage statistics. The dual yields an exponential-tilted posterior Q*(theta) proportional to P(theta | D_train) * exp(lambda^T psi(theta; D_cal)), where psi encodes predictive events and lambda are learned by stochastic mirror descent. This black-box procedure reweights existing MCMC or VI samples, or amortizes a new variational family, and supports covariate-conditional, distribution-shifted, and fairness-aware coverage via feature-dependent constraints. We prove existence and uniqueness of the projection, finite-sample coverage on the calibration distribution, and a minimal-distortion property; under well-specification CCPP recovers the Bayesian posterior. CCPP bridges Bayesian and conformal paradigms, yielding calibrated predictive posteriors without refitting the likelihood.'
    1: 'Multi-output Gaussian processes (MOGPs) provide a Bayesian framework for modeling non-linear functions with multiple outputs, in which nonstationary kernels are essential for capturing input-dependent variations in observations. However, from a spectral (dual) perspective, existing nonstationary kernels inherit the inflexibility and over-parameterization of their spectral densities due to the restrictive spectral–kernel duality. To overcome this, we establish a generalized spectral–kernel duality that enables fully flexible matrix-valued spectral densities — albeit at the cost of quadratic parameter growth in the number of outputs. To achieve linear scaling while retaining sufficient expressiveness, we propose the multi-output low-rank nonstationary (MO-LRN) kernel: by modeling the spectral density through a low-rank matrix whose rows are independently parameterized by bivariate Gaussian mixtures.'
