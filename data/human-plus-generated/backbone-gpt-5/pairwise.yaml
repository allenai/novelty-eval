  ideas:
    0: We propose PluralGuard, a privacy-preserving, pluralistic alignment framework that reconciles fairness, safety, and societal governance for foundation models. PluralGuard learns community-specific normative experts from decentralized preference data using federated optimization with differential privacy and secure aggregation, avoiding centralization of sensitive feedback. A calibrated arbitration layer composes these experts at inference via uncertainty-aware mixture policies conditioned on jurisdictional context and predicted harm, with distributionally robust training to protect minority groups. When normative disagreement or epistemic uncertainty is high, the system defers with an abstention policy and routes to human oversight. To enable accountability without leaking private data, PluralGuard emits succinct, cryptographically verifiable compliance certificates attesting that outputs satisfy pre-registered safety constraints and applicable policy choices. It also produces contestability artifacts—disagreement scores and counterfactual normative projections—that surface how alternative value choices would affect outcomes, enabling stakeholder auditing and user recourse. By unifying plural value specification, private preference learning, robust arbitration, and auditable safety, PluralGuard offers a path toward deployable, socially grounded alignment.
    1: 'Reward models (RMs) play a critical role in aligning AI behaviors with human preferences, yet they face two fundamental challenges: (1) Modality Imbalance, where most RMs are mainly focused on text and image modalities, offering limited support for video, audio, and other modalities; and (2) Preference Rigidity, where training on fixed binary preference pairs fails to capture the complexity and diversity of personalized preferences. To address the above challenges, we propose Omni-Reward, a step toward generalist omni-modal reward modeling with support for free-form preferences, consisting of: (1) Evaluation: We introduce Omni-RewardBench, the first omni-modal RM benchmark with free-form preferences, covering nine tasks across five modalities including text, image, video, audio, and 3D; (2) Data: We construct Omni-RewardData, a multimodal preference dataset comprising 248K general preference pairs and 69K instruction-tuning pairs for training generalist omni-modal RMs; (3) Model: We propose Omni-RewardModel, which includes both discriminative and generative RMs.'
