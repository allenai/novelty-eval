    0: 'Dense retrievers play a vital role in accessing external and specialized knowledge to augment language models (LMs). Training dense retrievers typically requires annotated query-document pairs, which are costly to create and scarce in specialized domains (e.g., code) or in complex settings (e.g., requiring reasoning). These practical challenges have sparked growing interest in self-supervised retriever learning.

      Since LMs are trained to capture token-level dependencies through a self-supervised learning objective (i.e., next token prediction), we can analogously cast retrieval as learning dependencies among chunks of tokens. This analogy naturally leads to the question: How can we adapt self‑supervised learning objectives in the spirit of language modeling to train retrievers?


      To answer this question, we introduce Revela, a unified and scalable training framework for self-supervised retriever learning via language modeling. Revela models semantic dependencies among documents by conditioning next token prediction on local and cross-document context through an in-batch attention mechanism. This attention is weighted by retriever-computed similarity scores, enabling the retriever to be optimized as part of language modeling. Without requiring annotated or synthetic query-document pairs, Revela offers a scalable approach to self-supervised retriever learning, with performance that increases with batch size and model size.'
    1: We introduce Polyhedral Supervision, a unified framework that treats unsupervised, self-supervised, semi-supervised, and supervised signals as soft geometric constraints on a shared embedding. A constraint compiler converts augmentations into equivariance/invariance bounds, unlabeled neighborhoods into transitivity and clustering constraints, and labels into calibrated margin and calibration constraints on pairwise similarities and classifier logits. Each constraint is endowed with a learnable trust variable that accounts for noise and domain shift. Training is cast as a maximum-entropy primal–dual program that jointly optimizes the representation, classifier, Lagrange multipliers, and trust variables, automatically allocating model capacity to compatible signals while relaxing conflicts. The multipliers provide introspection and drive an online curriculum that tightens reliable constraints over time, enabling streaming integration of new supervision without manual loss rebalancing or catastrophic forgetting. This view recovers popular methods—contrastive learning, pseudo-labeling, and margin-based classification—as special cases of a single solver and exposes new design knobs for targeted invariance injection, fairness-aware constraints, and cross-domain adaptation. By turning heterogeneous supervision into a common currency of constraints, Polyhedral Supervision simplifies training across regimes and yields representations that are controllable, auditable, and ready for continual, mixed-supervision settings.
