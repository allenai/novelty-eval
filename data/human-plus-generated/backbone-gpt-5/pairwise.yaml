  ideas:
    0: 'Learning on graphs, meshes, and higher-order complexes remains brittle to discretization, gauge choices, and topology-altering rewiring. We introduce Functorial Sheaf Neural Operators (FuSION), a framework that represents signals as cochains on a cellular sheaf and performs cross-dimensional message passing constrained by discrete exterior calculus. FuSION parameterizes a learnable Hodge star while fixing the exterior derivative to enforce d^2=0, yielding updates that respect gradient–curl–harmonic structure and are gauge-equivariant to per-cell basis changes. To make representations transfer across resolutions and domains, we train with a naturality objective: random simplicial/cellular morphisms (contractions, subdivisions, coverings) induce pullbacks/pushforwards of data, and the network is penalized when embeddings and predictions fail to commute with these maps. A differentiable discrete-Morse pooling provides topology-preserving coarsening, while harmonic channels route long-range information along nontrivial cycles to mitigate oversquashing. The result is a single operator that natively spans graphs, simplicial complexes, and manifolds and that maintains topological consistency under refinement, coarsening, or surgery, enabling robust learning and transfer for tasks from combinatorial prediction to neural PDE surrogates on irregular geometries.'
    1: Large Language Models (LLMs) often generate incorrect or unsupported content, known as hallucinations. Existing detection methods rely on heuristics or simple models over isolated computational traces such as activations, or attention maps. We unify these signals by representing them as attributed graphs, where tokens are nodes, edges follow attentional flows, and both carry features from attention scores and activations. Our approach, CHARM, casts hallucination detection as a graph learning task and tackles it by applying GNNs over the above attributed graphs. We show that CHARM provably subsumes prior attention-based heuristics. Our results shed light on the relevant role played by the graph structure and on the benefits of combining computational traces.
