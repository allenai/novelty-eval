    0: Diffusion-based image generation models excel at producing high-quality synthetic content, but suffer from slow and computationally expensive inference. Prior work has attempted to mitigate this by caching and reusing features within diffusion transformers across inference steps. These methods, however, often rely on rigid heuristics that result in limited acceleration or poor generalization across architectures. We propose **E**volutionary **C**aching to **A**ccelerate **D**iffusion models (ECAD), a genetic algorithm that learns efficient, per-model, caching schedules forming a Pareto frontier, using only a small set of calibration prompts. ECAD requires no modifications to network parameters or reference images. It offers significant inference speedups, enables fine-grained control over the quality-latency trade-off, and adapts seamlessly to different diffusion models. Notably, ECAD's learned schedules can generalize effectively to resolutions and model variants not seen during calibration. ECAD establishes a scalable and generalizable approach for accelerating diffusion inference.
    1: 'Generative models remain difficult to steer compositionally: guidance and adapters often entangle attributes, depend on step-wise scoring, and fail under novel combinations. We introduce CompoFlow, a framework that encodes each attribute, instruction, or constraint as a transport operator acting on a pretrained generator’s distribution. Each operator is the time‑1 flow of a neural vector field trained with minimum‑perturbation objectives to match attribute‑conditioned marginals while remaining close to the base prior, yielding lightweight, reusable modules. A Lie‑bracket regularizer encourages approximate commutativity, so composing operators in arbitrary order approximates sampling from the multi‑attribute conditional without iterative guidance or base-model retraining. CompoFlow integrates with diffusion and autoregressive models by applying attribute flows in latent space or along the denoising trajectory; edit strength and sparsity follow from path‑integrated costs. This operator-theoretic view unifies soft guidance, hard constraints, and style/content edits, supports plug‑and‑play conditioning from weak supervision (e.g., text energies), and enables zero‑shot composition of unseen attribute sets. We analyze identifiability and error accumulation via Baker–Campbell–Hausdorff expansions and establish conditions under which the composed flow targets the desired posterior.'
