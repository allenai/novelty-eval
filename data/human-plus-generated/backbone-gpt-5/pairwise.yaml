  ideas:
    0: 'While Large Language Models (LLMs) hold promise to become autonomous agents, they often explore suboptimally in sequential decision-making. Recent work has sought to enhance this capability via supervised fine-tuning (SFT) or reinforcement learning (RL), improving regret on the classic multi-armed bandit task. However, it remains unclear how these learning methods shape exploration strategies and how well they generalize. We investigate both paradigms by training LLMs with SFT on expert trajectories and RL with a range of tailored reward signals including a strategic, regret-shaped reward to reduce variance, and an algorithmic reward that enables oracle imitation. Behavioral analysis reveals that gains often stem from more sophisticated but greedier exploitation: RL/SFT agents are more prone to early catastrophic failure than pre-trained models, prematurely abandoning exploration. Furthermore, agents trained to imitate UCB learn to outperform their teacher by adopting more exploitative variants. Our findings clarify when each training paradigm is preferable and advocate tailored reward design and evaluation beyond average regret to promote robust exploratory behavior.'
    1: 'We introduce ParamTokens, a text-native mechanism for transiently specializing frontier language models by injecting composable low-rank weight updates through the prompt. Each ParamToken encodes a targeted delta over selected layers, generated by a small meta-learner and applied on-the-fly during the forward pass via gated low-rank adapters. A budgeting router selects which tokens to activate and where to apply them, trading accuracy, safety, and latency under explicit compute constraints. Training encourages algebraic behavior—approximate additivity, order invariance, and sparsity—so multiple tokens can be stacked, composed, and revoked without destabilizing the base model. This turns capabilities into portable artifacts that can be retrieved, exchanged, audited, and versioned like documents, while leaving foundation weights untouched. ParamTokens unify retrieval, parameter-efficient finetuning, and continual learning: skills, safety patches, or domain norms become discrete units that the model can request, justify, and enforce at inference. We detail the meta-learning objectives, the routing policy, and a text–parameter interface that preserves the model’s general competence while enabling reversible, compute-aware specialization for personalization, tool-use schemas, safety overlays, and federated skill sharing.'
