    0: We present EquaBench, a renewable, equated benchmarking framework that transforms static datasets into a principled measurement process. EquaBench specifies each capability via a formal blueprint that enumerates atomic skills, invariances, and nuisance factors, then uses programmatic generators to produce unbounded families of test items across language, vision-language, code, and safety domains. Small, persistent anchor sets and a hierarchical item response model link rotating forms onto a stable latent scale, enabling longitudinal comparability despite continuously refreshed content. A contamination-aware protocol serves ephemeral test forms through a stateless API and returns equated scores with calibrated uncertainty, discouraging reconstruction while preserving reproducibility. The open release includes capability blueprints, generators, and public training pools; only seeds and anchors remain private. Differential item functioning is modeled via group-specific parameters to ensure fairness across architectures, and metamorphic constraints enforce construct validity under transformations. EquaBench offers a general recipe for building benchmarks that resist saturation and leakage while preserving comparability, aligning ML evaluation with best practices in measurement science.
    1: We introduce spatio-temporal omni-object video grounding, dubbed $\textbf{OmniSTVG}$, a new STVG task aiming to localize spatially and temporally all targets mentioned in the textual query within videos. Compared to classic STVG locating only a single target, OmniSTVG enables localization of not only an arbitrary number of text-referred targets but also their interacting counterparts in the query from the video, making it more flexible and practical in real scenarios for comprehensive understanding. In order to facilitate exploration of OmniSTVG, we propose $\textbf{BOSTVG}$, a large-scale benchmark dedicated to OmniSTVG. Specifically, BOSTVG contains 10,018 videos with 10.2M frames and covers a wide selection of 287 classes from diverse scenarios. Each sequence, paired with a free-form textual query, encompasses a varying number of targets ranging from 1 to 10. To ensure high quality, each video is manually annotated with meticulous inspection and refinement. To our best knowledge, BOSTVG, to date, is the first and the largest benchmark for OmniSTVG. To encourage future research, we present a simple yet effective approach, named $\textbf{OmniTube}$, which, drawing inspiration from Transformer-based STVG methods, is specially designed for OmniSTVG. By releasing BOSTVG, we hope to go beyond classic STVG by locating every object appearing in the query for more comprehensive understanding, opening up a new direction for STVG.
