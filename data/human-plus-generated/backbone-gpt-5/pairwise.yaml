    0: Modern predictors increasingly assemble computations on the fly—retrieving external memories, gating mixture-of-experts, or composing tools—yet classical generalization analysis assumes a fixed hypothesis chosen at training time. We develop a theory of assembly learning, where a small, trainable policy selects and orders primitives from a large library to build per-input predictors. We introduce assembly complexity, an information-theoretic capacity measure that charges the mutual information between the training sample and the sequence of indices chosen by the policy, together with stability- or norm-based costs of the primitives and their wiring. Our framework yields generalization bounds that scale with the codelength of assembly decisions rather than the size of the library, unifying PAC-Bayes, sample compression, and information-theoretic generalization as special cases. Sequential covering arguments handle adaptive, retrieval-conditioned selection, and a path-stability notion certifies robustness under library churn and cache updates. We further obtain compute-aware bounds that track test-time search depth, capturing the benefits and risks of increased inference compute. The theory applies to retrieval-augmented language models, in-context regression as a selection of linear solvers, and mixture-of-experts gating, offering a principled capacity control mechanism for dynamically composed predictors.
    1: Neural scaling laws underlie many of the recent advances in deep learning, yet their theoretical understanding remains largely confined to linear models. In this work, we present a systematic analysis of scaling laws for quadratic and diagonal neural networks in the feature learning regime. Leveraging connections with matrix compressed sensing and LASSO, we derive a detailed phase diagram for the scaling exponents of the excess risk as a function of sample complexity and weight decay. This analysis uncovers crossovers between distinct scaling regimes and plateau behaviors, mirroring phenomena widely reported in the empirical neural scaling literature. Furthermore, we establish a precise link between these regimes and the spectral properties of the trained network weights, which we characterize in detail. As a consequence, we provide a theoretical interpretation from first principles of recent empirical observations connecting the emergence of power-law tails in the weight spectrum with network generalization performance.
