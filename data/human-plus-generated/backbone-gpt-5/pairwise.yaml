    0: In this work, we propose FFDP, a set of IO-aware non-GEMM fused kernels supplemented with a distributed framework for image registration at unprecedented scales. Image registration is an inverse problem fundamental to biomedical and life sciences, but algorithms have not scaled in tandem with image acquisition capabilities. Our framework complements existing model parallelism techniques proposed for large-scale transformer training by optimizing non-GEMM bottlenecks and enabling convolution-aware tensor sharding. FFDP enables unprecedented capabilities such as performing multimodal registration of a 100μm ex-vivo human brain MRI volume at native resolution – an inverse problem more than 570× larger than a standard clinical datum – using only 8 A6000 GPUs. FFDP accelerates existing optimization and deep learning registration pipelines while reducing peak memory consumption, and enables fitting substantially larger problems on a single GPU than previously possible.
    1: Modern cloud infrastructure responds to incidents by rapidly installing kernel-resident policies for networking, observability, and resource control. Hand-authoring safe, performant eBPF for these scenarios remains a rare skill and slows mitigation. We introduce Pallas, an intent-driven, proof-carrying synthesis stack that turns high-level operational objectives into verifiably safe eBPF programs deployable across fleets. Pallas couples a constrained generative synthesizer with a library of verified sketches and invariants, producing candidates alongside machine-checkable proofs of memory safety, termination, and budgeted CPU cost. A host-side checker validates proofs and enforces cost contracts in concert with the kernel’s verifier, while a control plane performs shadow execution, canary rollout, and automatic rollback using counterfactual telemetry. The system supports multi-tenant zero-trust settings via remote attestation and per-tenant capability bounds, and spans use cases from per-pod traffic shaping to syscall auditing and hot inline transformations. By fusing learned synthesis, formal certification, and fleetwide orchestration, Pallas offers a path to safely program the kernel at incident timescales without sacrificing performance isolation or operator control.
