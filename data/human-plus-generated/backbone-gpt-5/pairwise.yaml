    0: 'Conditional computation—routing, early exits, retrieval—allows models to vary test-time compute per input, yet learning-theoretic analyses typically treat the hypothesis as a fixed network or pay the worst-case capacity of all possible routes. We introduce Compute-Conditional PAC-Bayes (CC-PB), a pathwise generalization framework that augments the hypothesis with a latent computational path Z drawn from a learned routing distribution P(Z|X). CC-PB upper-bounds population risk by empirical loss plus a decomposed complexity: KL over parameters and the expected KL between P(Z|X) and a compute prior Q(Z) that encodes budgets. This yields bounds that (i) scale with average, not worst-case, compute; (ii) remain valid under budget changes at test time via reweighting Q; and (iii) unify mixture-of-experts, early-exit, and retrieval-augmented models by treating expert choices, exit depths, and retrieved indices as Z. We show the path term equals an information usage I(S;Z|X), clarifying when aggressive routing does not overfit, and derive f-divergence corrections for distribution shift in compute policies. The analysis induces a practical training objective coupling empirical loss with a compute-aware PAC-Bayes regularizer, providing principled trade-offs between accuracy and test-time cost while preserving generalization under adaptive inference.'
    1: 'A major problem in the study of large language models is to understand their inherent low-dimensional structure. We introduce an approach to study the low-dimensional structure of language models at a model-agnostic level: as sequential probabilistic models. We first empirically demonstrate that a wide range of modern language models exhibit low-rank structure: in particular, matrices built from the model''s logits for varying sets of prompts and responses have low approximate rank. We then show that this low-rank structure can be leveraged for generation --- in particular, we can generate a response to a target prompt using a linear combination of the model''s outputs on unrelated, or even nonsensical prompts.


      On the theoretical front, we observe that studying the approximate rank of language models in the sense discussed above yields a simple universal abstraction whose theoretical predictions parallel our experiments. We then analyze the representation power of the abstraction and give provable learning guarantees.'
