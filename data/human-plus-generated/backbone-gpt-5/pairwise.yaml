  ideas:
    0: Reasoning over long contexts is essential for large language models. While reinforcement learning (RL) enhances short-context reasoning by inducing "Aha" moments in chain-of-thought, the advanced thinking patterns required for long-context reasoning remain largely unexplored, and high-difficulty RL data are scarce. In this paper, we introduce LoongRL, a data-driven RL method for advanced long-context reasoning. Central to LoongRL is KeyChain, a synthesis approach that transforms short multi-hop QA into high-difficulty long-context tasks by inserting UUID chains that hide the true question among large collections of distracting documents. Solving these tasks requires the model to trace the correct chain step-by-step, identify the true question, retrieve relevant facts and reason over them to answer correctly. RL training on KeyChain data induces an emergent plan–retrieve–reason–recheck reasoning pattern that generalizes far beyond training length, enabling models trained at 16K to effectively solve 128K tasks without prohibitive full-length RL rollout costs.
    1: Foundation models must simultaneously scale context, ground claims in evidence, and accumulate knowledge across sessions, yet current approaches bolt retrieval and memory onto generation as heuristics. We propose Self-Indexing Language Models (SILM), which treat memory and provenance as first-class, learnable behaviors. SILM extends next-token prediction with write tokens that commit compact keys and content hashes for salient spans to a persistent external index, and read tokens that retrieve evidence snippets via approximate nearest neighbor lookup. Retrieved evidence conditions attention as latent variables and surfaces as explicit citations, while a lineage regularizer aligns generated claims with their supporting shards and trains calibrated abstention when support is absent. The index persists across time with privacy-scoped namespaces and bounded retrieval budgets, enabling continual, user-specific knowledge without ballooning context length. By unifying generation, retrieval, and provenance in a single objective, SILM offers a path toward frontier models that remember over long horizons, cite what they know, and know when not to answer.
