    0: Robust 3D hand reconstruction is challenging in egocentric vision due to depth ambiguity, self-occlusion, and complex hand-object interactions. Prior works attempt to mitigate the challenges by scaling up training data or incorporating auxiliary cues, often falling short of effectively handling unseen contexts. In this paper, we introduce EgoHandICL, the first in-context learning (ICL) framework for 3D hand reconstruction that achieves strong semantic alignment, visual consistency, and robustness under challenging egocentric conditions. Specifically, we develop (i) complementary exemplar retrieval strategies guided by vision–language models (VLMs), (ii) an ICL-tailored tokenizer that integrates multimodal context, and (iii) a Masked Autoencoders (MAE)-based architecture trained with 3D hand–guided geometric and perceptual objectives. We further show EgoHandICL's applicability by testing it on real-world egocentric cases and integrating it with EgoVLMs to enhance their hand–object interaction reasoning.
    1: Multimodal models often homogenize heterogeneous signals into a single embedding, discarding the physical structure and temporal sparsity critical for reasoning and controllable generation across vision, audio, language, haptics, and biosignals. We propose PET-LM, a typed event language that represents raw sensory streams as discrete Physical Event Tokens—onsets, edges, contacts, and periodicities—endowed with attributes for time, location, frequency, and uncertainty in a shared continuous-time coordinate frame. Lightweight, differentiable parsers transform each modality into PET streams; a unified event language model performs prediction, alignment, and planning over these typed sequences; and modality-specific compilers render events back to waveforms, images, or text. Training combines masked event modeling, cycle-consistent any-to-any translation, and learnable time-warp operators to reconcile asynchronous or weakly paired data. Natural language interleaves with events as first-class tokens, enabling compositional queries and edits that bind verbal instructions to physical structure. By elevating events—not pixels or spectrogram bins—to the unit of computation, PET-LM enables interpretable cross-modal retrieval and grounding, text-guided audio-visual editing, sensorimotor summarization, and any-to-any generation, charting a scalable path toward controllable multimodal intelligence.
