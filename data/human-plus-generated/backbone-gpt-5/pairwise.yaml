    0: Approximate Bayesian inference underpins modern probabilistic modeling but often yields miscalibrated predictive uncertainty, particularly under distribution shift and in the tails. We present Conformal Posterior Transport (CPT), a drop-in calibration layer that wraps any approximate posterior predictive with finite-sample coverage guarantees while preserving as much Bayesian structure as possible. CPT parameterizes an x-conditional, monotone map on the unit interval—and its multivariate copula generalization—that transports the cumulative probabilities of the base predictive into calibrated probabilities. The map is fitted via a differentiable, distribution-free conformal objective derived from amortized split conformal prediction, implemented with a Lagrangian that enforces coverage constraints over user-specified covariate slices while penalizing deviation from the base predictive via an f-divergence. A convex dual formulation yields stable training and a certificate of guaranteed miscoverage control for any sample size, with optional importance weighting to address covariate shift. CPT turns black-box approximate posteriors into calibrated predictive distributions and predictive sets without retraining the underlying model, affords interpretable uncertainty budgets across aleatoric and epistemic components, and integrates seamlessly with VI, SMC, and MCMC pipelines.
    1: Amortized simulator-based inference offers a powerful framework for tackling Bayesian inference in computational fields such as engineering or neuroscience, increasingly leveraging modern generative methods like diffusion models to map observed data to model parameters or future predictions. These approaches yield posterior or posterior-predictive samples for new datasets without requiring further simulator calls after training on simulated parameter-data pairs. However, their applicability is often limited by the prior distribution(s) used to generate model parameters during this training phase. To overcome this constraint, we introduce *PriorGuide*, a technique specifically designed for diffusion-based amortized inference methods. PriorGuide leverages a novel guidance approximation that enables flexible adaptation of the trained diffusion model to new priors at test time, crucially without costly retraining. This allows users to readily incorporate updated information or expert knowledge post-training, enhancing the versatility of pre-trained inference models.
