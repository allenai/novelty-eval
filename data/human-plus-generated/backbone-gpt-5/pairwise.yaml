    0: Next token prediction has been the standard training objective used in large language model pretraining. Representations are learned as a result of optimizing for token-level perplexity. We propose Continuous Concept Mixing (CoCoMix), a novel pretraining framework that combines discrete next token prediction with continuous concepts. Specifically, CoCoMix predicts "continuous concepts" learned from a pretrained sparse autoencoder and mixes them into the model's hidden state by interleaving with token hidden representations. We find that combining both concept learning and interleaving in an end-to-end framework is critical to performance gains. Furthermore, CoCoMix enhances interpretability and steerability by allowing direct inspection and modification of the predicted concept, offering a transparent way to guide the model's internal reasoning process.
    1: Foundation models must satisfy heterogeneous and evolving norms across regulators, enterprises, and end users, yet current alignment pipelines hard-code a single compromise via finetuning. We introduce Parley, an inference-time bargaining layer that composes multiple stakeholder preference modules for frontier models without modifying base weights. Each module is a lightweight adapter or learned energy head that scores partial generations against a stakeholder’s objectives and constraints. At each decoding step, Parley solves a small convex program to select mixture weights and a feasible next-token distribution that enforces hard safety and policy constraints while maximizing a Nash-style social welfare relative to the base model. The resulting dual variables act as an auditable normative trace, attributing which principles governed each decision. Modules are retrieved and activated by context (e.g., jurisdictional policy text) and can be added, swapped, or revoked on demand. Parley reframes alignment as a transparent, negotiable, and composable interface for foundation models across modalities.
