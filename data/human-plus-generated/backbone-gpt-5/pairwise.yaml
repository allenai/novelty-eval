  ideas:
    0: Interventional causal discovery seeks to identify causal relations by leveraging distributional changes introduced by interventions, even in the presence of latent confounders. Beyond the spurious dependencies induced by latent confounders, we highlight a common yet often overlooked challenge in the problem due to post-treatment selection, in which samples are selectively included in datasets after interventions. This fundamental challenge widely exists in biological studies; for example, in gene expression analysis, both observational and interventional samples are retained only if they meet quality control criteria (e.g., highly active cells). Neglecting post-treatment selection may introduce spurious dependencies and distributional changes under interventions, which can mimic causal responses, thereby distorting causal discovery results and challenging existing causal formulations. To address this, we introduce a novel causal formulation that explicitly models post-treatment selection and reveals how its differential reactions to interventions can distinguish causal relations from selection patterns, allowing us to go beyond traditional equivalence classes toward the underlying true causal structure. We then characterize its Markov properties and propose a $\mathcal{F}$ine-grained $\mathcal{I}$nterventional equivalence class, named $\mathcal{FI}$-Markov equivalence, represented by a new graphical diagram, $\mathcal{F}$-PAG. Finally, we develop a provably sound and complete algorithm, $\mathcal{F}$-FCI, to identify causal relations, latent confounders, and post-treatment selection up to $\mathcal{FI}$-Markov equivalence, using both observational and interventional data.
    1: We introduce Identification-Directed Active Experimentation (IDeA), a proof-guided framework for planning interventions that make a target causal query identifiable under budget, safety, and observability constraints. Instead of recovering full structure or committing to point estimates, IDeA treats experimental design as a search over identification proofs, navigating a lattice of do-calculus transformations augmented with measurement and intervention operators. The method maintains an equivalence class of admissible causal models and optimizes worst-case identifiability, yielding robust plans that cross the query’s identification frontier with minimal cost. A symbolic–numeric loop interleaves proof construction, uncertainty propagation over structural and functional variability, and action selection via a cost-sensitive policy that proposes measurements, soft or hard interventions, and instrumentation. IDeA outputs both an executable experimental script and a verifiable proof certificate establishing identifiability given the planned actions, and extends seamlessly to counterfactual queries by composing identification steps across nested interventions. This reframes causal reasoning as certified query planning, aligning discovery with practical decision-making in resource-constrained scientific workflows.
