    0: Multi-Agent System (MAS) powered by Visual Language Models (VLMs) enables challenging tasks but suffers from a novel failure term, multi-agent visual hallucination snowballing, where hallucinations are seeded in a single agent and amplified by following ones due to the over-reliance on textual flow to relay visual information. Through turn-, layer-, and token-wise attention analyses, we provide detailed insights into the essence of hallucination snowballing regarding the reduction of visual attention allocation. It leads us to identify a subset of vision tokens with a unimodal attention peak in middle layers that best preserve visual evidence but gradually diminish in deeper agent turns, resulting in the visual hallucination snowballing in MAS. Thus, we propose ViF, a lightweight, model-agnostic mitigation paradigm that relays inter-agent messages with Visual Flow powered by the selected visual relay tokens and applies attention reallocation to amplify this pattern.
    1: 'Frontier language models are typically static at inference, forcing a single set of weights to satisfy heterogeneous domain, tool-use, and policy constraints. We present Ephemeral Low-Rank Alignment (ELRA), a resettable, inference-time adaptation layer that performs a brief inner-loop optimization guided by verifiers rather than by ground-truth supervision. ELRA injects small low-rank adapters at selected transformer blocks and updates only these fast weights during generation to maximize a composite objective that includes differentiable surrogates for factuality, safety, style, and tool-grounded checks (e.g., unit tests, schema validation). The procedure alternates propose–verify–adapt steps: the model samples candidate thoughts or actions, external verifiers score them, and a bilevel controller optimizes the adapters under a compute budget using unbiased gradient estimators and Lagrangian penalties for constraint satisfaction. Adapters are discarded at the end of the session, preventing drift while enabling strong, context-specific behavior, and an auditable trace of verifier constraints serves as a compliance certificate. ELRA turns decoding into controlled policy improvement without permanent weight changes, offering a practical path to on-demand capability specialization, safer tool orchestration, and robust performance under distribution shift.'
