    0: End-to-end backpropagation requires storing activations throughout all layers, creating memory bottlenecks that limit model scalability. Existing block-wise training methods offer means to alleviate this problem, but they rely on ad-hoc local objectives and remain largely unexplored beyond classification tasks. We propose $\textit{DiffusionBlocks}$, a principled framework for transforming transformer-based networks into genuinely independent trainable blocks that maintain competitive performance with end-to-end training. Our key insight leverages the fact that residual connections naturally correspond to updates in a dynamical system. With minimal modifications to this system, we can convert the updates to those of a denoising process, where each block can be learned independently by leveraging the score matching objective. This independence enables training with gradients for only one block at a time, thereby reducing memory requirements in proportion to the number of blocks. DiffusionBlocks provides a theoretically grounded approach to scalable block-wise training that is applicable to a range of transformer architectures (vision, diffusion, autoregressive, recurrent-depth, and masked diffusion) and extends beyond small-scale classification to modern generative tasks across diverse architectures.
    1: Pretrained generative models excel at fidelity but remain hard to align with soft constraints, evolving preferences, and safety rules without expensive finetuning or task-specific classifiers. We introduce Preference-Driven Energy Guidance (PEG), a plug-and-play alignment layer that learns an energy functional from pairwise feedback and constraint specifications and injects it into the sampling dynamics of arbitrary generators. PEG represents the energy in a Stein reproducing-kernel space, enabling direct gradients with respect to inputs and composition across constraints. A primal–dual objective fits the energy to match user preferences while enforcing distributional moments and rule satisfiability, yielding a reusable control field that is independent of the base model. At inference, PEG steers diffusion samplers by augmenting scores with −∇xE(x), applies proximal token updates during autoregressive decoding via local surrogates of E, and reweights flow/VAE densities through lightweight MCMC. The induced stationary distribution solves a constrained maximum-entropy problem, providing a principled target for alignment. PEG supports on-the-fly updates, additive composition of multiple desiderata, and cross-model portability, enabling unified personalization, safety shaping, and style control for images, text, and audio without retraining core generators.
