  ideas:
    0: 'We propose MoNA (Mixture-of-Normative-Agreements), a polycentric alignment framework that integrates fairness, safety, privacy, and societal considerations by decoupling value learning from global homogenization. MoNA learns a library of constitutional clauses—concise, community-authored normative statements with differentiable critics—via federated, differentially private preference learning that aggregates across stakeholders without centralizing raw data. A contextual router then composes clauses into a deployment-specific mixture, guided by user consent, jurisdictional metadata, and policy cards, while a constrained decoder enforces safety floors and fairness-aware limits through controllable barrier terms. To support accountability, each model output is accompanied by a cryptographically signed norm certificate: a machine-checkable record of which clauses were active, their mixture weights, the privacy budget consumed, and the safety/fairness constraints that shaped decoding. MoNA supports protected-attribute-agnostic fairness by optimizing distributionally robust surrogates that avoid attribute disclosure. The result is an alignment paradigm that preserves pluralism, respects privacy, and renders trade-offs legible to auditors and users, enabling adaptive, jurisdiction-aware behavior without erasing minority norms or weakening safety guarantees.'
    1: Machine unlearning seeks to efficiently remove the influence of selected data while preserving generalization. Significant progress has been made in low dimensions, where the dimension of the parameter $p$ is much smaller than the sample size $n$, but high dimensions, including proportional regimes $p \sim n$, pose serious theoretical challenges as standard optimization assumptions of $\Omega(1)$ strong convexity and $O(1)$ smoothness of the per-example loss $f$ rarely hold simultaneously in proportional regimes $p\sim n$. In this work, we introduce $\varepsilon$-Gaussian certifiability, a canonical and robust notion well-suited to high-dimensional regimes, that optimally captures a broad class of noise adding mechanisms. Then we theoretically analyze the performance of a widely used unlearning algorithm based on one step of the Newton method in the high-dimensional setting described above. Our analysis shows that a single Newton step, followed by a well-calibrated Gaussian noise, is sufficient to achieve both privacy and accuracy in this setting.
