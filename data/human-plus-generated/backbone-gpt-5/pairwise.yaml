    0: We introduce CertiFlow, a primal–dual framework for constraint-satisfying generation that equips diffusion and flow models with verifiable control. CertiFlow treats guidance as a time-varying constrained objective, coupling a pretrained score with an amortized dual network that predicts Lagrange multipliers along the generative trajectory. The sampler integrates a primal–dual dynamical system whose drift combines the score field with composable constraint energies over algebraic, geometric, or logical specifications; non-differentiable rules are handled via learned differentiable projections derived from Fenchel–Young surrogates. At each step, the model emits a lightweight certificate—bounds on primal infeasibility and KKT residuals—that travel with the sample and enable acceptance, rejection, or post-hoc repair. A distribution-preservation regularizer constrains guidance to a trust region around the base model, mitigating mode pruning. CertiFlow turns constraints into plug-and-play modules, supports zero-shot composition of new rules at inference, and provides an anytime knob trading sample quality, constraint tightness, and compute. This design brings generative modeling closer to safety- and science-aware deployment by making control explicit, modular, and certifiable.
    1: Recent image editing models have achieved impressive results while following natural language editing instructions, but they rely on supervised fine-tuning with large datasets of input-target pairs. This is a critical bottleneck, as such naturally occurring pairs are hard to curate at scale. Current workarounds use synthetic training pairs that leverage the zero-shot capabilities of existing models. However, this can propagate and magnify the artifacts of the pretrained model into the final trained model. In this work, we present a new training paradigm that eliminates the need for paired data entirely. Our approach directly optimizes a few-step diffusion model by unrolling it during training and leveraging feedback from vision-language models (VLMs). For each input and editing instruction, the VLM evaluates if an edit follows the instruction and preserves unchanged content, providing direct gradients for end-to-end optimization. To ensure visual fidelity, we incorporate distribution matching loss (DMD), which constrains generated images to remain within the image manifold learned by pretrained models.
