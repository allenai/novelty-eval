  ideas:
    0: Foundation models are increasingly deployed in regulated, high-stakes settings where behavior must satisfy explicit, auditable policies without retraining. We introduce DualGuard, a plug-in decoding layer that converts natural-language policy cards into convex constraints on next-token distributions. Policies are compiled by a small auxiliary model into linear probes over the base model’s hidden states, producing semantic indicators (e.g., PII exposure, medical claims, trading advice) whose expected values define constraints. At each generation step, DualGuard computes the KL-minimizing I-projection of the base distribution onto the feasible set via an online primal–dual update, yielding closed-form logit shifts that guarantee adherence while minimally distorting utility. The mechanism composes multi-stakeholder rules, maintains stateful “budgets” across turns, and emits compliance receipts (active constraints and dual variables) for transparent governance and negotiation. When policies are inactive, the layer is identity; when rules conflict, priced slack variables enable controlled trade-offs. DualGuard unifies steered, constrained, and constitutional decoding under a single, theoretically grounded framework, enabling post-hoc, auditable control of frontier models for safety, privacy, and domain-specific protocol enforcement, without fine-tuning or access to gradients.
    1: Large language models (LLMs) have demonstrated remarkable capabilities in chain of thought (CoT) reasoning. However, the current LLM reasoning paradigm initiates thinking only after the entire input is available, which introduces unnecessary latency and weakens attention to earlier information in dynamic scenarios. Inspired by human cognition of thinking while reading, we first design a **streaming thinking** paradigm for LLMs, where reasoning unfolds in the order of input and further adjusts its depth once reading is complete. We instantiate this paradigm with *StreamingThinker*, a framework that enables LLMs to think while reading through the integration of streaming CoT generation, streaming-constraint training, and streaming parallel inference. Specifically, StreamingThinker employs streaming reasoning units with quality control for CoT generation, enforces order-preserving reasoning through streaming attention masks and position encoding, and leverages parallel KV caches that decouple input encoding from reasoning generation, thereby ensuring alignment and enabling true concurrency.
