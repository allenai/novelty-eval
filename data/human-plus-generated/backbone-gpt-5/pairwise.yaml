  ideas:
    0: 'LLMs hallucinate, yet some confabulations can have social affordances if carefully bounded. We propose critical confabulation (inspired by critical fabulation from literary and social theory), the use of LLM hallucinations to "fill-in-the-gap'''' for omissions in archives due to social and political inequality, and reconstruct divergent yet evidence-bound narratives for history''s ``hidden figures''''. We simulate these gaps with an open-ended narrative cloze task: asking LLMs to generate a masked event in a character-centric timeline sourced from a novel corpus of unpublished texts. We investigate fully-open models and open-weight and proprietary models under a range of prompts designed to elicit controlled and useful hallucinations. Our findings validate LLMs'' foundational narrative understanding capabilities to perform critical confabulation, and show how controlled and well-specified hallucinations can support LLM applications for knowledge production without collapsing speculation into a lack of historical accuracy and fidelity.'
    1: 'Aligning foundation models demands simultaneous guarantees for safety, fairness, and privacy under diverse societal norms. We propose Societal Constraint Projection (SCP), a model-agnostic constrained decoding framework that treats alignment as probabilistic inference under compositional specifications. SCP introduces a declarative constraint language that unifies hard and soft requirements over toxicity, demographic parity, and personal data exposure, organized by a priority lattice to reflect jurisdictional and community preferences. At generation time, SCP performs entropic projections of the token distribution via online dual descent, producing certificates: calibrated risk bounds for harmful content, distributional parity guarantees across protected attributes, and privacy budgets tracked through Renyi-DP accounting and semantic redaction. A differentially private preference aggregator maps heterogeneous human feedback into constraint weights, exposing normative uncertainty as adjustable slack rather than hidden bias. When constraints conflict, SCP computes minimal-violation solutions and emits natural-language rationales describing the trade-offs. The framework composes across tools and modalities, supports scenario-conditioned policies without retraining, and offers a pathway for civic oversight by allowing communities to publish auditable alignment specifications that models must satisfy at inference.'
