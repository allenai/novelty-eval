    0: Learning systems increasingly hinge on curating the right data, yet the field lacks a benchmark with ground-truth about which training examples causally drive particular predictions. We introduce TRACE-Bench, a suite of instrumented datasets and a standardized protocol for evaluating training-example influence, data attribution, and dataset debugging. TRACE-Bench constructs tasks in which small ‘teaching sets’ are algorithmically synthesized to exert certified control over model behavior on a hidden audit distribution. By layering programmatic interventions onto real text, image, and tabular corpora—spurious cue implants, counter-spurious exemplars, minimal contradiction sets, and weak/strong annotator mixtures—TRACE-Bench yields unambiguous targets for influence retrieval while preserving realistic data complexity. The benchmark supports white-box and black-box settings, integrates with common training pipelines, and reports retrieval, localization, and ranking-stability measures across versioned replicates. A governance layer records data provenance and contamination checks to facilitate reproducibility and responsible use. TRACE-Bench enables rigorous, comparable assessment of methods for influence functions, datamodels, data valuation, deduplication, and active curation, shifting evaluation from downstream accuracy to causal accountability at the example level.
    1: Recent advancements in multimodal slow-thinking systems have demonstrated remarkable performance across various visual reasoning tasks. However, their capabilities in text-rich image reasoning tasks remain understudied due to the absence of a dedicated and systematic benchmark. To address this gap, we propose OCR-Reasoning, a novel benchmark designed to systematically assess Multimodal Large Language Models on text-rich image reasoning tasks. Specifically, OCR-Reasoning comprises 1,069 human-annotated examples spanning 6 core reasoning abilities and 18 practical reasoning tasks in text-rich visual scenarios. Unlike existing text-rich image understanding benchmarks that only provide a final answer, this benchmark additionally provides a detailed step-by-step reasoning process. This dual annotation enables the evaluation of both the models' final answers and their reasoning processes, thereby offering a holistic assessment of text-rich reasoning capabilities.
