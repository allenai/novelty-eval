    0: Frontier models operate across jurisdictions and contexts where norms, laws, and risk tolerances diverge, yet current alignment methods entangle these choices with core competence. We introduce Jurisformer, a governance architecture that factors normative behavior into a low-dimensional, composable subspace within a frozen foundation model. Jurisformer learns a set of orthogonal policy vectors via constrained preference optimization that isolates normative gradients from task ability. Training leverages multi-constitution preference pairs and interventional counterfactuals to span the policy basis and enforce orthogonality. At inference, a cryptographically attested router selects or blends vectors based on deployment policy, locale, and user intent, while a differentiable temporal-logic critic shapes long-horizon generation to satisfy procedural constraints. A Pareto-preservation objective regularizes updates to remain in the normative subspace, minimizing interference with knowledge. The model emits a policy trace that certifies which vectors were active, supporting audit, rollback, and reproducibility. By reframing alignment as subspace composition rather than a single setting, Jurisformer enables one model to instantiate many lawful, culture-aware personas without retraining, and provides a path toward verifiable, context-dependent behavior in frontier systems.
    1: 'Vision-Language Models (VLMs) enable powerful multi-agent systems, but scaling them is economically unsustainable: coordinating heterogeneous agents under information asymmetry often spirals costs. Existing paradigms, such as Mixture-of-Agents and knowledge-based routers, rely on heuristic proxies that ignore costs and collapse uncertainty structure, leading to provably suboptimal coordination.

      We introduce Agora, a framework that reframes coordination as a decentralized market for uncertainty. Agora formalizes epistemic uncertainty into a structured, tradable asset (perceptual, semantic, inferential), and enforces profitability-driven trading among agents based on rational economic rules. A market-aware broker, extending Thompson Sampling, initiates collaboration and guides the system toward cost-efficient equilibria. Agora establishes market-based coordination as a principled and scalable paradigm for building economically viable multi-agent visual intelligence systems.'
