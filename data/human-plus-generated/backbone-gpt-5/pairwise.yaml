    0: 'We introduce Retrieval-Augmented Policy Optimization (RAPO), a framework that equips an RL agent with a differentiable, queryable library of policy fragments for rapid adaptation and long-horizon decision making. RAPO stores temporally extended behaviors as key–value entries annotated by context embeddings and effect signatures. At decision time, a retriever conditions on the agent’s belief state to select a small set of fragments; a composer aggregates their action distributions with attention, yielding a composite policy over a chosen commit horizon. We learn retrieval and composition jointly with the actor–critic objective while assigning credit to retrieved fragments through counterfactual substitution: stochastic routing perturbs retrieval choices and estimates their marginal contribution to return. A compression stage distills the composite policy back into the base network, enabling continual accumulation of skills and mitigating catastrophic forgetting, while a budgeted memory manager merges redundant fragments via outcome-aware clustering. RAPO unifies hierarchical RL, episodic control, and policy distillation in a single, end-to-end trainable agent, supporting fast skill reuse, interpretable behavior libraries, and robustness to nonstationary task distributions without task identifiers.'
