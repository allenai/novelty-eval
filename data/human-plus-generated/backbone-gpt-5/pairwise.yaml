    0: 'Composable control in generative models remains elusive: gradient-based guidance often collapses under attribute accumulation, cannot express hard constraints, and fails to integrate black-box simulators. We introduce Equilibrium Compositional Diffusion, an inference framework that coordinates heterogeneous generative experts through a consensus optimization mechanism embedded in the denoising process. At each noise level, the method maintains per-expert latent copies—covering semantic prompts, geometric priors, physics, safety filters, or symbolic verifiers—updates them via expert-specific scores or proximal operators, then enforces agreement with an augmented-Lagrangian consensus step that preserves the diffusion schedule. This constructs an implicit product-of-experts sampler over priors and constraints, supports zero-shot addition of new experts, and avoids gradient interference intrinsic to additive guidance. A variational perspective connects fixed points to minima of a composite free energy along the diffusion path, unifying learned scores with projections and non-differentiable checks. We outline instantiations for text-to-image synthesis with safety and layout priors, molecular generation under synthesizability constraints, and time-series forecasting with physics, enabling modular, auditable, and controllable generation without retraining.'
    1: Diffusion-based generative models have reformed generative AI, and have enabled new capabilities in the science domain, for example, generating 3D structures of molecules. Due to the intrinsic problem structure of certain tasks, there is often a symmetry in the system, which identifies objects that can be converted by a group action as equivalent, hence the target distribution is essentially defined on the quotient space with respect to the group. In this work, we establish a formal framework for diffusion modeling on a general quotient space, and apply it to molecular structure generation which follows the special Euclidean group SE(3) symmetry. The framework reduces the necessity of learning the component corresponding to the group action, hence simplifies learning difficulty over conventional group-equivariant diffusion models, and the sampler guarantees recovering the target distribution, while heuristic alignment strategies lack proper samplers.
