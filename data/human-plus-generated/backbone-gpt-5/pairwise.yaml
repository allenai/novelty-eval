  ideas:
    0: 'Representation learning objectives implicitly choose an equivalence relation on data: augmentations induce coarse invariances, labels impose fine partitions, and partial supervision mixes both. We introduce QuIRL, a unified framework that learns the quotient map of the data manifold while preserving controllable residual detail. QuIRL builds a dynamic equivalence graph whose edges come from augmentations, neighborhood discovery, and labels; an encoder is trained to be constant on connected components via set-based contrastive potentials, while a complementary residual coder preserves information orthogonal to the quotient through a mutual-information budget. Per-example dual variables govern a homotopy between unsupervised and supervised constraints, turning scarce labels into soft edges that gradually refine components rather than overwrite them. This yields a single model that operates across unsupervised, self-supervised, semi-supervised, and supervised regimes, supports continual arrival of labels without catastrophic forgetting, and exposes a test-time invariance knob to trade robustness for granularity. The formulation connects contrastive, clustering, and cross-entropy training as instances of constrained quotient learning, enabling principled objective routing under label and compute budgets. QuIRL provides a path to representations that are simultaneously transferable, label-efficient, and calibration-friendly across tasks and domains.'
    1: Neural networks necessitate nonlinearities to achieve universal approximability. Traditional activation functions introduce nonlinearities through rigid feature rectifications. Recent self-gated variants improve traditional methods in fitting flexibility by incorporating learnable content-aware factors and non-local dependencies, enabling dynamic adjustments to activation curves via adaptive translation and scaling. While SOTA approaches achieve notable gains in conventional CNN layers, they struggle to enhance Transformer layers, where fine-grained context is inherently modeled, severely reducing the effectiveness of non-local dependencies leveraged in activation processes. We refer to this critical yet unexplored challenge as the **non-local tension** of activation. Drawing on a decision-making perspective, we systematically analyze the origins of the non-local tension problem and explore the initial solution to foster a more discriminative and generalizable neural activation methodology. This is achieved by rethinking how non-local cues are encoded and transformed into adaptive scaling coefficients, which in turn recalibrate the contributions of features to filter updates through neural activation. Grounded in these insights, we present **FleS**, a novel self-gated activation model for discriminative pattern recognition.
