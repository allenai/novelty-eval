  ideas:
    0: 'We introduce Tau-Equivariant Neural Dynamics (TauED), a framework for learning continuous-time models that are provably consistent under monotone reparameterizations of time. Observed processes are modeled as compositions of a shared latent dynamics evolving in intrinsic time and a per-trajectory monotone time-change realized by a neural flow. The latent dynamics are captured by a Neural Controlled/Stochastic Differential Equation, while the warp is inferred amortizedly from the path. Training enforces time-change equivariance through three ingredients: a signature-based contrast that aligns re-timed views using path-signature invariants, a cycle-consistency objective that penalizes non-invertible warps, and a geometric regularizer that controls warp complexity. This factorization decouples “what the system does” from “how fast it is observed,” enabling de-warped forecasting, principled alignment across subjects and devices, and counterfactual retiming under novel schedules. TauED handles irregular sampling and missingness natively via control representations, interfaces with interventions by composing piecewise warps, and provides uncertainty through stochastic latent flows. The result is a unified, time-change–robust approach to learning on time series and dynamical systems.'
    1: 'The design of training objective is central to training time-series forecasting models. Existing training objectives such as mean squared error mostly treat each future step as an independent, equally weighted task, which we found leading to the following two issues: (1) overlook the *label autocorrelation effect* among future steps, leading to biased training objective; (2) fail to set *heterogeneous task weights* for different forecasting tasks corresponding to varying future steps, limiting the forecasting performance. To fill this gap, we propose a novel quadratic-form weighted training objective, addressing both of the issues simultaneously. Specifically, the off-diagonal elements of the weighting matrix account for the label autocorrelation effect, whereas the non-uniform diagonals are expected to match the most preferable weights of the forecasting tasks with varying future steps. To achieve this, we propose a Quadratic Direct Forecast (QDF) learning algorithm, which trains the forecast model using the adaptively updated quadratic-form weighting matrix.'
