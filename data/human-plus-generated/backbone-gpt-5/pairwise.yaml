  ideas:
    0: Sparse autoencoders (SAEs) have recently emerged as a powerful tool for interpreting the features learned by large language models (LLMs). By reconstructing features with sparsely activated networks, SAEs aim to recover complex superposed polysemantic features into interpretable monosemantic ones. Despite their wide applications, it remains unclear under what conditions SAEs can fully recover the ground truth monosemantic features from the superposed polysemantic ones. In this paper, we provide the first theoretical analysis with a closed-form solution for SAEs, revealing that they generally fail to fully recover the ground truth monosemantic features unless the ground truth features are extremely sparse. To improve the feature recovery of SAEs in general cases, we propose a reweighting strategy targeting at enhancing the reconstruction of the ground truth monosemantic features instead of the observed polysemantic ones. We further establish a theoretical weight selection principle for our proposed weighted SAE (WSAE).
    1: 'We present SPICE: Sparse Path Interventional Circuit Explanations, a framework that turns model explanations into executable programs over a network’s computation graph. SPICE formulates explanation as interventional mediation: find a minimal set of internal edges and their values such that surgically patching them reproduces a specified counterfactual behavior. A bilevel objective jointly selects edges and interventions to trade faithfulness, sparsity, and robustness, solved via continuous relaxations for discrete path selection, proximal sparsification, and constraints that enforce interventional consistency across perturbation families. The resulting “path programs” compile into recipes for model editing and auditing—swap, clamp, or compose mediators to enact what-if predictions—while a concept linker aligns discovered mediators with natural-language or knowledge-graph concepts without retraining the base model. We provide conditions under which SPICE is sound under local linearizations and show how compositionality across paths yields concise circuit schemas with stability guarantees to nuisance variation. SPICE unifies attribution, activation patching, and causal abstraction, producing human-interpretable, testable, and actionable explanations for both discriminative and generative architectures.'
