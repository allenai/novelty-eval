    0: Deep research has revolutionized data analysis, yet data scientists still devote substantial time to manually crafting visualizations, highlighting the need for robust automation from natural language queries. However, current systems struggle with complex datasets containing multiple files and iterative refinement. Existing approaches, including simple single- or multi-agent systems, often oversimplify the task, focusing on initial query parsing while failing to robustly manage data complexity, code errors, or final visualization quality. In this paper, we reframe this challenge as a collaborative multi-agent problem. We introduce CoDA, a multi-agent system that employs specialized LLM agents for metadata analysis, task planning, code generation, and self-reflection. We formalize this pipeline, demonstrating how metadata-focused analysis bypasses token limits and quality-driven refinement ensures robustness. This work demonstrates that the future of visualization automation lies not in isolated code generation but in integrated, collaborative agentic workflows.
    1: 'Foundation models are deployed across jurisdictions and applications where policies, safety rules, and formatting conventions change faster than models can be retrained. We propose ConSpec, a plug-and-play interface that compiles natural-language constitutions into inference-time constraints for autoregressive decoders. ConSpec aggregates heterogeneous monitors—grammars, rule checkers, lightweight classifiers, and retrieval-based critics—that estimate violation risk from a partial prefix. At each token step, a fast primal–dual update computes minimal logit adjustments that satisfy the active constraints while staying close to the base model under a KL budget, yielding composable, auditable control without touching weights. The framework supports priority schemes, soft-to-hard constraint escalation, and counterfactual lookahead that predicts near-term breaches before they occur. A speculative path accepts unconstrained tokens when all monitors are silent, amortizing overhead on benign prefixes. ConSpec treats alignment as an externalizable layer: policies can be swapped, combined, or time-scoped without re-finetuning, and the system emits structured traces of which constraints shaped each token. This separation-of-powers enables capability-preserving governance for frontier models, bridging brittle prompt engineering and expensive RLHF with a general, model-agnostic decoding substrate.'
