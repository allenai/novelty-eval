  ideas:
    0: Existing causal discovery methods are fundamentally limited by the assumption of a static causal graph, a constraint that fails in real-world systems where causal relationships dynamically vary with underlying system parameters. This discrepancy prevents the application of causal discovery in critical domains such as industrial process control, where understanding how causal effects change is essential. We address this gap by proposing a new paradigm that moves beyond static graphs to learn functional causal representations. We introduce a framework that models each causal link not as a static weight but as a function of measurable system parameters. By representing these functions using Polynomial Chaos Expansions (PCE), we develop a tractable method to learn the complete parametric causal structure from observational data. We provide theoretical proofs for the identifiability of these functional models and introduce a novel, provably convergent learning algorithm that provides an interpretable model of how causal mechanisms evolve.
    1: We introduce Query-Directed Causal Design (QDC), a framework that treats causal reasoning as goal-conditioned experiment design. Rather than discovering a complete causal graph, QDC seeks the minimal set of targeted interventions needed to identify a specific causal query or to certify that the query is not identifiable under a given budget. QDC maintains an ambiguity set of graphs consistent with observational and interventional evidence and employs a differentiable reduction engine that compiles do-calculus and transport rules into program traces. When a query is identifiable, the engine returns a proof-like certificate mapping available distributions to the target functional; otherwise, it emits localized obstruction witnesses that explain why identifiability fails. A planner then selects interventions that maximally eliminate these obstructions, guided by a learned surrogate for certificate gain and constrained by experimental cost. The loop yields both an interventional plan and a verifiable proof trace, enabling actionable answers or principled non-identifiability. By focusing effort on query-relevant structure, QDC unifies causal inference, active learning, and symbolic reasoning, providing a practical path to cost-efficient causal decision making in domains where interventions are scarce, risky, or sequential.
