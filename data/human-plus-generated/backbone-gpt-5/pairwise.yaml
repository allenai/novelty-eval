    0: We introduce SupRA (Supervision as Relational Algebra), a unified framework that treats heterogeneous supervision signals—labels, augmentations, pairwise constraints, rankings, group tags, and domain indicators—as typed relations over instances and attributes. SupRA compiles these signals into a supervision graph and optimizes a typed energy that contracts or separates embeddings according to relation semantics, recovering cross-entropy and InfoNCE as limiting cases. To avoid over-collapsing and negative transfer when signals conflict, the representation is partitioned into learnable subspaces routed by a lightweight gating network, while invariance budgets enforced via dual variables regulate how strongly each relation may shape each subspace. An online scheduler adapts the active mix of relation types per batch to satisfy budgets and maximize a proxy of downstream utility, enabling smooth transitions from unsupervised to semi- and fully supervised regimes as annotations arrive. New constraints can be appended during training or at inference by adding potentials and updating gates, without retraining from scratch. SupRA offers a principled, modular path to fuse diverse supervision while preserving generality, yielding a single, adaptable recipe for unsupervised, self-supervised, semi-supervised, and supervised representation learning.
    1: 'Multi-view clustering integrates the consistency and complementarity of different views to achieve unsupervised data grouping. Existing multi-view clustering methods primarily confront two challenges: i) they generally perform feature extraction in the feature domain, which is sensitive to noise and may neglect cluster-specific information that is indistinguishable in the original space; ii) current dynamic fusion methods adopt static strategies to learn weights, lacking capability to adjust strategies adaptively under complex scenarios according to variations in data distribution and view quality. To address these issues, we propose a large language model assisted dynamic agent for multi-view clustering (LLM-DAMVC), a novel framework that recasts multi-view clustering as a dynamic decision-making problem orchestrated by a large language model. Specifically, each view is equipped with complementary agents dedicated to feature extraction. A dual-domain contrastive module is introduced to optimize feature consistency and enhance cluster separability in both the feature domain and frequency domain. Additionally, an LLM-assisted view fusion mechanism provides a flexible fusion weight learning strategy that can be adaptively applied to complex scenarios and significantly different views.'
