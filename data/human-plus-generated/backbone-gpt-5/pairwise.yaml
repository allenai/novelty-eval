    0: We study function spaces parametrized by neural networks, referred to as neuromanifolds. Specifically, we focus on deep Multi-Layer Perceptrons (MLPs) and Convolutional Neural Networks (CNNs) with an activation function that is a sufficiently generic polynomial. First, we address the identifiability problem, showing that, for almost all functions in the neuromanifold of an MLP, there exist only finitely many parameter choices yielding that function. For CNNs, the parametrization is generically one-to-one. As a consequence, we compute the dimension of the neuromanifold. Second, we describe singular points of neuromanifolds. We characterize singularities completely for CNNs, and partially for MLPs. In both cases, they arise from sparse subnetworks. For MLPs, we prove that these singularities often correspond to critical points of the mean-squared error loss, which does not hold for CNNs. This provides a geometric explanation of the sparsity bias of MLPs. All of our results leverage tools from algebraic geometry.
    1: 'Modern generalization bounds for deep networks are fragile to reparameterization: layer-wise rescaling and neuron permutations alter norm-based capacities without changing the realized function. We introduce Gauge-PAC, a PAC-Bayesian framework defined on the quotient of parameter space by the symmetry group induced by positive homogeneity and permutations. By disintegrating priors and posteriors along symmetry orbits, the KL divergence splits into an intrinsic part and an orbit-entropy that cancels redundant complexity, yielding reparameterization-invariant bounds. For layered positively homogeneous networks we derive an intrinsic path complexity equal to the minimal path norm within an orbit and identify a canonical “balanced” representative as the minimizer of a convex rescaling energy. We relate gradient flow with normalization to natural gradient on the quotient, explaining layer balancing as an instance of implicit gauge-fixing. The resulting bounds unify and tighten norm- and margin-based guarantees, remain stable under reparameterizations, and motivate algorithmic surrogates: regularizers approximating the intrinsic KL via log-Jacobians of rescaling maps. Gauge-PAC furnishes a symmetry-aware foundation for analyzing capacity, implicit bias, and early stopping in overparameterized homogeneous models.'
