  ideas:
    0: 'Transfer learning, meta-learning, and lifelong learning all seek sample-efficient adaptation under shifting tasks, yet existing approaches either overfit to the latest task or ossify past knowledge. We introduce Anchored Manifold Meta-Learning (AMML), which meta-learns a task-conditioned hypernetwork whose outputs are constrained to a low-dimensional solution manifold spanned by a sparse set of anchors—latent codes that represent reusable skills. For each incoming task, a small support set is embedded to locate the task on the manifold; adaptation proceeds via trust-region updates along manifold coordinates, guided by uncertainty to avoid negative transfer. The anchor set evolves online by split–merge operations triggered by a minimum-description-length criterion, while a geometry-preserving regularizer keeps the hypernetwork approximately isometric at anchor locations, yielding backward-compatible updates without data replay. A transport-guided prior, derived from a low-rank Fisher subspace shared across anchors, further biases learning toward reusable directions. AMML is exemplar-free and parameter-efficient: only the hypernetwork and compact anchor codes are stored, enabling continual accumulation, recombination, and rapid transfer of skills across nonstationary task streams.'
    1: 'A persistent paradox in continual learning (CL) is that neural networks often retain linearly separable representations of past tasks even when their output predictions fail. We formalize this distinction as the gap between *deep* (feature-space) and *shallow* (classifier-level) forgetting. We reveal a critical asymmetry in Experience Replay: while minimal buffers successfully anchor feature geometry and prevent deep forgetting, mitigating shallow forgetting typically requires substantially larger buffer capacities.

      To explain this, we extend the Neural Collapse framework to the sequential setting. We characterize deep forgetting as a geometric drift toward out-of-distribution subspaces and prove that any non-zero replay fraction asymptotically guarantees the retention of linear separability. Conversely, we identify that the ``strong collapse'''' induced by small buffers leads to rank-deficient covariances and inflated class means, effectively blinding the classifier to true population boundaries. By unifying CL with out-of-distribution detection, our work challenges the prevailing reliance on large buffers, suggesting that explicitly correcting these statistical artifacts could unlock robust performance with minimal replay.'
