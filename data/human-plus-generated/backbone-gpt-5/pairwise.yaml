    0: Squared tensor networks (TNs) and their extension as computational graphs---squared circuits---have been used as expressive distribution estimators, yet supporting closed-form marginalization. However, the squaring operation introduces additional complexity when computing the partition function or marginalizing variables, which hinders their applicability in ML. To solve this issue, canonical forms of TNs are parameterized via unitary matrices to simplify the computation of marginals. However, these canonical forms do not apply to circuits, as they can represent factorizations that do not directly map to a known TN. Inspired by the ideas of orthogonality in canonical forms and determinism in circuits enabling tractable maximization, we show how to parameterize squared circuits to overcome their marginalization overhead. Our parameterizations unlock efficient marginalization even in factorizations different from TNs, but encoded as circuits, whose structure would otherwise make marginalization computationally hard.
    1: Transport maps and diffusion-based posterior samplers promise fast Bayesian inference but sacrifice exactness. We introduce ADAPT (Amortized Debiased Posterior Transport), a framework that turns a learned stochastic flow from prior to posterior into an exact, amortized sampler. ADAPT parameterizes a time-inhomogeneous SDE carrying prior samples along a tempered sequence of posteriors and trains it with a pathwise KL control objective derived from a Feynman–Kac representation. At test time, ADAPT wraps this flow in an independent pseudo-marginal Metropolis–Hastings step whose acceptance ratio uses an unbiased estimator of the intractable proposal density. We construct this estimator via randomized multilevel coupling of discretizations and Girsanov weights, yielding a finite-variance, nonnegative estimate of the Radon–Nikodym derivative. The resulting chain targets the exact posterior while typically requiring only a handful of corrections, preserving the speed of amortized inference and the guarantees of MCMC. We further present an adaptive stopping-time scheme that allocates computation along the tempering path based on local information gain, and discuss conditions for unbiasedness and geometric ergodicity.
