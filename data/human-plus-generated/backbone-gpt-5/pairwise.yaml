  ideas:
    0: 'The paradigm shift in large language models (LLMs) from instinctive responses to chain-of-thought (CoT) reasoning has fueled two prevailing assumptions: (1) reasoning capabilities only emerge in sufficiently large models, and (2) such capabilities require training on massive datasets. While the first assumption has already been challenged by recent sub-billion-parameter reasoning models such as Qwen3-0.6B and DeepSeek distilled variants, the second remains largely unquestioned. In this work, we revisit the necessity of scaling to extremely large corpora (>10T tokens) for reasoning emergence. By carefully curating and resampling open-source datasets that we identify as beneficial under our designed metrics, we demonstrate that strong reasoning abilities can emerge with far less data. Specifically, we show that only ~2T tokens of high-quality data are sufficient, and pre-training with 4.2T tokens on the dataset resampled from these ~2T tokens, followed by an established post-training procedure, enables the development of MobileLLM-R1, a series of sub-billion-parameter reasoning models. To facilitate further research in this direction, we have made the models and code publicly available, along with the complete training recipe, data sources, and data mixing ratios.'
    1: 'Frontier models concentrate diverse capabilities behind a single interface, complicating safety, compliance, and monetization. We introduce Proof-Carrying Prompts (PCP) with Capability-Lattice Adapters (CLAs), a framework for post-training, fine-grained capability control. PCP encodes declarative capability claims and constraints as machine-checkable certificates embedded in the prompt. A compiled policy checker maps certificates to a sequence of token-level routing constraints that gate a library of small, typed adapters (CLAs) attached to a frozen backbone. The runtime enforces capability budgets, tool access, and data transforms by conditioning attention and MLP projections on verified claims; the resulting execution emits an auditable, tamper-evident capability trace. Training separates competence from control: adapters are distilled from tool-augmented traces and mutually disentangled via sparsity and orthogonality regularizers, enabling hot-swappable capability updates without catastrophic interference. PCP+CLA unifies governance and performance: capabilities are activated only when licensed or contextually warranted, while base generality is preserved. The framework offers a path to regulatory-grade deployment of frontier models with programmable guarantees, composable auditing, and minimal retraining.'
