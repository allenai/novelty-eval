    0: 'Embodied AI has developed rapidly in recent years, but it is still mainly deployed in laboratories, with various distortions in the Real-world limiting its application. Traditionally, Image Quality Assessment (IQA) methods are applied to predict human preferences for distorted images; however, there is no IQA method to assess the usability of an image in embodied tasks, namely, the perceptual quality for robots. To provide accurate and reliable quality indicators for future embodied scenarios, we first propose the topic: IQA for Embodied AI. Specifically, we (1) based on the Mertonian system and meta-cognitive theory, constructed a perception-cognition-decision-execution pipeline and defined a comprehensive subjective score collection process; (2) established the Embodied-IQA database, containing over 30k reference/distorted image pairs, with more than 5m fine-grained annotations provided by Vision Language Models/Vision Language Action-models/Real-world robots. We sincerely hope that through this work, we can promote the application of Embodied AI under complex distortions in the Real-world.'
    1: We propose ForgeBench, a compiler and protocol that turns high-level measurement specifications into continually refreshed, contamination-resilient benchmarks with psychometric guarantees. A domain-agnostic DSL encodes constructs, evidence models, allowed sources, and fairness constraints. A constrained generation pipeline uses programmatic transformations and LLM-based item writing to synthesize candidates from license-verified seeds, attach counterfactual decoys, and track end-to-end provenance. An adaptive calibration loop fits multi-rater item response models over a panel of reference systems and humans to estimate item parameters, maintain anchored scales across releases, and assemble individualized test forms that equalize information across capability levels. To deter leakage, held-out content is served via remote attestation, and zero-knowledge proofs certify that submissions were scored on undisclosed items without revealing them. Contamination sentinels and semantic deduplication continuously audit overlap with public corpora. The result is a living benchmark that yields comparable, time-stable scores, surfaces differential item functioning across languages and populations, and shifts community contributions from fixed test sets to transparent measurement design.
