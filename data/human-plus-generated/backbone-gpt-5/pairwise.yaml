    0: Copulas are a fundamental tool for modelling multivariate dependencies in data, forming the method of choice in diverse fields and applications. However, the adoption of existing models for multimodal and high-dimensional dependencies is hindered by restrictive assumptions and poor scaling. In this work, we present methods for modelling copulas based on the principles of diffusions and flows. We design two processes that progressively forget inter-variable dependencies while leaving dimension-wise distributions unaffected, provably defining valid copulas at all times. We show how to obtain copula models by learning to remember the forgotten dependencies from each process, theoretically recovering the true copula at optimality. The first instantiation of our framework focuses on direct density estimation, while the second specialises in expedient sampling. Our work enhances the representational power of copula models, empowering applications and paving the way for their adoption on larger scales and more challenging domains.
    1: 'We introduce BayesBridge, an amortized Schrödinger-bridge framework for Bayesian inference that transports the prior into the posterior using only the likelihood as a terminal potential. BayesBridge parameterizes a pair of observation-conditioned drifts and learns them via a likelihood-guided blend of iterative proportional fitting and flow matching, avoiding target-score supervision and enabling black-box use with simulator-based likelihood ratios. The resulting controlled diffusion concentrates along posterior modes without collapsing prior diversity, yielding calibrated samples in data-poor regimes and sharp updates when evidence is strong. The control cost induces a differentiable estimator of the marginal likelihood and an anytime stopping rule, providing a single objective that unifies variational inference, annealed tempering, and particle transport. The approach is modular: potentials factor across graphical structure, constraints and symmetries are enforced by projecting drifts onto manifold tangents, and components compose for probabilistic programs. A pathwise reparameterization delivers low-variance gradients and principled uncertainty through samples and control-induced risk certificates, offering a scalable, likelihood-only route to posterior sampling and evidence estimation.'
