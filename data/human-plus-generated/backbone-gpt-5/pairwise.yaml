  ideas:
    0: We develop a linear response framework for interpretability that treats a neural network as a Bayesian statistical mechanical system. A small perturbation of the data distribution, for example shifting the Pile toward GitHub or legal text, induces a first-order change in the posterior expectation of an observable localized on a chosen component of the network. The resulting susceptibility can be estimated efficiently with local SGLD samples and factorizes into signed, per-token contributions that serve as attribution scores. We combine these susceptibilities into a response matrix whose low-rank structure separates functional modules such as multigram and induction heads in a 3M-parameter transformer.
    1: 'We introduce Causal Sketches, a framework that turns interpretability into a compression game with tests. An explainer produces an executable, symbolic sketch—a sparse directed program over latent probes and simple transforms—intended to emulate a target network’s behavior. A verifier adversary selects internal do-interventions on activations, parameters, and training examples to maximally stress the sketch. The explainer minimizes interventional regret plus a minimum-description-length penalty, yielding parsimonious, modular hypotheses that must survive counterfactual probing. A differentiable sketch library (linear maps, gates, pooling, low-rank mixers) enables end-to-end optimization and composition into a hierarchical circuit atlas. Active intervention design targets uncertainty to shrink the hypothesis space, while shared subsketches tie together feature attributions, parameter responsibility, and data provenance under one causal budget. The resulting explanations are executable, auditable, and reusable: they forecast counterfactuals, expose failure modes, and furnish handles for principled model edits and safety constraints. Causal Sketches recast explanation faithfulness as interventional predictivity and parsimony, offering a scalable path toward mechanistic understanding of modern networks.'
