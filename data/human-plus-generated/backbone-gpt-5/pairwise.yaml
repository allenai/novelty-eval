  ideas:
    0: The Mixture-of-Experts (MoE) architecture has become a predominant paradigm for scaling large language models (LLMs). Despite offering strong performance and computational efficiency, large MoE-based LLMs like DeepSeek-V3-0324 and Kimi-K2-Instruct present serious challenges due to substantial memory requirements in deployment. While recent works have explored MoE compression to address this issue, existing methods often suffer from considerable accuracy drops even at modest compression rates. This paper introduces a novel Mixture-of-Basis-Experts (MoBE) method that achieves model compression while incurring minimal accuracy drops. Specifically, each up/gate matrix in an expert is decomposed via a rank decomposition as W = AB, where matrix A is unique to each expert. The relatively larger matrix B is further reparameterized as a linear combination of basis matrices {Bi} shared across all experts within a given MoE layer. The factorization is learned by minimizing the reconstruction error relative to the original weight matrices.
    1: We introduce SkillPatches, a paradigm for frontier language models that synthesizes task-specific, revocable low-rank adapters at inference time from auditable blueprints. When faced with a new objective, policy constraint, or domain, the base model emits a structured blueprint in a constrained DSL that specifies where to intervene (layers, heads), how to bias computation (attention routing, feature subspaces), and which guardrails to satisfy. A differentiable synthesizer compiles this blueprint into rank-constrained weight deltas drawn from a learned basis, and a controller schedules their activation conditioned on context, user role, risk signals, and compute budget. Meta-pretraining aligns blueprint tokens with desired behaviors using weak programmatic supervision and preference data, while invariance regularizers preserve the base model’s general knowledge outside patched pathways. Because blueprints are textual and the synthesizer is constrained, capabilities become composable, inspectable, and revocable; governance can be enacted by whitelisting primitives and auditing generated plans; and specialization is delivered ephemerally without permanently increasing model capability. SkillPatches reframes adaptation as just-in-time, policy-conditioned skill assembly, unifying efficiency, controllability, and safety for frontier models.
