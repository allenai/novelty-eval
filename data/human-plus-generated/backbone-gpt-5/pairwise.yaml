    0: '``Learnware = Model + Specification''''. A learnware comprises a submitted model paired with a \emph{specification} sketching its capabilities. For a Learnware Dock System (LDS) which accommodates numerous models, these specifications are essential to enabling users to identify helpful models, eliminating the requirement for prohibitively costly per-model evaluations. Recently, \textbf{Pa}rameter \textbf{Ve}ctor (PAVE) specification, which utilizes the changes in pre-trained model parameters to inherently encode the model capability and task requirements, shows promising capabilities in enabling identifying useful learnwares for high-dimensional, unstructured text data.

