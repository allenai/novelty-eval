  ideas:
    0: 'Most explanations for deep models are descriptive and non-testable: they label features post hoc but cannot be executed to reproduce or change a decision. We introduce Executable Causal Sketches, compact programs that reference a small set of internal “patch points” and human concepts, and that both simulate the model’s prediction and specify counterfactual interventions. An ECS compiles to two artifacts: a forward simulator that reconstructs the output by composing learned concept probes and linearized influence maps, and a controller that enforces desired outcomes by injecting minimal edits at the patch points. Faithfulness is addressed by certificates that bound the discrepancy between the full model and the sketch under bounded input and activation perturbations, obtained via local verification over the Jacobian and sparsity-constrained patching. We learn sketches with a bilevel objective that jointly selects patch points, induces concept probes, and regularizes bidirectional agreement under systematic activation-patching interventions. The result is an editable, testable explanation: users can toggle concepts, rewrite rules, and immediately see guaranteed effects on the model. ECS reframes interpretability as compiling mechanistic, human-legible programs from neural networks, unifying explanation and control for auditing, alignment, and safety.'
    1: We propose Low-Rank Sparse Attention (Lorsa), a sparse replacement model of Transformer attention layers to disentangle original Multi Head Self Attention (MHSA) into individually comprehensible components. Lorsa is designed to address the challenge of \textit{attention superposition} to understand attention-mediated interaction between features in different token positions. Lorsa helps find cleaner and finer-grained versions of previously discovered MHSA behaviors like induction heads, successor heads, attention sink, and a comprehensive family of arithmetic-specific Lorsa heads. Interestingly, we identify a novel head type called \emph{subtoken induction heads} that function at character level rather than token level. We also conduct extensive experiments on architectural design ablation, correlation to original MHSA heads and error analysis. Our early attempt to fully sparsify a toy Transformer succeeds to reveal clean global circuits. Eventually, we hope Lorsa would help us greatly understand attention computation and enable full sparsification of model computation along with its MLP counterparts.
