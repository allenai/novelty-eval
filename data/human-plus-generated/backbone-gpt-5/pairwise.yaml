    0: 'Foundation models excel within single modalities but lack a stable interface for composition across vision, audio, language, and emerging sensors such as depth, haptics, or biosignals. We introduce Rendezvous, a typed event bus that converts pre-trained unimodal encoders and decoders into composable tools by exchanging messages in a shared object–event graph. Rendezvous learns a modality-agnostic vocabulary of slots and relations capturing entities, attributes, and temporal links. Lightweight, bidirectional adapters attach to frozen backbones and translate between modality latents and the graph. A self-supervised cycle-and-agree objective ties together weakly synchronized multisensory streams: encodings must reconstruct across modalities and time while respecting invariants like object permanence, audio–visual synchrony, and linguistic role consistency. A programmatic query language over the graph enables chain-of-thought style reasoning and targeted generation—for example, “separate the sound of the red guitar while describing the player”—by routing queries through appropriate tools. Rendezvous supports plug-and-play addition of novel sensors and tasks, amortizes cross-modal alignment, and reframes diverse applications—captioning, retrieval, separation, grounding, and forecasting—as graph transformations rather than bespoke architectures.'
    1: 'Category-agnostic pose estimation (CAPE) aims to localize keypoints on query images from arbitrary categories, using only a few annotated support examples for guidance. Recent approaches either treat keypoints as isolated entities or rely on manually defined skeleton priors, which are costly to annotate and inherently inflexible across diverse categories. Such oversimplification limits the model''s capacity to capture instance-wise structural cues critical for accurate pixel-level localization. To overcome these limitations, we propose **GenCape**, a **Gen**erative-based framework for **CAPE** that infers keypoint relationships solely from image-based support inputs, without additional textual descriptions or predefined skeletons. Our framework consists of two principal components: an iterative Structure-aware Variational Autoencoder (i-SVAE) and a Compositional Graph Transfer (CGT) module. The former infers soft, instance-specific adjacency matrices from support features through variational inference, embedded layer-wise into the Graph Transformer Decoder for progressive structural priors refinement. The latter adaptively aggregates multiple latent graphs into a query-aware structure via Bayesian fusion and attention-based reweighting, enhancing resilience to visual uncertainty and support-induced bias. This structure-aware design facilitates effective message propagation among keypoints and promotes semantic alignment across object categories with diverse keypoint topologies.'
