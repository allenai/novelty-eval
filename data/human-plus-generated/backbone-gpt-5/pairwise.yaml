    0: 'We propose ThermoDual, a duality-preserving neural operator for learning thermodynamically consistent constitutive laws across physical sciences. ThermoDual decomposes flux–force relations into a dissipative component given by the gradient of a learned convex potential and a reversible component parameterized as a skew-symmetric operator. The convex potential is represented by an input-convex neural network, ensuring nonnegative entropy production and recovering Onsager reciprocity near equilibrium; the skew term captures nondissipative couplings such as magnetohydrodynamic or elastic effects. A field-to-operator architecture maps spatially varying states, microstructure, and boundary conditions to local potentials, while built-in rotational, permutation, and gauge symmetries enforce physical invariances. Training uses weak supervision: sparse observations are fused with balance-law residuals and integral constraints, enabling learning from limited, noisy experiments and heterogeneous simulations. ThermoDual yields discretization-agnostic surrogates for coupled transport and reaction systems, providing reliable forward modeling, uncertainty-aware data assimilation, and inverse design in domains including electrochemistry, soft-matter rheology, porous media, and developmental biology.'
    1: 'Recently, many generative models for de novo protein structure design have emerged. Yet, only few tackle the difficult task of directly generating fully atomistic structures jointly with the underlying amino acid sequence. This is challenging, for instance, because the model must reason over side chains that change in length during generation. We introduce La-Proteina for atomistic protein design based on a novel partially latent protein representation: coarse backbone structure is modeled explicitly, while sequence and atomistic details are captured via per-residue latent variables of fixed dimensionality, thereby effectively side-stepping challenges of explicit side-chain representations. Flow matching in this partially latent space then models the joint distribution over sequences and full-atom structures. La-Proteina supports a range of generation tasks, including all-atom co-design and atomistic motif scaffolding, unlocking critical atomistic structure-conditioned protein design tasks. Moreover, La-Proteina is able to generate proteins of up to 800 residues, demonstrating its scalability and robustness.'
