  ideas:
    0: Monolithic constitutions and one-size-fits-all RLHF fail to reflect plural social values, entangle fairness with safety trade-offs, and preclude privacy-preserving civic participation in alignment. We propose Polaris, a federated, pluralistic constitutional alignment framework that treats values as distributions rather than a single rule set. Stakeholder communities perform on-device micro-deliberation to produce pairwise judgments over normative clauses expressed in a typed deontic DSL; differentially private aggregation with uncertainty-aware social choice yields a posterior over constitutions. Polaris compiles this posterior into (i) a risk-averse, multi-objective training objective that upper-bounds demographic harms while enforcing safety constraints, and (ii) a stochastic constrained decoding policy that samples lawful constraint sets at inference time to remain diverse yet bounded. Each response is accompanied by a lightweight zero-knowledge “alignment receipt” certifying that specified fairness and safety envelopes were satisfied without revealing inputs or group membership. An online, no-regret updater tracks normative drift and supports machine unlearning to retract outdated values. By unifying pluralistic elicitation, private aggregation, constrained optimization, and verifiable guardrails, Polaris offers accountable, privacy-preserving, and culturally adaptive alignment.
    1: 'Protecting the copyright of user-generated AI images is an emerging challenge as AIGC becomes pervasive in creative workflows. Existing watermarking methods (1) remain vulnerable to real-world adversarial threats, often forced to trade off between defenses against spoofing and removal attacks; and (2) cannot support semantic-level tamper localization. We introduce PAI, a training-free inherent watermarking framework for AIGC copyright protection, plug-and-play with diffusion-based AIGC services. PAI simultaneously provides three key functionalities: robust ownership verification, attack detection, and semantic-level tampering localization. Unlike existing inherent watermark methods that only embed watermarks at noise initialization of diffusion models, we design a novel key-conditioned deflection mechanism that subtly steers the denoising trajectory according to the user key. Such trajectory-level coupling further strengthens the semantic entanglement of identity and content, thereby further enhancing robustness against real-world threats. Moreover, we also provide a theoretical analysis proving that only the valid key can pass verification.'
