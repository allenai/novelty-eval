    0: Learning on graphs and other discretized geometries often requires comparing vector- and tensor-valued signals defined in incompatible local frames, where naive message passing is sensitive to orientation choices, re-meshing, and topological obstructions. We introduce Parallel Transport Message Passing, a general layer that treats features as sections of an associated bundle over a graph, mesh, or cell complex. The layer learns a discrete connection by assigning group elements to edges and uses parallel transport to align messages before aggregation, guaranteeing equivariance to local gauge transformations for any chosen structure group and representation. A holonomy-aware attention mechanism summarizes curvature by integrating transports around cycles, exposing global topology as a learnable signal and opening long-range communication channels that mitigate oversquashing. The construction decouples base-space geometry from fiber symmetries, enabling a single architecture to operate across Euclidean graphs, curved surfaces, and heterogeneous complexes while remaining stable under refinement and coarsening. We further incorporate curvature regularization and cycle-basis priors to bias toward flat or structured fields when appropriate. The result is a unifying blueprint for gauge-consistent learning on discrete geometries that composes with standard GNN blocks and neural operators and supports domains ranging from molecular graphs to PDEs on manifolds.
    1: 'Multi-domain graph pre-training integrates knowledge from diverse domains to enhance performance in the target domains, which is crucial for building graph foundation models. Despite initial success, existing solutions often fall short of answering a fundamental question: how is knowledge integrated or transferred across domains? This theoretical limitation motivates us to rethink the consistency and transferability between the pre-trained model and target domains. In this paper, we propose a fresh differential geometry perspective, whose core idea is to merge any graph dataset into a unified, smooth Riemannian manifold, enabling a systematic understanding of knowledge integration and transfer. To achieve this, our key contribution is the theoretical establishment of neural manifold gluing, which first characterizes local geometry using an adaptive orthogonal frame and then "glues" the local pieces together into a coherent whole. Building on this theory, we present the GraphGlue framework, which supports batched pre-training with EMA prototyping and provides a transferability measure based on geometric consistence. Moreover, GraphGlue reveals a geometric scaling law, showing that larger quantities of datasets improve model transferability by producing a smoother manifold.'
