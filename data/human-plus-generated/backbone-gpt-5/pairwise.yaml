    0: Modeling wind-driven object dynamics from video observations is highly challenging due to the invisibility and spatio–temporal variability of wind, as well as the complex deformations of objects. We present DiffWind, a physics-informed differentiable framework that unifies wind–object interaction modeling, video-based reconstruction, and forward simulation. Specifically, we represent wind as a grid-based physical field and objects as particle systems derived from 3D Gaussian Splatting, with their interaction modeled by the Material Point Method (MPM). To recover wind-driven object dynamics, we introduce a reconstruction framework that jointly optimizes the spatio–temporal wind force field and object motion through differentiable rendering and simulation. To ensure physical validity, we incorporate the Lattice Boltzmann Method (LBM) as a physics-informed constraint, enforcing compliance with fluid dynamics laws. Beyond reconstruction, our method naturally supports forward simulation under novel wind conditions and enables new applications such as wind retargeting. We further introduce WD-Objects, a dataset of synthetic and real-world wind-driven scenes, opening a new avenue for video-based wind–object interaction modeling.
    1: Foundation models for vision, audio, language, and emerging sensors are astonishingly capable in isolation, yet wiring them together for new cross-modal tasks still demands costly retraining and brittle interfaces. We present Conductor, a declarative framework that composes frozen unimodal generators and encoders through differentiable coherence factors expressed as a factor graph. Factors score cross-modal agreement—e.g., lip–phoneme synchrony, caption–image semantics, beat–motion rhythm, contact–sound physics—and align asynchronous streams via typed rendezvous events. Given a user specification in natural language, a lightweight compiler instantiates factors and weights, then performs test-time energy minimization over latent trajectories, alternating between inference in encoders and constrained decoding in generators. Conductor turns off-the-shelf models into a programmable multimodal system that supports zero-shot translations (e.g., audio→video motion, image→speech commentary), multi-output generation under global constraints, and incorporation of new modalities by adding factors rather than retraining backbones. This contract-based control plane enables rapid, principled application of foundation models across computer vision, audio, language, haptics, biosignals, and other modalities.
