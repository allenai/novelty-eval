    0: 'Modern learners are trained by long stochastic pipelines, selected adaptively, and often operate on non-exchangeable data or through in-context updates, straining existing generalization theories. We introduce Algorithmic Transport Generalization, a coupling-based calculus that upper bounds generalization by the minimal optimal-transport cost required to couple an algorithm’s output distributions when a single training example—or a prompt prefix token—is replaced. A pathwise decomposition tracks this transport budget across optimization steps, exposing how curvature, step sizes, preconditioning, and injected noise locally contract or amplify per-example influence. The framework unifies classical lenses: uniform stability emerges from identity couplings, PAC-Bayes from KL-regularized couplings to a prior, and differential privacy from privacy-inducing couplings, while extending seamlessly to non-iid settings via dependence coefficients that quantify influence decay beyond exchangeability. Applied to in-context learning, a prefix-transport view yields task-averaged guarantees without model updates. Beyond bounds, the theory suggests actionable design rules—equalize per-example transport through noise shaping, scheduling, and curriculum—to trade optimization speed for controlled generalization under adaptivity and distribution shift.'
    1: We prove the first guarantees of sparse recovery for ReLU neural networks, where the sparse network weights constitute the signal to be recovered. Specifically, we study structural properties of the sparse network weights for two-layer, scalar-output networks under which a simple iterative hard thresholding algorithm recovers these weights exactly, using memory that grows linearly in the number of nonzero weights.
