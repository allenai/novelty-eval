    0: 'We introduce HodgeFlow, a universal framework for learning non-equilibrium mechanisms from time-ordered observations in the physical sciences. HodgeFlow parameterizes the drift of stochastic dynamics as a sum of a conservative component (the gradient of a scalar potential) and a rotational, divergence-free component, ensuring integrability and solenoidal structure by construction via neural potential and vector-potential representations. Training leverages path-space score matching and Girsanov-based objectives to fit dynamics from short, noisy traces, while an amortized encoder handles partial observability and unknown diffusion. Prior scientific knowledge—symmetries, conservation laws, dimensional constraints—enters as soft penalties or exact projections, yielding physically consistent, units-aware inference. The model is generative and interpretable: it outputs a quasi-potential landscape whose minima and saddles summarize metastability and barriers, alongside a circulation field capturing irreversible fluxes. An information-theoretic design policy then proposes interventions that maximally reduce landscape uncertainty. HodgeFlow offers a single, scalable route to extract mechanistic structure from single-cell trajectories, catalytic microkinetics, and coherent structures in fluid and plasma flows.'
    1: 'Chaotic systems are intrinsically sensitive to small errors, challenging efforts to construct predictive data-driven models of real-world dynamical systems such as fluid flows or neuronal activity. Prior efforts comprise either specialized models trained on individual time series, or foundation models trained on vast time series databases with little underlying dynamical structure. Motivated by dynamical systems theory, we present Panda, Patched Attention for Nonlinear Dynamics. We train Panda on a novel synthetic, extensible dataset of 20,000 chaotic dynamical systems that we discover using an evolutionary algorithm. Trained purely on simulated data, Panda exhibits emergent properties: zero-shot forecasting of unseen chaotic systems preserving both short-term accuracy and distributional measures, nonlinear resonance patterns in attention heads, and effective prediction of real-world experimental time series. Despite having been trained only on low-dimensional ordinary differential equations, Panda spontaneously develops the ability to predict partial differential equations without retraining. We also demonstrate a neural scaling law for differential equations, underscoring the potential of pretrained models for probing abstract mathematical domains like nonlinear dynamics.'
