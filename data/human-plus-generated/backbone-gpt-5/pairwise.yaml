  ideas:
    0: 'The deployment of Large Language Models (LLMs) faces a critical bottleneck when handling lengthy inputs: the prohibitive memory footprint of the Key Value (KV) cache. To address this bottleneck, the token pruning paradigm leverages attention sparsity to selectively retain a small, critical subset of tokens. However, existing approaches fall short, with static methods risking irreversible information loss and dynamic strategies employing heuristics that insufficiently capture the query-dependent nature of token importance. We propose FASA, a novel framework that achieves query-aware token eviction by dynamically predicting token importance. FASA stems from a novel insight into RoPE: the discovery of functional sparsity at the frequency-chunk (FC) level. Our key finding is that a small, identifiable subset of "dominant" FCs consistently exhibits high contextual agreement with the full attention head. This provides a robust and computationally free proxy for identifying salient tokens. Building on this insight, FASA first identifies a critical set of tokens using dominant FCs, and then performs focused attention computation solely on this pruned subset.'
    1: Large frontier models are deployed across heterogeneous legal, cultural, and risk regimes, yet mainstream alignment compresses diverse preferences into a single policy that is brittle and hard to audit. We introduce LambdaControl, a policy‑conditioned alignment mechanism that treats decoding as constrained optimization. The model is augmented with a small set of learned Lagrange‑multiplier tokens and low‑rank adapters that linearly span controllable interventions over safety, disclosure, citation, verbosity, and jurisdictional norms. Given a machine‑readable policy, a lightweight dual solver maps desired budgets or prohibitions to token strengths by consulting constraint predictors trained on human feedback, counterfactual perturbations, and red‑team traces. Training couples the base model with a primal–dual regularizer so that increments along each token monotonically decrease its associated predicted violation while minimally disturbing unrelated capabilities, yielding composable, calibrated control. At inference, tokens are inserted as a short prefix, enabling a single set of weights to specialize on‑the‑fly, compose multiple constraints, and emit KKT‑style certificates that expose predicted residual risks and trade‑offs. LambdaControl reframes alignment as programmable, auditable policy compliance, enabling safer, jurisdiction‑aware deployment without per‑model retraining.
