    0: Multi-modal entity alignment (MMEA) aims to identify equivalent entities across heterogeneous multi-modal knowledge graphs (MMKGs), where each entity is described by attributes from various modalities. Existing methods typically assume that both intra-entity and inter-graph correspondences are faultless, which is often violated in real-world MMKGs due to the reliance on expert annotations. In this paper, we reveal and study a highly practical yet under-explored problem in MMEA, termed Dual-level Noisy Correspondence (DNC). DNC refers to misalignments in both intra-entity (entity-attribute) and inter-graph (entity-entity and attribute-attribute) correspondences. To address the DNC problem, we propose a robust MMEA framework termed RULE. RULE first estimates the reliability of both intra-entity and inter-graph correspondences via a dedicated two-fold principle. Leveraging the estimated reliabilities, RULE mitigates the negative impact of intra-entity noise during attribute fusion and prevents overfitting to noisy inter-graph correspondences during inter-graph discrepancy elimination. Beyond the training-time designs, RULE further incorporates a correspondence reasoning module that uncovers the underlying attribute-attribute connection across graphs, guaranteeing more accurate equivalent entity identification.
    1: Representation learning spans unsupervised to fully supervised settings, but current objectives are siloed and brittle under changing label availability and signal noise. We introduce AMUSE, an adaptive multi-source supervision framework that turns heterogeneous cues—human labels, data augmentations, neighborhood structure, masked reconstruction, cross-modal captions, and teacher predictions—into a shared latent consensus distribution over semantic prototypes. Each cue defines a learnable potential that yields a distribution on prototypes; their product forms the consensus, while a small hypernetwork predicts instance-wise trust weights and temperatures from uncertainty and disagreement statistics. Training minimizes the weighted divergence between the consensus posterior and all cue distributions, with entropy regularization to prevent collapse and preserve transferable information. AMUSE subsumes cross-entropy, contrastive, and consistency learning as limit cases and provides a continuous path between unsupervised, self-supervised, semi-supervised, and supervised regimes. By routing supervision through a product-of-experts consensus, the method supports streaming shifts in label density, noisy annotations, and multi-modal hints without redesigning losses, offering a principled recipe to stabilize and unify representation learning across supervision regimes.
