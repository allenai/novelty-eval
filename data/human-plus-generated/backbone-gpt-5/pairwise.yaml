    0: 'We introduce Proof-Carrying Explanations (PCE), a framework that attaches machine-checkable certificates to local explanations of deep models. PCE selects a minimal set of mediators—input features, interpretable concepts, or internal pathways—via a differentiable gating objective that is explicitly intervention-aware, encouraging causal sufficiency rather than correlational saliency. The gated computation and a user-specified perturbation set are compiled into a verifiable constraint system whose dual yields a compact proof that: (i) the prediction is invariant to all non-selected channels within the neighborhood, and (ii) movement along certified recourse directions provably changes the output with bounded effect. The certificate can be checked independently, enabling audit-ready, falsifiable explanations without exposing model weights or data. PCE applies post hoc to frozen models, supports images, text, and tabular inputs, and extends to autoregressive predictors through token-level mediators. By making explanation validity a matter of proof verification and executable counterfactual tests, PCE bridges interpretability, robustness, and recourse, and provides a tunable trade-off between sparsity, region size, and certificate strength for deployment in high-stakes settings.'
    1: Finetuning (pretrained) language models is a standard approach for updating their internal parametric knowledge and specializing them to new tasks and domains. However, the corresponding model weight changes ("weight diffs") are not generally interpretable. While inspecting the finetuning dataset can give a sense of how the model might have changed, these datasets are often not publicly available or are too large to work with directly. Towards the goal of broadly understanding model weight changes in natural language, we introduce Diff Interpretation Tuning (DIT), a method that trains models to describe their own finetuning-induced modifications. Our approach uses synthetic, labeled weight diffs to train an introspection adapter, which can be applied to a compatible finetuned model to make it self-describe the weight changes. We consider two proof-of-concept settings—reporting hidden behaviors and summarizing finetuned knowledge—in which models describe their finetuning-induced modifications using concise natural language descriptions.
