    0: We introduce SpecBench, a living benchmark framework that replaces static test sets with executable specifications. SpecBench defines a compact algebra of atomic operators—such as retrieval, ordering, counting, quantification, and coreference—and composes them into capability graphs whose execution generates task instances with programmatic oracles. This specification-first design yields measurable operator coverage and interaction profiles, enabling auditors to quantify what a benchmark actually tests. A library of metamorphic transformations produces equivalence classes that expose shortcutting and superficial pattern-matching without relying on model-specific adversaries. To mitigate contamination and overfitting, SpecBench issues evaluation bundles via cryptographically committed seeds that create unique, reproducible instances while preserving cross-run comparability through capability-level metrics. The framework supports continual renewal by sampling fresh content sources under distributional policies that maintain operator coverage targets and drift controls. We release the operator algebra, generators, and an evaluation protocol that standardizes reporting across accuracy, consistency under metamorphs, and coverage, reframing benchmarks as durable capability audits rather than exhaustible datasets.
    1: Online services rely on CAPTCHAs as a first line of defense against automated abuse, yet recent advances in multi-modal large language models (MLLMs) have eroded the effectiveness of conventional designs that focus on text recognition or 2D image understanding. To address this challenge, we present **Spatial CAPTCHA**, a novel human-verification framework that leverages fundamental differences in spatial reasoning between humans and MLLMs. Unlike existing CAPTCHAs that rely on low-level perception tasks vulnerable to modern AI, Spatial CAPTCHA generates dynamic questions requiring geometric reasoning, perspective-taking, occlusion handling, and mental rotation—skills intuitive for humans but difficult for current AI systems. The system employs a procedural generation pipeline with constraint-based difficulty control, automated correctness verification, and human-in-the-loop validation to ensure scalability, robustness, and adaptability. We also introduce a corresponding benchmark, **Spatial-CAPTCHA-Bench**, to support systematic assessment of spatial reasoning capabilities in both humans and AI systems.
