  ideas:
    0: 'Multimodal Large Language Models (MLLMs), which couple pre-trained vision encoders and language models, have shown remarkable capabilities. However, their reliance on the ubiquitous Pre-Norm architecture introduces a subtle yet critical flaw: a severe norm disparity between the high-norm visual tokens and the low-norm text tokens. In this work, we present a formal theoretical analysis demonstrating that this imbalance is not a static issue. Instead, it induces an "asymmetric update dynamic", where high-norm visual tokens exhibit a ''''representational inertia,'''' causing them to transform semantically much slower than their textual counterparts. This fundamentally impairs effective cross-modal feature fusion. Our empirical validation across a range of mainstream MLLMs confirms that this theoretical dynamic---the persistence of norm disparity and the resulting asymmetric update rates---is a prevalent phenomenon. Based on this insight, we propose a remarkably simple yet effective solution: inserting a single, carefully initialized LayerNorm layer after the visual projector to enforce norm alignment, suggesting that resolving the architectural imbalance leads to a more holistically capable model.'
    1: Foundation models are shipped as monoliths, yet real-world deployment demands rapid, reversible, and auditable edits for safety, compliance, and knowledge updates. We introduce HotKV, a hot-swappable control plane that modifies behavior at inference by applying token-conditional, low-rank operators directly to a model’s key–value cache. Patches are compiled from high-level specifications—policies, redlines, or facts—into localized operators that shape attention and MLP activations within bounded temporal and representational support. A lightweight detector triggers patches with a time-to-live, and a compositional calculus resolves multi-patch interactions via sparse scheduling and orthogonalization. We formalize non-interference as an integral bound on the logit Jacobian outside a patch’s support and obtain certificates by constraining operator norms during synthesis. Patches are signed artifacts that can be audited, sandboxed, revoked, and distributed per user, domain, or jurisdiction, all without modifying base weights. HotKV reframes post-deployment model editing as a certified, inference-time control problem, enabling capability and compliance updates while aiming to preserve general-purpose competence.
