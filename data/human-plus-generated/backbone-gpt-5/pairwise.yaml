    0: 'We introduce Coherent Amortized Bayesian Operators (CABO), an operator-learning framework that treats Bayesian inference as a compositional map from a prior and an exchangeable set of observations to a posterior transport. CABO parameterizes this map with conditional measure transports conditioned on permutation-invariant data embeddings and enforces Bayes-like algebra via architectural symmetries and a split–compose objective: the transport learned from a union of subsets must equal the composition of transports learned on each subset. A coherence witness quantifies violations of exchangeability and associativity and serves both as a regularizer during training and as a runtime certificate of update trustworthiness. By constraining Lipschitz constants of the transport, CABO induces a Wasserstein contraction that stabilizes sequential updates in streaming and federated settings. The same operator exposes pathwise gradients of the marginal likelihood, enabling hyperparameter learning and principled model selection. CABO unifies variational inference, transport-based samplers, and message passing under a single, compositional view, yielding fast posterior sampling and calibrated uncertainty that is robust to data partitioning, ordering, and asynchronous aggregation.'
    1: Bayesian Optimization (BO) is a powerful framework for optimizing noisy, expensive-to-evaluate black-box functions. When the objective exhibits invariances under a group action, exploiting these symmetries can substantially improve BO efficiency. While using maximum similarity across group orbits has long been considered in other domains, the fact that the max kernel is not positive semidefinite (PSD) has prevented its use in BO. In this work, we revisit this idea by considering a PSD projection of the max kernel, an approach that incorporates invariance without increasing computational complexity.
