  ideas:
    0: 'As a topological invariant for discrete structures, discrete curvature has been widely adopted in the study of complex networks and graph neural networks. A prevailing viewpoint posits that edges with highly negative curvature will induce graph bottlenecks and the over-squashing phenomenon. In this paper, we critically re-examine this view and put forward our central claim: **high negative curvature is a sufficient but not a necessary condition for over-squashing**. We first construct a family of counterexamples demonstrating the failure of discrete curvature, where some edges are severely squashed, but the curvature still appears positive. Furthermore, extensive experiments demonstrate that the most commonly used discrete curvature measure --- Ollivier–Ricci curvature --- fails to detect a substantial portion of over-squashed edges. To alleviate this limitation, we propose Weighted Augmented Forman-3 Curvature ($\mathsf{WAF3}$), which significantly improves the detection of over-squashed edges. Additionally, we develop a highly efficient approximation algorithm for $\mathsf{WAF3}$, enabling scalable curvature computation on large graphs.'
    1: 'We propose Functorial Sheaf Networks (FSN), a unified framework for learning on graphs and other geometries and topologies that treats data as sections of a presheaf over a cell complex and implements layers as natural transformations. By making restriction maps explicit, FSN enforces local-to-global consistency and yields built-in equivariance to structure-preserving maps, including isomorphisms, refinements, and coarsenings. Two operators anchor the architecture: a left Kan extension that performs resolution-invariant pooling via colimits, and a right Kan extension that provides conservative prolongation for upsampling and completion from sparse observations. Overlaps are resolved through a learnable nerve-attention mechanism that weights Čech intersections while preserving functoriality. A cohomology-aware regularizer penalizes spurious variation along cycles, and a punctured training scheme exposes the model to deletions and gluings to promote robustness under topological surgery. FSN unifies message passing on graphs, surface CNNs, and higher-order hypergraph layers within a single compositional calculus, enabling training on heterogeneous discretizations and deployment on previously unseen geometries without retraining, with applications to scientific meshes, molecular systems, and sensor networks with dynamic topology.'
