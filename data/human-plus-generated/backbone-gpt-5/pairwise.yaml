  ideas:
    0: Claims about aligned, fair, and safe AI remain largely trust-based, while current audits risk privacy leakage and do not scale across jurisdictions or providers. We introduce Proof-Carrying Alignment (PCA), an architecture that attaches succinct zero-knowledge compliance certificates to model checkpoints and individual API responses. Normative policies—spanning safety constraints, fairness-of-procedure invariants, and data-usage limits—are compiled into verifiable circuits. For each interaction, PCA produces a publicly checkable proof that (i) the applicable policy, chosen by user, locale, or deployment context, was enforced; (ii) guarded retrieval and personalization consumed at most a declared differential-privacy budget; (iii) safety and abuse filters executed with versioned rules; and (iv) the decision pathway respected feature-use restrictions that preclude protected-attribute dependence. Training checkpoints carry proofs that private data were incorporated only via certified DP mechanisms. Policy and model commitments are anchored in an auditable governance ledger, enabling third parties to verify compliance without access to proprietary artifacts or user data. By converting promises into proofs and supporting modular, pluralistic policy profiles, PCA provides privacy-preserving accountability and verifiable abstention that can be independently validated across providers and regulators.
    1: 'Monitoring large language models'' (LLMs) activations is an effective way to detect harmful requests before they lead to unsafe outputs. However, traditional safety monitors often require the same amount of compute for every query. This creates a trade-off: expensive monitors waste resources on easy inputs, while cheap ones risk missing subtle cases. We argue that safety monitors should be flexible--costs should rise only when inputs are difficult to assess, or when more compute is available. To achieve this, we introduce Truncated Polynomial Classifiers (TPCs), a natural extension of linear probes for dynamic activation monitoring. Our key insight is that polynomials can be trained and evaluated progressively, term-by-term. At test-time, one can early-stop for lightweight monitoring, or use more terms for stronger guardrails when needed. TPCs provide two modes of use. First, as a safety dial: by evaluating more terms, developers and regulators can "buy" stronger guardrails from the same model. Second, as an adaptive cascade: clear cases exit early after low-order checks, and higher-order guardrails are evaluated only for ambiguous inputs, reducing overall monitoring costs.'
