    0: 'The rapid integration of agentic AI into high-stakes real-world applications requires robust oversight mechanisms. The emerging field of AI Control (AIC) aims to provide such an oversight mechanism, but practical adoption depends heavily on implementation overhead. To study this problem better, we introduce the notion of Control tax---the operational and financial cost of integrating control measures into AI pipelines. Our work makes three key contributions to the field of AIC: (1) we introduce a theoretical framework that quantifies the Control Tax and maps classifier performance to safety assurances; (2) we formalize adversarial settings where attacker models insert subtle backdoors into code while monitoring models attempt to detect these vulnerabilities; and (3) we provide empirical financial cost estimates for control protocols and develop optimized monitoring strategies that balance safety and cost-effectiveness while accounting for practical constraints like auditing budgets. Our framework enables practitioners to make informed decisions by systematically connecting safety guarantees with their costs, advancing AIC through principled economic feasibility assessment across different deployment contexts.'
    1: Aligning foundation models to pluralistic social norms while guaranteeing fairness, safety, and privacy remains stymied by monolithic rewards, opaque trade-offs, and consent-blind data pipelines. We introduce PolyAlign, a consent-aware, constraint-polytopic alignment framework that learns and serves a family of norm-conformant behaviors rather than a single policy. PolyAlign builds a Bayesian social-choice posterior over stakeholder preferences using differentially private pairwise feedback tied to cryptographic consent tokens that specify scope and usage budgets. It then trains a set of extreme policies at the vertices of a safety-and-fairness feasibility polytope via distributionally robust, Lagrangian-constrained finetuning, attaching a low-rank “normative adapter” subspace to a base model. At inference, a governance-signed policy pack selects convex mixtures within the certified safety envelope, exposing a small control surface of interpretable levers while guaranteeing that protected-group and harm constraints remain satisfied for any chosen mixture. Attestable provenance logs, dual-variable certificates, and normative influence functions make explicit whose values are enacted and whose data enabled them. PolyAlign operationalizes participatory, private, and auditable alignment, enabling context-specific behavior without retraining and unifying societal alignment, fairness constraints, safety guarantees, and privacy preservation in a single deployable mechanism.
