  ideas:
    0: Naturalistic experiments elicit rich neural dynamics but hinder theory adjudication because stimulus spaces are vast and confounded. We introduce SAGE, a framework that converts cognitive theories into optimization objectives on the latent spaces of large generative models and uses closed-loop design to query human or animal brains. Theories specify feature functionals—structured predictions about semantics, syntax, attention, memory load, or social inference—aligned to generator latents via weak supervision and differentiable editing. SAGE performs constrained Bayesian optimal design to synthesize stimuli that maximally separate competing hypotheses while preserving naturalness and ethical guardrails, and updates a subject-adaptive encoding model that links theory constructs, stimuli, behavior, and neural dynamics in real time. Multi-modal generators coordinate text, images, and audio to probe cross-sensory representations, and hierarchical priors share structure across participants while retaining idiosyncrasies. By unifying top-down cognitive principles with bottom-up foundation models, SAGE yields interpretable, theory-discriminative naturalistic experiments and a general recipe for accelerating discovery in cognitive and systems neuroscience.
    1: Training recurrent neural networks (RNNs) to perform neuroscience-style tasks has become a popular way to generate hypotheses for how neural circuits in the brain might perform computations. Recent work has demonstrated that task-trained RNNs possess a strong simplicity bias. In particular, this inductive bias often causes RNNs trained on the same task to collapse on effectively the same solution, typically comprised of fixed-point attractors or other low-dimensional dynamical motifs. While such solutions are readily interpretable, this collapse proves counterproductive for the sake of generating a set of genuinely unique hypotheses for how neural computations might be performed. Here we propose Iterative Neural Similarity Deflation (INSD), a simple method to break this inductive bias. By penalizing linear predictivity of neural activity produced by standard task-trained RNNs, INSD finds an alternative class of solutions to classic neuroscience-style RNN tasks. Our findings underscore the importance of moving beyond the simplicity bias to uncover richer and more varied models of neural computation.
