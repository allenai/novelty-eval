    0: 'We introduce Diffusion Homotopy Descent, an optimization framework that tracks minimizers of a geometry-aware family of smoothed objectives produced by anisotropic diffusion. At iterate x, we replace the objective f with its heat-smoothed surrogate f_sigma defined by a local positive semidefinite metric, then adapt the smoothing scale sigma to keep the spectral norm or trace of the smoothed Hessian within a target trust budget. This curvature-controlled continuation yields large, safe steps early for exploration and automatically anneals to zero smoothing for precise final convergence. Gradients of f_sigma are estimated without extra oracles: with first-order access via antithetic perturbations that reuse stochastic minibatches, or in black-box settings via Stein-type zero-order estimators augmented with control variates. A mirror variant performs diffusion in non-Euclidean geometry to respect constraints and structure. We provide a homotopy schedule that ensures descent on the smoothed objective, stability of the minimizer path under mild prox-regularity, and convergence to stationary points of the original problem as sigma vanishes. The result is a single, hyperparameter-light optimizer that unifies continuation, preconditioning, and stochastic smoothing for challenging nonconvex and constrained problems.'
