  ideas:
    0: We study the problem of fixed budget pure exploration in reinforcement learning. The goal is to identify a near-optimal policy, given a fixed budget on the number of interactions with the environment. Unlike the standard PAC setting, we do not require the target error level $\epsilon$ and failure rate $\delta$ as input. We propose novel algorithms and provide, to the best of our knowledge, the first instance-dependent $\epsilon$-uniform guarantee, meaning that the probability that $\epsilon$-correctness is ensured can be obtained simultaneously for all $\epsilon$ above a budget-dependent threshold. It characterizes the budget requirements in terms of the problem-specific hardness of exploration. As a core component of our analysis, we derive a $\epsilon$-uniform guarantee for the multiple bandit problem—solving multiple multi-armed bandit instances simultaneously—which may be of independent interest. To enable our analysis, we also develop tools for reward-free exploration under the fixed-budget setting, which we believe will be useful for future work.
    1: Modern training pipelines break exchangeability by adaptive curricula, augmentation policies, and active sampling, yet classical generalization analyses treat datasets as unordered sets or assume uniform stability. We develop a theory of order-dependent generalization based on directed information that quantifies the incremental influence of each streamed example on the final parameters. By decomposing the expected generalization gap into a sum of per-step information flows, we obtain algorithm-agnostic bounds that hold for nonconvex, stochastic, and momentum-based updates, and that tighten when gradients align across steps. These bounds recover and strictly refine mutual-information and stability guarantees as special cases. Building on this, we propose Minimum-Information Curriculum (MIC), a scheduling principle that selects the next example or augmentation to minimize a proxy for directed information subject to descent constraints, operationalized via curvature-aware gradient similarity and step-size control. We further introduce Order-PAC-Bayes, a trajectory-level PAC-Bayesian framework that treats the update process as a Markov channel relative to a reference noisy dynamic, yielding data- and order-dependent priors without re-running training. Together, these results predict when curricula, replay, or active selection improve generalization and articulate compute–noise–order trade-offs that guide the design of training pipelines.
