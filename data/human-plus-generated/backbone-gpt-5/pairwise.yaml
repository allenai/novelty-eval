    0: 'Computing the polar decomposition and the related matrix sign function has been a well-studied problem in numerical analysis for decades. Recently, it has emerged as an important subroutine within the Muon algorithm for training deep neural networks. However, the requirements of this application differ sharply from classical settings: deep learning demands GPU-friendly algorithms that prioritize high throughput over high precision. We introduce *Polar Express*, a new method for computing the polar decomposition. Like Newton–Schulz and other classical polynomial methods, our approach uses only matrix-matrix multiplications, making it very efficient on GPUs. Inspired by earlier work of Chen & Chow and Nakatsukasa & Freund, *Polar Express* adapts the update rule at each iteration by solving a minimax optimization problem. We prove that this strategy minimizes error in a worst-case sense, allowing *Polar Express* to converge as rapidly as possible both in the early iterations and asymptotically. We also address finite-precision issues, making it practical to use in `bfloat16`.'
    1: We introduce Energy-Guided Momentum (EGM), a closed-loop acceleration framework for first-order optimization that treats the optimizer as a controlled dynamical system. EGM maintains a discrete Lyapunov certificate built from a Bregman divergence around a moving anchor and modulates both step size and momentum through an event-triggered feedback law. The controller enforces descent of the certificate without knowledge of Lipschitz or strong-convexity constants, smoothly interpolating between mirror descent and Nesterov in a parameter-free manner. A proximal variant handles composite objectives, and a monotone extragradient extension applies to saddle-point problems. To cope with heavy-tailed stochastic gradients, EGM wraps a sketch-and-clip gradient estimator whose confidence directly feeds the feedback law, decoupling noise robustness from curvature adaptation. The result is a single, restart-free optimizer that adapts on the fly to local geometry, noise level, and constraints, with Lyapunov-based stability and convergence guarantees across convex and nonconvex regimes. Beyond algorithm design, the certificate yields plug-in stopping rules, anytime optimality residuals, and compute-aware truncation policies, enabling principled optimization under unknown smoothness, time-varying budgets, and non-Euclidean geometries.
