    0: Randomized Controlled Trials are one of the pillars of science; nevertheless, they rely on hand-crafted hypotheses and expensive analysis. Such constraints prevent causal effect estimation at scale, potentially anchoring on popular yet incomplete hypotheses. We propose to discover the unknown effects of a treatment directly from data. For this, we turn unstructured data from a trial into meaningful representations via pretrained foundation models and interpret them via a Sparse Auto Encoder. However, discovering significant causal effects at the neural level is not trivial due to multiple-testing issues and effects entanglement. To address these challenges, we introduce _Neural Effect Search_, a novel recursive procedure solving both issues by progressive stratification. We showcase, in the context of experimental ecology, the first successful unsupervised causal effect identification on a real-world scientific trial.
    1: 'We propose Executable Causal Programs (ECP), a framework that turns explanations into falsifiable, intervention-ready hypotheses about a model’s internal computations. ECP represents an explanation as a small typed program over latent states and primitive causal operations (copy, gate, add, attend), asserting how specific features propagate to decisions. Each program compiles into a suite of targeted interventions—ablations, swaps, clamped activations, and symmetry-preserving metamorphic tests—that should yield predictable counterfactual behaviors if the explanation is correct. A differentiable verifier combines Jacobian–vector products with low-rank influence approximations to guide search over program structures under sparsity, compositionality, and invariance priors. The output is a dual artifact: a natural-language summary linked to an executable intervention kit that can reproduce, suppress, or reroute the described behavior, together with a counterfactual consistency score quantifying faithfulness and minimal editability that quantifies how easily the mechanism can be altered without collateral damage. By making explanations programmatic, testable, and actionable, ECP provides a principled path to mechanistic understanding that scales across architectures and modalities, bridging post hoc description with verifiable causal claims and enabling explanation-driven model repair.'
