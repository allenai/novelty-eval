    0: Aligning Large Language Models (LLMs) with human preferences is crucial for safe and effective AI interactions. While popular methods like Direct Preference Optimization (DPO) have simplified alignment, they remain sensitive to data noise and overlook the differential importance of individual tokens. Existing token-level approaches often rely on probability prediction or simplistic weighting schemes to obtain token importance, which still cannot fully address these issues. To solve this problem, we propose the Token-Importance Guided Direct Preference Optimization (TI-DPO), a framework that achieves fine-grained semantic control through two synergistic innovations. First, we propose a novel hybrid weighting mechanism that combines gradient attribution with a Gaussian prior, ensuring both the accuracy and robustness of token importance scores. Second, we employ a triplet loss to provide structured guidance for the optimization, explicitly guiding model outputs to approach preferred responses and diverge from non-preferred ones.
    1: Frontier models are deployed across jurisdictions where normative requirements vary, yet alignment is often baked into training, yielding brittle one-size-fits-all behavior. We introduce PoliMorph, a policy-conditioned governance layer for frozen foundation models. Given a machine-readable policy (natural language rubric, compliance spec, or safety profile), a lightweight meta-controller compiles it into low-rank adapters targeted to critical layers, producing an ephemeral intervention loaded only for the current request. A counterfactual objective learns disentangled control directions from weak policy checkers and red-teaming signals, with a capability-preserving regularizer that minimizes intervention magnitude. At inference, dual-consistent decoding projects logits through a differentiable barrier induced by the compiled policy, balancing utility and constraint satisfaction under an explicit risk budget. PoliMorph composes multiple policies via orthogonalized adapter summation and emits attestation traces linking outputs to active constraints. This programmable governance decouples capability acquisition from normative control, enabling rapid, auditable, and jurisdiction-aware adaptation of frontier models without retraining or catastrophic forgetting, and reframes alignment as on-demand policy compilation rather than static post-training.
