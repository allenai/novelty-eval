    0: 'Progress in model robustness is confounded by defects in training data—label noise, spurious shortcuts, duplicates, demographic skews, and leakage—yet the field lacks a controlled, reusable way to measure whether dataset debugging methods truly find and fix such issues. We introduce FaultFoundry, a programmatic benchmark and dataset generator for data debugging across vision, language, audio, and tabular domains. A declarative bug calculus composes precise data pathologies with tunable severity and localization on top of clean corpora, yielding instances with ground-truth fault provenance at example-, feature-, and split-level granularity. FaultFoundry defines three tasks: discovery (rank examples and attributes by likelihood of fault), localization (explain the causal artifact or population segment), and repair (propose minimal edits or reweightings under a cost budget). A versioned manifest tracks provenance, licensing, and privacy constraints while enabling dynamic generation of new combinations without invalidating comparisons. The evaluator emphasizes triage utility and stability under dataset evolution, incentivizing methods that generalize beyond a single corpus. By shifting benchmarking from models to data, FaultFoundry establishes a rigorous substrate for research on data-centric AI, spurious correlation mitigation, and governance-aware curation.'
    1: We introduce **Gaia2**, a benchmark for evaluating large language model agents in realistic, asynchronous environments. Unlike prior static or synchronous evaluations, Gaia2 introduces scenarios where environments evolve independently of agent actions, requiring agents to operate under temporal constraints, adapt to noisy and dynamic events, resolve ambiguity, and collaborate with other agents. Each scenario is paired with a write-action verifier, enabling fine-grained, action-level evaluation and making Gaia2 directly usable for reinforcement learning from verifiable rewards. Gaia2 is built on a consumer environment with the open-source **Agents Research Environments** platform and designed to be easy to extend. By releasing Gaia2 alongside the foundational ARE framework, we aim to provide the community with a flexible infrastructure for developing, benchmarking, and training the next generation of practical agent systems.
