  ideas:
    0: In-context Learning (ICL) is an emerging few-shot learning paradigm based on modern Language Models (LMs), yet its inner mechanism remains unclear. In this paper, we investigate the mechanism through a novel perspective of information removal. Specifically, we demonstrate that in the zero-shot scenario, LMs encode queries into non-selective representations in hidden states containing information for all possible tasks, leading to arbitrary outputs without focusing on the intended task. Meanwhile, we find that selectively removing specific information from hidden states by a low-rank filter effectively steers LMs toward the intended task. Building on these findings, by measuring the hidden states on carefully designed metrics, we observe that few-shot ICL effectively simulates such task-oriented information removal processes, selectively removing the redundant information from entangled non-selective representations, and improving the output based on the demonstrations, which constitutes a key mechanism underlying ICL. Moreover, we identify essential attention heads inducing the removal operation, termed Denoising Heads, which enables ablation experiments blocking the information removal operation from the inference, confirming both the critical role of the information removal mechanism and denoising heads.
    1: Interpretability methods often trade faithfulness for human-readability, and most yield static attributions that cannot be executed to test causal claims. We introduce Executable Concept Lattices (ECL), a framework that converts a trained neural network into a small, queryable program over human-aligned latent concepts. ECL first learns concept probes that satisfy algebraic closure constraints, then uses Formal Concept Analysis to organize activation patterns into a distributive lattice capturing stable concept co-occurrences. We compile this lattice into a monotone circuit whose join/meet gates act as transparent decision rules, optimized to achieve interventional equivalence to the original model within local neighborhoods of the input space. Explanations become prime implicants of this circuit (why), minimal counterfactual edits to flip outputs (what-if), and prime implicates diagnosing missing evidence (why-not). Lattice margins induce bounds on explanation stability under perturbations, and the circuit itself serves as an executable artifact to validate claims and to compose higher-level policies. ECL yields mechanistic, compositional explanations that generalize across inputs and tasks while remaining tightly coupled to the underlying model, bridging post-hoc narratives with testable, programmatic semantics.
