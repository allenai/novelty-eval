    0: We introduce Optional-PAC, a sequential PAC-Bayesian framework that yields anytime, selection-robust generalization certificates for adaptive learning pipelines. Our construction turns tilted loss differences into an e-process that is a nonnegative supermartingale along the training trajectory. A drifting prior co-evolves with the predictor, and the only cost of adaptivity is an explicit cumulative KL leakage budget between successive posteriors and their reference priors. By optional stopping, the resulting bounds hold under arbitrary, data-dependent stopping times, hyperparameter schedules, model selection rules, and even inference-time adaptation, obviating dedicated validation sets. The certificates compose across stages—augmentation, pretraining, fine-tuning, pruning, and test-time updates—via additivity of leakage, and naturally specialize to stochastic optimization with dynamic batch sizes and learning rates. We provide an online procedure that maintains risk certificates in real time, enabling safe early stopping and principled hyperparameter search within a single training run. Optional-PAC reframes generalization control as accounting for information expended over the entire learning process, unifying time-uniform concentration with PAC-Bayesian reasoning for modern, highly adaptive workflows.
    1: Contrastive learning has emerged as a powerful framework for learning generalizable representations, yet its theoretical understanding remains limited, particularly under imbalanced data distributions that are prevalent in real-world applications. Such an imbalance can degrade representation quality and induce biased model behavior, yet a rigorous characterization of these effects is lacking. In this work, we develop a theoretical framework to analyze the training dynamics of contrastive learning with Transformer-based encoders under imbalanced data. Our results reveal that neuron weights evolve through three distinct stages of training, with different dynamics for majority features, minority features, and noise. We further show that minority features reduce representational capacity, increase the need for more complex architectures, and hinder the separation of ground-truth features from noise. Inspired by these neuron-level behaviors, we show that pruning restores performance degraded by imbalance and enhances feature separation, offering both conceptual insights and practical guidance.
