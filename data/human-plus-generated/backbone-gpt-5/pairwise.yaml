    0: 'We introduce Composable Schrödinger Bridge Inference (CoSBI), a modular approach to Bayesian inference that learns and composes posterior transport maps from factorized likelihoods. CoSBI parameterizes each factor’s time-dependent desirability function—the solution to a linear backward Kolmogorov equation with potential given by the factor’s negative log-likelihood—and induces a corresponding guidance drift over a reference diffusion. A simple algebraic rule emerges: products of desirabilities yield sums of drifts, enabling zero-shot construction of global posterior flows by adding or removing factors without retraining. We train desirability networks using a pathwise objective that couples denoising score matching with Girsanov reweighting, avoiding discretization of state space and preserving the entropic optimal transport structure. The composed flow provides calibrated samples, predictive uncertainty, and a decomposition of the log evidence via additive control costs. CoSBI naturally supports federated and continual Bayesian learning, privacy-preserving multi-party updates, and simulator-based factors through classifier-guided ratio potentials. We establish conditions under which composition is exact and derive posterior KL bounds governed by per-factor PDE residuals, enabling principled modular uncertainty quantification.'
    1: Neural posterior estimation (NPE) is a likelihood-free amortized variational inference method that approximates projections of the posterior distribution. To date, NPE variational families have been either simple and interpretable (such as the Gaussian family) or highly flexible but black-box and potentially difficult to optimize (such as normalizing flows). In this work, we parameterize variational families via basis expansions of the latent variables. The log density of our variational distribution is a linear combination of latent basis functions (LBFs), which may be fixed a priori or adapted to the problem class of interest. Our training and inference procedures are computationally efficient even for problems with high-dimensional latent spaces, provided only a low-dimensional projection of the posterior is of interest, owing to NPE's automatic marginalization capabilities.
