    0: Physical simulation relies on spatially-varying mechanical properties, typically laboriously hand-crafted. We present the first feed-forward model to predict fine-grained mechanical properties, Young's modulus ($E$), Poisson's ratio ($\nu$), and density ($\rho$), throughout *the volume* of 3D objects. Our model supports any 3D representation that can be rendered and voxelized, including Signed Distance Fields (SDFs), Gaussian Splats and Neural Radiance Fields (NeRFs). To achieve this, we aggregate per-voxel multi-view features for any input, which are passed to our trained Geometry Transformer to predict per-voxel material latent codes. These latents reside on the trained manifold of physically plausible materials, which we train on a real-world dataset, guaranteeing the validity of decoded per-voxel materials. To obtain object-level training data, we propose an annotation pipeline combining knowledge from segmented 3D datasets, material databases, and a vision-language model. VoMP estimates volumetric properties and can convert 3D objects into simulation-ready assets, enabling realistic deformable simulations.
    1: We introduce OmniMeasure, a modality-agnostic framework that represents heterogeneous signals—images, audio, language, video, point clouds, and graphs—as sparse measures over a latent coordinate field. Inputs are tokenized into atoms with location, weight, and feature; lightweight adapters implement differentiable raster-to-measure and measure-to-signal maps. A single network, the Measure Transformer, performs computation via kernelized attention potentials that are equivariant to translations, rotations, and time shifts, unifying pixel/patch attention, temporal attention, and graph message passing as special cases. Training couples modalities through cycle-consistent transport between measures, cross-modal sparsification, and instruction-conditioned energy shaping that modulates kernels with language. The formulation enables streaming and variable-resolution processing, principled sensor fusion via measure union and optimal-transport couplings, and bidirectional perception–generation within the same architecture. OmniMeasure targets applications spanning computer vision, audio understanding, language grounding, and beyond, offering a single abstraction for building multimodal systems that must generalize across sampling regimes, coordinate geometries, and task interfaces.
