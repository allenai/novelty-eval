  ideas:
    0: As foundation models enter regulated domains, stakeholders need verifiable guarantees that alignment, fairness, safety, and privacy constraints are enforced throughout training and deployment without revealing proprietary assets or sensitive data. We introduce Proof-Carrying Alignment (PCA), a cryptographic governance layer that binds normative specifications to models and outputs via machine-checkable certificates. PCA provides a declarative language for expressing privacy budgets, subgroup fairness targets, refusal and redaction policies, provenance and purpose limitations, and tool-use constraints; compilers that translate these specifications into auditable checkers; and zero-knowledge proofs that training logs, gradient clipping, noise injection, provenance filters, and guardrail executions satisfy declared constraints. Certificates compose across fine-tuning, distillation, and agentic tool use, preserving traceability as systems evolve. PCA integrates multi-stakeholder preference aggregation as a verifiable policy module, enabling transparent weighting of competing societal objectives under explicit assumptions. Risk-limiting audits address distribution shift, while differentially private statistics confine sensitive computations to proof circuits. By converting alignment claims into portable, locally verifiable artifacts, PCA enables accountable model release, contractible service guarantees, and interoperable compliance across jurisdictions without compromising privacy or IP.
    1: Recently, OpenAI (2025) showed that training against a chain of thought (CoT) monitor can cause obfuscated CoTs, which contain bad behavior the monitor cannot detect. They proposed to keep CoTs monitorable by training only against output monitors that do not have access to CoT. We show that such training can still cause obfuscated CoTs via two mechanisms. First, when a model is trained to produce a safe-looking output, that model may generalize to making its CoTs look safe. Second, since later tokens are conditioned on earlier ones, safe‑looking CoTs may increase the likelihood of safe outputs, causing safe-looking CoTs to be reinforced. We introduce two mitigations to address these two issues. To our knowledge, we are the first to identify and mitigate these problems. Our work implies that preserving CoT monitorability is more difficult than previously thought; we suggest practical guidelines for AI developers to maintain monitorable CoTs.
