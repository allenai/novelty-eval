    0: 'Omni-modal reasoning is essential for intelligent systems to understand and draw inferences from diverse data sources. While existing omni-modal large language models (OLLM) excel at perceiving diverse modalities, they lack the complex reasoning abilities of recent large reasoning models (LRM). However, enhancing the reasoning ability of OLLMs through additional training presents significant challenges, including the need for high-quality data, task-specific adaptation, and substantial computational costs. To address these limitations, we propose ThinkOmni, a training-free and data-free framework that lifts textual reasoning to omni-modal scenarios. ThinkOmni introduces two key components: 1) LRM-as-a-Guide, which leverages off-the-shelf LRMs to guide the OLLM decoding process; 2) Stepwise Contrastive Scaling, which adaptively balances perception and reasoning signals without manual hyperparameter tuning. Overall, ThinkOmni offers a flexible and generalizable solution for omni-modal reasoning and provides new insights into the generalization and application of reasoning capabilities.'
    1: Multimodal foundation models excel at pairwise alignment but struggle to integrate arbitrary, asynchronous sensory streams and to edit one modality while preserving cross-modal consistency. We introduce Asynchronous Token Lattices (ATL), a modality-agnostic generative interface that represents video, audio, language, haptics, and other signals as event tokens placed on a shared, irregular temporal lattice. A diffusion-based inpainting process operates over this lattice, while typed cross-modal constraints—implemented as lightweight energy heads and conservation-aware attention—enforce synchrony and semantic agreement across modalities. Pretrained single-modality encoders and decoders attach as adapters, allowing ATL to reuse existing expertise without joint retraining. Tasks are issued as operator prompts that declare which lattice cells are observed, which are targets, and which constraints to activate, enabling a single model to perform dubbing, lip synchronization, audio-visual separation, timestamped captioning, cross-modal retrieval, and sensor fusion. The lattice abstraction extends to non-temporal domains (e.g., 2D images, 3D point clouds) via polymorphic coordinate embeddings, unifying heterogeneous modalities under a common program of masked, constraint-guided generation and reasoning.
