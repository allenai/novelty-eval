  ideas:
    0: We introduce DISCERN, a disagreement-optimized, closed-loop experiment designer for neuroscience and cognitive science. DISCERN treats candidate theories—normative cognitive models, neural circuit simulators, and descriptive baselines—as probabilistic programs coupled to observation models for behavior and neural signals. A generative controller synthesizes stimuli and protocol programs to maximize expected information gain over the theory posterior, under safety and feasibility constraints. Differentiable surrogate emulators enable rapid prediction across modalities, while a Bayesian belief state drives adaptive, trial-wise design. Programmatic priors, instantiated via language-grounded grammars, restrict search to interpretable manipulations and yield human-readable rationales for proposed interventions. Beyond selecting among fixed hypotheses, DISCERN performs residual-driven model expansion, proposing new axes of computational variation when all candidates underfit. The framework unifies optimal experimental design with mechanistic interpretability, automatically crafting illusions, instruction sequences, and neurophysiology paradigms that elicit maximal theoretical disagreement. By turning experiment design into an optimization problem aligned with falsification, DISCERN aims to accelerate cumulative, reproducible discovery in cognition and systems neuroscience and to bridge normative, algorithmic, and implementational accounts within a single, extensible loop.
    1: 'Enabling natural communication through brain–computer interfaces (BCIs) remains one of the most profound challenges in neuroscience and neurotechnology. While existing frameworks offer partial solutions, they are constrained by oversimplified semantic representations and a lack of interpretability. To overcome these limitations, we introduce **Semantic Intent Decoding (SID)**, a novel framework that translates neural activity into natural language by modeling meaning as a flexible set of compositional semantic units.

      SID is built on three core principles: semantic compositionality, continuity and expandability of semantic space, and fidelity in reconstruction.

      We present **BrainMosaic**, a deep learning architecture implementing SID. BrainMosaic decodes multiple semantic units from EEG/SEEG signals using set matching and then reconstructs coherent sentences through semantic-guided reconstruction.

      This approach moves beyond traditional pipelines that rely on fixed-class classification or unconstrained generation, enabling a more interpretable and expressive communication paradigm, paving the way for natural and effective BCI-mediated communication.'
