  ideas:
    0: 'Frontier models excel across tasks yet remain static at inference, forcing a brittle trade-off between generic capability, personalization, and safety. We propose Contract-Conditioned HyperAdapters (CCHA), an inference-time mechanism that generates ephemeral, low‑rank parameter patches tailored to each request and bound by explicit behavioral contracts. A lightweight hypernetwork reads the prompt, retrieved exemplars, and a machine‑checkable contract specification to synthesize adapter weights for selected transformer layers; these patches exist only for the current interaction, enabling private, on-device specialization without persistent fine‑tuning. To guarantee guardrail adherence while preserving core skills, CCHA couples adapter synthesis with two innovations: counterfactual contract testing, which probes nearby continuations and optimizes the adapter in situ against differentiable contract losses, and non‑interference certification, which constrains adapters to a capability‑preserving subspace derived from precomputed influence sketches of the base model. This unifies prompt engineering, retrieval, and decoding under a single contract‑satisfying optimization at test time, enabling controllable, reversible, and composable adaptation of frontier models across domains, tools, and modalities.'
    1: "Process Reward Models (PRMs) have recently emerged as a powerful framework for enhancing the reasoning capabilities of large reasoning models (LRMs), particularly in the context of test-time scaling (TTS). However, their potential for supervising LRMs on tabular reasoning domains remains underexplored. \nThrough detailed empirical analyses, we identify that existing PRMs, though widely adopted for supervising text-only reasoning steps, struggle with table-specific operations such as sub-table retrieval and schema interaction, leading to critical performance bottlenecks. To address this limitation, we propose TaTToo, a novel table-grounded PRM framework that (i) reasons explicitly over tabular reasoning steps and (ii) integrates tool-based verification to provide precise reward supervision. Concretely, we first design a scalable data curation pipeline that constructs over 60k high-quality step-level annotations by integrating table verification rationales with tool-based executions. Building on the collected data, we train TaTToo with a dual-stage paradigm: cold-start supervised fine-tuning to capture tool-use reasoning patterns, followed by reinforcement learning with tool-grounded reward shaping to align our model with table-based verification."
