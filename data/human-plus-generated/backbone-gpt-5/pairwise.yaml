    0: The Maximum Common Edge Subgraph (MCES) problem is a crucial challenge with significant implications in domains such as biology and chemistry. Traditional approaches, which include transformations into max-clique and search-based algorithms, suffer from scalability issues when dealing with larger instances. This paper introduces ``Neural Graduated Assignment'' (NGA), a simple, scalable, unsupervised-training-based method that addresses these limitations. Central to NGA is stacking of differentiable assignment optimization with neural components, enabling high-dimensional parameterization of the matching process through a learnable temperature mechanism. We further theoretically analyze the learning dynamics of NGA, showing its design leads to fast convergence, better exploration-exploitation tradeoff, and ability to escape local optima. The introduction of NGA marks a significant advancement in the computation of MCES and offers insights into other assignment problems.
    1: Learning on graphs and other non-Euclidean domains requires models that respect local symmetries while encoding global topology. We propose Parallel Transport Graph Networks (PT-GN), a gauge-invariant message passing framework that equips a graph with a latent fiber bundle and a learnable connection. Each node hosts features in a local frame; each edge carries a Lie group–valued transport map that aligns neighbor features by parallel transport before aggregation. The learned connection induces holonomy, captured by path-ordered products around cycles; these Wilson-loop features summarize curvature and supply nonlocal context. Gauge-consistent layers ensure outputs are invariant to changes of local frames, while a curvature-aware regularizer and a homology-guided choice of cycles modulate information flow and alleviate over-squashing. The construction extends to higher-dimensional cell complexes via discrete exterior calculus, enabling transport of k-form features across 0-, 1-, and 2-cells. PT-GN unifies directional, equivariant, and topological signal processing under a single principle—learn to align, then aggregate—yielding representations that are stable across geometries, sensitive to topology, and supporting multi-scale, holonomy-preserving coarsening for large graphs.
