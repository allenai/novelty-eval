  ideas:
    0: 'Behavior Foundation Models (BFMs) are capable of retrieving high-performing policy for any reward function specified directly at test-time, commonly referred to as zero-shot reinforcement learning (RL). While this is a very efficient process in terms of compute, it can be less so in terms of data: as a standard assumption, BFMs require computing rewards over a non-negligible inference dataset, assuming either access to a functional form of rewards, or significant labeling efforts. To alleviate these limitations, we tackle the problem of task inference purely through interaction with the environment at test-time. We propose OpTI-BFM, an optimistic decision criterion that directly models uncertainty over reward functions and guides BFMs in data collection for task inference. Formally, we provide a regret bound for well-trained BFMs through a direct connection to upper-confidence algorithms for linear bandits.'
    1: 'We introduce Determinantal Occupancy-Regularized Agents (DORA), a reinforcement learning framework that learns a compact set of policies whose long-horizon visitation distributions are explicitly diversified. Instead of encouraging action-level disagreement, DORA embeds each policy into an occupancy space via learned successor features and maximizes the log-determinant of a kernel over these embeddings, a determinantal point process objective that promotes near-orthogonal coverage of the state–action manifold. We derive gradients that backpropagate through the occupancy mapping, and an incremental policy generator that greedily adds policies to increase joint value while expanding coverage. To handle offline settings, the kernel is reweighted by estimated behavior-support density ratios, concentrating diversity within reliable regions and mitigating extrapolation. At deployment, a lightweight risk-aware mixer selects or blends members based on uncertainty-aware critics, yielding multi-modal behavior without sacrificing stability. By operating at the distributional level, DORA turns ensemble RL into a geometry problem: span the dynamics-relevant subspace with as few, as different, policies as possible. This perspective enables principled exploration, safe offline learning, and fast task transfer by recombining the learned set, without retraining the underlying representations.'
