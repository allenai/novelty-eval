    0: 'Learning on graphs and geometric complexes is constrained by topological bottlenecks: cycles and higher-genus structure compress long-range signals under local message passing. We introduce UnwrapNet, a deck-equivariant lift–transport–project framework that makes topology an explicit computational scaffold. For each anchor region, UnwrapNet constructs an r-local approximation of the universal cover—an acyclic lift that disentangles cycles while retaining a covering map to the base domain. Attention and message passing operate on the lifted structure with a learned discrete connection that parallel-transports features along edges; closed walks are summarized via holonomy tokens that capture path-dependent effects. Outputs are pushed back through the covering map using a permutation- and deck-equivariant aggregator, yielding base-domain updates that respect symmetries and preserve locality. The lifting principle extends to hypergraphs and cell complexes via their 1-skeleta and to manifolds via charted covers, enabling a single model family across discrete and continuous geometries. By expanding receptive fields without densifying the base graph and by operating in a simply connected lift, UnwrapNet mitigates oversquashing and exposes global topology for learning in tasks ranging from molecular rings to meshes on high-genus surfaces.'
    1: 'Watermarking provides an effective means for data governance. However, conventional post-editing graph watermarking approaches degrade the graph quality and involve NP-hard subroutines. Alternatively, recent approaches advocate for embedding watermarking patterns in the noisy latent during data generation from diffusion models, but remain uncharted for graph models due to the hardness of inverting the graph diffusion process. In this work, we propose CheckWate: the first watermarking framework for graph diffusion models embedding checkerboard watermark and providing polynomial time verification. To address NP-completeness due to graph isomorphism, CheckWate embeds the watermark into the latent eigenvalues, which are isomorphism-invariant. To detect the watermark through reversing the graph diffusion process, CheckWate leverages the graph eigenvectors to approximately dequantize the discrete graph back to the continuous latent, with theoretical guarantees on the detectability and dequantization error. We further introduce a latent sparsification mechanism to enhance the robustness of CheckWate against graph modifications.'
