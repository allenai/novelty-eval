  ideas:
    0: 'Generative models excel at realism but struggle to obey hard structural, logical, or physical constraints. Existing classifier or energy guidance captures soft heuristics, lacking guarantees and composability. We present Proof-Guided Diffusion (PGD), a neuro-symbolic framework that couples score-based generative models with incremental SMT/MaxSAT solving to enforce constraints and return certificates. PGD introduces: (i) a symbolic abstraction network that maps intermediate noisy states to predicate valuations with calibrated margins; (ii) a proof barrier constructed from solver-unsat cores, converting violated clauses into differentiable potentials; and (iii) a predictor–corrector sampler that adds certificate-conditioned score corrections via a time-annealed Lagrangian. The barrier weight follows the diffusion schedule, enabling early exploration and late exact satisfaction. PGD supports arbitrary compositions of Boolean, arithmetic, and graph constraints, requires no retraining of the base generator, and returns a machine-checkable certificate for each sample via the solver''s proof trace. Under mild regularity, the sampler converges in the low-noise limit to distributions supported on the constraint manifold, while retaining coverage through a trust-region control of guidance strength.'
    1: Few-step diffusion or flow-based generative models typically distill a velocity-predicting teacher into a student that predicts a shortcut towards denoised data. This format mismatch has led to complex distillation procedures that often suffer from a quality--diversity trade-off. To address this, we propose policy-based flow models ($\pi$-Flow). $\pi$-Flow modifies the output layer of a student flow model to predict a network-free policy at one timestep. The policy then produces dynamic flow velocities at future substeps with negligible overhead, enabling fast and accurate ODE integration without extra network evaluations. To match the policy's ODE trajectory to the teacher's, we introduce a novel imitation distillation approach, which matches the policy's velocity to the teacher's along the policy's trajectory using a standard $\ell_2$ flow matching loss. By simply mimicking the teacher's behavior, $\pi$-Flow enables stable and scalable training and avoids the quality--diversity trade-off.
