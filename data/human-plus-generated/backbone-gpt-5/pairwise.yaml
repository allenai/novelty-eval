    0: 'We introduce Minimax Line-Search (MiLS), a distributionally robust mechanism for choosing step-sizes in first-order optimization. MiLS formulates each update as a minimax problem over a local quadratic surrogate in which curvature and gradient noise are uncertain within an ambiguity set specified by spectral bounds and a streaming covariance estimate. Solving this inner problem yields a closed-form shrinkage of a preconditioned gradient step that is provably descent-seeking under unknown smoothness and heavy-tailed stochasticity. MiLS unifies and robustifies classical rules: it collapses to Armijo under Lipschitz-only uncertainty, to Barzilai–Borwein on deterministic quadratics, and to Polyak’s step when a reliable objective floor is available, while providing principled behavior between these regimes. The construction extends to composite objectives via a robust proximal mapping and to saddle-point problems via a robust extragradient correction. A lightweight implementation maintains online curvature and noise surrogates and computes steps without function evaluations, yielding scale-free updates compatible with diagonal or low-rank preconditioners. MiLS offers a principled alternative to heuristic scheduling and adaptive methods, bringing distributionally robust optimization to the core of step-size selection.'
    1: 'Dynamically configuring algorithm hyperparameters is a fundamental challenge in computational intelligence. While learning-based methods offer automation, they suffer from prohibitive sample complexity and poor generalization. We introduce AutoEP, a novel framework that bypasses training entirely by leveraging Large Language Models (LLMs) as zero-shot reasoning engines for algorithm control. AutoEP''s core innovation lies in a tight synergy between two components: (1) an online Exploratory Landscape Analysis (ELA) module that provides real-time, quantitative feedback on the search dynamics, and (2) a multi-LLM reasoning chain that interprets this feedback to generate adaptive hyperparameter strategies. This approach grounds high-level reasoning in empirical data, mitigating hallucination. By decoupling reasoning from training, AutoEP presents a powerful and accessible new paradigm for automated hyperparameter design.'
