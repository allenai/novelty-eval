    0: Open-ended segmentation requires models capable of generating free-form descriptions of previously unseen concepts and regions. Despite advancements in model development, current evaluation protocols for open-ended segmentation tasks fail to capture the true semantic accuracy of the generated descriptions. We empirically demonstrate that embedding‐based similarity score mappings diverge significantly from human judgments. To address this issue, we introduce a novel mapping function that considers multiple lexical relationships between free‐form outputs and test‐vocabulary labels, yielding much closer alignment with human annotations. We integrate this mapping into a robust evaluation framework. Additionally, we present the first Multi-modal Large‐Language Model trained with a contrastive objective to jointly align visual regions and textual descriptions for open‐ended panoptic segmentation.
    1: 'As static benchmarks saturate and leak into training corpora, they drift from measuring generalization to measuring dataset familiarity. We introduce Counterfactual Families, a programmatic benchmark design that evaluates models by their invariance to explicitly controlled interventions rather than by point accuracy on a fixed test set. Each example lives in a small intervention graph: semantically aligned variants created by minimal edits that toggle hypothesized nuisance factors, invert spurious cues, or manipulate evidence locality, while preserving task-defining semantics. A policy-driven evaluator samples variants adaptively conditioned on a model’s predictions, generating targeted probes that map failure surfaces with a bounded query budget. Metrics summarize causal sensitivity—e.g., effect-of-intervention and spurious elasticity—into a compact generalization profile. A declarative schema specifies concepts, edit operators, and validity invariants, enabling reproducible generators across text, vision, and tabular domains. Cryptographically seeded generation prevents contamination and supports versioned, durable leaderboards. By shifting the unit of evaluation from instances to intervention families, our framework turns benchmarks into instruments for diagnosing shortcut reliance, robustness, and data-centric improvements, offering a path to sustainable, informative evaluation even as models and pretraining corpora evolve.'
