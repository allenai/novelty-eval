    0: 'In this paper, we identify that the key criterion for determining whether a model is truly capable of novel view synthesis (NVS) is transferability: Whether any pose representation extracted from one video sequence can be used to re-render the same camera trajectory in another. We analyze prior work on self-supervised NVS and find that their predicted poses do not transfer: The same set of poses lead to different camera trajectories in different 3D scenes. Here, we present XFactor, the first geometry-free self-supervised model capable of true NVS. XFactor combines pair-wise pose estimation with a simple augmentation scheme of the inputs and outputs that jointly enables disentangling camera pose from scene content and facilitates geometric reasoning. Remarkably, XFactor achieves transferability with unconstrained latent pose variables, without any 3D inductive biases or concepts from multi-view geometry — such as an explicit parameterization of poses as elements of SE(3). We introduce a new metric to quantify transferability.'
    1: Modern multimodal models align vision, audio, and language in a shared embedding space, yet they lack an event-centric substrate that handles asynchrony, source overlap, and missing sensors. We introduce PolyChord, a differentiable event algebra for multimodal streams. Each modality is segmented online into event tokens by predictive boundary discovery. A transport-warp layer performs global-to-local alignment across modalities using entropic optimal transport with monotonicity constraints, yielding a dynamic event graph. PolyChord attaches small generative decoders to each node, enabling counterfactual completion of absent modalities and interventional training that enforces subset-consistent predictions. Tasks are written as short query programs over the graph—compose, mask, split, and shift—then compiled into attention and alignment operators, making the same backbone applicable to video question answering, audiovisual separation, narration, and cross-modal retrieval. The algebra naturally extends to new sensors (e.g., depth, IMU, haptics) via plug-in adapters calibrated by cross-modal cycle potentials. PolyChord turns multimodal learning from static fusion into programmable event reasoning, supporting fine-grained evidence attribution by citing the subgraph that answered a query and robust operation under latency, drift, and partial observability.
