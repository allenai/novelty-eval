    0: We introduce CausalPatch, a programmatic counterfactual benchmark generator that converts existing datasets into interventional test suites designed to disentangle causal competence from shortcut learning. CausalPatch defines a factor taxonomy per domain and learns an edit graph that maps named factors (e.g., color, tense, instrument, topology) to constrained generative operations, yielding paired or chained counterfactuals that hold non-target attributes invariant. An automatic auditor validates edit minimality and semantic fidelity via metamorphic checks, causal probes, and round-trip reconstruction, issuing an intervention certificate with provenance for each example. The framework exposes evaluation protocols that score invariance to single-factor interventions, compositional generalization across multi-factor edits, calibration under interventions, and rationale consistency by aligning explanations with the manipulated factors. To mitigate contamination and leaderboard gaming, CausalPatch derives test instances from private edit seeds and provides API-gated access rather than static releases. By decoupling content from controllable factors and standardizing reusable edit programs across text, vision, audio, and code, CausalPatch turns saturated leaderboards into living diagnostics of causal generalization and data curation choices.
    1: Precise, object-aware control over visual content is essential for advanced image editing and compositional generation. Yet, most existing approaches operate on entire images holistically, limiting the ability to isolate and manipulate individual scene elements. In contrast, layered representations, where scenes are explicitly separated into objects, environmental context, and visual effects, provide a more intuitive and structured framework for interpreting and editing visual content. To bridge this gap and enable both compositional understanding and controllable editing, we introduce the Referring Layer Decomposition (RLD) task, which predicts complete RGBA layers from a single RGB image, conditioned on flexible user prompts, such as spatial inputs (e.g., points, boxes, masks), natural language descriptions, or combinations thereof. At the core is the RefLade, a large-scale dataset comprising 1.11M image–layer–prompt triplets produced by our scalable data engine, along with 100K manually curated, high-fidelity layers. Coupled with a perceptually grounded, human-preference-aligned automatic evaluation protocol, RefLade establishes RLD as a well-defined and benchmarkable research task. Building on this foundation, we present RefLayer, a simple baseline designed for prompt-conditioned layer decomposition, achieving high visual fidelity and semantic alignment.
