  ideas:
    0: "The Private Aggregation of Teacher Ensembles (PATE) framework enables privacy-preserving machine learning by aggregating responses from disjoint subsets of sensitive data. Adaptations of PATE to tasks with inherent output diversity such as text generation, where the desired output is a sample from a distribution, face a core tension: \nas diversity increases, samples from different teachers are less likely to agree, but lower agreement results in reduced utility for the same privacy requirements. Yet suppressing diversity to artificially increase agreement is undesirable, as it distorts the output of the underlying model, and thus reduces output quality.\n\nWe propose Hot PATE, a variant of PATE designed for diverse generative settings. \nWe formalize the notion of a *diversity-preserving* *ensemble sampler* and introduce an efficient sampler that provably transfers diversity without incurring additional privacy cost.\nHot PATE requires only API access to proprietary models and can be used as a drop-in replacement for existing *Cold* PATE samplers."
    1: 'AI systems increasingly mediate sensitive decisions, yet alignment mechanisms remain opaque, hard to audit across communities, and entangled with private data. We introduce PC-Align, a framework in which every model output is accompanied by a succinct zero-knowledge certificate of compliance with a stakeholder-defined policy. PC-Align comprises: (i) a declarative NormSpec language that encodes safety, fairness, and privacy constraints, including group-conditional risk bounds and PII redaction rules; (ii) a compiler that produces SNARK-verifiable guardrail circuits and differentiable surrogates used during training; (iii) a participatory, differentially private preference aggregation module that instantiates NormSpec parameters via fairness-aware social choice; and (iv) sliding-window fairness ledgers that support verifiable, privacy-preserving auditing across interactions. At inference, models interact with guardrails that compute certified upper bounds on toxicity and disparity metrics and emit a zero-knowledge proof that the released response satisfies the active constitution without exposing user inputs or model internals. Training-time DP attestations bind ε-budgets to model checkpoints via remote attestation. PC-Align operationalizes alignment as proof, enabling portable, machine-checkable assurances of safety, fairness, and privacy under normative pluralism.'
