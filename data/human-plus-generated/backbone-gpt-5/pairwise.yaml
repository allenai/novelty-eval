    0: Signals on graphs, meshes, and cell complexes often inhabit local frames—tangent vectors, orientations, differential forms—whose comparisons must respect gauge choices and global topology. Yet current GNNs and graph transformers treat features in a common Euclidean chart, ignoring parallel transport and cycle structure. We introduce BundleFormer, a general-purpose attention mechanism over fiber bundles that unifies learning across discrete geometries. Query-key comparisons are performed after parallel transporting keys/values to the query fiber using a learned, geometry-aware discrete connection, yielding built-in equivariance to local frame changes and stability to re-meshing. A cycle-aware pathway aggregates messages along homotopy classes and injects holonomy embeddings, allowing long-range reasoning that is sensitive to topology while remaining gauge consistent. The framework extends to k-forms via discrete exterior calculus, enabling simultaneous learning on nodes, edges, and higher-dimensional cells. We provide a sheaf-theoretic formulation that enforces compatibility on overlaps and a cohomological regularizer that suppresses spurious curvature. BundleFormer serves as a drop-in backbone for data defined on graphs and other topological discretizations, bridging geometric priors with transformer expressivity.
    1: 'Equivariant Neural Networks (ENNs) have empowered numerous applications in scientific fields. Despite their remarkable capacity for representing geometric structures, ENNs suffer from degraded expressivity when processing symmetric inputs: the output representations are invariant to transformations that extend beyond the input''s symmetries. The mathematical essence of this phenomenon is that a symmetric input, after being processed by an equivariant map, experiences an increase in symmetry. While prior research has documented symmetry increase in specific cases, a rigorous understanding of its underlying causes and general reduction strategies remains lacking. In this paper, we provide a detailed and in-depth characterization of symmetry increase together with a principled framework for its reduction: (i) For any given feature space and input symmetry group, we prove that the increased symmetry admits an infimum determined by the structure of the feature space; (ii) Building on this foundation, we develop a computable algorithm to derive this infimum, and propose practical guidelines for feature design to prevent harmful symmetry increases. (iii) Under standard regularity assumptions, we demonstrate that for most equivariant maps, our guidelines effectively reduce symmetry increase.'
