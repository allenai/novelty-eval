    0: The probabilistic diffusion model (DM), generating content by inferencing through a recursive chain structure, has emerged as a powerful framework for visual generation. After pre-training on enormous data, the model needs to be properly aligned to meet requirements for downstream applications. How to efficiently align the foundation DM is a crucial task. Contemporary methods are either based on Reinforcement Learning (RL) or truncated Backpropagation (BP). However, RL and truncated BP suffer from low sample efficiency and biased gradient estimation, respectively, resulting in limited improvement or, even worse, complete training failure. To overcome the challenges, we propose the Recursive Likelihood Ratio (RLR) optimizer, a Half-Order (HO) fine-tuning paradigm for DM. The HO gradient estimator enables the computation graph rearrangement within the recursive diffusive chain, making the RLR's gradient estimator **an unbiased one with lower variance** than other methods. We theoretically investigate the bias, variance, and convergence of our method. Furthermore, we propose a novel prompt technique that is natural for the RLR to achieve a synergistic effect.
    1: We introduce Lagrange-Projected Diffusion (LPD), a plug-in constrained sampler for pretrained score-based and diffusion models. At each sampling step, LPD solves a lightweight KKT system to obtain Lagrange multipliers that project the score onto the tangent cone of a differentiable constraint set, while a temperature-scheduled logarithmic barrier drives residuals to zero as noise decays. This primal–dual guidance enforces both equality and inequality constraints, composes across independent specifications, and extends to set-level moment constraints by sharing dual variables across a batch. LPD requires no retraining and treats symbolic policies compiled to differentiable programs as first-class constraints, enabling hard control of counts, geometry, physics, and fairness properties across modalities. We further propose a feasibility-aware timestep schedule and a constraint curriculum that stabilize trajectories under stiff specifications. The framework recovers popular guidance methods as special cases and links constrained generation to variational inequality theory, offering a principled route to safe, compliant, and editable generative modeling with general-purpose foundation models.
