  ideas:
    0: 'Medical question answering (QA) benchmarks often focus on multiple-choice or fact-based tasks, leaving open-ended answers to real patient questions underexplored. This gap is particularly critical in mental health, where patient questions often mix symptoms, treatment concerns, and emotional needs, requiring answers that balance clinical caution with contextual sensitivity.

      We present CounselBench, a large-scale benchmark developed with 100 mental health professionals to evaluate and stress-test large language models (LLMs) in realistic help-seeking scenarios. The first component, CounselBench-EVAL, contains 2,000 expert evaluations of answers from GPT-4, LLaMA 3, Gemini, and online human therapists on patient questions from the public forum CounselChat. Each answer is rated across six clinically grounded dimensions, with span-level annotations and written rationales. To probe failure modes more directly, we construct CounselBench-Adv, an adversarial dataset of 120 expert-authored mental health questions designed to trigger specific model issues. Together, CounselBench establishes a clinically grounded framework for benchmarking LLMs in mental health QA.'
    1: We introduce Proof-of-Freshness Benchmarks (PoF-Bench), a benchmark-as-a-process that generates leakage-resilient, auditable test sets at evaluation time. PoF-Bench decouples benchmark content from benchmark specification via a declarative DSL that defines task families, constraints, and difficulty schedules across text, code, tabular, and multimodal settings. A sealed-seed protocol combines public randomness beacons with verifiable delay functions and code-commit hashes to mint instances only after a model snapshot is cryptographically registered, preventing pre-exposure and anchoring results to a reproducible ledger. Each item is accompanied by a provenance transcript—documenting generator version, seed, licenses, and de-duplication witnesses—enabling transparent audits without revealing items before evaluation. Controlled drift is modeled by generator-level perturbations, allowing longitudinal measurement of robustness under shifts in content, style, and compositional complexity. PoF-Bench includes reliability tooling grounded in item-response theory to calibrate difficulty and detect saturation, and supports safe post-hoc release of instances with embedded watermarks for downstream research. By turning benchmarks into verifiable processes rather than static corpora, PoF-Bench establishes a principled path to freshness, fairness, and enduring headroom in a world of rapidly scaling models.
