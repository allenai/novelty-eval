  ideas:
    0: Aligning foundation models to societal expectations demands coherence across fairness, safety, and privacy, yet current alignment pipelines fragment these concerns and provide little auditability. We introduce CiviGuard, a proof-carrying alignment framework that fuses differentially private preference learning with group-robust risk control and machine-checkable compliance at inference. A DP social-choice aggregator distills heterogeneous rater judgments into a normative prior while obscuring individual contributions. This prior parameterizes a constrained reward model whose objectives combine safety predicates and fairness regularizers via coherent risk measures to minimize worst-group tail harm. Fine-tuning proceeds with a primal–dual objective that enforces these constraints while preserving utility. At inference, a lightweight verifier accompanies generation, synthesizing a compact certificate that specific safety, privacy, and parity obligations were satisfied, or documenting minimally invasive edits applied by a corrective “shield.” Certificates are checkable by independent auditors and composable across deployments, enabling traceable, policy-adjustable alignment without retraining. By linking privacy-preserving preference formation, distributionally robust fairness, and provable run-time safeguards, CiviGuard reframes alignment as an accountable, certifiable process rather than a one-shot tuning stage.
    1: How can large language models (LLMs) serve users with varying preferences that may conflict across cultural, political, or other dimensions? To advance this challenge, this paper establishes four key results. First, we demonstrate, through a large-scale multilingual human study with representative samples from five countries (N=15,000), that humans exhibit substantially more variation in preferences than the responses of state-of-the-art LLMs. Second, we show that existing methods for preference dataset collection are insufficient for learning the diversity of human preferences even along two of the most salient dimensions of variability in global values, due to the underlying homogeneity of candidate responses. Third, we argue that this motivates the need for _negatively-correlated sampling_ when generating candidate sets, and we show that simple prompt-based techniques for doing so greatly enhance the ability of alignment methods to learn heterogeneous preferences. Fourth, based on this novel candidate sampling approach, we collect and open-source _Community Alignment_, the largest and most representative multilingual and multi-turn preference dataset to date, featuring 233,319 comparisons from annotators spanning five countries. Overall, we hope that the Community Alignment dataset will be a valuable resource for improving the effectiveness of LLMs for a diverse global population.
