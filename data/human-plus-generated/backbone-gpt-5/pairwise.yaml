    0: The Lipschitz bandit problem extends stochastic bandits to a continuous action set defined over a metric space, where the expected reward function satisfies a Lipschitz condition. In this work, we introduce a new problem of Lipschitz bandit in the presence of stochastic delayed feedback, where the rewards are not observed immediately but after a random delay. We consider both bounded and unbounded stochastic delays, and design algorithms that attain sublinear regret guarantees in each setting. For bounded delays, we propose a delay-aware zooming algorithm that retains the optimal performance of the delay-free setting up to an additional term that scales with the maximum delay $\tau_{\max}$. For unbounded delays, we propose a novel phased learning strategy that accumulates reliable feedback over carefully scheduled intervals, and establish a regret lower bound showing that our method is nearly optimal up to logarithmic factors.
    1: Robust generalization in reinforcement learning is hindered by spurious correlations that bind actions to environment specifics, producing brittle behavior under dynamics and reward shifts. We introduce Counterfactual Invariant Policy Optimization (CF-IPO), a model-based RL framework that learns a latent structural causal model (SCM) of the environment from trajectories and uses it to synthesize interventional counterfactuals. The SCM decomposes dynamics and rewards into modular mechanisms; policy-driven perturbations and contrastive objectives separate stable parents of return from nuisance factors. CF-IPO trains a policy against a worst-case mixture over counterfactual worlds obtained by resampling nuisance mechanisms while holding stable latents fixed, yielding an objective that maximizes return subject to an invariance constraint on occupancy-weighted action values. A practical algorithm couples amortized inference over latent variables with a reweighted off-policy gradient estimator and a Lagrangian that enforces invariance without access to ground-truth interventions. The approach bridges domain randomization and distributionally robust RL with learned structure, aiming to deliver policies that transfer across dynamics and reward shifts, support offline-to-online fine-tuning, and preserve sample efficiency through model reuse.
