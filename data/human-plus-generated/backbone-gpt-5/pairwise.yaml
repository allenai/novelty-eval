    0: 'The rapid progress of AI and robotics may profoundly transform society, as humans and robots begin to coexist in shared communities, bringing both opportunities and challenges. To explore this future, we present Virtual Community—an open-world platform for humans, robots, and society—built on a universal physics engine and grounded in real-world 3D scenes. With Virtual Community, we aim to enable the study of embodied social intelligence at scale. To support these, Virtual Community features: 1) An open-source multi-agent physics simulator that supports robot, human, and their interactions within a society; 2) A large‑scale, real‑world aligned environment generation pipeline, including vast outdoor space, diverse indoor scenes, and a community of grounded agents with rich characters and appearances. Leveraging Virtual Community, we propose two novel challenges. The Community Planning Challenge evaluates multi‑agent reasoning and planning in open‑world settings, such as cooperating to help agents with daily activities and efficiently connecting other agents. The Community Robot Challenge requires multiple heterogeneous robots to collaborate in solving complex open‑world tasks. We have open-sourced our project and hope that Virtual Community will unlock further study of human-robot coexistence in open worlds.'
    1: Benchmark scores for foundation models are increasingly confounded by undisclosed training corpora, near-duplicate leakage, and rapid saturation of static test suites. We introduce ZK-Bench, a provenance-aware benchmark format and audit protocol that attaches cryptographically verifiable non-membership and novelty certificates to every test instance and model submission. ZK-Bench pairs content-defined canonicalization and locality-sensitive hashing to track semantic near-duplicates with a privacy-preserving private set intersection and zero-knowledge proof pipeline that lets participants attest that their training data does not contain (or is provably bounded to contain) the benchmark distribution without revealing the corpus. Each release includes versioned seeds, canonicalization code, salt commitments, and temporal metadata, enabling reproducible evolution while keeping instances hidden pre-submission. Leaderboard entries are accompanied by a leakage risk index, capability coverage map, and license compliance report derived from instance-level provenance. The protocol generalizes across text, image, audio, and code via modality-specific canonicalizers and chunkers. By shifting benchmarks from static artifacts to verifiable contracts between curators and submitters, ZK-Bench restores trust in comparative evaluation and creates incentives for transparent data governance.
