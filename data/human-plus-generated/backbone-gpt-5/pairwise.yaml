    0: 'Contemporary multimodal models often homogenize inputs into text-like tokens or rely on pairwise contrastive alignment, limiting robustness to asynchrony, variable sampling rates, and fine-grained causal structure across vision, audio, language, and other modalities (e.g., haptics, biosignals). We introduce OmniTransport, a modality-agnostic framework that represents heterogeneous signals as sparse event measures on a shared latent manifold and learns phase-equivariant transport maps between them. Encoders emit time- and space-stamped atoms with typed attributes (e.g., pitch, motion, force) whose mass is conserved; a transport transformer parameterizes Monge maps that align and translate event distributions while respecting symmetries such as time shift, time–scale, rotation, and intensity reparameterizations. Self-supervision couples three principles: cycle-transport consistency (A→B→A preserves events), interventional robustness (synthetic edits induce predictable transport), and conservation constraints that regularize hallucination. By composing transports rather than retraining per pair, the resulting representation enables a unified suite of applications—cross-modal retrieval, dubbing and lip-sync, audio-driven animation, video-to-text grounding, tactile-audio-vision fusion, and counterfactual editing. OmniTransport reframes multimodal learning as equivariant optimal transport over event measures, offering a scalable path to interoperable models that reason about, generate, and edit across modalities.'
    1: Large vision–language models (VLMs) deliver state-of-the-art results on a wide range of multimodal tasks, yet they remain prone to visual hallucinations, producing content that is not grounded in the input image. Despite progress with visual supervision, reinforcement learning, and post-hoc attention reshaping, the representational origins of hallucinations remain unclear. Our study reveals that successful grounding emerges when adjacent visual tokens exhibit coherent alignment, while hallucinations arise when key vectors scatter isotropically, weakening cross-modal attention and blurring object boundaries. Building on this insight, we propose Depth and Spatial aware Cache Refinement (DSCR), a lightweight and training-free method that augments the Transformer's key-value (KV) cache with depth cues and 2D spatial proximity. DSCR clusters vectors within objects and separates those across surfaces, guiding attention toward relevant regions without any fine-tuning. Our findings highlight KV-coherence as a core factor behind hallucinations and demonstrate a practical, model-agnostic solution for enhancing VLM reliability.
