  ideas:
    0: 'Frontier language models generate fluent content but cannot natively guarantee factuality, provenance, or policy compliance. We propose Proof-Carrying Generation (PCG), an inference-time framework that couples content tokens with a synchronized attestation stream expressed in a small typed justification language. The attestation stream declares proof obligations—retrieval citations, executable computations, logical entailments, or policy checks—that must be discharged by a pluggable verifier runtime invoking tools, structured retrieval, and formal or statistical validators. Decoding is reformulated as attestation-constrained search: content tokens are only committed when their accompanying obligations are satisfied; otherwise the search backtracks or explores alternative justifications under a verification budget. A lightweight training recipe aligns models to emit faithful attestations via instruction tuning and contrastive “proof dropout,” while preserving base capabilities through parameter-efficient adapters. PCG yields audit-ready artifacts (derivation traces, data lineage, and policy witnesses), composes with existing tool-use and retrieval pipelines, and supports partial proofs with uncertainty budgets. By making verifiability a hard constraint rather than a post-hoc filter, PCG turns powerful but opaque generators into accountable, provenance-attesting systems.'
    1: Measuring the in-context computational effort of language models is a key challenge, as metrics like next-token loss fail to capture reasoning complexity. Prior methods based on latent state compressibility can be invasive and unstable. We propose Multiple Token Divergence (MTD), a simple measure of computational effort defined as the KL divergence between a model's full output distribution and that of a shallow, auxiliary prediction head. MTD can be computed directly from pre-trained models with multiple prediction heads, requiring no additional training. Building on this, we introduce Divergence Steering, a novel decoding method to control the computational character of generated text. MTD provides a practical, lightweight tool for analyzing and steering the computational dynamics of language models.
