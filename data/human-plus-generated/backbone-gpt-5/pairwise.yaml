    0: Camera-centric understanding and generation are two cornerstones of spatial intelligence, yet they are typically studied in isolation. We present Puffin, a unified camera-centric multimodal model that extends spatial awareness along the camera dimension. Puffin integrates language regression and diffusion-based generation to interpret and create scenes from arbitrary viewpoints. To bridge the modality gap between cameras and vision-language, we introduce a novel paradigm that treats camera as language, enabling thinking with camera. This guides the model to align spatially grounded visual cues with photographic terminology while reasoning across geometric context. Puffin is trained on Puffin-4M, a large-scale dataset of 4 million vision-language-camera triplets. We incorporate both global camera parameters and pixel-wise camera maps, yielding flexible and reliable spatial generation. With instruction tuning, Puffin generalizes to diverse cross-view tasks such as spatial imagination, world exploration, and photography guidance. We will release the code, models, dataset pipeline, and benchmark to advance multimodal spatial intelligence research.
    1: Foundation models now span vision, audio, language, and beyond, yet they passively consume inputs and ignore the decision problem of what to observe next under resource constraints. We recast multimodal inference as sequential evidence acquisition and introduce MetaSense, a modality-agnostic planner that selects the next modality, view, or operation to query to minimize task uncertainty within a budget. Candidate acquisitions are expressed as typed operators (e.g., crop this region, listen for 0.5 s, retrieve a knowledge snippet) and scored by an amortized information-gain estimator built atop a probabilistic, promptable backbone. Low-cost previews provide coarse glimpses that approximate the expected reduction in posterior entropy without committing to full acquisition. The planner and backbone are trained jointly via self-supervised masking on unlabeled multimodal streams, while a plug-in type system permits adding new modalities with only an encoder and previewer. At test time, MetaSense yields anytime predictions and adaptive query schedules that gracefully handle missing or corrupted inputs. This framing unifies active perception, retrieval, and tool use as a single decision process across computer vision, audio, language, and other modalities, moving toward deployable assistants that reason not only over given evidence but also over which measurements to collect next.
