    0: 'Mixture-of-Experts (MoE) architectures have demonstrated remarkable capabilities and scalability for large language models, but incur a substantial memory footprint due to redundant expert parameters. Existing compression approaches, particularly those based on low-rank decomposition, typically operate at the granularity of individual experts. However, such per-expert methods neglect structural redundancies shared across experts, limiting their compression efficiency and effectiveness. In this work, we introduce TD-MoE (Tensor Decomposition for MoE Compression), a data-aware method that jointly factorizes expert weights by capturing global dependencies. Our contributions are threefold: (i) Cross-expert tensorization with joint three-dimensional decomposition, which unifies all experts within a layer into a single tensor and captures shared structure beyond per-expert scope; (ii) A multi-linear whitening strategy, which decorrelates input and output features, yielding a more balanced and data-adaptive decomposition; (iii) A three-dimensional rank allocation mechanism, which dynamically assigns 3D decomposition ranks across dimensions to best meet a target compression ratio while minimizing the reconstruction error.'
    1: Multimodal models have advanced rapidly, yet most couple a fixed set of encoders and implicitly entangle sensor idiosyncrasies with semantics, hindering extensibility beyond vision, audio, and text. We propose Operator-Parameterized World Modeling (OPWM), a framework that factors perception into a shared world token space and modality-specific measurement operators. OPWM learns discrete, object- and event-centric tokens that serve as a canonical scene representation. Each modality—images, audio, language, or unconventional signals such as radar, tactile, or biosignals—interfaces through a lightweight operator header that encodes symmetries, coordinates, sampling, and physical units. This header conditions a universal transformer to de-render observations into world tokens and re-render them into other modalities. Training couples masked modeling with orbit-aware contrastive transport and cycle consistency across operator compositions, promoting invariance to sensor geometry while preserving cross-modal causality. New modalities are added by specifying operator metadata and adapting only the header, enabling programmatic cross-modal reasoning, synthesis, and alignment without redesigning the core. OPWM reframes multimodality as operator composition, offering a principled, expandable path toward physics-informed foundation models applicable across computer vision, audio understanding, language grounding, and emerging sensory domains.
