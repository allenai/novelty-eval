    0: Evaluating tabular generators remains a challenging problem, as the unique causal structural prior of heterogeneous tabular data does not lend itself to intuitive human inspection. Recent work has introduced structural fidelity as a tabular-specific evaluation dimension to assess whether synthetic data complies with the causal structures of real data. However, existing benchmarks often neglect the interplay between structural fidelity and conventional evaluation dimensions, thus failing to provide a holistic understanding of model performance. Moreover, they are typically limited to toy datasets, as quantifying existing structural fidelity metrics requires access to ground-truth causal structures, which are rarely available for real-world datasets. In this paper, we propose a novel evaluation framework that jointly considers structural fidelity and conventional evaluation dimensions. We introduce a new evaluation metric, global utility, which enables the assessment of structural fidelity even in the absence of ground-truth causal structures. In addition, we present TabStruct, a comprehensive evaluation benchmark offering large-scale quantitative analysis on 13 tabular generators from nine distinct categories, across 29 datasets.
    1: InvariaBench is a declarative framework for building counterfactual benchmarks that measure robustness along explicitly encoded invariance axes. Domain experts write executable invariance contracts that specify which factors may be intervened upon and which task semantics must remain stable; a compiler coordinates modality-specific editors—diffusion-based image editing, structured text rewriting, and procedural rendering—to synthesize matched counterfactual packs from seed data. Semantic preservation is enforced via verifier models and lightweight human checks formalized as metamorphic tests, while coverage planners target confounders and rare compositions systematically. Evaluation is reframed as tracing a stability frontier over intervention strength and density, comparing models by their consistency under specified causal perturbations rather than on a single i.i.d. split. To mitigate contamination and gaming without sacrificing reproducibility, held-out tests are generated per submission from public grammars with deterministic seeds and auditable provenance logs. Reference instantiations span vision, language, and tabular settings, and reusable templates enable communities to author domain-specific invariance grammars, yielding transparent, continually renewing datasets and benchmarks.
