  ideas:
    0: 'We propose PathPAC, a PAC-Bayesian framework on path space that explains generalization through the law of the optimization dynamics rather than the final parameters. Modeling stochastic gradient methods as time-inhomogeneous controlled diffusions, we choose as a prior the data-independent diffusion with the same initialization and noise schedule, and as a posterior the data-driven process whose drift is given by stochastic gradients. Via Girsanov’s theorem, the pathwise KL divergence collapses to an interpretable energy integral of squared, noise-normalized drift accumulated along training. The resulting bounds are trajectory-aware: they adapt to learning rate schedules, gradient clipping, label noise, data augmentation randomness, and curvature through local quadratic expansions that recover norm-, margin-, and sharpness-based criteria as special cases. By relating pathwise KL to influence of single-example perturbations, PathPAC unifies PAC-Bayes and on-average stability, offering a common lens on early stopping and the flatness–noise interplay. The theory yields actionable design principles—noise shaping and schedule selection as complexity control—that predict regimes of benign overfitting and suggest new regularizers targeting path energy.'
    1: We develop a theory of transfer learning in infinitely wide neural networks under gradient flow that quantifies when pretraining on a source task improves generalization on a target task. We analyze both (i) fine-tuning, when the downstream predictor is trained on top of source-induced features and (ii) a jointly rich setting, where both pretraining and downstream tasks can operate in a feature learning regime, but the downstream model is initialized with the features obtained after pre-training. In this setup, the summary statistics of randomly initialized networks after a rich pre-training are adaptive kernels which depend on both source data and labels. For (i), we analyze the performance of a readout for different pretraining data regimes. For (ii), the summary statistics after learning the target task are still adaptive kernels with features from both source and target tasks. Our theory allows interpretable conclusions on performance, which depend on the amount of data on both tasks, the alignment between tasks, and the feature learning strength.
