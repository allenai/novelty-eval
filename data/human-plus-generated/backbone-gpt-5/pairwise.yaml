    0: 'A fundamental challenge in offline reinforcement learning is distributional shift. Scarce data or datasets dominated by out-of-distribution (OOD) areas exacerbate this issue. Our theoretical analysis and experiments show that the standard squared error objective induces a harmful TD cross covariance. This effect amplifies in OOD areas, biasing optimization and degrading policy learning. To counteract this mechanism, we develop two complementary strategies: partitioned buffer sampling that restricts updates to localized replay partitions, attenuates irregular covariance effects, and aligns update directions, yielding a scheme that is easy to integrate with existing implementations, namely Clustered Cross-Covariance Control for TD ($C^4$). We also introduce an explicit gradient-based corrective penalty that cancels the covariance induced bias within each update. We prove that buffer partitioning preserves the lower bound property of the maximization objective, and that these constraints mitigate excessive conservatism in extreme OOD areas without altering the core behavior of policy constrained offline reinforcement learning.'
    1: We introduce Speculative Control, a draft-and-verify framework that amortizes expensive planning for real-time reinforcement learning. A fast “drafter” proposes multi-step action prefixes with confidence estimates, while a slower “verifier” (trusted planner or conservative value ensemble) certifies the longest safe prefix under a pessimistic return bound or returns a corrected plan. Accepted prefixes execute without further verification, and rejected drafts generate counterfactual preferences that train the drafter at the decision boundary, expanding the verified region over time. An adaptive acceptance rule jointly trades off compute, regret, and risk, and a scheduler tunes prefix lengths to satisfy latency budgets. Acceptance is formalized as a trust set derived from conformal-calibrated Q-intervals, yielding distribution-free, coverage-style guarantees under mild exchangeability assumptions. The framework integrates seamlessly with model-based and model-free agents, supports verifiable safety constraints, and extends to multi-agent coordination via joint draft certification. By turning high-quality planners into amortized decision oracles, Speculative Control delivers anytime, budget-aware policies for long-horizon, safety-critical control.
