    0: Learning-based surrogates for physical systems often violate the structure of thermodynamics, leading to unphysical behavior and poor transfer across conditions. We introduce ThermoDual, a general framework that learns convex neural potentials from heterogeneous measurements and uses differentiable Legendre transforms to guarantee cross-ensemble consistency. Our model parameterizes a free-energy functional with input sufficient statistics (e.g., temperature, composition, strain, chemical potentials) via input-convex architectures. Constitutive relations and equations of state are obtained as gradients and Hessians, making Maxwell identities and Onsager reciprocity hold by construction and ensuring non-negative entropy production. A Fenchel–Young training objective aligns predicted work/heat budgets with calorimetry, spectroscopy, and simulation observables while quantifying uncertainty through convex energy flows. ThermoDual couples to conservation-law solvers through a variational neural operator that supplies closures consistent with the learned thermodynamics, enabling counterfactual queries under changing driving fields, boundary conditions, or ensemble constraints. The resulting potentials act as reusable, interpretable building blocks for materials, electrolytes, and biochemical networks, supporting design and active experiment selection via sensitivity of free-energy landscapes. This approach aims toward foundation models for the physical sciences grounded in first principles rather than heuristics.
    1: 'We introduce Kolmogorov–Arnold Neural Operator (KANO), a dual‑domain neural operator jointly parameterized by both spectral and spatial bases with intrinsic symbolic interpretability. We theoretically demonstrate that KANO overcomes the pure-spectral bottleneck of Fourier Neural Operator (FNO): KANO remains expressive over a generic position-dependent dynamics for any physical input, whereas FNO stays practical only to spectrally sparse operators and strictly imposes fast-decaying input Fourier tail.'
