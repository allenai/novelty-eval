  ideas:
    0: The semantic similarity between sample expressions measures the distance between their latent `meaning'. These meanings are themselves typically represented by textual expressions. We propose a novel approach whereby the semantic similarity among textual expressions is based not on other expressions they can be rephrased as, but rather based on the imagery they evoke. While this is not possible with humans, generative models allow us to easily visualize and compare generated images, or their distribution, evoked by a textual prompt. Therefore, we characterize the semantic similarity between two textual expressions simply as the distance between image distributions they induce, or 'conjure.' We show that by choosing the Jeffreys divergence between the reverse-time diffusion stochastic differential equations (SDEs) induced by each textual expression, this can be directly computed via Monte-Carlo sampling. Our method contributes a novel perspective on semantic similarity that opens up new avenues for the evaluation of text-conditioned generative models while offering better interpretability of their learnt representations.
    1: We introduce PACT, a proof-carrying alignment framework that renders fairness, safety, privacy, and societal norms into composable, test-time contracts. PACT encodes normative requirements as differentiable verifiers with calibrated budgets (e.g., disparity, harm, and privacy epsilon) and trains a meta-controller to allocate these budgets per interaction under a social-choice prior capturing stakeholder preferences and jurisdictional rules. At inference, the base model is steered by the selected contract via lightweight adapters and shielding policies, then emits both its answer and a low-dimensional contract vector with a machine-checkable certificate stating which constraints were invoked, what budgets were spent, and why trade-offs were taken—without revealing sensitive data. The certificate enables after-the-fact auditing, consent tracking, and redress through counterfactual replay under alternative policies. By turning normative choices into portable, inspectable artifacts that travel with model outputs, PACT operationalizes society-in-the-loop governance and facilitates interoperable compliance across models and contexts without fixing a single value system.
