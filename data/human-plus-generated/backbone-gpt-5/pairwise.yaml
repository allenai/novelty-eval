    0: We propose SpecBench, a specification-first framework that recasts a benchmark as an executable measurement program. Instead of curating a static test set, a domain expert writes a declarative specification that encodes the intended construct, allowed resources, invariances, nuisance factors, difficulty schedules, and coverage targets. A compiler turns this specification into parameterized generators—procedural samplers, retrieval with time-frozen corpora, metamorphic transformers, and adversarial search—that mint a fresh, distribution-matched battery at evaluation time. Each item carries a cryptographic provenance receipt (seeds and source digests) enabling contamination audits and reproducible replays, while metamorphic property checks and nuisance-ablations provide automatic validity and reliability diagnostics. SpecBench reports family-robust scores that aggregate across controlled instance families and test–retest draws, emphasizing construct fidelity over single-split accuracy. By elevating benchmarks to auditable, regenerable programs with explicit measurement assumptions, SpecBench creates living datasets that resist overfitting, remain current as domains evolve, and make claims about what is being measured both transparent and falsifiable across language, vision, and multimodal tasks.
    1: 'Although Multimodal Large Language Models (MLLMs) have demonstrated proficiency in video captioning, practical applications require captions that follow specific user instructions rather than generating exhaustive, unconstrained descriptions. Current benchmarks, however, primarily assess descriptive comprehensiveness while largely overlook instruction-following capabilities. To address this gap, we introduce IF-VidCap, a new benchmark for evaluating controllable video captioning, which contains 1,400 high-quality samples. Distinct from existing video captioning or general instruction-following benchmarks, IF-VidCap incorporates a systematic framework that assesses captions on two dimensions: format correctness and content correctness.'
