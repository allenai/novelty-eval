    0: Static datasets struggle to assess modern models amid rapid saturation, contamination from web-scale pretraining, and limited coverage of systematic generalization. We propose FluxBench, a distributional benchmarking framework that replaces finite test sets with proof-carrying generative programs. Each benchmark is a small, auditable generator annotated with causal knobs (interventions, counterfactual toggles) and metamorphic invariants that specify semantics preserved under transformation. At evaluation time, a verifiable random function mints cryptographic seeds to instantiate ephemeral test streams, preventing advance leakage while ensuring reproducibility. A declarative mixture DSL composes generators into coverage-targeted suites, exposing axes such as compositional depth, long-tail rarity, and spurious-cue decoupling; embedded oracles certify the semantic correctness of synthesized instances. FluxBench tracks evolution as patches to distributions rather than file replacements, enabling longitudinal, comparable measurement under shifting data regimes. By aligning evaluation with controllable data-generating processes and verifiable test semantics, FluxBench turns benchmarks into living specifications of desired model behavior, supporting continual, anti-gaming assessment across modalities and tasks.
    1: 'The rapid development and widespread adoption of Audio Large Language Models (ALLMs) require a rigorous assessment of their trustworthiness. However, existing evaluation frameworks, primarily designed for text, are not equipped to handle the unique vulnerabilities introduced by audio''s acoustic properties. We find that significant trustworthiness risks in ALLMs arise from non-semantic acoustic cues, such as timbre, accent, and background noise, which can be used to manipulate model behavior. To address this gap, we propose AudioTrust, the first framework for large-scale and systematic evaluation of ALLM trustworthiness concerning these audio-specific risks. AudioTrust spans six key dimensions: fairness, hallucination, safety, privacy, robustness, and authentication. It is implemented through 26 distinct sub-tasks and a curated dataset of over 4,420 audio samples collected from real-world scenarios (e.g., daily conversations, emergency calls, and voice assistant interactions), purposefully constructed to probe the trustworthiness of ALLMs across multiple dimensions. AudioTrust employs human-validated automated pipelines to objectively and scalably quantify model outputs, offering critical insights into the secure and trustworthy deployment of future audio models.'
