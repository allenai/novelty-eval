    0: Contemporary multimodal systems collapse heterogeneous signals into a single sequence of tokens, obscuring structure and hampering fine-grained alignment and control. We present EventWeave, a universal event-centric intermediate representation and compiler stack for multi-modal learning and generation. Rather than aligning pixels, waveforms, and tokens in a monolithic latent space, EventWeave parses each input stream into a typed, timestamped graph of events (entities, motions, phonemes, beats, words) with continuous attributes and discrete labels learned from weak signals. Two learnable transducers—parsers and renderers—map between raw modalities and the shared event graph, enabling translation, editing, and composition across vision, audio, language, and additional sensors. Training couples self-supervised invariances (beat–motion synchrony, lip–phoneme agreement, text–referent consistency) with cycle-consistency over arbitrary modality subsets and modality dropout that forces abductive completion of missing streams. A streaming scheduler grows the graph online with latency-aware priorities, supporting real-time applications. Because all tasks operate by writing or reading events, the system exposes semantically meaningful handles for controllable generation, causal queries, and safety constraints. EventWeave reframes multimodal models as compilers to and from an editable world model, promising unified, interpretable, and transferable behavior across heterogeneous modalities.
    1: Video diffusion models (DMs) have enabled high-quality video synthesis. Yet, their substantial computational and memory demands pose serious challenges to real-world deployment, even on high-end GPUs. As a commonly adopted solution, quantization has proven notable success in reducing cost for image DMs, while its direct application to video DMs remains ineffective. In this paper, we present *QVGen*, a novel quantization-aware training (QAT) framework tailored for high-performance and inference-efficient video DMs under extremely low-bit quantization (*e.g.*, $4$-bit or below). We begin with a theoretical analysis demonstrating that reducing the gradient norm is essential to facilitate convergence for QAT. To this end, we introduce auxiliary modules ($\Phi$) to mitigate large quantization errors, leading to significantly enhanced convergence. To eliminate the inference overhead of $\Phi$, we propose a *rank-decay* strategy that progressively eliminates $\Phi$. Specifically, we repeatedly employ singular value decomposition (SVD) and a proposed rank-based regularization $\mathbf{\gamma}$ to identify and decay low-contributing components. This strategy retains performance while zeroing out additional inference overhead.
