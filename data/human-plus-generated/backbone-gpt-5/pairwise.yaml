    0: Stochastic optimizers in deep learning manage gradient noise heuristically, which hampers stability under nonstationarity and heterogeneous compute. We recast training as a filtering problem and introduce Kalman Descent, which explicitly infers the noise-free gradient and its uncertainty from minibatch observations. A linearized state-space model propagates the latent gradient across steps, with control inputs derived from local curvature evaluated through cheap Hessian–vector products. The resulting Kalman posterior provides both a mean direction and a covariance that serve, respectively, as the step and an uncertainty-calibrated, data-adaptive preconditioner; step sizes are chosen to guarantee a target contraction of posterior uncertainty, yielding automatic trust-region behavior. Special cases recover momentum and Adam when the dynamics and covariances are diagonal, while blockwise covariances connect to natural-gradient and Shampoo-like preconditioning. The information-form variant enables principled, bandwidth-aware fusion of updates across distributed workers by summing precisions instead of averaging gradients, and admits robust heavy-tailed noise models for outlier resistance. We analyze the algorithm as a stochastic control system and give stability and rate guarantees on quadratic objectives under nonstationary noise. The method requires only per-parameter or small-block statistics and occasional Hessian–vector products, making it practical for large-scale deep learning.
    1: 'The minimum-cost bipartite matching between two sets of points $R$ and $S$ in a metric space has a wide range of applications in machine learning, computer vision, and logistics. For instance, it can be used to estimate the $1$-Wasserstein distance between continuous probability distributions and for efficiently matching requests to servers while minimizing cost. However, the computational cost of determining the minimum-cost matching for general metrics spaces, poses a significant challenge, particularly in dynamic settings where points arrive over time and each update requires re-executing the algorithm. In this paper, given a fixed set $S$, we describe a deterministic algorithm that maintains, after $i$ additions to $R$, an $O(1/\delta^{0.631})$-approximate minimum-cost matching of cardinality $i$ between sets $R$ and $S$ in any metric space, with an amortized insertion time of $\widetilde{O}(n^{1+\delta})$ for adding points in $R$. To the best of our knowledge, this is the first algorithm for incremental minimum-cost matching that applies to arbitrary metric spaces.


      Interestingly, an important subroutine of our algorithm lends itself to efficient parallelization. We provide both a CPU implementation and a GPU implementation that leverages parallelism.'
