  ideas:
    0: 'Generalization guarantees for overparameterized learners typically appeal to parameter norms, flat minima, or algorithmic stability, yet they ignore the dominant structure observed in practice: training dynamics evolve in a low-dimensional, slowly varying subspace. We formalize this observation with a path-centric theory of learning. We define Trajectory Description Length (TDL)—the minimal code length required to reconstruct an algorithm’s parameter path up to a prescribed tolerance—and develop a PAC-Bayesian change-of-measure on path space that bounds the excess risk of the terminal iterate by TDL and empirical fit. The bound is dimension-free and invariant to reparameterizations, and it applies to adaptive, momentum, and data-augmented procedures via their induced path measures. Under either low-rank gradient covariance or bounded quadratic variation of the path, TDL scales with the intrinsic rank and the number of schedule switches, explaining why large models trained with structured noise can generalize despite memorization capacity. The framework subsumes classical stability- and compression-based bounds as special cases and predicts the effects of early stopping and averaging. We also propose practical estimators of TDL using online sparsification of gradient directions and piecewise polynomial coding of iterates, enabling computable, trajectory-aware generalization certificates.'
    1: Dense associative memory, a fundamental instance of modern Hopfield networks, can store a large number of memory patterns as equilibrium states of recurrent networks. While the stationary-state storage capacity has been investigated, its dynamical properties have not yet been discussed. In this paper, we analyze the dynamics using an exact approach based on generating functional analysis. We show results on convergence properties of memory retrieval, such as the convergence time and the size of the attraction basins. Our analysis enables a quantitative evaluation of the convergence time and the storage capacity of dense associative memory, which is useful for model design. Unlike the traditional Hopfield model, the retrieval of a pattern does not act as additional noise to itself, suggesting that the structure of modern networks makes recall more robust. Furthermore, the methodology addressed here can be applied to other energy-based models, and thus has the potential to contribute to the design of future architectures.
