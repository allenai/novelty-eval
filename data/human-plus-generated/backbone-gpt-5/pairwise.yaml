    0: Nonreversible dynamics promise faster exploration of complex posteriors, but are difficult to design so that the target remains invariant and practical to learn in situ. We introduce SteinGauge, a learnable augmentation of Langevin dynamics that preserves an arbitrary posterior by construction. The method parameterizes a π-weighted divergence-free field vθ through a neural vector potential implementing a Hodge-style decomposition, guaranteeing div(π vθ)=0 and thus stationarity for the drift ∇ log π + vθ. We update θ online by alternating sampling with field learning that (i) penalizes the Stein operator Tπ vθ to maintain invariance and (ii) maximizes mobility via a differentiable surrogate of integrated autocorrelation derived from the generator’s Dirichlet form. A reversible–nonreversible operator splitting with optional Metropolis correction yields an anytime sampler compatible with unnormalized or score-only targets, tempering, and constraints. The same potential induces Stein control variates, providing variance-reduced estimates of posterior expectations at no extra model cost. SteinGauge turns posterior geometry into a trainable resource for accelerated sampling and calibrated uncertainty in high dimensions and multimodal regimes.
    1: Tokenization---the process of decomposing a given text into a sequence of subwords called *tokens*---is one of the key components in the development of language models. Particularly, auto-regressive language models generate texts token by token, i.e., by predicting the next-token distribution given the previous ones, and thus tokenization directly affects their efficiency in text generation. Since each language model has their own vocabulary as a set of possible tokens, they struggle to cooperate with each other at the level of next-token distributions such as model ensemble. In this paper, we establish a theoretical framework of lossless vocabulary reduction, which efficiently converts a given auto-regressive language model into the one with an arbitrarily small vocabulary without any loss in accuracy. This framework allows language models with different tokenization to cooperate with each other efficiently by reduction to their maximal common vocabulary, enabling applications such as model ensemble with different tokenization.
