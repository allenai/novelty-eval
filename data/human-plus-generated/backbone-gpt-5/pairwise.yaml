    0: 'Reinforcement learning (RL) algorithms have been used recently to align diffusion models with downstream objectives such as aesthetic quality and text-image consistency by fine-tuning them to maximize a single reward function under a fixed KL regularization. However, this approach is inherently restrictive in practice, where alignment must balance multiple, often conflicting objectives. Moreover, user preferences vary across prompts, individuals, and deployment contexts, with varying tolerances for deviation from a pre-trained base model. We address the problem of inference-time multi-preference alignment: given a set of basis reward functions and a reference KL regularization strength, can we design a fine-tuning procedure so that, at inference time, it can generate images aligned with any user-specified linear combination of rewards and regularization, without requiring additional fine-tuning? We propose Diffusion Blend, a novel approach to solve inference-time multi-preference alignment by blending backward diffusion processes associated with fine-tuned models, and we instantiate this approach with three algorithms: DB-MPA for multi-reward alignment, DB-KLA for KL regularization control, and DB-MPA-LS for approximating DB-MPA without additional inference cost.'
    1: 'Generative models excel at reproducing correlations but lack interventional semantics and modularity, limiting generalization and controllability. We introduce Causal Score Composition, a diffusion-based framework that factorizes the joint score field into a sum of mechanism-specific conditional scores aligned with a latent structural causal model. Each mechanism is a local denoiser s_i(x_i, pa_i, t) trained to approximate the time-dependent conditional score of variable block x_i given its parents pa_i under Gaussian diffusion. A cross-partial integrability penalty and a dual potential ensure that the composed field integrates to a consistent joint distribution. The architecture supports explicit causal operations: interventions replace affected mechanisms, counterfactuals follow abduction–action–prediction with shared noise, and mechanism surgery composes modules across environments. A structure learner discovers variable blocks and edges by seeking mechanism-invariant conditional scores across contexts with sparse regularization. Causal Score Composition brings do-calculus semantics to diffusion sampling while retaining the expressivity of modern backbones, enabling intervention-robust generation, attribute-level editing with validity guarantees, and rapid adaptation to distribution shifts via module swapping.'
