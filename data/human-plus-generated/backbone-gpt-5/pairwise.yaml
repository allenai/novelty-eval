  ideas:
    0: '*Automated circuit discovery* is a central tool in mechanistic interpretability for identifying the internal components of neural networks responsible for specific behaviors. While prior methods have made significant progress, they typically depend on heuristics or approximations and do not offer provable guarantees over continuous input domains for the resulting circuits. In this work, we leverage recent advances in neural network verification to propose a suite of automated algorithms that yield circuits with *provable guarantees*. We focus on three types of guarantees: (1) *input domain robustness*, ensuring the circuit agrees with the model across a continuous input region; (2) *robust patching*, certifying circuit alignment under continuous patching perturbations; and (3) *minimality*, formalizing and capturing a wide array of various notions of succinctness. Interestingly, we uncover a diverse set of novel theoretical connections among these three families of guarantees, with critical implications for the convergence of our algorithms, establishing a principled foundation for provable circuit discovery.'
    1: 'Explanations for modern neural predictors often trade plausibility for faithfulness: attributions suggest reasons, yet they rarely guarantee that those reasons actually determine the model’s output. We propose Proof-Carrying Explanations (PCE), a synthesis-and-verification framework that compiles black-box decisions into small executable programs with machine-checkable guarantees. PCE learns a library of typed predicates over raw features and learned concepts, and composes them into piecewise-linear rules and Boolean guards that simulate the original network locally. A neural-guided synthesizer proposes candidate programs; a verifier based on convex dual bounds and branch-and-bound search certifies a neighborhood in input or concept space within which the program and the network provably agree. Certificates deliver two actionable guarantees: sufficiency (the cited predicates alone reproduce the decision) and stability (alterations outside them cannot flip it inside the certified region). By amortizing synthesis across inputs, PCE induces reusable subroutines that expose recurring circuits and supports counterfactual what-if queries via program edits, yielding explanations that are executable, compact, and provably faithful.'
