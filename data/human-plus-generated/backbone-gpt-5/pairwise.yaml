  ideas:
    0: 'Electrophysiological (ExG) signals offer valuable insights into human physiology, yet building foundation models that generalize across everyday tasks remains challenging due to two key limitations: (i) insufficient data diversity, as most ExG recordings are collected in controlled labs with bulky, expensive devices; and (ii) task-specific model designs that require tailored processing (i.e., targeted frequency filters) and architectures, which limit generalization across tasks. To address these challenges, we introduce an approach for scalable, task-agnostic ExG monitoring in the wild. We collected 50 hours of unobtrusive free-living ExG data with an earphone-based hardware prototype to narrow the data diversity gap. At the core of our approach is Physiology-informed Multi-band Tokenization (PiMT), which decomposes ExG signals into 12 physiology-informed tokens, followed by a reconstruction task to learn robust representations. This enables adaptive feature recognition across the full frequency spectrum while capturing task-relevant information. We also introduce the DailySense dataset—the first to enable ExG-based analysis across five human senses.'
    1: 'Contemporary cognitive models offer mechanistic interpretability but are brittle and task-specific, while foundation models encode vast procedural knowledge yet lack explicit links to neural mechanisms. We propose Text-to-Cognitive-Program (T2CP), a neurosymbolic framework that compiles natural-language task descriptions and theoretical hypotheses into executable, differentiable cognitive programs constrained by neuroscience. An LLM maps text into a library of neurally grounded primitives: working-memory buffers, gating controllers, attractor dynamics, drift-diffusion accumulators, divisive normalization; and composes them into a structured state-space model with explicit latent variables. Amortized variational inference fits parameters to joint behavioral and neural time series via neuro-symbolic emitters that predict modality-specific signals (e.g., spiking rates, MEG band power, or fMRI hemodynamics) from latent operations. Structural search is regularized by linguistic entailment and minimum-description-length priors, enabling rapid hypothesis revision and cross-task transfer. A closed-loop stimulus module uses the compiled program to design counterfactual trials that maximally disambiguate competing structures under experimental constraints. T2CP yields falsifiable, human-readable models that bridge cognitive theory, population dynamics, and behavior, enabling individualized cognitive fingerprints as reusable priors across paradigms and offering a path to scalable, mechanistically grounded naturalistic neuroscience.'
