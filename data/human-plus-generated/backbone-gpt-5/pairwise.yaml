    0: Standard discrete diffusion models treat all unobserved states the same way, typically mapping them to an absorbing [MASK] token. This creates an "information void" where global semantic information that may be inferred for the masked tokens from the unmasked tokens is not directly passed from one denoising step to another. We introduce **Continuously Augmented Discrete Diffusion (CADD)**, a framework that augments the discrete state space with a paired diffusion in a continuous latent space. This yields graded, gradually corrupted states in which masked tokens are represented by noisy yet informative latent vectors rather than information voids. At each reverse step, CADD uses the continuous latent as a semantic hint to guide discrete denoising. The design is clean and compatible with existing discrete diffusion training. At sampling time, the strength and estimator of the continuous latent vector enables a controlled trade-off between mode-coverage (diversity-oriented) and mode-seeking (context-localization-oriented).
    1: Generative models excel at realism but struggle to obey user-defined constraints expressed as rules, measurements, or physics, especially when constraints are non-differentiable or must be composed on the fly. We present SplitFuse, a sampling framework that reinterprets diffusion as a proximal operator and composes it with arbitrary constraint solvers via operator-splitting. Each constraint is wrapped as a black-box proximal (exact projection, short-run optimizer, or differentiable module), and sampling alternates them with the diffusion prior proximal using Douglas-Rachford updates across the noise schedule. This turns conditional generation into solving a composite objective without retraining, yields exact satisfaction for hard constraints equipped with projectors, and supports soft preferences through penalties. A residual-based controller allocates steps adaptively and selects which modules to invoke, enabling zero-shot composition of many constraints, even across modalities and simulators. SplitFuse provides a unifying recipe for controllable generation that preserves the strengths of powerful pretrained priors while delivering symbolic, physical, and structural fidelity at inference time.
