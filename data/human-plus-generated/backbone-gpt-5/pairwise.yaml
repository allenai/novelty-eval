  ideas:
    0: 'Mixed-curvature spaces have emerged as a powerful alternative to their Euclidean counterpart, enabling data representations better aligned with the intrinsic structure of complex datasets. However, comparing probability distributions in such spaces remains underdeveloped: existing measures such as KL divergence and Wasserstein either rely on strong assumptions on distributions or incur high computational costs. The Sliced-Wasserstein (SW) framework provides an alternative approach for constructing distributional distances; however, its reliance on one-dimensional projections limits its ability to capture the geometry of the ambient space. To address this limitation, the Tree-Sliced Wasserstein (TSW) framework employs tree structures as a richer projected space. Motivated by the intuition that such a space is particularly suitable for representing the geometric properties of mixed-curvature manifolds, we introduce the Mixed-Curvature Tree-Sliced Wasserstein (MC-TSW), a novel discrepancy measure that is computationally efficient while faithfully capturing both the topological and geometric structures of mixed-curvature spaces. Specifically, we introduce an adaptation of tree systems and Radon transform to mixed-curvature spaces, which yields a closed-form solution for the optimal transport problem on the tree system. We further provide theoretical analysis on the properties of the Radon transform and the MC-TSW distance.'
    1: Message passing on graphs and discretized geometries often collapses long-range signals through narrow topological bottlenecks, yielding oversquashing and brittle heterophily handling. We introduce Lifted Covering Networks, a framework that learns a finite k-fold covering space of the input topology and performs equivariant computation in the lift. A learned covering map assigns each base node a fiber of k replicas and parameterizes edge-wise deck transformations as sparse permutation-valued kernels conditioned on attributes. Attention or diffusion operates on the lifted structure, where cycles are unwrapped and multiple non-interfering routes propagate information, then aggregates fiberwise back to the base via invariant pooling. Topological regularizers enforce cycle consistency and approximate holonomy neutrality around contractible loops, while allowing nontrivial monodromy on essential cycles, linking learning to fundamental group structure. The construction reduces to standard GNNs when k=1, scales linearly in k|E|, and extends to cell complexes by lifting chains across dimensions with boundary-commuting maps. By learning where and how to open covers, the model allocates capacity to hard regions, mitigates squashing without global rewiring, and equips geometric learners with a principled, group-symmetric mechanism for long-range reasoning across graphs, meshes, and higher-order topologies.
