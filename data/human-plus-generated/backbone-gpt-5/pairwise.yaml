  ideas:
    0: 'We introduce DualForge, a general-purpose constrained generation framework that turns pretrained generative models into solvers of maximum-entropy problems under user-specified constraints. Users write goals in a small differentiable constraint language—covering global counts, grammatical or programmatic structure, physics-based energies, and safety specifications—which DualForge compiles into potentials over outputs. During sampling, DualForge augments the base dynamics (diffusion SDE/ODE or autoregressive decoding) with an online primal–dual controller: dual variables steer trajectories along constraint gradients while a measure-preserving regularizer keeps the induced distribution close to the pretrained model. An amortized initializer predicts dual seeds from prompts, and mirror-descent updates yield stable, anytime decoding with hard and soft constraints and exact composability across many objectives. The procedure produces a posteriori certificates via KKT residuals, exposes an explicit fidelity–satisfaction trade-off by annealing constraint strengths with the sampling schedule, and operates as a plug-in without finetuning. Reframing guidance as optimization over distributions rather than logits yields a unified, theoretically grounded path to safe, structured, and controllable generation across text, images, and molecular graphs.'
    1: 'Massive Activations (MAs) are a well-documented phenomenon across Transformer architectures, and prior studies in both LLMs and ViTs have shown that they play a substantial role in shaping model behavior. However, the nature and function of MAs within Diffusion Transformers (DiTs) remain largely unexplored. In this work, we systematically investigate these activations to elucidate their role in visual generation. We found that these massive activations occur across all spatial tokens, and their distribution is modulated by the input timestep embeddings. Importantly, our investigations further demonstrate that these massive activations play a key role in local detail synthesis, while having minimal impact on the overall semantic content of output.

      Building on these insights, we propose Detail Guidance (DG), a MAs-driven, training-free self-guidance strategy to explicitly enhance local detail fidelity for DiTs. Specifically, DG constructs a degraded "detail-deficient" model by disrupting MAs and leverages it to guide the original network toward higher-quality detail synthesis. Our DG can seamlessly integrate with Classifier-Free Guidance (CFG), enabling joint enhancement of detail fidelity and prompt alignment.'
