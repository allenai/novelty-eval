    0: Large language models (LLMs) exhibit strong generative capabilities but remain vulnerable to confabulations, fluent yet unreliable outputs that vary arbitrarily even under identical prompts. Leveraging a quantum tensor network–based pipeline, we propose a quantum physics-inspired uncertainty quantification framework that accounts for the aleatoric uncertainty in token sequence probability for semantic equivalence-based clustering of LLM generations. In turn, this offers a principled and interpretable scheme for hallucination detection. We further introduce an entropy-maximization strategy that prioritizes high-certainty, semantically coherent outputs and highlights entropy regions where LLM decisions are likely to be unreliable, offering practical guidelines for when human oversight is warranted.
    1: Scaling Bayesian inference to high-velocity data streams and privacy-constrained settings requires compressing observations into small, reusable summaries without committing to a single posterior approximation. We introduce BayesSketch, a learnable, additive data sketch that preserves the log-likelihood (and score) of an entire model family up to a uniform error, enabling downstream MCMC or variational inference to operate solely on the sketch. A sketcher maps each datum to a low-dimensional feature, whose sum is the only state maintained online; a decoder conditioned on parameters reconstructs approximate log-likelihoods, gradients, and Fisher geometry. Training minimizes a distributionally robust objective over parameter proposals drawn from the prior predictive, with control-variate constraints that make exponential-family models exact and stabilize heavy-tailed regimes. The additive structure supports single-pass streaming, federated aggregation, and differential-privacy noise addition. Uniform approximation certificates translate into posterior bracketing via temperature calibration and into coverage-aware predictive sets, yielding explicit uncertainty inflation when the sketch is coarse. BayesSketch thus turns Bayesian updating into an amortized query against a compact, composable summary, unifying coresets, random features, and transport maps under a single probabilistic sketching framework.
