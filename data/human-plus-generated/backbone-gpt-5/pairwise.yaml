    0: Progress in cognitive and systems neuroscience is constrained by hand-designed stimuli that poorly discriminate among competing mechanistic theories. We introduce EIGenStim, a closed-loop framework that turns controllable diffusion models into experiment engines guided by expected information gain over a library of cognitive process models. Candidate theories—expressed as parameterized simulators linking stimuli to neural and behavioral responses—are paired with amortized likelihood-free inference to maintain online posteriors over model identity and parameters. EIGenStim differentiates through a surrogate of the response likelihood to estimate gradients of information gain with respect to the generator’s semantic controls and low-level latents, enabling the automatic synthesis of naturalistic, ethically filtered minimal pairs that maximally provoke theoretical disagreement. A metamers-to-antimemers objective targets invariance-breaking directions to expose hidden computations, while concept-bottleneck regularization keeps stimuli interpretable to human experimenters. The same machinery supports multi-modal designs spanning vision, audition, and language, and adapts to different measurement modalities by learning fast neural-response emulators. By unifying theory discrimination with naturalistic stimulus design, EIGenStim operationalizes an active, data-efficient path to discovering and falsifying cognitive mechanisms, yielding testable predictions and actionable experimental protocols.
    1: 'Normative and task-driven theories offer powerful top-down explanations for biological systems, yet the goals of quantitatively arbitrating between competing theories, and utilizing them as inductive biases to improve data-driven fits of real biological datasets are prohibitively laborious, and often impossible. To this end, we introduce a Bayesian meta-learning framework designed to automatically convert raw functional predictions from normative theories into tractable probabilistic models.

      We employ adaptive deep kernel Gaussian processes, meta-learning a kernel on synthetic data generated from a normative theory. This Theory-Informed Kernel specifies a probabilistic model representing the predictions of a given theoretical model: usable for both fitting data and rigorously validating the theory. As a demonstration, we apply our framework to the early visual system, using efficient coding as our normative theory.

      Using exact Bayesian model selection, the informed kernel can infer the degree of theory-match from data, enabling faithful encapsulation of theory structure. This work provides a more general, scalable, and automated approach for integrating theoretical knowledge into data-driven scientific inquiry in neuroscience and beyond.'
