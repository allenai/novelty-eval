  ideas:
    0: 'We propose a method for inferring an egocentric dense depth map from an RGB image and a sparse point cloud. The crux of our method lies in modeling the 3D scene implicitly within the latent space and learning an inductive bias in an unsupervised manner through principles of Structure-from-Motion. To force the learning of this inductive bias, we propose to optimize for an ill-posed objective during training: predicting latent features that are not observed in the input view, but exist in the 3D scene. This is facilitated by means of rigid warping of latent features from the input view to a nearby or adjacent (co-visible) view of the same 3D scene. "Empty" regions in the latent space that correspond to regions occluded from the input view are completed by a Contextual eXtrapolation (ConteXt) mechanism based on features visible in input view. The learned inductive bias of ConteXt can be transferred to modulate the features of the input view to improve fidelity. We term our method "Occluded Region Completion as Supervision" or ORCaS.'
    1: Multimodal foundation models unify perception and language but remain monolithic, hard to adapt to new tasks, and brittle when integrating emerging sensors. We introduce Conductor, a typed programmatic interface for composing pre-trained encoders and decoders via a library of small neural operators defined over modality-agnostic latent fields. Each field carries explicit axes (time, space, frequency), units, and calibrated uncertainty, enabling static type checking and differentiable compatibility during composition. A language-conditioned planner synthesizes directed acyclic programs that transform inputs to requested outputs while satisfying type constraints and resource budgets. Training couples operator discovery with self-supervised cross-modal objectives—cycle- and sync-consistency, equivariance across reparameterizations, and conservation-inspired priors—so operators become reusable building blocks rather than task-specific heads. New modalities attach through lightweight ports that map raw signals to typed fields, allowing plug-in extension without retraining existing components. Conductor supports diverse applications across vision, audio, language, and other modalities, including audio-visual grounding, cross-modal editing and dubbing, sensor fusion and summarization, and instruction-following tool use, while yielding transparent execution traces. By reframing multimodal reasoning as typed program synthesis over reusable operators, Conductor offers a scalable path to controllable, extensible multisensory AI.
