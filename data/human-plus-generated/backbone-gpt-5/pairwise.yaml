  ideas:
    0: 'Scaling alignment to society requires reconciling heterogeneous, confidential preferences with non-negotiable safety and fairness obligations. We propose AegisLex, a lexicographic, privacy-preserving governance layer for foundation models that formalizes alignment as constrained social choice. AegisLex encodes normative shards—parameter-efficient adapters for risk-sensitive safety rules, distributionally robust fairness, and context-specific norms—and combines them via a lightweight gate trained with a primal–dual objective: enforce safety first, then fairness, then maximize pluralistic utility. Preferences are elicited under local differential privacy and secure aggregation, then fused by a manipulation-resistant voting rule; fairness constraints operate without demographic labels by optimizing worst-case disparities over latent representation clusters. At inference, the gate activates a sparse shard set and emits a normative provenance record: cryptographic commitments to the policies and privacy budgets that shaped the output, enabling audit, contestation, and rollback. Consent receipts and adapter-level unlearning support revocation without retraining the base model, while participatory ballots update shard weights as norms evolve. AegisLex unifies safety, fairness, privacy, and democratic governance within a modular alignment stack, making model behavior accountable and revisable.'
    1: 'This work tackles a critical challenge in AI safety research under limited compute: given a fixed computation budget, how can one maximize the strength of iterative adversarial attacks? Coarsely reducing the number of attack iterations lowers cost but substantially weakens effectiveness. To fulfill the attainable attack efficacy within a constrained budget, we propose a fine-grained control mechanism that selectively recomputes layer activations across both iteration-wise and layer-wise levels.'
