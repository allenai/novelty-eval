    0: Proof autoformalization, the task of translating natural language theorems and proofs into machine-verifiable code, is a critical step for integrating large language models into rigorous mathematical workflows. Current approaches focus on producing executable code, but they frequently fail to preserve the semantic meaning and logical structure of the original human-written argument. To address this, we introduce ProofFlow, a novel pipeline that treats structural fidelity as a primary objective. ProofFlow first constructs a directed acyclic graph (DAG) to map the logical dependencies between proof steps. Then, it employs a novel lemma-based approach to systematically formalize each step as an intermediate lemma, preserving the logical structure of the original argument. To facilitate evaluation, we present a new benchmark of 184 undergraduate-level problems, manually annotated with step-by-step solutions and logical dependency graphs, and introduce ProofScore, a new composite metric to evaluate syntactic correctness, semantic faithfulness, and structural fidelity.
    1: 'Neurosymbolic systems must reconcile discrete logical structure with continuous physics. We introduce Satisfiability Modulo Differentiable Physics (SMDP), a proof-carrying hybrid framework that compiles first-order rules, unit-aware types, and differential-algebraic laws into a single bi-level solver. An inner implicit layer enforces physical dynamics and returns exact sensitivities, while a proof-generating SMT layer resolves discrete choices and invariants. The two exchange messages: dual multipliers shape differentiable penalties and active sets; unsat cores drive a proof-guided curriculum and counterexample generation; abductive synthesis proposes missing clauses. Neural proposal networks amortize both symbolic assignments and continuous states, yielding fast, verifiable predictions accompanied by minimal proof certificates and sensitivity witnesses. SMDP enables learning and inference that are simultaneously data-driven, physically consistent, and logically sound, without collapsing to brittle hard constraints or purely relaxed surrogates. We outline applications in safe robot control, molecular design with conservation and valence rules, and assimilation for climate models, where specifications are written once and compiled into trainable components. By treating knowledge as executable constraints with proofs, SMDP turns verification signals into gradients and renders neurosymbolic training a closed loop between proof search and differentiable physics.'
