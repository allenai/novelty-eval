    0: "Federated Graph-level Clustering (FGC) offers a promising framework for analyzing distributed graph data while ensuring privacy protection.\nHowever, existing methods fail to simultaneously consider knowledge heterogeneity across intra- and inter-client, and still attempt to share as much knowledge as possible, resulting in consensus failure in the server.\nTo solve these issues, we propose a novel **F**ederated **G**raph-level **C**lustering **N**etwork with **D**ual **K**nowledge **S**eparation (FGCN-DKS). \nThe core idea is to decouple differentiated subgraph patterns and optimize them separately on the client, and then leverage cluster-oriented patterns to guide personalized knowledge aggregation on the server.\nSpecifically, on the client, we separate personalized subgraphs and cluster-oriented subgraphs for each graph. Then the former are retained locally for further refinement of the clustering process, while pattern digests are extracted from the latter for uploading to the server.\nOn the server, we calculate the relation of inter-cluster patterns to adaptively aggregate cluster-oriented prototypes and parameters. Finally, the server generates personalized guidance signals for each cluster of clients, which are then fed back to local clients to enhance overall clustering performance."
    1: 'We introduce HILO, a homotopy-based framework that treats representation learning as a continuous interpolation between unsupervised and supervised objectives. Instead of fixing a regime, HILO trains an encoder f(x, s) conditioned on a supervision scalar s ∈ [0,1], where s = 0 emphasizes self-supervised invariances and s = 1 prioritizes discriminative alignment to labels. Training samples s and optimizes a path-integrated objective with three components: endpoint anchoring (e.g., contrastive or masked modeling at s = 0; classification or metric learning at s = 1), path-consistency that regularizes embeddings across nearby s, and uncertainty-aware supervision that gracefully incorporates pseudo-labels and partial annotations at intermediate s. This homotopy acts as a learned vector field over representation space, providing smooth, controllable trade-offs between invariance and identifiability. At inference, practitioners steer s to match supervision budgets, domain shifts, or downstream desiderata, and can amortize few-shot adaptation by gradually increasing s around small support sets. HILO extends to multi-dimensional supervision descriptors, enabling compositional inclusion of new constraints without architecture changes, and offers a principled continuation view of learning objectives across regimes.'
