    0: 'Score-based methods, such as diffusion models and Bayesian inverse problems, are often interpreted as learning the data distribution in the low-noise limit ($\sigma \to 0$). In this work, we propose an alternative perspective: their success arises from implicitly learning the data manifold rather than the full distribution. Our claim is based on a novel analysis of scores in the small-$\sigma$ regime that reveals a sharp separation of scales: information about the data manifold is $\Theta(\sigma^{-2})$ stronger than information about the distribution. We argue that this insight suggests a paradigm shift from the less practical goal of distributional learning to the more attainable task of geometric learning, which provably tolerates $O(\sigma^{-2})$ larger errors in score approximation. We illustrate this perspective through three consequences: i) in diffusion models, concentration on data support can be achieved with a score error of $o(\sigma^{-2})$, whereas recovering the specific data distribution requires a much stricter $o(1)$ error; ii) more surprisingly, learning the uniform distribution on the manifold—an especially structured and useful object—is also $O(\sigma^{-2})$ easier; and iii) in Bayesian inverse problems, the maximum entropy prior is $O(\sigma^{-2})$ more robust to score errors than generic priors.'
    1: 'We propose Preference Potentials, a decoupled alignment framework that steers powerful pre-trained generative models using a small, modular energy-based critic learned solely from pairwise comparisons. The critic is a noise- and context-conditional energy function E(x, c, σ) trained with a ranking objective and denoising regularization so that its gradient approximates the direction of increasing preference under corruption. At sampling time, we fuse the base model’s score (for diffusion) or next-token logits (for autoregression) with the critic’s gradient via a projection rule that preserves core content while guiding trajectories toward low-energy regions. Multiple critics add linearly, enabling compositional control over soft constraints, safety filters, and personalization without supervised attribute labels or reinforcement learning. The design supports asynchronous updates: the generator remains frozen while critics are refined, swapped, or composed as preferences evolve, and it applies uniformly across text, image, and audio modalities. We also introduce a guidance schedule that bounds per-step distribution drift, stabilizing sampling under strong preferences. Preference Potentials offer a practical path to align and control generative models using only comparative feedback, separating alignment concerns from expensive pretraining.'
