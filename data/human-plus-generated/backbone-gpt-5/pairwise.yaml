76:
  context: datasets and benchmarks
  expected_winners:
  - 0
  ideas:
    0: 'Large Language Models (LLMs) are conversational interfaces. As such, LLMs have the potential to assist their users not only when they can fully specify the task at hand, but also to help them define, explore, and refine what they need through multi-turn conversational exchange. Although analysis of LLM conversation logs has confirmed that underspecification occurs frequently in user instructions, LLM evaluation has predominantly focused on the single-turn, fully-specified instruction setting. In this work, we perform large-scale simulation experiments to compare LLM performance in single- and multi-turn settings. Our experiments confirm that all the top open- and closed-weight LLMs we test exhibit significantly lower performance in multi-turn conversations than single-turn. Analysis of 200,000+ simulated conversations decomposes the performance degradation into two components: a minor loss in aptitude and a significant increase in unreliability. We find that LLMs often make assumptions in early turns and prematurely attempt to generate final solutions, on which they overly rely. In simpler terms, we discover that when LLMs take a wrong turn in a conversation, they get lost and do not recover.'
    1: Static datasets rapidly saturate, leak into training corpora, and fail to reflect evolving deployment distributions, undermining claims of progress in generative and multimodal AI. We propose SealedBench, a renewable, contamination-resilient benchmark protocol that reframes evaluation as a cryptographically governed process. Test items are programmatically minted from licensed, time-stamped corpora using public task grammars aligned to a capability taxonomy, then committed via content-addressable fingerprints and released only to audited execution enclaves. Models produce predictions locally; verifiable attestations summarize scores without exposing items. Honey-token sentinels and watermarking enable leakage auditing, while rotating cohorts, temporal cutoffs, and scheduled declassification maintain freshness and foster open research. Each cohort ships a machine-readable card capturing provenance, licensing, and shift scenarios across text, vision, code, and audio. By decoupling benchmarking from test set publication, SealedBench delivers reproducible, fair, and renewable measurement when contamination cannot be ruled out and distributions drift on real-world timescales.
