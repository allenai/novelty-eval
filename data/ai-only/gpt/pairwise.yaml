  expected_winners:
  - 1
  ideas:
    0: 'We propose Epistemic State Language Models (ESLMs), a class of frontier-scale foundation models that maintain and manipulate an explicit latent representation of their own beliefs. Instead of mapping prompts directly to continuations, an ESLM conditions generation on a structured belief graph: a set of atomic propositions annotated with uncertainty and provenance pointers to underlying evidence. The model jointly learns to (i) induce this epistemic state from raw text and retrieved documents, (ii) update it across multi-turn, multi-session interactions, and (iii) decode responses as constrained consequences of the current belief graph. Training interleaves standard next-token prediction with auxiliary epistemic objectives that enforce cross-prompt consistency, explicit uncertainty expression, and alignment between claims and cited evidence. Synthetic epistemic traces, constructed by automatically extracting candidate propositions and entailment relations from large corpora and tool-augmented dialogues, provide scalable supervision for belief induction and update dynamics. ESLMs aim to transform foundation models from opaque sequence predictors into agents with explicit, auditable epistemic state, enabling more reliable long-horizon reasoning, safer deployment under distribution shift, and principled interfaces for oversight and correction.'
    1: Current frontier models excel at imitation but acquire world knowledge mainly through observational next-token prediction, leaving counterfactual and interventional reasoning brittle. We propose Intervention-Augmented Pretraining, a self-supervised framework that converts ordinary corpora into paired observational-interventional training signals. A learned editor or lightweight simulator applies minimal, semantically typed interventions to a premise—altering quantities, agents, temporal order, code statements, or environmental constraints—while the model predicts downstream text, tool traces, or program behavior under the modified premise. Training combines a consistency objective that preserves unaffected consequences, an attribution objective that localizes which latent states should update after an intervention, and uncertainty tags for edits whose effects are underdetermined. This encourages the model to represent invariant mechanisms separately from mutable facts, rather than memorizing surface correlations. The framework is modality-agnostic and can be layered onto language, code, or multimodal pretraining. By learning not only what usually follows, but what would change, what should remain fixed, and when evidence is insufficient, foundation models can acquire more causal, controllable, and data-efficient internal world models.
