    0: 'Message passing on graphs is limited not only by feature aggregation but by the geometry of the domain itself: negatively curved bottlenecks induce oversquashing, while ad hoc rewiring often destroys the cycles that many tasks depend on. We introduce Homology-Preserving Ricci Flow Networks, a differentiable framework that learns task-adaptive geometry before representation learning. A discrete Ricci-flow layer continuously evolves edge weights and a sparse set of virtual transport links to expand bottlenecks and contract redundant regions, but is constrained by a persistent-homology objective that preserves the multiscale cycle structure of the original domain. On the flowed graph, a Hodge message-passing operator jointly updates node features and edge-flow representations, allowing information to travel through paths and cycle-supported channels rather than only through repeated local aggregation. The resulting model treats rewiring as geometry learning with explicit topological invariants, unifying curvature correction, topology-aware regularization, and higher-order message passing in a single end-to-end objective. This perspective provides a principled route to learning on graphs and discretized geometries whose connectivity should adapt for communication without sacrificing global shape.'
