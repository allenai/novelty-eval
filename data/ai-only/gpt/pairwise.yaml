    0: 'Learning to reason causally from observational data remains difficult because environment shifts reveal which mechanisms change, yet existing methods mostly extract stable predictors rather than modular structural equations. We introduce ReSwap, a self-supervised framework that converts heterogeneous observational data into pseudo-interventional supervision. ReSwap encodes each sample into a small set of sparse mechanism states, learns a directed dependency structure among them, and synthesizes hybrid examples by swapping one mechanism state between samples while holding the others fixed. A reconstruction objective, cycle consistency, and a minimal-change prior force these recombined latents to behave like valid interventions: altered factors must explain the shift, while unaffected factors remain invariant across environments. This reformulates causal discovery as mechanism matching, enabling recovery of latent causal abstractions without explicit intervention labels or known graph structure. The resulting representation supports counterfactual simulation, explanation of distribution shifts, and robust prediction under unseen interventions within one differentiable architecture.'
