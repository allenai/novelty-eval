    0: 'Optimization algorithms crucially depend on an implicit choice of geometry, typically fixed a priori as Euclidean or entropic and left unchanged across tasks. This rigidity is at odds with modern machine learning workloads, where loss landscapes exhibit recurring but highly non-isotropic structure. We introduce Meta-Learned Mirror Maps, a framework that treats the geometry of first-order optimization as a learnable object adapted to a distribution of tasks. Building on mirror descent, we parameterize the mirror map via input-convex neural networks or invertible flows and train it in a bilevel manner: an inner loop performs a few mirror-descent steps on each task using the current geometry, while an outer loop updates the geometry parameters to minimize a meta-objective capturing final loss and trajectory smoothness. The resulting optimizer specializes its update directions, step sizes, and preconditioning to the shared curvature and sparsity patterns of the task family. We analyze how learned geometries can provably improve condition numbers and stability relative to fixed norms, and discuss connections to natural gradients, adaptive methods, and meta-learning.'
