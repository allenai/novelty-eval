  ideas:
    0: 'Large language models absorb facts into distributed parameters, which yields fluent generation but brittle knowledge maintenance: updates are costly, contradictions persist across turns, and retrieved evidence is only weakly integrated into answers. We propose Epistemic State Models, a foundation-model architecture that decouples linguistic competence from revisable belief maintenance. An LLM is paired with a small latent belief graph whose nodes encode propositions, confidence, provenance, and temporal scope. Incoming text induces graph updates through a differentiable revision operator trained on natural text streams and counterfactual perturbations that force the model to retract, merge, or prioritize conflicting evidence. Generation is conditioned on the current graph, while consistency objectives require answers, rationales, and tool-use decisions to remain invariant to irrelevant edits and to change predictably when specific beliefs are revised. Because the belief graph is sparse and externalizable, it can be directly inspected, edited, or synchronized across agents without retraining the base model. This framework turns static parametric knowledge into an explicit trainable epistemic state, enabling more updateable, auditable, and long-horizon language agents.'
    1: Frontier language models are typically aligned once, via RLHF or instruction tuning, and then deployed into heterogeneous normative environments with evolving laws, institutional policies, and user-specific constraints. This entangles world knowledge and normative behavior, making it difficult to update, specialize, or compose policies without retraining large models. We propose Policy-as-Weights (PaW), a modular alignment framework in which policies are represented explicitly as text and compiled into parameter-efficient weight updates for a frozen foundation model. A policy encoder reads natural language regulations, guidelines, or organizational rules and generates a set of low-rank adapters that reshape the model’s conditional distribution without altering its underlying knowledge. Multiple policies can be activated jointly by composing their adapters, enabling jurisdiction-aware and institution-specific behavior from a single base model. PaW is trained to generalize across a diverse set of policy regimes, allowing new or modified policies to be applied with minimal or no additional supervision. This decoupling of capabilities from norms turns alignment into an interpretable, updatable control layer over frontier models, opening a path toward rapidly reconfigurable, policy-compliant AI systems.
