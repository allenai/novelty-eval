  ideas:
    0: Foundation models deliver broad capabilities but offer only coarse-grained control via prompts and global fine-tuning, making it difficult to enforce precise behavioral constraints or selectively shape reasoning. We introduce Interventional Concept Interfaces (ICI), a framework that endows frozen frontier models with an explicit, human-interpretable causal state space. ICI learns a bidirectional interface between internal activations and a set of latent concepts organized as a causal graph. A forward map encodes activations into concept variables, while an inverse map translates counterfactual concept assignments into localized activation edits. The interface is trained using interventional supervision from synthetic counterfactual instructions, tool-generated probes, and sparse human annotations, with objectives that encourage causal consistency between concept-level interventions and downstream model behavior. At inference time, users or automated controllers manipulate concept nodes to impose safety constraints, suppress specific failure modes, or amplify desired reasoning styles, without retraining or broadly degrading competence. By turning opaque representations into an actionable causal interface, ICI provides a principled mechanism for alignment, steering, and debugging of frontier foundation models beyond what is achievable with prompt- or parameter-level methods.
    1: Foundation-model systems increasingly rely on multiple specialized agents, yet they coordinate almost exclusively through natural language, a channel optimized for humans rather than machines. Language-based coordination is verbose, lossy, and poorly suited for transmitting uncertainty, partial plans, or intermediate representations across heterogeneous models. We introduce Protocol Latents, a framework for learned inter-model communication in which each frozen foundation model is equipped with lightweight translators that map internal states to and from a shared latent protocol space. The protocol is trained with cycle-consistency across models, an information bottleneck that encourages compact messages, and task-grounded sufficiency objectives that preserve only decision-relevant content. A dual-channel decoder renders latent messages back into natural language when human auditability is required, while a learned router chooses when communication should remain latent or textual. Protocol Latents turns communication itself into a trainable abstraction layer, enabling specialist models to collaborate without exposing model-specific hidden states or retraining the underlying backbones. More broadly, the approach suggests a path toward multi-model frontier systems whose interfaces are adaptive, efficient, and compositional rather than purely linguistic.
