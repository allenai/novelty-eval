    0: 'Reinforcement learning agents remain brittle in sparse-reward domains because delayed outcomes provide weak supervision about which past decisions mattered. We introduce Anticausal Reinforcement Learning, a framework that augments standard forward dynamics with a backward world model that predicts predecessor states and actions conditioned on future events. The key object is a learned responsibility field over trajectories: a differentiable distribution that transports reward information backward in time and estimates the causal contribution of earlier decisions to later outcomes. This field is trained jointly with a latent dynamics model through forward-backward consistency, enabling the agent to relabel stored experience with dense responsibility targets without access to hand-designed shaping rewards. We use these targets to weight actor-critic updates, prioritize replay around consequence-bearing transitions, and drive exploration toward states with uncertain but potentially high downstream influence. By treating credit assignment as anticausal inference rather than solely return estimation, the proposed approach unifies planning, replay, and exploration under a single backward reasoning mechanism for long-horizon control.'
    1: 'Long-horizon reinforcement learning remains bottlenecked by credit assignment: sparse terminal rewards must be propagated over thousands of steps, leading to unstable value estimates and brittle hand-crafted reward shaping. We introduce MetaShaper, a meta-learned reward redistribution mechanism that automatically synthesizes dense, task-specific shaping signals while provably preserving the optimal policies of the original Markov decision process. MetaShaper parameterizes a trajectory-to-reward transformer that, given partial or complete trajectories, outputs per-timestep pseudo-rewards constrained to arise from a potential-based transformation plus a small learned residual. The parameters of this model are optimized in an outer loop by differentiating through inner-loop policy optimization, directly aligning the shaping with downstream control performance on the sparse objective. Across a distribution of related tasks, the outer loop distills transferable credit-assignment structure, enabling new tasks to be solved by standard RL on the shaped rewards with minimal additional tuning. By decoupling the design of reward signals from environment engineering, MetaShaper aims to make long-horizon RL more sample-efficient, robust to reward misspecification, and amenable to sharing credit-assignment priors across domains.'
