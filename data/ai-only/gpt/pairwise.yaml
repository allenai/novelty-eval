    0: Large generative models provide powerful priors over complex data, yet they remain difficult to steer toward user-specified constraints without costly retraining or task-specific reward design. We propose Constraint-Parameterized Generative Priors (CPGP), a framework that augments a frozen base generator with an amortized energy head that enforces a broad family of constraints at sampling time. CPGP learns a constraint-conditional energy function over complete or partial generations, parameterized by a compact constraint descriptor that may be natural language, symbolic predicates, or a handful of labeled examples. During training, CPGP observes diverse synthetic and real constraint–example pairs and meta-learns to approximate the Lagrangian solution that reweights the base model into a constraint-satisfying distribution. At inference, guided sampling is implemented by per-step logit adjustments derived from the learned energy, enabling fast, training-free adaptation of the underlying model to new constraints and compositional combinations thereof. This decouples constraint specification from model pretraining, turning a single generator into a reusable substrate for domain-specific, safety-critical, or structurally constrained generation across modalities.
    1: 'Modern generative models produce striking local detail yet often fail to preserve global decisions, causing entity drift in text, layout inconsistency in images, and semantic collapse in long-form generation. We propose Commitment Diffusion, a modality-agnostic framework that augments generation with a learned discrete intent ledger capturing sample-level commitments before fine-grained synthesis. The ledger is discovered without structural supervision through a predictive bottleneck: it must summarize information needed to reconstruct distant regions or future tokens while remaining sparse, stable, and reusable across denoising steps. Generation alternates between updating this ledger and rendering content conditioned on it, while a revision cost permits correction but discourages gratuitous changes. This casts generation as commitment management rather than purely local denoising, yielding interpretable control, compositional editing, and long-range coherence within a single training objective. Because the ledger is learned in latent space and does not assume modality-specific parsers, the approach naturally extends to text, image, video, and multimodal generators, offering a general recipe for explicit planning in generative modeling.'
