  ideas:
    0: 'Foundation language models can retrieve documents and call tools, yet they still collapse observation, inference, and speculation into a single next-token stream. We propose Belief-State Foundation Models, an architecture that factorizes generation into a persistent latent belief graph and a surface realizer. The belief module stores typed propositions with confidence, provenance, and temporal scope; the realizer conditions on this state to answer, abstain, or actively seek evidence. Training combines standard pretraining with three self-supervised objectives: proposition induction from raw text, contradiction-aware belief revision over sequential evidence, and counterfactual rollouts that enforce consistency under hypothetical updates. Because knowledge is represented as editable state rather than fully absorbed into weights, the model can incorporate new facts, localize uncertainty, and expose machine-readable support without chain-of-thought supervision. The framework unifies retrieval, memory, and model editing as state updates, enabling continual knowledge refresh, personalized adaptation, and transparent uncertainty handling within a single foundation model. More broadly, it reframes frontier models from static token predictors into adaptive epistemic systems that maintain and revise beliefs over time.'
    1: Foundation and frontier language models are typically aligned to a single, static behavioral policy via post-hoc tuning, making it difficult to deploy one model across diverse legal, cultural, and safety regimes. This monolithic alignment both obscures which behaviors are capability-driven versus policy-driven and forces costly re-training whenever governance requirements change. We propose Policy-Conditioned Foundation Models (PCFM), a training framework that explicitly factors world-modeling from normative behavior by conditioning generation on compact policy embeddings. PCFM augments pretraining and instruction tuning with an auxiliary policy channel and a corpus of heterogeneous governance specifications, ranging from platform guidelines and institutional rulebooks to jurisdiction-specific regulations. A contrastive disentanglement objective encourages invariance of core capabilities across policies while localizing behavioral differences to the policy embedding subspace. A lightweight policy compiler maps natural-language rules into embeddings via a hybrid symbolic–neural representation, allowing new policies to be installed or interpolated at inference time without further gradient updates. By turning normative constraints into first-class conditioning variables, PCFM aims to enable auditable, jurisdiction-aware deployment of a single frontier model instance while providing a concrete handle for analyzing, debugging, and systematically stress-testing its policy-conditioned behaviors.
