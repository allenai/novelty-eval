    0: Classical operator-splitting methods such as ADMM, Douglas–Rachford, and primal–dual hybrids underlie much of large-scale convex and nonconvex optimization, yet their concrete instantiations are still manually engineered. In particular, the choice of variable and constraint partitioning, dualization pattern, and penalty and step-size schedules crucially determines convergence, but is rarely optimized systematically. We propose Meta-Splitting, a framework that treats the design of operator-splitting schemes as a meta-optimization problem over an explicit space of algorithmic decompositions. Given an optimization problem represented as a factor graph of smooth, nonsmooth, and linear components, Meta-Splitting parametrizes possible splittings and update rules, relaxes discrete structural choices to a differentiable search space, and uses bilevel optimization guided by analytic convergence surrogates to synthesize problem-adapted algorithms. The inner level executes a candidate iterative scheme, while the outer level optimizes its structural and numerical parameters under constraints that enforce monotone Lyapunov decrease and guarantee convergence for entire problem classes. This yields an “optimizer compiler” capable of automatically recovering classical algorithms as special cases and generating novel, structure-exploiting splitting methods tailored to new applications.
