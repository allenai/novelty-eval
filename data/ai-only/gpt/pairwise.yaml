    0: 'Modern generative models excel at local realism but often fail to maintain global structure, because high-dimensional synthesis is learned as direct token- or noise-level prediction without an explicit notion of what must remain invariant across the whole sample. We propose Latent Contracts, a training framework that augments a generator with a compact, unsupervised contract variable encoding sample-level commitments such as object counts, discourse entities, symmetries, or causal relations. Generation is decomposed into contract prediction and contract realization: a planner proposes a contract, the base generator synthesizes a sample conditioned on it, and an amortized verifier reinfers the contract from full or partial observations. Cycle-consistency between planned and recovered contracts forces early commitment to global decisions, while verifier-guided denoising discourages locally plausible but contract-violating continuations. Because contracts live in a compositional latent space rather than human-specified labels, they can be edited, recombined, or partially clamped at inference to steer generation without task-specific retraining. The framework is architecture-agnostic and can be instantiated on diffusion or autoregressive models, offering a route toward generative systems that produce samples together with an internal certificate of global coherence.'
    1: 'Modern generative models excel at producing high-fidelity individual samples, yet most interfaces expose only pointwise control via prompts or conditioning, making it difficult to shape the global properties of the generated population. Many emerging applications instead require distribution-level control: synthesizing datasets with specified attribute marginals, fairness constraints, or rare but safety-critical scenarios for robust model evaluation. We introduce Distributional Prompting, a meta-generative framework that treats a powerful pre-trained generator as a black box and learns to output generation policies rather than single samples. Given a natural language description and, optionally, a small reference set, a lightweight controller network predicts a distribution over the base model’s latent seeds, conditioning vectors, and guidance schedules such that the induced sample population matches the target distribution. The controller is trained on automatically constructed tasks in which subsets of real data, described by attribute-aware captions, define target distributions; objectives operate on batches of samples using differentiable two-sample tests and classifier-based constraints. Distributional Prompting elevates prompts from describing individual outputs to specifying entire generative data distributions, enabling on-demand dataset synthesis, controllable data augmentation, and targeted stress testing without retraining or modifying the underlying generative backbone.'
