    0: Frontier language models are typically optimized on realized trajectories, leaving them poorly calibrated on the near-miss internal states that precede hallucination, policy violation, and brittle tool use. We propose Counterfactual Shadowing, a self-auditing framework that augments a foundation model with a lightweight shadow network trained on counterfactual perturbations of its own hidden states, reasoning traces, and action sequences. The shadow network learns to predict whether a continuation remains faithful under instruction, retrieval, and tool interventions, producing a state-conditional risk estimate before unsafe or unreliable text is emitted. During inference, the base model decodes normally in low-risk regimes, while high-risk states trigger targeted recovery operations such as latent rollback, retrieval refresh, or constrained deliberation. Unlike post-hoc guardrails, our approach operates on internal representations rather than completed outputs, enabling earlier intervention and tighter coupling between capability and oversight. Because counterfactual training data are synthesized from the model itself, Counterfactual Shadowing scales naturally with frontier-model training pipelines and extends to multimodal and tool-augmented systems.
    1: 'Current frontier language models entangle capabilities and governance: safety rules, jurisdiction-specific constraints, and organizational policies are largely hard-coded into the weights via a single alignment pipeline. This makes it difficult to support diverse, evolving norms without retraining or brittle prompt tricks. We introduce Policy-Programmable Foundation Models, an architecture and training paradigm that exposes governance as an explicit, learnable interface. A separate policy encoder ingests natural language specifications of desired behavior—ranging from legal standards to role-specific guidelines—and produces low-rank, token-conditioned modulation signals that steer a frozen base model at every layer. During training, the system meta-learns to interpret and implement policies across a wide distribution of synthetic and human-written rules using a mixture of preference-based and constraint-violation signals, encouraging compositional generalization to unseen policies. At deployment, regulators, institutions, or end users can hot-swap policies without modifying the backbone, effectively “programming” the same frontier model to comply with heterogeneous, dynamically changing governance regimes while preserving its underlying capabilities.'
