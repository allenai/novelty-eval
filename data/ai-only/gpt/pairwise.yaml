    0: Generative models excel at approximating complex data distributions, yet they remain difficult to steer toward samples that satisfy rich, non-differentiable constraints such as logical consistency, semantic safety, or physical feasibility. We introduce Verifier-Guided Generative Modeling, a general framework that integrates arbitrary black-box verifiers into diffusion and autoregressive models via learned constraint potentials. Given a pre-trained base generator and a verifier that returns pass/fail or scalar scores on completed samples, we actively sample from the generator, query the verifier, and train a differentiable surrogate potential to approximate the verifier’s behavior. This potential then serves as a guidance signal during both fine-tuning and sampling, shaping the generator toward verifier-satisfying regions of the data manifold without requiring gradients from, or repeated interaction with, the verifier itself. The approach unifies symbolic, physical, and preference-like constraints within a single guidance mechanism, preserves the expressivity of the underlying generative model, and enables post-hoc alignment to new constraint sets by re-training only the lightweight surrogate. We discuss instantiations for code generation with compiler feedback, molecule generation with stability checks, and image generation with safety filters.
