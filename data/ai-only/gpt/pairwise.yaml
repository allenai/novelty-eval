    0: Learning predictive models for time series arising from complex dynamical systems remains difficult when the underlying dynamics evolve at highly variable and state-dependent speeds. Standard sequence models and neural differential equations treat wall-clock time as fixed, forcing them to absorb both the geometry of trajectories and their local pacing into a single representation and often degrading long-horizon extrapolation. We introduce LatentClock, a framework that explicitly factorizes temporal evolution into a shared latent phase and a nonlinear, learnable reparameterization of time. LatentClock couples a monotone neural time-warp module, which maps observed timestamps to a trajectory-specific latent clock, with a latent-state dynamical system that evolves in this clock space. A simplicity prior on the latent vector field—implemented via spectral, curvature, or sparsity regularization—encourages the model to express complexity primarily through time warping, yielding smoother and more stable latent dynamics. This decomposition aligns heterogeneous trajectories, accommodates irregular sampling, and uncovers interpretable latent progression variables, while remaining compatible with existing neural ODE, SDE, and sequence architectures for forecasting, control, and system identification.
    1: 'Many real-world time series differ not only in state but in how time itself is expressed: progression rates vary across subjects, sensors sample irregularly, and event-driven measurements locally dilate or compress trajectories. Existing sequence models typically absorb these effects into the dynamics, conflating where a system is with how fast it is moving. We introduce GaugeFlow, a framework for learning dynamical systems up to time reparameterization. GaugeFlow represents each observation sequence as the composition of a shared autonomous latent vector field and a sequence-specific monotone clock map that warps observed time into canonical time. To make this factorization identifiable, we impose an arc-length gauge that normalizes latent speed and a contrastive phase-consistency objective that aligns subsequences by dynamical progress rather than timestamp. The resulting representation is invariant to sampling cadence and subject-specific rate variation, while preserving a globally coherent latent flow for forecasting, interpolation, and system identification. More broadly, GaugeFlow reframes irregular and heterogeneous time series as observations of a common geometry traversed under different clocks, enabling models that reason about dynamics independently of temporal distortion.'
