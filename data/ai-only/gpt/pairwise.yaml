  ideas:
    0: Contemporary explainability methods either attribute predictions to input features, probe loosely aligned internal concepts, or intervene on hidden activations, but they rarely connect these strands into faithful, user-level causal stories. We propose Causal Concept Editing, a framework that defines explanations as minimal sets of semantically grounded internal concepts whose targeted modification would change a model’s prediction. Our approach first constructs a library of human-interpretable concepts as directions or subcircuits in intermediate representations, leveraging weak supervision and multimodal alignment. We then learn a sparse structural model that approximates how these concepts jointly influence downstream logits via interventional probes on hidden states. Given an input and a desired counterfactual outcome, explanations are computed by solving a constrained optimization problem over this causal concept graph to identify the smallest intervention set that flips the prediction while keeping unrelated mechanisms fixed. This yields executable, counterfactual explanations such as “if the ‘threatening posture’ and ‘low lighting’ concepts were suppressed, the model would label this scene as safe,” tightly coupling natural language rationales to verifiable internal edits across vision and language models.
    1: 'Post-hoc explanations for deep models are often descriptive but not executable: they highlight features without predicting how a decision would change under plausible interventions. We introduce ConceptGraph Distillation, a framework that converts a trained model into a sparse causal graph over automatically discovered concepts. Candidate concepts are induced from latent directions that remain stable across input augmentations and produce consistent output changes under learned latent interventions. A structural explainer is then distilled to model the original network’s behavior under these interventions, yielding a prediction-specific subgraph whose nodes are semantically grounded by retrieved prototypes or language labels. Because explanations are represented as structural equations rather than saliency scores, they support counterfactual queries, expose interactions among concepts, and separate spurious correlates from decision-critical mechanisms. A complexity regularizer selects the coarsest graph that preserves local intervention behavior, allowing explanations to adapt their granularity to user needs without concept supervision. The result is an interpretable interface to black-box models that unifies feature attribution, concept discovery, and causal counterfactual explanation in a single executable representation.'
