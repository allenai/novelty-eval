  ideas:
    0: 'Existing generative models typically satisfy structural constraints through prompting, rejection sampling, or external reward models, which makes validity brittle, expensive, and difficult to interpret. We introduce Certificate Diffusion, a generative framework that treats a compact latent witness of correctness as a first-class variable jointly denoised with the sample. Rather than learning only to synthesize data, the model learns to infer certificate states that explain rule satisfaction, compositional structure, or causal consistency from weak supervision such as simulators, parsers, or binary constraint checkers. A bidirectional consistency objective couples the two channels: generated samples must predict their certificates, while certificates must reconstruct masked properties and anticipated violations of samples. During inference, reverse diffusion alternates between sample refinement and certificate repair, enabling self-correction through learned internal verification rather than post hoc filtering. The framework is modality-agnostic and can instantiate certificates as parse trees, energy decompositions, programs, or spatial layouts, enabling controllable generation under discrete and non-differentiable constraints. By amortizing verification inside generation, Certificate Diffusion offers a route toward more reliable and interpretable text, molecule, and scene synthesis.'
    1: Generative models are typically trained to approximate a single, static data distribution, making post-hoc personalization or constraint enforcement expensive and brittle. We propose a meta-amortized framework for fast, feedback-conditioned adaptation of large generative models. Starting from a pretrained base generator, we introduce a universal updater network that maps lightweight user feedback—such as a handful of positive and negative examples, soft preference labels, or constraint descriptions—to a low-rank parameter update of the generator. During meta-training, we synthesize a large family of preference-shift tasks by defining target sub-distributions over the original training corpus; the updater is optimized so that, for each task, its one-shot update yields a generator whose samples match the corresponding sub-distribution. At test time, adaptation requires only a single forward pass through the updater, without gradient-based fine-tuning or reinforcement learning. This approach treats user feedback as an amortized approximate Bayesian update, enabling interactive, data-efficient, and reversible personalization of generative models while preserving the capabilities of the base model.
