    0: Multimodal foundation models typically align vision, audio, language, and other modalities at the level of co-occurring tokens, which entangles shared causes with modality-specific artifacts and limits transfer under missing or delayed observations. We propose CauseFormer, a modality-agnostic framework that learns latent causal event graphs from heterogeneous streams. Each modality encoder maps raw inputs into event slots with onset, duration, and uncertainty, and a shared graph transformer infers dependencies among latent events while preserving modality-specific structure. Training combines masked event prediction with intervention-inspired perturbations that drop, delay, or swap modality segments, encouraging the model to retain cross-modal causes that remain invariant and isolate private effects that do not. A lightweight language grounding module attaches concise textual descriptors to graph nodes, producing interpretable and editable event representations. Because generation and reasoning operate over latent event graphs rather than raw tokens, the model naturally supports asynchronous fusion, missing-modality inference, and counterfactual simulation across video, audio, text, and sensor data. This formulation reframes multimodal learning as causal event induction, offering a unified substrate for robust perception and controllable generation.
    1: Multimodal foundation models for vision, audio, language, and beyond typically align raw signals in a shared feature space, yet they conflate the structure of the world with the idiosyncrasies of each sensor. This entanglement hinders systematic generalization to new modalities and limits cross-modal editing to shallow feature manipulations. We introduce Latent Event Ports (LEP), a causal world-modeling framework that factors perception into modality-agnostic latent events and modality-specific differentiable renderers. LEP represents an episode as a sparse sequence of discrete events with continuous attributes, and learns paired encoder–renderer ports that transform between each raw modality (images, waveforms, text, and structured signals) and this shared event space. A variational objective couples ports across time and modalities, enforcing that a single latent event sequence must jointly explain what is seen, heard, and described without requiring aligned annotations. Once trained, LEP permits plug-and-play integration of novel modalities by learning only a new port while keeping the world model fixed, and supports applications such as cross-modal prediction, counterfactual editing across modalities, and unified retrieval over heterogeneous sensory logs.
