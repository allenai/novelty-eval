    0: Frontier models acquire broad competence from web-scale autoregressive training, yet their internal representations often entangle semantic state with presentation, leading to brittle reasoning, weak controllability, and costly adaptation. We propose Intervention-Equivariant Pretraining, a self-supervised framework that augments standard language modeling with structured constraints over hidden states. The key idea is to pair naturally occurring or synthetically generated multi-view descriptions of the same underlying situation—such as paraphrases, multilingual restatements, tables, code, or retrieved evidence—with targeted counterfactual edits that modify a single fact, premise, or tool outcome. The model is trained to align hidden representations across meaning-preserving views while enforcing localized, predictable transformations under each intervention. A latent transition module composes these edits before decoding, enabling the model to simulate counterfactual state changes rather than merely continue text. Because the method sits on top of existing pretraining pipelines and relies on unlabeled corpora plus automatically generated interventions, it offers a practical route to retrofitting foundation models with more editable, verifiable, and causally structured representations for reasoning, knowledge updating, and agentic planning.
    1: Frontier language models are currently aligned via monolithic post-training pipelines, which entangle epistemic knowledge with normative behavior and make it difficult to support heterogeneous policies across jurisdictions and applications. We propose Contract-First Generation (CFG), a framework that decomposes aligned language modeling into an explicit governance stage and a constrained realization stage on top of a shared frontier backbone. Given a user query and a machine-readable governance specification, a lightweight “contract model” first predicts a structured contract encoding safety constraints, admissible tools, disclosure requirements, and style preferences. A contract-conditioned decoder then generates the final response from the frozen backbone while enforcing the contract through differentiable constraint projections and low-variance rejection mechanisms. During training, synthetic counterfactual contracts and adversarial prompts are used to jointly shape both the contract space and the realizability of contracts by the backbone, yielding a library of reusable governance profiles that can be composed at inference time. This modularization enables auditable, rapidly updatable, and jurisdiction-specific alignment of frontier models without repeated full-stack post-training or task-specific fine-tuning.
