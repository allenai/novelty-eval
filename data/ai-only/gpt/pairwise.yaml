  ideas:
    0: 'Static weights and textual context are the two dominant mechanisms for controlling foundation models, but both are poorly matched to transient expertise: the former is persistent and expensive to update, while the latter is weak and token-inefficient. We introduce Prompt-Compiled Adapters, a framework in which a frozen LLM synthesizes ephemeral low-rank parameter deltas from the current prompt, retrieved documents, and interaction history. A lightweight compiler predicts which layers to modify and emits short-lived adapters that exist only for a single episode. Training combines meta-learning across task families with paraphrase invariance and a deletion-consistency objective that requires model behavior to revert when the supporting evidence is removed. To prevent uncontrolled entanglement, we add an activation-space checksum that constrains compiled experts to a small causal footprint, making adaptation reversible and inspectable. Prompt-Compiled Adapters turn a generalist model into a per-instance specialist without persistent fine-tuning, suggesting a new control primitive for safe personalization, rapid adaptation in non-stationary domains, and memory systems that modify behavior without permanently editing the base model.'
    1: As frontier language models are deployed across heterogeneous domains, jurisdictions, and risk tolerances, static alignment via RLHF or fixed constitutions cannot satisfy the need for rapidly reconfigurable and auditable behavior. We propose protocol-conditioned foundation models, which treat governance artifacts—policies, constitutions, safety guidelines, domain style guides, and legal constraints—as first-class inputs rather than as properties baked into model parameters. Each interaction is conditioned on a natural-language protocol that specifies soft and hard constraints, role obligations, uncertainty thresholds, and escalation rules. Architecturally, a dedicated protocol memory and modulation mechanism preserves protocol tokens across long contexts and enforces their influence on decoding. Training uses meta-learning over a large distribution of synthetic and human-authored protocols, with auxiliary objectives that require the model to (i) explicitly ground actions in cited protocol clauses and (ii) generate self-critique and repair proposals when violations are anticipated. This framework enables post-deployment, text-only reprogramming of alignment, fine-grained capability scoping, and interpretable, clause-level governance traces for high-stakes frontier model deployments.
