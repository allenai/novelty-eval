  ideas:
    0: 'Foundation models exhibit striking in-context learning abilities, yet current learning theory offers little guidance on when such behavior is statistically possible or how much pretraining it requires. We introduce a formal framework for in-context learnability in which a fixed parametric predictor receives a prompt consisting of a small labeled dataset from a new task and must generalize to unseen inputs from that task, after a separate meta-learning phase across many related tasks. Within this setting we define the contextual information dimension, a distribution-dependent complexity measure that quantifies how concisely tasks drawn from a meta-distribution can be encoded into prompts. We prove that this quantity characterizes the meta-sample complexity of in-context learning: it yields matching upper and lower bounds for the number of tasks needed to meta-train a universal in-context learner and for the number of in-context examples required at test time. The theory reveals when simple architectures, such as linear attention or shallow recurrent networks, can implement Bayes-optimal task inference from examples, and when no fixed architecture can in-context learn a given task family. Our results connect in-context learning to classical PAC and representation learning theory, suggesting new algorithms and pretraining objectives that target low contextual information dimension.'
    1: 'Modern learning systems are trained not on raw i.i.d. samples, but on sample-dependent neighborhoods produced by augmenters, generators, and retrieval-based editors. Classical generalization theory does not capture this regime: it either assumes fixed data distributions or treats transformations as perfectly label-preserving. We introduce a learning-theoretic framework for adaptive example expansion in which each training point induces a stochastic transformation orbit, potentially with controlled semantic drift. Our central object is the orbit complexity of a hypothesis class, a data-dependent measure of how much predictions can vary along augmentation trajectories. We prove excess-risk bounds that decompose into empirical orbit smoothness, orbit complexity, and a label-drift term quantifying deviation from exact invariance. This yields a principled criterion for when augmentation reduces effective sample complexity and when it amplifies overfitting by enlarging the reachable orbit geometry. The framework also motivates a new regularization strategy that penalizes unstable directions while permitting informative, non-invariant transformations. Beyond standard augmentation, our theory applies to synthetic data generation and test-time adaptation, providing a unified account of learning from transformed neighborhoods rather than isolated examples.'
