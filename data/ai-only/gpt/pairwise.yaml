  ideas:
    0: 'Modern generative models achieve impressive fidelity but remain monolithic black boxes: a single dense network simultaneously learns world knowledge, algorithmic structure, and low-level rendering. This entanglement hinders modularity, interpretability, and precise control. We propose ToolGraph Generators, a new class of generative models whose latent space is an executable graph of calls to pretrained tools. Given a prompt, a graph generator samples a directed acyclic computation graph whose nodes select from a library of frozen expert modules—such as language models, vision encoders, simulators, or symbolic processors—and whose edges specify data flow between them. A differentiable executor interprets the graph to produce the final sample, while a likelihood-style training objective teaches the generator to compose tools that explain the training data. A structured prior over graphs encourages reusable subroutines and enables editing generations by local graph surgery. By turning generation into learned tool orchestration rather than monolithic decoding, ToolGraph Generators create a path toward more modular, inspectable, and systematically controllable generative systems.'
    1: 'Modern generative models are highly expressive but remain correlation-driven: prompts and guidance steer outputs without exposing variables that are stable under intervention. We propose Interventional Diffusion, a generative framework that equips diffusion models with a latent structural causal model over objects, attributes, and relations. Generation proceeds by sampling exogenous noise and causal mechanisms in a slot-based graph, followed by rendering with a denoiser conditioned on the graph state. Training couples standard denoising with an intervention-consistency objective that swaps, fixes, or resamples subsets of latent mechanisms across paired examples and requires the rendered distribution to preserve unaffected factors while propagating causal changes to descendants. To avoid annotated interventions, we derive pseudo-interventions from temporal coherence, multi-view agreement, and augmentation-induced invariances, and regularize the learned graph toward sparsity and modularity. The framework enables counterfactual editing, compositional generation from partially specified interventions, and simulation-style rollouts in which controls correspond to semantic mechanisms rather than prompt heuristics. More broadly, Interventional Diffusion reframes controllable generation as learning mechanisms, not only mappings from conditions to observations.'
