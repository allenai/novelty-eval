    0: Generative models are typically trained to reproduce data distributions under fixed conditioning interfaces such as text prompts or class labels, making it difficult to impose novel, structured constraints at test time without retraining. We propose Programmable Meta-Guided Generation (PMG2), a framework that treats user constraints as black-box programs and meta-learns a generic guidance policy that steers pre-trained generative models to satisfy them. PMG2 assumes access only to forward and, when available, gradient evaluations of an arbitrary constraint function applied to candidate samples. During training, the system observes a diverse distribution of synthetic constraint programs defined over the same data domain, and learns a neural “constraint compiler” that maps constraint feedback and model state to a vector field over the latent or denoising trajectory. This vector field is injected into the sampling process of diffusion or autoregressive backbones, yielding amortized constrained sampling that preserves the base model’s prior while enforcing unseen constraints at inference time. The approach unifies classifier guidance, energy-based refinement, and amortized optimization under a single meta-learning objective, enabling generative models to be targeted by declarative specifications, simulators, or learned reward models without architecture-specific engineering.
