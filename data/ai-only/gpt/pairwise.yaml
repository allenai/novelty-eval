    0: Physical sciences rely on a small set of dimensionless invariants (e.g., Reynolds, Damköhler, Péclet numbers) that collapse diverse systems onto universal scaling laws. Current scientific machine learning models largely ignore units and dimensional structure, limiting their ability to generalize across regimes and experimental setups. This work proposes UniPi, a self-supervised framework that learns reusable dimensionless representations directly from heterogeneous experimental data annotated only with physical units. UniPi embeds each variable in a vector space of base dimensions and optimizes linear combinations in log-space that are constrained to be dimensionless while maximally predictive of observed responses. A contrastive objective aligns experiments that differ only by unit-consistent rescalings or known symmetries, encouraging the model to discover similarity variables that collapse their behavior, while a sparsity prior yields compact, interpretable invariants. The learned “Pi-coordinates” serve as inputs to downstream neural surrogates and as shared latent factors across physics, chemistry, and biology tasks, enabling cross-domain transfer, principled extrapolation to new scales, and data-driven discovery of previously unknown scaling laws.
    1: Machine learning for physical sciences has largely focused on mapping structures to properties, leaving the harder question of how desired states can be physically realized underexplored. We propose a process-centric foundation model for scientific discovery that learns from heterogeneous synthesis protocols, time-resolved measurements, and simulation-derived priors to generate experimentally plausible pathways toward target materials or molecular states. The core idea is to represent each experiment as a stochastic trajectory in a latent reaction-coordinate space, and to train a diffusion-based controller that denoises partial protocols into complete action sequences conditioned on desired final observables. To prevent physically implausible generations, we introduce a thermodynamic consistency layer that softly enforces conservation laws, monotonic free-energy relaxation where appropriate, and phase-feasibility constraints derived from known equilibria. The model further treats failed and interrupted experiments as informative counterfactuals, using them to shape the boundary of feasible synthesis regions. By shifting prediction from static endpoints to controllable pathways, this framework aims to unify inverse design, experiment completion, and autonomous planning across chemistry, materials science, and synthetic biology.
