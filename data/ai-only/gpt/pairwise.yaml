    1: Bilevel optimization underpins hyperparameter tuning, meta-learning, and data reweighting, yet remains constrained by the need to repeatedly solve and differentiate through expensive inner optimization problems. We propose a generative perspective on bilevel optimization that replaces explicit inner-loop training with an amortized, differentiable surrogate of optimization trajectories. Our approach learns a conditional diffusion model that maps problem descriptors and hyperparameters to full parameter trajectories, with its terminal state approximating an inner-level optimum. The diffusion process serves as a flexible parameterization of optimization dynamics, enabling the model to represent multi-stage behaviors such as rapid descent, curvature adaptation, and late-stage stabilization. By matching generated trajectories to real optimization paths and regularizing terminal states toward first-order stationarity, the surrogate becomes a drop-in replacement for the inner solver. Outer-level objectives and hypergradients are then computed by a single forward–backward pass through the generative model, eliminating unrolled optimization and large linear solves. This framework opens a path toward scalable bilevel optimization with long horizons, complex architectures, and rich structural priors on optimization dynamics.
