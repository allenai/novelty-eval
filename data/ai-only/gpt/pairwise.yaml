    0: Robotic foundation models can generate semantically plausible task plans, but they remain difficult to execute reliably in partially observed, dynamically changing environments because action feasibility is rarely represented explicitly. We propose Contractive Affordance Programs, a planning framework that compiles language-conditioned manipulation and navigation tasks into object-centric programs whose operators carry learned preconditions, effects, and safety contracts. Instead of predicting only future observations, a multimodal world model estimates a differentiable affordance field for each skill over geometry, semantics, and epistemic uncertainty, defining where and when that skill is valid. Planning alternates between discrete search over skill compositions and continuous optimization within these validity regions, yielding executable plans that remain interpretable at the symbolic level while staying grounded in sensor data. When execution violates a contract, an online repair module synthesizes local subgoals and updates the active program without replanning from scratch. The resulting formulation unifies symbolic task planning, learned world models, and uncertainty-aware control, offering a path toward more compositional, failure-aware autonomy in long-horizon embodied tasks.
    1: Learning-based autonomy offers flexible, high-performance control for robots, yet it remains difficult to guarantee safety when planners operate with approximate models and high-dimensional sensory inputs. We introduce Trajectory Manifold Shielding, a planner-agnostic safety layer that constrains robot behavior by learning an implicit manifold of safe closed-loop trajectories from offline experience. The core idea is to train a generative sequence model whose latent space parameterizes dynamically feasible, safety-compliant behaviors subject to complex, nonconvex constraints such as collisions, contact instabilities, or social norms. At test time, arbitrary candidate plans produced by sampling-based, optimization-based, or neural planners are treated as noisy observations and are projected onto the learned safety manifold via a differentiable optimization that trades off task performance against a learned notion of safety distance. This projection acts as a universal, compositional safety shield that can be retrofitted onto existing autonomy stacks, leverages sparse safety annotations instead of formal specifications, and naturally extends to multi-robot settings by modeling joint safe trajectory manifolds for interacting agents.
