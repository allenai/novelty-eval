    0: Frontier models increasingly act through search, code, and APIs, yet their training remains dominated by next-token prediction and expensive real-world interaction. We introduce a model-based framework for agentic foundation models that learns to internally simulate tool use before executing it. Our method trains a language-conditioned latent world model over interaction traces, compressing external observations, tool outputs, and evolving workspace state into a structured belief state that predicts counterfactual transitions under candidate actions. A policy model then plans in imagination by rolling out latent trajectories, selecting action sequences that satisfy goal-consistency and verifier-based constraints, while an uncertainty-aware grounding loop executes only informative or high-risk steps to refresh the simulator and prevent drift. This converts tool use from reactive imitation into deliberative prediction, enabling long-horizon reasoning with sparse external feedback. By unifying language modeling, world modeling, and uncertainty-gated execution, the framework offers a path toward more sample-efficient, safer, and strategically capable foundation-model agents in open-ended environments.
    1: 'Frontier language models are increasingly deployed across jurisdictions, organizations, and applications that demand distinct normative behaviors, yet alignment techniques remain monolithic: each model–policy combination typically requires bespoke human-intensive fine-tuning. We introduce Policy2Align, a meta-alignment framework that translates natural-language governance specifications directly into editable steering layers for arbitrary foundation models. Policy2Align is trained on pairs of (policy description, weak supervision over desired behaviors) spanning diverse value systems and base architectures. It learns to emit compact alignment modules—implemented as energy-based logit shapers and decoder-side controllers—that can be hot-swapped into frozen frontier models without task-specific retraining. A policy-conditioned latent interface allows continuous interpolation between value systems, enabling, for example, jurisdiction-aware safety profiles or organization-specific content policies from the same base model. A constraint-aware decoding scheme enforces hard prohibitions while preserving the model’s general capabilities through a learned “minimal intervention” objective. Policy2Align reframes alignment as amortized inference from governance text to behavioral modifications, opening a path toward auditable, rapidly reconfigurable, and value-pluralistic frontier model deployments.'
