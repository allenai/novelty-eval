  ideas:
    0: 'Foundation models and deep classifiers are increasingly deployed in settings where decisions must be explained, audited, and contested, yet most existing explanations are non-binding stories: they can be plausible to humans while remaining only weakly coupled to the model’s actual computation. We introduce Proof-Carrying Explanations (PCE), a framework in which every prediction is accompanied by a machine-checkable proof that is formally sufficient to reconstruct that prediction from a set of interpretable atomic facts. PCE combines a neural proof generator, which outputs both a label and a structured derivation in a lightweight domain-specific logic, with a deterministic proof verifier that recomputes the label solely from the derivation. Training objectives distill a black-box model into this neurosymbolic interface, enforcing agreement between original and verified predictions while penalizing proof length and the use of uninterpretable atoms. Because predictions are only trusted when their proofs verify, explanations become faithful by construction and immediately amenable to static analysis, aggregation, and counterfactual editing. This paradigm opens a path towards testable, policy-aware explanations suitable for high-stakes, regulated AI deployments.'
    1: Post-hoc explanations often highlight correlated pixels or tokens, but rarely identify which latent factors actually drive a model’s decision, making explanations brittle and non-actionable. We propose Causal Concept Graphs, a model-agnostic framework that turns a frozen predictor into a local, executable explanation by discovering concepts and estimating their interventional effect on predictions. The approach first decomposes internal activations into candidate concepts using invariance under semantics-preserving perturbations and cross-instance factorization. It then learns a generative concept editor that performs minimal counterfactual edits to one concept while approximately holding others fixed, enabling interventions directly in the model’s representation space. From these interventions, we fit a sparse structural equation model whose nodes are discovered concepts and whose edges capture causal dependencies and context-specific interactions that lead to the output. The resulting explanation is a directed concept graph augmented with prototype or language anchors and feasible recourse actions derived from the learned interventions. By shifting explainability from attribution to intervention, the framework offers a path toward faithful, stable, and human-readable explanations for auditing spurious reasoning and diagnosing failure modes in complex models.
