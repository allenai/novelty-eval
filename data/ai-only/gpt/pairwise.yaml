    0: Frontier language models exhibit emergent capabilities but their safety and value alignment are governed by global fine-tuning procedures that lack mechanistic control. We propose Causal Circuit Editing (CCE), a training framework that links mechanistic interpretability tools with targeted parameter updates to reshape specific internal computations in large foundation models. CCE first uses causal tracing and activation patching to localize compact subnetworks—circuits—responsible for families of behaviors, such as sycophancy, deceptive planning, or style adherence. It then introduces learnable editing modules constrained to these localized circuits and optimizes them on counterfactual datasets that juxtapose desirable and undesirable behaviors under matched prompts, while applying invariance regularization outside the edited subspace. This design aims to rewrite the internal implementation of problematic behaviors without degrading unrelated capabilities, enabling fine-grained behavioral guarantees that are difficult to obtain with global preference optimization alone. Because CCE operates at the level of mechanistically identified features, it offers a path toward scalable, auditable alignment interventions in frontier models, and suggests a new paradigm where interpretability is not only diagnostic but prescriptive in the training loop.
    1: Foundation models encode a vast amount of factual knowledge, but they store it as a static mixture of truths from different periods, making them brittle when facts change and unreliable for historical or time-specific reasoning. We introduce ChronoForge, a continuous-time adaptation framework that factorizes a frozen language model into timeless linguistic competence and a date-indexed factual state. ChronoForge learns a temporal hypernetwork that generates lightweight adapters from calendar time, allowing the model to interpolate between periods rather than maintain disjoint snapshots. Training combines language modeling on timestamped corpora with a temporal consistency objective that enforces coherent evolution of entities, relations, and events while permitting abrupt updates at learned change points. At inference, the model conditions on an explicit or inferred date to produce answers from the corresponding latent world state and can surface temporal uncertainty when evidence is sparse or conflicting. By turning parametric knowledge into a continuous temporal process, ChronoForge enables historically grounded generation, localized knowledge editing, and incremental updates without retraining the full foundation model.
