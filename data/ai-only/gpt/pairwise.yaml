    0: Generative models produce realistic samples yet remain brittle under compositional prompts and hard structural constraints because denoising commits to local decisions before global consistency is known. We introduce Constraint-Carrying Diffusion, a framework that augments each latent state with a set of learned semantic commitments that evolve jointly with the sample. A proposal module infers provisional constraints from noisy latents, a neural verifier detects cross-object, temporal, or syntactic inconsistencies, and a latent repair operator selectively rewrites only the violating subspaces rather than restarting the entire trajectory. Training combines standard denoising with counterfactual corruption of partial generations, teaching the model to recover from its own inconsistent intermediate states and to internalize structure instead of relying solely on external guidance. The resulting sampler behaves as a generate-then-revise process inside the diffusion trajectory, enabling controllable generation, compositional editing, and constraint satisfaction in a modality-agnostic manner.
    1: Generative models are typically trained to match data distributions, while downstream applications demand samples that satisfy explicit rewards or constraints. Existing approaches add such preferences via rejection sampling, constrained decoding, or reinforcement learning, all of which either waste samples or require expensive optimization at inference. We propose Search-Augmented Generative Modeling, a framework that integrates Monte Carlo tree search with likelihood-based training to amortize structured search into a single generative model. We view generation as a sequential decision process and run tree search in token or latent space, using domain rewards together with a base generator to construct locally improved proposal policies and value estimates. These search policies define target distributions over continuation actions that we distill back into the generator through a KL-regularized objective, while a shared value head learns to predict long-horizon rewards. Iterating search and distillation yields a generator that approximates search-enhanced distributions yet samples in a single forward pass, enabling controllable generation under complex non-differentiable objectives. The framework is broadly applicable to text, code, molecular design, and structured prediction, and suggests a new paradigm where search procedures serve as transient teachers shaping general-purpose generative models.
