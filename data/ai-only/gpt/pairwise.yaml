    0: Frontier language models often produce fluent answers without representing which parts of the prompt, retrieved evidence, or tool outputs actually support those answers. This entangles reasoning with spurious context and limits faithfulness, controllability, and safe tool use. We introduce Context Contracts, a training framework that augments a frozen or trainable foundation model with a latent dependency layer that commits each response to a minimal support set and a set of invariance constraints. During training, the model observes counterfactual perturbations of prompts, retrieval snippets, and intermediate tool results; a contract loss enforces that generations remain stable under irrelevant edits and update predictably when contract-critical evidence changes. The dependency layer is learned without human rationales by optimizing for counterfactual sufficiency, necessity, and compactness, and can be queried to expose provenance or drive selective abstention. Because contracts are latent and low-dimensional, the approach preserves generation efficiency and can be attached to existing frontier models through lightweight adapters. We argue that dependency-aware generation offers a unified route toward more faithful retrieval-augmented generation, more reliable agentic pipelines, and finer-grained model editing.
    1: Frontier foundation models centralize both competence and control in a single, opaque parameterization, making it difficult to adapt behavior to heterogeneous norms, policies, and user preferences without costly retraining. We propose Governance Programs for Frontier Models (GovFMs), a modular control layer that decouples governance from generation. GovFMs treat the base model as a frozen semantic engine and learn small neural controllers that read intermediate activations and metadata to decide, at each decoding step, whether to continue, revise, veto, branch, invoke tools, or query external memory. Each controller is specified in a constrained policy language that compiles to a differentiable module, enabling both gradient-based training on logged human feedback and symbolic inspection of high-level rules. Multiple governance programs can be composed at inference time to encode jurisdictional regulations, organizational policies, or user-level constraints while sharing a single frontier backbone. This architecture reframes alignment as programmable control over a powerful but neutral generator, enabling auditable, rapidly updatable behavior without modifying frontier-scale weights.
