  ideas:
    0: 'Reinforcement learning agents typically learn task-specific, policy-dependent representations that entangle low-level observations with immediate control, limiting transfer and generalization. We propose Outcome-Driven State Abstraction (ODSA), a representation learning framework that organizes states according to their long-term achievable outcomes rather than their raw appearance or current policy. ODSA couples a distributional return predictor with a contrastive objective over multi-step rollouts: states whose induced distributions over future returns (under a diverse ensemble of behaviors) are similar are pulled together in latent space, while states with divergent outcome distributions are pushed apart. This yields a policy-agnostic embedding that approximates classical return-equivalent abstractions in a scalable, data-driven manner. The learned representation can be frozen and reused across tasks within the same environment family, providing a common outcome-centric latent space for downstream model-free or model-based RL. We analyze conditions under which ODSA recovers bisimulation-like abstractions and discuss how outcome-based state representations enable more robust transfer, offline RL, and hierarchical planning.'
    1: 'Deep reinforcement learning struggles in long-horizon environments because learned representations are typically optimized for prediction or value estimation rather than actionable abstraction. We introduce Causal Event Options, a framework that converts raw interaction into a sparse event graph for hierarchical control. A latent world model is trained with intervention-aware consistency: by contrasting predicted rollouts under action perturbations, it isolates controllable state dimensions whose changes induce persistent downstream effects. These dimensions define discrete event variables, option targets, and termination conditions, while an information bottleneck encourages each option to capture a minimal causal effect instead of a superficial visual pattern. A high-level policy plans over the learned event graph using model-based search, and a low-level controller realizes event transitions with hindsight relabeling in latent event space. The resulting decomposition yields temporally extended actions aligned with environment structure, enabling exploration through event novelty and transfer by recombining previously learned event transitions under new reward functions. The framework offers a route toward RL agents that discover their own planning vocabulary directly from interaction, without handcrafted subgoals or external annotations.'
