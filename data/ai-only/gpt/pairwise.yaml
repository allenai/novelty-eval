    0: 'Modern generative models produce striking local realism yet often violate global commitments such as object identity, spatial topology, and narrative state because these properties are repeatedly re-inferred during generation. We propose Constitution Models, a general framework that augments a generator with a slow latent state encoding sample-level commitments that should remain stable across denoising steps or token positions. The constitution is learned without supervision through hindsight distillation: a recognition network extracts invariant codes from complete training examples, and the generator is trained so that partial renderings at different horizons induce the same code. A prior over constitutions guides the fast generator, while a lightweight revision operator updates local content without rewriting the latent commitments, enabling draft-and-revise generation within a single model. The framework is architecture-agnostic and can wrap diffusion, autoregressive, and latent-variable generators by explicitly separating commitment prediction from surface realization. This perspective turns coherence from an emergent property into an explicit training objective, opening a path toward more reliable long-form text, multi-object image, and temporally stable video generation.'
    1: 'Current generative models excel at realism but offer limited semantic control: latent variables are continuous, entangled, and hard to edit compositionally. We propose Program-Inducing Generative Models (PIGM), a neuro-symbolic framework that forces generation to proceed through an emergent, discrete program representation. PIGM couples a pretrained language model, constrained to emit a domain-specific generative language, with a neural renderer that maps programs to data (images, audio, or scenes). Both components are trained jointly from raw paired text–data without program supervision via a variational objective that trades off reconstruction fidelity, program sparsity, and reuse of subroutines. This objective encourages the system to discover reusable symbolic building blocks—objects, transformations, and layouts—that act as causal factors in the renderer. Conditioning on text first yields a latent program, which users can inspect and edit before rendering, enabling fine-grained control, counterfactual generation, and modular composition of outputs. PIGM aims to transform black-box generative models into editable, interpretable programmatic generators while retaining the flexibility of deep neural decoders.'
