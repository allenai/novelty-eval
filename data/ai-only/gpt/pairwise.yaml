  ideas:
    0: Explanations for complex machine learning models are often presented as static artifacts—saliency maps, local linear weights, or extracted rules—yet there is rarely any guarantee that these objects faithfully characterize the model’s behavior beyond a handful of inspected examples. This work proposes FLEX, a framework that treats explanations as falsifiable hypotheses about a model’s local decision mechanism. For a given prediction, FLEX synthesizes a compact, human-interpretable surrogate (e.g., a sparse rule or concept scorer) together with an explicit region of input space over which the surrogate is claimed to explain the black-box model. FLEX then actively attacks its own explanation by coupling targeted adversarial search with a data-aware generative neighborhood model to discover counterexamples that violate the hypothesized mechanism. Counterexamples drive counterexample-guided refinement of both the surrogate and its claimed region until no further violations can be found within a specified computational budget. The final output is an explanation paired with an estimated “explanation risk” and a precise abstention set where the method refuses to explain. By operationalizing interpretability as a process of hypothesis formation and attempted refutation, FLEX aims to produce explanations that are not only intelligible but empirically credible and explicitly limited in scope.
    1: Post-hoc explanations often identify salient features but rarely state whether those features are truly necessary, sufficient, or valid beyond an infinitesimal neighborhood, making faithfulness difficult to verify. We propose PopperX, an interpretability framework that treats explanations as falsifiable hypotheses about model behavior. For each prediction, an explainer produces a sparse set of human-interpretable concepts and a compositional rule linking them to the output, while a learned falsifier searches the data manifold for counterfactuals that preserve the rule yet flip the prediction, or violate the rule while leaving the prediction unchanged. Training couples the two modules in a minimax game, yielding explanations that survive adversarial attempts at refutation. The resulting explanation is accompanied by a falsification margin that quantifies its interventional validity region and exposes failure modes when no faithful explanation exists. Because PopperX reasons over concept-level interventions rather than raw-feature perturbations, it supports images, text, and tabular models with modality-specific concept encoders. This reframes explainability from producing plausible narratives to producing explanations that are explicitly testable, contestable, and certified against counterfactual attacks.
