  ideas:
    0: 'Interpretability methods often trade human readability for faithfulness: saliency maps and textual rationales are easy to consume but only loosely tied to the computation that produced a prediction, whereas mechanistic circuit analyses expose internal structure yet remain difficult to scale and communicate. We introduce Executable Concept Circuits, a framework for converting a model’s hidden computation into a sparse, human-auditable causal graph over learned concepts and internal modules. Given a pretrained network, the method projects intermediate activations into a reusable concept dictionary and infers a prediction-specific directed subgraph whose nodes and edges represent the minimal causal pathway to the output. Crucially, the explanation is executable rather than descriptive: interventional consistency objectives require the circuit to predict the model’s response to concept edits, feature deletions, and module ablations. Additional sparsity and stability constraints yield compact explanations that remain coherent across nearby inputs, enabling local circuits to be merged into global behavior maps. By turning explanations into simulatable causal objects, the framework supports why, why-not, and what-if queries while narrowing the gap between post-hoc explainability and mechanistic interpretability.'
    1: 'Deep models routinely produce decisions that humans cannot understand or reliably modify. Existing explanation methods typically yield static attributions that are difficult to verify and offer no principled way to turn an explanation into a controlled change of model behavior. We introduce Executable Concept Interfaces, a learning framework that couples an interpretable causal graph over human-level concepts with a differentiable edit operator on the underlying black-box model. For each input region, the method induces a compact concept graph whose nodes are grounded in internal activations and whose edges specify predicted causal effects of local interventions. A bi-directional interface then enforces consistency between this graph and the base model: observational predictions must match, and simulated interventions on concept nodes are compiled into low-rank parameter or activation edits that realize the same behavioral changes in the original model. By optimizing explanations under these executable consistency constraints, the framework yields explanations that are not only locally faithful and human-readable, but also actionable, supporting counterfactual querying, safety auditing, and user-driven steering of model behavior without full retraining.'
