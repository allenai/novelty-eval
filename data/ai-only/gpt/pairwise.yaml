  ideas:
    0: 'Modern learning algorithms often interpolate the training set yet generalize across transformations and domains, exposing a mismatch between classical capacity measures and invariance-driven practice. We introduce orbit compression theory, a learning-theoretic framework in which examples are not atomic points but transformation or intervention orbits induced by latent symmetries. Its central quantity, the orbit compression dimension, is the smallest number of orbit representatives and equivariant reconstruction rules needed to recover a predictor on the training support. We derive generalization bounds that scale with orbit complexity and orbit curvature rather than ambient dimension, showing how data augmentation, contrastive objectives, weight sharing, and margin maximization implicitly reduce effective complexity. We further propose a learning principle that jointly fits a predictor and a sparse orbit basis, yielding invariance-aware certificates and a criterion for benign overfitting: interpolation remains harmless when memorization is confined to low-curvature orbits. The framework unifies sample compression, PAC-Bayes analysis, and group-invariant learning, and suggests a route toward non-vacuous theory for heavily overparameterized models trained on structured data.'
    1: 'Modern overparameterized learners are typically analyzed through static properties of the final hypothesis, yet in practice the learning algorithm enforces strong structure on the entire optimization trajectory. We introduce trajectory compression complexity (TCC), a new capacity measure defined as the description length of the sequence of model iterates produced by a learning algorithm on a given dataset. Our framework views training as a data-dependent encoding process: the learner is constrained to hypotheses reachable via trajectories that admit succinct compression under a fixed code family. We derive distribution-free generalization bounds that depend on TCC rather than parameter count, obtaining guarantees that are dimension-free whenever the optimization path is compressible. We further show how TCC decomposes into contributions from initialization, update rule, and gradient signal, and connect it to algorithmic stability and PAC-Bayesian objectives. For stochastic gradient methods, we provide upper bounds on TCC in terms of step-size schedules, noise structure, and norm growth, offering a unified lens on the implicit regularization of large-scale nonconvex learning.'
