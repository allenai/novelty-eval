    0: 'Generative models capture complex data distributions but remain fundamentally correlational: latent edits often induce uncontrolled changes because semantic dependencies are encoded as co-occurrence rather than intervention. We propose Counterfactual Diffusion, a generative framework that augments a diffusion backbone with a learned structural causal model over latent slots. A shared exogenous noise source defines sample identity, while sparse structural equations predict each slot from its parents and permit explicit interventions during denoising. Training requires no intervention annotations: the model synthesizes paired factual and counterfactual trajectories from the same noise realization, enforces preservation of non-intervened factors through cycle and invariance objectives, and recovers graph structure via sparsity on cross-slot dependencies stabilized across augmentations. This recasts denoising as amortized counterfactual inference, encouraging latent variables to represent manipulable mechanisms rather than entangled features. The resulting model supports fine-grained editing, composition under unseen factor combinations, and more stable controllability, suggesting a path toward generative systems that can answer not only what is likely, but also what would change and what should remain fixed.'
    1: Generative models can now synthesize high-fidelity samples across modalities, yet steering them to respect complex global constraints specified only by non-differentiable oracles remains difficult. We introduce Oracle-Distilled Guidance (ODG), a general framework for post-hoc constraint alignment of pretrained generators using black-box feedback. ODG alternates between sampling from a generator, querying one or more oracles that encode logical rules, simulators, or human preference functionals, and fitting a differentiable constraint potential that predicts oracle scores over the generator’s output space. This learned potential is then treated as an energy-based guidance term that shapes subsequent sampling in latent or data space, while regularization preserves proximity to the original data distribution. Iterating this loop yields generators that internalize rich, compositional constraints and support explicit trade-offs between fidelity and constraint satisfaction at inference time. ODG conceptually unifies classifier guidance, RLHF-style fine-tuning, and energy-based correction within a single, oracle-driven generative modeling framework applicable to text, images, and structured objects.
