    0: 'Modern overparameterized learners achieve strong generalization despite enormous parameter counts, challenging classical complexity measures that operate primarily in parameter space. We propose a function-space perspective based on optimal transport to characterize when such learners generalize. We define the transport complexity of a learning algorithm as the Wasserstein cost between the random output functions it induces under two sources of randomness: data resampling and algorithmic noise (initialization, stochastic optimization, dropout). This quantity captures how much the algorithm’s input–output behavior can move under perturbations of its training process, without referring to any particular parameterization. Leveraging PAC-Bayesian and algorithmic stability tools, we derive generalization bounds that depend only on transport complexity and a mild calibration term, thereby separating expressivity from procedural robustness. We further show how to approximate and regularize transport complexity via stochastic functional perturbations implementable with standard training pipelines. The framework yields a unified lens on ensembling, sharpness-aware training, and stochastic optimization as mechanisms that implicitly minimize transport complexity, offering a principled route to function-space–based generalization guarantees for modern deep learning.'
    1: Modern foundation models often acquire new tasks from context alone, yet classical learning theory largely analyzes either parameter-updated learners or fixed hypothesis classes, leaving in-context learning without a sharp sample-complexity account. We introduce contextual hypothesis complexity, a sequence-dependent measure of how a prompt contracts the set of functions a pretrained model can realize on future inputs. This perspective treats a transformer as an implicit meta-learner that maps contexts to task-local predictors, and yields generalization bounds whose dominant term depends on prompt-induced contraction rather than parameter count. We derive PAC-Bayesian and online-to-batch variants of these bounds, identify a stability threshold beyond which additional demonstrations induce prompt overfitting, and characterize when latent task structure makes longer contexts provably beneficial. Building on the theory, we propose a pretraining regularizer that minimizes worst-case contextual complexity across task families, encouraging representations that are easier to adapt in context. The framework unifies few-shot prediction, retrieval-augmented prompting, and prefix tuning under a common learnability notion, offering a foundation for a theory of adaptation in large models.
