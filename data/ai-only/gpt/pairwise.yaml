  ideas:
    0: Large language models often produce confident answers from a single latent world state, making them brittle when prompts hide assumptions, include spurious cues, or admit multiple valid interpretations. We introduce AssumptionGraph, a framework that elevates assumptions to explicit latent variables for both training and inference. Given an input, the model first infers a compact graph of assumptions supporting candidate answers, then generates structured counterfactual edits that preserve task intent while varying irrelevant or uncertain premises. Reasoning is performed jointly across these worlds with an invariance objective that enforces agreement when conclusions should remain stable and preserves divergence when assumptions genuinely change the answer. Counterfactual disagreement is converted into calibrated abstention or targeted clarification questions, rather than forced completion. The assumption graph also provides a lightweight interface for tool use and oversight, allowing external modules to inspect, edit, or verify the premises behind a claim without exposing full chain-of-thought. By supervising models on assumption discovery and counterfactual stability, AssumptionGraph offers a path toward more robust, faithful, and controllable frontier models.
    1: 'Foundation models based on next-token prediction offer powerful linguistic competence but lack an explicit representation of their own epistemic state, leading to overconfident errors and brittle alignment. We propose Epistemic Self-Consistency Pretraining (ESCP), a framework that trains frontier language models to model their own future behavior. ESCP first constructs an epistemic corpus by querying a frozen base model with diverse decoding strategies over large prompt sets, yielding empirical answer distributions that capture internal disagreement and ambiguity. A successor model is then trained with a dual objective: generate an answer and simultaneously predict the distribution over its alternative answers, using a divergence-based loss that rewards accurate self-uncertainty. This self-distilled epistemic head is tightly coupled to the base representation, enabling the model to natively track question difficulty, ambiguity, and under-specification without external ensembles or repeated sampling. ESCP further incorporates optional human preference signals to reshape epistemic distributions, attenuating undesirable answer modes while preserving calibrated uncertainty. The resulting frontier models provide explicit, token-level epistemic signals that can drive abstention, tool routing, multi-step reasoning policies, and downstream alignment protocols, without requiring task-specific supervision or architectural overhauls.'
