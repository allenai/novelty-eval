    0: Diffusion models produce realistic samples but typically re-infer global structure at every denoising step, making generation memoryless and prone to semantic drift. We propose Commitment Diffusion, a stateful generative framework that equips the reverse process with a small set of persistent latent commitment tokens. Early timesteps write uncertain coarse decisions—such as layout, identity, or motion—into these tokens, and later timesteps are trained to refine local detail while remaining consistent with the committed semantics. To induce this behavior, we combine an information-scheduled objective that encourages coarse-to-fine uncertainty allocation, a temporal consistency loss that stabilizes token identity across denoising steps, and a trajectory-replay objective that maps multiple noisy realizations of the same sample to shared commitments. The resulting model turns hidden intermediate decisions into explicit, persistent state, enabling native controllability without external guidance optimization. Commitment tokens serve as editable handles for partial regeneration, compositional conditioning, and cross-modal alignment, while preserving the flexibility of standard score-based generation. More broadly, the framework introduces persistent internal memory as a first-class primitive for generative modeling.
