    0: Multimodal foundation models typically align representations at a global level, mapping entire images, audio clips, and sentences to a shared embedding space. However, this coarse alignment fails to capture the rich fine-grained correspondences that naturally exist across modalities—such as phonemes synchronized with lip movements, or spoken words grounded in visual regions. We introduce Anchor-Aligned Multimodal Transformers, a framework that learns dense token-level alignment across vision, audio, and language through dynamically discovered anchor tokens. Rather than exhaustive cross-modal attention, our approach identifies sparse synchronization points that serve as shared reference frames, enabling efficient fine-grained alignment with sub-quadratic complexity. A contrastive objective encourages anchor tokens to capture modality-invariant semantics while preserving modality-specific details in surrounding representations. The framework operates as a lightweight adapter on frozen unimodal encoders, injecting cross-modal structure without catastrophic forgetting of pretrained knowledge. Anchor-Aligned representations enable precise temporal grounding, fine-grained retrieval, and improved generation quality for tasks requiring tight cross-modal synchronization, offering a new paradigm for multimodal understanding beyond global alignment.
    1: 'Multimodal learning typically assumes temporally aligned and complete observations across modalities, yet real-world scenarios often present asynchronous streams, variable sampling rates, and missing data. We introduce Temporal Neural Processes for Multimodal Learning (TNP-MM), a framework that models each modality as a continuous temporal function rather than discrete synchronized features. By leveraging conditional neural processes, our approach learns to encode observed multimodal contexts and decode representations or generate content at arbitrary query timestamps, naturally handling temporal misalignment and partial observations. A cross-modal temporal attention mechanism enables the model to discover and exploit temporal dependencies across modalities despite asynchrony, while uncertainty quantification provides confidence estimates for predictions in data-sparse regions. This formulation unifies multiple challenging scenarios: generating missing audio when only video is available at specific moments, aligning delayed sensor readings with visual observations, and performing multimodal inference from irregularly sampled inputs. TNP-MM offers a principled solution for robust multimodal understanding in autonomous systems, multimedia analysis, and human-computer interaction where perfect synchronization remains impractical.'
