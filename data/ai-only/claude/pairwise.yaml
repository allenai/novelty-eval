    0: 'Generative models excel at capturing common patterns but systematically underrepresent rare phenomena, limiting their utility in domains where tail events carry outsized importance. We introduce Spectral Decomposition Generative Models (SDGM), a framework that factorizes the generative process into frequency-specialized components operating across different regimes of the data distribution. SDGM learns a hierarchy of expert generators: bulk experts that efficiently model high-density regions and tail experts that focus computational capacity on rare but semantically significant modes. A learned density-aware router dynamically assigns samples to appropriate experts during training, while an inverse routing mechanism enables controlled generation along the common-to-rare spectrum at inference time. The framework introduces a frequency-balanced objective that prevents tail collapse without requiring explicit importance weights or oversampling. SDGM naturally supports rare-event amplification, allowing practitioners to intentionally oversample underrepresented phenomena for data augmentation or scenario planning. Our approach is architecture-agnostic and can be integrated with diffusion models, normalizing flows, or autoregressive generators, providing a principled mechanism for distribution-aware generation.'
    1: We introduce Compositional Multi-Modal Generation (CMMG), a framework that learns to dynamically orchestrate generation across multiple modalities and abstraction levels. Unlike conventional generative models that produce outputs in a fixed modality, CMMG employs a learned policy network that decides which representational format—whether sketch, language, 3D geometry, or texture—to generate at each step of the creative process. A cross-modal fusion architecture maintains coherence as the model transitions between heterogeneous representations, while a consistency objective ensures that intermediate generations across different modalities describe compatible outputs. The framework is trained end-to-end using a combination of reconstruction objectives across modalities and a reinforcement learning signal that rewards coherent multi-modal trajectories. By learning to compose generations across representational boundaries, CMMG captures the iterative, multi-format nature of human creative workflows and enables more controllable and interpretable generation for complex design tasks where no single modality suffices.
