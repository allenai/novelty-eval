    0: Foundation models trained on naturalistic data may converge on computational strategies that parallel those evolved in biological neural systems, yet methods to systematically test this hypothesis remain limited. We introduce NeuroAlign, a framework for real-time alignment between streaming neural recordings and foundation model representations during naturalistic stimulus processing. NeuroAlign employs a bidirectional adapter architecture that learns correspondences between artificial network layers and neural population dynamics across brain regions, while respecting the temporal structure of biological computation. A contrastive objective encourages representational alignment at multiple timescales, from rapid sensory encoding to slower semantic integration, enabling identification of shared computational motifs between silicon and biological substrates. The framework supports both encoding models that predict neural responses from foundation model activations and decoding models that reconstruct model representations from neural data. Beyond improving neural decoding performance, NeuroAlign provides interpretable mappings that reveal which computational strategies are shared versus divergent between artificial and biological intelligence, offering a new lens for understanding the computational principles underlying cognition.
    1: Neural foundation models trained on naturalistic stimuli and behavior could transform our understanding of brain-cognition relationships, yet existing approaches fail to capture the multi-scale temporal dynamics and cross-subject variability inherent to neural data. We introduce NeuroAlign, a hierarchical multimodal contrastive framework that aligns heterogeneous neural recordings with naturalistic sensory streams and behavioral outputs. Our approach employs temporal hierarchy-aware encoders that capture neural dynamics from milliseconds to minutes, while a subject-adaptive alignment module learns to map individual brain geometries into a shared cognitive space. Contrastive objectives enforce correspondence between neural states and external variables—visual scenes, spoken narratives, motor actions—without requiring explicit trial structure or time-locked designs. A novel causal masking strategy during training enables the model to perform zero-shot cognitive state decoding and cross-modal prediction. By learning transferable representations of cognitive processes grounded in ecologically valid contexts, NeuroAlign provides a unified framework for neural data interpretation that bridges recording modalities, experimental paradigms, and individual subjects.
