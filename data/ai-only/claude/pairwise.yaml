    0: 'Existing generative models excel at producing high-fidelity samples but lack interpretable mechanisms for compositional control over semantic attributes. We introduce Compositional Latent Flow Networks, a generative framework that decomposes the generation process into modular, reusable latent components corresponding to interpretable semantic factors. Rather than mapping noise directly to observations, our approach learns a structured latent space where each dimension governs a specific generative factor, and a learned composition function combines these factors into coherent outputs. We employ a novel training objective that encourages both factor disentanglement and compositional consistency, ensuring that latent components can be mixed and matched across samples while preserving semantic meaning. The framework operates through continuous normalizing flows in the compositional latent space, enabling efficient sampling and exact likelihood computation. By explicitly modeling compositionality, our approach provides unprecedented control over generation: users can selectively modify individual semantic aspects, interpolate between attribute combinations, and systematically explore the generative manifold. This paradigm shift from monolithic to compositional generation opens new possibilities for controllable synthesis, systematic generalization, and interpretable generative modeling.'
    1: Generative models produce outputs in a predominantly feedforward manner, lacking the capacity for introspective evaluation and self-correction that characterizes human creative processes. We introduce Reflective Generation, a framework that endows generative models with an integrated self-critique mechanism enabling iterative refinement without external feedback. Our approach augments the generative architecture with a reflection module that learns to identify deficiencies in intermediate outputs and propose targeted corrections. During training, we construct synthetic critique-revision trajectories from existing data, teaching the model to recognize quality gradients in its own generation space. At inference time, the model alternates between generation and reflection phases, using self-generated critiques to guide successive refinement steps. A key innovation is our consistency-preserving revision objective, which ensures corrections address identified flaws while maintaining coherent global structure. The framework is architecture-agnostic and can be applied to diffusion models, autoregressive transformers, and other generative paradigms. Reflective Generation transforms single-shot generation into an adaptive, self-improving process that mirrors deliberate human creativity.
