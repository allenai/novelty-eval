    0: Understanding how neural networks transform inputs into outputs requires tracing not just which components activate, but how abstract concepts flow and evolve through computation. We introduce Concept Trajectory Analysis (CTA), a framework for interpreting transformer models by learning continuous trajectories in a structured concept space that track semantic information as it propagates through layers. CTA learns a shared embedding space where both intermediate representations and human-interpretable concepts coexist, enabling visualization of how inputs traverse conceptual regions during the forward pass. Unlike static attribution methods, CTA captures the dynamic nature of neural computation, revealing where concepts emerge, merge, or dissipate across depth. We further introduce trajectory interventions—targeted modifications to conceptual paths that enable precise behavioral control without retraining. Our framework provides a unified lens connecting mechanistic findings about individual components to emergent model behaviors, offering practitioners tools to diagnose reasoning failures, understand capability emergence, and perform semantically meaningful model editing through trajectory manipulation rather than weight modification.
    1: Deep neural networks learn rich internal representations that remain largely opaque to human understanding. While sparse autoencoders can decompose model activations into interpretable directions, these features lack semantic labels, requiring extensive manual analysis. We propose a self-supervised framework that automatically discovers and linguistically grounds interpretable features within foundation models. Our approach trains sparse bottleneck modules to decompose intermediate activations, then leverages the model's own language understanding to generate natural language descriptions of each discovered feature. By probing feature activations with targeted inputs and using the model to summarize activation patterns, we create human-readable labels without manual annotation. A consistency objective ensures descriptions remain stable and meaningful across diverse contexts. This self-documenting mechanism transforms opaque neural representations into an interpretable feature library where each dimension has an associated semantic description. The framework enables scalable mechanistic interpretability, allowing researchers to rapidly understand what concepts models learn and how they compose them for downstream reasoning, without requiring extensive domain expertise or manual feature annotation.
