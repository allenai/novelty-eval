    0: Large language models demonstrate remarkable capabilities in high-level task planning for robotic systems, yet their generated plans often violate physical constraints governing real-world execution. We introduce PhysicsFlow, a framework that grounds autoregressive plan generation in differentiable physics simulation without requiring robotics-specific fine-tuning. PhysicsFlow maintains a lightweight differentiable world model that runs in parallel with token generation, projecting partial plan sequences into physical trajectories and computing constraint violation gradients. These gradients modulate the token sampling distribution through a learned adapter, steering generation toward physically feasible action sequences while preserving the semantic reasoning capabilities of the base model. A key component is our constraint anticipation mechanism, which predicts downstream physical violations from partial plans, enabling early correction before infeasible commitments propagate. PhysicsFlow operates as a plug-and-play module compatible with frozen pretrained language models, requiring only the specification of task-relevant physical constraints. Our framework bridges the gap between symbolic planning and embodied execution, enabling language models to reason about manipulation, locomotion, and navigation tasks while respecting dynamics, collision geometry, and actuator limits.
    1: Autonomous systems operating in novel environments face a fundamental tension between task completion and world model uncertainty. Existing planning approaches either assume known dynamics or treat exploration and exploitation as separate phases, limiting adaptability in unstructured settings. We introduce Epistemic Planning Networks, a framework that unifies task-oriented planning with active model refinement through uncertainty-aware action selection. Our approach employs deep ensemble dynamics models to estimate epistemic uncertainty, then formulates planning as a bilevel optimization problem where actions are selected to simultaneously reduce model uncertainty in task-relevant regions and progress toward goal states. A neural architecture learns to predict the information gain of candidate trajectories, enabling efficient online replanning as the model is refined through interaction. By explicitly reasoning about what the robot knows and what it needs to learn, our framework enables autonomous systems to intelligently balance information gathering with goal pursuit, facilitating robust deployment in unfamiliar environments without requiring complete prior models or extensive offline training in every new domain.
