160:
  context: causal reasoning
  expected_winners:
  - 0
  ideas:
    0: 'Current approaches to causal reasoning either assume fixed causal graphs or rely on language models that conflate correlation with causation. We introduce Causal Self-Refinement (CSR), a framework that enables iterative construction and revision of causal hypotheses through a closed-loop reasoning process grounded in interventional semantics. CSR operates in three phases: hypothesis generation, where candidate causal structures are proposed from natural language descriptions; intervention simulation, where the model mentally simulates do-operations to derive expected outcomes; and consistency verification, where predictions are checked against observed or counterfactual evidence to identify structural errors. When inconsistencies arise, the model revises its causal beliefs and iterates. Central to our approach is a causal memory module that maintains evolving graph structures with uncertainty estimates over edge existence and direction. We further introduce intervention prompting, a technique that teaches models to distinguish observational from interventional queries without explicit graph supervision. CSR transforms causal reasoning from static inference into a dynamic belief revision process, enabling adaptation to novel domains and robustness to initial misconceptions about causal structure.'
    1: Causal discovery from observational data remains challenging due to fundamental identifiability issues and the need for strong structural assumptions. We propose a framework that leverages pretrained large language models as sources of causal priors to guide structure learning algorithms. Our approach elicits qualitative causal knowledge—such as plausible direct causes, effect relationships, and causal orderings—from LLMs through carefully designed prompting strategies, then translates this knowledge into soft probabilistic constraints within a Bayesian causal discovery framework. To address LLM unreliability, we introduce a confidence calibration mechanism that weights LLM-derived priors based on consistency checks and uncertainty quantification. The framework treats LLM knowledge as defeasible guidance rather than hard constraints, allowing data-driven learning to override incorrect priors when sufficient evidence exists. This hybrid approach combines the sample efficiency of knowledge-driven methods with the empirical grounding of data-driven techniques, enabling more robust causal discovery in domains where expert knowledge is scarce but linguistic descriptions of causal mechanisms are abundant.
