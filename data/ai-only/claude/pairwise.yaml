    0: 'We introduce Deliberative Generation Networks, a framework that equips generative models with explicit multi-step reasoning capabilities during the generation process. Unlike conventional approaches that produce outputs through direct sampling or fixed refinement schedules, our method decomposes generation into a sequence of deliberate reasoning steps: planning, drafting, critique, and revision. The model first constructs a high-level structured plan represented as a latent graph capturing semantic dependencies and compositional structure. This plan guides an initial draft generation, which is then processed by a learned self-critique module that identifies inconsistencies, missing details, or quality issues. Based on this critique, a revision network selectively refines specific components while maintaining global coherence. Crucially, the entire reasoning chain is differentiable and learned end-to-end through a combination of reconstruction objectives and auxiliary losses that encourage meaningful intermediate representations. By making the reasoning process explicit and iterative, our framework enables more controllable generation, better handling of complex compositional tasks, and interpretable insights into the model''s creative process, opening new possibilities for human-AI collaborative content creation.'
    1: 'Generative models typically employ monolithic architectures that apply uniform computational strategies across all regions of the data manifold, despite the heterogeneous nature of generative challenges—from synthesizing fine textures to maintaining global semantic coherence. We introduce Compositional Generative Routing, a framework that learns a library of specialized generative modules alongside a lightweight routing network that dynamically composes generation pathways conditioned on latent characteristics of the target output. Each module develops expertise for distinct generative subtasks, while the router learns to orchestrate their activation patterns without explicit supervision of the decomposition. During the denoising process, routing decisions adapt at each step, allowing the model to shift between pathways as generation progresses from coarse structure to fine details. This compositional approach enables sparse activation during inference, as only relevant modules engage for any given generation. Beyond efficiency gains, the learned decomposition provides interpretable control: users can amplify or suppress specific pathways to steer generation toward desired characteristics. Our framework applies broadly across generative paradigms, offering a principled approach to injecting modularity and dynamic computation into the generative process.'
