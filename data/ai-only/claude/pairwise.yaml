    0: Computational materials discovery has traditionally relied on expensive quantum mechanical simulations to explore chemical space, creating a bottleneck between in silico design and experimental realization. We introduce PhysDiff, a physics-informed diffusion framework for inverse materials design that simultaneously optimizes target properties and synthesizability constraints. Our approach embeds thermodynamic stability criteria and crystallographic symmetries directly into the denoising process through equivariant graph neural architectures, ensuring generated structures obey fundamental physical laws. Unlike conventional generative models that propose chemically implausible candidates, PhysDiff incorporates a learned synthesis pathway prior extracted from experimental literature, biasing generation toward experimentally accessible regions of chemical space. The model operates in a multi-objective setting, conditioning on desired electronic, mechanical, or optical properties while maintaining synthetic feasibility. By unifying property optimization with manufacturing constraints in a single generative framework, PhysDiff aims to accelerate the pipeline from computational prediction to laboratory synthesis, addressing a critical gap in materials innovation.
    1: Multi-scale simulation is essential for modeling complex physical systems, yet current approaches rely on manually designed coupling schemes between scales that are domain-specific, computationally brittle, and prone to boundary artifacts. We introduce ScaleFlow, a neural framework that automatically learns scale transitions in physical systems by treating them as learnable information bottlenecks. ScaleFlow employs a hierarchical architecture where each level operates at a distinct spatiotemporal resolution, with trainable projection operators that discover which microscopic degrees of freedom are relevant for coarse-grained dynamics. A scale-consistency loss ensures physical quantities are preserved across resolutions, while an adaptive switching mechanism learns when scale transitions should occur based on local system state. The framework is trained end-to-end on simulation trajectories spanning multiple scales, eliminating the need for hand-crafted coarse-graining rules. ScaleFlow provides a unified approach applicable across domains—from molecular systems to continuum mechanics—enabling seamless traversal of scale hierarchies while maintaining physical consistency and dramatically reducing computational cost compared to full fine-scale simulation.
