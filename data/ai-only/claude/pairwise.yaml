  ideas:
    0: Graph neural networks operate primarily on discrete topological structures, while geometric deep learning on manifolds handles continuous spaces, yet many complex systems inherently exhibit both discrete relational patterns and continuous geometric properties. We introduce GeomBridge, a unified neural architecture that jointly learns from data residing on hybrid geometric-topological spaces. Our framework employs a novel cross-geometric attention mechanism that dynamically fuses representations from discrete graph convolutions and continuous manifold operators, enabling information flow between topological and geometric views of the same data. By treating different geometric structures as complementary modalities, GeomBridge learns to extract discrete connectivity patterns while simultaneously capturing smooth geometric variations in ambient space. A geometry-aware contrastive objective encourages consistency across views while preserving structure-specific inductive biases. This approach naturally handles molecules with both bond graphs and 3D conformations, social networks with geographic embeddings, and spatiotemporal systems where topology evolves over continuous manifolds. GeomBridge provides a principled path toward representation learning on heterogeneous geometric structures, bridging the gap between discrete and continuous geometric deep learning paradigms.
    1: 'Graph neural networks operate on fixed topologies, yet real-world systems exhibit rich multi-scale structure where relevant geometric relationships change across levels of granularity. We introduce Scale-Equivariant Graph Networks (SEGNs), a framework that learns representations equivariant to hierarchical coarse-grainings of graph topology. Our key insight is that meaningful graph representations should exhibit consistency across scales: fine-grained features must aggregate coherently into coarser descriptions, analogous to renormalization group flows in physics. SEGNs achieve this through learnable pooling operators that respect topological persistence—identifying structural motifs that remain salient across multiple resolutions. We formalize scale equivariance as an inductive bias, requiring that learned representations commute with coarse-graining operations up to learned transformations. This is implemented via a bidirectional architecture where information flows both up and down the scale hierarchy, with cross-scale attention mechanisms that selectively propagate persistent topological features. The framework naturally handles graphs, simplicial complexes, and cell complexes within a unified formalism. SEGNs provide a principled approach to multi-scale reasoning on geometric data, offering new capabilities for domains characterized by hierarchical organization, from molecular systems to social networks.'
