    0: Large language models struggle with temporal knowledge dynamics, treating information as static despite operating in a world where facts, scientific understanding, and societal contexts continuously evolve. We introduce Temporal Knowledge Channels (TKC), a novel architecture that extends foundation models with parallel processing pathways encoding knowledge at different temporal states. Unlike retrieval-augmented approaches that externalize temporal information, TKC embeds temporal awareness directly into the model's computation graph through learned gating mechanisms that route queries through temporally-appropriate knowledge channels. Each channel maintains a lightweight adapter layer trained on time-stamped corpora, while a temporal reasoning module learns to select and compose information across channels based on explicit or inferred temporal context. This architecture enables models to reason about knowledge evolution, answer counterfactual historical queries, and maintain multiple valid but temporally-distinct world models simultaneously. TKC preserves the general capabilities of the base foundation model while adding structured temporal reasoning, offering a path toward continually-learning systems that understand not just what is true, but when it became true and how knowledge changes over time.
    1: Large language models operate with fixed computational budgets regardless of input complexity, wastefully applying full capacity to trivial queries while potentially underserving difficult ones. We introduce Metacognitive Sparsity, a framework that endows foundation models with awareness of their own computational requirements. Our approach trains a lightweight introspection module that predicts, for each input token sequence, a continuous difficulty score mapped to a sparse activation mask over the model's parameters. Unlike mixture-of-experts architectures that route between discrete expert modules, or early-exit methods limited to depth truncation, Metacognitive Sparsity enables fine-grained, input-conditional parameter activation across both width and depth dimensions. The introspection module is trained through a novel self-supervised objective that correlates activation patterns with prediction uncertainty and loss gradients, requiring no human annotations of task difficulty. A consistency regularizer ensures that the sparse subnetworks maintain behavioral alignment with the full model on capability-critical inputs. This framework transforms static foundation models into adaptive computational systems that allocate capacity proportionally to input demands, bridging the gap between scaling laws and deployment efficiency.
