    0: 'Adaptive optimizers like Adam and non-adaptive methods like SGD exhibit complementary strengths: fast convergence versus superior generalization. We argue this dichotomy stems from using fixed, geometry-agnostic update rules that cannot adapt to the heterogeneous curvature structure of modern loss landscapes. We introduce MetricFlow, a framework that learns a local Riemannian metric tensor from gradient statistics to perform geometry-aware parameter updates. Rather than relying on diagonal approximations or expensive second-order computations, MetricFlow employs a compact neural module that processes windowed gradient histories to predict a low-rank metric correction capturing dominant curvature directions. This learned metric defines a parameter-dependent inner product under which gradient descent is performed, effectively interpolating between steepest descent and natural gradient methods based on local landscape structure. The metric predictor is trained online via an auxiliary objective that rewards both optimization progress and flatness-seeking behavior, enabling automatic adaptation across training phases without manual scheduling. MetricFlow is architecture-agnostic, adds minimal computational overhead, and provides a principled mechanism for injecting geometric inductive biases into first-order optimization.'
    1: Contemporary learned optimizers struggle to generalize across diverse loss landscapes and training horizons due to their reliance on local gradient information and short-term meta-training objectives. We introduce GeometricFlow, a framework that learns to optimize by modeling the intrinsic Riemannian geometry of parameter space trajectories. Rather than predicting update steps directly, GeometricFlow constructs a learnable vector field that respects the underlying manifold structure of neural network parameter spaces, incorporating curvature information through parallel transport and geodesic flows. By training on trajectory distributions via optimal transport distances, our approach learns optimization strategies that remain invariant to reparameterizations and exhibit superior generalization to unseen architectures and loss functions. The framework naturally accommodates constraints through geometric projections and enables multi-step planning by integrating learned dynamics forward in time. This geometry-aware perspective bridges classical optimization theory with modern meta-learning, offering a principled foundation for designing optimizers that adapt to the intrinsic structure of high-dimensional parameter manifolds rather than merely following local descent directions.
