    0: 'We present a theoretical framework for understanding implicit regularization in multi-task learning through the lens of gradient descent dynamics. While classical learning theory analyzes single-task scenarios, modern applications increasingly rely on learning from multiple related tasks simultaneously. We prove that gradient descent on a multi-task objective implicitly enforces low-dimensional structure in the learned representations, even without explicit regularization. Specifically, we establish that under natural diversity conditions on the task distribution, the optimization trajectory concentrates onto a low-rank subspace whose dimension depends on task relatedness rather than ambient dimensionality. This implicit bias provably reduces the sample complexity per task compared to independent single-task learning. Our analysis reveals a fundamental trade-off between task diversity and representation complexity: greater task heterogeneity accelerates subspace identification but requires richer representations. We further characterize how architectural choices and initialization schemes modulate this implicit regularization effect, providing theoretical justification for common practices in transfer learning and meta-learning. Our results offer new perspective on why overparameterized multi-task models generalize well despite their capacity.'
    1: 'Understanding why overparameterized models trained with gradient descent generalize remains a central challenge in learning theory. We introduce trajectory curvature complexity, a novel complexity measure that captures the cumulative geometric information encountered along the optimization path through the loss landscape. Unlike static measures that characterize only the endpoint of training, our framework tracks how gradient descent navigates regions of varying Hessian curvature and relates this geometric history to generalization. We derive PAC-Bayes bounds that incorporate trajectory curvature, revealing that paths through flatter regions accumulate less complexity and yield tighter generalization guarantees. Our analysis unifies several implicit regularization phenomena under a single geometric principle: gradient descent preferentially traverses low-curvature manifolds, effectively constraining the hypothesis class in a data-dependent manner. We establish connections between trajectory curvature complexity and information-theoretic quantities, showing that the mutual information between training data and learned parameters can be bounded by integrated curvature along the optimization trajectory. This framework provides new theoretical tools for analyzing adaptive learning rates, momentum, and other optimization modifications through their effects on the curvature profile of training trajectories.'
