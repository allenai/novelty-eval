    0: 'Static benchmarks face fundamental limitations: they saturate as models improve, risk contamination through training data overlap, and provide coarse-grained signals that obscure specific capability gaps. We introduce ComposeEval, a procedural benchmark generation framework that dynamically synthesizes evaluation instances by composing atomic reasoning primitives through formal grammars. Rather than curating fixed test sets, ComposeEval defines a space of possible problems parameterized by primitive skills (arithmetic, logical inference, entity tracking, temporal reasoning, etc.), composition operators (sequencing, nesting, conditioning), and difficulty scaling functions. Each evaluation instance is generated on-the-fly with full provenance, enabling contamination-free assessment, systematic complexity control, and fine-grained skill attribution. The framework supports automatic diagnosis of model weaknesses by decomposing performance across the compositional structure, revealing which primitive skills and composition patterns cause failures. ComposeEval bridges the gap between controlled synthetic evaluation and naturalistic complexity, providing researchers with an inexhaustible, interpretable, and manipulation-resistant evaluation methodology. We release the generation engine, a library of extensible reasoning primitives, and protocols for community-driven primitive development.'
    1: We introduce ProGen-Bench, a procedurally generated benchmark framework that addresses the rapid saturation and limited diagnostic value of static evaluation datasets. Rather than fixed test sets, ProGen-Bench employs parameterized generative programs to create infinite task variations across vision, language, and reasoning domains while maintaining precise control over complexity dimensions such as compositionality depth, distractor count, and contextual ambiguity. Each generated instance is accompanied by interpretable metadata describing its structural properties, enabling researchers to diagnose model failures at a granular level and identify specific capability gaps. The framework supports curriculum-style evaluation where task difficulty adapts to model performance, preventing saturation while ensuring meaningful differentiation between systems. By decoupling benchmark design from dataset collection, ProGen-Bench enables continuous evaluation protocols that track progress on fundamental capabilities rather than dataset-specific patterns. This paradigm shift from static to generative benchmarking provides a sustainable path for long-term model evaluation and supports more targeted research into systematic generalization, compositional understanding, and robust reasoning across diverse task structures.
