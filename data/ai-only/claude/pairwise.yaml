    0: Large language models exhibit degraded coherence and reasoning fidelity as inference chains extend beyond typical context lengths, limiting their effectiveness for complex multi-step tasks. We introduce Recursive Reasoning Anchors (RRA), a self-supervised framework that enables LLMs to dynamically compress, consolidate, and restructure intermediate reasoning states during extended generation. RRA augments transformer architectures with a lightweight anchor module that learns to identify salient reasoning milestones, compress them into compact latent representations, and inject these anchors back into the model's hidden states as persistent reasoning scaffolds. Unlike external memory systems, anchors remain internal to the forward pass, preserving end-to-end differentiability while circumventing quadratic attention costs over full reasoning traces. A curriculum-based training procedure teaches the model to progressively extend reasoning horizons by bootstrapping from shorter successful chains. The anchor compression objective encourages information-theoretic efficiency, retaining only reasoning-critical content. RRA provides a principled mechanism for maintaining coherent goal-directed reasoning across hundreds of inference steps, opening new possibilities for autonomous problem-solving, long-horizon planning, and extended analytical tasks.
    1: Foundation models require frequent updates to incorporate new knowledge, correct errors, and adapt to evolving domains, yet full-scale retraining remains computationally prohibitive. We introduce Compositional Model Grafting, a framework that enables surgical updates to foundation models through dynamically composable knowledge modules. Rather than fine-tuning monolithic parameters, our approach learns lightweight graft modules—small neural components encoding specific knowledge updates—alongside a compositional router that learns to invoke and combine grafts based on input context. The router employs a structured attention mechanism over a library of grafts, enabling systematic generalization through explicit composition of atomic knowledge units. Grafts can be added, removed, or modified independently without affecting the base model or other modules, preventing catastrophic forgetting while supporting continuous knowledge injection. This modular architecture naturally handles conflicting updates through learned routing policies and enables interpretable attribution of model outputs to specific knowledge sources, addressing key challenges in foundation model maintenance and governance.
