    0: Bayesian deep learning remains computationally challenging due to the high dimensionality of parameter spaces and the complexity of posterior distributions. We introduce Geometric Functional Variational Inference (GFVI), a framework that performs variational inference directly in the space of functions represented by neural networks while leveraging the natural Riemannian geometry induced by the Fisher information metric. Rather than approximating posteriors over billions of parameters, GFVI constructs variational families over function spaces through carefully designed finite-dimensional projections that preserve geometric structure. We derive a tractable evidence lower bound by combining functional gradients with pullback operations along the Fisher-Rao metric, enabling efficient optimization through natural gradient descent in function space. The geometric perspective naturally induces more expressive posterior approximations that capture complex dependencies and multi-modality while avoiding the curse of dimensionality in parameter space. Our framework provides a principled approach to uncertainty quantification in deep learning by unifying differential geometry, functional analysis, and variational Bayesian inference, opening new avenues for scalable and accurate posterior approximation in modern neural architectures.
    1: Variational inference offers computational efficiency but often yields overconfident uncertainty estimates, while Markov chain Monte Carlo methods provide asymptotic exactness at substantial computational cost. We introduce Diffusion-Guided Posterior Sampling (DGPS), a framework that bridges these paradigms by learning adaptive neural transport maps conditioned on likelihood structure. DGPS trains a score-based diffusion model to transform samples from a simple reference distribution toward the target posterior, with the key innovation of incorporating likelihood gradients directly into the denoising dynamics. This likelihood-aware guidance ensures the learned transport respects the posterior geometry without requiring density evaluation. To guarantee exactness, we employ the learned diffusion trajectory as a sophisticated proposal distribution within a Metropolis-Hastings correction step, yielding samples from the true posterior while maintaining high acceptance rates. The framework naturally provides calibrated uncertainty quantification by preserving the full posterior structure rather than collapsing to modes. DGPS amortizes inference across related problems, enabling rapid posterior sampling for new observations after initial training. Our approach unifies the flexibility of neural density estimation with the theoretical guarantees of classical Monte Carlo methods.
