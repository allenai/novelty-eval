    1: Static benchmarks increasingly fail to reliably measure progress in AI systems due to rapid saturation, data contamination, and inability to diagnose fine-grained reasoning capabilities. We introduce ComposeEval, a procedural meta-benchmark framework that generates evaluation instances on-the-fly by compositionally combining atomic reasoning primitives spanning spatial, temporal, causal, numerical, and logical dimensions. Rather than providing a fixed dataset, ComposeEval defines a generative grammar over problem structures, enabling the creation of unlimited novel instances with precisely controlled complexity and reasoning requirements. Each generated problem comes with a compositional dependency graph that traces which primitive skills are required, enabling systematic diagnosis of model capabilities and failure modes. The framework supports configurable difficulty progression through primitive composition depth and distractor complexity. By generating fresh instances at evaluation time, ComposeEval provides inherent resistance to contamination while enabling researchers to stress-test specific capability intersections that static benchmarks cannot isolate. We release the generation framework alongside human validation protocols and baseline primitive decomposition analyses to support rigorous, reproducible evaluation of compositional reasoning in foundation models.
