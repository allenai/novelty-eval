    0: 'We introduce Neural Program Rendering (NPR), a generative framework that decomposes synthesis into symbolic program induction and differentiable execution. Rather than directly generating pixels or tokens, our approach first learns a compact domain-specific language whose programs capture compositional structure and high-level semantics. A neural program synthesizer generates these symbolic programs autoregressively, while a continuous renderer executes them into high-fidelity outputs through differentiable interpretation. This factorization yields several advantages: programs provide interpretable intermediate representations enabling fine-grained control, the discrete bottleneck compresses complex distributions into structured symbolic spaces, and execution can be parallelized for efficient sampling. We train both components jointly using a hybrid objective combining program likelihood and reconstruction quality. The framework naturally supports compositional generalization through program composition, interactive editing via program manipulation, and cross-modal transfer by sharing program representations across different renderers. By unifying symbolic reasoning with neural synthesis, NPR offers a principled path toward more controllable, efficient, and interpretable generative models that bridge discrete planning and continuous creation.'
    1: 'Controlling generative diffusion models remains challenging when specifications involve compositional structure, spatial relationships, or hierarchical constraints that natural language describes ambiguously. We introduce Programmatic Diffusion, a framework that uses executable programs as compositional control mechanisms for image synthesis. Our approach defines a domain-specific language where users specify generation requirements through symbolic programs encoding object hierarchies, spatial predicates, and relational constraints. A program compiler translates these specifications into differentiable energy functions that guide the reverse diffusion process without retraining the base model. The key technical contribution is a constraint propagation mechanism that decomposes complex program semantics into tractable guidance signals applied at appropriate noise levels during sampling. Unlike prompt-based or classifier guidance methods, programmatic control provides formal guarantees about constraint satisfaction while supporting systematic composition of primitives. The framework enables capabilities difficult to achieve through existing interfaces: recursive scene structures, quantified constraints over object collections, and programmatic variation through parameter sampling. Programmatic Diffusion bridges neurosymbolic reasoning and generative modeling, offering users precise, inspectable, and composable control over the generation process while preserving the visual quality of modern diffusion architectures.'
