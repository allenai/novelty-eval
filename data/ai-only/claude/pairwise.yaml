    0: Fine-grained recognition tasks often encounter instances where individual modalities provide ambiguous or conflicting evidence. We introduce Adaptive Multimodal Routing (AMR), a framework that learns to dynamically allocate computational resources and fusion weights across vision, audio, and language modalities based on instance-specific uncertainty. Unlike conventional multimodal fusion approaches that apply uniform integration strategies, AMR employs a lightweight meta-network that predicts modality reliability scores by analyzing intermediate representations from each encoder. These scores guide both the depth of processing within each modality-specific branch and the contribution of each modality to the final prediction. The framework incorporates a confidence-aware training objective that encourages the model to recognize when certain modalities are uninformative and to gracefully degrade by relying on available evidence. By learning toRoute computation through the most informative pathways, AMR achieves robust recognition across diverse scenarios including cryptic species identification, multi-speaker speech recognition in noisy environments, and cross-modal retrieval tasks where query and target modalities may differ.
    1: Multimodal learning typically relies on discrete fusion mechanisms—cross-attention layers or concatenation at fixed network depths—that fail to capture the continuous, temporally evolving nature of cross-modal interactions in real-world perception. We introduce Coupled Multimodal Dynamics (CMD), a framework that models the evolution of multimodal representations as a system of coupled neural ordinary differential equations. Each modality's latent state evolves according to dynamics that are continuously influenced by other modalities through learnable coupling functions, enabling smooth information flow across time and representation depth. CMD parameterizes these coupling functions to be adaptive, allowing the strength and nature of cross-modal influence to vary based on content relevance and temporal context. This formulation naturally handles asynchronous modalities, missing inputs, and variable-length sequences through integration over arbitrary time intervals. We further introduce a modal momentum mechanism that preserves modality-specific information while enabling deep integration, preventing representation collapse. CMD provides a principled mathematical framework for multimodal fusion that aligns with the continuous nature of human perception, offering a unified approach applicable to video understanding, audio-visual learning, and vision-language tasks.
