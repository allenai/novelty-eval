  ideas:
    0: Foundation models excel at general-purpose reasoning but face inherent tension between broad capabilities and task-specific performance. Existing adaptation methods either require costly fine-tuning with catastrophic forgetting risks or rely on static prompting with limited expressivity. We introduce Neural Gating Networks, a framework that treats frozen foundation models as reconfigurable computational substrates controlled by lightweight meta-circuits. Rather than modifying model weights or prepending task descriptions, our approach learns dynamic gating functions that selectively amplify or suppress activation pathways based on inferred task requirements. The gating network observes input characteristics and intermediate representations to produce real-time modulation signals across attention heads and feed-forward channels, effectively routing computation through task-appropriate subnetworks within the frozen model. This enables a single foundation model to exhibit specialized behaviors without parameter updates or explicit task specifications. Our framework introduces minimal overhead while providing continuous, input-dependent adaptation that generalizes across task boundaries. Neural Gating Networks offer a new paradigm for foundation model deployment where adaptation emerges from learned computational routing rather than weight modification or prompt engineering.
    1: We propose Neural Symbolic Emergence (NSE), a novel architecture that enables large language models to learn compositional symbolic reasoning capabilities through emergent internal representations. Rather than imposing predefined symbolic structures, NSE introduces a differentiable bottleneck layer that encourages the model to self-organize discrete, reusable symbolic primitives during standard pretraining. These learned symbols can be dynamically composed and manipulated through attention-based operations that mirror classical symbolic reasoning while remaining fully integrated within the neural framework. The architecture combines continuous representation learning with discrete bottleneck constraints, allowing symbols to emerge naturally from data patterns rather than human specification. By maintaining end-to-end differentiability, NSE preserves the scalability and flexibility of foundation models while enhancing systematic generalization on tasks requiring multi-hop reasoning, logical consistency, and compositional understanding. This approach bridges neural and symbolic paradigms without requiring explicit symbolic supervision, offering a path toward more robust and interpretable reasoning in future foundation models.
