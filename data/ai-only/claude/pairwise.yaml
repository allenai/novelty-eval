    0: Multimodal learning typically assumes that different modalities can be aligned through spatial or semantic correspondence, yet it overlooks the fundamental differences in how information temporally unfolds across vision, audio, and language. Visual scenes evolve continuously, audio events occur at varying granularities from instantaneous sounds to sustained tones, and language unfolds through discrete sequential tokens. We introduce Temporal Rhythm Networks, a framework that learns modality-specific temporal signatures to guide cross-modal fusion. Our approach first extracts learnable temporal basis functions for each modality, capturing their characteristic rhythms of information flow. These temporal signatures then modulate cross-modal attention, allowing the model to automatically discover meaningful correspondences across different temporal scales. A rhythm consistency objective encourages the network to identify stable cross-modal temporal patterns while remaining flexible to natural variations. This design enables more principled multimodal integration for tasks where temporal dynamics are critical, including video understanding, audio-visual synchronization, and temporally-grounded generation. Temporal Rhythm Networks provide a unified mechanism for handling the inherent temporal heterogeneity of real-world multimodal signals.
    1: We introduce Multimodal Program Synthesis (MPS), a framework that treats structured symbolic representations as a core modality alongside vision, audio, and language. While existing multimodal models align perceptual signals through shared embedding spaces, they struggle with tasks requiring precise compositional reasoning about spatial relations, temporal causality, and counterfactual scenarios. MPS addresses this by learning to translate multimodal inputs into executable procedural programs that explicitly represent scene structure, object interactions, and temporal dynamics. These programs serve as differentiable intermediate representations that facilitate systematic generalization and interpretable reasoning. Our approach employs a neural program synthesizer that jointly attends to visual, acoustic, and linguistic features while generating structured code in a domain-specific language. The resulting programs can be executed, verified, and manipulated to answer complex queries about causal relationships and hypothetical interventions. By treating symbolic reasoning as a learned modality rather than a post-processing step, MPS unifies perception and structured inference within a single end-to-end trainable architecture, opening new possibilities for compositional multimodal understanding.
