    0: Understanding the internal mechanisms of deep neural networks remains challenging, as existing interpretability methods typically provide static explanations at fixed levels of abstraction. We introduce Dialogic Interpretability, a framework that enables interactive, multi-turn exploration of model internals through natural language conversation. Our approach constructs a hierarchical representation of neural network computations that spans multiple abstraction levels—from individual neuron activations to emergent computational circuits to high-level behavioral patterns. A dialogue agent navigates this hierarchy in response to user queries, dynamically selecting and composing explanations appropriate to the user's expertise and informational needs. The framework supports zoom operations that allow users to request finer-grained mechanistic details or coarser conceptual summaries, cross-referencing that links related computational patterns across layers, and counterfactual probing that explains how internal representations would change under hypothetical inputs. By treating interpretability as an interactive process rather than a static artifact, Dialogic Interpretability accommodates diverse stakeholders—from ML researchers seeking circuit-level understanding to domain experts requiring behavioral intuitions—within a unified interface.
    1: We introduce Manifold-Guided Counterfactual Explanations (MGCE), a framework that discovers interpretable low-dimensional concept manifolds within neural network representation spaces and leverages them for faithful explanation generation. Rather than relying on input-gradient methods or training separate explainer models, MGCE identifies semantically coherent subspaces by analyzing the geometric structure of intermediate representations across related inputs. These discovered manifolds correspond to directions of conceptual variation that the model naturally employs during inference. We generate counterfactual explanations by traversing these manifolds, ensuring modifications remain within the model's learned feature distribution while producing minimal, interpretable changes. The framework operates agnostically across architectures and modalities, requiring only access to intermediate activations. By grounding explanations in the model's intrinsic geometric organization rather than post-hoc approximations, MGCE provides insights into how neural networks structure knowledge internally. This approach bridges representation learning and causal reasoning, offering a principled method for understanding model decisions through the lens of learned conceptual geometry.
