    0: Hybrid inference methods combining variational approximation with MCMC sampling offer appealing trade-offs between speed and accuracy, yet they typically apply uniform computational effort across parameter space, ignoring that posterior complexity varies dramatically across regions. We introduce Adaptive Inference Routing, a framework that learns to dynamically allocate computation between fast variational estimates and expensive sampling refinement based on local posterior complexity. Our key insight is that the local evidence lower bound curvature and gradient variance provide cheap proxies for approximation quality, enabling on-the-fly detection of regions where variational assumptions fail. We formulate inference as a sequential decision process where a lightweight routing network, trained via amortized meta-learning, predicts when sampling refinement will yield significant accuracy gains. The router operates without ground-truth posterior access by exploiting self-consistency checks between variational and importance-weighted estimates. This creates an inference system that automatically concentrates sampling effort on multimodal regions, heavy tails, and other pathologies while exploiting variational speed elsewhere. Our framework provides calibrated uncertainty estimates with user-specified computational budgets, enabling principled accuracy-efficiency trade-offs for real-time probabilistic modeling applications.
    1: Variational inference in deep learning faces a fundamental trade-off between posterior expressivity and computational tractability. Standard mean-field or factorized Gaussian approximations enable efficient optimization but severely limit the complexity of representable posterior distributions, often leading to poor uncertainty estimates and posterior collapse. We introduce Implicit Amortized Variational Inference (IAVI), a framework that parameterizes variational posteriors as implicit distributions defined through differentiable sampling procedures rather than explicit densities. By combining score-matching objectives with amortized inference networks, IAVI constructs flexible posterior approximations that capture complex dependencies without requiring density evaluations or normalizing constants. We leverage stochastic gradient estimators derived from the score function to enable end-to-end training of both generative models and inference networks. The framework naturally incorporates energy-based prior knowledge and maintains proper uncertainty calibration through its implicit formulation. IAVI provides a principled pathway toward scalable Bayesian deep learning with expressive posteriors, bridging the gap between black-box variational methods and sampling-based inference while preserving the computational advantages of amortized inference for downstream uncertainty quantification tasks.
