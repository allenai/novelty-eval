    0: 'Deep learning theory remains divided between two extremes: the neural tangent kernel regime, where networks behave like fixed feature maps, and the rich feature learning regime, where representations adapt substantially during training. Existing frameworks struggle to characterize the transition between these regimes or predict which emerges for a given problem. We introduce a spectral analysis framework that quantifies feature learning intensity through the alignment between gradient dynamics and data covariance structure. Our theory reveals that the degree of feature learning depends on a computable measure involving initialization scale, learning rate, network width, and task-dependent spectral properties. This yields a phase diagram predicting regime transitions and explains when overparameterization enables generalization beyond kernel methods. We establish that certain problem structures necessitate feature learning for sample-efficient generalization, while others are optimally solved in the kernel regime. Our framework provides principled guidance for architectural choices and suggests initialization strategies that provably induce desired learning dynamics, bridging classical learning theory with modern deep learning practice.'
    1: Classical generalization theory relies on capacity measures that characterize hypothesis classes independent of the learning algorithm, yet these measures fail to explain the remarkable generalization of overparameterized neural networks. We introduce trajectory-dependent generalization bounds that explicitly incorporate the optimization path taken during training. Our framework defines a novel complexity measure, the information-geometric path integral, which quantifies the cumulative curvature of the loss landscape traversed by gradient descent. Unlike static capacity measures, this path-dependent complexity naturally decreases when optimization follows low-curvature trajectories toward flat minima, providing a principled connection between optimization geometry and generalization. We establish PAC-Bayes-style bounds where the prior distribution is informed by the early training dynamics, allowing the bound to adapt to the specific problem instance. Our theoretical analysis reveals that implicit regularization emerges from the interaction between gradient noise and loss landscape geometry along the optimization trajectory. This framework unifies disparate observations about learning rate effects, batch size influence, and early stopping into a coherent theoretical picture, offering new insights into algorithm-dependent generalization in deep learning.
