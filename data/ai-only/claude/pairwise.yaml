  ideas:
    0: Understanding the computational principles underlying neural circuits requires models that capture both behavioral function and biological dynamics. Current approaches either optimize artificial networks purely for task performance, sacrificing neural realism, or fit neural data directly, obscuring computational interpretability. We introduce NeuroSync, a dual-objective learning framework that simultaneously aligns artificial network dynamics with multi-region neural population recordings while maintaining task competence. NeuroSync employs a temporal contrastive objective that matches the geometry of representational trajectories between artificial and biological networks across multiple timescales, from millisecond spike patterns to slower cognitive state transitions. A key innovation is our cross-region consistency loss, which encourages artificial subnetworks to develop communication patterns mirroring empirical inter-area connectivity. To preserve interpretability, we introduce sparsity constraints that yield modular architectures amenable to mechanistic analysis. The framework operates on top of standard recurrent architectures, requiring only neural recordings and behavioral labels during training. NeuroSync provides a principled approach for discovering shared computational motifs between artificial and biological intelligence, offering both improved neural predictivity and mechanistically interpretable models of cognitive function.
    1: Neural decoding traditionally requires subject-specific models trained on extensive data, limiting both scientific discovery and practical brain-computer interfaces. We propose Neural-Semantic Harmonization (NSH), a framework that learns to map distributed patterns of brain activity onto the representational geometry of pretrained multimodal foundation models. By treating neural responses as a distinct modality, NSH employs contrastive alignment to project fMRI or EEG signals into a shared embedding space with visual and linguistic stimuli, without requiring paired neural-semantic data from all subjects. A novel anatomically-informed encoder architecture incorporates known functional brain organization as inductive bias, while a subject-adaptive normalization layer handles inter-individual variability in signal characteristics. The framework enables zero-shot transfer of decoding capabilities to new individuals with minimal calibration data and facilitates cross-modal inference—predicting neural responses to never-before-seen stimuli or reconstructing perceived content from brain activity alone. This approach transforms neural data into a queryable semantic space, opening new avenues for studying mental representation and accelerating development of thought-to-text applications.
