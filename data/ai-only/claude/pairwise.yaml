    0: Generative models typically learn monolithic mappings from noise to data, entangling diverse factors of variation into opaque representations. We introduce Compositional Diffusion Primitives, a framework that decomposes the generative process into a library of modular, reusable generation modules that can be dynamically composed during sampling. Each primitive specializes in generating particular aspects of the data—such as structure, texture, or semantic attributes—while a lightweight routing mechanism learns to orchestrate their contributions across diffusion timesteps. Primitives are discovered through a novel objective that encourages both specialization and composability, enabling zero-shot generalization to novel factor combinations unseen during training. A key insight is that different primitives naturally activate at different noise levels, mirroring the coarse-to-fine hierarchy inherent in diffusion processes. Our framework supports primitive arithmetic, where adding or removing primitives systematically modifies generated outputs, and enables efficient domain adaptation by learning only new primitives while freezing existing ones. Compositional Diffusion Primitives bridge generative modeling with compositional representation learning, offering a path toward more interpretable, controllable, and systematically generalizable generation.
    1: We introduce Compositional Latent Decomposition Networks (CLDNets), a generative framework that learns to factor complex data distributions into hierarchical, reusable latent components. Unlike monolithic generative models that encode entire scenes into unstructured latent codes, CLDNets discover interpretable factorizations—automatically decomposing images into objects, attributes, and spatial relationships through a novel structure-aware variational objective. Our approach combines a hierarchical latent variable model with attention-based binding mechanisms that explicitly represent part-whole relationships and compositionality constraints. During generation, users can manipulate individual components, specify novel compositions, or recombine elements across examples while maintaining global coherence. The model employs a differentiable scene graph prior that encourages disentanglement of entities and their relations, enabling zero-shot compositional generalization to unseen attribute-object combinations. By operating on learned component libraries rather than generating from scratch, CLDNets offer improved sample efficiency and interpretability. This paradigm shift from holistic to compositional generation opens new possibilities for controllable synthesis, systematic generalization, and human-AI co-creation in complex generative tasks.
