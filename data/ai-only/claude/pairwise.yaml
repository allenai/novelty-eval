    0: Modern neural network optimization treats parameter spaces as Euclidean, ignoring the rich geometric structure of loss landscapes and architectural symmetries. We introduce Adaptive Riemannian Manifold Optimization (ARMO), a framework that learns and exploits low-dimensional Riemannian manifolds embedded within high-dimensional parameter spaces during training. ARMO dynamically constructs a metric tensor that captures local loss landscape curvature and respects inherent model symmetries, enabling gradient descent along geodesics in this learned geometry. By constraining optimization to data-driven manifolds where solutions concentrate, our approach naturally incorporates geometric priors about mode connectivity and invariances. The metric tensor adapts online through a meta-learning objective that balances exploration of the loss landscape with exploitation of promising low-dimensional structures. This geometric perspective unifies insights from neural tangent kernels, mode connectivity, and lottery ticket phenomena under a single Riemannian framework, providing both improved convergence properties and enhanced generalization through implicit regularization toward geometrically meaningful solutions.
    1: Second-order optimization methods offer superior convergence properties by leveraging curvature information, yet their prohibitive computational costs limit practical adoption in deep learning. We introduce Implicit Curvature Descent (ICD), a novel optimization framework that learns to approximate task-relevant curvature without explicit Hessian computation. ICD maintains a compact, low-rank curvature representation that evolves throughout training via an auxiliary momentum-based update rule derived from the implicit function theorem. Rather than computing expensive matrix inverses, our method learns directional curvature estimates by tracking the divergence of gradient trajectories across a small set of probe directions, dynamically reallocating representational capacity toward directions of high loss sensitivity. This approach enables curvature-aware parameter updates at near first-order computational cost. Theoretically, we establish that ICD recovers the dominant Hessian eigenspace under mild smoothness assumptions and enjoys accelerated convergence rates in ill-conditioned settings. The framework naturally adapts to the local geometry of the loss landscape, automatically adjusting effective learning rates per-direction without manual tuning. ICD provides a principled bridge between the efficiency of gradient descent and the geometric awareness of Newton-type methods.
