    0: 'Graph neural networks assume a fixed input topology, yet real-world relational data often admits multiple plausible geometric interpretations or contains structural uncertainty. We introduce Topologically Persistent Representations (TPR), a framework for learning embeddings that remain stable across a distribution of candidate topologies rather than committing to a single graph structure. TPR maintains a filtration over possible edge configurations, parameterized by confidence thresholds on edge existence, and enforces representation consistency across this filtration through a novel persistence-inspired regularization objective. Features that remain invariant under topological perturbations are amplified, while topology-sensitive components are explicitly disentangled and flagged as structurally uncertain. Our framework extends naturally to heterogeneous geometries, enabling unified learning across graphs, simplicial complexes, and cell complexes by treating them as points along a topological filtration. TPR provides built-in uncertainty quantification: predictions are accompanied by topological confidence intervals indicating sensitivity to structural assumptions. The approach offers a principled connection between persistent homology and geometric deep learning, ensuring that learned representations reflect genuine relational patterns rather than artifacts of potentially misspecified topology.'
    1: We introduce TopologyNet, a unified geometric learning framework that operates across diverse topological structures—graphs, simplicial complexes, manifolds, and hybrid geometries—without architecture-specific modifications. Current geometric deep learning methods are tailored to particular data structures, limiting their applicability and preventing knowledge transfer across topological domains. Our approach leverages persistent homology to extract multi-scale topological signatures and employs cellular sheaf theory to construct a universal message-passing scheme that respects the underlying geometric structure regardless of its specific form. By parameterizing local geometric operators through learnable sheaf maps, TopologyNet adapts its inductive biases to the intrinsic geometry of the data while maintaining a consistent computational framework. The framework naturally handles heterogeneous topological features within a single dataset and enables cross-topology transfer learning, where geometric knowledge acquired on one structure informs learning on another. This topology-agnostic design opens new possibilities for scientific domains where data naturally lives on multiple interacting geometric structures, such as molecular dynamics, neural connectomics, and multi-physics simulations.
