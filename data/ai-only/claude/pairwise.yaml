    0: Multimodal learning typically treats cross-modal fusion as discrete operations at fixed architectural points, failing to capture the continuous and dynamic nature of human multisensory integration. We introduce Continuous Cross-Modal Flows, a framework that models attention between modalities as a continuous dynamical system governed by neural ordinary differential equations. Rather than computing attention at discrete layers, our approach learns smooth trajectories through a cross-modal attention manifold, where the relevance weights between vision, audio, and language evolve continuously over both network depth and input time. This formulation naturally handles modalities with heterogeneous sampling rates and enables adaptive computation that allocates representational capacity based on instantaneous cross-modal salience. The continuous dynamics are parameterized by a lightweight neural network that conditions on the current multimodal state, allowing the system to learn when and how to shift attention between modalities without explicit fusion modules. Our framework provides a unified mathematical treatment of cross-modal interaction that bridges the gap between discrete transformer-style attention and the fluid nature of real-world multimodal perception, offering a new perspective on building temporally coherent multimodal representations.
    1: Multimodal understanding requires more than aligning representations across vision, audio, and language—it demands reasoning about temporal precedence and causal relationships between modalities. Existing approaches treat modalities symmetrically through attention mechanisms, failing to capture how information in one modality temporally influences or explains events in another. We introduce Causal Multimodal Transformers, a framework that explicitly models directional causal dependencies across asynchronous modality streams. Our architecture incorporates learned temporal offsets and causal masking patterns that respect the natural information flow between modalities, enabling the model to distinguish between coincidental co-occurrence and genuine causal influence. By decomposing cross-modal attention into temporally-ordered causal graphs, the framework learns which modality provides predictive information for events in others at different time scales. This causally-aware design enhances interpretability and enables counterfactual reasoning—answering questions like "what would the visual scene be if this sound had not occurred?" Applications span video understanding, audio-visual speech processing, and multimodal content generation where temporal causality is fundamental to meaning.
