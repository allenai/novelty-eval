    0: 'Variational inference and Markov Chain Monte Carlo represent complementary approaches to Bayesian posterior approximation: the former offers computational efficiency through optimization but suffers from restrictive approximation families, while the latter provides asymptotic exactness at prohibitive computational cost. We introduce Adaptive Variational Proposals (AVP), a framework that synergistically combines these paradigms by learning flexible variational approximations that serve as high-quality proposal distributions for subsequent MCMC sampling. Our method employs a two-stage process where an initial variational phase rapidly identifies promising posterior regions, then constructs locally-adaptive proposal mechanisms that exploit the learned variational structure to accelerate mixing in targeted sampling. Unlike standard approaches that treat variational approximations as final solutions, AVP leverages them as learned priors that guide efficient exploration while maintaining MCMC''s theoretical convergence guarantees. The framework naturally accommodates modern amortized inference schemes and scales to high-dimensional parameter spaces common in deep learning. By bridging optimization-based and sampling-based inference, AVP provides a principled pathway toward posterior approximations that are simultaneously computationally tractable and theoretically sound.'
    1: Variational inference enables scalable Bayesian deep learning but typically relies on simple parametric families that fail to capture the complex geometry of posterior distributions. We introduce Geometry-Aware Variational Inference (GAVI), a framework that constructs expressive approximate posteriors by explicitly leveraging the structure of the loss landscape. GAVI parameterizes the variational distribution using a mixture of components whose shapes are locally adapted via curvature information extracted from Hessian-vector products, while mixture weights are guided by loss landscape connectivity analysis. A key insight is that flat regions of the loss surface correspond to high posterior density, enabling us to concentrate approximation capacity where it matters most. We derive a tractable evidence lower bound that decomposes into a standard reconstruction term and a geometry-matching regularizer encouraging alignment between the approximate posterior and landscape topology. GAVI naturally captures multimodality through detected modes and represents anisotropic uncertainty via local curvature adaptation, all while maintaining computational efficiency through implicit Hessian access. Our framework bridges geometric deep learning insights with probabilistic inference, offering a principled approach to uncertainty quantification that respects the intrinsic structure of neural network parameter spaces.
