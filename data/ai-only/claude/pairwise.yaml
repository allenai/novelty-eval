    0: Modern benchmarks suffer from rapid saturation and hidden shortcuts that allow models to achieve high scores without genuine understanding. We introduce Adaptive Adversarial Benchmarks, a framework where evaluation datasets co-evolve with model capabilities through continuous adversarial example discovery. Our approach maintains a dynamic test set that automatically identifies and incorporates challenging instances where state-of-the-art models fail, while retiring examples that become too easy. A difficulty calibration mechanism ensures the benchmark remains neither trivially easy nor impossibly hard, tracking a frontier of model capabilities over time. Unlike static benchmarks that measure absolute performance on fixed data, our framework evaluates robustness to distributional shifts and genuine generalization by explicitly targeting learned shortcuts and spurious correlations. The benchmark maintains versioned snapshots for reproducibility while the live version evolves, providing both historical comparisons and forward-looking challenges. This paradigm shift from static to dynamic evaluation enables more meaningful progress tracking and incentivizes development of robust, generalizable models rather than benchmark-specific optimization.
    1: 'Machine learning benchmarks have catalyzed rapid progress, yet their static nature fails to capture a fundamental challenge of real-world deployment: knowledge evolves continuously. We introduce TemporalMind, a dynamic benchmark framework designed to evaluate models on temporal knowledge reasoning and adaptation. Unlike conventional benchmarks that test factual recall at a fixed point in time, TemporalMind presents knowledge across multiple temporal snapshots, requiring models to track evolving facts, detect knowledge obsolescence, resolve temporal contradictions, and appropriately express uncertainty about time-sensitive information. The framework employs a continual curation pipeline that automatically harvests naturally occurring knowledge updates from structured sources, generating evaluation instances that test temporal grounding, update integration, and retroactive reasoning. To prevent contamination and overfitting, TemporalMind implements a rolling evaluation protocol where test instances are refreshed monthly, ensuring perpetual benchmark validity. We additionally provide diagnostic probes that decompose temporal reasoning into atomic capabilities: timestamp attribution, validity interval estimation, change detection, and temporal consistency maintenance. TemporalMind establishes a foundation for evaluating AI systems intended for deployment in our ever-changing world, where yesterday''s facts may be today''s misconceptions.'
