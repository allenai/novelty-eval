    0: Current generative models apply uniform computational effort across all samples, regardless of their inherent complexity. We introduce Adaptive Capacity Generative Models (ACGM), a framework that dynamically modulates representational resources during the generation process based on estimated sample difficulty. ACGM augments diffusion-based generators with a lightweight complexity oracle that continuously assesses generation difficulty from intermediate states, routing computation through a hierarchy of expert modules with varying capacities. Simple patterns activate minimal pathways, while complex, rare, or compositional structures engage deeper computational graphs. A novel entropy-guided training objective encourages the model to develop calibrated difficulty estimates without explicit complexity labels, learning to recognize when additional computation yields meaningful improvements. This adaptive allocation naturally concentrates capacity on distribution tails and compositional boundaries where current models struggle most. Beyond efficiency gains, ACGM's explicit difficulty awareness provides interpretable generation diagnostics and enables controllable complexity-quality tradeoffs at inference time. Our framework offers a principled approach to breaking the fixed-compute paradigm in generative modeling, drawing inspiration from adaptive computation in biological systems and cognitive architectures.
    1: Generative models excel at synthesizing individual modalities but struggle to maintain semantic coherence when composing across vision, language, and structured data simultaneously. We introduce Compositional Cross-Modal Diffusion, a framework that enables coherent multi-modal generation by learning a shared semantic manifold where different modalities naturally align through geometric constraints rather than paired supervision. Our approach leverages separate pretrained diffusion models for each modality and introduces a novel cross-modal attention bridge that operates in a learned semantic latent space, allowing gradients to flow between modalities during generation. A key innovation is our structure-preserving regularization that enforces geometric consistency—ensuring that semantic relationships in one modality (e.g., spatial layouts in images) correspond to equivalent structures in others (e.g., scene graphs or narrative sequences). This enables applications like generating consistent image-text-audio triplets from minimal specification, or synthesizing scientific figures with corresponding captions and data tables from high-level concepts. The framework supports flexible conditioning schemes and compositional control, opening new possibilities for controllable cross-modal content creation.
