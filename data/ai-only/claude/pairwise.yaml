    0: Generative diffusion models excel at producing high-fidelity samples but struggle with compositional reasoning—generating outputs that simultaneously satisfy multiple interdependent constraints expressed as logical specifications. We introduce Constraint-Guided Diffusion, a framework that incorporates differentiable constraint satisfaction mechanisms directly into the denoising process of latent diffusion models. Our approach represents logical constraints as energy functions over the latent space and guides the reverse diffusion trajectory through gradient-based optimization that balances constraint satisfaction with sample quality. Unlike post-hoc filtering or rejection sampling, constraints are actively enforced throughout generation via a novel scheduling mechanism that adapts constraint strength across diffusion timesteps. We further introduce a compositional operator algebra that allows complex specifications to be constructed from primitive constraints, enabling hierarchical reasoning during generation. The framework supports spatial relationships, attribute binding, counting constraints, and temporal consistency for video generation. By unifying symbolic reasoning with neural generation, our method enables applications requiring both creative synthesis and rigorous constraint adherence, from architectural design to molecular generation with specified properties.
    1: 'Diffusion models learn rich semantic representations during the denoising process, yet leveraging this structure for controllable generation typically requires additional training, architectural modifications, or external guidance networks. We introduce Semantic Steering Vectors, a training-free framework for fine-grained control of diffusion model outputs through targeted interventions on intermediate activations. Our approach discovers interpretable semantic directions in the latent space of pre-trained diffusion models using minimal supervision—as few as ten contrastive image pairs per attribute. During inference, we modulate the denoising trajectory by adding scaled steering vectors to intermediate layer activations, enabling precise control over attributes such as lighting, style, pose, and object properties. Crucially, steering vectors are composable: multiple directions can be combined with independent scaling factors to achieve conjunctive control without interference. We further introduce orthogonal projection to minimize entanglement between semantically related attributes. Our analysis reveals that different layers encode attributes at varying levels of abstraction, with early layers governing global structure and later layers controlling fine details. Semantic Steering Vectors provide a unified, efficient mechanism for interpretable control while offering insights into the internal organization of visual knowledge in generative models.'
