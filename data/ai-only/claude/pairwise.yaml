    0: 'Current alignment methods for large language models rely heavily on human feedback data that inherently contains sensitive information about individual annotators'' values, beliefs, and personal contexts. This creates a fundamental tension: effective alignment requires rich preference signals, yet collecting and training on such data poses significant privacy risks to human participants. We propose Private Collective Alignment, a framework that aligns language models to shared human values while providing formal privacy guarantees for individual annotators. Our approach combines secure multi-party computation with differentially private preference aggregation to learn from collective human judgment without exposing individual-level signals. We introduce a novel value factorization method that separates universal ethical principles from personal preferences, enabling models to align with consensus values while provably protecting minority viewpoints and individual annotation patterns. This framework addresses growing concerns about annotator privacy in AI development while maintaining alignment quality, offering a path toward responsible AI systems that respect both societal values and individual privacy rights.'
    1: 'Fairness constraints in machine learning are typically fixed during training, forcing practitioners to commit to a single fairness definition despite deployment contexts that vary across jurisdictions, stakeholder preferences, and evolving societal norms. We introduce Fairness Steering Networks, a framework that enables continuous, inference-time control over fairness-accuracy tradeoffs without retraining. Our approach learns a fairness-parameterized representation space where a lightweight steering module interpolates between different fairness objectives—such as demographic parity, equalized odds, and individual fairness—conditioned on user-specified parameters. Crucially, we integrate conformal prediction to provide distribution-free coverage guarantees on fairness constraint satisfaction, with calibrated uncertainty estimates that flag when deployment distributions deviate sufficiently from training conditions that fairness guarantees may no longer hold. This uncertainty awareness addresses a critical safety gap: models that appear fair on held-out data but silently violate fairness under distribution shift. Our framework reconceptualizes fairness as a steerable, uncertainty-quantified property rather than a rigid training-time constraint, enabling context-appropriate deployment while maintaining transparency about the limits of fairness guarantees.'
