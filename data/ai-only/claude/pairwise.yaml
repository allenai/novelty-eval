    0: Multimodal learning in video requires understanding correspondences between audio and visual streams across multiple temporal scales, from millisecond-level lip-phoneme synchronization to second-level scene-soundtrack alignment. Existing approaches either learn coarse global representations or require dense manual annotations for fine-grained alignment. We introduce Hierarchical Audio-Visual Synchrony Learning (HAVSL), a self-supervised framework that discovers natural cross-modal correspondences at multiple temporal resolutions without explicit supervision. HAVSL employs a pyramid of contrastive objectives operating at different temporal granularities, where each level captures synchrony patterns appropriate to its timescale. A cross-scale consistency mechanism ensures coherent representations by enforcing that fine-grained alignments compose into coarser correspondences. To prevent shortcut learning, we introduce temporal shuffling augmentations that force the model to rely on genuine audio-visual relationships rather than spurious correlations. The learned hierarchical representations provide rich cross-modal grounding that transfers to diverse downstream tasks including audio-visual source localization, speech-driven animation, and video captioning. HAVSL offers a principled approach to exploiting the natural temporal structure of audiovisual data as free supervision for learning semantically meaningful multimodal representations.
    1: Multi-modal learning has achieved remarkable success in aligning representations across vision, audio, and language, yet existing approaches predominantly learn static correspondences while overlooking the temporal dynamics inherent in multi-modal data streams. We introduce Temporal Cross-Modal Synchronization (TCMS), a framework that learns phase-aligned representations capturing the causal and temporal dependencies between modalities. Rather than treating multi-modal inputs as bags of features, TCMS models the continuous evolution and temporal binding of cross-modal signals through differentiable temporal alignment layers and phase-coherence objectives. Our approach captures how spoken instructions temporally precede corresponding visual actions in demonstrations, how musical lyrics synchronize with melodic progressions, and how environmental sounds predict visual scene changes. By explicitly modeling temporal phase relationships, TCMS enables novel applications including temporally-grounded cross-modal retrieval, predictive cross-modal generation conditioned on timing cues, and automatic detection of synchronization anomalies in multi-modal streams. This work bridges the gap between static multi-modal fusion and dynamic temporal understanding across modalities.
