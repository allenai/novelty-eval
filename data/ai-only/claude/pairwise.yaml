111:
  context: alignment, fairness, safety, privacy, and societal considerations
  expected_winners:
  - 1
  ideas:
    0: Differential privacy and algorithmic fairness are often pursued as independent objectives in machine learning systems, yet their interaction creates fundamental tensions that current approaches fail to address. Standard differential privacy mechanisms apply uniform noise across all data points, which can disproportionately harm model utility for minority groups with less training data, thereby amplifying fairness violations. Conversely, fairness interventions typically require explicit access to sensitive demographic attributes, directly conflicting with privacy desiderata. We introduce Equitable Privacy Calibration, a framework that jointly optimizes privacy and fairness through stratified noise allocation. Our approach adaptively calibrates privacy budget expenditure based on group representation while maintaining rigorous differential privacy guarantees at the dataset level. Crucially, the mechanism operates without requiring access to protected attributes during inference, instead leveraging privately computed aggregate statistics to guide noise injection during training. We develop novel theoretical characterizations of the privacy-fairness Pareto frontier and demonstrate that strategic noise allocation can simultaneously strengthen both privacy protection for individuals and fairness guarantees across demographic groups, challenging the conventional wisdom that these objectives must trade off against each other.
    1: Large language model alignment typically optimizes for aggregated human preferences, inadvertently encoding dominant cultural perspectives while marginalizing minority viewpoints. We introduce Pluralistic Alignment, a framework that reconceptualizes alignment as value-aware deliberation rather than preference aggregation. Our approach learns a structured latent space of value orientations from diverse annotator subpopulations, enabling models to recognize the value-laden nature of queries and generate responses that appropriately engage with moral pluralism. Central to our framework is a hierarchical constraint architecture that distinguishes between universal safety boundaries—which remain inviolable across contexts—and culturally-situated preferences where plurality should be respected. We propose a training objective that encourages epistemic humility on contested normative questions while maintaining decisive refusal of universally harmful requests. The framework incorporates a transparency mechanism that surfaces when responses involve value-laden trade-offs, empowering users to understand the ethical dimensions of model outputs. Pluralistic Alignment offers a path toward AI systems that honor human diversity without relativizing fundamental safety constraints, addressing a critical gap between current alignment practices and the genuine heterogeneity of human values.
