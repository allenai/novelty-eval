    0: We present a geometric learning theory framework that characterizes generalization through the lens of architecture-manifold alignment. Classical learning theory treats data as points in ambient space, ignoring the low-dimensional geometric structure inherent in real-world datasets. We introduce the concept of architectural affinity—a measure quantifying how well a network's inductive bias aligns with the intrinsic geometry of the data manifold, including its dimensionality, curvature, and local smoothness properties. Our framework establishes that sample complexity and generalization error depend critically on this alignment rather than ambient dimensionality alone. We derive novel PAC-style bounds showing that architectures with high affinity to the data geometry achieve exponentially better sample efficiency compared to geometry-agnostic models. This theory provides a unified explanation for empirical phenomena such as the effectiveness of convolutional networks on grid-structured data and attention mechanisms on relational data, while offering principled guidelines for designing architectures tailored to specific data geometries through spectral and differential geometric analysis.
    1: 'Classical learning theory treats hypothesis classes as unstructured sets, providing generalization bounds that fail to capture the sample efficiency gains possible when target functions exhibit compositional structure. We introduce a compositional learning framework that explicitly models hypotheses as compositions of primitive functions drawn from base classes. Our framework defines new complexity measures—compositional depth, primitive diversity, and reuse degree—that characterize how functions are built from simpler components. We derive generalization bounds that scale with these compositional complexity measures rather than the complexity of the full hypothesis class, revealing when compositional structure provably reduces sample requirements. Central to our analysis is the concept of compositional stability: the property that learning primitives in isolation transfers to learning their compositions. We establish necessary and sufficient conditions for compositional stability and show that standard empirical risk minimization fails to exploit compositional structure, motivating a modular learning algorithm with provable compositional generalization guarantees. Our framework provides theoretical grounding for curriculum learning strategies and explains the empirical observation that models benefit from learning simpler subtasks before complex compositions. This work establishes foundations for a compositionality-aware learning theory aligned with structured reasoning in modern AI systems.'
