    0: Foundation models encode vast amounts of knowledge but struggle with temporal reasoning about knowledge evolution and principled uncertainty quantification over time. We introduce Temporal Epistemic Adaptation (TEA), a framework that augments large language models with explicit meta-learning over knowledge dynamics. Rather than treating information as static, TEA trains models to recognize and internalize patterns in how knowledge evolves—including scientific consensus shifts, terminology drift, and the refinement of causal models across domains. By learning these meta-patterns during pre-training on temporally-annotated corpora, the model develops structured priors for reasoning about epistemic uncertainty and knowledge decay. TEA enables foundation models to explicitly represent confidence bounds that degrade appropriately with temporal distance, distinguish stable from volatile knowledge domains, and generate calibrated predictions about information currency. This approach transforms static knowledge retrieval into dynamic epistemic reasoning, allowing models to better characterize the boundaries of their knowledge and adapt their responses based on learned patterns of how different types of information change over time.
    1: 'Large language models exhibit surprising brittleness in reasoning tasks, where semantically equivalent problems with different surface presentations yield inconsistent solutions. This suggests models rely on shallow pattern matching rather than abstract reasoning structures. We introduce Reasoning Invariance Learning (RIL), a framework that explicitly trains language models to recognize and exploit structural equivalences across problem formulations. RIL operates through two complementary mechanisms: a contrastive objective that pulls representations of logically equivalent problems together while pushing apart superficially similar but structurally distinct problems, and a canonicalization module that learns to map diverse surface forms to abstract reasoning templates. Our approach leverages automatically generated paraphrase groups spanning lexical, syntactic, and notational variations of reasoning problems. The framework can be applied as a lightweight adaptation layer on frozen foundation models or integrated into fine-tuning pipelines. RIL addresses a fundamental limitation in current reasoning approaches by shifting focus from answer generation to structural problem understanding, promoting genuine abstraction over memorization of solution patterns.'
