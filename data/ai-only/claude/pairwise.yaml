    0: Modern machine learning workloads execute across increasingly heterogeneous hardware landscapes comprising CPUs, GPUs, TPUs, and emerging accelerators, yet programmers must still manually orchestrate memory allocation, data placement, and cross-device transfers. This explicit management introduces complexity, limits portability, and often yields suboptimal performance. We introduce HeteroHeap, a unified managed memory abstraction that virtualizes the entire heterogeneous memory hierarchy as a single coherent address space. HeteroHeap combines static dataflow analysis with lightweight runtime profiling to automatically determine optimal data placement and migration strategies across devices. A key innovation is our learned placement policy that captures workload-specific access patterns during an initial profiling phase and continuously adapts to dynamic execution characteristics. The system interposes transparently beneath existing ML frameworks, requiring no modification to user code while providing automatic memory coherence guarantees. HeteroHeap employs speculative prefetching guided by operator dependency graphs and lazy synchronization to overlap computation with data movement. Our design preserves the programming simplicity of single-device development while unlocking the performance potential of heterogeneous systems, offering a practical path toward hardware-agnostic machine learning infrastructure.
    1: We introduce StreamJIT, a progressive compilation framework that bridges the performance gap between dynamic and static neural network execution without sacrificing programming flexibility. Unlike traditional just-in-time compilers that operate on fixed computation graphs, StreamJIT treats neural network execution as a continuous learning problem where the compiler observes runtime patterns and incrementally optimizes frequently-executed subgraphs across heterogeneous hardware backends. Our approach combines lightweight tracing with learned heuristics to identify optimization opportunities, applies hardware-specific transformations through a modular intermediate representation, and employs predictive memory allocation to minimize fragmentation. StreamJIT operates transparently across major deep learning frameworks through a unified operator interface, enabling automatic cross-platform optimization without code modification. By decoupling the programming model from execution strategy, our system allows researchers to prototype with dynamic control flow while achieving near-static compilation performance in production. This progressive compilation paradigm opens new possibilities for adaptive optimization strategies that evolve with workload characteristics.
