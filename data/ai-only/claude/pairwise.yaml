    0: Large language models generate fluent responses even when uncertain, producing hallucinations that undermine trust in high-stakes applications. Existing uncertainty quantification methods rely on expensive ensembles, multiple sampling passes, or external verifiers that scale poorly with model size. We introduce Layerwise Uncertainty Estimation (LUE), a principled framework that exploits the hierarchical representation structure within transformer-based foundation models to estimate epistemic uncertainty at inference time with minimal overhead. Our approach constructs uncertainty signals by analyzing the geometric properties of hidden state trajectories across layers, capturing how semantic refinement and representational consistency evolve during the forward pass. We identify that uncertainty manifests as increased trajectory curvature and reduced cross-layer alignment in regions where the model extrapolates beyond its training distribution. By learning a lightweight uncertainty predictor on these geometric features through self-supervised pretraining on diverse prompts, LUE provides calibrated confidence scores without modifying the base model or requiring labeled uncertainty data, enabling selective abstention and improved reliability in open-domain question answering, medical diagnosis, and code generation scenarios.
    1: Large language models generate text autoregressively without explicit mechanisms for hierarchical planning, limiting their effectiveness on tasks requiring sustained coherent reasoning over long horizons. We introduce Cognitive Workspace Transformers, a framework that augments autoregressive generation with a learnable, multi-scale latent memory that the model dynamically reads from and writes to during inference. The workspace consists of hierarchically organized latent slots operating at different temporal granularities—from immediate context to abstract goals—enabling the model to maintain evolving plans while generating tokens. A gating mechanism allows the model to decide when to consult or update different workspace levels, supporting flexible allocation of computational effort. The workspace is trained end-to-end alongside language modeling through a combination of reconstruction objectives and consistency losses that encourage coherent hierarchical structure. Unlike external scaffolding approaches, our method internalizes planning capabilities within the model's forward pass, requiring no additional inference-time tools or multi-agent coordination. Cognitive Workspace Transformers provide a principled architecture for integrating ideas from cognitive science about working memory and hierarchical cognition into the foundation model paradigm.
