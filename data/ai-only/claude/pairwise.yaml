    1: 'As machine learning benchmarks proliferate, the community lacks principled methods to assess the quality and continued utility of evaluation resources themselves. Benchmarks may suffer from saturation, contamination, poor difficulty calibration, or narrow skill coverage—issues that undermine their validity as progress indicators. We introduce MetaBench, a framework for systematically evaluating datasets and benchmarks along multiple axes of quality. MetaBench characterizes benchmarks through complementary lenses: discriminative power (ability to distinguish model capabilities), contamination susceptibility (robustness to training data overlap), difficulty dynamics (calibration across the performance spectrum), and construct validity (alignment between measured and intended skills). The framework employs a suite of probe models and statistical tests to generate interpretable diagnostic profiles for any benchmark. We further propose a temporal tracking protocol that monitors benchmark health over time, detecting saturation points and identifying when new evaluation resources are needed. MetaBench provides a foundation for evidence-based benchmark selection, retirement decisions, and the principled design of future evaluation suites, shifting community discourse from ad-hoc benchmark proliferation toward systematic quality assurance of our measurement instruments.'
