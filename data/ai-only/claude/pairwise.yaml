  ideas:
    0: We introduce Adaptive Supervision Composition (ASC), a unified framework that dynamically orchestrates self-supervised, semi-supervised, and supervised learning objectives based on available supervision signals. Rather than treating different supervision regimes as distinct learning paradigms, ASC employs a meta-learned controller that adaptively generates and weights auxiliary self-supervised tasks conditioned on the labeled data distribution. The key insight is that optimal pretext tasks are not universal but should complement the specific supervised objective and available labels. Our framework learns a task generator network that proposes self-supervised objectives maximizing downstream performance, while a learned weighting module balances supervision signals according to their reliability and information content. This creates a symbiotic relationship where labels guide the selection of beneficial self-supervised tasks, and self-supervised learning improves sample efficiency of supervised components. ASC provides a principled mechanism to smoothly traverse the supervision spectrum, automatically adapting its learning strategy as label availability changes, enabling robust representation learning across diverse real-world scenarios with heterogeneous supervision.
    1: 'Representation learning methods typically operate within rigid paradigms—supervised, self-supervised, semi-supervised, or unsupervised—each imposing fixed assumptions about label availability and reliability. Real-world data, however, arrives with heterogeneous supervision: some samples carry clean labels, others have noisy annotations, and many remain unlabeled entirely. We introduce Adaptive Supervision Interpolation (ASI), a unified representation learning framework that dynamically modulates between self-supervised and supervised objectives on a per-sample basis. ASI learns a continuous supervision temperature for each training instance, automatically downweighting label-dependent losses when annotations are unreliable or absent while amplifying self-supervised structural learning. A meta-learned reliability estimator assesses label trustworthiness without requiring explicit noise annotations, enabling seamless transitions across the supervision spectrum within a single training run. This formulation subsumes existing paradigms as special cases: pure self-supervision emerges when all temperatures approach zero, while full supervision corresponds to maximum temperature throughout. ASI naturally handles mixed-supervision scenarios including partial labeling, label noise, and pseudo-label bootstrapping through a principled probabilistic interpolation mechanism. The framework provides a foundation for learning robust representations from realistic, imperfectly-annotated data without paradigm-specific architectural modifications.'
