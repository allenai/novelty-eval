    0: Integrating formal logical reasoning into neural networks remains challenging due to the fundamental tension between discrete symbolic operations and continuous gradient-based optimization. We introduce Neural Theorem Streams, a framework that embeds first-order logic inference as differentiable computation graphs within deep learning architectures. Our approach represents logical formulas as continuous vector fields over a learned manifold, where satisfiability corresponds to convergence toward fixed-point attractors. A novel relaxation of unification enables gradient flow through variable binding and substitution operations while preserving logical soundness guarantees. The framework supports both forward chaining for deductive reasoning and backward chaining for goal-directed inference, implemented as recurrent message-passing dynamics. Crucially, the learned representations maintain semantic compositionality—complex formula embeddings derive systematically from constituent parts—enabling generalization to unseen logical structures. Neural Theorem Streams can be inserted as reasoning modules within larger neural architectures, allowing end-to-end training where upstream perception and downstream decision-making co-adapt with the logical inference process. This unified treatment bridges the gap between neural pattern recognition and formal symbolic reasoning without requiring explicit discretization or reinforcement learning.
    1: We introduce Neural-Symbolic Physics Engines (NSPEs), a hybrid architecture that dynamically orchestrates neural perception modules with symbolic physics reasoners for modeling complex physical systems. Unlike physics-informed neural networks that encode physical laws as soft penalties, NSPEs maintain a explicit symbolic physics engine that enforces hard constraints through differentiable logic programming while delegating perceptual uncertainty and unmodeled dynamics to neural components. A learned gating mechanism decides which aspects of system dynamics should be handled symbolically versus neurally, enabling the model to respect known physical invariants exactly while adapting to observational noise and model misspecification. The symbolic component operates over learned object-centric representations extracted by neural encoders, ensuring physical reasoning occurs at the appropriate level of abstraction. This decomposition yields interpretable predictions with formal guarantees on physical consistency, while maintaining the flexibility to handle real-world complexity. Our framework naturally accommodates partial physical knowledge and enables systematic generalization to novel physical scenarios through symbolic compositional reasoning.
