    0: 'Current representation learning methods operate within distinct paradigms—supervised, self-supervised, semi-supervised, and unsupervised—each imposing different inductive biases that can conflict when combined naively. We propose Geometric Consensus Learning (GCL), a unified framework that harmonizes these paradigms through explicit alignment of local neighborhood structures across supervision regimes. GCL introduces a consensus objective that encourages representations to preserve geometric relationships consistently, whether discovered through contrastive self-supervision, cluster structure, or label-induced similarities. Rather than treating supervision signals hierarchically, GCL allows each paradigm to mutually regularize the others: self-supervised neighborhoods prevent supervised collapse to discriminative-only features, while sparse labels guide self-supervised learning toward semantically coherent manifolds. The framework introduces learnable consensus weights that dynamically balance contributions based on local geometric agreement, enabling graceful interpolation across the supervision spectrum. GCL provides a principled approach to leverage heterogeneous supervision signals within a single geometric objective, offering a foundation for representation learning that adapts fluidly to varying annotation availability without architectural changes or multi-stage training.'
    1: We introduce Adaptive Supervision Blending (ASB), a unified framework that dynamically interpolates across unsupervised, self-supervised, semi-supervised, and supervised representation learning paradigms. Rather than treating supervision levels as discrete regimes requiring separate methods, ASB employs a meta-learned gating mechanism that continuously adjusts the contribution of contrastive self-supervised objectives, consistency regularization, and supervised classification losses based on per-sample uncertainty estimates and global learning dynamics. The framework maintains multiple representation subspaces—each optimized under different supervision assumptions—and learns to route samples and gradients according to local data density, label availability, and epistemic confidence. A key innovation is the curriculum-based supervision scheduler that progressively shifts the learning signal from broad self-supervised patterns to fine-grained supervised distinctions, while simultaneously identifying high-value unlabeled regions where self-supervision provides maximum benefit. ASB provides a practical solution for real-world scenarios with heterogeneous label budgets, eliminating the need to manually select and tune separate methods for different data regimes while enabling smooth adaptation as labeled data becomes available.
