    0: Understanding complex temporal phenomena requires models that are both predictive and interpretable through the lens of dynamical systems theory. We introduce Neural Dynamical Manifolds, a framework that learns low-dimensional latent representations where data evolves according to interpretable differential equations with explicit structural constraints. Unlike black-box sequence models, our approach parameterizes the latent dynamics using neural differential equations equipped with inductive biases from dynamical systems theory—including energy conservation, volume preservation, and stability guarantees. A key innovation is our adaptive mechanism that detects and characterizes regime shifts, allowing the learned dynamics to smoothly transition between different behavioral modes without assuming stationarity. The framework jointly optimizes for reconstruction accuracy and dynamical consistency through a physics-informed training objective that penalizes violations of fundamental conservation laws and stability properties. This yields interpretable phase portraits and vector fields in latent space while maintaining competitive forecasting performance. Our approach enables scientific discovery by surfacing meaningful dynamical structures—attractors, bifurcations, and conserved quantities—directly from observational time series data across physics, biology, and climate applications.
    1: Real-world dynamical systems frequently exhibit multiple behavioral regimes with distinct governing dynamics, yet existing neural approaches typically assume a single global model or require explicit regime annotations. We introduce Neural Switching Dynamics, a framework that jointly learns continuous within-regime dynamics and discrete regime transitions from raw time series observations. Our approach couples a library of neural ordinary differential equations—each capturing a distinct dynamical mode—with a learned transition policy that governs regime switching based on the current system state and its trajectory history. A variational inference procedure enables end-to-end training without regime supervision, using a recurrent encoder to infer latent regime sequences while regularizing for temporal coherence. The transition policy operates on a learned phase space representation, allowing it to anticipate regime changes before they manifest in observed variables. By explicitly modeling the compositional structure of complex dynamics, Neural Switching Dynamics enables systematic generalization to novel initial conditions, improved long-horizon forecasting through regime-aware rollouts, and interpretable decomposition of system behavior into discrete modes with continuous evolution laws.
