  ideas:
    0: Existing machine learning benchmarks typically aggregate human annotations into single ground-truth labels, discarding valuable information about disagreement and treating annotator variance as noise. However, many real-world tasks involve inherent subjectivity where multiple valid interpretations coexist—from content moderation and sentiment analysis to medical diagnosis and aesthetic judgment. We introduce Pluralistic Benchmarks, a framework for dataset construction and model evaluation that preserves and leverages the full distribution of human perspectives. Rather than forcing consensus, our approach maintains annotator-level labels and introduces evaluation metrics that reward models for capturing the spectrum of reasonable human responses. We propose a structured methodology for collecting diverse annotations that represent different demographic groups, expertise levels, and cultural contexts, along with metadata enabling analysis of systematic variation patterns. The framework includes protocols for measuring whether models exhibit appropriate uncertainty in subjective regions while maintaining confidence on objective aspects, and whether they fairly represent minority viewpoints rather than merely optimizing for majority opinion.
    1: 'Static benchmarks have driven remarkable progress in natural language processing, yet they suffer from rapid saturation, annotation artifacts, and misalignment with real-world capabilities. We introduce EvolBench, a dynamic benchmarking framework where evaluation sets co-evolve with model capabilities through human-AI collaboration. EvolBench operates through an adversarial generation loop: current frontier models propose challenging instances targeting specific reasoning capabilities, while a separate verification pipeline—combining model-based filtering with expert human curation—ensures quality and removes spurious examples. The framework maintains difficulty calibration through adaptive sampling, automatically retiring solved instances while introducing novel challenges that probe emerging capability boundaries. Unlike static datasets, EvolBench provides version-controlled evaluation snapshots enabling fair temporal comparisons while continuously refreshing its core to resist overfitting and shortcut learning. We formalize desiderata for living benchmarks, including discriminative stability, construct validity preservation, and contamination resistance. EvolBench supports modular capability taxonomies allowing researchers to diagnose specific reasoning failures rather than aggregate performance. Our framework establishes infrastructure for sustainable evaluation that scales alongside model development, shifting the paradigm from benchmark-as-artifact to benchmark-as-process.'
