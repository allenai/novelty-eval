    0: Real-world multimodal systems must operate robustly when input modalities are partially unavailable due to sensor failures, privacy constraints, or deployment limitations. Current approaches either require training separate models for each modality subset or rely on imputation strategies that introduce systematic biases. We propose Modality-Agnostic Fusion Transformers (MAFT), a unified architecture that processes arbitrary subsets of modalities through a single model without retraining or imputation. MAFT introduces modality dropout during training combined with a permutation-invariant cross-modal attention mechanism that learns to extract complementary information from whatever modalities are present. A key component is our proposed Availability-Aware Positional Encoding, which explicitly conditions the fusion process on which modalities are observed, enabling the model to adjust its integration strategy dynamically. The architecture employs a shared latent bottleneck that enforces modality-agnostic representations while preserving modality-specific details through residual pathways. MAFT naturally handles vision, audio, and language inputs within the same framework, gracefully degrading rather than failing when modalities are absent. Our approach provides a practical foundation for deploying multimodal systems in unpredictable real-world conditions where complete observations cannot be guaranteed.
    1: 'Cross-modal learning typically assumes temporal or spatial alignment between modalities, yet many real-world scenarios involve severe asymmetry: sparse, high-level semantic signals in one modality (e.g., clinical diagnoses, event descriptions) paired with dense, low-level observations in another (e.g., continuous physiological recordings, extended video). We introduce Asymmetric Cross-Modal Grounding (ACMG), a framework that learns to discover and align semantically critical regions across modalities without dense supervision. ACMG employs a mutual information maximization objective augmented with modality-specific structural priors: sparsity constraints for high-level modalities and temporal coherence for continuous streams. A differentiable attention mechanism localizes relevant segments in the dense modality corresponding to sparse semantic anchors, while contrastive learning ensures robust cross-modal representations. Unlike prior work requiring frame-level annotations or strict temporal correspondence, ACMG operates with weak supervision from modality pairs alone. The resulting framework generalizes across vision-language, audio-text, and sensor-annotation tasks, enabling interpretable grounding and improved downstream performance in settings where dense alignment is impractical or unavailable.'
