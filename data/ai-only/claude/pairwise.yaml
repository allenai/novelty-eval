    0: We introduce a framework for learning energy correction operators that elevate computationally efficient semi-empirical quantum chemistry methods to near-ab-initio accuracy. Traditional molecular simulations face a critical trade-off between the physical fidelity of expensive density functional theory calculations and the speed of approximate methods. Our approach employs equivariant graph neural networks as delta-learning operators that predict spatially-resolved energy corrections while preserving rotational, translational, and permutational symmetries. By learning only the difference between theory levels rather than the full potential energy surface, the model requires significantly less training data and exhibits improved generalization across diverse molecular systems. We incorporate physical constraints through a novel architecture that ensures energy conservation and smooth force fields suitable for stable molecular dynamics integration. The framework enables researchers to perform long-timescale simulations of complex chemical systems—including protein folding, catalytic reactions, and materials degradation—at a fraction of the computational cost while maintaining quantum mechanical accuracy where it matters most.
    1: Multi-physics simulations coupling distinct physical phenomena—such as fluid-structure interactions, thermo-mechanical systems, and electrochemical processes—are fundamental to engineering and scientific discovery, yet remain computationally prohibitive. Existing neural surrogate approaches typically target isolated physics domains, failing to capture the complex bidirectional dependencies at domain interfaces. We introduce Compositional Physics Operators (CPO), a modular neural framework for learning coupled multi-physics systems. CPO represents each physical domain through specialized neural operators while learning universal coupling modules that transfer information across domain boundaries. These coupling modules are constrained to preserve fundamental conservation laws, ensuring physical consistency without explicit supervision. A key insight is decomposing the coupling into geometry-aware interface detection and physics-agnostic flux matching, enabling zero-shot composition of independently trained single-physics modules into novel multi-physics configurations. The framework supports heterogeneous discretizations across domains and naturally handles evolving interfaces. CPO enables rapid virtual prototyping of complex physical systems by treating physics modules as composable building blocks, opening pathways toward foundation models for scientific simulation.
