  ideas:
    0: 'We present a theoretical framework for understanding curriculum learning through the lens of sample complexity and generalization bounds. While curriculum strategies—training on progressively harder examples—have shown empirical success, their theoretical foundations remain poorly understood. We formalize curriculum learning as a sequential refinement of hypothesis classes, where each stage in the curriculum corresponds to learning a restricted concept class before expanding to more complex hypotheses. Our framework reveals a fundamental trade-off: curricula can reduce the effective sample complexity for target concepts by exploiting hierarchical structure in the hypothesis space, but poorly designed curricula may introduce bias that delays or prevents convergence to the optimal hypothesis. We derive distribution-dependent sample complexity bounds that explicitly account for curriculum design, showing that under natural smoothness assumptions on the concept class, strategic example ordering can achieve exponential improvements in sample efficiency compared to uniform sampling. This work provides the first rigorous characterization of when and why curriculum learning provably accelerates generalization in structured learning problems.'
    1: Classical learning theory provides generalization guarantees under the assumption that training and test data arise from identical distributions, yet real-world learning systems increasingly operate in non-stationary environments where this assumption fails. We introduce drift complexity, a novel measure that captures the intrinsic difficulty of learning under continuous distribution shift by quantifying the geometric and statistical structure of evolving data distributions. Building on this foundation, we develop a theoretical framework that unifies algorithmic stability, online learning regret bounds, and optimal transport theory to derive distribution-shift-aware generalization guarantees. Our analysis reveals that generalization under drift depends critically on the interaction between the learner's adaptivity and the smoothness of distribution trajectories, leading to a fundamental adaptivity-stability tradeoff not present in stationary settings. We characterize the minimax optimal rates for learning under drift and propose a meta-algorithm that achieves these rates by dynamically balancing memory retention with responsiveness to change. Our framework recovers classical PAC bounds as a special case when drift vanishes, while providing substantially tighter guarantees when distributions evolve slowly, bridging the gap between worst-case theoretical pessimism and observed empirical robustness in continual learning systems.
