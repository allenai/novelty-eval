    0: Large language models exhibit impressive fluency but frequently fail on tasks requiring strict logical consistency and constraint satisfaction. Existing remedies either rely on costly fine-tuning or delegate reasoning to external symbolic solvers, sacrificing the flexibility of natural language understanding. We introduce ConstraintFlow, a lightweight architectural extension that enables foundation models to perform implicit constraint propagation within their forward pass. Our key insight is that constraint satisfaction can be reformulated as iterative message passing over variable-constraint graphs, a computation naturally expressible through modified attention mechanisms. ConstraintFlow augments transformer blocks with constraint-aware attention heads that learn to identify logical dependencies in context and propagate satisfiability signals through hidden representations. A learned gating mechanism allows the model to dynamically engage structured reasoning only when beneficial, preserving standard generation capabilities. The framework requires no external solvers, maintains full differentiability for end-to-end training, and introduces minimal parameter overhead. ConstraintFlow represents a step toward foundation models that seamlessly blend neural pattern recognition with principled logical reasoning, enabling more reliable performance on planning, scheduling, and compositional reasoning tasks expressed in natural language.
    1: 'Foundation models demonstrate impressive capabilities but lack principled mechanisms for uncertainty quantification, leading to overconfident predictions and hallucinations on out-of-distribution inputs. We introduce Epistemic Adapters, a parameter-efficient framework that retrofits pretrained large language models with explicit uncertainty awareness. Our approach learns lightweight adapter modules that map internal activations to calibrated epistemic uncertainty estimates without modifying the base model weights. During inference, these uncertainty representations enable the model to distinguish between confident knowledge recall, uncertain reasoning, and complete ignorance. The framework supports three key capabilities: selective abstention on high-uncertainty queries, uncertainty-guided beam search that favors lower-entropy generation paths, and active learning mechanisms that identify informative examples for human feedback. By decoupling uncertainty estimation from the primary forward pass, Epistemic Adapters maintain generation quality while providing interpretable confidence scores. This work establishes a foundation for more reliable and transparent deployment of frontier models in high-stakes applications where knowing what the model doesn''t know is as critical as what it does.'
