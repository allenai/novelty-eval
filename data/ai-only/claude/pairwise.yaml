    0: Mechanistic interpretability methods have revealed the function of individual components in large language models, yet understanding how these components coordinate during multi-step reasoning remains elusive. We introduce Reasoning Attractors, a framework that reconceptualizes inference-time computation as a dynamical system evolving through representation space. Our approach identifies stable computational trajectories—attractor pathways—that emerge when models engage in coherent reasoning, distinguishing them from the transient dynamics of uncertain or inconsistent processing. We develop a method to extract these attractors by analyzing the geometry of hidden state evolution across layers and tokens, revealing low-dimensional manifolds corresponding to distinct reasoning strategies. Crucially, perturbations to attractor pathways produce interpretable behavioral changes, enabling causal verification of discovered reasoning structures. The framework unifies component-level mechanistic findings with global behavioral patterns, showing how distributed circuits collectively implement stable cognitive procedures. Reasoning Attractors provides a new vocabulary for explanation—one grounded in the dynamics of computation rather than static component attribution—offering practitioners actionable insights into when and how models reason reliably versus when they may fail unpredictably.
    1: Current explanation methods for deep neural networks primarily offer post-hoc justifications that may not faithfully capture the model's internal reasoning process. We propose Causal Concept Bottleneck Discovery (CCBD), a framework that jointly learns human-interpretable concepts and their causal relationships to predictions in an end-to-end manner. Unlike traditional concept bottleneck models that require pre-defined concept annotations, CCBD automatically discovers a sparse set of interpretable concepts from data through a novel information-theoretic objective that balances concept utility, diversity, and human-alignment. Each concept is grounded through adversarial probing to ensure it captures semantically meaningful features rather than arbitrary directions in representation space. Crucially, we enforce causal sufficiency by training the prediction head exclusively on concept activations, guaranteeing that discovered concepts constitute the complete causal pathway from inputs to outputs. This architecture enables both local explanations through concept attribution and global understanding through learned concept graphs. By bridging automated concept discovery with causal interpretability, CCBD provides a principled approach to building models that are interpretable by design rather than post-hoc explanation.
