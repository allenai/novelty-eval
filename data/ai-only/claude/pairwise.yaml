    0: Current language model benchmarks predominantly evaluate tasks in isolation, failing to capture the cognitive demands of realistic deployment where users rapidly alternate between heterogeneous objectives within a single session. We introduce INTERLEAVE, a benchmark designed to measure task-switching robustness and cross-task interference in large language models. INTERLEAVE constructs controlled evaluation sequences that interleave diverse task types—mathematical reasoning, code generation, creative writing, factual recall, and instruction following—with systematic variation in switching patterns, context lengths, and task similarities. Beyond per-task accuracy, INTERLEAVE introduces novel metrics quantifying forward interference (how preceding tasks degrade subsequent performance), backward interference (retroactive context corruption), recovery trajectories (steps needed to regain baseline performance after switches), and coherence maintenance (consistency of persona, style, and constraints across interruptions). The benchmark includes both naturalistic conversation flows derived from real usage patterns and adversarial sequences designed to maximize interference. INTERLEAVE enables researchers to diagnose failure modes invisible to standard evaluation, guiding the development of models that maintain robust, consistent capabilities under the dynamic cognitive loads characteristic of practical deployment.
    1: Existing benchmarks evaluate model performance on static test sets, failing to capture the temporal dynamics and compositional shifts inherent in real-world deployment scenarios. We introduce ChronoShift, a benchmark framework designed to systematically evaluate how models adapt to evolving compositional relationships across multiple modalities over time. Unlike traditional benchmarks that assume fixed data distributions, ChronoShift presents sequences of related tasks where both the underlying data distribution and the compositional structure between modalities undergo controlled, realistic transformations. The framework spans diverse domains including medical imaging with evolving diagnostic protocols, urban scene understanding with changing infrastructure, and scientific literature analysis with shifting terminology. Each domain features carefully designed temporal trajectories that mirror authentic distributional shifts while maintaining compositional dependencies that require models to transfer structured knowledge across time. ChronoShift enables assessment of adaptation strategies, continual learning approaches, and compositional generalization under temporal pressure, providing insights into model robustness that static benchmarks cannot capture and bridging the gap between controlled evaluation and dynamic real-world performance.
