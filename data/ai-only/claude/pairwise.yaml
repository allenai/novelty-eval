    0: Static benchmarks increasingly fail to provide meaningful evaluation signals as large language models rapidly saturate existing tests and training data contamination becomes pervasive. We introduce EverEval, a framework for generating dynamic, contamination-resistant benchmarks through procedural composition and temporal grounding. EverEval constructs evaluation instances on-demand by combining reusable reasoning templates with real-time knowledge sources, ensuring that each evaluation session presents genuinely novel problems that no model could have encountered during pre-training. The framework operates across multiple cognitive dimensions—logical reasoning, factual recall, mathematical problem-solving, and commonsense inference—while maintaining rigorous difficulty calibration through parameterized complexity controls. A cryptographic commitment scheme enables reproducible evaluation while preventing anticipatory training on future instances. EverEval also introduces temporal validity windows, where correct answers depend on current real-world states, fundamentally preventing static memorization strategies. Our framework provides an open protocol for the research community to contribute new generation templates and knowledge sources, establishing a living evaluation ecosystem that co-evolves with model capabilities rather than being rendered obsolete by them.
    1: 'Modern benchmarks face a fundamental tension: static test sets enable contamination and eventual saturation, while human-generated alternatives are costly and slow to produce. We introduce *ProceduralBench*, a framework for generating procedurally-synthesized evaluation instances with cryptographic guarantees of novelty. Our approach combines compositional task grammars with difficulty-aware generation policies that maintain semantic coherence and calibrated challenge levels across generated instances. Each test example is synthesized on-demand from verified randomness, ensuring zero overlap with any model''s training data while preserving the interpretability and diagnostic value of human-crafted benchmarks. The framework supports diverse reasoning domains through customizable generation grammars that encode task primitives, composition rules, and difficulty parameters. By decoupling evaluation from fixed datasets, ProceduralBench enables continuous assessment of model capabilities without saturation, provides auditable proof-of-freshness for each test case, and facilitates fine-grained analysis of compositional generalization patterns. This paradigm shift from static to generative evaluation addresses critical challenges in benchmarking increasingly capable foundation models.'
