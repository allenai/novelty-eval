  ideas:
    0: 'Understanding how information propagates through neural networks remains a fundamental challenge in interpretability research. While existing methods analyze individual components such as attention heads or neurons in isolation, they fail to capture the dynamic, context-dependent interactions that shape model outputs during inference. We introduce Neural Provenance Tracking, a framework that maintains a differentiable influence graph for each token representation as it traverses transformer layers. Our approach decomposes each hidden state into contributions from upstream components, propagating causal attribution through attention and feedforward operations while preserving compositional structure. To achieve computational tractability, we develop sparse influence approximations that retain only the most significant causal pathways, along with learned compression modules that summarize complex interaction patterns. This provenance-aware representation enables novel capabilities: tracing factual claims to their source tokens, identifying when predictions arise from spurious feature correlations, and detecting the computational origins of hallucinated content. Neural Provenance Tracking provides practitioners with fine-grained, mechanistically grounded explanations that reveal not just what a model attends to, but how attended information transforms and combines to produce final outputs.'
    1: Current interpretability methods primarily identify correlations between model components and behaviors, but rarely establish which internal mechanisms causally produce specific predictions. We introduce Causal Circuit Analysis, a framework that combines mechanistic interpretability with structural causal modeling to identify and verify causal computational pathways in neural networks. Our approach treats activations, attention heads, and neural circuits as variables in a structural causal model, enabling principled causal interventions beyond simple ablations. By applying do-calculus to internal representations, we can distinguish genuinely causal mechanisms from spurious correlations, trace information flow through causal mediators, and generate counterfactual explanations grounded in the model's computational graph. The framework provides formal guarantees about explanation faithfulness through causal identification conditions and enables automated discovery of minimal causal circuits sufficient for specific behaviors. This causal perspective bridges the gap between mechanistic interpretability and formal explainability, offering researchers and practitioners a principled methodology to understand not merely what features influence model decisions, but how and why specific computational pathways causally mediate predictions in complex neural architectures.
