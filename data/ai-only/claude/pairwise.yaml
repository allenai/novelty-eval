    0: Multimodal understanding requires not only semantic alignment but precise temporal synchronization across modalities that unfold at vastly different timescales. We introduce Hierarchical Temporal Alignment Networks (HiTAN), a self-supervised framework that learns multi-scale temporal correspondences between vision, audio, and language without frame-level supervision. Our approach leverages the observation that natural multimodal signals exhibit rhythmic structure at multiple hierarchical levels—phonemes to sentences in speech, frames to scenes in video, and beats to musical phrases in audio. HiTAN employs a cascade of temporal attention modules that progressively align representations from fine-grained to coarse temporal granularities, guided by cross-modal consistency objectives at each level. A novel rhythmic contrastive loss encourages the model to discover and match implicit temporal boundaries across modalities. By disentangling hierarchical temporal structure from semantic content, HiTAN produces representations that capture both what is happening and when it occurs across modalities, enabling applications in precise audio-visual generation, cross-modal retrieval with temporal queries, and fine-grained video understanding tasks requiring temporal reasoning.
