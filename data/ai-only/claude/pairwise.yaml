    0: We introduce Compositional Manifold Diffusion (CMD), a generative framework that learns to decompose the data manifold into semantically disentangled subspaces without explicit supervision. Rather than modeling generation as a single denoising trajectory, CMD performs diffusion over a product space of learned factor manifolds, each capturing independent aspects of variation such as shape, texture, pose, or style. Through a novel geometric regularization that encourages orthogonality between learned subspaces and a compositional conditioning mechanism, our approach enables fine-grained, interpretable control during sampling. Users can independently manipulate discovered factors by navigating their corresponding manifolds, compose attributes from different examples, or perform smooth interpolations along semantically meaningful directions. The manifold decomposition emerges naturally from the data structure through a combination of topological constraints and local linearity assumptions during training. This enables zero-shot compositional generation and precise editing capabilities that generalize beyond the training distribution, offering a path toward more interpretable and controllable synthesis across diverse modalities.
    1: Controllable generation in diffusion models typically operates through monolithic guidance signals that conflate control across semantic scales, limiting users' ability to independently specify high-level composition, mid-level structure, and fine-grained details. We introduce Hierarchical Disentangled Guidance (HDG), a training-free framework that decomposes user intent into scale-specific control signals aligned with the natural coarse-to-fine trajectory of diffusion sampling. HDG learns a lightweight projection network that maps arbitrary conditioning inputs—text, sketches, or reference images—into a hierarchy of guidance vectors, each targeting a specific range of diffusion timesteps corresponding to distinct levels of semantic abstraction. Through an orthogonality constraint, these guidance vectors remain disentangled, enabling independent manipulation of global layout, object arrangement, and texture details within a single generation. The framework operates as a plug-in module compatible with pretrained diffusion models, requiring no modification to the base architecture. HDG opens new possibilities for creative workflows where users can iterate on different abstraction levels independently, mixing high-level structure from one source with fine details from another.
