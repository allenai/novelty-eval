    0: Current interpretability methods predominantly produce static explanations—saliency maps, attention weights, or concept attributions—that fail to capture the dynamic, causal nature of neural computation. These approaches reveal correlations between inputs and outputs but obscure the mechanistic processes by which representations transform and interact during inference. We introduce Causal Explanation Flows, a framework that models interpretability as tracing dynamic causal trajectories through neural networks. Our approach combines targeted causal interventions on intermediate representations with information-theoretic tracking to construct explanation graphs that reveal how specific computational pathways causally determine model outputs. Unlike post-hoc attribution methods, Causal Explanation Flows performs real-time analysis during forward passes, identifying critical decision points where alternative reasoning branches diverge. The framework supports counterfactual queries by simulating intervention effects along discovered causal pathways, enabling users to understand not just what influenced a prediction but how different computational routes would have altered it. We provide theoretical grounding connecting our flow-based explanations to structural causal models and demonstrate that the framework scales to modern transformer architectures through efficient intervention sampling strategies.
    1: Despite growing interest in explainable AI, current interpretability methods for multimodal models primarily offer correlational insights through attention visualization or input attribution, failing to reveal the causal mechanisms underlying cross-modal reasoning. We introduce Circuit-Level Multimodal Interpretability (CLMI), a framework that discovers and causally validates the computational pathways responsible for integrating information across vision and language modalities. CLMI combines sparse dictionary learning to identify interpretable features within each modality with targeted ablation and activation patching to trace how these features compose into circuits that perform specific reasoning operations. By mapping the causal graph of cross-modal information flow, our approach enables precise localization of where and how models fail, facilitating targeted interventions without full retraining. Unlike post-hoc explanation methods, CLMI provides mechanistic understanding by identifying minimal sufficient circuits for tasks such as visual grounding, attribute binding, and relational reasoning. This work bridges mechanistic interpretability and multimodal learning, offering practitioners actionable insights for debugging, improving model robustness, and ensuring alignment between model computations and human-interpretable reasoning processes.
