    0: Aligning large language models with human values through preference learning requires aggregating feedback from diverse annotators, yet this process risks both privacy violations through preference data centralization and fairness harms when annotator pools lack demographic diversity. We introduce Federated Pluralistic Alignment, a framework that learns from distributed human preferences without exposing individual feedback to central servers while ensuring the aligned model reflects a balanced plurality of human values. Our approach combines secure aggregation of preference gradients with a novel fairness-aware reweighting mechanism that detects and corrects for demographic imbalances in the federated annotator population. A key technical contribution is our differentially private preference aggregation protocol, which provides formal guarantees against reconstructing individual annotators' value profiles from model updates. To address the challenge that demographic attributes themselves are sensitive, we introduce a method for implicit fairness correction that operates on preference patterns rather than explicit group labels. Federated Pluralistic Alignment enables scalable alignment from globally distributed human feedback while jointly satisfying privacy preservation, demographic fairness, and value pluralism—three properties essential for deploying aligned AI systems in diverse societies.
