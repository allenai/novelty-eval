    0: Current explainability methods for neural networks predominantly provide post-hoc rationalizations that may not faithfully represent internal decision-making processes. We introduce Algorithmic Circuit Discovery (ACD), a framework that automatically extracts interpretable computational subgraphs from trained neural networks and translates them into human-readable algorithmic descriptions. ACD combines causal intervention techniques to identify functionally meaningful circuit boundaries with sparse dictionary learning to decompose distributed representations into interpretable primitive operations. By applying program synthesis over the discovered circuits, we generate structured pseudocode that captures the model's actual reasoning process rather than approximating it. Our approach addresses the faithfulness gap in explainable AI by grounding explanations directly in the model's computational mechanism. The resulting algorithmic descriptions preserve causal relationships between intermediate computations, enabling domain experts to audit specific reasoning pathways, diagnose failure modes, and verify alignment with domain knowledge. ACD provides a principled pathway from opaque neural computations to transparent, verifiable algorithms, advancing both the science of interpretability and the practical deployment of trustworthy AI systems in high-stakes domains.
    1: Mechanistic interpretability has advanced our understanding of individual neural network components, yet explaining how these components orchestrate during inference remains elusive. We introduce Information Flow Dynamics (IFD), a framework that models neural network inference as a continuous dynamical system where information propagates, transforms, and potentially degrades across computational stages. IFD employs differentiable information-theoretic probes inserted between layers to track how task-relevant signals evolve throughout forward passes. By computing real-time mutual information estimates between intermediate representations and target variables, our method constructs dynamic information trajectories that reveal computational bottlenecks, redundant pathways, and critical transformation points. We further introduce flow perturbation analysis, which applies minimal interventions to intermediate states and measures downstream information consequences, enabling causal identification of essential versus dispensable computational routes. IFD provides a unified lens connecting static component-level interpretability with holistic model behavior, offering practitioners diagnostic tools to understand not merely which features matter, but precisely where and how models succeed or fail in their reasoning process. The framework generalizes across architectures and naturally extends to comparing information dynamics between models exhibiting different capabilities or failure modes.
