    1: We introduce Function-Space Variational Inference via Optimal Transport (FSVIOT), a framework that performs Bayesian inference directly in the space of functions rather than parameters. Traditional variational inference optimizes over weight distributions, leading to poor posterior approximations in overparameterized models where many parameter configurations yield similar functions. FSVIOT parameterizes the variational family as a distribution over function samples generated by an implicit sampler network, and minimizes optimal transport distances between the approximate and true posterior predictive distributions. This function-centric view naturally handles model reparameterizations, enables expressive posterior families that capture multimodality, and scales to modern architectures through amortization. We derive tractable evidence lower bounds using kernel maximum mean discrepancy and introduce a regularization scheme that ensures meaningful uncertainty quantification across input domains. The framework seamlessly integrates with existing neural architectures while providing calibrated predictive distributions, opening new possibilities for uncertainty-aware deep learning without restrictive assumptions on posterior geometry or computational bottlenecks from parameter-space inference.
