    0: Modern deep learning systems achieve remarkable performance but remain opaque black boxes, limiting trust and adoption in critical applications. We propose Neural Concept Reasoners, a framework that integrates differentiable language models as explicit reasoning modules within neural architectures. Rather than generating post-hoc explanations, our approach trains vision-language systems to produce natural language rationales as an intermediate computational step toward final predictions. The language model receives perceptual representations and generates structured reasoning traces that are both human-readable and causally necessary for downstream decisions. Through a combination of supervised concept annotations and self-consistency objectives, we ensure that generated explanations are faithful to the model's actual decision process rather than plausible confabulations. The framework supports intervention and counterfactual analysis by allowing users to edit reasoning traces and observe effects on predictions. By treating natural language as a computational medium rather than merely an output modality, Neural Concept Reasoners unify high model capacity with inherent interpretability, enabling transparent reasoning in complex multimodal tasks while maintaining competitive accuracy.
    1: 'Mechanistic interpretability methods typically produce static, post-hoc explanations of neural network behavior, analyzing circuits and features after computation has occurred. This reactive paradigm limits our ability to anticipate model behavior in novel situations or detect potentially problematic computations before they manifest. We introduce Predictive Circuit Analysis, a framework that learns to forecast which computational circuits will activate and how features will compose based on input characteristics alone. Our approach trains a lightweight meta-interpreter network that takes input embeddings and predicts the activation patterns of previously identified circuits, feature superposition configurations, and attention head compositions. By learning the mapping from input space to mechanistic behavior, the meta-interpreter captures context-dependent dynamics that static analysis methods miss. This enables anticipatory interpretability: predicting mechanistic behavior on unseen inputs, identifying input regions likely to trigger specific circuits, and flagging potential misalignment before forward passes complete. The framework naturally extends to detecting distribution shifts through prediction uncertainty and discovering new circuits by identifying systematic prediction failures. Predictive Circuit Analysis transforms interpretability from retrospective explanation to prospective understanding of neural network computation.'
