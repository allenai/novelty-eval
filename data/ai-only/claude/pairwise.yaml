    0: Classical learning theory analyzes generalization through capacity measures like VC dimension or Rademacher complexity, treating the hypothesis class as static. However, in deep learning, the effective hypothesis class dynamically evolves during training as gradient-based optimization interacts with architectural inductive biases. We introduce the concept of *trajectory-conditional function classes*—subsets of functions reachable via gradient descent from random initialization for a given architecture. We develop a theoretical framework characterizing how architectural primitives (self-attention, convolution, skip connections) induce distinct geometric constraints on optimization trajectories in function space, creating implicit restrictions beyond mere parameterization. Our analysis reveals that architectures with different inductive biases can have identical expressivity yet learn fundamentally different solution manifolds under standard training. We prove separation results showing functions efficiently learnable by one architecture require exponentially longer training or different initialization schemes for others, even when both can represent the target function. This perspective unifies observations about implicit regularization, feature learning dynamics, and architectural generalization gaps under a single trajectory-centric lens.
    1: 'Classical learning theory characterizes generalization through properties of hypothesis classes or final learned predictors, yet mounting empirical evidence suggests that the optimization trajectory itself carries crucial information about generalization behavior. We introduce trajectory-dependent generalization theory, a framework that derives generalization bounds by analyzing the cumulative stability of iterative learning algorithms across their entire optimization path rather than solely at convergence. Our approach tracks how infinitesimal perturbations to training data propagate through sequential parameter updates, yielding a trajectory stability coefficient that captures the algorithm''s sensitivity dynamics over time. This perspective naturally explains several empirical phenomena that elude classical analysis: why early stopping regularizes, how learning rate schedules affect generalization, and when curriculum strategies provide benefits. We establish connections between trajectory stability and information-theoretic quantities, showing that the mutual information between intermediate iterates and training data provides a tighter characterization than endpoint-only analysis. Our framework unifies insights from optimization dynamics, algorithmic stability, and PAC-Bayes theory, offering a principled lens for understanding how procedural choices during training translate into statistical guarantees for learned predictors.'
