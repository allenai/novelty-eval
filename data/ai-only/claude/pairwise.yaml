    1: Static benchmarks have driven remarkable progress in AI, yet they suffer from data contamination, overfitting to specific test distributions, and failure to measure compositional generalization—the ability to combine learned skills in novel configurations. We introduce CompGen-Infinity, a procedural benchmark generation framework that produces unlimited, never-before-seen evaluation instances requiring compositional reasoning across multiple cognitive primitives. Our framework defines a formal grammar over atomic skill modules—including arithmetic reasoning, linguistic manipulation, spatial understanding, and logical inference—along with composition operators that combine these modules into arbitrarily complex nested structures. At evaluation time, instances are generated on-demand with controllable difficulty through composition depth and primitive diversity parameters. Crucially, each generated instance is accompanied by a verifiable solution trace, enabling automatic correctness checking without human annotation. The procedural nature guarantees zero train-test overlap while the compositional structure reveals systematic generalization failures invisible to conventional benchmarks. We release an open generator with extensible primitive libraries, enabling the research community to continuously expand the space of testable compositions and adapt the framework to emerging capability domains.
