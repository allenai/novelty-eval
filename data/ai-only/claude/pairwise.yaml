    0: Efficient exploration in reinforcement learning remains challenging, particularly in environments with sparse rewards and large state spaces. We introduce Semantic Exploration Diffusion (SED), a framework that harnesses the world knowledge embedded in large language models to guide exploration through diffusion-based policy learning. SED operates by querying a frozen language model to generate natural language descriptions of potentially informative states given the current exploration history, then conditions a diffusion policy on these semantic exploration hints to produce diverse, goal-directed behaviors. Unlike intrinsic motivation methods that rely on hand-crafted novelty bonuses, SED derives exploration signals from the rich semantic priors captured during language model pretraining, enabling transfer of common-sense reasoning about environment dynamics and useful subgoals. The diffusion policy formulation naturally captures multimodal action distributions, allowing the agent to maintain diverse exploration strategies when multiple promising directions exist. A key technical contribution is our cross-modal attention mechanism that grounds abstract language guidance into the continuous action space while preserving the generative flexibility of diffusion models. SED provides a principled approach to injecting structured prior knowledge into reinforcement learning without constraining the policy's ability to discover novel solutions.
    1: Foundation models encode vast world knowledge, yet this semantic understanding remains underutilized in reinforcement learning agents that learn primarily through trial-and-error interaction. We introduce Semantic Scaffolding for Reinforcement Learning, a framework that creates a bidirectional interface between large language models and neural policy learning. Rather than using language models as reward functions or action generators, we leverage them to construct an evolving hierarchy of semantic subgoals and maintain a natural language world model that guides exploration and credit assignment. The language model decomposes sparse-reward tasks into interpretable milestones, provides counterfactual reasoning about failed trajectories, and suggests exploration strategies grounded in commonsense knowledge. Conversely, the RL agent's experiences continuously refine the language model's beliefs through a lightweight adaptation mechanism. This semantic middle layer enables efficient learning in domains where task structure is complex but can be naturally expressed in language, while preserving interpretability throughout the learning process. Our approach bridges the gap between data-efficient human-like reasoning and adaptive policy optimization.
