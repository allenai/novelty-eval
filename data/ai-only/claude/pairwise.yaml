    0: 'Modern deep learning optimizers face a fundamental trade-off: adaptive methods like Adam excel at handling ill-conditioned landscapes but may converge to sharp minima with poor generalization, while sharpness-aware minimization (SAM) seeks flat minima but uses fixed perturbation scales insensitive to local geometry. We introduce Curvature-Adaptive Sharpness-Aware Optimization (CASAO), a unified framework that dynamically modulates both perturbation magnitude and step size based on estimated local curvature. Our method leverages efficient first-order approximations of the loss Hessian''s spectral properties through randomized probing and tangent propagation, avoiding expensive second-order computations. CASAO adaptively increases perturbation strength in flat regions to maintain exploration while reducing it near sharp features to enable precise convergence. Simultaneously, the learning rate adapts to the conditioning of different parameter subspaces. This geometry-aware coordination between sharpness-seeking perturbations and adaptive stepping enables robust optimization across diverse architectures and domains, from vision transformers to language models, while preserving the computational footprint of first-order methods.'
    1: Modern optimizers employ fixed algorithmic structures, adapting only scalar hyperparameters like learning rates while the underlying update rules remain static throughout training. However, the geometry of neural network loss landscapes evolves dramatically during optimization, transitioning from high-curvature chaotic regions to flatter basins near convergence. We propose Geometric Optimizer Morphing (GOM), a framework that dynamically restructures optimization algorithms based on real-time estimates of local loss landscape geometry. GOM maintains a continuous space of update rules parameterized by geometric descriptors—including local curvature estimates, gradient correlation structure, and Hessian spectral properties—computed efficiently from gradient history statistics. A lightweight meta-controller learns to navigate this optimizer space, enabling smooth transitions between momentum-dominated updates in sharp regions, adaptive preconditioning in ill-conditioned valleys, and quasi-Newton approximations near convergence. Unlike learned optimizers that require expensive meta-training, GOM derives its adaptation policy from geometric principles with minimal overhead. The framework unifies disparate optimizer families under a single geometric interpretation, providing theoretical grounding for when and why different optimization strategies succeed while enabling automatic algorithm selection without manual tuning.
