    0: Multimodal learning systems often assume uniform reliability across input modalities, yet real-world deployments face dynamic conditions where individual modalities may be degraded, noisy, or entirely absent. We introduce Evidential Cross-Modal Calibration (ECMC), a framework that enables adaptive multimodal fusion by learning to estimate per-modality reliability at inference time. ECMC places evidential priors over modality-specific encoders, producing calibrated uncertainty estimates that reflect input quality without requiring explicit degradation labels during training. A cross-modal attention mechanism then dynamically reweights modality contributions based on these uncertainty signals, allowing the model to gracefully shift reliance toward more trustworthy inputs. To encourage robust representations even under modality failure, we introduce stochastic modality dropout with uncertainty-guided consistency regularization, ensuring the model learns complementary rather than redundant cross-modal features. ECMC operates as a modular layer compatible with existing multimodal architectures across vision, audio, and language domains. Our framework addresses a critical gap in deploying multimodal systems under real-world variability, enabling principled uncertainty-aware fusion that maintains performance when individual modalities become unreliable.
    1: 'Cross-modal understanding typically emphasizes alignment and retrieval, yet many applications require generating detailed content in one modality from another—such as synthesizing realistic audio from silent video or hallucinating plausible visual dynamics from sound alone. We introduce Cross-Modal Causal Synthesis, a framework that learns fine-grained predictive relationships between vision and audio through temporal causal modeling. Unlike conventional alignment approaches, our method explicitly captures how visual events generate acoustic signatures and how audio patterns imply visual motion, enabling high-fidelity cross-modal generation. We employ a temporal transformer architecture with modality-specific encoders and a shared causal attention mechanism that models lead-lag relationships and probabilistic dependencies across time. The framework supports bidirectional generation: predicting detailed audio waveforms from video frames and synthesizing coherent visual sequences from audio spectrograms. Applications span accessibility tools for the hearing and visually impaired, content creation for film and gaming, and scientific analysis of audio-visual phenomena in domains like wildlife monitoring and manufacturing inspection where one modality may be unavailable or degraded.'
