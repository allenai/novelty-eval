    0: We introduce Temporal Landscape Memory Networks (TLMNs), a framework for optimization in non-stationary environments where objective functions evolve over time. Unlike classical optimizers that treat each iteration independently, TLMNs maintain a learned representation of historical loss landscapes to predict future geometric properties and guide parameter updates. Our approach combines a recurrent memory module that encodes temporal dependencies in objective evolution with a meta-learned update rule that conditions on predicted landscape curvature and drift direction. This enables proactive rather than reactive optimization, reducing regret in scenarios where objectives shift continuously. The framework naturally handles various non-stationarity patterns including periodic oscillations, concept drift, and sudden distribution shifts without requiring explicit change detection. By treating optimization as a sequential decision problem with memory, TLMNs bridge classical optimization theory and modern adaptive methods, offering a principled approach for continual learning, dynamic resource allocation, and real-time control systems where environmental conditions evolve predictably over time.
    1: Adaptive optimizers adjust learning rates based on gradient statistics, yet remain reactive to loss landscape geometry rather than anticipating it. We introduce Predictive Curvature Adaptation (PCA-Opt), a framework that learns to forecast local loss surface characteristics from gradient trajectory patterns, enabling preemptive step size modulation. Our approach maintains a lightweight recurrent module that observes sequences of gradients and predicts upcoming curvature signatures—detecting imminent saddle points, sharp valleys, or flat regions before the optimizer encounters them. These predictions inform a learned policy that modulates both step magnitude and direction, smoothing optimization trajectories through challenging terrain. Unlike second-order methods requiring expensive Hessian computations, PCA-Opt amortizes curvature estimation across training through pattern recognition in gradient space. The predictive module is trained via meta-learning across diverse optimization tasks, discovering transferable landscape motifs common to deep network training. During deployment, predictions are generated with minimal overhead through a single forward pass of the compact predictor network. PCA-Opt bridges the gap between computationally prohibitive curvature-aware methods and purely first-order approaches, offering anticipatory adaptation without sacrificing efficiency.
