    0: Reinforcement learning policies often exhibit brittle behavior when deployed in environments that deviate from training conditions, as they typically converge to singular behavioral strategies that lack adaptive flexibility. We introduce Behavioral Mode Diversification (BMD), a framework that learns policies with an ensemble of latent behavioral modes that can be dynamically composed based on environmental context. BMD augments standard policy optimization with an information-theoretic objective that maximizes mutual information between learned behavioral modes and detected environmental features, while a coverage regularizer ensures modes span diverse solution strategies. During deployment, a lightweight context encoder identifies relevant environmental characteristics and orchestrates mode composition without requiring explicit mode switching or hierarchical temporal abstraction. The framework naturally emerges redundant pathways to achieve goals, mirroring the robustness mechanisms observed in biological motor control systems. BMD integrates seamlessly with existing actor-critic architectures through an auxiliary loss that operates on the policy's latent representations, requiring minimal architectural modifications. This approach offers a principled mechanism for learning inherently robust policies that maintain multiple viable behavioral strategies, enabling graceful adaptation to distribution shifts and novel perturbations at deployment time.
    1: Sample efficiency remains a critical bottleneck in reinforcement learning, particularly for real-world applications where environment interactions are costly. We introduce Contrastive Skill Discovery in World Models (CSDWM), a framework that learns temporally-extended action abstractions through self-supervised exploration within a learned latent dynamics model. Rather than operating directly in the environment's action space, our approach discovers a library of reusable skills by optimizing for both temporal coherence and diversity through a contrastive objective in the world model's latent representation. Skills emerge as distinct behavioral primitives that capture meaningful environment interactions while maintaining predictability in latent space. This hierarchical decomposition enables rapid adaptation to downstream tasks through skill composition, requiring only high-level planning over the discovered skill library rather than low-level action selection. By decoupling skill discovery from task-specific rewards, CSDWM facilitates transfer learning across related environments and supports few-shot policy adaptation. The framework bridges world models and hierarchical reinforcement learning, offering a path toward more sample-efficient agents that leverage learned temporal abstractions for improved generalization.
