    0: Multimodal learning systems typically assume all modalities are available during inference, yet real-world deployment frequently encounters missing, corrupted, or asynchronous inputs across vision, audio, and language streams. We introduce Geometric Anchor Networks (GANets), a framework that enables robust multimodal reasoning under arbitrary modality absence without requiring modality-specific retraining or explicit imputation. GANets learn a set of modality-agnostic anchor points in a shared representation space that capture cross-modal semantic correspondences. When modalities are missing, these anchors serve as geometric bridges, enabling the model to traverse the latent manifold and recover task-relevant information through learned cross-modal transformations. A dynamic routing mechanism attends to available modalities while leveraging anchor-mediated paths to compensate for absent ones. The framework is trained with a novel dropout curriculum that systematically varies modality availability, encouraging the emergence of robust geometric structure. GANets provide a unified architecture for vision-language, audio-visual, and trimodal tasks that maintains consistent performance regardless of which input streams are present at inference time, addressing a critical gap between laboratory multimodal models and practical deployment requirements.
    1: Multimodal learning systems typically align different modalities by projecting them into a shared embedding space at a fixed temporal resolution, overlooking the fact that vision, audio, language, and physiological signals operate at fundamentally different time scales. We introduce Hierarchical Temporal Multimodal Alignment (HTMA), a framework that learns cross-modal representations while preserving the intrinsic temporal granularity of each modality. Our approach employs a cascade of temporal encoders that extract features at multiple resolutions, coupled with a novel cross-modal attention mechanism that discovers correspondences across hierarchical time scales. Rather than forcing synchronization at a single temporal level, HTMA learns which temporal relationships matter for different modality pairs—fine-grained audio-visual alignment for speech, coarse text-video correspondence for semantic understanding, and intermediate-scale matching for gesture-speech coordination. This hierarchical approach enables richer temporal reasoning in complex multimodal scenarios including affective computing, embodied instruction following, and multimedia content understanding, where events unfold simultaneously across multiple time scales.
