  ideas:
    0: Understanding how neural populations encode cognitive states requires methods that can bridge high-dimensional activity patterns with human-interpretable concepts. We introduce NeuroLanguage, a contrastive learning framework that aligns neural population recordings with natural language descriptions of cognitive tasks, behavioral states, and mental processes. By embedding both neural trajectories and textual annotations into a shared multimodal space, our approach learns representations that capture the semantic structure of cognition directly from neural data. The framework operates without requiring trial-by-trial labels, instead leveraging weak supervision from task protocols and experimental narratives. This enables zero-shot decoding of novel cognitive states by querying the embedding space with natural language, facilitating cross-task generalization and interpretable analysis of neural dynamics. NeuroLanguage provides a principled way to incorporate domain knowledge from cognitive science into neural data analysis, and offers a flexible interface for neuroscientists to interrogate population activity using conceptual queries rather than predefined decoders, potentially accelerating hypothesis generation and scientific discovery in systems neuroscience.
    1: 'Understanding how distributed neural populations implement cognitive computations remains a fundamental challenge in neuroscience. We introduce NeuroCognitive Transformers (NCT), a framework that learns a unified embedding space bridging neural population dynamics and cognitive computational primitives. NCT is pre-trained on large-scale multi-region neural recordings using a masked dynamics objective that captures spatiotemporal structure across diverse behaviors and brain areas. Crucially, we introduce a cognitive grounding mechanism that aligns learned neural representations with structured descriptions of computational operations—including attention, working memory maintenance, evidence accumulation, and prediction error signaling. This alignment is achieved through contrastive learning between neural trajectory segments and compositional cognitive program embeddings. The resulting model enables bidirectional translation: inferring active cognitive operations from neural recordings, and predicting population dynamics given cognitive task descriptions. NCT supports zero-shot generalization to novel cognitive paradigms by compositionally combining learned primitive operations. Our framework provides a computational tool for generating testable hypotheses about neural implementations of cognition and offers a foundation for interpretable neural population analysis grounded in cognitive theory.'
