    0: Modern generative models produce remarkably realistic samples but struggle with systematic generalization to novel compositions of known concepts. We introduce Compositional Diffusion Slots, a framework that integrates hierarchical slot-based representations into the diffusion process to enable unsupervised discovery of compositional structure. Our approach introduces learnable slot modules at multiple scales within the denoising network, where each slot competition mechanism encourages the model to decompose scenes into reusable components—from fine-grained parts to complete objects. A cross-scale binding mechanism ensures coherent composition by propagating information between hierarchical levels during both forward and reverse diffusion. Critically, the compositional structure emerges purely from the training objective without requiring segmentation masks, part annotations, or other supervision. The framework enables novel capabilities including compositional concept recombination, hierarchical editing at different granularities, and interpretable generation trajectories where the role of each slot can be visualized throughout the denoising process. Our formulation provides a principled connection between object-centric representation learning and score-based generative modeling, offering a path toward generative models that understand and manipulate the compositional building blocks underlying visual scenes.
    1: Modern generative models excel at producing high-fidelity samples but often lack compositional reasoning and struggle to respect hard logical constraints during generation. We introduce Program-Guided Diffusion, a hierarchical generative framework that decomposes synthesis into explicit planning and rendering stages. Our approach first generates a discrete latent program—a structured symbolic representation encoding compositional relationships, spatial arrangements, and semantic constraints—using a learned reasoning module. This program then guides a diffusion-based renderer through cross-attention mechanisms and program-conditioned denoising, ensuring generated outputs faithfully respect the specified structure. The program space is designed to be human-interpretable and editable, enabling intuitive control over generation. By training both modules jointly through a differentiable compilation process, our framework learns to ground symbolic reasoning in perceptual realism while maintaining logical consistency. This separation of concerns enables superior compositional generalization, allowing novel combinations of learned concepts, and facilitates incorporation of domain-specific constraints through programmatic interfaces. Our work bridges neural synthesis and symbolic reasoning, opening pathways for controllable generation in domains requiring structured outputs and verifiable correctness.
