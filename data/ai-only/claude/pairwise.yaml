    0: Modern machine learning benchmarks primarily assess correlational pattern matching on static test distributions, offering limited insight into whether models capture genuine causal mechanisms or exploit spurious features. We introduce Causal Intervention Benchmarks (CIB), a framework for constructing hybrid evaluation suites that pair real-world observational data with synthetically generated interventional samples derived from explicit causal graphs. By leveraging domain knowledge to specify plausible causal structures, we generate counterfactual instances through principled graph interventions while preserving realistic feature distributions. This design enables systematic evaluation of model robustness to distribution shifts that break spurious correlations while maintaining causal invariances. The framework supports multi-domain adaptation, allowing researchers to instantiate CIB across vision, language, and structured prediction tasks. Each benchmark instance includes comprehensive causal metadata documenting the underlying generative process, intervention types, and known confounders. CIB provides a principled methodology for distinguishing models that learn portable causal representations from those that memorize dataset-specific shortcuts, advancing evaluation practices toward assessing genuine understanding rather than superficial correlation exploitation.
    1: Current machine learning benchmarks measure aggregate performance through static test sets, yet they fail to characterize the critical boundaries where model competence breaks down. This limitation impedes reliable deployment, as practitioners cannot anticipate when models will transition from accurate to erroneous behavior. We introduce CompetenceBoundary, a dynamic benchmarking framework that adaptively probes the frontier of model capabilities through interrogative task generation. Rather than sampling uniformly from a fixed distribution, our framework employs a curriculum of increasingly challenging perturbations—spanning lexical, syntactic, semantic, and reasoning dimensions—to systematically map the hypersurface separating reliable from unreliable model behavior. The benchmark dynamically generates novel instances conditioned on model responses, ensuring resistance to data contamination while maintaining relevance as capabilities evolve. CompetenceBoundary produces interpretable competence maps that reveal structured failure modes across capability dimensions, enabling practitioners to establish principled trust boundaries. By shifting evaluation from performance measurement to competence characterization, this framework addresses a fundamental gap between benchmark success and deployment reliability, providing actionable insights for understanding model limitations in safety-critical applications.
