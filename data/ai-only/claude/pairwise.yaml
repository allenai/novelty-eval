    0: Discovering interpretable governing equations from experimental data remains a central challenge in the physical sciences, particularly when measurements are noisy, sparse, or high-dimensional. We introduce a neural-symbolic framework that combines the representational power of neural operators with the symbolic reasoning capabilities of large language models for automated equation discovery. Our approach employs a neural network to learn compact latent representations of physical dynamics from observational data, then prompts a large language model to generate candidate symbolic equations consistent with these learned behaviors. A key innovation is an iterative refinement loop that incorporates physical constraints—including dimensional consistency, known symmetries, and conservation laws—as structured prompts, guiding the language model toward physically plausible symbolic forms. The framework seamlessly integrates data-driven learning with domain knowledge, enabling discovery of parsimonious equations that generalize beyond training conditions. By treating equation discovery as a prompted reasoning task rather than pure optimization, our method produces human-interpretable mathematical expressions that capture underlying physical principles, offering a new paradigm for scientific discovery in computational physics, chemistry, and materials science.
    1: Neural surrogate models for physical simulations offer dramatic speedups over traditional numerical solvers, yet they typically require retraining for each new physical system or parameter regime. We introduce ConserveNet, a neural operator architecture that achieves cross-domain generalization by structurally encoding conservation laws as transferable inductive biases. Rather than treating conservation as soft regularization, ConserveNet embeds these principles directly into network architecture through divergence-preserving layers for mass and charge conservation, antisymmetric modules for momentum balance, and symplectic integration blocks for energy-conserving dynamics. A hierarchical conservation encoder learns to recognize which conservation structures govern an input system, automatically activating appropriate architectural pathways. This design creates a shared representational space where physically distinct systems—from incompressible fluids to electromagnetic fields to Hamiltonian mechanics—are unified through their common conservation grammar. ConserveNet enables few-shot adaptation to novel PDEs by transferring learned conservation structures while requiring only minimal fine-tuning for system-specific constitutive relations. Our framework bridges the gap between black-box neural surrogates and physics-informed approaches, providing both computational efficiency and principled generalization grounded in fundamental physical laws.
