    0: Static benchmarks inadequately reflect the temporal dynamics inherent in real-world machine learning deployments, where data distributions evolve continuously due to seasonal variations, cultural trends, and shifting user behaviors. We introduce TemporalShift, a benchmark framework designed to evaluate model robustness and adaptability under realistic temporal distribution shifts. Unlike conventional benchmarks that assess performance on fixed test sets, TemporalShift presents models with sequential evaluation episodes where the data distribution evolves according to carefully curated temporal patterns derived from longitudinal studies across vision, language, and multimodal domains. The framework distinguishes between gradual drift and sudden shifts, incorporates recurrent patterns and novel emergence scenarios, and provides a unified evaluation protocol for measuring both zero-shot robustness and few-shot adaptation capabilities. TemporalShift encourages the development of models that maintain performance stability over time while efficiently incorporating new knowledge, bridging the critical gap between static benchmark success and practical deployment reliability. This paradigm shift in evaluation methodology provides the community with essential tools for building more resilient and adaptive machine learning systems.
    1: Standard benchmarks evaluate machine learning models on static test sets after training, revealing what models know but obscuring how they learn. We introduce LearningLens, a benchmark suite designed to evaluate learning dynamics rather than final performance. LearningLens comprises carefully constructed datasets with explicit compositional structure, controlled difficulty gradients, and known optimal acquisition orders. Each dataset is paired with trajectory metrics that capture sample efficiency curves, feature learning sequences, and sensitivity to curriculum variations. The benchmark enables systematic comparison of how different architectures, optimizers, and pretraining strategies affect the learning process itself. We provide diagnostic probes that measure intermediate representation quality throughout training, revealing when and how models acquire specific capabilities. LearningLens also includes adversarial curriculum tests that expose brittleness in learning dynamics invisible to endpoint evaluations. By shifting focus from static snapshots to dynamic trajectories, our benchmark opens new research directions in understanding inductive biases, optimizing data efficiency, and designing training curricula. We release the benchmark generation framework, enabling researchers to create domain-specific learning dynamics evaluations for diverse modalities and tasks.
