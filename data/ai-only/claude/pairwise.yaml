    0: Variational inference in Bayesian deep learning often relies on restrictive parametric families that fail to capture the complex, multi-modal geometry of high-dimensional weight posteriors. We introduce Diffusion Variational Inference (DVI), a framework that employs score-based diffusion models as flexible implicit variational families. Unlike traditional approaches constrained by factorial or flow-based approximations, DVI learns to denoise samples from a simple base distribution into approximate posterior samples through a parametric reverse diffusion process. The forward process gradually adds noise to samples from the true posterior, while the reverse process—parameterized by neural networks—is trained to invert this corruption. This formulation naturally handles multi-modality and complex dependencies without explicit density evaluation. We derive a tractable evidence lower bound by connecting the diffusion training objective to variational inference principles, enabling joint optimization of both the generative model and the posterior approximation. The resulting framework provides a scalable approach to uncertainty quantification in deep learning that gracefully handles pathological posterior geometries while maintaining computational efficiency through amortized inference.
    1: 'Bayesian neural networks promise principled uncertainty quantification, yet practitioners face an unsatisfying tradeoff: fast approximate inference methods yield poorly calibrated uncertainties, while asymptotically exact methods incur prohibitive computational costs uniformly across all inputs. We introduce Adaptive Inference Depth Networks (AIDNet), a framework that learns to dynamically allocate inference computation based on input-dependent epistemic difficulty. AIDNet employs a lightweight meta-controller that observes early-stage approximate posterior statistics and predicts the refinement depth needed—measured in additional sampling or optimization steps—to achieve calibrated uncertainty estimates for each input. The controller is trained via a differentiable surrogate that relates inference budget to calibration quality, enabling end-to-end learning without expensive per-input ground truth. During deployment, confident predictions terminate early with variational approximations, while ambiguous or out-of-distribution inputs automatically trigger deeper MCMC refinement. This creates a continuous spectrum between approximate and exact inference, adapting computation to difficulty rather than applying uniform budgets. AIDNet provides a principled mechanism for anytime uncertainty quantification, gracefully trading computational cost against calibration quality while maintaining theoretical connections to both variational and sampling-based inference paradigms.'
