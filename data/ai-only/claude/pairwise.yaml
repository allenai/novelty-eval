  ideas:
    0: 'We introduce Compositional Expert Routing Networks (CERN), a framework that transforms foundation models into dynamic orchestrators capable of seamlessly integrating specialized expert modules without base model retraining. Rather than encoding all knowledge within monolithic parameters, CERN learns to route queries through a compositional graph of lightweight expert modules, each capturing domain-specific knowledge or specialized reasoning capabilities. The routing mechanism operates through learned attention patterns over module capabilities, conditioned on input semantics and task requirements. Crucially, new experts can be added post-deployment by training only the routing connections, preserving existing model behavior while extending capabilities. This architecture enables foundation models to evolve continuously, supporting rapid domain adaptation, explicit knowledge provenance through routing decisions, and efficient updates by replacing individual modules. CERN addresses fundamental limitations in current foundation model paradigms: the prohibitive cost of retraining, the opacity of monolithic knowledge representation, and the inflexibility of static architectures, paving the way toward more sustainable and adaptable large-scale AI systems.'
    1: Large language models encode vast knowledge within their parameters, yet this knowledge remains static post-training, requiring costly interventions for updates. We introduce Neural Knowledge Homeostasis, a self-supervised framework enabling foundation models to autonomously maintain and reorganize their internal knowledge representations. Inspired by memory consolidation in biological systems, our approach introduces periodic maintenance phases where models identify and resolve knowledge inconsistencies through gradient-free attractor dynamics in representation space. We formalize knowledge as dynamic attractor states rather than fixed parameter configurations, allowing beliefs to be strengthened through consistent activation patterns or gracefully deprecated when contradicted by emerging context. A homeostatic objective balances knowledge preservation against plasticity, while a sparse gating mechanism isolates maintenance operations to prevent interference with core capabilities. The framework requires no external supervision or ground-truth labels, instead leveraging internal consistency signals derived from the model's own predictions across paraphrased queries. Neural Knowledge Homeostasis provides a principled path toward foundation models capable of perpetual self-improvement while maintaining coherent, non-contradictory world models.
