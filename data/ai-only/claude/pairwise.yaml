    1: Modern foundation models excel at prediction but provide poorly calibrated uncertainty estimates, particularly under distribution shift. Standard Bayesian approaches either require prohibitive computation or rely on restrictive variational families that underestimate epistemic uncertainty. We introduce Geometric Amortized Variational Inference (GAVI), a framework that learns to produce expressive posterior approximations over neural network parameters by exploiting the intrinsic geometric structure of loss landscapes. GAVI trains a hypernetwork to map input contexts to parameters of a structured variational distribution defined on the tangent space of the pretrained model's parameter manifold. By conditioning on both task data and geometric features extracted from local curvature, our approach amortizes the cost of variational inference while capturing meaningful posterior correlations. The geometric conditioning enables the hypernetwork to adapt the variational family's complexity to local landscape structure, yielding better calibrated uncertainties than fixed variational families. This approach provides a computationally efficient path toward principled uncertainty quantification in large pretrained models without requiring ensemble methods or extensive retraining.
