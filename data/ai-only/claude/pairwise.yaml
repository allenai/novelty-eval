    0: Large language models exhibit striking capabilities yet consistently fail at compositional generalization, struggling to systematically combine familiar concepts in novel configurations. We introduce Compositional Attention Scaffolding (CAS), a parameter-efficient inference-time intervention that enhances compositional reasoning without fine-tuning or explicit chain-of-thought generation. CAS operates through a lightweight routing module that detects compositional structure in queries and dynamically injects learned attention biases that prevent representational collapse of constituent components. Unlike prompting strategies that externalize reasoning, CAS operates directly on intermediate representations, maintaining computational efficiency while preserving the model's general capabilities. The core mechanism learns a small bank of compositional operators—corresponding to common combination patterns like attribute binding, relational composition, and recursive nesting—which modulate attention flow to maintain separation between elements requiring independent processing before integration. CAS can be trained on synthetic compositional data and transfers zero-shot to diverse natural language compositional challenges. Our framework provides both a practical enhancement for deployed models and theoretical insights into the representational bottlenecks underlying compositional failures in transformer architectures.
    1: Foundation models excel at leveraging pre-trained knowledge but struggle to incorporate new information after deployment without costly retraining or architectural modifications. We introduce Selective Neuroplasticity Networks (SNNs), a framework that enables large language models to dynamically assimilate streaming information while preserving their foundational capabilities. Our approach learns a meta-policy that identifies which model components—specific attention heads, feed-forward layers, or parameter subspaces—should adapt to new knowledge versus remain stable. By modeling knowledge integration as a routing problem within the transformer architecture, SNNs create dedicated pathways for new information that minimally interfere with existing representations. The meta-policy is trained via bi-level optimization to maximize both knowledge retention and integration across diverse continual learning scenarios. Unlike retrieval-augmented generation, which maintains external memory, our method internalizes new knowledge directly into model weights through selective, localized updates. This enables foundation models to evolve continuously in deployment, adapting to temporal shifts, user-specific contexts, and private data streams while maintaining their broad pre-trained capabilities across standard benchmarks.
