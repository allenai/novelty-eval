    0: Large language models encode vast knowledge but struggle with systematic compositional generalization—the ability to recombine known concepts in novel configurations. We introduce the Neural Compositional Workspace, a lightweight architectural module that augments frozen foundation models with dynamic concept binding capabilities inspired by cognitive theories of consciousness and working memory. Rather than relying on implicit composition through feedforward computation, our approach explicitly maintains a structured workspace where concept representations can be dynamically bound, transformed, and unbound through learned attention-based operations. The workspace operates as a differentiable scratchpad that orchestrates information flow between the foundation model's frozen representations, enabling systematic recombination without modifying pretrained weights. Training requires only modest compositional reasoning examples while preserving the base model's general capabilities. Our framework bridges cognitive science principles with modern deep learning, offering a parameter-efficient path toward more systematic reasoning in foundation models. The modular design allows the workspace to transfer across different backbone architectures, suggesting a general mechanism for enhancing compositional capabilities in pretrained models.
    1: Foundation models encode vast knowledge within their parameters, yet this knowledge remains static after pretraining, creating a growing gap between model capabilities and an evolving world. We introduce Temporal Knowledge Modulation (TKM), a framework enabling foundation models to continuously integrate new factual knowledge without catastrophic forgetting or full retraining. TKM augments pretrained LLMs with a lightweight temporal knowledge module that learns to modulate internal representations based on structured knowledge graphs timestamped with validity periods. Unlike retrieval-augmented generation, which provides external context, our approach updates the model's parametric knowledge through targeted interventions in the representation space. The temporal module learns consistency constraints that propagate updates across semantically related facts, ensuring logical coherence as knowledge evolves. By separating stable general-purpose capabilities from dynamic factual knowledge, TKM enables models to track scientific discoveries, world events, and domain-specific information streams while preserving their original competencies. This paradigm shift from static to dynamic parametric knowledge opens new possibilities for maintaining relevant, up-to-date foundation models in rapidly changing domains.
