    0: 'We introduce Selective Meta-Lifelong Learning, a unified framework that bridges transfer learning, meta learning, and lifelong learning through learned task composition and dynamic knowledge routing. Traditional approaches treat these paradigms separately, leading to systems that either transfer indiscriminately, adapt without memory, or accumulate knowledge without selectivity. Our framework maintains a structured episodic memory of task representations and learns meta-level policies that determine which prior experiences to leverage for each new task. A compositional task encoder discovers latent task structure, enabling the system to identify relevant subspaces of past knowledge while quarantining interference from dissimilar experiences. Gated adaptation modules, trained via meta-learning, selectively activate and compose relevant prior knowledge for rapid few-shot adaptation. The architecture supports continual expansion of its knowledge base while preventing catastrophic forgetting through meta-learned consolidation strategies that operate in task-relevant subspaces. This approach enables AI systems to exhibit human-like learning flexibility: quickly adapting to novel situations by selectively recruiting relevant past experience while maintaining stable long-term knowledge.'
    1: Lifelong learning systems must continuously acquire new skills while preserving existing knowledge, yet current approaches rely on fixed consolidation strategies that cannot adapt to the evolving structure of the task stream. We introduce Meta-Consolidation Networks, a hierarchical framework that learns to learn how to transfer and retain knowledge across a lifetime of tasks. Our approach maintains a meta-learner that generates task-specific consolidation policies, determining which parameters to protect, how to modulate gradient flow, and when to trigger memory replay. Crucially, this meta-learner itself undergoes continual refinement, updating its consolidation strategies based on observed forgetting patterns and transfer success across the system's history. We formulate this as a bi-level optimization problem where the inner loop adapts to new tasks using generated policies, while the outer loop updates the policy generator based on long-term retention and forward transfer signals. A compact episodic memory stores task signatures and consolidation outcomes, enabling the meta-learner to recognize task similarities and retrieve effective strategies. This self-improving architecture bridges meta-learning and lifelong learning, producing systems whose ability to learn without forgetting strengthens with experience.
