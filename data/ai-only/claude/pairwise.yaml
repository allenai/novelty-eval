    0: Current interpretability methods produce either post-hoc explanations that may not faithfully reflect model reasoning or require expensive human annotations of predefined concepts. We introduce Semantic Atlases, a framework that automatically discovers and organizes interpretable concept structures within neural networks during training. Rather than explaining individual predictions, our approach constructs a continuous, navigable map of the model's representation space, revealing how semantic concepts emerge, compose, and evolve across layers. By combining tools from persistent homology and information geometry, we identify stable conceptual landmarks and trace their transformations through the network architecture. A self-supervised consistency objective encourages the formation of human-aligned concepts without explicit supervision, while preserving model performance. The resulting atlas enables both local explanations—showing which concepts contribute to specific predictions—and global understanding of how models partition input space and generalize beyond their training distribution. This paradigm shift from explaining outputs to mapping internal semantics provides a foundation for auditing, debugging, and validating deep learning systems in safety-critical applications.
    1: 'Post-hoc explanation methods provide static snapshots of model reasoning, yet deployed models continuously evolve through updates, fine-tuning, and distribution shifts. Understanding how and why explanations change over time remains largely unexplored, limiting our ability to maintain trust in adaptive systems. We introduce Explanation Drift Tracking, a framework for monitoring the temporal dynamics of model interpretations across learning episodes. Our approach defines explanation trajectories in a unified attribution space and employs optimal transport to quantify semantic distances between explanation distributions at different temporal checkpoints. We propose a decomposition that disentangles explanation changes into three components: knowledge acquisition (new valid reasoning patterns), knowledge refinement (improved feature weighting), and reasoning corruption (adoption of spurious correlations). A lightweight detector identifies critical drift events that warrant human review without requiring access to ground-truth rationales. The framework operates model-agnostically over any gradient-based attribution method and introduces temporal coherence regularization that encourages stable explanations during training when underlying concepts remain constant. Explanation Drift Tracking enables practitioners to audit not just what a model currently believes, but how its reasoning has evolved.'
