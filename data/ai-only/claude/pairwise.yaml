    0: Representation learning methods—supervised, self-supervised, semi-supervised, and unsupervised—are typically developed and applied independently, missing opportunities for synergistic learning dynamics. We introduce Supervision Spectrum Learning (SSL²), a unified framework that dynamically orchestrates multiple supervision signals throughout the representation learning process. SSL² employs a meta-controller that continuously assesses representation quality through intrinsic metrics and adaptively reweights contributions from contrastive objectives, reconstruction losses, clustering constraints, and available labels. Rather than treating supervision paradigms as discrete choices, our framework models them as a continuous spectrum, enabling smooth transitions as representations mature. The meta-controller learns a curriculum over supervision types, initially emphasizing structure discovery through unsupervised objectives, progressively incorporating invariance-building self-supervised signals, and strategically integrating label information to refine decision boundaries. A key innovation is our representation maturity estimator, which tracks feature stability, cluster separability, and gradient alignment to inform supervision scheduling without requiring held-out validation data. SSL² produces representations that inherit the generalization benefits of self-supervised learning while achieving the discriminative power of supervised approaches, offering a principled path toward supervision-agnostic representation learning.
    1: Representation learning methods traditionally operate within fixed paradigms—purely self-supervised, semi-supervised, or fully supervised—each optimizing distinct objectives that may conflict during training. We propose Adaptive Multi-Paradigm Representation Learning (AMPRL), a unified framework that learns to dynamically compose supervision signals based on local data geometry and label availability. Rather than manually balancing self-supervised and supervised objectives, AMPRL employs a meta-learning controller that assigns sample-specific weights to contrastive, reconstructive, and discriminative losses, enabling smooth interpolation across the supervision spectrum. The framework introduces paradigm-aware attention mechanisms that allow different representation subspaces to specialize in capturing self-supervised invariances versus supervised discriminability without mutual interference. By treating the learning paradigm as an adaptive, learnable component rather than a fixed design choice, AMPRL produces representations that simultaneously preserve unsupervised structure discovery and supervised task performance. This approach naturally handles varying label budgets and enables seamless transfer across tasks requiring different levels of invariance, opening new possibilities for flexible, general-purpose representation learning systems.
