    0: 'Bayesian inference in deep learning requires navigating a fundamental trade-off: variational methods offer computational efficiency but introduce approximation bias, while sampling methods provide asymptotic exactness at prohibitive computational cost. We propose Adaptive Inference Routing, a meta-learned framework that dynamically selects between variational and sampling-based strategies based on local posterior geometry. Our approach trains a lightweight routing network to characterize regions of the parameter space, directing inference toward fast amortized variational updates in unimodal regions while triggering localized sampling in areas exhibiting multimodality or heavy tails. The router is optimized end-to-end using a reward signal that balances posterior approximation quality against computational budget. To enable gradient-based training across discrete routing decisions, we introduce a differentiable surrogate that interpolates between inference modes. A key component is a geometry-aware feature extractor that summarizes local curvature and gradient statistics to inform routing decisions. Our framework naturally provides calibrated uncertainty estimates by combining the complementary strengths of both inference paradigms, adapting its computational investment to the complexity of the local posterior landscape.'
    1: Uncertainty quantification in deep learning typically conflates multiple sources of uncertainty—data noise, model misspecification, and epistemic uncertainty from limited samples—into a single predictive distribution. This conflation obscures the interpretability of uncertainty estimates and limits their utility for downstream decision-making tasks that require understanding which uncertainties are reducible through data collection versus inherent to the problem. We propose Factorized Uncertainty Networks, a hierarchical Bayesian framework that explicitly decomposes predictive uncertainty into structured components through a multi-level variational inference scheme. Our approach introduces separate latent variable hierarchies for aleatoric and epistemic uncertainties, coupled through a novel conditional prior that captures their interaction. An amortized inference network learns to map inputs directly to factorized uncertainty estimates, enabling efficient uncertainty decomposition at test time without expensive sampling or optimization. The factorized representation naturally supports uncertainty-aware active learning, robust decision-making under distributional shift, and interpretable confidence assessment. By making uncertainty structure explicit rather than implicit, our framework bridges the gap between theoretically principled Bayesian inference and practically deployable uncertainty quantification for safety-critical applications.
