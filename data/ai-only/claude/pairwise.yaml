  ideas:
    0: 'Static benchmarks have driven remarkable progress in machine learning, yet they suffer from saturation, data contamination, and overfitting to fixed evaluation distributions. We introduce EvoEval, a framework for creating living benchmarks that continuously evolve to maintain discriminative power and resist memorization-based shortcuts. EvoEval combines three complementary mechanisms: procedural instance generation that creates novel test cases from compositional primitives, an adversarial curriculum that identifies and amplifies capability gaps exposed by current models, and temporal stratification that ensures evaluation instances remain unseen during training cutoffs. The framework maintains benchmark validity through invariant preservation, ensuring generated instances satisfy task-specific constraints while varying surface-level features. Rather than measuring performance on static snapshots, EvoEval quantifies a model''s adaptability frontier—its ability to generalize across controlled distribution shifts of increasing difficulty. We provide a meta-benchmark specification language enabling researchers to define evolution rules for diverse task families spanning reasoning, language understanding, and multimodal comprehension. EvoEval offers a paradigm shift from asking ''how well does a model perform?'' to ''how robustly does performance transfer across the space of valid task variations?'''
    1: Machine learning benchmarks traditionally assume static data distributions, yet real-world deployments face continuous temporal shifts that degrade model performance unpredictably. We introduce Temporal Shift Decomposition Benchmarks, a new paradigm for dataset construction that explicitly disentangles multiple sources of temporal distribution shift. Our framework structures datasets along fine-grained temporal axes while controlling for confounding factors such as label distribution changes, feature drift, and concept evolution. Each benchmark provides parallel evaluation tracks isolating specific shift mechanisms—seasonal variations, trend-based drift, sudden regime changes, and gradual covariate shift—enabling precise diagnosis of model vulnerabilities. By incorporating metadata about the causal sources of temporal changes, these benchmarks support development of models with explicit temporal reasoning capabilities rather than spurious temporal correlations. This approach spans multiple domains including climate modeling, financial forecasting, and social media analysis, where understanding temporal robustness is critical. The framework establishes new evaluation protocols that measure not just accuracy degradation over time, but also a model's capacity to detect, adapt to, and predict future distribution shifts.
