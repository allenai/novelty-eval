    1: 'Machine learning benchmarks predominantly evaluate models on temporally static data, overlooking the fundamental challenge that real-world knowledge continuously evolves through scientific discoveries, social changes, and factual corrections. We introduce ChronoEval, a living benchmark framework designed to assess temporal robustness in language and multimodal models. ChronoEval comprises versioned knowledge snapshots across diverse domains—science, geopolitics, medicine, and technology—spanning two decades, with explicit annotations distinguishing knowledge updates, factual corrections, deprecated concepts, and emerging terminology. The framework defines three complementary evaluation protocols: temporal consistency (maintaining accuracy on stable facts), adaptive updating (incorporating new valid knowledge), and graceful deprecation (appropriately handling outdated information without catastrophic forgetting). Unlike static benchmarks that become stale, ChronoEval includes a systematic update protocol with quarterly revisions and provenance tracking, enabling longitudinal studies of model temporal decay. We provide temporal stratification tools that diagnose when models'' knowledge becomes unreliable, supporting deployment decisions in time-sensitive applications. ChronoEval establishes a foundation for developing temporally-aware systems capable of lifelong learning in dynamic information environments.'
