  ideas:
    0: 'Sample efficiency in reinforcement learning remains fundamentally limited by the inability of agents to recognize and exploit structural regularities in environment dynamics. We introduce Symmetry Discovery Networks (SDN), a framework that jointly learns environment dynamics and discovers latent symmetry groups governing state-action transitions. Rather than assuming known symmetries a priori, SDN employs a learnable group representation module that identifies approximate equivariances in the transition function through a novel consistency objective. Discovered symmetries are leveraged in three ways: generating synthetic transitions via learned group actions, constraining the policy to respect identified invariances, and enabling efficient planning through symmetry-reduced search spaces. The framework maintains a hierarchy of discovered symmetry subgroups with associated confidence scores, allowing graceful handling of approximate and partial symmetries common in realistic domains. SDN integrates naturally with model-based reinforcement learning, where the symmetry-aware world model provides both improved prediction accuracy and principled data augmentation. Our approach offers a path toward agents that autonomously identify exploitable structure in their environments, addressing a fundamental bottleneck in learning efficiency for complex sequential decision-making problems.'
    1: 'We introduce Failure-Aware Policy Learning (FAPL), a dual-policy reinforcement learning framework that explicitly models and leverages failure patterns to accelerate learning in sparse-reward environments. While traditional RL methods treat failed trajectories as mere negative examples, we argue that failures contain rich structural information about environment constraints and deceptive local optima. FAPL maintains two interacting policies: a primary policy that learns to maximize rewards, and an auxiliary failure prediction policy that learns to identify state-action regions associated with systematic failure modes. The failure policy provides shaped exploration guidance by steering the primary policy away from unproductive behavioral patterns while preserving necessary risk-taking for discovery. Through a novel counterfactual reasoning mechanism, the framework identifies when apparent failures actually represent progress toward delayed rewards versus true dead-ends. This failure-aware approach is particularly valuable in safety-critical domains and tasks with deceptive reward landscapes, where understanding what not to do is as crucial as learning successful behaviors. Our method requires minimal architectural changes and integrates seamlessly with existing off-policy RL algorithms.'
