    0: Large language models generate responses through uniform autoregressive decoding, allocating equivalent computation to trivial and complex problems alike. This computational homogeneity limits their effectiveness on tasks requiring variable-depth reasoning. We introduce Adaptive Deliberation Networks, a framework that enables foundation models to dynamically modulate their reasoning depth based on problem complexity. Our approach augments pretrained LLMs with a learned deliberation controller that predicts uncertainty at intermediate reasoning steps and triggers recursive refinement cycles when needed. The controller operates in a latent deliberation space where the model can explore alternative reasoning paths, backtrack from unproductive directions, and consolidate insights before committing to output tokens. A key innovation is our complexity-aware training objective that teaches the model to recognize when additional deliberation yields diminishing returns, preventing both premature responses and excessive rumination. The framework requires no architectural modifications to the base model, instead operating through learned steering vectors that activate deliberative modes. Adaptive Deliberation Networks bridge reactive language generation and genuine cognitive deliberation, offering a path toward models that think proportionally to the demands of each problem.
    1: Foundation models encode vast knowledge within monolithic parameter spaces, making targeted updates, error correction, and knowledge attribution fundamentally intractable without costly retraining. We introduce Modular Knowledge Subspaces (MKS), a novel pretraining paradigm that encourages foundation models to self-organize knowledge into disentangled, editable neural circuits. During pretraining, we impose structured sparsity constraints and contrastive knowledge routing objectives that guide different parameter subsets to specialize in distinct knowledge domains while preserving cross-domain reasoning capabilities. Each subspace maintains explicit routing metadata enabling precise knowledge attribution and selective modification. This architecture allows for surgical knowledge updates through localized fine-tuning of individual subspaces without affecting others, addressing catastrophic forgetting and temporal knowledge drift. MKS transforms foundation models from opaque monoliths into compositional systems where knowledge can be inspected, validated, and modified at granular levels while retaining the emergent abilities of large-scale pretraining. This paradigm enables continuously updatable models, improved factual accuracy through targeted corrections, and new forms of interpretability through knowledge circuit analysis.
