  ideas:
    0: Neural population activity exhibits complex, high-dimensional dynamics that reflect underlying cognitive computations, yet extracting interpretable structure from such data remains challenging. We introduce Cognitive Dynamical Autoencoders (CogDAE), a framework that learns low-dimensional latent dynamics from neural recordings while enforcing cognitive priors about compositional structure and behavioral alignment. Unlike standard neural dimensionality reduction techniques, CogDAE incorporates architectural inductive biases that encourage the learned dynamics to factorize into reusable computational motifs—discrete latent programs that combine flexibly across tasks and contexts. A cross-modal alignment objective ensures that neural trajectory geometry mirrors behavioral state spaces, enabling direct interpretation of latent dimensions in terms of cognitive variables. The model employs a hierarchical structure where slow timescale variables modulate fast neural dynamics, reflecting the multi-scale nature of cortical processing. By learning structured, behaviorally-grounded representations of neural computation, CogDAE provides a principled approach for hypothesis generation in cognitive neuroscience and offers insights into how biological networks implement flexible, compositional cognition.
    1: 'Understanding the computational principles shared between biological and artificial neural networks remains a central challenge in both neuroscience and machine learning. We introduce Neural Geometry Alignment (NGA), a training framework that bidirectionally couples artificial network representations with biological neural recordings during learning. Rather than treating neural data as prediction targets, NGA employs a soft geometric constraint that encourages artificial hidden representations to preserve the relational structure observed in population-level neural activity while maintaining task performance. The framework uses optimal transport to align representational similarity matrices across biological and artificial systems, allowing flexible correspondence discovery without requiring neuron-to-unit mappings. NGA enables two complementary research modes: forward mode identifies which architectural and learning choices produce representations most aligned with biological circuits, while inverse mode reveals which task-relevant features biological systems emphasize by analyzing where alignment naturally emerges or breaks down. We provide theoretical analysis showing that geometric alignment constraints preserve task-relevant gradients while shaping representation topology. NGA offers a unified framework for testing computational hypotheses about biological neural coding while simultaneously improving interpretability of artificial systems through grounding in biological computation.'
