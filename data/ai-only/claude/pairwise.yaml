    0: Modern generative models learn end-to-end transformations that implicitly capture complex data distributions, yet their monolithic nature limits interpretability, compositionality, and systematic generalization. We introduce Generative Program Synthesis (GPS), a framework that reformulates generation as the execution of learned compositional programs over a library of reusable generative primitives. GPS jointly discovers a discrete library of elementary generative subroutines and learns to compose them hierarchically through a differentiable program executor. A variational objective balances reconstruction fidelity with program compactness, encouraging the emergence of interpretable and transferable generative building blocks. The framework employs a novel relaxation that enables gradient-based optimization over discrete program structures while maintaining the expressiveness of continuous generative models. Programs can be inspected, edited, and recombined, enabling fine-grained control over the generative process. GPS bridges neural generative modeling with program induction, offering a path toward generative systems that not only synthesize realistic samples but also expose the compositional structure underlying their generations.
    1: We introduce a generative framework that learns to iteratively revise and refine its outputs through explicit self-critique and localized editing. Unlike conventional generative models that produce outputs in a single forward pass or through uniform denoising schedules, our approach decomposes generation into an initial draft phase followed by learned revision steps. A critic network evaluates generated content and identifies regions requiring improvement, while a separate editor network applies targeted modifications conditioned on the critique. By framing revision as a learned policy rather than a fixed procedure, the model discovers task-specific refinement strategies that go beyond simple denoising. The framework operates on a differentiable edit space, enabling end-to-end training through policy gradient methods or amortized optimization. This revision-aware paradigm naturally handles structured generation tasks where coherence constraints and long-range dependencies make single-pass generation difficult. Our approach provides a unified perspective on iterative refinement, connecting diffusion-based denoising, autoregressive correction, and human-like editing processes within a single learning framework that explicitly models the revision process as a first-class component of generation.
