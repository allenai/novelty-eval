    0: Probabilistic inference in complex systems remains computationally prohibitive, yet real-world problems exhibit natural compositional structure that current methods fail to exploit. We introduce Compositional Amortized Variational Inference (CAVI), a framework that learns modular probabilistic building blocks which can be dynamically assembled to perform efficient inference on novel task compositions. Rather than training separate inference networks for each problem instance, CAVI decomposes the generative process into reusable components and learns corresponding modular inference modules that communicate through structured message passing. Each module performs local variational inference while maintaining global coherence through a coordination mechanism based on factor graph representations. This compositional approach enables zero-shot generalization to unseen combinations of known components and dramatically reduces the computational cost of adapting to new problem structures. By separating component-level inference from their composition, CAVI provides a principled path toward scalable Bayesian reasoning in structured domains, bridging the gap between flexible deep learning and interpretable probabilistic modeling while maintaining rigorous uncertainty quantification across compositional boundaries.
    1: Variational inference offers computational efficiency but introduces approximation bias, while MCMC methods provide asymptotic exactness at significant computational cost. We propose Diffusion-Refined Variational Inference (DRVI), a framework that bridges this gap by learning a conditional denoising process that iteratively transforms variational samples toward the true posterior. Given a variational approximation, DRVI trains a score network conditioned on the target likelihood to progressively correct approximation errors through a learned diffusion trajectory. The variational distribution serves as an informed initialization, substantially shortening the path to the posterior compared to diffusion from noise. This formulation provides a continuous trade-off between speed and accuracy controlled by the number of refinement steps, gracefully interpolating from pure variational inference to asymptotically exact sampling. We derive a tractable training objective that decomposes into a variational term and a denoising score matching term, enabling end-to-end learning. DRVI naturally extends to amortized settings, where a single refinement network generalizes across inference problems sharing common structure. Our framework unifies variational and sampling-based paradigms while inheriting the favorable properties of diffusion models, including stable training and flexible architecture choices.
