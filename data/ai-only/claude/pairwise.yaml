    0: Existing generative models struggle to satisfy multiple compositional constraints simultaneously, often producing outputs that inadequately balance competing objectives or fail to respect fine-grained user specifications. We introduce Compositional Constraint Diffusion (CCD), a framework that decomposes the generation process into a structured latent space where orthogonal subspaces encode disentangled generative factors. Rather than conditioning on concatenated embeddings or classifier guidance, CCD formulates multi-constraint generation as a dynamic optimization problem in this structured latent space, where each constraint defines a soft potential function. During the reverse diffusion process, latent codes are iteratively refined through gradient-based updates that minimize constraint violations while maintaining sample quality through learned manifold projections. A meta-learning procedure discovers the optimal factorization of the latent space by training on diverse constraint combinations, enabling zero-shot generalization to novel constraint compositions. This approach naturally handles constraint conflicts through Pareto optimization and provides interpretable control over the trade-offs between competing objectives, offering a principled framework for controllable generation in complex, multi-modal scenarios.
    1: 'Generative models excel at producing high-fidelity samples but struggle to satisfy complex compositional constraints at inference time without retraining or brittle guidance mechanisms. We introduce Constraint-Programmable Generation, a framework that treats symbolic constraints as first-class objects that algebraically modulate the generative process. Our approach learns a constraint compiler that translates high-level specifications—expressed in a simple constraint language supporting composition, negation, and quantification—into smooth modifications of the underlying score function or velocity field. Unlike classifier guidance, which requires differentiable constraint evaluators, our compiler learns to approximate constraint satisfaction through a meta-learning objective over diverse constraint families. The framework enables previously intractable generation tasks: producing images satisfying Boolean combinations of spatial relationships, generating molecules meeting multiple property bounds simultaneously, or synthesizing text adhering to structural templates. Crucially, constraints can be specified, combined, and modified at inference time without model updates, enabling interactive and iterative creative workflows. Constraint-Programmable Generation bridges the gap between neural generative modeling and symbolic reasoning, offering a path toward generative systems that are not merely powerful samplers but programmable creative tools.'
