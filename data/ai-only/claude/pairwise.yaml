    0: Reinforcement Learning from Human Feedback has become the dominant paradigm for aligning language models with human values, yet it implicitly assumes a monolithic notion of human preferences. In practice, feedback data reflects the values of annotator populations that are neither representative nor homogeneous, causing aligned models to encode majority-group preferences while marginalizing minority perspectives. We introduce Pluralistic Alignment, a framework that explicitly models preference heterogeneity across demographic groups during the alignment process. Our approach learns group-conditioned reward models that capture distinct value systems, then optimizes for a Pareto-fair policy that prevents disproportionate sacrifice of any group's preferences. A constrained optimization objective balances preference satisfaction across groups while maintaining safety guardrails as inviolable constraints rather than tradeable objectives. To address privacy concerns inherent in demographic-aware learning, we incorporate differential privacy guarantees into the reward modeling phase, preventing membership inference while preserving group-level preference signals. Pluralistic Alignment provides a principled foundation for building AI systems that respect value pluralism, offering a path toward models that are simultaneously aligned, fair, and privacy-preserving.
    1: Contemporary approaches to AI safety treat alignment, fairness, and privacy as separate optimization objectives, leading to compounding performance penalties and conflicting constraints during deployment. We introduce Normative Coherence Learning, a meta-learning framework that discovers and exploits underlying compatibility structures between different ethical objectives. Our key insight is that many misalignment and fairness failures share common representational pathologies—overgeneralization to spurious features, insufficient context sensitivity, and brittle category boundaries. Rather than applying independent corrections for each objective, we learn a unified intervention strategy that identifies these shared failure modes and addresses them through coordinated representation editing. The framework employs multi-objective meta-learning to discover normative synergies, where progress on one objective (e.g., reducing demographic bias) naturally facilitates others (e.g., improving truthfulness). This enables models to satisfy multiple ethical constraints simultaneously while minimizing capability loss. Our approach provides a path toward coherent normativity in foundation models, where safety, fairness, and alignment emerge as mutually reinforcing properties rather than competing demands.
