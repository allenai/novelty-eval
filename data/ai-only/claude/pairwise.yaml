    0: Controlling specific attributes in generative models while preserving other features remains challenging, typically requiring labeled data or attribute-specific training. We introduce Geodesic Attribute Transport, a framework that discovers semantic editing directions in an unsupervised manner by analyzing the intrinsic geometry of learned latent manifolds. Our key insight is that semantically meaningful variations naturally align with principal geodesic directions characterized by consistent curvature signatures. We develop a curvature decomposition method that identifies these directions without supervision, revealing an interpretable basis for the latent space. To enable consistent edits across diverse samples, we employ parallel transport along geodesics, ensuring that attribute modifications discovered at one point generalize coherently throughout the manifold. This geometric perspective unifies previously disparate notions of disentanglement and controllability under a single Riemannian framework. Our approach operates as a post-hoc analysis tool applicable to any pre-trained generative model with a continuous latent space, requiring no retraining or architectural modifications. Geodesic Attribute Transport provides both theoretical grounding for understanding how generative models organize semantic information and practical tools for fine-grained, unsupervised control over generated content.
    1: 'Diffusion models excel at generating high-quality images but struggle with compositional reasoning and fine-grained attribute control. We introduce Compositional Latent Diffusion, a framework that bridges structured scene representations with diffusion-based generation. Our approach learns a disentangled latent space where scene components—objects, spatial relationships, and attributes—are explicitly encoded as separate latent variables with learned compositional operators. During generation, we perform diffusion in this structured latent space, allowing independent manipulation of scene elements while maintaining their relational constraints through neural compositional functions. A key innovation is our relational attention mechanism that enforces consistency between composed elements during the denoising process. This structured diffusion process enables unprecedented control: users can specify complex scenes through compositional specifications, modify individual objects without affecting others, and perform logical operations on scene components. By separating what to generate from how elements interact, our framework addresses fundamental limitations in controllable generation while preserving the sample quality and diversity that make diffusion models successful.'
