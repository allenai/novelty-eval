  ideas:
    0: 'Large language models exhibit impressive natural language understanding but remain unreliable on tasks demanding rigorous logical reasoning and hard constraint satisfaction. We introduce Neural Solver Grounding, a framework that enables foundation models to generate structured intermediate representations natively compatible with symbolic reasoning engines. Unlike prior neuro-symbolic approaches that treat solvers as external black-box tools, our method trains models to emit solver-compatible thought traces—hybrid representations that are simultaneously differentiable for end-to-end learning and directly parseable by constraint solvers, SAT solvers, and theorem provers. During inference, these traces establish a bidirectional channel: the language model handles problem formulation and natural language grounding while symbolic engines perform guaranteed-correct reasoning steps, with solver outputs dynamically conditioning subsequent generation. A key technical contribution is a relaxation scheme that maintains gradient flow through discrete solver interfaces during training. Neural Solver Grounding combines the flexibility and world knowledge of foundation models with the precision and verifiability of formal methods, offering a principled path toward language models capable of trustworthy reasoning in high-stakes domains requiring logical guarantees.'
    1: Foundation models exhibit remarkable capabilities but remain static after pretraining, unable to efficiently incorporate emerging knowledge without expensive retraining or catastrophic forgetting. We introduce Temporal Knowledge Anchoring (TKA), a framework that enables continual knowledge integration in large language models through geometrically-constrained adapter composition. TKA maintains a library of lightweight, temporally-indexed adapter modules, each encoding knowledge from specific time periods or domains. During inference, relevant adapters are dynamically selected and composed using a learned routing mechanism that balances new information integration with preservation of foundational capabilities. The key innovation lies in our geometric anchoring loss, which constrains adapter parameters to lie within specific regions of weight space that provably bound interference with pre-existing knowledge. This allows models to accumulate knowledge over time while maintaining backward compatibility. Unlike retrieval-augmented approaches, TKA internalizes knowledge updates directly into model parameters, enabling efficient inference without external databases. The framework supports both supervised updates from curated sources and self-supervised learning from streaming data, offering a path toward truly evolving foundation models.
