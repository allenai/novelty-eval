  ideas:
    0: 'We introduce Neural Preconditioned Optimization, a framework that learns adaptive preconditioners for iterative optimization algorithms while preserving convergence guarantees. Classical preconditioning techniques for gradient descent and quasi-Newton methods require extensive domain knowledge and manual parameter tuning, limiting their applicability across problem families. Purely data-driven learned optimizers, conversely, sacrifice theoretical guarantees for empirical performance. Our approach bridges this gap by parameterizing preconditioners as neural networks constrained to output provably valid transformations—such as positive definite matrices through Cholesky-like decompositions or spectral parameterizations. We train these networks on distributions of related optimization problems, enabling them to extract shared structural patterns that accelerate convergence. The framework naturally integrates with existing convergence theory: we prove that learned preconditioners satisfying mild spectral conditions maintain standard convergence rates while empirically achieving superior constant factors. By combining the flexibility of deep learning with rigorous optimization theory, our method produces adaptive, problem-aware preconditioners that generalize across instances while retaining formal guarantees, opening new avenues for reliable learned optimization components.'
    1: Adaptive optimizers estimate curvature information indirectly through gradient statistics, often resulting in delayed or noisy adaptation to complex loss landscape geometry. We introduce Geometric Landscape Probing (GLP), an optimization framework that explicitly characterizes local loss surface structure to guide parameter updates. GLP maintains a lightweight geometric sketch that captures directional curvature, local convexity, and valley orientation through efficient finite-difference probes computed along random subspaces. This geometric signature is compressed into a low-dimensional descriptor that modulates both the direction and magnitude of gradient steps without computing or storing full Hessian matrices. A key component is a learned projection network that identifies the most informative probing directions based on recent optimization history, focusing computational budget on geometrically relevant subspaces. The framework naturally interpolates between steepest descent in ill-conditioned regions and Newton-like steps near well-behaved minima. GLP's geometric descriptors exhibit transferability across training phases, suggesting that local landscape structure follows learnable patterns. Our approach bridges the gap between computationally prohibitive second-order methods and heuristic adaptive gradient techniques, offering principled curvature-aware optimization with minimal overhead.
