    0: Large language models generate reasoning traces autoregressively, committing to each step before considering its downstream implications. This forward-only generation leads to error accumulation, logical inconsistencies, and brittle reasoning chains. We introduce Reasoning Diffusion, a framework that recasts multi-step reasoning as an iterative refinement process over structured thought representations. Rather than producing reasoning in a single left-to-right pass, our approach initializes a coarse reasoning skeleton and progressively refines it through bidirectional dependency-aware updates. A learned critic module identifies logical tensions and incomplete justifications within the current reasoning state, while a refinement module propagates corrections both forward and backward along the reasoning chain. This enables the model to revise earlier steps in light of later conclusions, achieving global coherence that autoregressive generation cannot guarantee. We introduce a self-consistency training objective that teaches models to detect and repair reasoning flaws using synthetically corrupted traces. The framework operates as a post-hoc wrapper around frozen language models, requiring no modification to base model weights. Reasoning Diffusion provides a new paradigm for eliciting reliable, self-consistent reasoning from foundation models.
    1: Foundation models demonstrate impressive capabilities yet lack interpretable, compositional reasoning structures. We propose Modular Reasoning Primitives (MRP), a framework for training large language models to develop explicit, reusable reasoning components that can be flexibly composed across diverse cognitive tasks. Rather than learning monolithic task-specific behaviors, MRP introduces architectural constraints and specialized pre-training objectives that encourage the emergence of atomic reasoning operations—such as deductive inference, analogical mapping, and causal attribution—as discrete, steerable modules within the model's computation graph. Our approach combines contrastive learning over reasoning traces, intervention-based training that isolates individual reasoning steps, and a routing mechanism that dynamically selects and chains appropriate primitives for each query. This modular structure enables systematic generalization to novel reasoning compositions, provides interpretable intermediate states for analysis and debugging, and allows targeted improvement of specific reasoning capabilities without full model retraining. MRP represents a step toward foundation models with human-aligned cognitive architectures.
