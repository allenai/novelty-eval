    0: Current generative models produce outputs through fixed forward passes, lacking the iterative self-critique that characterizes human creative processes. We introduce Generative Self-Dialogue, a framework that internalizes revision dynamics within a single generative model. Our approach augments standard generative architectures with a learned critic pathway that operates in latent space, identifying deficiencies in intermediate representations and proposing targeted corrections before final decoding. Unlike external feedback mechanisms, the critic is co-trained with the generator through a novel adversarial-cooperative objective that encourages the proposal pathway to produce revisable drafts while training the critic to suggest improvements that maximize output quality. A gating mechanism learns to dynamically balance initial proposals with refinements, allowing the model to adapt its revision depth based on generation difficulty. The framework introduces recurrent refinement steps that share parameters, enabling iterative improvement without proportional parameter growth. Generative Self-Dialogue provides a unified approach to building generative models that reason about and improve their own outputs, bridging the gap between feed-forward generation and deliberative creative processes across modalities including text, images, and structured data.
    1: Current generative models produce outputs through predetermined sampling trajectories, whether via autoregressive decoding or fixed denoising schedules. We introduce Reflective Generation, a framework that endows generative models with metacognitive capabilities to dynamically adapt their generation process. Our approach augments diffusion-based generators with a learned self-evaluation module that assesses intermediate states and a strategic replanning mechanism that modifies future generation steps accordingly. Rather than following a static denoising path, the model learns to identify regions requiring additional refinement, allocate computational budget adaptively, and even backtrack when generated content diverges from desired attributes. This self-reflective capability emerges through a bi-level optimization scheme where an inner loop performs conditional generation and an outer loop trains the evaluation and replanning policies using feedback from a discriminative quality estimator. The framework naturally enables controllable generation through targeted intervention, supports compositional scene construction by iteratively placing and refining elements, and provides interpretable generation trajectories. Reflective Generation represents a paradigm shift toward more deliberate, human-like creative processes in neural synthesis.
