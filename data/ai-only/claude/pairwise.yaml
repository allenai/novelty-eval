    0: Modern deep learning models achieve remarkable performance but remain largely opaque, with explanations often generated post-hoc and potentially unfaithful to actual model computations. We introduce Concept Router Networks, a framework that structurally enforces interpretability by explicitly separating concept discovery from decision-making. Our approach automatically learns a sparse set of semantic concept slots through self-supervised disentanglement objectives, then routes all classification decisions exclusively through these discovered concepts via differentiable attention mechanisms. Unlike concept bottleneck models requiring extensive human annotation, our method discovers task-relevant concepts in an unsupervised manner while maintaining architectural constraints that guarantee decision traceability. The routing mechanism creates an explicit computational graph linking inputs to predictions through interpretable concept activations, enabling users to audit which concepts influence each decision and intervene on concept representations at inference time. By treating interpretability as an architectural prior rather than a post-processing step, Concept Router Networks provide inherent transparency without sacrificing the representational capacity needed for complex tasks, offering a principled path toward trustworthy AI systems in high-stakes domains.
    1: Existing interpretability methods predominantly offer static explanations of neural network behavior, analyzing individual components or producing fixed attribution maps that fail to capture how information transforms during inference. We introduce Concept Flow Tracing, a dynamic interpretability framework that tracks the emergence, transformation, and interaction of semantic concepts as they propagate through network layers. Our approach employs lightweight concept probes anchored to a shared semantic space, enabling continuous monitoring of how abstract representations crystallize from distributed encodings into decision-relevant features. Unlike circuit-based analyses that require extensive manual investigation, Concept Flow Tracing automatically identifies critical computational phases where concept representations undergo significant transformation—moments we term 'semantic phase transitions.' The framework reveals that models often maintain competing conceptual hypotheses through intermediate layers before converging, providing new insights into neural reasoning processes. We further introduce flow perturbation analysis, which intervenes on concept trajectories mid-computation to assess causal relationships between intermediate representations and outputs. Concept Flow Tracing offers a temporal lens on model computation, complementing existing structural interpretability approaches with a process-oriented perspective on how neural networks arrive at their conclusions.
