  ideas:
    0: Message passing neural networks struggle with over-smoothing, over-squashing, and capturing long-range dependencies, stemming from their local aggregation paradigm that ignores the geometry of feature spaces. We introduce Bundle Neural Networks, a framework that models graph-structured data as sections of fiber bundles, where each node carries a fiber—a geometric feature space equipped with a connection specifying how features transform along edges. Our architecture performs message passing through parallel transport operators that move features between fibers in a geometry-preserving manner, enabling principled aggregation along paths rather than just immediate neighborhoods. The bundle structure naturally accommodates heterogeneous node and edge types through varying fiber geometries, while learnable connections adapt to capture task-relevant geometric relationships. We derive equivariant layers that respect both graph automorphisms and fiber symmetries, providing strong inductive biases for structured prediction. Path-based aggregation with curvature-aware attention mechanisms allows information to flow across distant nodes without the distortion typical of deep message passing. Bundle Neural Networks provide a unifying geometric perspective that subsumes spectral methods, sheaf neural networks, and gauge-equivariant approaches as special cases, while enabling new architectural designs grounded in differential geometry.
    1: Graph neural networks excel at learning from structured data but assume deterministic, known graph topologies. However, many real-world systems exhibit topological uncertainty—molecular resonance structures, probabilistic protein interactions, noisy social networks, and brain connectivity maps all involve edges whose existence or strength is ambiguous. We introduce Variational Graph Topology Learning (VGTL), a framework that jointly learns neural representations and infers task-relevant graph structure from distributions over possible topologies. Rather than operating on a single fixed graph, VGTL maintains a latent distribution over edge configurations and performs message passing through expectation over this distribution. A variational inference objective balances topology reconstruction with downstream task performance, allowing the model to discover which structural patterns matter for prediction while marginalizing over irrelevant topological noise. The framework naturally handles multi-relational uncertainty, temporal edge dynamics, and confidence-weighted connectivity. By treating topology as a latent variable rather than a fixed input, VGTL bridges discrete graph learning with continuous geometric reasoning, enabling robust predictions when graph structure is incomplete, noisy, or inherently stochastic.
