    0: Second-order optimization methods offer superior convergence properties but remain impractical for large-scale deep learning due to prohibitive computational costs. We introduce Trajectory Curvature Descent, a novel optimization framework that extracts implicit curvature information from the geometric structure of gradient trajectories without explicit Hessian computation. Our key insight is that the sequence of gradients encountered during optimization defines a curve on a Riemannian manifold whose local curvature directly reflects the loss landscape geometry. By maintaining a compact representation of recent gradient directions and analyzing their angular relationships, we derive a lightweight curvature tensor that preconditions parameter updates. This enables adaptive step sizes along different eigendirections of the loss surface using only gradient oracle access. We further introduce a parallel transport mechanism that ensures consistent curvature estimates across optimization steps, preventing the oscillatory behavior common in momentum-based methods. The resulting algorithm interpolates smoothly between steepest descent in flat regions and Newton-like updates near high-curvature areas, achieving quasi-second-order convergence rates while preserving the memory efficiency of first-order methods.
    1: Modern deep learning optimizers rely on element-wise adaptive learning rates that ignore the geometric structure of neural network loss landscapes. While second-order methods exploit curvature information for faster convergence, their computational cost remains prohibitive for large-scale models. We introduce Trajectory-Aware Low-Rank Preconditioning (TALP), a novel optimization framework that dynamically learns compressed representations of local loss geometry from gradient history alone. TALP constructs lightweight preconditioners through incremental low-rank factorization of accumulated gradient outer products, capturing dominant curvature directions without explicit Hessian computation. The method maintains a running subspace representation that evolves along the optimization trajectory, enabling geometry-aware parameter updates at first-order computational cost. By interpolating between coordinate-wise adaptation and full second-order information through rank-constrained projections, TALP preserves the scalability of adaptive methods while incorporating crucial structural information about the loss landscape. The framework naturally extends to distributed settings through communication-efficient subspace synchronization, offering a principled approach to geometry-aware optimization that bridges classical preconditioning theory with modern deep learning practice.
