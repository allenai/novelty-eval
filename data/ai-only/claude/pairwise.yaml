  ideas:
    0: 'Hierarchical reinforcement learning discovers temporal abstractions that accelerate learning, yet existing methods identify skills through statistical patterns rather than underlying causal structure. We propose Causal Temporal Abstraction Learning (CTAL), a framework that unifies causal discovery with hierarchical policy learning. CTAL learns temporally extended actions corresponding to causal mechanisms in the environment''s transition dynamics, enabling agents to reason about interventions rather than mere correlations. Through a joint optimization objective, our approach simultaneously infers a causal graph over environment variables and discovers skills aligned with causal edges, creating a hierarchy grounded in manipulable relationships. This causal grounding provides three key advantages: skills transfer more effectively across tasks sharing causal structure, credit assignment traces through interpretable causal chains, and exploration targets informative interventions. By representing policies as compositions of causal mechanisms, CTAL produces hierarchical agents that generalize beyond superficial environmental variations to leverage deep structural invariances, opening new pathways for sample-efficient learning in complex domains.'
    1: Credit assignment over long horizons remains a fundamental challenge in reinforcement learning, as agents must connect distant actions to eventual outcomes through complex causal chains. We introduce Linguistic Thought Simulation (LTS), a framework that augments model-based reinforcement learning with abstract causal reasoning expressed in natural language. LTS employs a language model to generate counterfactual reasoning traces that hypothesize causal relationships between actions, intermediate states, and rewards at a semantic level of abstraction. These linguistic simulations capture relational structure that complements the pixel-level predictions of traditional world models. A dual-consistency objective trains the policy to align with both grounded trajectory data and the abstract causal attributions from linguistic reasoning, enabling credit to propagate through semantically meaningful pathways rather than purely temporal ones. To ground abstract reasoning in embodied experience, we introduce a bidirectional translation mechanism that maps between state observations and language descriptions. LTS provides a principled approach to injecting structured inductive biases about causality and goal decomposition into reinforcement learning, addressing the abstraction gap between human-like reasoning and low-level policy optimization.
