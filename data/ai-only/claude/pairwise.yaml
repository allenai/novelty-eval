    0: Amortized variational inference enables efficient posterior approximation across multiple observations, but traditional encoder-based approaches struggle with multimodal posteriors and often produce poorly calibrated uncertainties. We introduce Diffusion Variational Inference (DVI), a framework that replaces standard amortized encoders with conditional score-based diffusion models operating in latent space. Rather than directly mapping observations to approximate posteriors, DVI learns to iteratively denoise samples from a simple prior into complex, observation-conditioned posterior distributions. This iterative refinement process naturally captures multimodal structure and provides a hierarchy of increasingly refined uncertainty estimates. We derive a unified objective that combines the evidence lower bound with denoising score matching, enabling end-to-end training of both the generative model and the diffusion-based inference network. The resulting framework bridges modern diffusion-based generative modeling with principled Bayesian inference, offering improved posterior approximation quality while maintaining the computational efficiency of amortized methods. DVI provides a flexible substrate for uncertainty-aware representation learning and opens new avenues for scaling Bayesian deep learning to complex, high-dimensional domains.
    1: 'Variational inference and Markov chain Monte Carlo represent two ends of a fundamental tradeoff in probabilistic inference: speed versus asymptotic exactness. We introduce Diffusion-Corrected Variational Inference (DCVI), a framework that unifies these paradigms by casting posterior refinement as a learned diffusion process. DCVI first obtains a variational approximation, then treats the discrepancy between this approximation and the true posterior as a learnable score field that guides iterative correction steps. The forward process is defined by the variational family''s structure, while the reverse denoising process progressively removes approximation bias through gradient-based corrections. This formulation yields an anytime inference algorithm: with zero refinement steps, DCVI recovers standard variational inference; with sufficient steps, samples converge to the true posterior. We derive a unified training objective that jointly optimizes the variational parameters and correction network, ensuring that computational investment monotonically improves posterior fidelity. DCVI naturally provides calibrated uncertainty quantification, as the refinement trajectory explicitly models the gap between approximate and exact inference. Our framework applies to both continuous and discrete latent variable models while maintaining compatibility with amortized inference networks.'
