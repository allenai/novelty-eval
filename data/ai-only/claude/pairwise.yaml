    0: We introduce NeuroSync, a trimodal contrastive learning framework that jointly models electroencephalography (EEG) signals, visual stimuli, and auditory inputs to capture human cognitive responses in naturalistic settings. While existing multimodal systems excel at vision-language tasks, they ignore the rich biosignal modality that directly reflects human attention, emotional valence, and intent. NeuroSync employs separate encoders for each modality and learns a shared embedding space where synchronized EEG-visual-audio triplets are pulled together while misaligned combinations are pushed apart. We design temporal alignment mechanisms to handle the variable latency between external stimuli and neural responses, and introduce a cognitive state disentanglement module that separates task-relevant neural patterns from individual variability. The learned representations enable downstream applications including zero-shot intent recognition, attention-based content retrieval, and cognitive load estimation. By bridging external multimodal content with internal neural representations, NeuroSync opens new possibilities for brain-computer interfaces, accessibility technologies, and adaptive systems that respond to users' cognitive states rather than explicit commands alone.
    1: Multimodal learning typically projects diverse modalities into a shared embedding space, sacrificing the unique structural properties that make each modality expressive. We propose Structural Grammar Networks (SGN), a framework that learns modality-specific compositional grammars capturing the generative rules underlying images, audio, and text. Rather than collapsing modalities into a common representation, SGN maintains distinct grammar spaces connected through learned structural correspondences. Each modality encoder extracts a hierarchical parse representing compositional structure—spatial arrangements for vision, temporal progressions for audio, and syntactic trees for language. Cross-modal translation occurs through grammar-to-grammar mappings that preserve structural relationships while respecting modality-specific constraints. A novel grammar induction module discovers latent production rules from unannotated data, enabling the system to capture domain-specific compositional patterns without manual annotation. The framework supports bidirectional translation between any modality pair through composition of pairwise grammar correspondences. SGN enables structure-preserving cross-modal generation, compositional reasoning about multimodal scenes, and few-shot adaptation to new domains by transferring grammatical knowledge across modalities.
