    0: Current approaches to AI alignment rely heavily on centralized collection of human preference data through reinforcement learning from human feedback, creating significant privacy vulnerabilities and risks of preference manipulation. We introduce Federated Value Alignment, a framework that aligns large language models to diverse human values while preserving individual privacy through decentralized preference learning. Our approach combines local preference elicitation with secure aggregation protocols, enabling models to learn from distributed human feedback without exposing individual value judgments or sensitive contextual information. We address the fundamental tension between personalization and privacy by developing noise-calibrated alignment objectives that satisfy differential privacy guarantees while maintaining coherent value learning across heterogeneous populations. The framework incorporates fairness constraints to prevent alignment collapse toward majority preferences and includes auditing mechanisms for detecting potential manipulation or bias amplification. By decoupling preference learning from data centralization, our work establishes a new paradigm for building aligned AI systems that respect individual autonomy, protect privacy, and maintain safety properties across diverse communities with competing values and varying privacy requirements.
    1: 'Deploying AI systems in high-stakes domains requires simultaneously satisfying multiple societal objectives including alignment, fairness, safety, and privacy. However, these objectives frequently conflict: enforcing safety constraints may disproportionately burden certain demographic groups, while achieving fairness often necessitates access to sensitive attributes that compromise privacy. Existing approaches address these concerns in isolation or through naive multi-objective optimization, failing to capture their complex interdependencies. We introduce Value Tension Networks, a framework that explicitly models the constraint graph among societal objectives and learns to navigate trade-offs through stakeholder-informed preference aggregation. Our approach combines differentiable constraint relaxation with a deliberation mechanism inspired by social choice theory, enabling systems to identify Pareto-optimal configurations across the value space while maintaining transparency about unavoidable compromises. A key innovation is the tension audit module, which provides interpretable explanations of which values are in conflict for any given decision and why specific trade-offs were made. Value Tension Networks offer a principled foundation for building AI systems that respect the plurality of human values while acknowledging that perfect alignment across all societal objectives is often impossible.'
